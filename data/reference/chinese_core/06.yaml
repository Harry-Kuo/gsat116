# 核心古文 06｜白話翻譯與重點
title: 桃花源記
by: 陶淵明
era: 東晉
intro: 陶淵明〈桃花源詩并記〉的記文部分。東晉太元年間，武陵漁人偶然進入與世隔絕的桃花源，村民說祖先為了躲避秦末戰亂來到這裡，不知道外面已經換了好幾個朝代；漁人離開後，再也找不到入口。作者藉此寄託對和平、純樸社會的嚮往。
author: 陶淵明，名潛，東晉詩人，曾任彭澤縣令，因「不為五斗米折腰」辭官歸隱，被稱為「田園詩人之祖」「古今隱逸詩人之宗」。
focus:
  - 虛實交錯：開頭寫明時間（太元中）、地點（武陵）、人物（捕魚人），結尾又有太守派人尋找、真實人物劉子驥，讓虛構的桃花源顯得像真的一樣。
  - 桃花源的特色：與世隔絕、土地平坦肥沃、人人安居樂業、民風純樸好客、沒有朝代更替與賦稅戰亂。
  - 古今異義常考：交通（交錯相通）、妻子（妻子和兒女）、無論（更不用說）、絕境（與世隔絕的地方）。
trans:
  - 東晉太元年間，有個武陵人以捕魚為職業。他沿著溪流划船前進，忘記走了多遠。忽然遇到一片桃花林，夾著兩岸綿延數百步，中間沒有其他樹木，芳香的草鮮嫩美麗，落花紛紛飄落。漁人覺得很驚奇，又往前划，想走到桃林的盡頭。桃林在溪水的源頭處結束，接著就看見一座山，山上有個小洞口，隱隱約約好像有光亮。漁人就離開船，從洞口走進去。
  - 剛開始洞口非常狹窄，只能讓一個人通過。又走了幾十步，忽然變得開闊明亮。這裡土地平坦寬廣，房屋排列整齊，有肥沃的田地、美麗的池塘，以及桑樹、竹子之類的植物。田間小路四通八達，雞鳴狗叫的聲音處處可以聽到。人們在其中來來往往耕種勞作，男女的穿著，完全和桃花源外的人一樣；老人和小孩，都快樂自在。村民看見漁人，非常驚訝，問他從哪裡來，漁人詳細地回答了他們。村民就邀請漁人到家裡，擺酒、殺雞、做飯款待他。村裡的人聽說來了這麼一個人，都來打聽消息。他們說：「我們的祖先為了躲避秦朝時的戰亂，帶著妻子兒女和同鄉來到這個與世隔絕的地方，從此不再出去，於是就和外面的人斷絕了往來。」他們問現在是什麼朝代，竟然不知道有漢朝，更不用說魏朝和晉朝了。漁人把自己知道的事情一一詳細地告訴他們，大家聽了都感嘆惋惜。其他的人也各自邀請漁人到自己家中，都拿出酒和飯菜招待他。漁人住了幾天，告辭離開。這裡的人叮囑他說：「這裡的事不值得對外面的人說啊。」
  - 漁人出來以後，找到他的船，就沿著先前的路回去，一路上處處做記號。到了武陵郡城，拜見太守，報告了這些經歷。太守立刻派人跟著他前往，尋找先前做的記號，結果迷失了方向，再也找不到原來的路。南陽的劉子驥，是一位志趣高潔的人，聽說這件事，高興地計畫前往，還沒實現，不久就病死了。此後就再也沒有人去探訪桃花源了。
words:
  - 緣溪行：緣，沿著。
  - 落英繽紛：落英，落花；繽紛，繁多雜亂的樣子。
  - 欲窮其林：窮，走到盡頭（形容詞當動詞用）。
  - 纔通人：纔，僅僅。
  - 豁然開朗：忽然變得開闊明亮。
  - 屋舍儼然：儼然，整齊的樣子。
  - 阡陌交通：阡陌，田間小路；交通，交錯相通（古今異義）。
  - 黃髮垂髫：老人和小孩。
  - 便要還家：要（ㄧㄠ），通「邀」，邀請。
  - 咸來問訊：咸，都。
  - 率妻子邑人：妻子，妻子和兒女（古今異義）；邑人，同鄉。
  - 來此絕境：絕境，與世隔絕的地方（古今異義）。
  - 無論魏、晉：無論，更不用說（古今異義）。
  - 皆歎惋：歎惋，感嘆惋惜。
  - 延至其家：延，邀請。
  - 便扶向路：扶，沿著；向，從前的、先前的。
  - 處處誌之：誌，做記號。
  - 詣太守：詣，拜見。
  - 欣然規往：規，計畫。
  - 尋病終：尋，不久。
  - 後遂無問津者：問津，詢問渡口，指探訪。
quotes:
  - 芳草鮮美，落英繽紛。
  - 復行數十步，豁然開朗。
  - 阡陌交通，雞犬相聞。
  - 問今是何世，乃不知有漢，無論魏、晉。
  - 不足為外人道也。
idioms:
  - 世外桃源：比喻與世隔絕、安樂美好的地方
  - 豁然開朗：復行數十步，豁然開朗
  - 落英繽紛：芳草鮮美，落英繽紛
  - 無人問津：後遂無問津者
