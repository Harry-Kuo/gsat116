# 核心古文 05｜白話翻譯與重點
title: 出師表
by: 諸葛亮
era: 三國
intro: 蜀漢後主建興五年（西元 227 年），諸葛亮準備率軍北伐曹魏，出發前上表給後主劉禪。文中勸後主廣開言路、賞罰公平、親近賢臣，並自述受先帝劉備三顧之恩與臨終託付，表明北伐、興復漢室的決心。「表」是臣子向君主陳述意見的文體。
author: 諸葛亮，字孔明，三國蜀漢丞相，輔佐劉備、劉禪，封武鄉侯，死後諡「忠武」。
focus:
  - 前半段是勸諫：開張聖聽、賞罰公平（宮中府中俱為一體）、親賢臣遠小人，並具體推薦郭攸之、費禕、董允、向寵。
  - 後半段是自述：布衣躬耕 → 三顧茅廬 → 受任於敗軍之際 → 臨崩託孤 → 五月渡瀘 → 北定中原，情感真摯。
  - 古今異義常考：卑鄙（身分低微、見識淺陋）、感激（感動奮發）、開張（擴大）、痛恨（痛心遺憾）、秋（時候）。
trans:
  - 臣諸葛亮上言：先帝（劉備）開創事業還不到一半，就中途去世了。現在天下分成魏、蜀、吳三國，益州（蜀漢）人力疲憊、物資困乏，這實在是國家危急存亡的關鍵時刻啊。然而朝中侍衛的臣子在宮內毫不懈怠，忠心的將士在外奮不顧身，這是因為他們追念先帝對他們的特殊待遇，想要報答在陛下身上。陛下實在應該廣泛聽取意見，來發揚先帝留下的美德，振奮志士的精神；不應該隨便看輕自己，說話不恰當、不合道理，以致堵塞了忠心勸諫的道路。
  - 皇宮中的近臣和丞相府中的官員，都是一個整體，升賞、懲罰、表揚、批評，不應該有不同的標準。如果有做壞事、觸犯法令，或是盡忠行善的人，應該交給主管的官員判定他們應得的刑罰或獎賞，來彰顯陛下公正嚴明的治理，不應該偏袒徇私，使宮內和府中的法令不一致。
  - 侍中郭攸之、費禕，侍郎董允等人，都是善良誠實、心志忠貞純正的人，所以先帝選拔他們留給陛下。我認為宮中的事情，不論大小，都先詢問他們，然後再施行，一定能彌補缺失和疏漏，得到更多的益處。將軍向寵，性情和善、品行端正，通曉軍事，過去試用他的時候，先帝稱讚他「有能力」，所以大家商議推舉向寵擔任中部督。我認為軍中的事情，都先詢問他，一定能使部隊團結和睦，才能高低不同的人各得其所。親近賢臣，疏遠小人，這是西漢興盛的原因；親近小人，疏遠賢臣，這是東漢衰敗的原因。先帝在世的時候，每次和我談論這些事，沒有一次不對桓帝、靈帝的作為感到嘆息痛心。侍中、尚書、長史、參軍，都是堅貞正直、能以死報國的臣子，希望陛下親近他們、信任他們，那麼漢室的興盛，很快就可以實現了。
  - 我本來是個平民，在南陽親自耕田，只求在亂世中苟且保全性命，不想在諸侯之間求取名聲顯達。先帝不嫌我身分卑微、見識淺陋，委屈自己降低身分，三次到草廬來拜訪我，向我詢問當時天下的大事。我因此感動奮發，就答應為先帝奔走效力。後來遇到兵敗，在軍隊潰敗時接受任務，在危難之中奉命出使，從那時到現在已經二十一年了。先帝知道我做事謹慎，所以臨終前把國家大事託付給我。接受遺命以來，我日夜憂慮嘆息，擔心託付的事沒有成效，損害了先帝知人之明。所以在五月渡過瀘水，深入不毛之地（平定南方）。現在南方已經平定，兵器盔甲也已充足，應當激勵、率領全軍，北上平定中原。希望能竭盡我平庸的才能，剷除奸惡凶暴的敵人，復興漢室，遷回舊都；這是我用來報答先帝、效忠陛下的職責本分。至於權衡利弊得失、毫無保留地進獻忠言，那就是郭攸之、費禕、董允的責任了。希望陛下把討伐賊寇、復興漢室的任務交給我；如果沒有成效，就懲治我的罪，來告慰先帝在天之靈。如果沒有發揚聖德的建言，就責備郭攸之、費禕、董允等人的怠慢，來揭示他們的過失。陛下也應該自我督促，向臣下詢問治國的好方法，明察並採納正確的意見，深切追念先帝的遺詔。我承受先帝的恩德，感激不盡。現在即將遠行，面對這份表章，禁不住流下眼淚，不知道自己說了些什麼。
words:
  - 中道崩殂：崩殂，帝王去世。
  - 益州疲弊：疲弊，人力疲憊、物資困乏。
  - 危急存亡之秋：秋，時候（古今異義）。
  - 追先帝之殊遇：殊遇，特殊的待遇。
  - 開張聖聽：開張，擴大（古今異義）；聖聽，君主的聽聞。
  - 恢宏志士之氣：恢宏，發揚、擴大。
  - 妄自菲薄：隨便看輕自己。
  - 引喻失義：說話不恰當、不合道理。
  - 陟罰臧否：陟，升遷；臧，善，稱讚；否（ㄆㄧˇ），惡，批評。
  - 作姦犯科：做壞事、觸犯法令。
  - 宜付有司：有司，主管的官員。
  - 簡拔以遺陛下：簡拔，選拔；遺（ㄨㄟˋ），留給。
  - 裨補闕漏：彌補缺失和疏漏。
  - 性行淑均：性情善良，品行端正。
  - 優劣得所：才能高低不同的人都各得其所。
  - 痛恨於桓、靈也：痛恨，痛心遺憾（古今異義）。
  - 臣本布衣：布衣，平民。
  - 苟全性命於亂世：苟全，苟且保全。
  - 不以臣卑鄙：卑鄙，身分低微、見識淺陋（古今異義）。
  - 猥自枉屈：猥，降低身分；枉屈，委屈。
  - 由是感激：感激，感動奮發（古今異義）。
  - 許先帝以驅馳：驅馳，奔走效力。
  - 夙夜憂歎：夙夜，早晚，指日夜。
  - 深入不毛：不毛，不長草木的荒涼地方。
  - 庶竭駑鈍：庶，希望；駑鈍，比喻才能平庸（謙詞）。
  - 攘除姦凶：攘除，排除。
  - 斟酌損益：衡量得失利弊。
  - 以諮諏善道：諮諏，詢問。
  - 察納雅言：雅言，正確的意見。
quotes:
  - 此誠危急存亡之秋也。
  - 不宜妄自菲薄，引喻失義，以塞忠諫之路也。
  - 親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。
  - 苟全性命於亂世，不求聞達于諸侯。
  - 受任於敗軍之際，奉命於危難之間
  - 今當遠離，臨表涕泣，不知所云。
idioms:
  - 三顧茅廬：三顧臣於草廬之中
  - 妄自菲薄：不宜妄自菲薄
  - 作姦犯科：若有作姦犯科
  - 危急存亡之秋：此誠危急存亡之秋也
