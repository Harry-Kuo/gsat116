# 單字卡：近六屆（110–115）學測英文「詞彙題」的四個選項、「文意選填」的答案，以及「綜合測驗」詞彙類題目的選項。
# 答案字的意思與搭配沿用 english_words.yaml；這裡補上其他字。級別由 tools/wordlist.py 查大考中心《高中英文參考詞彙表》。
# 欄位：pos 考題中的詞性、mean 意思、use 常見搭配或例句、base 衍生字的原形（詞彙表沒收錄時，用原形查級別）。
# 意思與例句由 Claude 撰寫。

alias:  # 考題中的變化形 → 卡片上的原形
  understood: understand
  advanced: advance
  brought forth: bring forth
  called for: call for
  passed on: pass on
  tried out: try out

cards:
  # ── 答案字在其他題目當選項時的另一個詞性或意思（會和 english_words.yaml 的解釋合併）──
  credit: {pos: v., mean: 歸功於, use: credit the success to teamwork 把成功歸功於團隊合作}
  departed: {pos: v., mean: （depart 的過去式）出發、離開, use: The train departed on time. 火車準時出發。}
  atmosphere: {pos: n., mean: 大氣（層）, use: the earth's atmosphere 地球的大氣層}

  # ── 衍生字（詞彙表只收原形）──
  actively: {pos: adv., mean: 積極地、主動地, use: actively take part in the discussion 積極參與討論, base: active}
  alternatively: {pos: adv., mean: 或者、要不然（提出另一個選擇）, use: "Alternatively, you can take the train. 或者你也可以搭火車。", base: alternative}
  ambiguously: {pos: adv., mean: 含糊地、模稜兩可地, use: answer the question ambiguously 含糊地回答問題, base: ambiguous}
  apparently: {pos: adv., mean: 看來、似乎；顯然, use: "Apparently, he forgot the meeting. 看來他忘了開會。", base: apparent}
  consequently: {pos: adv., mean: 因此、結果, use: "He missed the bus; consequently, he was late. 他沒趕上公車，因此遲到了。", base: consequence}
  crisp: {pos: adj., mean: 酥脆的；（空氣）清新乾爽的, use: crisp autumn air 秋天乾爽的空氣（和 moist 濕潤的相反）}
  delicately: {pos: adv., mean: 細緻地、小心翼翼地, use: handle the vase delicately 小心地拿花瓶, base: delicate}
  dominantly: {pos: adv., mean: 佔優勢地、主要地, use: a dominantly male profession 以男性為主的職業, base: dominant}
  earnestly: {pos: adv., mean: 認真地、誠懇地, use: earnestly ask for help 誠懇地請求幫忙, base: earnest}
  eligibly: {pos: adv., mean: 合格地、符合資格地（少用；常見的是 eligible）, use: be eligible to vote 有投票資格, base: eligible}
  forceful: {pos: adj., mean: 強而有力的、強硬的, use: a forceful speech 強而有力的演說, base: force}
  fundamentally: {pos: adv., mean: 根本上、從根本上, use: fundamentally different 根本上不同, base: fundamental}
  genuinely: {pos: adv., mean: 真正地、真誠地, use: be genuinely happy for you 真心為你高興, base: genuine}
  harmonious: {pos: adj., mean: 和諧的、融洽的, use: a harmonious relationship 和諧的關係, base: harmony}
  legitimately: {pos: adv., mean: 合法地、正當地, use: be legitimately elected 經合法選出, base: legitimate}
  logically: {pos: adv., mean: 合乎邏輯地, use: think logically 有邏輯地思考, base: logical}
  naturally: {pos: adv., mean: 自然地；當然, use: "Naturally, she was upset. 她當然很難過。", base: natural}
  optionally: {pos: adv., mean: 可自由選擇地（少用；常見的是 optional）, use: optional courses 選修課程, base: optional}
  perceptual: {pos: adj., mean: 知覺的、感知的, use: perceptual skills 感知能力, base: perception}
  relevantly: {pos: adv., mean: 切題地、相關地（少用；常見的是 relevant）, use: be relevant to the topic 和主題有關, base: relevant}
