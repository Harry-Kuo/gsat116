# 文言虛詞：常考用法與例句。例句全部取自 15 篇核心古文（原文見 chinese_core_orig.yaml），[ ] 標出要看的字。
# tools/check_reference.py 會檢查每個例句是否真的出現在該篇原文。
intro: 虛詞是沒有實在意義、用來表示語法關係或語氣的字，包括介詞、連詞、助詞、語氣詞，以及部分代詞和副詞。學測幾乎每年都有一題「」內詞義比較（多半是多選），例句大多出自 15 篇核心古文。
tips:
  - 先看位置：字的前後是名詞還是動詞？在句首、句中還是句尾？位置決定詞性。
  - 代入常見意思：把幾個常見意思代進去，選最通順的一個。
  - 兩句都翻成白話再比較，不要只憑印象。
  - 小心通假字：而＝爾（你）、與＝舉、說＝悅、內＝納、共＝供、知＝智。
  - 核心古文的例句最常出現：熟讀原文，看到句子就能想起上下文。
words:
  - word: 之
    uses:
      - {use: 代詞：他、它、他們, ex: "使杞子、逢孫、楊孫戍[之]", src: 燭之武退秦師, note: 之＝鄭國}
      - {use: 助詞：的, ex: "古[之]學者必有師", src: 師說}
      - {use: 用在主語和謂語之間，不譯, ex: "師道[之]不傳也久矣", src: 師說}
      - {use: 賓語提前的標誌，不譯, ex: "句讀[之]不知，惑之不解", src: 師說, note: 就是「不知句讀」}
      - {use: 動詞：往、到, ex: "項伯乃夜馳[之]沛公軍", src: 鴻門宴}
      - {use: 音節助詞，不譯, ex: "頃[之]，持一象笏至", src: 項脊軒志}
  - word: 其
    uses:
      - {use: 代詞：他的、它的, ex: "失[其]所與，不知", src: 燭之武退秦師}
      - {use: 代詞：那、其中, ex: "復前行，欲窮[其]林", src: 桃花源記}
      - {use: 表推測：大概, ex: "[其]皆出於此乎", src: 師說}
      - {use: 表商量：還是, ex: "吾[其]還也", src: 燭之武退秦師}
      - {use: 表祈使：吧, ex: "爾[其]自戕爾手", src: 勸和論}
      - {use: 表感嘆、反問：真是、難道, ex: "[其]可怪也歟", src: 師說}
  - word: 而
    uses:
      - {use: 表並列：和、而且, ex: "侶魚蝦[而]友麋鹿", src: 赤壁賦}
      - {use: 表轉折：卻、但是, ex: "其下聖人也亦遠矣，[而]恥學於師", src: 師說}
      - {use: 表承接：然後、就, ex: "許之，夜縋[而]出", src: 燭之武退秦師}
      - {use: 表修飾：連接動作的方式，不譯, ex: "客有吹洞簫者，倚歌[而]和之", src: 赤壁賦}
      - {use: 通「爾」：你, ex: "某所，[而]母立於茲", src: 項脊軒志}
  - word: 以
    uses:
      - {use: 介詞：因為, ex: "[以]其無禮於晉，且貳於楚也", src: 燭之武退秦師}
      - {use: 介詞：用、拿, ex: "比去，[以]手闔門", src: 項脊軒志}
      - {use: 介詞：把, ex: "願陛下託臣[以]討賊興復之效", src: 出師表}
      - {use: 介詞：憑著, ex: "李郎[以]奇特之才，輔清平主", src: 虯髯客傳}
      - {use: 連詞：來、用來（表目的）, ex: "垣牆周庭，[以]當南日", src: 項脊軒志}
      - {use: 連詞：同「而」, ex: "挾飛仙[以]遨遊，抱明月而長終", src: 赤壁賦}
      - {use: 「以為」：認為, ex: "臣聞吏議逐客，竊[以]為過矣", src: 諫逐客書}
      - {use: 「以為」：把……當作, ex: "若舍鄭[以]為東道主", src: 燭之武退秦師}
  - word: 於
    uses:
      - {use: 在, ex: "臣本布衣，躬耕[於]南陽", src: 出師表}
      - {use: 從, ex: "少焉，月出[於]東山之上", src: 赤壁賦}
      - {use: 對、向, ex: "以其無禮於晉，且貳[於]楚也", src: 燭之武退秦師}
      - {use: 被, ex: "此非孟德之困[於]周郎者乎", src: 赤壁賦}
      - {use: 比, ex: "師不必賢[於]弟子", src: 師說}
      - {use: 到, ex: "興復漢室，還[於]舊都", src: 出師表}
  - word: 為
    uses:
      - {use: 動詞（ㄨㄟˊ）：是, ex: "如今人方[為]刀俎，我為魚肉", src: 鴻門宴}
      - {use: 動詞（ㄨㄟˊ）：當作、做, ex: "武陵人捕魚[為]業", src: 桃花源記}
      - {use: 介詞（ㄨㄟˊ）：被，常用「為……所……」, ex: "梅花[為]寒所勒", src: 晚遊六橋待月記}
      - {use: 介詞（ㄨㄟˋ）：替、給, ex: "臣[為]韓王送沛公", src: 鴻門宴}
      - {use: 語氣詞（ㄨㄟˊ）：呢, ex: "我為魚肉，何辭[為]", src: 鴻門宴}
  - word: 與
    uses:
      - {use: 連詞、介詞：和、跟, ex: "秦伯說，[與]鄭人盟", src: 燭之武退秦師}
      - {use: 連詞：以及, ex: "大道之行也，[與]三代之英", src: 大同與小康}
      - {use: 動詞（ㄩˋ）：參與, ex: "昔者，仲尼[與]於蜡賓", src: 大同與小康}
      - {use: 動詞：給予, ex: "則[與]斗卮酒", src: 鴻門宴}
      - {use: 名詞：盟友、結交的對象, ex: "失其所[與]，不知", src: 燭之武退秦師}
      - {use: 通「舉」：推舉, ex: "選賢[與]能，講信修睦", src: 大同與小康}
  - word: 乃
    uses:
      - {use: 竟然, ex: "問今是何世，[乃]不知有漢", src: 桃花源記}
      - {use: 才, ex: "[乃]知真人之興也，非英雄所冀", src: 虯髯客傳}
      - {use: 於是、就, ex: "使杞子、逢孫、楊孫戍之，[乃]還", src: 燭之武退秦師}
      - {use: 是、原來是, ex: "[乃]紫衣戴帽人，杖揭一囊", src: 虯髯客傳}
  - word: 則
    uses:
      - {use: 就（表承接）, ex: "項王曰：「壯士！賜之卮酒！」[則]與斗卮酒", src: 鴻門宴}
      - {use: 卻（表轉折）, ex: "於其身也，[則]恥師焉", src: 師說}
      - {use: 那麼（表假設的結果）, ex: "不效，[則]治臣之罪", src: 出師表}
      - {use: 就是（表判斷）, ex: "主人西[則]酒肆也", src: 虯髯客傳}
  - word: 所
    uses:
      - {use: 「所」加動詞：……的人、事、物, ex: "道之[所]存，師之所存也", src: 師說}
      - {use: 「為……所……」：被, ex: "若屬皆且為[所]虜", src: 鴻門宴}
      - {use: 名詞：地方, ex: "某[所]，而母立於茲", src: 項脊軒志}
      - {use: 「所以」：用來……的, ex: "師者，[所]以傳道、受業、解惑也", src: 師說}
      - {use: 「所以」：……的原因, ex: "親賢臣，遠小人，此先漢[所]以興隆也", src: 出師表}
  - word: 者
    uses:
      - {use: ……的人, ex: "古之學[者]必有師", src: 師說}
      - {use: 表停頓，構成判斷句, ex: "師[者]，所以傳道、受業、解惑也", src: 師說}
      - {use: ……的地方、……的事, ex: "向時估帆所出入[者]，時已淤為沙灘", src: 鹿港乘桴記}
      - {use: 放在時間詞後，不譯, ex: "昔[者]，仲尼與於蜡賓", src: 大同與小康}
  - word: 且
    uses:
      - {use: 況且, ex: "[且]君嘗為晉君賜矣", src: 燭之武退秦師}
      - {use: 而且, ex: "以其無禮於晉，[且]貳於楚也", src: 燭之武退秦師}
      - {use: 將要, ex: "若屬皆[且]為所虜", src: 鴻門宴}
      - {use: 尚且, ex: "臣死[且]不避，卮酒安足辭", src: 鴻門宴}
      - {use: 「且……且……」：又……又……, ex: "靖與張氏[且]驚且喜", src: 虯髯客傳}
  - word: 焉
    uses:
      - {use: 疑問代詞：哪裡、怎麼、何必, ex: "若不闕秦，將[焉]取之", src: 燭之武退秦師}
      - {use: 兼詞：於此、從這裡, ex: "率妻子邑人來此絕境，不復出[焉]", src: 桃花源記}
      - {use: 句末語氣詞，不譯, ex: "於其身也，則恥師[焉]", src: 師說}
      - {use: 詞尾：……的樣子, ex: "少[焉]，月出於東山之上", src: 赤壁賦}
  - word: 若
    uses:
      - {use: 你, ex: "吾兒，久不見[若]影", src: 項脊軒志}
      - {use: 如果, ex: "[若]使燭之武見秦君，師必退", src: 燭之武退秦師}
      - {use: 像、好像, ex: "山有小口，彷彿[若]有光", src: 桃花源記}
      - {use: 比得上, ex: "天下之權重望崇者莫我[若]也", src: 虯髯客傳}
      - {use: 「若夫」：至於, ex: "[若]夫銀鈎鐵畫，固屬難窺", src: 畫菊自序}
  - word: 蓋
    uses:
      - {use: 大概, ex: "仲尼之歎，[蓋]歎魯也", src: 大同與小康}
      - {use: 因為、原來是（說明原因）, ex: "[蓋]追先帝之殊遇，欲報之於陛下也", src: 出師表}
      - {use: 句首發語詞, ex: "[蓋]將自其變者而觀之", src: 赤壁賦}
      - {use: 名詞：車蓋、傘蓋, ex: "今已亭亭如[蓋]矣", src: 項脊軒志}
  - word: 故
    uses:
      - {use: 所以, ex: "河海不擇細流，[故]能就其深", src: 諫逐客書}
      - {use: 本來, ex: "吾[故]謂非君所能致也", src: 虯髯客傳}
      - {use: 舊的、原來的, ex: "几上肴核如[故]", src: 勞山道士}
      - {use: 交情, ex: "君安與項伯有[故]", src: 鴻門宴}
  - word: 然
    uses:
      - {use: 然而、但是, ex: "[然]侍衛之臣，不懈於內", src: 出師表}
      - {use: 這樣, ex: "蘇子愀然，正襟危坐，而問客曰：「何為其[然]也？」", src: 赤壁賦}
      - {use: 詞尾：……的樣子, ex: "土地平曠，屋舍儼[然]", src: 桃花源記}
      - {use: 「然則」：那麼, ex: "[然]則將何之", src: 虯髯客傳}
      - {use: 通「燃」：點燃, ex: "門人[然]燭來", src: 勞山道士}
  - word: 因
    uses:
      - {use: 趁機, ex: "請以劍舞，[因]擊沛公於坐", src: 鴻門宴}
      - {use: 依靠、憑藉, ex: "[因]人之力而敝之，不仁", src: 燭之武退秦師}
      - {use: 通過、經由, ex: "[因]文靜見之可也", src: 虯髯客傳}
  - word: 遂
    uses:
      - {use: 於是、就, ex: "尋向所誌，[遂]迷，不復得路", src: 桃花源記}
      - {use: 終於, ex: "得以助文皇締構之資，[遂]匡大業", src: 虯髯客傳}
  - word: 既
    uses:
      - {use: 已經, ex: "秦、晉圍鄭，鄭[既]知亡矣", src: 燭之武退秦師}
      - {use: ……之後, ex: "[既]出，得其船", src: 桃花源記}
      - {use: 「既……又……」, ex: "[既]東封鄭，又欲肆其西封", src: 燭之武退秦師}
  - word: 即
    uses:
      - {use: 就、立刻, ex: "項伯[即]入見沛公", src: 鴻門宴}
      - {use: 就是, ex: "是朋友如一身左右手，[即]吾身之肉也", src: 勸和論}
      - {use: 將會, ex: "三五年內，[即]當太平", src: 虯髯客傳}
  - word: 苟
    uses:
      - {use: 苟且、姑且, ex: "[苟]全性命於亂世", src: 出師表}
      - {use: 如果, ex: "[苟]非吾之所有，雖一毫而莫取", src: 赤壁賦}
  - word: 安
    uses:
      - {use: 哪裡, ex: "固一世之雄也，而今[安]在哉", src: 赤壁賦}
      - {use: 怎麼, ex: "臣死且不避，卮酒[安]足辭", src: 鴻門宴}
  - word: 何
    uses:
      - {use: 什麼, ex: "煮者[何]肉", src: 虯髯客傳}
      - {use: 為什麼, ex: "君子[何]歎", src: 大同與小康}
      - {use: 怎麼, ex: "七、八人，壺酒[何]能遍給", src: 勞山道士}
      - {use: 「何以」：憑什麼、怎麼會, ex: "不然，籍[何]以至此", src: 鴻門宴}
  - word: 夫
    uses:
      - {use: 句首發語詞（ㄈㄨˊ），不譯, ex: "[夫]晉，何厭之有", src: 燭之武退秦師}
      - {use: 指示代詞（ㄈㄨˊ）：那, ex: "微[夫]人之力不及此", src: 燭之武退秦師}
      - {use: 名詞（ㄈㄨ）：丈夫, ex: "調藥助[夫]之暇", src: 畫菊自序}
  - word: 相
    uses:
      - {use: 互相, ex: "巫、醫、樂師、百工之人，不恥[相]師", src: 師說}
      - {use: 偏指一方（你、我、他）, ex: "吾從板外[相]為應答", src: 項脊軒志, note: 相＝她（你母親）}
      - {use: 名詞（ㄒㄧㄤˋ）：宰相, ex: "使子嬰為[相]", src: 鴻門宴}
      - {use: 動詞（ㄒㄧㄤˋ）：看相, ex: "有善[相]者思見郎君", src: 虯髯客傳}
  - word: 見
    uses:
      - {use: 看見, ex: "[見]漁人，乃大驚", src: 桃花源記}
      - {use: 拜見, ex: "若使燭之武[見]秦君，師必退", src: 燭之武退秦師}
      - {use: 放在動詞前，表示「對我」, ex: "他人[見]問，固不言", src: 虯髯客傳, note: 見問＝問我}
      - {use: 通「現」（ㄒㄧㄢˋ）：顯現, ex: "鬚眉畢[見]", src: 勞山道士}
  - word: 向
    uses:
      - {use: 從前的、先前的, ex: "既出，得其船，便扶[向]路", src: 桃花源記}
      - {use: 面向、朝向, ex: "又北[向]，不能得日", src: 項脊軒志}
      - {use: 「向使」：假如, ex: "[向]使四君卻客而不內", src: 諫逐客書}
  - word: 竊
    uses:
      - {use: 私下（謙詞）, ex: "[竊]慕管夫人之墨竹，紙上生風", src: 畫菊自序}
      - {use: 偷竊, ex: "盜[竊]亂賊而不作", src: 大同與小康}
  - word: 得
    uses:
      - {use: 能夠, ex: "軒凡四遭火，[得]不焚", src: 項脊軒志}
      - {use: 得到, ex: "既出，[得]其船", src: 桃花源記}
  - word: 曾、嘗
    uses:
      - {use: 曾（ㄗㄥ）：竟然、連……都, ex: "則天地[曾]不能以一瞬", src: 赤壁賦}
      - {use: 嘗：曾經, ex: "且君[嘗]為晉君賜矣", src: 燭之武退秦師}
  - word: 猶
    uses:
      - {use: 尚且, ex: "臣之壯也，[猶]不如人", src: 燭之武退秦師}
      - {use: 仍然、還, ex: "靖怒甚，未決，[猶]刷馬", src: 虯髯客傳}
      - {use: 如同、好像, ex: "同居一府，[猶]同室之兄弟", src: 勸和論}
  - word: 方
    uses:
      - {use: 正在, ex: "靖[方]刷馬", src: 虯髯客傳}
      - {use: 當……的時候, ex: "[方]其破荊州，下江陵", src: 赤壁賦}
      - {use: 才, ex: "計李郎之程，某日[方]到", src: 虯髯客傳}
  - word: 惟（唯）
    uses:
      - {use: 只, ex: "[惟]江上之清風，與山間之明月", src: 赤壁賦}
      - {use: 表示希望, ex: "闕秦以利晉，[惟]君圖之", src: 燭之武退秦師}
  - word: 爾
    uses:
      - {use: 你, ex: "[爾]其自戕爾手", src: 勸和論}
      - {use: 如此, ex: "蒙賜月明之照，乃[爾]寂飲", src: 勞山道士}
      - {use: 「爾來」：從那時以來, ex: "[爾]來二十有一年矣", src: 出師表}
      - {use: 「云爾」：句末語氣詞，罷了, ex: "莫自知其鳩拙云[爾]", src: 畫菊自序}
  - word: 語氣詞：也、矣、乎、哉、歟、耳
    uses:
      - {use: 也：表判斷或肯定, ex: "師者，所以傳道、受業、解惑[也]", src: 師說}
      - {use: 矣：了, ex: "國危[矣]", src: 燭之武退秦師}
      - {use: 乎：嗎（疑問）, ex: "此非曹孟德之詩[乎]", src: 赤壁賦}
      - {use: 乎：介詞，同「於」, ex: "其聞道也，固先[乎]吾", src: 師說}
