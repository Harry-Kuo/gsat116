# 社會重點整理：各觀念的必背（must）、作答步驟（steps）、易錯點（traps），可加表格（tables）。
# Claude 撰寫，老師審閱後可修改。觀念代碼對應 data/concepts/social.yaml；name、summary 會取代觀念樹的名稱與一句話重點。
# 法規與制度以 2026 年的現行規定為準；tools/notion_md.py 會產生公民與社會、歷史、地理三頁。

G1:
  name: 社會安全、社會福利與公共政策
  summary: 先判斷題目在談哪一種社會安全制度（社會保險、社會救助、福利服務），再看政策的目的與要付出的代價。
  must:
    - 社會保險：大家繳保費、共同分攤風險，有繳費才有給付，例如全民健保（1995）、勞工保險、就業保險、國民年金（2008）。
    - 社會救助：政府用稅收照顧經濟弱勢，需要審查資格（例如低收入戶、中低收入戶的補助），不必先繳費。
    - 福利服務：針對特定對象提供照顧，例如長期照顧、托育、身心障礙者服務。
    - 全民健保是強制參加的社會保險，採自助互助、風險分攤；部分負擔是為了減少浪費醫療資源。
    - 福利國家透過租稅與社會福利進行所得重分配；累進稅率（所得越高、稅率越高）可以縮小貧富差距。
    - 普及式福利不論貧富都提供（例如國民教育）；選擇式福利要先審查資格（例如低收入戶補助）。
    - 公共政策的過程：問題認定 → 政策規劃 → 合法化（例如立法院通過法律）→ 執行 → 評估；民眾可透過陳情、公聽會、連署、公民投票參與。
    - 公共利益常需要取捨：效率與公平、經濟開發與環境保護、不同群體的利益。
    - 少子化與高齡化使社會保險的財務壓力增加：繳費的人變少，領取給付的人變多。
  steps:
    - 先判斷題目描述的是保險（要繳費）、救助（看資格、用稅收）還是服務（照顧特定對象）。
    - 再找政策要達成的目的（分攤風險、減少貧窮、照顧弱勢）與可能的代價（財政負擔、資源浪費）。
    - 選項的推論超出題目資料（例如「一定能解決」「完全消除」），通常就是錯的。
  traps:
    - 社會保險和商業保險不同：社會保險強制參加，保費依負擔能力計算。
    - 社會救助不需要先繳費，社會保險要先繳保費才有給付。
    - 普及式與選擇式福利的差別在「有沒有審查資格」，不是福利多寡。
G2:
  name: 民主政治、選舉與媒體
  summary: 分清楚內閣制、總統制、半總統制；選舉制度會影響政黨數量；推論只能根據題目提供的資料。
  must:
    - 民主政治的原則：主權在民、多數決但尊重少數、法治、權力分立與制衡、定期改選。
    - 我國總統、副總統由人民直選，任期 4 年，連選得連任一次；中央政府有行政、立法、司法、考試、監察五院。
    - 我國總統任命行政院長，不需經立法院同意；行政院對立法院負責，立法院可以提出不信任案（倒閣），總統可在倒閣後解散立法院。
    - 立法委員共 113 席、任期 4 年，採單一選區兩票制：區域 73 席（每區選 1 人）、原住民 6 席（平地、山地各 3 席）、全國不分區及僑居國外國民 34 席依政黨票比例分配；政黨得票率要達 5% 才分配席次，不分區名單中女性不得少於一半。
    - 單一選區相對多數制容易形成兩黨制；比例代表制有利於小黨取得席次。
    - 罷免：同意票多於不同意票，而且同意票達選舉區選舉人總數的 $\dfrac{1}{4}$，才算通過。
    - 公民投票：年滿 18 歲有公投權（選舉權仍是 20 歲，2022 年修憲複決沒有通過）；有效同意票多於不同意票，且達投票權人總數 $\dfrac{1}{4}$ 才通過；2025 年 12 月修法後，公投在公投案公告成立後 3～6 個月內舉行，期間內遇到全國性選舉就同日投票（恢復「公投綁大選」，取代 2019 年訂的「8 月第 4 個星期六、每兩年一次」）。
    - 政黨以取得政權、執政為目標；利益團體以影響政策為目的，不以執政為目標。
    - 媒體有「議題設定」的功能，會影響大家關心什麼；社群平台的演算法推送相似觀點，容易形成同溫層、回聲室效應。
    - 面對資訊要查證來源、區分事實與意見；民意調查要看抽樣方式、樣本代表性與誤差範圍。
  steps:
    - 政府體制題抓兩件事：行政首長怎麼產生、對誰負責；國會能不能倒閣、行政首長能不能解散國會。
    - 選舉題：先看每個選區選幾人、用多數決還是比例分配，再推政黨數量與席次分配。
    - 資料推論題：只根據題文與圖表能支持的內容作答，不要加入自己的價值判斷。
  traps:
    - 我國行政院長由總統任命，不需要立法院同意（1997 年修憲後）。
    - 公投年齡是 18 歲，選舉投票年齡仍是 20 歲。
    - 多數決不代表多數可以剝奪少數的基本權利。
  tables:
    - title: 三種政府體制
      rows:
        - [比較, 內閣制, 總統制, 半總統制]
        - [例子, 英國、日本, 美國, 法國、我國]
        - [行政首長, 由國會多數黨組閣, 民選的總統, 民選總統任命行政首長（總理、行政院長）]
        - [向誰負責, 向國會負責, 向人民負責，不向國會負責, 行政首長向國會負責]
        - [倒閣與解散, 國會可倒閣，內閣可解散國會, 沒有倒閣與解散, 國會可倒閣，總統可解散國會]
G3:
  name: 憲法、法律原則與權利救濟
  summary: 先判斷是國家與人民之間（刑事、行政）還是人民之間（民事）的案件，再找適用的原則與救濟途徑。
  must:
    - 法律位階：憲法 ＞ 法律（立法院三讀通過、總統公布）＞ 命令（行政機關訂定）；下位的規範牴觸上位的規範無效。
    - 憲法保障的基本權：平等權、自由權（人身、言論、宗教、集會結社、居住遷徙等）、受益權（請願、訴願、訴訟、受國民教育）、參政權（選舉、罷免、創制、複決、應考試服公職）。
    - 限制人民權利要符合法律保留（要有法律，或法律明確授權的命令）與比例原則（手段適合目的、選擇損害最小的手段、造成的損害不能大於要保護的利益）。
    - 違憲審查由大法官組成的憲法法庭負責；2022 年憲法訴訟法施行後，以「判決」取代過去的「解釋」。
    - 罪刑法定：行為時法律有明文規定才處罰，禁止類推適用、不溯及既往；行為後法律有變更時，適用最有利於行為人的法律。
    - 犯罪成立要依序檢查：構成要件 → 違法性（正當防衛、緊急避難、依法令的行為可以阻卻違法）→ 有責性（責任能力：未滿 14 歲不罰，14～18 歲得減輕，滿 80 歲得減輕；精神障礙也會影響）。
    - 刑事訴訟：無罪推定（判決確定前推定無罪）、罪疑唯輕、不自證己罪（緘默權）、檢察官負舉證責任；2023 年起部分重大刑案由國民法官與法官共同審判。
    - 民法：滿 18 歲成年（2023 年起），有完全行為能力；7 歲以上未滿 18 歲是限制行為能力人，重要的法律行為要法定代理人同意；未滿 7 歲無行為能力。結婚年齡男女都是 18 歲。
    - 契約：雙方意思表示一致就成立，不一定要書面；契約自由，但違反強制規定或公序良俗的契約無效。
    - 侵權行為：因故意或過失不法侵害他人權利，要負損害賠償責任；未成年人侵權時，法定代理人通常要負連帶賠償責任。
    - 行政救濟：不服行政處分 → 訴願 → 行政訴訟；公務員違法侵害人民權利，可以請求國家賠償。
    - 消費者保護：網路購物、郵購等通訊交易，消費者收到商品後 7 天內可以無條件解除契約（猶豫期）。
  steps:
    - 先判斷案件性質：國家對人民（刑事、行政）還是人民之間（民事），再選救濟途徑。
    - 刑事題：依序檢查構成要件、違法性、有責性，三者都成立才構成犯罪。
    - 憲法題：找出被限制的基本權，再用法律保留與比例原則檢查限制是否合憲。
  traps:
    - 無罪推定（判決確定前視為無罪）和不自證己罪（不必提出對自己不利的陳述或證據）是兩個不同的原則。
    - 成年年齡已改為 18 歲（2023 年 1 月 1 日起），較舊的題目中 20 歲成年、未成年結婚的規定已經修改。
    - 正當防衛要針對「現在不法的侵害」，事後的報復不算。
    - 契約不一定要寫成書面才成立。
G4:
  name: 市場、經濟指標與國際貿易
  summary: 需求、供給線的移動決定價格與數量；機會成本是放棄的選擇中價值最高的那一個；比較利益看誰的機會成本較低。
  must:
    - 機會成本：做選擇時放棄的其他選擇中價值最高的那一個（時間也是成本）；沉沒成本已經無法收回，不應影響之後的決策。
    - 需求法則：價格上升，需求量減少（沿著需求線移動）；所得、偏好、相關商品價格、對未來的預期改變時，整條需求線移動。
    - 替代品（咖啡與茶）：一個漲價，另一個的需求增加；互補品（印表機與墨水）：一個漲價，另一個的需求減少。
    - 供給法則：價格上升，供給量增加；生產成本、技術、廠商數量、預期改變時，整條供給線移動。
    - 市場均衡：需求量等於供給量時的價格與數量；需求增加 → 價格上升、數量增加；供給增加 → 價格下降、數量增加。
    - 價格管制：價格上限（低於均衡價格，例如租金管制）造成短缺；價格下限（高於均衡價格，例如保證收購價格、最低工資）造成過剩。
    - 市場失靈：外部性（負外部性如汙染，會生產過多；正外部性如接種疫苗、教育，會不足）、公共財（無敵對性、無排他性，容易搭便車，例如國防、路燈）、獨占、資訊不對稱；政府可用課稅、補貼、管制來矯正，但政府也可能失靈。
    - 國內生產毛額 GDP：一定期間內，一國境內生產的最終財貨與勞務的市場價值；支出面 $\text{GDP}=\text{消費 }C+\text{投資 }I+\text{政府支出 }G+\text{淨出口 }(X-M)$。
    - GDP 不包括中間財、二手商品、自己做的家事、非法交易；實質 GDP 扣除了物價變動的影響；$\text{平均每人 GDP}=\dfrac{\text{GDP}}{\text{人口}}$。
    - 通貨膨脹：物價普遍且持續上漲（消費者物價指數 CPI 上升），貨幣的購買力下降；$\text{失業率}=\dfrac{\text{失業人口}}{\text{勞動力}}$。
    - 比較利益：各國專門生產機會成本較低的產品再互相交易，雙方都能獲利，即使一國兩種產品的生產效率都比較高也一樣。
    - 匯率：新臺幣升值（例如 1 美元由 32 元變成 30 元）時，出口品在國外變貴、出口減少，進口品變便宜、出國旅遊較划算；貶值則相反。
    - 中央銀行升息會提高借錢的成本，減少消費與投資，可以抑制通貨膨脹。
  steps:
    - 需求供給題：①判斷事件影響的是需求還是供給 ②是增加還是減少（整條線往右或往左）③由新的交點推出價格與數量的變化。
    - 比較利益題：算出兩國生產每一單位產品的機會成本，各自生產機會成本較低的那一種。
    - GDP 題：逐一檢查是否符合「這段期間、本國境內、最終產品、有市場交易」。
  traps:
    - 價格變動造成的是需求量（或供給量）的改變，不是需求（或供給）的改變。
    - 比例、成長率資料不能直接推出總量誰大誰小。
    - GDP 扣掉進口，是為了不把國外生產的東西算進本國的生產，不是因為進口不好。
    - 新臺幣升值時，1 美元換到的新臺幣「變少」。
G5:
  name: 全球化、國際組織與多元文化
  summary: 全球化讓商品、資金、人員、資訊快速流動，也帶來不平等與文化衝擊；多元文化政策的目的是保障少數群體的權利。
  must:
    - 全球化的面向：經濟（跨國企業、國際分工、全球供應鏈）、政治（國際組織、全球治理）、文化（文化交流，可能同質化，也可能在地化）、環境（跨國汙染、氣候變遷）。
    - 國際組織：聯合國（安全理事會 5 個常任理事國有否決權）、世界貿易組織 WTO（推動貿易自由化；臺灣在 2002 年以「臺澎金馬個別關稅領域」加入）、世界衛生組織 WHO；區域整合如歐盟、東協。
    - 政府間國際組織由國家組成（聯合國、WTO）；非政府組織 NGO 由民間組成（例如國際特赦組織、無國界醫生）。
    - 全球化的影響：產業外移與就業結構改變、跨國移工與新住民增加、國家之間與國家內部的貧富差距擴大。
    - 永續發展：滿足當代需求，又不損害後代滿足其需求的能力；聯合國永續發展目標 SDGs 共 17 項，預定 2030 年達成。
    - 文化相對主義：用該文化自己的脈絡去理解，不用自己的標準評斷；要避免族群中心主義與刻板印象。
    - 原住民族權利：原住民族基本法（2005）、原住民族語言發展法（2017，原住民族語言為國家語言）；官方認定的原住民族有 17 族（2026 年 7 月行政院核定西拉雅族為第 17 族，是第一個獲得核定的平埔族群）。
    - 國家語言發展法（2019）保障臺灣各固有族群使用的自然語言與臺灣手語。
    - 性別平等：性別平等教育法、性別平等工作法（2023 年由性別工作平等法更名）；注意性別刻板印象與性別角色的變遷。
  steps:
    - 先判斷題目談的是全球化的哪一個面向（經濟、政治、文化、環境），再找出它的正面與負面影響。
    - 多元文化題：看政策或行為的「目的」，是在保障少數群體的文化權與平等權，還是要求少數群體同化。
  traps:
    - 全球化不等於文化完全同質化，也會出現「全球在地化」。
    - 文化相對主義不代表任何做法都不能批評，仍要尊重普世人權。
    - 為少數群體設計的保障措施（例如原住民族的保障名額）是為了追求實質平等，不違反平等原則。
G6:
  name: 社會規範、社會化與社會階層
  summary: 習俗、道德、宗教、法律約束行為的力量來源不同；人在社會化中學習規範，也能反思並改變規範。
  must:
    - 社會規範的種類：習俗（約定俗成）、道德（良心與輿論）、宗教規範（信仰）、法律（以國家強制力為後盾）；只有法律由國家強制執行。
    - 社會化：個人學習社會的價值、規範與角色的過程，持續一生；主要媒介有家庭、學校、同儕、大眾媒體與網路。
    - 社會角色：同一個人在不同情境扮演不同角色（學生、子女、員工）；不同角色的期待互相衝突時，產生角色衝突。
    - 社會階層：依財富、權力、聲望分成不同層級；教育是向上流動的重要管道；代間流動是和父母比較，代內流動是個人一生中的變化。
    - 社會偏差：違反社會規範的行為；標籤理論認為，被貼上偏差標籤的人可能因此真的走向偏差。
    - 社會團體：初級團體（家庭、密友，關係親密而全面）與次級團體（公司、社團，以達成目標為主）。
    - 公民社會：非營利組織（NPO）、非政府組織（NGO）與志工，補充政府與市場的不足。
    - 個人受社會規範影響，也能透過集體行動或社會運動改變規範（例如性別平權、環境保護）。
  steps:
    - 判斷規範類型：看約束的力量來自哪裡（國家強制、良心或輿論、信仰、習慣）。
    - 社會化題：找出影響個人的媒介與學到的價值，注意題文描述個人是被動接受，還是主動詮釋、反思。
    - 階層流動題：比較兩代或一生中不同時間的社會地位，判斷是代間或代內、向上或向下流動。
  traps:
    - 違反道德不一定違法，合法也不一定合乎道德。
    - 社會化不只發生在童年，成年後也持續進行。
    - 社會規範會隨時代改變，不是固定不變的。
H1:
  name: 臺灣史
  summary: 依時代記住統治者的政策重點，再由史料的時間、用語與立場推論背景與目的。
  must:
    - 史前文化：舊石器時代長濱文化；新石器時代大坌坑文化（粗繩紋陶）、卑南文化（石板棺）；金屬器時代十三行文化（煉鐵）。
    - 原住民族屬於南島語族；臺灣可能是南島語族的原鄉之一。
    - 荷蘭（1624–1662）占領南部大員，建熱蘭遮城，以臺灣為貿易轉運站，招募漢人來臺開墾，實施贌社制度、徵收人頭稅，傳教士用羅馬字拼寫平埔族語（後來的「新港文書」）；西班牙（1626–1642）占領北部雞籠、淡水。
    - 鄭氏（1662–1683）：鄭成功驅逐荷蘭；實施屯田（營盤田）；陳永華建孔廟、推行儒學教育；以臺灣為反清基地，發展海上貿易。
    - 清領前期消極治臺：頒布渡臺禁令（限制來臺、不准攜眷）、劃定番界（土牛溝）；民變頻繁（朱一貴、林爽文、戴潮春事件）、分類械鬥（閩粵、漳泉）。
    - 清領時期的經濟：米、糖輸出；1860 年代開港通商（淡水、雞籠、安平、打狗）後，茶、糖、樟腦成為三大出口品，經濟重心逐漸北移。
    - 清領後期積極治臺：1874 年牡丹社事件後，沈葆楨來臺推動開山撫番、解除渡臺禁令；1885 年臺灣建省，劉銘傳推動鐵路、電報、郵政、清賦等近代化建設。
    - 日治前期：臺灣總督府、六三法賦予總督立法權；民政長官後藤新平推動土地調查、戶口調查、保甲制度與專賣制度；漢人的武裝抗日到噍吧哖事件（1915）後大致結束（原住民的霧社事件則發生在 1930 年）。
    - 日治中期（1919 年起）：同化政策（內地延長主義）；臺灣文化協會（1921）推動文化啟蒙，臺灣議會設置請願運動（1921–1934）爭取自治。
    - 日治後期（1937 年起）：皇民化運動，推行國語家庭、改日本姓名、寺廟整理、志願兵制度；配合南進政策發展工業。
    - 日治時期的建設：縱貫鐵路、嘉南大圳（八田與一設計）、新式教育、統一度量衡與貨幣；經濟上是「工業日本、農業臺灣」。
    - 戰後：1945 年國民政府接收，設臺灣省行政長官公署；1947 年二二八事件；1949 年實施戒嚴、中央政府遷臺；白色恐怖。
    - 戰後經濟：土地改革（三七五減租、公地放領、耕者有其田）、美援；1966 年設高雄加工出口區、發展出口導向產業；1970 年代十大建設；1980 年設新竹科學園區，發展高科技產業。
    - 外交：1971 年退出聯合國；1979 年美國與中華人民共和國建交，美國國會制定《臺灣關係法》。
    - 民主化：1979 年美麗島事件；1986 年民主進步黨成立；1987 年解除戒嚴；1991 年終止動員戡亂時期，1991–1992 年國會全面改選；1996 年首次總統直選；2000 年首次政黨輪替。
  steps:
    - 先由史料的關鍵字判斷時代：「番界、渡臺、民變」→ 清領；「總督府、保甲、國語家庭」→ 日治；「戒嚴、反共、動員戡亂」→ 戰後。
    - 再問：史料的作者是誰？立場是什麼？想達成什麼目的？
    - 年代排序題：先把事件分到大時期，再在時期內排先後。
  traps:
    - 開港通商後的三大出口品是茶、糖、樟腦，不是米。
    - 日治的同化政策（1919 年起）與皇民化運動（1937 年起）是不同階段。
    - 1987 年解嚴後還有限制：刑法第 100 條到 1992 年才修正。
    - 荷蘭在南部（大員），西班牙在北部（雞籠、淡水）。
  tables:
    - title: 臺灣史年表
      rows:
        - [時期, 年代, 重點]
        - [荷西時期, 荷蘭 1624–1662；西班牙 1626–1642, 大員、熱蘭遮城、贌社、新港文書；西班牙在雞籠、淡水]
        - [鄭氏時期, 1662–1683, 屯田、陳永華興學、反清基地]
        - [清領時期, 1683–1895, 渡臺禁令、番界、民變與械鬥；開港通商後茶糖樟腦；1874 牡丹社事件、1885 建省]
        - [日治時期, 1895–1945, 總督府與六三法、後藤新平；1919 同化政策；1937 皇民化運動]
        - [戰後, 1945 起, 二二八事件、戒嚴（1949–1987）、土地改革、十大建設、解嚴與民主化]
H2:
  name: 中國與東亞史
  summary: 先看制度的目的（中央集權、選拔人才、管理對外關係），再對照時代背景：秦漢郡縣、隋唐科舉、宋元海外貿易、明清海禁、近代改革。
  must:
    - 秦（前 221 年統一）：廢封建、行郡縣；統一文字、度量衡、貨幣；編戶齊民，政府直接掌握人民，徵收賦稅與徭役。
    - 漢：由郡國並行走向中央集權；漢武帝獨尊儒術；張騫通西域，絲路連結中亞與西方。
    - 隋唐：科舉取士（隋創立、唐發展、宋以後成熟），打破門第壟斷；唐代對外開放，長安是國際都市；冊封朝貢關係影響日本、朝鮮（遣唐使、律令制度）。
    - 宋：重文輕武，科舉擴大；商業發達，出現紙幣（交子）；海外貿易興盛，設市舶司管理；理學興起。
    - 元：蒙古帝國橫跨歐亞，驛站交通發達，以海運運送漕糧；四等人制。
    - 明：鄭和下西洋（1405–1433）；實施海禁，倭寇問題嚴重；美洲白銀大量流入，一條鞭法以銀納稅。
    - 清：朝貢體系（宗藩關係）；1757 年限定廣州一口通商；鴉片戰爭（1840–1842）後簽訂南京條約，五口通商、割讓香港。
    - 近代改革：自強運動（洋務運動，中體西用）、戊戌變法（1898）、清末立憲；辛亥革命（1911）後建立中華民國（1912）。
    - 民國：五四運動（1919）與新文化運動；國共合作與內戰；中日戰爭（1937–1945）。
    - 中華人民共和國（1949）：土地改革、大躍進（1958）、文化大革命（1966–1976）；1978 年起改革開放，設經濟特區；民族政策採民族區域自治。
  steps:
    - 先由關鍵字判斷時代：郡縣、編戶齊民 → 秦漢；科舉 → 隋唐以後；市舶司 → 唐宋元；海禁 → 明清；條約、通商口岸 → 清末以後。
    - 分析制度的目的：鞏固中央、選拔人才、掌握人口與稅收、管理對外貿易。
    - 比較題：找出兩個時代政策的異同，例如漢代察舉與隋唐科舉。
  traps:
    - 科舉始於隋，不是唐。
    - 朝貢體系是禮儀上的上下關係，朝貢國不等於中國直接統治的領土。
    - 海禁主要在明清；宋元對海外貿易相對開放。
H3:
  name: 世界史
  summary: 由史料的時間、人物、用語判斷背景；記住重大轉折：文藝復興、宗教改革、啟蒙運動、法國大革命、工業革命、帝國主義、兩次世界大戰、冷戰。
  must:
    - 古典文明：希臘城邦（雅典民主由公民直接參與，但女性、奴隸、外邦人沒有公民權）；羅馬（共和政治、羅馬法，後來基督教成為國教）。
    - 中古歐洲：封建制度、莊園經濟、天主教會權威；十字軍東征（1096–1291）。
    - 文藝復興（14～16 世紀，從義大利開始）：人文主義，重視人的價值與現世生活；印刷術使知識更容易傳播。
    - 宗教改革（1517 年馬丁路德發表九十五條論綱）：反對販賣贖罪券，主張因信稱義、人人可以自己讀聖經；新教產生。
    - 大航海時代（15～16 世紀）：哥倫布抵達美洲（1492）、麥哲倫船隊環球航行；作物、牲畜、疾病在新舊大陸之間交流（哥倫布大交換），並出現大西洋奴隸貿易。
    - 科學革命與啟蒙運動（17～18 世紀）：重視理性；洛克（生命、自由、財產的自然權利）、孟德斯鳩（三權分立）、盧梭（社會契約、主權在民）。
    - 美國獨立（1776 年獨立宣言）；法國大革命（1789 年，人權宣言主張自由、平等、主權在民）；拿破崙把革命理念與民族主義傳到歐洲各地。
    - 工業革命（18 世紀後期從英國開始）：蒸汽機、工廠制度、都市化；勞工問題促成社會主義思想（馬克思）。
    - 帝國主義（19 世紀後期）：列強瓜分非洲（1884–1885 年柏林會議）、殖民亞洲；社會達爾文主義被用來合理化殖民。
    - 第一次世界大戰（1914–1918）：凡爾賽條約、國際聯盟；俄國革命（1917）後建立蘇聯。
    - 一戰後極權主義興起：義大利墨索里尼的法西斯在 1922 年掌權，經濟大恐慌（1929）後德國希特勒的納粹在 1933 年上臺；第二次世界大戰（1939–1945）期間納粹屠殺猶太人；戰後成立聯合國（1945）。
    - 冷戰：1946 年邱吉爾「鐵幕」演說；美蘇對抗（馬歇爾計畫、北約與華沙公約、韓戰、越戰、1962 年古巴飛彈危機）；1989 年柏林圍牆倒塌、1991 年蘇聯解體，冷戰結束。
    - 去殖民化：二戰後亞洲、非洲國家紛紛獨立（例如印度 1947 年獨立）；1993 年歐洲聯盟成立。
  steps:
    - 先由史料中的人物、年代、用語定位時代，例如「人權宣言、第三階級」→ 法國大革命；「鐵幕」→ 冷戰初期。
    - 判斷作者立場與史料性質（當事人留下的第一手史料，或後人的研究與評論）。
    - 因果題：分清楚事件的背景（原因）與影響（結果），不要倒因為果。
  traps:
    - 人文主義重視人的價值，但不等於反對宗教，許多人文主義者仍是虔誠的基督徒。
    - 雅典是直接民主，但有公民權的人只占少數。
    - 冷戰期間美蘇沒有直接開戰，衝突多發生在代理戰爭與軍備競賽。
H4:
  name: 東亞的國際關係與近代化
  summary: 傳統的朝貢體系在十九世紀被條約體系取代；日本明治維新後成為東亞強權，朝鮮、臺灣、滿洲都捲入列強的角力。
  must:
    - 朝貢（宗藩）體系：周邊國家向中國皇帝稱臣納貢、接受冊封，中國給予賞賜並允許貿易；是禮儀上的上下秩序，不是直接統治（例如朝鮮、琉球、越南）。
    - 條約體系：鴉片戰爭後，西方以國與國之間的條約關係取代朝貢秩序，內容包括通商口岸、領事裁判權、協定關稅等。
    - 日本：江戶幕府鎖國（只在長崎與荷蘭、中國貿易）→ 1853 年美國培里率艦叩關 → 1868 年明治維新（廢藩置縣、富國強兵、殖產興業、文明開化）→ 1889 年頒布明治憲法。
    - 1876 年日本以江華島條約迫使朝鮮開港；甲午戰爭（1894–1895）因朝鮮問題爆發，馬關條約中清朝承認朝鮮獨立，並割讓臺灣、澎湖給日本。
    - 日俄戰爭（1904–1905）日本獲勝，取得南滿洲的權益；1910 年日本併吞韓國。
    - 1931 年九一八事變後，日本在 1932 年扶植滿洲國，並推動日本、朝鮮移民到滿洲開墾。
    - 二戰後：日本由盟軍占領、制定和平憲法；朝鮮半島南北分立，韓戰（1950–1953）；冷戰使東亞分成兩大陣營。
    - 1951 年簽訂的舊金山和約中，日本放棄對臺灣、澎湖的一切權利；1952 年中華民國與日本簽訂中日和約。
  steps:
    - 先判斷是朝貢秩序（冊封、稱臣、納貢）還是條約秩序（通商、領事裁判權、割地賠款）。
    - 再看各國的角力：誰想控制朝鮮或滿洲，用什麼方式（戰爭、條約、移民）。
  traps:
    - 朝貢國不等於中國的領土。
    - 馬關條約原本也割讓遼東半島，但因俄、德、法三國干涉而歸還；最後割讓的是臺灣與澎湖。
    - 明治維新是由政府主導、由上而下的改革。
D1:
  name: 地圖、地理資訊系統與遙測
  summary: 讀地圖先看比例尺、方位與圖例；地理資訊系統的環域、疊圖、路網、屬性查詢各有用途。
  must:
    - 比例尺：分母越大，縮小越多（小比例尺：範圍大、內容簡略）；分母越小是大比例尺（範圍小、內容詳細）；1：25000 比 1：100000 的比例尺大。
    - 等高線：越密集坡度越陡；等高線彎曲的尖端指向高處是山谷（河流所在），指向低處是山脊；封閉的等高線是山頂或窪地。
    - 經緯度：經度相差 15° 時差 1 小時（東邊時間較早）；緯度 1° 約 111 公里；臺灣本島約在東經 120°～122°、北緯 22°～25°。
    - 地圖投影：麥卡托投影是正角（正形）投影，局部的角度和形狀正確，等角航線是直線，適合航海，但高緯度的面積嚴重放大；等積投影面積正確、形狀變形。
    - 疊圖分析：把多個圖層疊在一起，找出同時符合多個條件的地區（例如選址）。
    - 環域分析：以點、線、面為中心，畫出一定距離內的範圍（例如學校周圍一定距離內不得設立特定場所）。
    - 路網分析：找最短路徑或服務範圍（例如救護車、物流路線）。
    - 屬性查詢：依條件篩選圖徵（例如人口超過 10 萬人的鄉鎮市區）；地形分析可算坡度、坡向、視域。
    - 資料形式：網格資料（以像元表示，適合高度、雨量等連續變化的資料）；向量資料（點、線、面，適合道路、行政界線）。
    - 遙測：用衛星或航空影像觀測地表，不同地物反射的電磁波不同（健康植物反射近紅外線很強）；全球衛星導航系統（如 GPS）用來定位。
    - 主題地圖：點子圖（分布）、面量圖（比率，例如人口密度）、流線圖（流量與方向）、等值線圖（溫度、雨量、高度）。
  steps:
    - 先看題目要解決什麼問題（選址、範圍、路線、條件篩選），再對應到地理資訊系統的功能。
    - 讀等高線圖：找出最高點、河流與山脊、坡度陡緩，再推聚落或道路的位置。
    - 讀主題地圖：先看圖例代表的是數量還是比率。
  traps:
    - 小比例尺地圖的範圍大但細節少。
    - 等高線尖端指向高處的是山谷，指向低處的是山脊。
    - 面量圖適合呈現比率，不適合直接比較總量。
    - 環域看「距離範圍」，疊圖看「多個條件同時成立」，不要混淆。
D2:
  name: 氣候、水文與生態
  summary: 先看氣溫（年均溫、年溫差），再看雨量（多寡與季節分配）判斷氣候類型，再推植被、土壤與人類活動。
  must:
    - 影響氣候的因素：緯度、海陸分布（海洋性氣候年溫差小，大陸性氣候年溫差大）、地形（迎風坡多雨、背風坡少雨；高度每升高 1000 公尺，氣溫約降 6°C）、洋流（暖流增溫增濕，寒流降溫少雨）、氣壓帶與風帶。
    - 全球氣壓帶：赤道低壓帶（上升氣流，多雨）、副熱帶高壓帶（約南北緯 30°，下沉氣流，乾燥、多沙漠）、副極地低壓帶、極地高壓帶；風帶：信風、西風、極地東風。
    - 季風：海陸受熱不均造成季節性風向改變，東亞、南亞、東南亞夏季吹海洋來的季風、多雨。
    - 熱帶雨林的土壤因雨水淋溶，養分少（磚紅壤），養分大多在植物體內循環；溫帶草原的黑土肥沃。
    - 水資源：河川流量受降雨季節影響；超抽地下水會造成地層下陷（例如臺灣西南沿海）。
    - 臺灣氣候：冬季東北季風使北部、東北部多雨，南部冬季乾燥；夏季西南季風、午後雷陣雨、梅雨與颱風是重要的水源。
  steps:
    - 讀氣溫雨量圖：①最熱月在 7 月 → 北半球，在 1 月 → 南半球 ②年溫差大小判斷海洋性或大陸性 ③雨量的多寡與季節分配判斷氣候類型。
    - 由氣候推植被、農業與聚落（例如地中海型氣候的橄欖、葡萄、柑橘）。
  traps:
    - 南半球的夏季是 12～2 月，氣溫曲線中間低、兩端高。
    - 熱帶雨林的土壤並不肥沃。
    - 地中海型氣候是夏乾冬雨，不是夏雨。
  tables:
    - title: 主要氣候類型
      rows:
        - [氣候, 主要分布, 特徵, 植被]
        - [熱帶雨林, 赤道附近, 全年高溫多雨、年溫差小, 熱帶雨林]
        - [熱帶莽原, 熱帶雨林外側, 乾季、雨季分明, 莽原（草原夾雜樹木）]
        - [熱帶季風, 南亞、東南亞, 夏季多雨、冬季乾燥, 季風林]
        - [沙漠, 副熱帶高壓帶、大陸內部、寒流沿岸, 雨量極少、日溫差大, 沙漠植物]
        - [地中海型, 大陸西岸約緯度 30°～40°, 夏季乾熱、冬季溫和多雨, 硬葉林（橄欖、葡萄、柑橘）]
        - [溫帶海洋性, 大陸西岸約緯度 40°～60°, 全年有雨、冬暖夏涼、年溫差小, 溫帶落葉林]
        - [溫帶季風, 大陸東岸（例如東亞）, 夏季炎熱多雨、冬季寒冷乾燥, 落葉林、混合林]
        - [溫帶大陸性, 大陸內部, 冬冷夏熱、年溫差大、雨量較少, 溫帶草原]
        - [副極地, 北半球高緯大陸, 冬季漫長嚴寒, 針葉林（泰加林）]
        - [苔原, 北極海沿岸, 全年低溫、夏季短, 苔蘚、地衣]
D3:
  name: 產業區位、全球分工與區域特色
  summary: 產業區位看原料、市場、勞力、技術、交通哪一個最重要；全球分工讓研發、製造、市場分布在不同國家。
  must:
    - 產業分類：一級產業（農林漁牧礦）、二級產業（製造業、營造業）、三級產業（服務業）；經濟發展後，就業人口由一級移向二、三級產業。
    - 工業區位：原料導向（原料重量大、加工後失重多，例如水泥、製糖）、市場導向（產品容易腐壞或運費高，例如飲料、烘焙）、勞力導向（勞力密集，例如成衣、電子組裝）、技術導向（高科技產業，靠近大學與研究機構）、交通導向。
    - 集聚經濟：相關產業聚集在一起，可以共享基礎設施、勞動力與資訊（例如科學園區、產業聚落）；過度集中會造成地價上漲、交通壅塞等集聚不經濟。
    - 全球分工與供應鏈：研發、設計多在已開發國家，製造在成本較低的國家；跨國企業依成本與市場配置據點；近年供應鏈為了分散風險而重組。
    - 商業性農業：大規模、機械化、專業化生產（例如美國、澳洲）；自給性農業以自己食用為主。
    - 熱帶栽培業：殖民時期為了出口而發展的大規模單一作物種植（咖啡、可可、橡膠、香蕉、甘蔗），需要大量勞力。
    - 區域特色：東南亞（稻米、熱帶栽培業、新興製造業基地、東協）；南亞（人口多、印度資訊服務業）；西亞北非（石油、乾燥氣候、伊斯蘭文化）；歐洲（歐盟單一市場，西風與北大西洋暖流使西歐冬季溫和）；北美（大規模商業農業、高科技產業）；中南美洲（熱帶栽培業、礦產、亞馬遜雨林開發）；非洲（礦產與經濟作物出口，殖民遺留的單一作物經濟）。
    - 臺灣產業發展：1966 年設高雄加工出口區 → 1980 年設新竹科學園區 → 半導體與資通訊產業聚落；農業轉型發展精緻農業、休閒農業。
  steps:
    - 區位題：先找出這個產業最在意的成本（原料、運費、勞力、技術），再看地點是否符合。
    - 貿易流向題：依各區域的優勢（資源、勞力、技術）判斷誰出口什麼、進口什麼。
    - 圖表題：先看是比例還是總量，再看時間變化的趨勢。
  traps:
    - 高科技產業的區位重點是技術與人才，不是廉價勞力。
    - 產業外移不等於產業消失，可能只是把製造移出，留下研發與管理。
    - 熱帶栽培業是商業性農業，不是自給性農業。
D4:
  name: 聚落、都市與交通
  summary: 聚落依區位、機能與規模形成階層；交通網和通勤流量決定生活圈的範圍。
  must:
    - 聚落的區位條件：水源、地形（平原、河階、谷口、隘口）、交通要衝、防禦。
    - 都市化是都市人口比例增加；已開發國家都市化程度高、成長慢；開發中國家都市化快，常出現首要都市（人口過度集中在最大城市）與都市貧民窟。
    - 中地理論：提供商品或服務的地方稱為中地；高級中地數量少、服務範圍大，提供高級服務（醫學中心、大型百貨）；低級中地數量多、服務範圍小（便利商店）。
    - 門檻人口：維持一項服務所需的最少人口；商品圈範圍：消費者願意為這項服務移動的最大距離。
    - 都市內部：中心商業區（CBD）地價最高、白天人口多；郊區化是人口與機能往郊區移動；都市更新、仕紳化會改變舊市區的人口組成。
    - 生活圈：以通勤、通學、購物的流量劃分；交通改善（捷運、高鐵）會擴大生活圈，使兩地往來時間縮短（時空收斂）。
    - 運輸方式：價值高、重量輕、時效性強的貨物用空運；量大、笨重、價值低的貨物用海運；陸運適合中短程；貨櫃化與轉運港（樞紐港）提高海運效率。
    - 臺灣：六個直轄市形成主要都會區；高鐵 2007 年通車，帶動西部「一日生活圈」。
  steps:
    - 判斷中地等級：看服務的種類（日常用品或高級服務）、中地的數量與服務範圍。
    - 讀通勤流量圖：流量大的方向指向就業中心，可以據此劃分生活圈或都會區。
    - 選擇運輸方式：比較貨物的價值、重量、時效與運送距離。
  traps:
    - 門檻人口越大的服務，中地等級越高、數量越少。
    - 都市化「程度」高，不代表都市化「速度」快。
    - 郊區化是人口往郊區移動，不是整個都會區人口減少。
D5:
  name: 地形與自然環境
  summary: 先判斷地形的成因（侵蝕、堆積、溶蝕、火山、冰河、風力），再連結當地的氣候、水資源與人類利用。
  must:
    - 內營力（地殼變動、火山活動）使地表起伏；外營力（風化、侵蝕、搬運、堆積）把地表削平。
    - 河流地形：上游以侵蝕為主（V 型谷、峽谷、瀑布）；河流出山谷口形成沖積扇；中下游堆積形成氾濫平原、曲流、牛軛湖；河口形成三角洲。
    - 海岸地形：岩岸（海蝕崖、海蝕平台、海蝕洞）在侵蝕作用強的地方，例如臺灣東北角；沙岸（沙灘、沙洲、潟湖）在堆積作用強的地方，例如臺灣西南沿海；墾丁有珊瑚礁海岸。
    - 喀斯特地形：石灰岩被含二氧化碳的水溶蝕，形成溶蝕窪地、石灰岩洞、鐘乳石、石筍；地表水少、地下水系發達（例如中國桂林、越南下龍灣）。
    - 冰河地形：U 型谷、冰斗、峽灣（例如挪威）；風成地形：沙丘、風蝕地形，出現在乾燥地區。
    - 火山地形：火山錐、火山口、熔岩台地（例如臺灣北部的大屯火山群、澎湖的玄武岩方山）。
    - 臺灣地形：山地多，河川短、坡陡、流急、含沙量高，豐水期與枯水期流量差很大；有西部平原（嘉南平原）、盆地（臺北、臺中、埔里）、台地（林口、桃園）與東部的花東縱谷。
    - 天然災害：地震、颱風、豪雨引發崩塌與土石流；超抽地下水造成地層下陷；全球暖化使海平面上升。
  steps:
    - 看照片或地圖，先判斷是侵蝕還是堆積地形，再找出營力（河流、海浪、冰河、風、溶蝕）。
    - 再推人類活動：水資源、農業、聚落、觀光與災害風險。
  traps:
    - 沖積扇在河流出山谷口，三角洲在河口。
    - 喀斯特地形是「溶蝕」作用造成，地表水少。
    - 臺灣雨量雖多，但河短流急，水資源不容易保存。
D6:
  name: 人口與遷移
  summary: 人口轉型看出生率與死亡率的變化；人口金字塔反映年齡結構；遷移看推力、拉力與中間阻礙。
  must:
    - 人口成長＝自然增加（出生率－死亡率）＋社會增加（遷入－遷出）。
    - 人口金字塔：底部寬是年輕型（出生率高）；底部窄、頂部寬是老年型（少子高齡化）。
    - 65 歲以上人口占 7% 為高齡化社會、14% 為高齡社會、20% 為超高齡社會；臺灣 2018 年成為高齡社會，2025 年 12 月 65 歲以上人口達 20.06%，正式成為超高齡社會。
    - $\text{扶養比}=\dfrac{\text{0～14 歲人口}+\text{65 歲以上人口}}{\text{15～64 歲人口}}\times100$。
    - 遷移的推力：就業機會少、戰亂、災害；拉力：工作機會、所得、教育、安全；中間阻礙：距離、法律限制、文化差異。
    - 遷移類型：國際遷移（移工、難民、留學生）與國內遷移（鄉村到都市）；自願遷移與被迫遷移（大西洋奴隸貿易、難民）。
    - 殖民時期的熱帶栽培業需要大量勞力，帶動非洲奴隸與印度、華人契約勞工的遷移。
    - 人口政策：少子化國家鼓勵生育；中國過去實施一胎化政策，2016 年起放寬。
  steps:
    - 讀人口金字塔：先比較底部（幼年）與頂部（老年）的比例，判斷年輕型或老年型，再推人口轉型的階段。
    - 遷移題：列出推力與拉力，判斷遷移的方向與類型。
  traps:
    - 人口快速增加（第二階段）是因為死亡率下降，不是出生率上升。
    - 出生率低的國家，仍可能靠移入人口維持人口成長。
    - 扶養比高不一定是老年人多，也可能是幼年人口多。
  tables:
    - title: 人口轉型的四個階段
      rows:
        - [階段, 出生率, 死亡率, 人口成長]
        - [第一階段, 高, 高, 緩慢]
        - [第二階段, 高, 快速下降, 快速增加]
        - [第三階段, 下降, 低, 成長趨緩]
        - [第四階段, 低, 低, 停滯或負成長]
