# 自然重點整理：各觀念的必背（must）、解題步驟（steps）、易錯點（traps），可加表格（tables）。
# Claude 撰寫，老師審閱後可修改。觀念代碼對應 data/concepts/science.yaml；name、summary 會取代觀念樹的名稱與一句話重點。
# 依高中部定必修（物理、化學、生物、地球科學與自然科學探究與實作）整理；tools/notion_md.py 會產生物理、化學、生物、地球科學、探究與實作五頁。

P1:
  name: 力學、運動與能量
  summary: 先看清楚圖或題目給的是位置、速度還是加速度；合力決定加速度，只問前後狀態時用能量守恆最快。
  must:
    - 位移是向量（起點指向終點），路徑長是純量；$\text{平均速度}=\dfrac{\text{位移}}{\text{時間}}$，$\text{平均速率}=\dfrac{\text{路徑長}}{\text{時間}}$。
    - x–t 圖的斜率＝速度；v–t 圖的斜率＝加速度，與時間軸圍成的面積＝位移（在時間軸下方的面積算負）。
    - 等加速度運動：$v=v_0+at$、$x=v_0t+\dfrac{1}{2}at^2$、$v^2=v_0^2+2ax$；自由落體的加速度 $g\approx9.8\,\mathrm{m/s^2}$，方向向下。
    - 牛頓第一定律（慣性）：合力為零時，物體保持靜止或等速度直線運動。
    - 牛頓第二定律：$F_{\text{合}}=ma$；合力的方向就是加速度的方向，不一定是運動方向。
    - 牛頓第三定律：作用力與反作用力大小相等、方向相反，作用在「兩個不同的物體」上，所以不會互相抵消。
    - 重量 $W=mg$；質量是物體本身的性質，到月球上質量不變、重量變小。
    - 萬有引力 $F=\dfrac{GMm}{r^2}$：與兩物體質量乘積成正比、與距離平方成反比；地表的重力加速度 $g=\dfrac{GM}{R^2}$。
    - 等速率圓周運動：速度方向一直改變，所以有加速度，加速度指向圓心、大小 $\dfrac{v^2}{r}$；向心力由重力、張力、摩擦力等提供。
    - 克卜勒定律：①行星軌道是橢圓，太陽在一個焦點上 ②行星與太陽的連線在相同時間掃過相同面積（近日點快、遠日點慢）③週期平方與軌道半長軸立方成正比（$T^2\propto a^3$）。
    - 功 $W=F\cdot d\cdot\cos\theta$（力與位移垂直時不做功）；動能 $K=\dfrac{1}{2}mv^2$；重力位能 $U=mgh$；合力做的功＝動能的變化。
    - 只有重力或彈力做功時，力學能（動能＋位能）守恆；有摩擦時，減少的力學能變成熱能，總能量仍守恆。
    - 功率 $P=\dfrac{W}{t}$，單位瓦特（W＝J/s）；1 度電 $=1\,\mathrm{kW\cdot h}=3.6\times10^6\,\mathrm{J}$。
    - 國際單位制（SI）有七個基本量：長度（公尺 m）、質量（公斤 kg）、時間（秒 s）、電流（安培 A）、溫度（克耳文 K）、物質的量（莫耳 mol）、發光強度（燭光 cd）；其他單位都由基本單位導出，例如 $1\,\mathrm{N}=1\,\mathrm{kg\cdot m/s^2}$、$1\,\mathrm{J}=1\,\mathrm{N\cdot m}$。
    - 伽利略之前，亞里斯多德認為重的物體落得比較快、要持續施力物體才會運動；伽利略用斜面實驗和思想實驗推論：沒有摩擦時，運動的物體會一直運動下去（慣性），不計空氣阻力時輕重物體同時落地。
    - 常見的力：正向力（垂直接觸面）、摩擦力（靜摩擦力隨外力改變，最大靜摩擦力略大於動摩擦力）、彈力（在彈性限度內，彈簧的伸長量和受力成正比）、張力。
    - 拋體運動：水平方向不受力、做等速運動，鉛直方向做自由落體，兩個方向互不影響；從同一高度水平拋出和自由落下的物體同時落地。
    - 熱是因為溫度不同而傳遞的能量；物體內原子的動能與原子之間的交互作用能合稱熱能。克氏溫度 $T(\mathrm{K})=t(^{\circ}\mathrm{C})+273$；定量理想氣體的內能只和絕對溫度有關。
    - 功很容易全部變成熱（例如摩擦生熱），熱卻無法全部變成功；能量總量守恆，但每轉換一次，可以用來作功的能量通常會減少，所以能量一樣的系統，作功的能力不一定相同。
  steps:
    - 先畫出物體受的每一個力（重力、正向力、摩擦力、張力），求出合力，再用 $F=ma$ 求加速度。
    - 運動圖：先看縱軸是 x、v 還是 a；要位移就算 v–t 圖的面積，要加速度就看 v–t 圖的斜率。
    - 只問速率或高度、不問時間時，優先用能量守恆：初動能＋初位能＝末動能＋末位能（＋摩擦產生的熱）。
    - 天體題：用比例算最快，例如距離變 2 倍，引力變 $\dfrac{1}{4}$；軌道半徑越大，公轉週期越長。
  traps:
    - 速度為零時加速度不一定為零：上拋到最高點時速度是 0，加速度仍是 g、向下。
    - 等速率圓周運動的速率不變，但速度一直在變，所以合力不為零。
    - 作用力與反作用力作用在不同物體上，不能互相抵消；互相抵消的「平衡力」作用在同一個物體上。
    - 物體在運動不代表一直有力在推它：沒有摩擦時，等速運動不需要外力。
    - 單位要統一成公尺、公斤、秒；km/h 換成 m/s 要除以 3.6。
P2:
  name: 電與磁
  summary: 電荷產生電場、電流產生磁場、變化的磁場產生感應電流；判斷方向用右手定則和冷次定律。
  must:
    - 庫侖定律 $F=\dfrac{kq_1q_2}{r^2}$：同性相斥、異性相吸，與距離平方成反比。
    - 電場 $E=\dfrac{F}{q}$，方向是正電荷受力的方向；電力線由正電荷出發、指向負電荷，越密集電場越強。
    - 電流 $I=\dfrac{Q}{t}$（安培 A＝C/s）；歐姆定律 $V=IR$；電功率 $P=IV=I^2R=\dfrac{V^2}{R}$。
    - 串聯：電流相同、電壓分配，總電阻 $R=R_1+R_2$；並聯：電壓相同、電流分配，$\dfrac{1}{R}=\dfrac{1}{R_1}+\dfrac{1}{R_2}$（家用電器都是並聯）。
    - 電流的磁效應（厄斯特）：長直導線周圍的磁場是同心圓；螺線管內部的磁場近似均勻，像一根磁棒。
    - 磁場對電流（或運動中的帶電粒子）有作用力，方向和電流、磁場都垂直；這是馬達（電動機）的原理。
    - 電磁感應（法拉第）：通過線圈的磁通量「改變」時，產生感應電動勢與感應電流；改變得越快，感應電動勢越大。
    - 冷次定律：感應電流產生的磁場會反抗磁通量的變化（磁鐵靠近線圈時互相排斥、遠離時互相吸引）。
    - 發電機把力學能轉成電能；變壓器只能用在交流電，電壓比＝線圈匝數比；高壓輸電可以讓電流變小，減少線路發熱的損耗（$P_{\text{損}}=I^2R$）。
    - 馬克士威預測、赫茲證實電磁波存在；電磁波在真空中的速率 $c=3\times10^8\,\mathrm{m/s}$。依波長由長到短：無線電波、微波、紅外線、可見光、紫外線、X 射線、$\gamma$ 射線。
    - 用電安全：同時使用太多電器會使總電流過大、電線過熱，要裝保險絲或無熔絲開關自動斷電；短路是電流沒有經過電器而直接流回，電阻很小、電流極大；金屬外殼的電器要接地，漏電斷路器偵測到漏電會自動斷電。
    - 變動的磁場會產生電場（電磁感應），變動的電場也會產生磁場；所有電磁現象都可以用馬克士威方程式統整描述。
    - 電磁波的應用：無線電波（廣播、通訊）、微波（微波爐、手機通訊、雷達）、紅外線（遙控器、熱影像）、紫外線（殺菌）、X 射線（醫學影像、行李檢查）、$\gamma$ 射線（放射治療）；電磁波帶有能量，手機就是用電磁波傳遞訊息。
  steps:
    - 電路題：先分出哪些元件串聯、哪些並聯，算出總電阻，再用 $V=IR$ 求電流或電壓。
    - 判斷磁場方向：直導線用右手握住，拇指指電流方向，四指彎曲的方向就是磁場方向；螺線管四指沿電流方向彎，拇指指的是 N 極。
    - 判斷感應電流方向：①原來的磁場往哪個方向、磁通量變大還是變小 ②感應電流的磁場要反抗這個變化 ③再用右手定則找出電流方向。
  traps:
    - 磁通量很大但不變時不會產生感應電流，要「改變」才會。
    - 變壓器不能改變直流電的電壓；理想變壓器輸入、輸出的功率相同，電壓升高時電流變小。
    - 電子帶負電，受力方向和電場方向相反。
    - 所有電磁波在真空中都以光速前進，差別在頻率和波長；聲波不是電磁波。
P3:
  name: 原子、量子與基本交互作用
  summary: 三條主線：四種基本交互作用的強弱與作用範圍、原子模型的演進、光的粒子性與電子的波動性。
  must:
    - 四種基本交互作用由強到弱：強力（把質子和中子束縛在原子核內，作用範圍約 $10^{-15}$ m）＞電磁力＞弱力（造成 $\beta$ 衰變）＞重力（最弱，但作用範圍無限遠，主宰天體運動）。
    - 摩擦力、正向力、張力、彈力等接觸力，本質都是原子之間的電磁力。
    - 原子模型的演進：湯姆森發現電子 → 拉塞福 $\alpha$ 粒子散射實驗（大部分直接穿過、極少數大角度反彈）⇒ 原子中心有體積很小、帶正電、質量集中的原子核 → 波耳模型：電子只能在特定的能階上，在能階間躍遷時放出或吸收特定能量的光。
    - 每種元素有自己的線光譜（像指紋）：發射光譜是暗背景上的亮線，吸收光譜是連續光譜上的暗線，同一元素的亮線與暗線位置相同。
    - 原子核由質子和中子組成；質子、中子再由夸克組成（質子 uud、中子 udd）。
    - 光子能量 $E=hf=\dfrac{hc}{\lambda}$：頻率越高（波長越短），能量越大；紫外線光子的能量比紅外線大。
    - 光電效應（愛因斯坦光子說）：光的頻率超過底限頻率才打得出電子；增加光的強度只會增加打出的電子數，不會增加電子的最大動能 ⇒ 光有粒子性。
    - 物質波（德布羅意）：$\lambda=\dfrac{h}{p}=\dfrac{h}{mv}$；電子束通過晶體會出現繞射圖樣 ⇒ 電子有波動性（電子顯微鏡的原理）。
    - 波粒二象性：光和電子都同時具有波動性與粒子性。
    - 質能互換 $E=mc^2$：核分裂（重原子核分裂，例如鈾-235，核電廠）與核融合（輕原子核結合，例如太陽中的氫融合成氦）都因為反應後質量減少而放出能量。
    - 原子的大小約 $10^{-10}$ m，原子核約 $10^{-15}$ m，相差約十萬倍：原子內部大部分是空的。
    - 電子雙狹縫實驗：電子一個一個射出，累積後仍出現干涉條紋 ⇒ 電子有波動性；在原子尺度以下，牛頓運動定律不適用，要用量子力學描述。
    - 光電效應的應用：太陽能電池、光感測器（自動門、相機的感光元件）把光轉換成電訊號。
    - 核能發電：鈾-235 原子核吸收一個中子後分裂，放出能量和 2～3 個中子，可以引發連鎖反應；核電廠用控制棒吸收中子，控制反應的快慢。
    - 游離輻射的穿透力：$\alpha$ 射線（氦原子核）一張紙就能擋住；$\beta$ 射線（電子）可被鋁板擋住；$\gamma$ 射線（電磁波）穿透力最強，要用鉛板或厚混凝土。人體吸收輻射的劑量單位是西弗（Sv），生活中本來就有天然的背景輻射。
    - 近代物理的女性科學家：居禮夫人發現放射性元素釙和鐳；麥特納提出核分裂的理論解釋；吳健雄以實驗證實弱作用中宇稱不守恆。
  steps:
    - 比較交互作用：先看是哪兩種粒子、距離多大：原子核內是強力，原子與分子之間是電磁力，天體之間是重力。
    - 光電效應題：打不打得出電子只看頻率；打出的電子多不多看光的強度。
    - 光譜題：比對亮線或暗線的位置，就能判斷氣體或恆星大氣中有哪些元素。
  traps:
    - 頻率不夠高時，光再強也打不出電子。
    - 「波長越長、光子能量越大」是錯的：光子能量與頻率成正比、與波長成反比。
    - 重力最弱，但只會互相吸引、作用範圍無限遠，所以天體運動由重力主宰；電磁力雖強，但天體大多是電中性。
    - 核反應前後質量數與電荷數守恆，但「質量」會減少，減少的質量變成能量。
P4:
  name: 波動、聲音與光
  summary: 波傳遞的是能量和波形，不是介質；$v=f\lambda$，波進入不同介質時頻率不變，波速和波長改變。
  must:
    - 橫波：介質振動方向和波前進方向垂直（繩波、電磁波）；縱波：介質振動方向和前進方向平行（聲波）。
    - 波速 $v=f\lambda$，週期 $T=\dfrac{1}{f}$；頻率由波源決定，波速由介質決定。
    - 反射、折射、干涉、繞射是波的共同性質；狹縫寬度和波長差不多時繞射最明顯；波峰遇波峰互相加強（建設性干涉），波峰遇波谷互相抵消（破壞性干涉）。
    - 聲音：響度由振幅決定、音調由頻率決定、音色由波形決定；聲速在固體＞液體＞氣體，空氣溫度越高聲速越快（20°C 時約 343 m/s）。
    - 人耳可聽到的頻率約 20～20000 Hz；超過 20000 Hz 是超聲波（超音波檢查、聲納）。
    - 都卜勒效應：波源與觀察者互相接近時，接收到的頻率變高（光的藍移）；互相遠離時頻率變低（光的紅移）。遠方星系的光譜紅移 ⇒ 宇宙在膨脹。
    - 光的反射：入射角＝反射角；平面鏡成正立、等大的虛像。
    - 光的折射：光從傳播較快的介質進入較慢的介質（例如空氣→水）會偏向法線；只有光從較慢的介質射向較快的介質、入射角大於臨界角時，才會全反射（光纖的原理）。
    - 色散：白光通過三稜鏡分成各色光，紫光偏折最多、紅光最少（彩虹也是色散）。
    - 光的本質之爭：牛頓的微粒說與惠更斯的波動說；楊氏雙狹縫干涉實驗支持波動說；後來光電效應又顯示光有粒子性。
    - 惠更斯原理：波前上的每一點都可以看成新的波源，發出子波，這些子波共同的包絡面就是下一刻的波前；可以解釋波的前進、折射、干涉與繞射。
    - 用波動說解釋折射：光從空氣進入水中速率變慢，波前轉向，所以折射光偏向法線；微粒說卻預測光在水中比較快，後來測得光在水中較慢，支持波動說。
    - 都卜勒效應的應用：測速槍、都卜勒超音波（測血流速度）、氣象雷達，以及由星系光譜的紅移判斷星系正在遠離。
  steps:
    - 先判斷是橫波還是縱波、在哪種介質中傳播，再用 $v=f\lambda$ 計算。
    - 波換介質時先寫下「頻率不變」，再由波速的變化推出波長的變化。
    - 都卜勒題只要問「接近還是遠離」：接近 → 頻率變高、波長變短；遠離 → 頻率變低、波長變長。
  traps:
    - 介質只在原地振動，沒有跟著波一起前進。
    - 聲音不能在真空中傳播，光可以。
    - 都卜勒效應改變的是「接收到的」頻率，波源本身發出的頻率沒有變。
    - 光從水中射向空氣才可能全反射，從空氣射向水不會。
C1:
  name: 化學計量、反應與熱化學
  summary: 所有化學計算都先換成莫耳數，再依係數比計算；反應熱和莫耳數成正比。
  must:
    - 1 莫耳 $=6.02\times10^{23}$ 個粒子（亞佛加厥數）；$\text{莫耳數}=\dfrac{\text{質量}}{\text{莫耳質量}}$（g/mol，數值等於原子量或分子量）。
    - 常用原子量：H 1、C 12、N 14、O 16（其他元素題目通常會提供）。
    - 平衡的反應式中，係數比＝莫耳數比；同溫同壓的氣體，係數比也等於體積比；反應前後原子的種類與數目不變（質量守恆）。
    - 限量試劑：各反應物的莫耳數÷係數，比值最小的最先用完，產物的量由它決定。
    - 濃度：體積莫耳濃度 $M=\dfrac{\text{溶質莫耳數}}{\text{溶液體積（L）}}$；$\text{重量百分率}=\dfrac{\text{溶質質量}}{\text{溶液質量}}\times100\%$；$\text{ppm}=\dfrac{\text{溶質質量}}{\text{溶液質量}}\times10^6$。
    - 實驗式（簡式）是原子數的最簡整數比；$\text{分子式}=\text{實驗式}\times n$，n 由分子量決定。
    - 燃燒分析：有機物完全燃燒，C 全部變成 $\mathrm{CO_2}$、H 全部變成 $\mathrm{H_2O}$；由產物質量反推 C、H 的質量，剩下的質量就是 O。
    - 放熱反應 $\Delta H<0$（燃燒、中和、呼吸作用），吸熱反應 $\Delta H>0$（光合作用、電解、大部分的分解反應）。
    - 反應熱和莫耳數成正比：反應式乘 2，$\Delta H$ 也乘 2；反應式倒過來寫，$\Delta H$ 變號；總反應熱＝各步驟反應熱的和（赫斯定律）。
    - 相變也有熱：熔化、汽化吸熱，凝固、液化放熱；加熱到熔點或沸點時溫度不變，熱量用來改變狀態。
    - 拉瓦節用定量實驗證實質量守恆定律，並提出元素是物質最基本的組成；道耳頓根據質量守恆、定比定律與倍比定律提出原子說。
    - 定比定律：同一種化合物，各元素的質量比固定（水中氫與氧的質量比是 1：8）；倍比定律：兩種元素形成不同的化合物時，與固定質量的某元素化合的另一元素，質量成簡單整數比（CO 與 $\mathrm{CO_2}$ 中，與等量碳結合的氧質量比是 1：2）。
    - 氣體的性質：定溫下壓力和體積成反比（波以耳定律）；定壓下體積和絕對溫度成正比（查理定律）；同溫同壓下，相同體積的氣體含有相同數目的分子（亞佛加厥定律）。
    - 0°C、1 大氣壓時，1 莫耳氣體的體積約 22.4 L（25°C 時約 24.5 L）。
    - 反應速率：濃度越大、溫度越高、接觸面積越大（粉末比塊狀快），或加入催化劑，反應越快；催化劑本身在反應前後不變。
  steps:
    - ①寫出平衡的反應式 ②把已知的質量、體積、濃度換成莫耳數 ③用係數比求出目標物的莫耳數 ④換回題目要的單位。
    - 題目同時給兩種反應物的量時，先找出限量試劑。
    - 熱量題：$Q=\text{莫耳數}\times\text{每莫耳的反應熱}$；過程中若升溫到熔點或沸點，還要加上改變狀態所需的熱。
  traps:
    - 係數比是莫耳數比，不是質量比。
    - 體積莫耳濃度的分母是「溶液」體積，不是溶劑（水）的體積。
    - $\Delta H$ 是負值代表放熱；題目問「放出多少熱量」時要答正值。
    - 產物的量由限量試劑決定，不是由過量的反應物決定。
  tables:
    - title: 常用換算
      rows:
        - [已知, 換成莫耳數]
        - [質量 m（g）, '$m\div\text{莫耳質量}$']
        - [粒子數 N, '$N\div(6.02\times10^{23})$']
        - [溶液濃度 M、體積 V（L）, $M\times V$]
C2:
  name: 溶液、酸鹼與氧化還原
  summary: $\mathrm{pH}=-\log[\mathrm{H^+}]$，$[\mathrm{H^+}]$ 差 10 倍、pH 差 1；中和看 $\mathrm{H^+}$ 與 $\mathrm{OH^-}$ 的莫耳數；氧化是失去電子，還原是得到電子。
  must:
    - 溶解度：一定溫度下飽和溶液中溶質的量；大多數固體溫度越高溶解度越大，氣體則相反（溫度越高、溶得越少；壓力越大、溶得越多）。
    - 電解質：溶於水後能導電（離子化合物、酸、鹼）；非電解質：葡萄糖、蔗糖、酒精。
    - 阿瑞尼斯酸鹼：酸在水中產生 $\mathrm{H^+}$，鹼產生 $\mathrm{OH^-}$；強酸（HCl、$\mathrm{HNO_3}$、$\mathrm{H_2SO_4}$）、強鹼（NaOH、KOH）在水中完全解離，弱酸（醋酸）只部分解離。
    - 25°C 時 $[\mathrm{H^+}][\mathrm{OH^-}]=10^{-14}$；$\mathrm{pH}=-\log[\mathrm{H^+}]$，$\mathrm{pH}+\mathrm{pOH}=14$；pH $<7$ 酸性、$=7$ 中性、$>7$ 鹼性。
    - $[\mathrm{H^+}]$ 相差 10 倍，pH 相差 1；強酸稀釋 10 倍，pH 增加 1，但再怎麼稀釋也不會超過 7。
    - 中和：$\mathrm{H^+}+\mathrm{OH^-}\to\mathrm{H_2O}$；酸提供的 $\mathrm{H^+}$ 莫耳數＝鹼提供的 $\mathrm{OH^-}$ 莫耳數時恰好中和（一個 $\mathrm{H_2SO_4}$ 可提供 2 個 $\mathrm{H^+}$）。
    - 指示劑：酚酞在酸性、中性時無色，鹼性（pH 約 8.2 以上）變紅；石蕊試紙遇酸變紅、遇鹼變藍；廣用指示劑依 pH 由紅、橙、黃、綠變到藍紫。
    - 氧化＝失去電子（或得到氧），還原＝得到電子（或失去氧），兩者同時發生；被氧化的物質是還原劑，被還原的物質是氧化劑。
    - 金屬活性：$\mathrm{K>Na>Ca>Mg>Al>Zn>Fe>Pb>(H)>Cu>Hg>Ag>Au}$；活性大的金屬能把活性小的金屬離子還原出來（鐵放進硫酸銅溶液，表面析出銅）。
    - 電池：活性較大的金屬當負極，被氧化、放出電子，電子經導線流向正極，把化學能轉成電能；電解則是用電能使反應發生，例如電解水產生的氫氣和氧氣體積比 2：1。
    - 常見的氧化劑：氧氣、氯氣、過氧化氫、過錳酸鉀（$\mathrm{KMnO_4}$）；常見的還原劑：活性大的金屬（Na、Mg、Zn）、氫氣、碳、一氧化碳、維生素 C。
    - 飽和溶液中溶解和結晶的速率相等，達到溶解平衡；降低溫度或蒸發溶劑，可以讓溶質結晶析出。
    - 混合物的分離：過濾（分開固體和液體）、蒸餾（利用沸點不同，例如製造蒸餾水、分餾石油）、萃取（利用溶質在兩種不互溶溶劑中的溶解度不同，例如用正己烷萃取碘水中的碘）、色層分析（利用各成分移動的快慢不同，例如分離葉片色素）。
    - 硬水含較多 $\mathrm{Ca^{2+}}$、$\mathrm{Mg^{2+}}$，會讓肥皂不易起泡、產生水垢；可用煮沸（只能除去暫時硬水）、加碳酸鈉沉澱或離子交換樹脂軟化。海水淡化可用蒸餾或逆滲透。
  steps:
    - 算 pH：先求溶液中的 $[\mathrm{H^+}]$（強酸 $[\mathrm{H^+}]=\text{酸的濃度}\times\text{每個分子可解離的 H 數}$），再取 $-\log$。
    - 酸鹼混合：比較 $\mathrm{H^+}$ 和 $\mathrm{OH^-}$ 的莫耳數，多的一方剩下來，除以混合後的總體積求濃度，再算 pH。
    - 氧化還原：寫出每種元素反應前後的電子得失（或氧化數），氧化數升高的被氧化，降低的被還原。
  traps:
    - pH 是對數：pH 3 的 $[\mathrm{H^+}]$ 是 pH 5 的 100 倍。
    - 酸溶液加水稀釋，pH 只會接近 7，不會變成鹼性。
    - 「恰好中和」指 $\mathrm{H^+}$ 與 $\mathrm{OH^-}$ 的莫耳數相當，溶液不一定是 pH 7（強酸和弱鹼中和後偏酸性）。
    - 濃度相同時，弱酸的 $[\mathrm{H^+}]$ 比強酸小，pH 比較大。
C3:
  name: 原子結構與週期表
  summary: 原子序＝質子數，決定是哪一種元素；週期表同一族的價電子數相同、化學性質相似。
  must:
    - 原子＝原子核（質子＋中子）＋電子；原子序＝質子數；質量數＝質子數＋中子數；中性原子的電子數＝質子數。
    - 同位素：質子數相同、中子數不同（例如 ${}^{12}\mathrm{C}$ 與 ${}^{14}\mathrm{C}$；氫、氘、氚），化學性質幾乎相同，質量不同。
    - 原子量是各種同位素的質量依天然含量比例算出的加權平均。
    - 前 20 號元素的電子排列：第 1 層最多 2 個、第 2 層最多 8 個、第 3 層排到 8 個；最外層電子（價電子）決定化學性質。
    - 週期表：同一週期（橫列）的電子層數相同；同一族（直行）的價電子數相同，化學性質相似。
    - 第 1 族鹼金屬（Li、Na、K）價電子 1 個，容易失去而成為 +1 離子，與水劇烈反應產生氫氣和鹼；第 2 族鹼土金屬成為 +2 離子。
    - 第 17 族鹵素（F、Cl、Br、I）容易得到 1 個電子成為 $-1$ 離子；第 18 族惰性氣體最外層電子填滿，化學性質很穩定。
    - 週期趨勢：同週期由左到右，原子半徑變小、陰電性變大；同族由上到下，原子半徑變大、金屬性變強。
    - 金屬元素在週期表左下方，非金屬在右上方；兩者交界附近的類金屬（如 Si）可作半導體。
    - 原子模型的演進：道耳頓（原子不可分割）→ 湯姆森（發現電子）→ 拉塞福（原子核）→ 波耳（電子能階）→ 量子力學（電子雲）。
    - 門得列夫依原子量排列元素，並預留空位、預測未發現元素的性質；現代週期表改依原子序排列。
  steps:
    - 判斷元素性質：由原子序寫出電子排列，找出價電子數，對到週期表的族，再推它容易形成的離子。
    - 比較原子半徑：先比電子層數（層數多的比較大）；層數相同時，質子多的對電子吸引力大，半徑比較小。
  traps:
    - 同位素是質子數相同、中子數不同，所以原子序相同、質量數不同。
    - 同週期由左到右原子半徑「變小」，不是原子序越大原子就越大。
    - 離子的電子數不等於質子數：$\mathrm{Na^+}$ 有 11 個質子、10 個電子。
C4:
  name: 物質結構與鍵結
  summary: 由組成判斷鍵結：金屬＋非金屬多為離子鍵，非金屬之間是共價鍵，金屬之間是金屬鍵；鍵結和結構決定熔點與導電性。
  must:
    - 離子鍵：金屬陽離子和非金屬陰離子靠靜電力互相吸引（例如 NaCl）。
    - 共價鍵：非金屬原子之間共用電子對（例如 $\mathrm{H_2O}$、$\mathrm{CO_2}$、$\mathrm{CH_4}$）；分子內的共價鍵很強，但分子與分子之間的作用力弱。
    - 共價網狀固體：所有原子以共價鍵連成巨大的網狀結構（鑽石、石墨、二氧化矽 $\mathrm{SiO_2}$），熔點很高。
    - 金屬鍵：金屬陽離子排成晶格，價電子在其間自由移動，所以金屬能導電、導熱、有延展性與金屬光澤。
    - 同素異形體：同一種元素組成、結構不同的物質，例如鑽石、石墨、石墨烯、$\mathrm{C_{60}}$、奈米碳管；$\mathrm{O_2}$ 與 $\mathrm{O_3}$。
    - 氫鍵：H 接在 N、O、F 上的分子之間有較強的吸引力，使水的沸點特別高，冰的密度比水小（冰浮在水面上）。
    - 純物質（元素、化合物）組成固定，有固定的熔點、沸點；混合物（溶液、空氣、合金）組成不固定。
    - 聚合物由許多單體重複連接而成，例如塑膠、尼龍、蛋白質、澱粉、纖維素。
    - 物質的三相圖：橫軸是溫度、縱軸是壓力，三條曲線分出固、液、氣三區；三條曲線的交點（三相點）三相共存。水的熔化曲線向左傾斜，加壓會使冰的熔點降低；1 大氣壓下二氧化碳沒有液態，乾冰直接昇華。
  steps:
    - 先看組成元素是金屬還是非金屬，判斷是離子化合物、分子、網狀固體還是金屬。
    - 比較熔沸點：網狀固體最高，離子晶體和大多數金屬次之，分子物質最低；分子物質之間再比分子間作用力（有氫鍵的、分子量大的比較高）。
    - 判斷能不能導電：要有可以自由移動的帶電粒子（金屬的自由電子，或熔融態、水溶液中的離子）。
  traps:
    - 離子晶體在固態時不導電，熔融或溶於水後才導電。
    - 石墨是共價網狀固體卻能導電（層狀結構中有可移動的電子），鑽石不能導電。
    - 「分子量越大、熔點越高」只適用於結構相似的分子物質，不能拿來比較網狀固體或離子晶體。
    - 水沸騰時破壞的是水分子之間的作用力（氫鍵），不是分子內的 O–H 共價鍵。
  tables:
    - title: 四種固體的比較
      rows:
        - [類型, 組成粒子, 熔點, 導電性, 例子]
        - [離子晶體, 陽離子與陰離子, 高, 固態不導電、熔融或水溶液導電, NaCl、CaO]
        - [分子物質, 分子, 低, 不導電, 冰、乾冰、碘]
        - [共價網狀固體, 原子, 很高, 不導電（石墨例外）, '鑽石、石英 $\mathrm{SiO_2}$']
        - [金屬, 金屬陽離子與自由電子, 大多高, 導電, 鐵、銅、鋁]
C5:
  name: 化學與生活、環境
  summary: 生活中的化學看結構與用途：界面活性劑一端親油、一端親水；環境題依序說出「汙染物 → 化學反應 → 影響 → 防治」。
  must:
    - 醣類（澱粉、纖維素都由葡萄糖聚合而成）主要提供能量；蛋白質由胺基酸以肽鍵連接而成，構成身體並作為酵素；油脂由甘油和脂肪酸形成，可以儲存能量；核酸（DNA、RNA）由核苷酸聚合而成，攜帶遺傳訊息。
    - 界面活性劑（肥皂、清潔劑）的分子一端親油（長碳鏈）、一端親水；在水中親油端包住油汙形成微膠粒，讓油汙分散到水中被沖走。肥皂在硬水中會和 $\mathrm{Ca^{2+}}$、$\mathrm{Mg^{2+}}$ 形成沉澱，合成清潔劑比較不受影響。
    - 肥皂的製造：油脂和氫氧化鈉一起加熱水解（皂化反應），產生肥皂（脂肪酸鈉）和甘油。
    - 自來水的處理：混凝（加入明礬等凝聚劑，使細小雜質聚集）→ 沉澱 → 過濾 → 消毒（加氯）；工業廢水要先去除重金屬與有機物，再回收利用或排放。
    - 常見藥品：阿司匹靈（解熱鎮痛）、制酸劑（含氫氧化鋁、碳酸氫鈉等弱鹼，中和胃酸）、抗生素（例如盤尼西林，抑制細菌）；抗生素對病毒無效，濫用會產生抗藥性細菌。
    - 酸雨：燃燒化石燃料產生的 $\mathrm{SO_2}$、$\mathrm{NO_x}$ 在大氣中形成硫酸、硝酸；自然雨水因溶有 $\mathrm{CO_2}$，pH 約 5.6，臺灣以 pH 小於 5.0 為酸雨。酸雨會腐蝕建築與金屬、使湖泊和土壤酸化；防治靠燃煤脫硫、汽機車加裝觸媒轉化器、減少使用化石燃料。
    - 臭氧層破洞：氟氯碳化物（CFCs，舊式冷媒、噴霧劑）在平流層受紫外線照射放出氯原子，連鎖破壞臭氧，使到達地面的紫外線增加；1987 年的蒙特婁議定書開始管制 CFCs。
    - 全球暖化：主要溫室氣體有 $\mathrm{CO_2}$、$\mathrm{CH_4}$、$\mathrm{N_2O}$、氟氯碳化物與水氣；因應方式是減少排放（節能、再生能源、碳捕捉）與調適；國際協議有京都議定書（1997）、巴黎協定（2015）。
    - 永續發展：滿足當代的需求，又不危及下一代的發展；綠色化學從源頭減少汙染，例如使用無毒的原料、提高原料的利用率、讓產物可以分解。
    - 碳循環：植物行光合作用吸收 $\mathrm{CO_2}$，生物的呼吸、分解作用與燃燒放出 $\mathrm{CO_2}$；海洋溶解大量 $\mathrm{CO_2}$，石灰岩與化石燃料是長期儲存碳的地方。
    - 新興與替代能源：太陽能、風力、水力、地熱、生質能、海洋能與氫能；氫氣燃燒只產生水，燃料電池把化學能直接轉換成電能。臺灣近年以太陽光電和離岸風電為發展重點。
  steps:
    - 環境題：先找出汙染物，再寫出它發生的化學反應，最後連結影響與防治方法。
    - 判斷清潔的原理：看分子哪一端親水、哪一端親油，親油端朝向油汙。
    - 比較能源：看是否可以再生、是否排放溫室氣體或汙染物，以及供電是否穩定。
  traps:
    - 臭氧層破洞和全球暖化是兩件事：破洞讓到達地面的紫外線增加；暖化是溫室氣體吸收紅外線。
    - 雨水本來就是弱酸性（pH 約 5.6），不是 pH 小於 7 就叫酸雨。
    - 生質燃料燃燒仍會排放 $\mathrm{CO_2}$，只是植物生長時吸收過，比較接近碳中和，並不是完全不排碳。
B1:
  name: 細胞構造與細胞分裂
  summary: 有絲分裂產生兩個相同的體細胞；減數分裂產生四個染色體數減半的配子，同源染色體配對只發生在減數分裂。
  must:
    - 細胞學說：生物都由細胞構成；細胞是構造與功能的基本單位；細胞由原有的細胞分裂而來。
    - 原核細胞（細菌、藍綠菌）沒有核膜和膜狀胞器，但有細胞膜和核糖體；真核細胞有細胞核和粒線體、內質網、高基氏體等胞器。
    - 胞器功能：細胞核（存放 DNA）、粒線體（細胞呼吸、產生 ATP）、葉綠體（光合作用）、核糖體（合成蛋白質）、內質網（合成與運輸）、高基氏體（加工、包裝、分泌）、液胞（儲存）、溶體（分解）。
    - 植物細胞有細胞壁、葉綠體和大型液胞；動物細胞有中心粒。
    - 細胞膜由磷脂雙層與蛋白質組成，具選擇透過性；擴散（高濃度往低濃度）和滲透（水往溶質濃度高的一側移動）不耗能，主動運輸逆濃度移動、要消耗 ATP。
    - 細胞週期：間期（G1 期 → S 期複製 DNA → G2 期）占大部分時間，接著是分裂期（前、中、後、末期）與細胞質分裂。
    - 有絲分裂：1 個細胞分裂成 2 個，染色體數不變（2n→2n），遺傳物質相同；用於生長、修補與無性生殖。
    - 減數分裂：連續分裂兩次，1 個細胞變成 4 個，染色體數減半（2n→n）；減數分裂Ⅰ同源染色體配對（聯會）、可能互換、再分開；減數分裂Ⅱ姊妹染色分體分開。
    - 人類體細胞有 46 條染色體（22 對體染色體＋1 對性染色體 XX 或 XY），配子有 23 條。
    - 觀察有絲分裂常用洋蔥根尖的分生組織；顯微鏡下大部分細胞處於間期。
    - 細胞學說的發展：虎克用顯微鏡觀察軟木塞，命名「細胞」；許來登（植物）與許旺（動物）提出生物都由細胞構成；魏修補充「細胞都來自原有的細胞」。
    - 細胞分化：受精卵經過有絲分裂增加細胞數目，再經細胞分化形成形態、功能不同的細胞；各種體細胞的遺傳物質相同，只是表現的基因不同。
  steps:
    - 判斷分裂方式：看有沒有同源染色體配對、子細胞的染色體數有沒有減半。
    - 算染色體數與 DNA 量：S 期 DNA 複製後 DNA 量加倍，但染色體「條數」要到後期著絲點分開時才加倍。
    - 判斷物質運輸方式：看是否逆濃度、是否消耗能量、是否需要膜上的蛋白質協助。
  traps:
    - DNA 複製發生在間期（S 期），不在分裂期。
    - 減數分裂Ⅰ結束時染色體數就已經減半；減數分裂Ⅱ只是姊妹染色分體分開。
    - 細菌是原核生物，但仍有細胞膜和核糖體；病毒不是細胞。
    - 滲透作用中移動的是水，不是溶質。
  tables:
    - title: 有絲分裂與減數分裂
      rows:
        - [比較, 有絲分裂, 減數分裂]
        - [分裂次數, 1 次, 連續 2 次]
        - [子細胞數, 2 個, 4 個]
        - [染色體數, 不變（2n→2n）, 減半（2n→n）]
        - [同源染色體配對, 沒有, 有（減數分裂Ⅰ）]
        - [發生的細胞, 體細胞, 生殖細胞（形成配子）]
B2:
  name: 遺傳
  summary: 先寫出親代的基因型，用棋盤方格（或機率相乘）求子代比例；由子代的表現型比例反推親代。
  must:
    - 分離律：每個性狀由一對等位基因控制，形成配子時兩個基因分開，每個配子只帶其中一個。
    - 獨立分配律：位在不同對染色體上的兩對基因，分配到配子時互不影響。
    - 基因型（AA、Aa、aa）決定表現型；AA、aa 是同型合子，Aa 是異型合子；顯性基因存在時表現顯性性狀。
    - $Aa\times Aa$：子代基因型 $AA:Aa:aa=1:2:1$，表現型顯性：隱性＝3：1。
    - 試交：把顯性個體與 aa 交配；子代全為顯性 → 親代是 AA；顯性：隱性＝1：1 → 親代是 Aa。
    - $AaBb\times AaBb$（兩對基因獨立分配）：表現型比例 9：3：3：1。
    - 不完全顯性：異型合子呈中間型（紅花×白花得粉紅花，$\mathrm{F_2}$ 紅：粉紅：白＝1：2：1）。
    - ABO 血型是複等位基因：$I^A$、$I^B$ 對 i 為顯性，$I^A$ 與 $I^B$ 為等顯性（AB 型）。
    - 性聯遺傳：基因位於 X 染色體上（紅綠色盲、血友病）；男性只有一條 X，所以 X 性聯隱性疾病男性較多；兒子的 X 一定來自母親。
    - DNA 是雙股螺旋，鹼基 A 配 T、G 配 C，以半保留方式複製。
    - 中心法則：DNA →（轉錄，在細胞核）→ mRNA →（轉譯，在核糖體）→ 蛋白質；mRNA 上每 3 個鹼基（密碼子）對應一個胺基酸。
    - 突變是 DNA 序列的改變；只有發生在生殖細胞的突變才會遺傳給子代。
    - 身高、膚色等由多對基因控制，呈連續變異；表現型由基因型和環境共同決定。
    - 遺傳的染色體學說：薩登與包法利發現減數分裂時染色體的行為和孟德爾的遺傳因子一致，推論基因位在染色體上；摩根用果蠅白眼的性聯遺傳實驗證實。
    - 性染色體：科學家觀察到雌雄個體有一對染色體不同；人類女性是 XX、男性是 XY，精子帶 X 或 Y 決定子代的性別。
    - 遺傳物質是 DNA 的證據：格里夫茲的肺炎雙球菌實驗發現「轉形因子」→ 艾佛瑞證明轉形因子是 DNA → 赫雪與蔡斯用放射性同位素標記噬菌體，證明進入細菌的是 DNA 而不是蛋白質。華生與克里克在 1953 年提出 DNA 雙股螺旋模型。
  steps:
    - ①用字母寫出親代基因型 ②寫出親代各自可能產生的配子 ③畫棋盤方格或把機率相乘 ④整理出基因型與表現型的比例。
    - 譜系圖：兩個正常的親代生出患病子代 ⇒ 隱性遺傳；隱性遺傳中女兒患病而父親正常 ⇒ 不是 X 性聯，是體染色體隱性。
    - 兩對以上獨立的基因：每一對分開算機率，再相乘。
  traps:
    - 3：1 是大量子代的期望比例，子代少時不一定剛好出現。
    - X 性聯隱性遺傳：母親是帶因者、父親正常時，兒子有 $\dfrac{1}{2}$ 的機率患病，女兒都不患病（$\dfrac{1}{2}$ 是帶因者）。
    - 顯性性狀不一定比較常見。
    - 不完全顯性時異型合子呈中間型，表現型比例是 1：2：1，不能套用 3：1。
B3:
  name: 酵素、光合作用與細胞呼吸
  summary: ATP 是細胞直接使用的能量；光合作用把光能存進醣類，細胞呼吸再把醣類的能量轉成 ATP。
  must:
    - 酵素大多是蛋白質，具專一性（一種酵素只催化特定的反應）；能降低反應所需的活化能、可重複使用，但不改變反應熱。
    - 溫度與 pH 影響酵素活性：各有最適值；溫度過高會使酵素變性、失去活性，而且無法恢復。
    - ATP 分解成 ADP 和磷酸時釋放能量，供肌肉收縮、主動運輸、合成物質等生命活動使用。
    - 光合作用（在葉綠體）：二氧化碳＋水 →（光、葉綠素）→ 葡萄糖＋氧氣；光反應在類囊體吸收光能、分解水放出 $\mathrm{O_2}$，產生 ATP 與 NADPH；固碳反應在基質用 ATP 與 NADPH 把 $\mathrm{CO_2}$ 合成醣類。
    - 光合作用放出的 $\mathrm{O_2}$ 來自水，不是來自 $\mathrm{CO_2}$（以同位素 ${}^{18}\mathrm{O}$ 標記的實驗證明）。
    - 有氧呼吸：葡萄糖＋氧氣 → 二氧化碳＋水＋能量；先在細胞質進行糖解，再在粒線體完成，產生大量 ATP。
    - 無氧呼吸（發酵）只在細胞質進行，產生少量 ATP：酵母菌產生酒精與 $\mathrm{CO_2}$，人體肌肉缺氧時產生乳酸。
    - 葉綠素主要吸收紅光與藍紫光，反射綠光，所以葉子看起來是綠色；葉片中的色素可以用濾紙層析分離。
    - 影響光合作用速率的因素：光強度、$\mathrm{CO_2}$ 濃度、溫度；限制速率的是當時最缺乏的那個因素。
  steps:
    - 實驗題先找出操縱變因、應變變因和控制變因，再找對照組。
    - 用氣體變化判斷：光照下光合作用比呼吸作用強時，植物淨吸收 $\mathrm{CO_2}$、放出 $\mathrm{O_2}$；黑暗中只有呼吸作用，植物放出 $\mathrm{CO_2}$。
    - 酵素活性曲線：找出最適溫度與最適 pH；超過最適值活性下降，高溫造成的失活無法恢復。
  traps:
    - 植物白天、晚上都在進行呼吸作用。
    - 光合作用放出的 $\mathrm{O_2}$ 來自水；呼吸作用放出的 $\mathrm{CO_2}$ 中的碳來自葡萄糖。
    - 低溫只是讓酵素活性降低，回溫後可恢復；高溫變性則無法恢復。
    - 無氧呼吸也會產生 ATP，只是比有氧呼吸少很多。
B4:
  name: 演化、分類與生態
  summary: 天擇作用在個體的表現型上，結果是族群的特徵逐代改變；分類與親緣看共同祖先的遠近；能量單向流動、物質循環。
  must:
    - 達爾文天擇說：個體之間有變異，變異可以遺傳；生物產生的子代比環境能容納的多（生存競爭）；適合環境的個體存活並留下較多子代 ⇒ 族群的特徵逐代改變。
    - 拉馬克的用進廢退說（後天獲得的性狀會遺傳）已被否定；演化的單位是族群，不是個體。
    - 演化的證據：化石（越新的地層，化石越接近現生物種）、同源構造（構造相同、功能可能不同，例如人的手臂、鯨的鰭、蝙蝠的翼，表示有共同祖先）、胚胎發育的相似、DNA 與蛋白質序列的相似程度。
    - 同功構造（功能相同、來源不同，例如鳥的翼和昆蟲的翅）只代表適應相似的環境，不能用來判斷親緣。
    - 物種：能自然交配並產生具生殖能力後代的一群個體；地理隔離 → 生殖隔離 → 形成新物種。
    - 分類階層由大到小：界、門、綱、目、科、屬、種；學名用二名法（屬名＋種小名，拉丁文、斜體）。
    - 親緣關係樹：分支點代表共同祖先，越晚才分開的兩群親緣越近；鳥類是恐龍的後代，與鱷魚的親緣比與蜥蜴近。
    - 生物多樣性的三個層次：遺傳多樣性、物種多樣性、生態系多樣性。
    - 生態系：生產者（行光合作用）→ 消費者 → 分解者；能量沿食物鏈單向流動、逐級遞減（每一級大約只有 10% 傳到下一級）；碳、氮等物質可以循環。
    - 生物放大作用：不易分解的有毒物質（如 DDT、重金屬）沿食物鏈累積，越高級的消費者體內濃度越高。
    - 族群受出生、死亡、遷入、遷出影響；資源有限時族群呈 S 型成長，接近環境負荷量時成長停止。
    - 生物多樣性的主要威脅：棲地破壞與破碎化、外來入侵種、過度利用、汙染、氣候變遷。
    - 演化觀念的發展：拉馬克提出用進廢退（後來被否定）；達爾文和華萊士各自提出天擇說，達爾文受到馬爾薩斯人口論的啟發，在 1859 年出版《物種原始》。
    - 族群中性狀的比例會因天擇而改變：例如工業革命後英國樺尺蛾深色型的比例增加；大量使用抗生素後，抗藥性細菌的比例增加。
  steps:
    - 讀親緣關係樹：找兩種生物「最近的共同分支點」，分支點越近、親緣越近，不要只看在樹上排得近不近。
    - 天擇題：先找出環境中的選擇壓力（藥物、天敵、氣候），再判斷哪一種表現型能留下較多子代。
    - 生態題：畫出食物鏈或能量塔，能量逐級遞減，有毒物質逐級累積。
  traps:
    - 抗藥性是族群中本來就有的變異被藥物篩選出來，不是用藥之後才產生的。
    - 能量不能循環，物質才能循環。
    - 演化樹上排在相鄰位置的兩種生物，不一定是親緣最近的，要看分支點。
B5:
  name: 生物技術與探究實驗
  summary: DNA 萃取、電泳、PCR、基因轉殖都要知道每個步驟的目的；實驗題先找操縱變因和對照組。
  must:
    - DNA 萃取：清潔劑破壞細胞膜與核膜，鹽讓 DNA 聚集，再加入冰酒精讓 DNA 析出（DNA 不溶於酒精）；得到的是白色絲狀的 DNA，不是染色體。
    - DNA 水解後得到核苷酸，每個核苷酸由磷酸、去氧核糖和含氮鹼基組成。
    - 限制酶在特定的鹼基序列切開 DNA；DNA 連接酶把 DNA 片段接起來。
    - 基因轉殖：把目標基因接到載體（例如細菌的質體）上，送進宿主細胞，讓宿主製造目標蛋白質（例如用大腸桿菌生產人類胰島素、基因改造作物）。
    - PCR（聚合酶連鎖反應）：在試管中大量複製特定的 DNA 片段，需要模板 DNA、引子、耐熱的 DNA 聚合酶和核苷酸；每一輪（變性 → 黏合 → 延長）DNA 數量加倍。
    - 膠體電泳：DNA 帶負電，往正極移動；片段越小移動得越快、越遠；用來比對 DNA 片段（親子鑑定、刑事鑑識）。
    - 複製技術：桃莉羊以體細胞核移植產生；植物組織培養利用分生組織大量繁殖相同的植株。
    - 實驗設計：一次只改變一個操縱變因，其他控制變因保持相同；設對照組來比較；重複實驗、增加樣本數可以提高結論的可信度。
    - 複式顯微鏡：$\text{放大倍率}=\text{目鏡倍率}\times\text{物鏡倍率}$；換成高倍物鏡後視野變暗、範圍變小，只能調細調節輪；看到的影像上下左右都相反，影像偏哪一邊，就把玻片往同一邊移動，影像才會回到中央。
  steps:
    - 先找出實驗要回答的問題，再找操縱變因、應變變因與控制變因。
    - 電泳圖：比對不同泳道在相同位置的條帶；離加樣孔越遠的條帶，DNA 片段越小。
    - 基因工程題依序問：用什麼切（限制酶）→ 用什麼接（連接酶）→ 用什麼送進細胞（載體）→ 怎麼篩選 → 製造出什麼產物。
  traps:
    - 萃取出的 DNA 不會自己形成染色體，在光學顯微鏡下也看不到雙螺旋。
    - 電泳時 DNA 往「正極」移動，因為 DNA 帶負電。
    - PCR 要用耐高溫的 DNA 聚合酶，一般的 DNA 聚合酶在 95°C 會失去活性。
    - 對照組不是「不做實驗」，而是只少了操縱變因的那一組。
E1:
  name: 宇宙、太陽系與地月日運動
  summary: 光年是距離；恆星顏色反映表面溫度；日食在新月、月食在滿月；四季來自地軸傾斜。
  must:
    - 天文單位 AU＝日地平均距離，約 $1.5\times10^8$ km；光年＝光在一年內走的距離，約 $9.46\times10^{12}$ km，是距離單位；看到遠方天體的光，等於看到它過去的樣子。
    - 宇宙的層級：行星 → 恆星（如太陽）與行星系 → 銀河系（上千億顆恆星）→ 星系群、星系團 → 宇宙。
    - 宇宙在膨脹：遠方星系的光譜都紅移，距離越遠、遠離的速度越快（哈伯定律）；宇宙微波背景輻射是大霹靂的證據。
    - 恆星的顏色反映表面溫度：藍白色最熱、紅色最冷，太陽是黃色（表面約 5800 K）；恆星的能量來自核心的核融合（氫融合成氦）。
    - 視星等：數字越小越亮，相差 5 等，亮度相差 100 倍；看起來多亮與恆星本身的發光能力和距離都有關。
    - 太陽系八大行星：類地行星（水、金、地、火：岩石為主、密度大）與類木行星（木、土、天王、海王：氣體為主、體積大、密度小、有環與許多衛星）；矮行星：穀神星、冥王星、鬩神星等。
    - 地球自轉（由西向東，約一天一圈）造成晝夜和天體東升西落；公轉一年一圈，加上地軸傾斜約 23.5°，造成四季和晝夜長短的變化。
    - 北半球夏至（約 6/21）太陽直射北回歸線、白天最長；冬至（約 12/22）直射南回歸線、白天最短；春分、秋分直射赤道、晝夜等長。
    - 月相週期約 29.5 天：新月（農曆初一）→ 上弦月（初七、八，亮面朝西）→ 滿月（十五）→ 下弦月（廿二、廿三，亮面朝東）。
    - 日食：新月時月球擋住太陽，只有月影經過的地區看得到；月食：滿月時月球進入地球的影子，當時是夜晚的地區都看得到。月球軌道與黃道面約有 5° 夾角，所以不是每個月都有日食、月食。
    - 潮汐主要由月球引力造成，太陽也有影響；新月、滿月時大潮，上弦、下弦時小潮；大多數地方一天有兩次滿潮、兩次乾潮，時間每天約延後 50 分鐘。
    - 月球自轉週期等於公轉週期，所以地球上總是看到月球的同一面。
    - 絕對星等：把天體放到距離 10 秒差距（約 32.6 光年）的地方時的視星等，代表天體真正的發光能力（光度）；比較恆星本身有多亮要用絕對星等。
    - 天文觀測的波段：可見光和部分無線電波能穿過大氣到達地面；紫外線、X 射線、$\gamma$ 射線和大部分紅外線會被大氣吸收，要到高山或太空觀測。
    - 恆星的視運動：周日運動是地球自轉造成，北半球看星星繞北極星逆時針轉，每小時約 15°，北極星的仰角等於當地緯度；周年運動是地球公轉造成，同一時刻的星空每天往西移約 1°，恆星每天約提早 4 分鐘升起。
    - 太陽每天在天空的位置隨季節改變：北半球夏季太陽從東北方升起、正午仰角大、白天長；冬季從東南方升起、正午仰角小、白天短。正午太陽仰角 $=90^{\circ}-|\text{當地緯度}-\text{太陽直射的緯度}|$。
    - 太陽星雲學說：約 46 億年前，旋轉的星雲因重力收縮，中心形成太陽，周圍盤面的物質聚集成行星；靠近太陽溫度高，只有岩石和金屬能凝結，形成類地行星；遠處溫度低，冰和氣體也能聚集，形成類木行星。
    - 太陽系還有小行星（多在火星和木星之間）與彗星（由冰和塵埃組成，接近太陽時形成背向太陽的彗尾）。
    - 地球適合生命的條件：和太陽的距離適中，有液態水；質量夠大，能保有大氣；有磁場阻擋太陽風；大氣中的臭氧層吸收紫外線。
  steps:
    - 先確定觀測地點在哪個半球、什麼季節或時刻，畫出太陽（或月球）的位置再判斷。
    - 月相題：畫出日、地、月的相對位置，月球亮的一面一定朝向太陽。
    - 星等題：分清楚「看起來的亮度」與「本身的發光能力」，距離不同時不能直接比較本身的亮度。
  traps:
    - 光年是距離單位，不是時間單位。
    - 四季成因是地軸傾斜造成的太陽直射角度與白晝長短變化，不是地球離太陽遠近；北半球冬季時地球反而比較接近太陽。
    - 星等數字越大越暗，負的星等代表非常亮。
    - 日食只發生在新月、月食只發生在滿月，但新月、滿月不一定有日食、月食。
E2:
  name: 大氣、天氣與氣候
  summary: 空氣上升冷卻到露點就凝結成雲；高壓下沉晴朗、低壓上升多雲雨；北半球低壓逆時針旋轉。
  must:
    - 大氣分層由下而上：對流層（天氣現象都在這層，高度每升高 1 公里氣溫約降 6.5°C）、平流層（臭氧層吸收紫外線，溫度隨高度上升）、中氣層、增溫層（極光）。
    - 氣壓隨高度降低；海平面的平均氣壓約 1013 hPa。
    - 飽和水氣壓隨溫度升高而變大；$\text{相對濕度}=\dfrac{\text{實際水氣壓}}{\text{飽和水氣壓}}\times100\%$；溫度降到露點時水氣達飽和，開始凝結成雲、霧或露。
    - 空氣上升 → 膨脹冷卻 → 達露點成雲致雨（對流旺盛、地形抬升、鋒面抬升、低壓輻合）；空氣下沉 → 壓縮增溫 → 晴朗乾燥。
    - 焚風：空氣在迎風坡上升降雨，越過山後沿背風坡下沉增溫，形成乾熱的風。
    - 風由高壓吹向低壓；受科氏力影響，北半球的風向右偏：低壓（氣旋）逆時針向內輻合，高壓（反氣旋）順時針向外輻散。
    - 等壓線越密集，氣壓梯度越大，風越強。
    - 鋒面是冷暖氣團的交界；冷鋒過境後氣溫下降，可能有短暫的雷陣雨；梅雨（約 5～6 月）是滯留鋒面造成。
    - 颱風是熱帶海洋上形成的強烈低壓，北半球逆時針旋轉，中心（颱風眼）氣壓最低、風小、天氣較好；登陸後失去暖濕水氣供應而減弱。
    - 臺灣冬季吹東北季風（北部、東北部迎風多雨），夏季吹西南季風。
    - 溫室效應：大氣中的水氣、$\mathrm{CO_2}$、$\mathrm{CH_4}$ 等吸收地表放出的紅外線再向下放出，使地表變暖；人類排放溫室氣體使溫室效應增強，造成全球暖化。
    - 地面的風：氣壓梯度力推動空氣由高壓流向低壓，科氏力使風向偏轉（北半球向右），近地面還有摩擦力，所以地面風斜穿等壓線吹向低壓；高空摩擦力小，風幾乎和等壓線平行。
    - 天氣圖根據各地同一時間的觀測資料繪製：等壓線越密，風越強；冷鋒的符號是三角形、暖鋒是半圓形，符號畫在鋒面前進的那一側。
    - 颱風形成的條件：海水溫度約 26.5°C 以上的熱帶海洋，提供大量水氣與潛熱；離赤道約 5° 以上，科氏力才能讓氣流旋轉；高空與低空的風速、風向差異小。
    - 侵臺颱風的路徑主要受太平洋高壓引導：高壓強而西伸時，颱風往西行侵臺；高壓減弱東退時，颱風容易轉向北上。路徑不同，各地的風雨也不同，例如颱風引進的西南氣流常讓中南部降下豪雨。
    - 氣候變化有多重時間尺度：數萬到十萬年的冰期與間冰期循環（和地球軌道的週期變化有關）、數年一次的聖嬰現象、一年一次的季節變化。冰期時海平面下降，臺灣海峽曾露出成為陸橋；間冰期海平面上升。
    - 近幾十年的快速暖化無法只用自然因素解釋，科學證據顯示人類活動排放的溫室氣體是主要原因；因應氣候變遷分成「減緩」（減少溫室氣體排放）和「調適」（調整生活與建設以降低衝擊，例如加高堤防、調整作物）。
  steps:
    - 判斷天氣：先找空氣是上升還是下沉；上升 → 冷卻 → 雲雨，下沉 → 增溫 → 晴朗乾燥。
    - 讀天氣圖：先找高壓（H）、低壓（L）和鋒面，再依等壓線疏密與科氏力判斷風向、風速。
    - 濕度題：用飽和水氣壓曲線；水氣量不變時，溫度越低，相對濕度越高。
  traps:
    - 相對濕度 100% 不一定會下雨；水氣量不變而氣溫升高時，相對濕度會下降。
    - 颱風眼是颱風中氣壓最低、天氣反而較好的地方。
    - 南半球的風向左偏，低壓順時針旋轉。
    - 臭氧層破洞與全球暖化是兩件事：前者使到達地面的紫外線增加，後者來自溫室氣體增加。
E3:
  name: 板塊、岩石與地球歷史
  summary: 板塊運動解釋地震、火山與造山；地層未受擾動時下老上新，切穿別人的比較年輕；放射性定年看半衰期。
  must:
    - 地球內部分為地殼、地函、外核（液態）、內核（固態）；這是由地震波推知的（S 波無法通過液態的外核）。
    - 岩石圈（地殼＋上部地函）分成許多板塊，在下方的軟流圈上移動。
    - 臺灣位於歐亞板塊與菲律賓海板塊的聚合交界，板塊碰撞造成造山運動與頻繁的地震；東北外海的琉球海溝是菲律賓海板塊隱沒到歐亞板塊之下，南方的馬尼拉海溝是歐亞板塊隱沒到菲律賓海板塊之下。
    - 震源是地下發生錯動的位置，震央是震源正上方的地表；規模代表地震釋放的能量（一次地震只有一個值，規模每差 1，能量約差 32 倍）；震度代表各地搖晃的程度（臺灣分 0～7 級，5、6 級再分弱、強）。
    - P 波（縱波）比 S 波（橫波）快；P 波與 S 波到達的時間差越大，表示離震源越遠。
    - 岩石三大類：火成岩（岩漿冷卻形成：深成岩如花岡岩晶粒大，火山岩如玄武岩、安山岩晶粒小）、沉積岩（沉積物經壓密膠結：砂岩、頁岩、石灰岩，有層理，可能含化石）、變質岩（高溫高壓下改變：大理岩、板岩、片岩）；三者可以互相轉變（岩石循環）。
    - 地層判讀：疊置定律（未受擾動時下老上新）、截切定律（切穿其他岩層的斷層或岩脈比被切的岩層年輕）、化石對比；不整合面代表曾經侵蝕或沉積中斷。
    - 斷層：正斷層（張力，上盤相對下移）、逆斷層（擠壓，上盤相對上移，例如 1999 年集集地震的車籠埔斷層）、平移斷層（水平錯動）。
    - 絕對定年：放射性元素的半衰期固定，不受溫度、壓力影響；母元素剩下 $\dfrac{1}{2}$、$\dfrac{1}{4}$、$\dfrac{1}{8}$，分別代表經過 1、2、3 個半衰期。
    - 地質年代：前寒武紀（地球約 46 億年前形成，生命出現，藍綠菌行光合作用產生氧氣）→ 古生代（寒武紀生物大爆發，三葉蟲）→ 中生代（恐龍）→ 新生代（哺乳類興盛，人類出現）；二疊紀末是規模最大的滅絕事件，白堊紀末恐龍滅絕。
    - 珊瑚化石的生長紋顯示古代一年的天數比較多 ⇒ 地球自轉逐漸變慢。
    - 板塊構造學說的發展：韋格納提出大陸漂移說（證據：大陸輪廓吻合、兩岸的化石和岩層相連、古冰河遺跡），但說不出推動大陸的力量；海底擴張說指出洋脊湧出岩漿形成新的海洋地殼並向兩側推移（證據：海底岩石離洋脊越遠越老、地磁反轉留下對稱的磁條帶）；最後整合成板塊構造學說。
    - 化石對比：指準化石的生存時間短、分布廣，可以對比不同地區地層的相對年代；放射性同位素定年可以求出岩層的絕對年代。
    - 地球大氣的演化：早期大氣主要是火山噴出的水氣、二氧化碳和氮氣；水氣凝結成海洋，大量二氧化碳溶入海水，形成碳酸鈣沉積（石灰岩）；藍綠菌行光合作用產生氧氣，氧氣累積後形成臭氧層，生物才能登上陸地。
  steps:
    - 地層題：先找最老的（最下面、被切穿的），再依覆蓋、截切的關係排出事件先後，最後用化石或定年資料推年代。
    - 板塊題：先判斷交界類型（張裂、聚合、錯動），再推地震深淺、有沒有火山以及會形成的地形。
    - 地震題：分清楚規模（能量）與震度（搖晃程度）；用 P、S 波到時差判斷遠近。
  traps:
    - 一次地震只有一個規模，但各地的震度不同。
    - 切穿其他岩層的岩脈或斷層比較年輕。
    - 經過兩個半衰期剩下 $\dfrac{1}{4}$，不是全部衰變完。
    - 外核是液態，內核因為壓力極大而是固態。
  tables:
    - title: 板塊交界的類型
      rows:
        - [類型, 板塊運動, 地形, 地震與火山, 例子]
        - [張裂型, 互相遠離, 中洋脊、裂谷, 淺源地震、火山, 大西洋中洋脊、東非大裂谷]
        - [聚合型（隱沒）, 海洋板塊隱沒, 海溝、島弧, 淺到深源地震、火山, 琉球海溝、日本]
        - [聚合型（碰撞）, 大陸互相碰撞, 高大山脈, 地震多、火山少, 喜馬拉雅山、臺灣山脈]
        - [錯動型, 水平錯動, 轉形斷層, 淺源地震、少火山, 美國聖安德魯斯斷層]
E4:
  name: 海洋與氣候
  summary: 鹽度看蒸發與降水、淡水注入；洋流把熱量從低緯帶到高緯；聖嬰現象時赤道東太平洋變暖。
  must:
    - 海水平均鹽度約 35‰（每公斤海水約含 35 g 鹽類），主要是氯化鈉。
    - 鹽度分布：副熱帶海域蒸發旺盛、降雨少，鹽度最高；赤道多雨、河口有淡水注入、極區有融冰，鹽度較低。
    - 海水溫度的垂直分層：表水層（受風混合，溫度較高且均勻）→ 斜溫層（溫度隨深度快速下降）→ 深水層（低溫且穩定）。
    - 表層洋流主要由盛行風吹動，受科氏力與陸地阻擋形成環流（北半球大致順時針、南半球逆時針）；暖流由低緯流向高緯，寒流由高緯流向低緯。
    - 黑潮是暖流，沿臺灣東部海域北流，帶來豐富的洄游魚類；冬季中國沿岸流南下進入臺灣海峽，水溫較低。
    - 溫鹽環流（深層洋流）：高緯度海水低溫、高鹽、密度大而下沉，推動全球深層海水緩慢循環。
    - 湧升流：表層海水被風吹離海岸，深層富含營養鹽的冷水上湧，浮游生物多，形成好漁場（例如秘魯外海）。
    - 聖嬰現象：信風減弱，赤道太平洋東部（秘魯外海）海溫異常升高、湧升流減弱、漁獲減少；東太平洋沿岸多雨，西太平洋（印尼、澳洲）偏乾。反聖嬰則大致相反。
    - 暖流使沿岸氣候溫暖濕潤；寒流使沿岸氣溫較低、空氣穩定少雨，常形成沿岸沙漠（例如智利北部的阿他加馬沙漠）。
    - 海洋吸收大量 $\mathrm{CO_2}$ 會使海水酸化，影響珊瑚與貝類形成碳酸鈣的骨骼和外殼。
    - 波浪主要由風吹海面造成；波浪會侵蝕突出的岬角（形成海蝕崖、海蝕平台），在凹入的海灣堆積沙礫（形成沙灘）。
    - 臺灣海峽的潮流：漲潮時潮水從海峽的南、北兩端流向中部，退潮時再從中部向南、北流出；所以中部（臺中一帶）潮差最大，南北兩端的基隆、高雄平均潮差約 1 公尺左右。
  steps:
    - 鹽度題：比較蒸發量與降水量，再看有沒有河川注入、融冰。
    - 洋流題：先由流向與緯度判斷暖流或寒流，再推它對沿岸氣候與漁業的影響。
    - 聖嬰題：記住「東太平洋變暖、西太平洋變乾」，再推漁獲與降雨的變化。
  traps:
    - 赤道海水溫度最高，但鹽度不是最高（降雨多），鹽度最高在副熱帶。
    - 黑潮是暖流，不是寒流。
    - 海嘯不是一般的風浪：波長很長、速度很快，在深海時波高不明顯，接近淺海岸邊時波高才急速增加。

I1:
  name: 科學探究與實作
  summary: 實驗題先找出操縱變因、應變變因和控制變因；看圖表先讀座標軸與單位，結論只能根據數據推論。
  must:
    - 探究的流程：觀察現象、發現問題 → 提出可以驗證的假說 → 設計實驗、收集數據 → 分析數據、提出結論 → 表達與分享，並檢討改進；這些步驟不一定照固定順序，可以反覆進行。
    - 變因：操縱變因（自變項）是實驗者刻意改變的條件；應變變因（依變項）是隨之改變、需要測量的結果；控制變因是要保持相同的其他條件。一次只改變一個操縱變因，才能判斷因果。
    - 對照組和實驗組只差在操縱變因；重複實驗、增加樣本數，可以減少偶然的誤差，提高結論的可信度。
    - 作圖：橫軸放操縱變因、縱軸放應變變因，標明物理量和單位；數據呈直線時，斜率和截距常有物理意義（例如 v–t 圖的斜率是加速度）。
    - 把曲線變成直線：猜測 $y\propto x^2$ 時，畫 y 對 $x^2$ 的圖；y 隨 x 成指數變化時，畫 $\log y$ 對 x 的圖；畫成直線比較容易判斷關係。
    - 測量與誤差：讀數要記到儀器最小刻度的下一位（估計值）；有效數字的位數反映測量的精確程度；多次測量取平均可以減少隨機誤差，但無法消除系統誤差（例如儀器沒有歸零）。
    - 相關不等於因果：兩個變數一起變化，可能只是巧合，或有第三個因素同時影響它們；要判斷因果，需要控制其他變因的實驗。
    - 內插與外插：在測量範圍內推估（內插）比較可靠；超出範圍推測（外插）要特別小心，關係不一定延續。
    - 科學模型可以描述與預測現象，但都有適用的範圍和限制；新的證據出現時，科學知識可能被修正。
    - 論證：提出主張時要有證據（數據）支持，並說明這些證據為什麼能支持主張（推理）。
  steps:
    - 讀實驗題：先找出研究問題，再圈出操縱變因、應變變因、控制變因，以及對照組。
    - 判讀圖表：先看標題、座標軸、單位和刻度，再看趨勢（增加、減少、先增後減）與轉折點，最後才看選項。
    - 檢查結論：結論只能根據實驗的範圍與數據；選項出現「一定」「所有」「證明」時，要回到數據確認。
  traps:
    - 同時改變兩個以上的條件，就無法判斷是哪一個造成結果。
    - 沒有對照組時，看不出變化是不是操縱變因造成的。
    - 兩條曲線一起上升，不能直接說一個造成另一個（相關不等於因果）。
    - 比較數據前先確認單位和刻度；雙縱軸的圖要分清楚哪條曲線對應哪一個軸。
