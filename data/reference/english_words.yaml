  eng115-11: {phrase: it turns out, mean: 結果發現、原來（插入句中）}
  eng115-19: {phrase: as such, mean: 因此、正因如此}
  eng114-15: {phrase: thus, mean: 因此、就這樣}
  eng114-20: {phrase: as well, mean: 也（放句尾）}
  eng112-11: {phrase: but not quite, mean: 但不完全（幾乎…卻沒有）}
  eng112-15: {phrase: despite, mean: 儘管（後接名詞）}
  eng111-16: {phrase: other than, mean: 除了…之外（＝except）}
