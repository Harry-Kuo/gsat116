# 常見轉折語（依功能分類，供克漏字、篇章結構與寫作使用）
transitions:
  - {kind: 補充, words: "moreover、furthermore、in addition、besides、what is more（而且）、also、as well（也）、not to mention（更不用說）"}
  - {kind: 轉折、對比, words: "however、nevertheless、yet、on the other hand、in contrast、instead、while／whereas（然而、而）"}
  - {kind: 讓步, words: "although／even though（＋子句）、despite／in spite of（＋名詞或 V-ing）、even so（即使如此）"}
  - {kind: 因果, words: "therefore、thus、hence、as a result、consequently、as such（因此、正因如此）"}
  - {kind: 舉例, words: "for example、for instance、such as、including"}
  - {kind: 換句話說, words: "in other words、that is (to say)、namely"}
  - {kind: 揭露事實, words: "in fact、actually、it turns out／as it turns out（結果發現、原來）"}
  - {kind: 條件, words: "if so（如果是這樣）、otherwise（否則）、unless（除非）"}
  - {kind: 時間, words: "by then（到那時）、meanwhile（同時）、eventually（最後）"}
  - {kind: 除外, words: "except for、other than、apart from（除了…之外）"}
  - {kind: 總結, words: "in short、in conclusion、all in all（總而言之）；after all 是「畢竟」，不是總結"}

