grammar_items:
  eng115-17: {point: have yet to V, mean: 還沒有…（had yet to develop＝當時還沒發展）}
  eng114-11: {point: would＋原形動詞, mean: 從過去的時間點看未來（當時還不知道會擴散）}
  eng114-18: {point: 代動詞 don't, mean: 代替前面的 detect that your body is moving，避免重複}
  eng113-12: {point: 介系詞＋which, mean: be assigned to the stores → the stores to which they are assigned}
  eng113-16: {point: could have＋p.p., mean: 過去本來可以…（實際上沒有）}
  eng112-18: {point: 句子的主要動詞, mean: our body fluids 後面缺主要動詞，用現在式 redistribute（敘述一般事實）；後面的 shifting… 是分詞構句}
  eng111-12: {point: 現在完成進行式, mean: Since the 1970s → have been springing up（從過去到現在持續）}
  eng111-17: {point: used to＋原形動詞, mean: 過去曾經（現在不是了）}
  eng110-20: {point: 過去分詞當形容詞, mean: bird feeders installed…＝被安裝在…的餵鳥器}
  eng110-25: {point: would have＋p.p.（假設語氣）, mean: 如果上帝真的要他的命，第一道閃電就夠了（事實上他活下來了）}
  eng110-28: {point: 分詞構句（完成式）, mean: Having already shrunk…＝（冰河）已經縮小了…}
