# 經典題型與解題技巧：向量、機率統計、排列組合（數A、數B 重點整理共用）。
# concepts：哪個觀念底下要列哪幾組題型。groups：每一組的標題與題型。
# 每一型：name 題型、cue 看到什麼、how 怎麼做（一句或幾個步驟）、ex 例題、sol 解答、trap 要小心的地方（可省略）、
#   qs 考過的題目代碼（已放進考古題庫的才會列出）、only 只放在哪一科（可省略）。
# 範圍依大考中心學測數學考科測驗範圍（排列組合只到直線排列、組合、取捨原理與二項式展開）。
# 例題的答案都用程式窮舉或代數驗算過。

concepts:
  mathA: {M4: [vec, space], M6: [prob, stat], M7: [count]}
  mathB: {B6: [vec], B9: [count], B10: [prob], B11: [stat]}

groups:
  count:
    title: 排列組合
    items:
      - name: 先分類、再分步
        cue: 情況可以分成幾種、彼此不會同時發生（例如「3 種都是基本材料／2 種基本、1 種進階／其他」）；或一件事要分好幾個步驟才能完成。
        how:
          - 先列出所有類別，確認彼此不重疊、也沒有遺漏。
          - 每一類用乘法原理算（各步驟的方法數相乘），各類再相加。
          - 題目說「結果相同只算一種」時，要數的是「不同的結果」，不是選法。
        ex: 從 4 位男生、3 位女生中選出正、副班長各 1 人，兩人必須同性別，有幾種選法？
        sol: 兩位都是男生：$4\times3=12$ 種；兩位都是女生：$3\times2=6$ 種（正、副有分別，要排順序）。共 $12+6=18$ 種。
        qs: [ma115-04, mb111-17]
      - name: 有系統地列舉：固定一個，由小到大
        cue: 條件和數的性質有關（完全平方數、倍數、等差、不等式），或是條件很多、情況不多，套不上公式。
        how:
          - 先固定一個變數（例如先決定 a），由小到大逐一列出另一個變數能取的值。
          - 數字題先依性質分類，例如把 1～9 寫成「平方數 × 剩下的部分」，三數乘積是完全平方數 ⇔ 剩下的部分相乘是完全平方數。
          - 列完檢查有沒有重複，以及最大、最小的情況有沒有漏掉。
        ex: 擲兩顆骰子，點數分別是 a、b，滿足 $ab\ge20$ 的情況有幾種？
        sol: $a\le3$ 時 $ab\le18$，不可能。$a=4$：$b=5,6$，2 種；$a=5$：$b=4,5,6$，3 種；$a=6$：$b=4,5,6$，3 種。共 8 種。
        qs: [ma110-16, ma109-06, mb109-08]
      - name: 特殊的先處理：指定位置、有限制的人
        cue: 「0 不能在首位」「甲不排第一」「老師站正中間」「歌唱要排在鋼琴之後」。
        how:
          - 先安排有限制的位置或人，再排其他沒有限制的。
          - 限制很多、分類太麻煩時，改用「全部 − 不符合」（見⑪）。
        ex: 用 0、1、2、3、4 組成數字不重複的三位數，共有幾個？其中偶數有幾個？
        sol: 百位不能是 0：$4\times4\times3=48$ 個。偶數先看個位：個位是 0 時 $4\times3=12$ 個；個位是 2 或 4 時，百位不能是 0 也不能和個位相同，$2\times3\times3=18$ 個。偶數共 $12+18=30$ 個。
        trap: 個位和百位都有限制時，要分「個位是 0」「個位不是 0」兩類，因為百位能選的個數不一樣。
        qs: [mb111-17, ma114-03]
      - name: 相鄰：先綁成一塊再排
        cue: 「相鄰」「排在一起」「同類的排在一起」。
        how:
          - 把要相鄰的看成一塊，和其他的一起排。
          - 再乘上塊內的排法。
        ex: 甲、乙、丙、丁、戊 5 人排成一列，甲、乙相鄰的排法有幾種？
        sol: 甲乙綁成一塊，和丙、丁、戊共 4 個單位：$4!=24$ 種；塊內有甲乙、乙甲 2 種。共 $24\times2=48$ 種。
        trap: 「5、6 相鄰，而且 6、7 相鄰」表示 5、6、7 連成一塊，6 一定在中間，塊內只有 567、765 兩種，不是 $3!$ 種。
        qs: [ma114-03, mb115-14]
      - name: 不相鄰：先排其他的，再插空隙
        cue: 「不相鄰」「互不相鄰」「任兩個都不相鄰」「中間至少隔一個」。
        how:
          - 先排沒有限制的 m 個，會產生 $m+1$ 個空隙（含兩端）。
          - 不能相鄰的 k 個分別放進不同的空隙：相異的人依序挑空隙，$(m+1)\times m\times\cdots$（k 個數相乘）；相同的東西只要選空隙，$C(m+1,k)$ 種。
        ex: 3 位男生、3 位女生排成一列，女生互不相鄰的排法有幾種？
        sol: 男生先排：$3!=6$ 種，產生 4 個空隙；3 位女生依序挑空隙：$4\times3\times2=24$ 種。共 $6\times24=144$ 種。
        trap: 「兩人不相鄰」也可以用「全部 − 相鄰」；但「三人兩兩不相鄰」不能只扣掉「三人連在一起」，要用插空隙。選位置也一樣：10 棟大樓選 3 棟、互不相鄰，先放好沒選的 7 棟，產生 8 個空隙，$C(8,3)=56$ 種。
        qs: [mb111-03, ma110-12]
      - name: 有相同物的排列、走捷徑
        cue: 「相同的球」「顏色的排法」「字母有重複」「只能向右、向上走」。
        how:
          - n 個東西中有 p 個相同、q 個相同……，排法有 $\dfrac{n!}{p!\,q!\cdots}$ 種（相同的東西互換位置，排法不變）。
          - 方格走捷徑：向右 m 步、向上 n 步，就是把 m 個「右」和 n 個「上」排成一列，$\dfrac{(m+n)!}{m!\,n!}$ 種。
          - 必須經過某一點：分成前後兩段，兩段的走法相乘。
        ex: 從 $(0,0)$ 走到 $(4,3)$，每一步只能向右或向上走一格，有幾種走法？如果必須經過 $(2,1)$ 呢？
        sol: 4 個「右」、3 個「上」排成一列：$\dfrac{7!}{4!\,3!}=35$ 種。經過 $(2,1)$：前段 $\dfrac{3!}{2!\,1!}=3$ 種，後段向右 2 步、向上 2 步，$\dfrac{4!}{2!\,2!}=6$ 種，共 $3\times6=18$ 種。
        qs: [ma110-12]
      - name: 順序已經固定：只要選，不用排
        cue: 「由小到大」「遞增」「$a<b<c$」「甲要排在乙的前面（不一定相鄰）」。
        how:
          - 順序固定的 k 個東西，選出它們（或它們的位置）就決定了排法：$C(n,k)$ 種，選完只有 1 種排法。
          - n 人排成一列、其中 k 人的先後順序固定：$\dfrac{n!}{k!}$ 種。
        ex: 甲、乙、丙、丁、戊 5 人排成一列，甲要排在乙的前面（不一定相鄰），有幾種排法？
        sol: 每一種排法把甲、乙對調就得到另一種，兩種之中恰好一種是甲在前：$\dfrac{5!}{2!}=60$ 種。
        trap: 題目寫「遞增」「遞減」時，先找一定在某個位置的數（例如最大的數一定在遞增和遞減的交界），再決定其他數放哪一邊。
        qs: [ma112-04, mb112-14]
      - name: 可以重複選：每一次都有 m 種
        cue: 「可以重複」「抽 k 次、每次 1 個」「每封信投入任一個郵筒」「每個人任選一項」。
        how:
          - 先分清楚「誰在選」：每一個選擇者（每封信、每一次）都有 m 種選擇，共 $m^k$ 種。
          - k 封信投入 m 個郵筒是 $m^k$ 種，不是 $k^m$ 種。
          - 每個郵筒至少一封：先把信分堆，再把各堆分給郵筒。
        ex: 4 封不同的信投入 3 個不同的郵筒，有幾種投法？如果每個郵筒至少一封呢？
        sol: 每封信都有 3 種選擇：$3^4=81$ 種。每個郵筒至少一封：4 封信分成 2、1、1 三堆，選出同一堆的 2 封有 $C(4,2)=6$ 種；三堆分給 3 個郵筒有 $3!=6$ 種。共 $6\times6=36$ 種。
        trap: 可以重複、但不管順序的「選取」不能用 $m^k$：例如從 10 種口味選兩球（可以同口味），要分「兩球不同口味 $C(10,2)=45$ 種」和「同口味 10 種」，共 55 種。
        qs: [mb114-04, mb112-17, ma111-01]
      - name: 相同的東西分給不同的人：隔板法
        cue: 「相同的球分給幾個人」「$x+y+z=10$ 的非負整數解」「每人至少分到幾個」。
        how:
          - k 個相同的東西分給 n 個人（可以有人沒分到）：把 k 個「○」和 $n-1$ 個隔板「｜」排成一列，$\dfrac{(k+n-1)!}{k!\,(n-1)!}$ 種。
          - 每人至少 r 個：先每人發 r 個，剩下的再用隔板。
        ex: 10 顆相同的糖果分給甲、乙、丙三人，每人至少 2 顆，有幾種分法？
        sol: 先每人發 2 顆，剩下 4 顆任意分給 3 人：4 個「○」和 2 個「｜」排成一列，$\dfrac{6!}{4!\,2!}=15$ 種。
      - name: 分組、分派：組有沒有名字？
        cue: 「分成兩組」「平分成甲、乙兩組」「分派到兩個部門」「每組都要有……」。
        how:
          - 組有名字（甲組、研發部門、A 教室）：依序選人，$C(n,a)\times C(n-a,b)\times\cdots$。
          - 組沒有名字、又有幾組人數一樣：再除以這幾組的排列數，例如平均分成 3 組要除以 $3!$。
          - 每組有特別的條件（例如每組要有 1 名翻譯）：先分有條件的人，再分其他人；「至少一個」用補集。
        ex: 6 人分到 A、B、C 三間教室，每間 2 人，有幾種分法？如果只是分成 3 組、每組 2 人呢？
        sol: 分到教室：$C(6,2)\times C(4,2)\times C(2,2)=15\times6\times1=90$ 種。3 組沒有名字，三組互換不算新的分法：$90\div3!=15$ 種。
        qs: [mb114-15, ma113-05]
      - name: 「至少」「不全是」用補集，兩個條件用取捨原理
        cue: 「至少一個」「每組都要有」「不全在同一側」「甲不排第一、乙不排最後」。
        how:
          - 至少一個 ＝ 全部 − 一個都沒有。
          - 兩個「不」：$n(A'\cap B')=n(S)-n(A)-n(B)+n(A\cap B)$。
          - 三個集合：$n(A\cup B\cup C)=n(A)+n(B)+n(C)-n(A\cap B)-n(B\cap C)-n(C\cap A)+n(A\cap B\cap C)$。
        ex: 甲、乙、丙、丁、戊 5 人排成一列，甲不排第一、乙不排最後，有幾種排法？
        sol: 全部 $5!=120$ 種；甲排第一 $4!=24$ 種；乙排最後 $4!=24$ 種；甲排第一而且乙排最後 $3!=6$ 種。所求 $=120-24-24+6=78$ 種。
        qs: [mb114-15, mb111-03, mb111-17]
      - name: 換個方向數：算每個位置的貢獻
        cue: 要算「所有情況加起來總共出現幾次」或「所有排法的總和」，一個一個數太多。
        how:
          - 把「每個情況出現幾次」改成「每個位置（每一對相鄰位置、每個數字）在多少個情況裡出現」，再全部相加。
          - 或者找一一對應：例如三數成等差 $a<b<c$，只要選出 a、c（兩數同奇偶），b 就決定了。
        ex: 用 1、2、3 三個數字（各用一次）排成三位數，所有三位數的總和是多少？
        sol: 共 $3!=6$ 個數，每個數字在百位、十位、個位各出現 2 次。總和 $=2\times(1+2+3)\times(100+10+1)=2\times6\times111=1332$。
        qs: [mb112-17, mb112-14]
      - name: 二項式定理：找某一項的係數
        cue: 「$(a+b)^n$ 展開式中 $x^k$ 的係數」「常數項」「$C(n,0)+C(n,1)+\cdots+C(n,n)$」。
        how:
          - 一般項是 $C(n,k)\,a^{n-k}b^k$，讓 x 的次方等於題目要的，解出 k。
          - 各項係數的和：代 $x=1$；$C(n,0)+C(n,1)+\cdots+C(n,n)=2^n$。
        ex: $(2x-1)^5$ 展開式中 $x^3$ 的係數是多少？
        sol: $x^3$ 的項是 $C(5,3)\,(2x)^3(-1)^2=10\times8x^3=80x^3$，係數是 80。

  prob:
    title: 機率
    items:
      - name: 古典機率：樣本空間要「等可能」
        cue: 擲骰子、擲硬幣、從袋中抽球、隨機排成一列、隨機選取。
        how:
          - $P(A)=\dfrac{n(A)}{n(S)}$，前提是每個樣本點出現的機會相等。
          - 同色的球也要當成不同的球來數，才會等可能；分子、分母要用同一種數法（都考慮順序，或都不考慮）。
        ex: 袋中有 3 顆紅球、2 顆白球，一次取出 2 顆，兩顆同色的機率是多少？
        sol: $n(S)=C(5,2)=10$；同色：$C(3,2)+C(2,2)=3+1=4$。機率 $=\dfrac{4}{10}=\dfrac{2}{5}$。
        trap: 擲兩顆骰子，點數和有 2～12 共 11 種，但它們不是等可能，不能說和為 7 的機率是 $\dfrac{1}{11}$；要用 36 種有順序的結果來算，答案是 $\dfrac{6}{36}=\dfrac{1}{6}$。
        qs: [mb111-16, mb114-04, ma109-06, ma110-16]
      - name: 「至少一次」：1 減去一次都沒有
        cue: 「至少一次」「至少一個」「至少有一個停車場有空位」。
        how: $P(\text{至少一次})=1-P(\text{一次都沒有})$；各次獨立時，一次都沒有＝每一次都失敗的機率相乘。
        ex: 投籃命中率 0.4，投 3 次（各次獨立），至少進 1 球的機率是多少？
        sol: 3 次都沒進：$0.6^3=0.216$。至少進 1 球：$1-0.216=0.784$。
        qs: [mb114-13, ma112-08]
      - name: 獨立事件：機率相乘
        cue: 「互不影響」「各次獨立」「已知 A、B 獨立，求未知數」「判斷兩事件是否獨立」。
        how:
          - A、B 獨立 ⇔ $P(A\cap B)=P(A)\cdot P(B)$；幾個獨立的事件同時發生，就把機率相乘。
          - 判斷獨立或求未知數：分別算出 $P(A)$、$P(B)$、$P(A\cap B)$，代進去檢查或列方程式。
        ex: 擲一顆公正骰子，A：點數是偶數，B：點數是 3 的倍數。A、B 獨立嗎？
        sol: $P(A)=\dfrac{1}{2}$、$P(B)=\dfrac{1}{3}$；$A\cap B=\{6\}$，$P(A\cap B)=\dfrac{1}{6}=\dfrac{1}{2}\times\dfrac{1}{3}$，所以 A、B 獨立。
        trap: 獨立和互斥不同：兩事件互斥（不會同時發生）、機率又都大於 0 時，一定不獨立。
        qs: [ma114-01, mb115-07, ma113-11]
      - name: 重複試驗：恰好 k 次、第 n 次才達成
        cue: 「擲 n 次恰有 k 次正面」「玩 n 次至少中 2 次」「擲到第 4 次才累積 3 個正面」。
        how:
          - 每次成功的機率是 p、各次獨立：n 次中恰好 k 次成功的機率 $=C(n,k)\,p^k(1-p)^{n-k}$（選出哪 k 次成功，乘上每一條路徑的機率）。
          - 「第 n 次才累積到 k 次成功」＝前 $n-1$ 次恰好 $k-1$ 次成功，而且第 n 次成功。
        ex: 投籃命中率 0.6，投 3 次恰好進 2 球的機率是多少？
        sol: 選出哪 2 次進球：$C(3,2)=3$ 種；每一種的機率是 $0.6^2\times0.4=0.144$。所求 $=3\times0.144=0.432$。
        trap: 「擲硬幣到第 5 次才出現第 2 個正面」：前 4 次恰 1 個正面，而且第 5 次是正面，機率 $=C(4,1)\left(\dfrac{1}{2}\right)^4\times\dfrac{1}{2}=\dfrac{1}{8}$，不是 $C(5,2)\left(\dfrac{1}{2}\right)^5$。
        qs: [ma114-15, ma112-08]
      - name: 多階段的試驗：畫樹狀圖
        cue: 前一次的結果會影響下一次（抽後不放回、和前一次同色的機率是 $\dfrac{1}{3}$、機器人每次往某個方向移動），或是先選袋子再抽球。
        how:
          - 畫樹狀圖：同一條路徑的機率相乘，符合條件的路徑再相加。
          - 步驟很多時找規律或對稱：地位相同的位置，機率一定相等。
        ex: 甲袋有 2 紅 1 白、乙袋有 1 紅 2 白。擲一枚硬幣，正面從甲袋、反面從乙袋取 1 球，取到紅球的機率是多少？
        sol: 正面→紅：$\dfrac{1}{2}\times\dfrac{2}{3}=\dfrac{1}{3}$；反面→紅：$\dfrac{1}{2}\times\dfrac{1}{3}=\dfrac{1}{6}$。相加 $=\dfrac{1}{3}+\dfrac{1}{6}=\dfrac{1}{2}$。
        qs: [mb109-15, mb113-12]
      - name: 條件機率：在「已知的事件」裡面數
        cue: 「已知……，則……的機率」「在……的條件下」「……之中，……占多少比例」。
        how:
          - $P(B\mid A)=\dfrac{P(A\cap B)}{P(A)}$；等可能時直接在 A 裡面數：$P(B\mid A)=\dfrac{n(A\cap B)}{n(A)}$。
          - 分母是「已經知道發生了」的事件，不是全體。
        ex: 擲兩顆公正骰子，已知點數和為 8，至少一顆是 6 點的機率是多少？
        sol: 點數和為 8 的有 $(2,6)$、$(3,5)$、$(4,4)$、$(5,3)$、$(6,2)$ 共 5 種，其中有 6 點的 2 種。所求 $=\dfrac{2}{5}$。
        qs: [mb112-05, mb115-07, mb113-14, ma113-11, ma110-12]
      - name: 貝氏定理：已知結果，反推原因
        cue: 題目給「原因 → 結果」的機率（例如染病的人驗出陽性的機率），問「結果 → 原因」（驗出陽性的人真的染病的機率）。
        how:
          - 畫兩層的樹狀圖：第一層是原因（染病／沒染病），第二層是結果（陽性／陰性）。
          - $P(\text{原因}\mid\text{結果})=\dfrac{\text{這條路徑的機率}}{\text{所有得到這個結果的路徑機率總和}}$。
        ex: 某病的盛行率是 1%。檢驗時，有病的人 90% 呈陽性，沒病的人 10% 呈陽性。某人呈陽性，他真的有病的機率是多少？
        sol: 有病而且陽性：$0.01\times0.9=0.009$；沒病而且陽性：$0.99\times0.1=0.099$。所求 $=\dfrac{0.009}{0.009+0.099}=\dfrac{0.009}{0.108}=\dfrac{1}{12}$。
        trap: 沒病的人比有病的人多很多，所以陽性的人大多是「沒病卻驗出陽性」；分母一定要把所有會得到這個結果的路徑都加進來。
        qs: [ma115-13, ma111-05, mb111-15, mb110-07]
      - name: 列聯表：設一個未知數，把表格填滿
        cue: 兩種分類交叉（有無近視 × 有無蛀牙、考數A × 考數B），題目給比例，或說「占多數」「占少數」。
        how:
          - 畫一個兩列兩行的表格（再加上總和），設其中一格（通常是兩者都有的那一格）為 x。
          - 用每一列、每一行的總和，把其他格都寫成 x 的式子。
          - 把條件翻成方程式或不等式；「A 之中 B 占多數」就是 $\dfrac{n(A\cap B)}{n(A)}>\dfrac{1}{2}$。
        ex: 全班 40 人，20 人戴眼鏡、15 人參加球隊，兩者都沒有的有 12 人。戴眼鏡的人之中，參加球隊的占多少比例？
        sol: 設兩者都有的是 x 人：$20+15-x=40-12$ ⇒ $x=7$。所求 $=\dfrac{7}{20}$。
        qs: [mb115-15, mb113-14, ma114-01]
      - name: 期望值：每個值乘上機率，再相加
        cue: 「期望值」「平均可以得到」「平均要花多少錢」「平均抽到幾張」。
        how:
          - 列出所有可能的值和它們的機率（機率加起來要等於 1），$E=x_1p_1+x_2p_2+\cdots+x_np_n$。
          - 可以拆開算再相加：一次十連抽的期望張數 $=9\times(\text{前九張每張的機率})+(\text{第十張的機率})$；同樣的遊戲玩 n 次，期望值乘以 n。
        ex: 擲一顆公正骰子，擲出 6 點得 60 元、5 點得 30 元，其他點數得 0 元。期望值是多少？
        sol: $E=60\times\dfrac{1}{6}+30\times\dfrac{1}{6}+0\times\dfrac{4}{6}=10+5=15$（元）。
        qs: [ma115-01, ma114-15, ma113-15, ma111-13, ma112-06]
      - name: 抽後不放回：和順序無關，知道結果就看剩下的
        cue: 「抽後不放回」「依序抽」「第 101 號抽中的機率」「前面的人已經抽走……」。
        how:
          - 不知道前面的人抽到什麼時，每一個順位抽中的機率都一樣（抽籤不分先後）。
          - 已經知道前面抽出的結果時，只看剩下的籤重新算。
        ex: 10 支籤中有 2 支有獎，10 人依序各抽 1 支、抽後不放回。第 3 個人抽中的機率是多少？如果已知前 2 人都沒抽中呢？
        sol: 不知道前面的結果時，第 3 個人和第 1 個人一樣，機率 $=\dfrac{2}{10}=\dfrac{1}{5}$。已知前 2 人都沒中：剩下 8 支、其中 2 支有獎，機率 $=\dfrac{2}{8}=\dfrac{1}{4}$。
        qs: [ma113-15]

  stat:
    title: 數據分析
    items:
      - name: 百分位數、中位數：先算是第幾個
        cue: 「第 k 百分位數」「中位數」「四分位數」，資料用人數表或次數分配表給。
        how:
          - 資料由小到大排好，算 $n\times\dfrac{k}{100}$：不是整數就取下一個整數那一個；是整數 m 就取第 m 個和第 $m+1$ 個的平均。
          - 用人數表時，一路累加人數，看第幾個落在哪一組。
          - 只有部分資料加分時，要重新確認排序，注意加分範圍的邊界。
        ex: 30 筆資料由小到大排好，第 25 百分位數、中位數各是第幾筆？
        sol: $30\times\dfrac{25}{100}=7.5$，不是整數，取第 8 筆。$30\times\dfrac{50}{100}=15$，是整數，取第 15、16 筆的平均。
        qs: [mb113-01, mb112-04, ma113-05]
      - name: 資料一起乘、一起加：線性變換
        cue: 「每人的分數乘 0.8 再加 20 分」「單位換算」「T 分數」「每個值都是另一組的 0.5 倍」。
        how:
          - 平均數、中位數、百分位數都跟著變：$\mu_y=a\mu_x+b$。
          - 標準差只受乘法影響：$\sigma_y=|a|\sigma_x$，加減常數不會改變標準差。
          - 相關係數：$a>0$ 不變，$a<0$ 變號；迴歸直線的斜率要用 $r\cdot\dfrac{\sigma_y}{\sigma_x}$ 重新算。
        ex: 某班數學平均 50 分、標準差 10 分。每個人的分數 x 都改成 $1.2x+10$，新的平均和標準差是多少？
        sol: 平均 $=1.2\times50+10=70$ 分；標準差 $=1.2\times10=12$ 分（加 10 分不影響標準差）。
        qs: [mb111-10, ma115-09, mb115-10, ma114-12]
      - name: 標準化：比較在不同組裡的位置
        cue: 「標準化」「標準分數」「T 分數」「數學和英文，哪一科的表現比較好」。
        how:
          - $z=\dfrac{x-\mu}{\sigma}$：z 越大，在自己那一組的位置越前面；標準化後的資料，平均是 0、標準差是 1。
          - T 分數 $=50+10z$。
        ex: 數學平均 60 分、標準差 12 分，某生考 72 分；英文平均 70 分、標準差 5 分，他考 78 分。哪一科的相對表現比較好？
        sol: 數學 $z=\dfrac{72-60}{12}=1$；英文 $z=\dfrac{78-70}{5}=1.6$。英文的 z 比較大，相對表現比較好。
        qs: [ma115-09]
      - name: 標準差的意義：只知道平均和標準差能推出什麼
        cue: 「標準差」「每一筆都在某個範圍內」「全距」「每一次都一樣嗎」。
        how:
          - 標準差是每筆資料和平均的差，平方後取平均再開根號，表示資料分散的程度。
          - 如果每筆資料都在 $\mu-d$ 到 $\mu+d$ 之間，標準差一定 $\le d$；所以標準差比 d 大，就一定有資料落在這個範圍外。
          - 只知道平均和標準差，不能推出全距、中位數或某一筆資料的值。
        ex: 資料 2、4、6、8 的平均和標準差各是多少？
        sol: 平均 $=5$；和平均的差是 $-3$、$-1$、1、3，平方的平均 $=\dfrac{9+1+1+9}{4}=5$，標準差 $=\sqrt{5}$。
        qs: [mb114-10, mb115-10]
      - name: 迴歸直線：一定通過平均點
        cue: 「迴歸直線」「最適直線」「用 x 預測 y」「由迴歸直線反推標準差」。
        how:
          - $y-\mu_y=r\cdot\dfrac{\sigma_y}{\sigma_x}(x-\mu_x)$，一定通過 $(\mu_x,\mu_y)$；x 代平均數，預測出來的就是 y 的平均數。
          - 已知斜率、r 和 $\sigma_x$，可以反推 $\sigma_y=\dfrac{\text{斜率}\times\sigma_x}{r}$。
          - 用 x 預測 y、用 y 預測 x，是兩條不同的直線。
        ex: $\mu_x=10$、$\mu_y=50$、$\sigma_x=2$、$\sigma_y=6$、$r=0.5$。寫出 y 對 x 的迴歸直線，並預測 $x=12$ 時的 y。
        sol: 斜率 $=0.5\times\dfrac{6}{2}=1.5$，迴歸直線是 $y-50=1.5(x-10)$。$x=12$ 時 $y=50+1.5\times2=53$。
        qs: [ma113-09, mb115-10, ma114-12]
      - name: 相關係數：看散布圖，換單位不影響
        cue: 「散布圖」「相關係數」「完全正相關」「換了單位以後」。
        how:
          - 點越集中在一條直線附近，$|r|$ 越接近 1；由左下往右上 $r>0$，由左上往右下 $r<0$。
          - 一組資料是另一組乘上正數再加常數 ⇒ $r=1$（完全正相關）。
          - 兩組資料各自乘正數、加常數，r 都不變；r 接近 0 只表示沒有「線性」關係。
        ex: 身高的單位從公分換成公尺，身高和體重的相關係數會改變嗎？
        sol: 不會。公分換成公尺是每個身高都乘 0.01（正數），相關係數不變。
        qs: [mb115-10, ma111-03]
      - name: 取對數後成一直線：還原成指數關係
        cue: 「把 t 取對數後畫散布圖」「點 $(s,\log t)$ 大致在一條直線上」。
        how: 從圖讀出直線 $\log t=ms+k$，再還原：$t=10^{ms+k}=10^k\cdot(10^m)^s$；選項寫成 $t^2=10^s$ 這類形式時，兩邊取對數比對斜率。
        ex: 點 $(s,\log t)$ 大致落在通過 $(0,1)$、$(1,3)$ 的直線上，t 和 s 的關係是什麼？
        sol: 直線是 $\log t=2s+1$，所以 $t=10^{2s+1}=10\times100^s$。
        qs: [ma112-03]
      - name: 讀表格、讀圖：先看單位和定義
        cue: 統計表、次數分配表、長條圖，或是兩組資料合併成一組。
        how:
          - 先確認單位（千人、萬人、百分比）和每一欄的意思，再判斷選項。
          - 判斷「可能／不可能」：找一個符合條件的例子，或用總數、最大值、最小值的限制排除。
        qs: [mb113-07, mb109-12]

  vec:
    title: 平面向量
    items:
      - name: 線性組合：解出係數，看點在哪裡
        cue: $\overrightarrow{OP}=\alpha\overrightarrow{OA}+\beta\overrightarrow{OB}$；「P 在三角形內部」「P 在平行四邊形內」「哪些 A、B 是可能的」。
        how:
          - 寫成坐標，列出 $\alpha$、$\beta$ 的聯立方程式解出來。
          - P 在直線 AB 上 ⇔ $\alpha+\beta=1$。
          - P 在 $\triangle OAB$ 內部或邊上 ⇔ $\alpha\ge0$、$\beta\ge0$、$\alpha+\beta\le1$；在 OA、OB 所張的平行四邊形內 ⇔ $0\le\alpha\le1$、$0\le\beta\le1$。
        ex: $\overrightarrow{OP}=\dfrac{1}{3}\overrightarrow{OA}+\dfrac{1}{2}\overrightarrow{OB}$，P 在 $\triangle OAB$ 的內部嗎？
        sol: 兩個係數都是正的，而且 $\dfrac{1}{3}+\dfrac{1}{2}=\dfrac{5}{6}<1$，所以 P 在 $\triangle OAB$ 的內部。
        qs: [mb114-09, mb109-03, ma111-09]
      - name: 分點與交點：同一點用兩種方法表示
        cue: 「$AP:PB=m:n$」「兩條線段的交點」「角平分線」「重心」「D 在直線 AB 上」。
        how:
          - 分點：$AP:PB=m:n$ ⇒ $\overrightarrow{OP}=\dfrac{n\overrightarrow{OA}+m\overrightarrow{OB}}{m+n}$，離哪個點近，那個點的係數就大。
          - 交點：設交點在第一條線上的比例是 s、在第二條線上的比例是 t，兩種寫法的係數對應相等，解出 s、t。
          - 角平分線把對邊分成兩鄰邊的比；「D 在直線 AB 上」可能是內分點，也可能是外分點，兩種都要考慮。
        ex: $\triangle ABC$ 中，D 在 $\overline{BC}$ 上，$BD:DC=1:2$。用 $\overrightarrow{AB}$、$\overrightarrow{AC}$ 表示 $\overrightarrow{AD}$。
        sol: $\overrightarrow{AD}=\dfrac{2\overrightarrow{AB}+\overrightarrow{AC}}{3}=\dfrac{2}{3}\overrightarrow{AB}+\dfrac{1}{3}\overrightarrow{AC}$（D 離 B 比較近，所以 $\overrightarrow{AB}$ 的係數比較大）。
        qs: [ma114-11, ma115-10, ma112-15, mb113-15]
      - name: 面積比：看線性組合的係數
        cue: $\overrightarrow{AP}=a\overrightarrow{AB}+b\overrightarrow{AC}$，問 $\triangle ABP$、$\triangle ACP$、$\triangle BCP$ 的面積或面積比。
        how:
          - P 在 $\triangle ABC$ 內部時：$\triangle ABP=b\cdot\triangle ABC$、$\triangle ACP=a\cdot\triangle ABC$、$\triangle BCP=(1-a-b)\cdot\triangle ABC$。
          - 記法：$\triangle ABP$ 和 $\triangle ABC$ 同底 AB，面積比＝高的比＝P、C 到直線 AB 的距離比，就是 $\overrightarrow{AC}$ 的係數 b。
        ex: $\overrightarrow{AP}=\dfrac{1}{4}\overrightarrow{AB}+\dfrac{1}{2}\overrightarrow{AC}$，求 $\triangle ABP:\triangle ACP:\triangle BCP$。
        sol: $\dfrac{1}{2}:\dfrac{1}{4}:\left(1-\dfrac{1}{4}-\dfrac{1}{2}\right)=\dfrac{1}{2}:\dfrac{1}{4}:\dfrac{1}{4}=2:1:1$。
        qs: [ma111-09, ma115-10]
      - name: 內積的三種算法
        cue: 求 $\overrightarrow{a}\cdot\overrightarrow{b}$ 或夾角；「圓上兩點」「已知三邊長」。
        how:
          - 有坐標：$\overrightarrow{a}\cdot\overrightarrow{b}=a_1b_1+a_2b_2$。
          - 有長度和夾角：$\overrightarrow{a}\cdot\overrightarrow{b}=|\overrightarrow{a}||\overrightarrow{b}|\cos\theta$。
          - 只有三邊長：$\overrightarrow{OA}\cdot\overrightarrow{OB}=\dfrac{OA^2+OB^2-AB^2}{2}$（就是餘弦定理）。
        ex: 半徑 5 的圓上有 A、B 兩點，$AB=6$，O 是圓心。求 $\overrightarrow{OA}\cdot\overrightarrow{OB}$。
        sol: $\overrightarrow{OA}\cdot\overrightarrow{OB}=\dfrac{5^2+5^2-6^2}{2}=\dfrac{14}{2}=7$。
        qs: [mb111-14, mb112-15, mb109-09, ma114-11]
      - name: 垂直、平行：翻成內積和倍數
        cue: 「垂直」「直角」「平行」「向量和直線垂直」。
        how:
          - 垂直 ⇔ 內積為 0；平行 ⇔ 一個向量是另一個的實數倍。
          - 直線 $ax+by=c$ 的法向量是 $(a,b)$、方向向量是 $(b,-a)$；斜率 m 的直線，方向向量是 $(1,m)$。
          - 內積的式子可以移項、提出相同的向量：$\overrightarrow{AB}\cdot\overrightarrow{AC}=\overrightarrow{AB}\cdot\overrightarrow{AD}$ ⇒ $\overrightarrow{AB}\cdot(\overrightarrow{AD}-\overrightarrow{AC})=\overrightarrow{AB}\cdot\overrightarrow{CD}=0$。
        ex: 向量 $(k,2)$ 和直線 $y=3x+1$ 垂直，求 k。
        sol: 直線的方向向量是 $(1,3)$，$(k,2)\cdot(1,3)=k+6=0$ ⇒ $k=-6$。
        trap: 「向量和直線垂直」是和直線的方向向量內積為 0；和法向量是「平行」。
        qs: [ma115-14, ma112-15, ma109-02]
      - name: 正射影：投影長＝內積÷長度
        cue: 「正射影」「投影長」「在某個方向的分量」「投影到一條直線上」。
        how:
          - $\overrightarrow{a}$ 在 $\overrightarrow{b}$ 方向的正射影長 $=\dfrac{|\overrightarrow{a}\cdot\overrightarrow{b}|}{|\overrightarrow{b}|}$；正射影 $=\dfrac{\overrightarrow{a}\cdot\overrightarrow{b}}{|\overrightarrow{b}|^2}\overrightarrow{b}$。
          - 兩個方向互相垂直時，向量在這兩個方向的正射影長，平方相加等於向量長度的平方。
        ex: $\overrightarrow{a}=(3,4)$ 在 $\overrightarrow{b}=(1,1)$ 方向的正射影長和正射影各是什麼？
        sol: $\overrightarrow{a}\cdot\overrightarrow{b}=7$、$|\overrightarrow{b}|=\sqrt{2}$。正射影長 $=\dfrac{7}{\sqrt{2}}=\dfrac{7\sqrt{2}}{2}$；正射影 $=\dfrac{7}{2}(1,1)=\left(\dfrac{7}{2},\dfrac{7}{2}\right)$。
        qs: [ma113-16, ma111-03]
      - name: 最大值、最小值：三角不等式、柯西不等式
        only: mathA
        cue: 「$|\overrightarrow{a}+\overrightarrow{b}|$ 的最大值」「$x^2+y^2=4$ 時 $3x+4y$ 的最大值」「點在圓上，求某個式子的範圍」。
        how:
          - 三角不等式 $|\overrightarrow{a}+\overrightarrow{b}|\le|\overrightarrow{a}|+|\overrightarrow{b}|$，兩向量同方向才取得到等號；方向受限制時改用坐標，讓每個分量各自取到最大。
          - 柯西不等式 $(ax+by)^2\le(a^2+b^2)(x^2+y^2)$，等號在 $(x,y)$ 和 $(a,b)$ 平行時成立。
        ex: $x^2+y^2=4$ 時，$3x+4y$ 的最大值是多少？
        sol: $(3x+4y)^2\le(3^2+4^2)(x^2+y^2)=25\times4=100$，所以 $3x+4y\le10$；$(x,y)=\left(\dfrac{6}{5},\dfrac{8}{5}\right)$ 時取到最大值 10。
        qs: [mb113-04, ma111-17]
      - name: 長度的最大值：每個分量各自取最大
        only: mathB
        cue: 「$|\overrightarrow{v}+\overrightarrow{AB}|$ 的最大值」「坐標都在某個範圍內」。
        how:
          - 把向量寫成坐標，每個分量能各自調整時，讓每個分量的絕對值都取到最大。
          - 用「兩個長度相加」估出來的上界，只有兩向量同方向時才取得到，常常達不到。
        ex: $\overrightarrow{u}=(x,y)$，$-1\le x\le1$、$-1\le y\le1$。$|(3,-2)+\overrightarrow{u}|$ 的最大值是多少？
        sol: $(3,-2)+\overrightarrow{u}=(3+x,-2+y)$：取 $x=1$、$y=-1$ 得 $(4,-3)$，長度是 5，最大值就是 5。
        qs: [mb113-04]
      - name: 面積：兩向量所張的三角形
        only: mathA
        cue: 「兩向量所張的三角形（平行四邊形）面積」「$2\overrightarrow{a}+\overrightarrow{b}$ 與 $\overrightarrow{a}+2\overrightarrow{b}$ 所張的面積」。
        how:
          - $\overrightarrow{a}=(a_1,a_2)$、$\overrightarrow{b}=(b_1,b_2)$ 所張平行四邊形的面積 $=|a_1b_2-a_2b_1|$，三角形是它的一半。
          - 行列式可以像乘法一樣展開：$\det(p\overrightarrow{a}+q\overrightarrow{b},r\overrightarrow{a}+s\overrightarrow{b})=(ps-qr)\det(\overrightarrow{a},\overrightarrow{b})$。
        ex: $\overrightarrow{a}=(3,1)$、$\overrightarrow{b}=(1,2)$ 所張三角形的面積是多少？
        sol: $\dfrac{1}{2}|3\times2-1\times1|=\dfrac{5}{2}$。
        qs: [ma110-04, ma115-10]
      - name: 沒有坐標的圖形：選兩個基底向量
        cue: 三角形、梯形、正六邊形的邊長、夾角或內積，題目沒有給坐標。
        how:
          - 選兩個不平行的向量當基底（例如 $\overrightarrow{AB}$、$\overrightarrow{AC}$），其他向量都用它們表示。
          - 先算好 $|\overrightarrow{AB}|^2$、$|\overrightarrow{AC}|^2$、$\overrightarrow{AB}\cdot\overrightarrow{AC}$ 三個數，求長度、角度時都用它們展開。
          - 也可以直接把圖形放上坐標平面：一個頂點放原點、一邊放在 x 軸上。
        ex: $\triangle ABC$ 中，$AB=6$、$AC=5$、$\cos A=\dfrac{3}{4}$，M 是 $\overline{BC}$ 的中點。求 AM 的長。
        sol: $\overrightarrow{AM}=\dfrac{1}{2}(\overrightarrow{AB}+\overrightarrow{AC})$，$\overrightarrow{AB}\cdot\overrightarrow{AC}=6\times5\times\dfrac{3}{4}=\dfrac{45}{2}$。$|\overrightarrow{AM}|^2=\dfrac{1}{4}\left(36+25+2\times\dfrac{45}{2}\right)=\dfrac{106}{4}$，所以 $AM=\dfrac{\sqrt{106}}{2}$。
        qs: [ma114-11, mb110-11, mb112-15]

  space:
    title: 空間向量
    items:
      - name: 立體圖形放上坐標
        cue: 正立方體、長方體、四面體，問向量、外積、夾角或距離。
        how:
          - 一個頂點放在原點，三條互相垂直的稜放在 x、y、z 軸上。
          - 正立方體各頂點的坐標只由 0 和邊長組成，寫出坐標後就能用內積、外積計算。
        ex: 邊長 1 的正立方體，O 是一個頂點，求體對角線 $\overrightarrow{OG}=(1,1,1)$ 和稜 $\overrightarrow{OA}=(1,0,0)$ 夾角的餘弦值。
        sol: $\cos\theta=\dfrac{(1,1,1)\cdot(1,0,0)}{\sqrt{3}\times1}=\dfrac{1}{\sqrt{3}}=\dfrac{\sqrt{3}}{3}$。
        qs: [ma113-02, ma112-06, ma115-18]
      - name: 外積：同時垂直兩個向量，算面積
        cue: 「同時垂直」「法向量」「空間中三角形或平行四邊形的面積」。
        how:
          - $\overrightarrow{a}\times\overrightarrow{b}=(a_2b_3-a_3b_2,a_3b_1-a_1b_3,a_1b_2-a_2b_1)$，同時垂直 $\overrightarrow{a}$ 和 $\overrightarrow{b}$。
          - $|\overrightarrow{a}\times\overrightarrow{b}|$ 是 $\overrightarrow{a}$、$\overrightarrow{b}$ 所張平行四邊形的面積，三角形是一半。
          - 算完驗算：外積和 $\overrightarrow{a}$、$\overrightarrow{b}$ 的內積都要是 0。
        ex: 求 $\overrightarrow{a}=(1,2,0)$、$\overrightarrow{b}=(0,1,3)$ 所張平行四邊形的面積。
        sol: $\overrightarrow{a}\times\overrightarrow{b}=(6,-3,1)$，驗算 $(6,-3,1)\cdot(1,2,0)=0$、$(6,-3,1)\cdot(0,1,3)=0$。面積 $=\sqrt{36+9+1}=\sqrt{46}$。
        qs: [ma115-18, ma113-02, ma111-16]
      - name: 求平面：法向量加一點
        cue: 「過三點的平面」「包含直線 L 而且和直線 M 平行」「和某個平面垂直」。
        how:
          - 在平面上找兩個不平行的方向，外積得到法向量 $(a,b,c)$，再代一點：$a(x-x_0)+b(y-y_0)+c(z-z_0)=0$。
          - 平面包含直線 ⇒ 直線的方向在平面上；平面和直線平行 ⇒ 法向量和直線的方向垂直；兩平面垂直 ⇒ 兩個法向量垂直。
        ex: 求過 $A(1,0,0)$、$B(0,2,0)$、$C(0,0,3)$ 三點的平面方程式。
        sol: $\overrightarrow{AB}=(-1,2,0)$、$\overrightarrow{AC}=(-1,0,3)$，外積 $=(6,3,2)$。過 A：$6(x-1)+3y+2z=0$，也就是 $6x+3y+2z=6$。
        qs: [ma110-15, ma111-16, ma112-16]
      - name: 點到平面的距離
        cue: 「點到平面的距離」「到三個平面的距離都是 6」「兩平行平面的距離」。
        how:
          - 點 $(x_0,y_0,z_0)$ 到 $ax+by+cz+d=0$ 的距離 $=\dfrac{|ax_0+by_0+cz_0+d|}{\sqrt{a^2+b^2+c^2}}$。
          - 拿掉絕對值時，用題目的條件（坐標的正負、點在平面的哪一側）決定裡面是正還是負。
        ex: 求點 $(1,2,3)$ 到平面 $2x-y+2z=1$ 的距離。
        sol: $\dfrac{|2\times1-2+2\times3-1|}{\sqrt{4+1+4}}=\dfrac{5}{3}$。
        qs: [ma114-14, ma112-16]
      - name: 投影點、垂足：設參數，再用垂直解
        cue: 「投影點」「垂足」「最近的點」「和直線相交而且垂直」。
        how:
          - 點到直線：直線上的點寫成參數式 $P(t)$，令 $\overrightarrow{AP}$ 和方向向量的內積為 0，解出 t。
          - 點到平面：從點出發沿著法向量走，$P(t)=A+t(a,b,c)$，代入平面方程式解出 t。
        ex: 求原點在平面 $x+2y+2z=9$ 上的投影點。
        sol: 投影點是 $(t,2t,2t)$，代入：$t+4t+4t=9$ ⇒ $t=1$，投影點是 $(1,2,2)$。
        qs: [ma109-18, ma113-18, ma112-16]
      - name: 兩歪斜線：公垂線與距離
        cue: 「歪斜線」「公垂線」「和兩條直線都相交而且垂直」「兩直線的距離」。
        how:
          - 兩條線各寫成參數式 $P(t)$、$Q(s)$，令 $\overrightarrow{PQ}$ 同時和兩個方向向量垂直，解出 t、s，$\overline{PQ}$ 就是公垂線段。
          - 或者：兩個方向向量的外積是公垂線的方向，兩條線上各取一點，連線向量在這個方向的正射影長就是距離。
        ex: $L_1$：$(t,0,0)$，$L_2$：$(1,s,2)$（t、s 是實數）。求兩直線的距離。
        sol: 方向 $(1,0,0)$、$(0,1,0)$ 的外積是 $(0,0,1)$；兩線上各取 $(0,0,0)$、$(1,0,2)$，連線 $(1,0,2)$ 在 $(0,0,1)$ 方向的正射影長是 2，所以距離是 2。
        qs: [ma112-17]
      - name: 體積：三階行列式、底面積乘高
        cue: 「平行六面體的體積」「三向量所張」「四面體的體積」「用體積反推點到平面的距離」。
        how:
          - 平行六面體的體積 $=|\overrightarrow{a}\cdot(\overrightarrow{b}\times\overrightarrow{c})|$，就是三階行列式的絕對值；四面體是它的 $\dfrac{1}{6}$。
          - 也可以用「底面積 × 高」；反過來，點到平面的距離 $=\dfrac{3\times\text{四面體體積}}{\text{底面積}}$。
          - 三個向量互相垂直時，體積就是三個長度相乘。
        ex: 求 $\overrightarrow{a}=(1,0,0)$、$\overrightarrow{b}=(1,2,0)$、$\overrightarrow{c}=(1,1,3)$ 所張平行六面體的體積。
        sol: $\overrightarrow{b}\times\overrightarrow{c}=(6,-3,-1)$，$\overrightarrow{a}\cdot(\overrightarrow{b}\times\overrightarrow{c})=6$，體積是 6。
        qs: [ma114-06, ma111-17, ma110-20, ma112-05]
      - name: 兩平面的夾角、三垂線定理
        cue: 四面體、積木，問兩平面的夾角或垂直關係。
        how:
          - 兩平面的夾角用法向量算最穩：$\cos\theta=\dfrac{|\overrightarrow{n_1}\cdot\overrightarrow{n_2}|}{|\overrightarrow{n_1}||\overrightarrow{n_2}|}$（取銳角）。
          - 圖形容易看出來時，在兩個平面上各作一條垂直交線的直線（交在同一點），兩線的夾角就是兩面角。
          - 三垂線定理：$\overline{PA}$ 垂直平面 E 於 A，E 上的直線 L 垂直 $\overline{AB}$ 於 B，則 $\overline{PB}\perp L$。
        ex: 求平面 $x+y=1$ 和平面 $y+z=2$ 的夾角（取銳角）。
        sol: 法向量 $(1,1,0)$、$(0,1,1)$：$\cos\theta=\dfrac{|0+1+0|}{\sqrt{2}\times\sqrt{2}}=\dfrac{1}{2}$，夾角是 $60^{\circ}$。
        qs: [ma109-13, ma111-11]
