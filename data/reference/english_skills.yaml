cloze_types:  # 綜合測驗五類考點：[類型（english_tags 的第二欄）, 線索在哪裡, 學測例子]
  - [詞彙, 空格前後的搭配詞，以及上下文的同義、反義線索, "115 年第 13 題：provide important clues（化學物質提供「線索」）"]
  - [片語搭配, 空格後面的介系詞或受詞，決定要用哪個片語, "114 年第 14 題：give rise to（導致）"]
  - [文法, 先找這句的主詞和主要動詞，再看時間線索（since、by then、in the past）, "115 年第 17 題：had yet to develop（當時還沒發展）"]
  - [轉折語, 判斷空格前後兩句的關係：補充、轉折、因果、換句話說、結論, "115 年第 11 題：it turns out（結果發現）"]
  - [語意, 選項是片語或子句：讀完整段，選和前後文意思一致的, "115 年第 20 題：a joyful social activity（一群人一起吃的社交活動）"]

cloze_steps:
  - 先讀完空格所在的整段（最好整篇），抓主題和作者的態度，不要一題一題只看單句。
  - 看四個選項判斷題型：不同的字→詞彙；同一個字的不同形式→文法；轉折語→看前後句關係；介系詞、片語→搭配；長片語或子句→語意。
  - 依題型找線索（見下表），先刪掉詞性或文法不合的選項。
  - 把答案代回整句再讀一次，文法和意思都要通。

cloze_grammar:  # 文法考點速查：[考點, 判斷方法, 例句, 出處（題號；空白＝自編例句）]
  - [時態（現在完成式）, "since、for＋一段時間 → have p.p. 或 have been V-ing（從過去持續到現在）", "Since the 1970s, book towns like Hay-on-Wye have been springing up all over the world.", eng111-12]
  - [時態（過去的未來）, "從過去的時間點看之後的事 → would＋原形動詞", "None of them had any idea they were about to create a social innovation that would spread rapidly around the world.", eng114-11]
  - [have yet to V, "還沒…（had yet to＝當時還沒）", "But the culinary art of dim sum had yet to develop, for it was considered inappropriate to pair tea with food.", eng115-17]
  - [句子的主要動詞, "一個子句只能有一個主要動詞；先看句子缺不缺動詞", "…our body fluids redistribute, shifting toward the upper body and the head.", eng112-18]
  - [分詞當形容詞, "主動、進行用 V-ing；被動、完成用 p.p.", "…the pills were placed in 40 bird feeders installed throughout the city.", eng110-20]
  - [分詞構句, "兩個動作的主詞相同時可省略連接詞；先發生的用 Having＋p.p.", "Having already shrunk by 85%…, Papua’s glaciers will completely disappear within a decade.", eng110-28]
  - [被動語態, "主詞是動作的接受者 → be＋p.p.", "The problem is intensified when airplanes fly at higher altitudes.", eng111-18]
  - [關係代名詞, "物 which／that、人 who、所有格 whose；動詞片語的介系詞可移到 which 前面", "…the stores to which they are assigned.", eng113-12]
  - [假設語氣, "與過去事實相反的結果用 would have＋p.p.（標準句型：If＋had p.p., S＋would have p.p.）", "“If he was, the first bolt would have been enough.”", eng110-25]
  - [助動詞＋have p.p., "could have p.p. 本來可以（實際上沒有）｜should have p.p. 早該｜must have p.p. 一定已經｜may have p.p. 可能已經", "They could have used alarm clocks… But the new device was still relatively expensive and unreliable.", eng113-16]
  - [used to＋V, "過去曾經（現在不是了）；be used to＋V-ing 是「習慣於」", "In the early days of aviation, plane windows used to be square in shape.", eng111-17]
  - [代動詞, "do／does／did 代替前面出現過的一般動詞，避免重複", "One part… detects that your body is moving, but the other parts don’t.", eng114-18]
  - [介系詞＋名詞或 V-ing, "介系詞（包括 despite、of、to 當介系詞時）後面不能接子句或原形動詞", "Despite decades of investigation, there is no consensus on…", eng112-15]
  - [對等連接, "and、or、but 前後的詞性、形式要一致", "She likes reading, cooking, and swimming.", ""]
  - [主詞與動詞一致, "the number of＋複數名詞→單數動詞；each、every＋單數名詞→單數動詞", "The number of tourists is growing.", ""]
  - [比較, "the＋比較級…, the＋比較級…（越…越…）；as＋原級＋as", "The more you read, the better you write.", ""]

fill_positions:  # 文意選填：空格位置與需要的詞性
  - ["a／an／the＋（形容詞）＋＿＿", 名詞（a 後面要單數）]
  - ["＿＿＋名詞", 形容詞]
  - ["副詞＋＿＿＋名詞", 形容詞（例：surprisingly ＿＿ benefits）]
  - ["be 動詞＋＿＿", "形容詞，或 V-ing（進行）、p.p.（被動）"]
  - ["to（不定詞）、助動詞（may、can、will）、help＋＿＿", 原形動詞]
  - ["主詞＋＿＿＋受詞", "動詞（看主詞單複數與時態，決定要不要加 s、ed）"]
  - ["介系詞＋＿＿", 名詞或 V-ing]
  - ["名詞＋and＋＿＿", 名詞（and 前後的詞性要相同）]

reading_types:  # 閱讀測驗題型：[類型（english_tags 的第二欄）, 常見問法, 怎麼做]
  - [主旨, "What is the passage mainly about?／What is the main idea of the passage?／Which is the best title for the passage?", 看第一段與最後一段、每段第一句；只講一段的細節或超出全文範圍的選項都不對。]
  - [細節, "According to the passage, which of the following is true (NOT true)?／Which of the following is mentioned in the passage?", 先圈出選項的關鍵字，回原文找對應的句子；正確選項常常是原文「換句話說」。]
  - [推論, "What can be inferred from the passage?／The author would most likely agree that…", 推論一定要有原文根據，不能用自己的常識補。]
  - [指涉, "What does \"it\" in the second paragraph refer to?", 往前找最近、單複數一致的名詞，代回原句讀讀看。]
  - [字義, "Which of the following is closest in meaning to \"…\" in the third paragraph?", 不要只靠字典意思，用上下文推，再代換回去檢查。]
  - [圖片, "Which of the following pictures (charts) best shows…?", 把文中描述位置、數量、順序的句子標出來，一張一張比對。]
  - [結構, "How is the passage organized?／Why does the author mention…?", 每段寫一個關鍵詞，看出「問題→原因→解決」「時間順序」「比較對照」等安排。]

stem_words:  # 題目常見的字：[英文, 中文]
  - [infer, 推論]
  - [imply, 暗示]
  - [mention, 提到]
  - [refer to, 指的是]
  - [indicate, 表示、指出]
  - [suggest, 暗示；建議]
  - [purpose, 目的]
  - [attitude, 態度]
  - [tone, 語氣]
  - [organize, 組織、安排]
  - [illustrate, 舉例說明]
  - [contrast, 對比]
  - [conclude, 下結論]
  - [support, 支持（論點）]
  - [according to, 根據]
  - ["NOT／EXCEPT", "不是／除了（選錯的那一個）"]
  - [closest in meaning, 意思最接近]
  - [best describes, 最能描述]

attitude_words:  # 態度、語氣題常見的字：[英文, 中文]
  - [optimistic, 樂觀的]
  - [pessimistic, 悲觀的]
  - [supportive, 支持的]
  - [critical, 批判的]
  - [skeptical, 懷疑的]
  - [objective, 客觀的]
  - [neutral, 中立的]
  - [indifferent, 漠不關心的]
  - [sympathetic, 同情的]
  - [admiring, 欣賞的]
  - [concerned, 擔憂的]
  - [humorous, 幽默的]
  - [sarcastic, 諷刺的]
  - [nostalgic, 懷舊的]

eliminate:  # 刪去法：看到這些就刪
  - 和原文矛盾。
  - 原文沒提到：看起來合理，但文章裡沒寫。
  - 張冠李戴：把 A 做的事說成 B 做的（115 年第 37 題 (D)：他是「親自」帶船員去求援，不是派人去）。
  - 時間錯置：把「希望、打算做」說成「已經做到」（115 年第 37 題 (B)：他只是「希望」成為第一個橫越南極大陸的人）。
  - 程度誇大：all、always、never、only、must 這類絕對的字要特別小心。
  - 只對一半：前半句正確、後半句錯誤。

structure_clues:  # 篇章結構的線索：[線索, 說明]
  - [代名詞、指示詞, "this、these、such、it、they 一定指前面提過的人事物；先確定它指誰。"]
  - [轉折語, "However、But → 前後相反｜For example → 前面是概念｜In addition、Moreover、Also → 同方向補充｜As a result、Therefore、Thus → 結果｜Another → 第二個論點"]
  - [重複的關鍵字, 空格前後出現的關鍵字或同義字，常常也出現在正確的選項裡。]
  - [時間順序, "First、Then、Later、Finally，或年代的先後。"]
  - [空格的位置, 段首的空格通常是主題句（要能概括整段）；段尾的空格通常是結論，或轉到下一段。]
  - [多出來的句子, "主題相關、但文章沒有討論的細節（115 年多出來的 (D) 談真笑與假笑，全文都沒提）。"]

structure_steps:
  - 先讀第一段和每段的第一句，抓全文架構。
  - 讀 5 個選項，圈出代名詞、轉折語和關鍵字。
  - 先填最有把握的空格，用過的選項劃掉。
  - 最後把「前一句＋空格＋後一句」連起來讀一次。

cloze_traps:  # 綜合測驗常見陷阱
  - 中文意思說得通，英文搭配卻不對：raise grave concerns ✓，harsh concerns ✗（115 年第 10 題，全國答對率只有 24%）。
  - 只看空格那一句：轉折語一定要看前後兩句的關係；in other words 只能重述前一句的內容。
  - 文法題沒先找主要動詞：先判斷這一句缺什麼（主詞、動詞，還是修飾語），再看時態與主被動。
  - 看到熟悉的字就選：110 年第 15 題有 48% 的考生選了 transported，但 transport 一定要接受詞（transport passengers）。
