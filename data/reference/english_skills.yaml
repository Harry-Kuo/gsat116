# 英文重點整理：字首字根字尾、易混淆字、克漏字（綜合測驗、文意選填）與閱讀測驗的解題方法。
# 內容由 Claude 撰寫；★ 表示這個字在近六屆（110–115）學測英文考題中出現過（多半是選項或答案）。
# 題數與全國答對率由 tools/notion_md.py 依 data/concepts/english_tags.yaml 與官方統計自動計算。

prefixes:  # 字首：[字首, 意思, 例字]
  - [un-, 不、相反, "unusual 不尋常的★、unproductive 沒有生產力的★、unbiased 公正的、unchecked 不受控制的"]
  - [in- / im- / il- / ir-, 不, "invisible 看不見的、impossible 不可能的、illegal 違法的、irregular 不規則的"]
  - [dis-, 不、相反；分開, "disagree 不同意、disappear 消失、disrupt 擾亂、使中斷★"]
  - [mis-, 錯誤, "misunderstand 誤會、mislead 誤導、misuse 誤用"]
  - [non-, 非, "nonstop 不停的、nonprofit 非營利的"]
  - [re-, 再；回, "recall 回想★、resume 恢復、重新開始★、revise 修改★、redistribute 重新分配★"]
  - [pre-, 事先, "predict 預測、prevent 預防、preview 預習"]
  - [post-, 之後, "postpone 延期、postwar 戰後的"]
  - [fore-, 前、預先, "forecast 預報、foresee 預見"]
  - [over-, 過度；在上；翻轉, "overweight 過重的、overcome 克服、overturn 翻覆★"]
  - [under-, 不足；在下, "underestimate 低估、underground 地下的"]
  - [inter-, 在…之間、互相, "interaction 互動★、international 國際的、interview 面試"]
  - [trans-, 穿越、轉換, "transport 運送★、transfer 轉移★、transform 改變"]
  - [sub-, 在下, "subway 地鐵、submarine 潛水艇、subtitle 字幕"]
  - [super-, 超越、在上, "supernatural 超自然的、superior 較好的"]
  - [co- / con- / com-, 共同、一起, "cooperate 合作、connect 連接、combine 結合、compete 競爭"]
  - [de-, 向下；去除, "decrease 減少、decline 下降★、defrost 解凍"]
  - [ex-, 向外；超出, "export 出口、exceed 超過★、expose 揭露★"]
  - [en- / em-, 使…, "enable 使能夠、enrich 使豐富、enclose 圍住★"]
  - [anti-, 反對、對抗, "antibiotic 抗生素、antisocial 不愛社交的"]
  - [auto-, 自己, "automatic 自動的、autobiography 自傳"]
  - [tele-, 遠, "telephone 電話、telescope 望遠鏡、television 電視"]
  - [micro-, 微小, "microscope 顯微鏡、microwave 微波"]
  - [multi-, 多, "multiple 多重的★、multimedia 多媒體、multinational 跨國的"]
  - [uni- / mono-, 單一, "uniform 制服、unique 獨特的、universal 普遍的★、monotone 單調"]
  - [bi- / tri-, 二／三, "bicycle 腳踏車、bilingual 雙語的、triangle 三角形"]
  - [semi-, 半, "semicircle 半圓、semifinal 準決賽"]
  - [out-, 向外；超過, "outdoor 戶外的、outcome 結果、outnumber 數量超過"]

