  - [-ment, 名詞, "improvement 改進★、adjustment 調整★、management 管理★"]
  - [-ness, 名詞：性質、狀態, "soreness 痠痛★、kindness 好意、darkness 黑暗"]
  - [-ity / -ty, 名詞：性質, "humidity 濕度★、necessity 必要★、sincerity 誠意★、density 密度★"]
  - [-ance / -ence, 名詞, "importance 重要性、existence 存在、absence 缺席"]
  - [-er / -or / -ist / -ant, 名詞：人, "commuter 通勤者★、instructor 教練★、assistant 助理★、scientist 科學家"]
  - [-ship / -hood, 名詞：關係、身分、時期, "friendship 友誼、leadership 領導力、childhood 童年"]
  - [-ism, 名詞：主義、行為, "tourism 觀光業、individualism 個人主義"]
  - [-able / -ible, 形容詞：可以…的, "manageable 可以處理的★、visible 看得見的★、agreeable 隨和的★"]
  - [-ful, 形容詞：充滿…的, "fateful 決定命運的★、forceful 強而有力的★、harmful 有害的"]
  - [-less, 形容詞：沒有…的, "careless 粗心的、homeless 無家可歸的、hopeless 沒希望的"]
  - [-ous, 形容詞：具有…性質的, "harmonious 和諧的★、contagious 有傳染性的★、dangerous 危險的"]
  - [-ive, 形容詞：有…傾向的, "persuasive 有說服力的★、defensive 防衛的★、offensive 冒犯的★"]
  - [-al / -ic, 形容詞：與…有關的, "cultural 文化的★、conventional 傳統的★、dramatic 顯著的★"]
  - [-ary / -ory, 形容詞：與…有關的, "revolutionary 革命性的★、compulsory 強制的★"]
  - [-ize / -ify, 動詞：使…化, "emphasize 強調★、intensify 加強★、justify 證明…有理★"]
  - [-en, 動詞：使變得, "widen 加寬、strengthen 加強、sharpen 使銳利"]
  - [-ly, 副詞：…地, "initially 起初★、randomly 隨機地★、jointly 共同地★"]
  - [-ward(s), 副詞：方向, "toward 朝向、backward 向後、upward 向上"]

