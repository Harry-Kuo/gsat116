# 🧭 答題技巧：三大題各一節，table 是附在條列後面的對照表（第一列是表頭）。
skills:
  - title: 混合題：答案都在文章裡（約 8–10 分鐘）
    items:
      - "**先看題目再讀文章**：47–50 題先掃一遍，知道要找哪兩個字、哪些選項、哪個片語，讀文章時直接在可能的答案下面畫線。"
      - "**填充題先判斷詞性**：題目句是文章的摘要。先看空格前後，決定要名詞、形容詞、V-ing 還是過去分詞，再回文章找意思相符的字。"
      - "**一定要做字形變化**：每格只能填一個單詞，而且常常要換詞性，不只是加 s 或 ed（例如 115 年文章裡是 innovative，答案是 innovation）。字形或拼字錯誤只拿一半分數；113、115 年的閱卷說明都提醒，不少考生找對了字卻沒有變化字形。"
      - "**多選題每個選項都要判斷**：選項獨立計分，n 個選項中答錯 k 個，得 (n−2k)/n 的分數；該選的沒選也算錯一個。每個選項都回文章找證據，標 ✓ 或 ✗；最常看漏的是「兩者都符合」（111、113 年）和「只在特定情況下」（112 年）這類條件。"
      - "**簡答題照抄原文**：題目要你從文章找一個片語時，照抄文章裡的形式（112 年 does the trick、114 年 fostering empathy、115 年 one of a kind），不用寫成完整句子，也不必另外說明。抄完逐字母對照拼字。"
    table_title: "**填充題的字形變化（112–115 年）**"
    table:
      - [年度, 題目句的空格, 文章裡的字, 答案, 判斷方法]
      - ["115", "tradition coexists harmoniously with ＿＿", innovative, innovation, 介系詞 with 後面要名詞]
      - ["115", "local features are perfectly ＿＿ with foreign elements", blend, blended, "are＋＿＿＋with 是被動，用過去分詞"]
      - ["114", "conserving endangered species as well as ＿＿ visitors", "entertainment、education", "entertaining／educating", "as well as 前後對等，跟 conserving 一樣用 V-ing"]
      - ["114", "the animals ＿＿ there will lose the freedom", "confine、confining", "confined／caged", "修飾 the animals、表示「被關著的」，用過去分詞"]
      - ["113", "are able to use ＿＿ intelligence", "group、collectively", "group／collective", "放在名詞 intelligence 前面修飾它；副詞 collectively 要改成形容詞"]
      - ["113", "in both solving problems and ＿＿ to new challenging environment", adapt, adapting, "both A and B 前後對等，跟 solving 一樣用 V-ing"]
      - ["112", "the issues of ＿＿, price, and ＿＿ concerns", "taste、healthy", "taste、health（兩格可對調）", "兩格都要名詞：形容詞 healthy 要改成 health"]
  - title: 中譯英：先抓主幹，再補修飾（每句約 4–5 分鐘）
    items:
      - "**先找主詞和動詞**：中文常省略主詞，英文一定要有；113 年閱卷說明提到，有考生第一句就漏了主詞。例如「在享受寵物所帶來的歡樂時」要補出主詞：When we enjoy …（111 年）。"
      - "**再決定時態**：看中文的時間線索。「已經增加」用現在完成式 have increased（115 年）；「過去在科幻電影中出現的神奇物件，現在正逐一成真」，關係子句用過去式、主要子句用現在進行式（114 年）；「總會看到」用 can／will be seen（113 年）。"
      - "**修飾語搬到名詞後面**：中文的修飾語放在名詞前面，英文較長的修飾語放在名詞後面，例如關係子句 things that appeared in sci-fi movies（114 年）、過去分詞 the goal pursued by all human beings（112 年）、介系詞片語 famous temples in different places（113 年）。"
      - "**背熟考過的句型**：not A but B、動名詞當主詞配單數動詞 Keeping a pet is …（111 年）；不定詞當主詞 To avoid … and ensure … should be …（112 年）；be seen V-ing、Besides＋V-ing（113 年）；the biggest driving force for …（114 年）；more and more＋複數名詞、divide A into B、based on（115 年）。"
      - "**基本字要拼對、用對**：考的字大多在詞彙表 1–4 級，扣分多半出在基本字。閱卷說明列出的錯誤有：divide 拼成 devide、senior 拼成 sinior、用 hear 和 talk 代替 listen 和 speak（115 年）；election 拼成 eletion、politicians 拼成 polititions、temples 拼成 tamples、customs 和 costumes 混淆、「尊重」譯成 expect（113 年）。"
      - "**想不起最準的字，就換成有把握的同義字**：官方參考答案本來就接受多種寫法（例如 short-term／temporary、ignore／neglect／overlook），每個錯誤只扣 0.5 分，不要整句空白。"
      - "**最後檢查 5 件事**：句首大寫、句尾句號、主詞和動詞一致、單複數、冠詞。"
  - title: 英文作文：考場流程（約 25–28 分鐘）
    items:
      - "**審題（2 分鐘）**：把題目「第一段…第二段…」各要寫的事圈起來，列成清單，寫完逐項打勾。題目要「原因以及可能的影響」，兩樣都要寫；大考中心的評分重點是「內容須符合題目要求，提供充分、具體之細節」（115 年評分原則）。"
      - "**選模板（1 分鐘）**：用下面「🧩 作文題型與模板」的對照表，決定兩段各用哪一個模板。"
      - "**列大綱（3 分鐘）**：在試題本空白處，每段寫下主題句和 2–3 個細節，寫關鍵字就好。"
      - "**寫作（17 分鐘）**：每段 75–90 個單詞，全文 150–180 個單詞。少於 120 個單詞、沒有分段，各扣總分 1 分。"
      - "**檢查（3 分鐘）**：主詞和動詞一致、時態、單複數、冠詞、拼字、句首大寫與句尾標點；再對照下面的常見錯誤。"
      - "**時態跟著任務走**：描述圖片用現在式或現在進行式；說故事、寫經驗用過去式；說看法、原因用現在式；寫想像、理想用 would。"
      - "**句子寧可簡單正確**：用有把握的句型，再用轉承語（First、However、As a result、In my opinion）把句子串起來；轉承語是「組織」的得分點。"
      - "**不要寫自己的名字**：作答區不能寫姓名、應試號碼或無關的文字、圖案。書信題只能用題目指定的名字署名（97、101 年）。"
    table_title: "**常見文法錯誤（檢查時對照）**"
    table:
      - [錯誤, ✗ 錯誤寫法, ✓ 正確寫法]
      - [逗號連接兩個句子, "I like dogs, they are cute.", "I like dogs because they are cute."]
      - [Because 子句單獨成句, "Because it was raining.", "We stayed home because it was raining."]
      - [Although 和 but 一起用, "Although it was late, but he kept working.", "Although it was late, he kept working."]
      - [There 句型用 have, "There have many people in the park.", "There are many people in the park."]
      - [主詞和動詞不一致, "Keeping pets are not easy.", "Keeping pets is not easy."]
      - [very 的位置, "I very like this park.", "I like this park very much."]
      - [多餘的介系詞, "We discussed about the plan.", "We discussed the plan."]
      - [不可數名詞加 s, "She gave me many advices.", "She gave me a lot of advice."]

# 🧩 作文題型與模板：history 的 p1、p2 是 [模板編號, 這一段要寫什麼]，各模板的「歷屆」由 history 自動算出。
essay_types:
  intro:
    - "95–115 年 21 屆的英文作文可以分成 7 類。107 年起連續 9 屆都是兩段式：題目直接寫出第一段、第二段各要寫什麼（大考中心稱為引導寫作）。連環圖片說故事最近一次是 106 年，書信是 101 年，116 年都還有可能出現。"
    - "看到題目先圈出兩段的任務，再用「第一步」的表找出對應的模板；兩段任務不同時，就各套一個模板。模板裡的〔 〕換成自己的內容，範文裡的粗體就是套用的模板句。模板句和範文都是自編的，不是考題原句。"
  pick:
    - {id: 1, cue: "連環圖片、想像最後一幅、寫出完整結局、事件接下來的發展和結果"}
    - {id: 2, cue: "寫一封信、在信末署名"}
    - {id: 3, cue: "描述圖片呈現的現象、人們為什麼這麼做、說明原因與影響"}
    - {id: 4, cue: "圖 A 和圖 B、對比圖片、兩種不同的情景"}
    - {id: 5, cue: "你會選哪一個、說明選擇的理由"}
    - {id: 6, cue: "你的看法、心得或感想、以自身經驗為例"}
    - {id: 7, cue: "介紹或行銷、提出方法、化解或解決問題"}
  skeleton:
    - "**主題句（1 句）**：直接回答這一段的任務，不要只重複題目。"
    - "**支持句（4–6 句）**：寫 2–3 個重點，每個重點後面接 1 個具體細節或例子（人、時間、地點、經驗）。"
    - "**結尾句（1 句）**：第一段用小結（This shows that …），第二段用結論呼應主題（In short, …／All in all, …）。"
    - "**長度**：每段 75–90 個單詞，全文 150–180 個單詞。"
  skeleton_note: "這個骨架正好對應評分指標：主題句清楚、有具體細節，是「內容」的得分點；有開頭、發展、結尾，加上轉承語，是「組織」的得分點。"
  history_note: "101 年和連環圖題沒有規定段數，表中是建議的分法；一律寫成兩段最保險（評分原則規定未分段扣總分 1 分）。"
  history:
    - {year: 115, topic: 寵物在生活中的角色（三張圖）, p1: [3, 描述圖片中的現象], p2: [3, 用經驗或觀察說明原因與可能的影響]}
    - {year: 114, topic: 颱風假（兩張對比圖）, p1: [4, 颱風假實際上可能出現的兩種情景], p2: [6, 對放颱風假的看法與經驗]}
    - {year: 113, topic: 機器人小幫手（三個青少年煩惱選一個）, p1: [5, 最想解決哪一個問題＋原因], p2: [5, 機器人的特質或能力＋如何分工合作]}
