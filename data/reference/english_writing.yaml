  types:
    - id: 1
      name: 看圖說故事
      when: "連環圖片要你想像最後一幅、寫出完整結局，或題目要你寫事件接下來的發展和結果。"
      structure:
        - "全篇用過去式。每張圖至少寫 2 句，所有圖都要寫到，結局要完整、合理。"
        - "第一段（起＋承）：時間、地點、人物 → 第一張圖在做什麼 → 第二張圖發生了什麼事。"
        - "第二段（轉＋合）：轉折與主角的反應 → 你想像的結局 → 主角的感受或學到的事。"
      open:
        - "One 〔sunny morning〕, 〔人物〕 was 〔V-ing〕 at 〔地點〕.（某個〔晴朗的早晨〕，〔人物〕正在〔地點〕〔做某事〕。）"
        - "〔人物〕 had been looking forward to 〔N／V-ing〕 for weeks.（〔人物〕期待〔某事〕好幾個星期了。）"
        - "It was 〔a special day〕 for 〔人物〕 because 〔子句〕.（那天對〔人物〕來說是〔特別的一天〕，因為……）"
      develop:
        - "Suddenly／All of a sudden, 〔子句〕.（突然，……）"
        - "To 〔his／her〕 surprise, 〔子句〕.（令〔他／她〕驚訝的是，……）"
        - "As soon as 〔人物〕 〔過去式〕, 〔子句〕.（〔人物〕一……就……）"
        - "〔人物〕 was so 〔nervous／excited〕 that 〔子句〕.（〔人物〕太〔緊張／興奮〕了，以至於……）"
        - "Without thinking twice, 〔人物〕 decided to 〔V〕.（〔人物〕想都沒想就決定……）"
        - "Just then, 〔子句〕.（就在那時，……）"
      close:
        - "In the end／Finally, 〔子句〕.（最後，……）"
        - "It turned out that 〔子句〕.（結果原來……）"
        - "From then on, 〔人物〕 never 〔V〕 again.（從那時起，〔人物〕再也沒有……）"
        - "〔人物〕 learned a valuable lesson: 〔子句〕.（〔人物〕學到寶貴的一課：……）"
        - "It was a day 〔人物〕 would never forget.（那是〔人物〕永遠忘不了的一天。）"
      sample:
        title: 109 年賣場週年慶
        prompt: "看兩張賣場週年慶的新聞圖片（圖 1：玻璃門一推開，大批顧客湧進賣場；圖 2：櫃位前擠滿搶購的人），想像其中發生的一個事件。第一段描述兩張圖的場景與正在發生的狀況；第二段敘述事件接下來的發展和結果。"
        paras:
          - "**One Saturday morning,** hundreds of shoppers **were waiting** outside a popular department store. It was the first day of its anniversary sale. **As soon as** the glass doors opened, the crowd rushed in, pushing one another. Inside, customers crowded around the counters to grab the best deals before everything was sold out. The salespeople **were so busy that** they could hardly answer all the questions. Among the crowd was Mrs. Lin, an old woman who had waited in line since six o'clock."
          - "**Suddenly,** Mrs. Lin was pushed and fell to the floor. The crowd kept moving forward, and nobody seemed to notice her. **Just then,** a young salesclerk named Amy saw what had happened. **Without thinking twice,** she shouted for everyone to stop and helped Mrs. Lin to a chair. Luckily, the old woman was not badly hurt. **In the end,** the manager apologized to her and decided to let shoppers in a few at a time. **Everyone learned a valuable lesson:** safety is more important than any discount."
    - id: 2
      name: 書信
      when: "題目要你寫一封信給朋友：勸告、道歉、建議或感謝。"
      structure:
        - "稱呼：Dear 〔指定的名字〕,（後面用逗號，自己一行）"
        - "第一段：問候＋寫信的目的（說出你的擔心，或說明事情經過）。"
        - "第二段：具體的建議，或道歉＋補救方法 → 祝福或期待回信。"
        - "結尾：Your friend, 或 Sincerely,（自己一行）＋題目指定的名字（自己一行）。只能用指定的名字，不可寫自己的中文或英文名字。"
      open:
        - "How have you been? I'm writing because 〔子句〕.（最近好嗎？我寫信是因為……）"
        - "I heard from 〔人〕 that you 〔子句〕, and I'm worried about you.（我聽〔人〕說你……，我很擔心你。）"
        - "I'm writing to tell you how sorry I am about 〔N／V-ing〕.（我寫信是想告訴你，我對……有多抱歉。）"
      develop:
        - "勸告：If I were you, I would 〔V〕.（如果我是你，我會……）"
        - "勸告：Why not 〔V〕?（何不……？）／It might be a good idea to 〔V〕.（……也許是個好主意。）"
        - "說明經過：Last 〔weekend〕, I 〔過去式〕. When I realized that 〔子句〕, I 〔過去式〕.（上〔週末〕我……。當我發現……時，我……）"
        - "道歉：I feel terrible about 〔N／V-ing〕. Please accept my sincere apology.（我對……感到很過意不去，請接受我誠心的道歉。）"
        - "補救：To make up for it, I will 〔V〕.（為了彌補，我會……）"
      close:
        - "I hope you will 〔forgive me／think about my advice〕.（希望你會〔原諒我／考慮我的建議〕。）"
        - "Please let me know if there is anything I can do.（如果有我能幫忙的地方，請告訴我。）"
        - "Take care, and I hope to hear from you soon.（保重，希望很快收到你的回信。）"
      sample:
        title: 101 年勸告迷上電玩的朋友
        prompt: "你最好的朋友最近迷上電玩，常常熬夜、疏忽課業，並受到父母的責罵。寫一封信給他（Ken），適當地給予勸告；信末用 Jill 署名。"
        paras:
          - "Dear Ken,"
          - "**How have you been? I heard from** our classmates **that you** have been playing video games until midnight almost every day, **and I'm worried about you.** You often fall asleep in class, and your grades have dropped a lot. I also know that your parents scolded you last week. I understand that games are exciting and help you relax after school. However, staying up late is hurting your health, your schoolwork, and your relationship with your family."
          - "**If I were you, I would** set a time limit, such as one hour a day, and play only after finishing my homework. **It might also be a good idea to** leave your phone outside your bedroom at night so that you can get enough sleep. **Why not** join the basketball team with me? Playing sports is just as much fun, and it keeps you fit, too. **I hope you will think about my advice.** I believe you can find a balance between fun and study. **Take care, and I hope to hear from you soon.**"
          - "Your friend,"
          - "Jill"
    - id: 3
      name: 現象與原因影響
      when: "題目要你描述圖片或生活中的現象，再說明原因、影響，或人們為什麼這麼做。"
      structure:
        - "第一段（描述現象）：主題句點出現象 → 每張圖 1–2 句（誰、在哪裡、在做什麼）→ 小結：這表示什麼。"
        - "第二段（原因＋影響）：原因 2 個（First／Second），其中一個配上你的經驗或觀察 → 影響：好的一面＋壞的一面 → 結論。"
        - "描述圖片用現在式或現在進行式。"
      open:
        - "Nowadays, it is common to see 〔人〕 〔V〕.（現在常常可以看到〔人〕……）"
        - "As shown in the pictures, more and more people 〔V〕.（如圖所示，越來越多人……）"
        - "In the first picture, 〔人〕 〔現在進行式〕. In the second picture, 〔子句〕.（第一張圖中……；第二張圖中……）"
      develop:
        - "There are several reasons for this trend. First, 〔子句〕. Second, 〔子句〕.（這個趨勢有幾個原因。第一……；第二……）"
        - "One reason is that 〔子句〕. Another reason is that 〔子句〕.（一個原因是……；另一個原因是……）"
        - "My 〔neighbor〕 is a good example.（我的〔鄰居〕就是一個好例子。）／Take 〔N〕 for example.（以……為例。）"
        - "This trend may bring both benefits and problems.（這個趨勢可能帶來好處，也可能帶來問題。）"
        - "On the positive side, 〔子句〕. On the negative side, 〔子句〕.（好的一面是……；壞的一面是……）"
        - "As a result, 〔子句〕.（因此，……）"
      close:
        - "This shows that 〔子句〕.（這顯示……）：第一段的小結"
        - "In short, 〔N〕 has changed the way we 〔V〕.（總之，〔N〕改變了我們〔做某事〕的方式。）"
        - "All in all, 〔子句〕, but we should also 〔V〕.（總而言之，……，但我們也應該……）"
      sample:
        title: 115 年寵物在生活中的角色
        prompt: "看三張圖（圖 1：公園裡有人用推車推著狗、把狗扛在肩上，旁邊一位爸爸拉著坐在拖車裡的兩個孩子；圖 2：一對夫妻在家餵嬰兒喝奶、陪兒子寫功課；圖 3：一對夫妻在家陪兩隻狗，太太用湯匙餵狗，另一隻狗穿著衣服）。第一段描述圖片中的現象；第二段根據自身的經驗或觀察，說明此現象的原因以及可能的影響。"
        paras:
          - "**Nowadays, it is common to see** pet owners treat their pets like children. **In the first picture,** a woman is pushing two dogs in a stroller, and two people are carrying dogs on their shoulders, just as parents carry babies. **In the second picture,** a couple is taking care of their baby and son at home. **In the third picture,** another couple is feeding their two dogs, and one dog is even wearing clothes. **This shows that** pets have become family members, and for some couples, they have even replaced children."
          - "**There are several reasons for this trend. First,** many people live alone, and pets keep them company. **Second,** raising a child is expensive, so some couples choose pets instead. **My aunt is a good example.** She has no children and treats her dog like a son. **On the positive side,** pets make people less stressed. **On the negative side,** if more couples choose pets over babies, Taiwan's birth rate may drop even further. **All in all,** pets are wonderful companions, **but we should also** think about how this change affects our society."
    - id: 4
      name: 比較兩者
      when: "題目給兩張對比的圖片或兩種情況，要你描述各自的特色或差別，再寫你的理想或看法。"
      structure:
        - "第一段（比較）：主題句說出兩者的主題 → A 的特色 2–3 句 → 用 By contrast 轉到 B 的特色 2–3 句 → 小結。"
        - "第二段（理想或看法）：你的理想或選擇 → 理由 2 個，各配一個例子或經驗 → 結論。"
        - "A、B 兩邊的份量要差不多，比較的項目也要對應（例如都寫設施、氣氛、適合誰）。"
      open:
        - "The two pictures show two different 〔kinds of N〕.（這兩張圖呈現兩種不同的……）"
        - "In Picture A, 〔子句〕. By contrast, in Picture B, 〔子句〕.（圖 A 中……；相較之下，圖 B 中……）"
        - "When 〔子句〕, two very different scenes may appear.（當……的時候，可能出現兩種很不一樣的情景。）"
      develop:
        - "While A 〔V〕, B 〔V〕.（A……，而 B……）"
        - "Compared with A, B is much more 〔adj〕.（和 A 比起來，B 更……）"
        - "A is 〔adj〕, whereas B is 〔adj〕.（A 是……，而 B 是……）"
        - "Unlike A, B 〔V〕.（和 A 不同，B……）／Both A and B 〔V〕, but 〔子句〕.（A 和 B 都……，但……）"
        - "My ideal 〔N〕 would be a place where 〔子句〕.（我理想中的〔N〕會是一個可以……的地方。）"
        - "As for me, I prefer 〔N〕 because 〔子句〕.（至於我，我比較喜歡……，因為……）"
      close:
        - "Each 〔N〕 has its own charm.（各有各的魅力。）：第一段的小結"
        - "That is why 〔子句〕.（這就是為什麼……）"
        - "If 〔子句〕, I believe 〔子句〕.（如果……，我相信……）"
      sample:
        title: 111 年不同的公園
        prompt: "看兩張圖（圖 A：有溜滑梯、攀爬架等遊樂設施的公園；圖 B：有高大樹木、草地和花圃的公園）。第一段描述圖 A 和圖 B 中的公園各有何特色；第二段說明你心目中理想公園的樣貌與特色，並解釋你的理由。"
        paras:
          - "**The two pictures show two different kinds of parks. In Picture A,** the park is full of playground equipment, such as slides and climbing frames. It is a perfect place for children to run, climb, and play with their friends. **By contrast, in Picture B,** there are tall trees, a wide lawn, and flower beds. Sunlight shines through the leaves, so the park looks quiet and peaceful. People can take a walk, have a picnic, or simply relax in the shade. **Each park has its own charm.**"
          - "**As for me, my ideal park would be a place where** both kids and adults can enjoy themselves. It would have a small playground like Park A and plenty of trees like Park B. **First,** such a park is good for the whole family. When I was little, my grandparents often took me to a park. While I played on the slides, they took a walk under the trees. **Second,** green spaces help people relax after a busy day. **That is why** I believe a park with both fun and nature is the best gift for a city."
    - id: 5
      name: 選擇與理由
      when: "題目給兩、三個選項，要你選一個並說明原因，再寫具體的內容、計畫或想像。"
      structure:
        - "第一段（選擇＋原因）：主題句直接說選哪一個 → 原因 2 個（The main reason／Besides），每個原因配一個例子或經驗 → 小結。"
        - "第二段（想像或計畫）：希望它是什麼樣子 → 具體做法或分工（First／Then／Finally）→ 預期的結果。"
        - "寫想像的內容用 would、could。"
      open:
        - "If I could 〔V〕, I would choose 〔N〕.（如果我可以……，我會選……）"
        - "Of the 〔three N〕, I would most like to 〔V〕.（在這〔三個……〕之中，我最想……）"
        - "I would pick 〔N〕 without hesitation.（我會毫不猶豫地選……）"
      develop:
        - "The main reason is that 〔子句〕.（主要的原因是……）"
        - "Besides, 〔子句〕.（此外，……）"
        - "For instance, 〔子句〕.（例如，……）"
        - "I would like 〔it〕 to be 〔adj〕 and 〔adj〕.（我希望它……）"
        - "〔It〕 could 〔V〕, while I 〔V〕.（它可以……，而我……）"
        - "First, 〔子句〕. Then, 〔子句〕. Finally, 〔子句〕.（先……，接著……，最後……）"
      close:
        - "That is why 〔N〕 would be my first choice.（這就是為什麼……會是我的第一選擇。）"
        - "With 〔its〕 help, I believe I could 〔V〕.（有了它的幫忙，我相信我可以……）"
      sample:
        title: 113 年機器人小幫手
        prompt: "三張圖分別是青少年常遇到的三種問題：初次失戀（First Heartbreak）、在意別人的眼光（Caring What Others Think）、情緒起伏（Mood Swings）。第一段說明你最想讓機器人小幫手解決哪一個問題，並解釋原因；第二段說明你希望它具備什麼特質或能力、可以如何和你分工合作來解決此問題。"
        paras:
          - "**Of the three problems, I would most like** my robot helper to solve the problem of caring too much about what others think. **The main reason is that** this problem bothers me almost every day. **For instance,** before I post a photo online, I often spend an hour worrying about how many likes it will get. In class, I seldom ask questions because I am afraid of being laughed at. **Besides,** this habit stops me from being myself. **That is why** solving this problem **would be my first choice.**"
          - "**I would like** my robot helper **to be** patient, honest, and good at listening. **First,** whenever I feel nervous about other people's opinions, it would listen to me and remind me of my strengths. **Then,** it could help me set small goals, such as asking one question in class every week. **It could** give me advice and encouragement, **while I** would be the one to take action. **With its help, I believe I could** care less about what others think and become more confident."
    - id: 6
      name: 看法與經驗
      when: "題目要你說明看法、表達心得或感想，並用自己或親友的經驗舉例。"
      structure:
        - "看法段：主題句表明立場 → 理由 2 個（For one thing／For another），各配一句說明 → 小結。"
        - "經驗段：時間、地點、發生了什麼事（用過去式）→ 你當時怎麼做、有什麼感受 → 你從中學到什麼，呼應你的立場。"
        - "經驗要寫一件具體的事，不要只寫「我常常……」。"
      open:
        - "In my opinion, 〔子句〕.（我認為……）"
        - "As far as I am concerned, 〔子句〕.（就我而言，……）"
        - "When it comes to 〔N／V-ing〕, I strongly believe that 〔子句〕.（說到……，我深信……）"
      develop:
        - "For one thing, 〔子句〕. For another, 〔子句〕.（一方面……；另一方面……）"
        - "Although some people think 〔子句〕, I believe 〔子句〕.（雖然有些人認為……，我相信……）"
        - "I still remember the time when 〔子句〕.（我還記得那次……）"
        - "Last 〔summer〕, I 〔過去式〕.（去年〔夏天〕，我……）"
        - "At first, I felt 〔adj〕, but later 〔子句〕.（一開始我覺得……，但後來……）"
      close:
        - "This experience made me realize that 〔子句〕.（這次經驗讓我了解……）"
        - "From this experience, I learned that 〔子句〕.（從這次經驗，我學到……）"
        - "Therefore, I think 〔子句〕.（因此，我認為……）"
      sample:
        title: 105 年家事分工
        prompt: "你認為家裡生活環境的維持應該是誰的責任？第一段說明你對家事該如何分工的看法及理由；第二段舉例說明你家中家事分工的情形，並描述你自己做家事的經驗及感想。"
        paras:
          - "**In my opinion,** keeping a home clean should be the job of every family member, not just the mother. **For one thing,** everyone lives in the house and makes it messy, so everyone should help clean it. **For another,** sharing the housework is fair to parents, who already work hard all day. **Although some people think** students should focus only on their studies, **I believe** simple chores, such as washing the dishes, take only a few minutes a day. **Therefore, I think** everyone should do his or her part."
          - "In my family, my father does the laundry, my mother cooks, and my sister and I clean the bathroom. **I still remember the time when** I cleaned the bathroom for the first time. **At first, I felt** disgusted, **but later** I got used to it. When my mother saw the shining floor, she smiled and thanked me. **This experience made me realize that** a clean home needs everyone's effort. Since then, I have never complained about doing chores, because helping out at home is a way of showing love to my family."
    - id: 7
      name: 介紹與提出做法
      when: "題目要你介紹某些人事物並提出推廣方式，或說明一個問題再提出解決方法。"
      structure:
        - "第一段（介紹或問題）：主題句 → 第一項：是什麼＋為什麼重要，配一個例子 → 第二項：同上 → 小結。"
        - "第二段（做法）：主題句（There are several ways to …）→ 方法 2–3 個（First／Second／Finally），每個方法寫清楚誰來做、怎麼做 → 預期效果（In this way, …）。"
        - "方法要具體可行，寫出「做什麼」，不要只寫「我們應該更努力」。"
      open:
        - "There are two things about 〔N〕 that make me proud: 〔A〕 and 〔B〕.（〔N〕有兩件事讓我驕傲：A 和 B。）"
        - "One problem that 〔N〕 may cause is 〔N〕.（〔N〕可能造成的一個問題是……）"
        - "There are several ways to 〔V〕.（有幾個方法可以……）"
      develop:
        - "〔A〕 is famous for 〔N〕.（〔A〕以……聞名。）"
        - "What makes 〔A〕 special is 〔N〕.（〔A〕特別的地方是……）"
        - "First, we could 〔V〕. Second, 〔子句〕. Finally, 〔子句〕.（首先，我們可以……；第二，……；最後，……）"
        - "To avoid 〔N／V-ing〕, we should 〔V〕.（為了避免……，我們應該……）"
        - "It would be helpful if 〔子句〕.（如果……，會很有幫助。）"
        - "By 〔V-ing〕, we can 〔V〕.（藉由……，我們可以……）"
      close:
        - "In this way, 〔子句〕.（如此一來，……）"
        - "If we 〔V〕, I am sure 〔子句〕.（如果我們……，我相信……）"
        - "With these efforts, 〔N〕 will 〔V〕.（有了這些努力，〔N〕將會……）"
      sample:
        title: 108 年臺灣最讓你驕傲的事
        prompt: "談臺灣最讓你引以為榮的兩個面向或事物（例如人、事、物、文化、制度）。第一段描述這兩個面向或事物，並說明它們為何讓你引以為榮；第二段說明可以用什麼方式介紹或行銷這些臺灣特色，讓世人更了解臺灣。"
        paras:
          - "**There are two things about Taiwan that make me proud:** its friendly people and its night markets. **First,** Taiwanese people are warm and helpful. When foreign visitors get lost, people on the street often stop to give directions, and some even walk them to the right place. **Second, Taiwan is famous for** its night markets. **What makes them special is** the wide variety of cheap and delicious snacks, such as bubble tea, stinky tofu, and oyster omelets. Visiting a night market is a great way to experience our local culture."
          - "**There are several ways to** introduce these features to the world. **First, we could** make short videos about friendly Taiwanese people and night market food and share them on social media. **Second,** the government could hold Taiwanese food festivals abroad, so that people in other countries can taste our snacks. **Finally,** we students can be good hosts by greeting tourists with a smile and recommending our favorite food stalls. **In this way,** more people will get to know Taiwan, and they may even want to visit our beautiful island someday."
  combo:
    title: 兩段任務不同時：各套一個模板
    text:
      - "近年的題目常常兩段要做不同的事。例如 114 年颱風假：第一段描述兩種情景（模板四），第二段寫看法與經驗（模板六）；112 年表情符號：第一段寫人們喜歡用的原因（模板三），第二段寫誤會與化解方法（模板七）。每一段各套對應的模板，再用轉承語把兩段接起來。"
    sample:
      title: 114 年颱風假，模板四＋模板六
      prompt: "看兩張對比圖片（圖 1：颱風假當天，室內擠滿排隊的人潮；圖 2：風雨很大，仍有人騎機車在路上）。第一段描述颱風假時實際上可能出現的兩種不同情景；第二段說明你對放颱風假的看法與經驗。"
      paras:
        - "**When a typhoon day off is announced, two very different scenes may appear. In the first picture,** the weather turns out to be fine, so crowds of people go out to have fun. They are standing in long lines at a shopping mall or a movie theater. **By contrast, in the second picture,** the typhoon is really strong. Heavy rain is pouring down, but some people are still riding scooters in the storm, perhaps because they have to go to work. **This shows that** a typhoon day off does not mean the same thing to everyone."
        - "**In my opinion,** typhoon days off are necessary, but people should use them wisely. **For one thing,** no one can predict the weather perfectly, so it is better to be safe than sorry. **For another,** a day off is meant to keep people safe at home, not to send them to crowded malls. **I still remember the time when** a strong typhoon hit my city. My family stayed home and played board games. The next morning, we saw fallen trees everywhere. **This experience made me realize that** a typhoon day off is a gift of safety."
