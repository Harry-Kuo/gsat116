# 模板句與範文為自編（範文的圖片描述已對照原卷圖片）。

intro:
  - "非選擇題共 38 分：混合題 10 分、中譯英 8 分、英文作文 20 分。"
  - "這一頁先整理三大題的**答題技巧**，再把 95–115 年 21 屆的作文題目分成 **7 類**，每類都有架構、開頭句、發展句、結論句和範文（「🧩 作文題型與模板」）；最後是評分方式與近五屆題目。評分原則出自大考中心各年度〈英文考科非選擇題閱卷評分原則說明〉。"

mixed:
  intro: 混合題占 10 分，是一個題組：一篇文章（常搭配表格、店家介紹或對話紀錄），後面接填充、多選、簡答。
  rules:
    - 填充題：從文章中找字填入，並依句子需要做字形變化（例如名詞、過去分詞）。完全正確得 2 分；字形或拼字錯誤得 1 分；空白或答錯 0 分。
    - 多選題（第 49 題，4 分）：計分方式和其他科的多選題相同（答錯 k 個選項得 (n−2k)/n 的分數）。近五屆全對率只有 7%–37%，每個選項都要回到文章確認。
    - 簡答題：用文章裡的字詞回答（例如 115 年要寫出描述店家「獨特」的片語 one of a kind），照抄原文最保險。
  history:
    - {year: 115, text: 東部原住民聚落的特色店家：填充 2 格（innovation、blended）、多選（紀念品要到哪幾家店買，全對率 36%）、簡答（找出形容店家「獨特」的片語：one of a kind）}
    - {year: 114, text: 動物園存廢的網路論壇：填充 2 格、多選（哪些留言對動物園持正面態度，全對率 23%）、簡答（找出意思是「培養理解他人感受的能力」的片語）}
    - {year: 113, text: 寒鴉與龜蟻如何因應環境干擾：填充 2 格、多選（兩種動物都符合的敘述，全對率 37%）、簡答（寒鴉遇到的「干擾」是什麼：a predator 或 a fox）}
    - {year: 112, text: 植物肉聊天室對話：填充 2 格、多選（哪些留言表示只在特定情況下才會選擇植物肉，全對率 7%）、簡答（找出意思是「管用、行得通」的片語）}
    - {year: 111, text: 奧運難民代表隊兩位選手的故事：填空 2 格、簡答（找出意思是「庇護」的字：asylum）、多選（兩位選手都符合的敘述，全對率 18%）}

translation:
  rules:
    - 共 2 句，每句 4 分，合計 8 分。
    - 每個錯誤扣 0.5 分，各部分獨立，扣完為止；相同的拼字或文法錯誤只扣一次。
    - 句首沒有大寫、標點符號不妥，各扣 0.5 分，只扣一次。
    - 115 年評分說明：要考的單字大致在詞彙表一至四級；第 1 句要用現在完成式，第 2 句是基本句型（S＋V），後半句可以用分詞構句。
  items:
    - year: 115
      n: 1
      zh: 現在越來越多高中英文老師已經增加在課堂上使用英文的百分比。
      en: "Now (Nowadays), more and more senior high school English teachers have increased the percentage of English use (using English) in class."
      tip: 「已經增加」用現在完成式 have increased；more and more＋複數名詞。
    - year: 115
      n: 2
      zh: 他們將學生依英語能力分成不同組別，進行多樣的聽、說活動。
      en: "They divide students into different groups based on their English ability (proficiency) and conduct various (diverse / a variety of) listening and speaking activities."
      tip: divide A into B（把 A 分成 B）、based on（依據）、conduct activities（進行活動）。
    - year: 114
      n: 1
      zh: 人類的想像和創意是科技進步最大的驅動力。
      en: "Human's (Human / Mankind's) imagination and creativity is the biggest (strongest) driving force (power) for technological advancement (advances / advance)."
      tip: the biggest driving force for…（…最大的驅動力）；官方參考答案動詞用 is。
    - year: 114
      n: 2
      zh: 過去在科幻電影中出現的神奇物件，現在正逐一成真。
      en: "Amazing (Fantastic) things (objects) that appeared in science-fiction (sci-fi) movies (films) in the past are now becoming reality (real) one by one."
      tip: 關係子句 that appeared in… 修飾主詞；「正在成真」用現在進行式 are becoming。
    - year: 113
      n: 1
      zh: 每逢選舉季節，總會看到政治人物造訪各地著名廟宇。
      en: "Every (During) election season, politicians can (will) be seen making visits to (making a visit to / visiting) famous temples in different places (areas)."
      tip: 「被看到正在做」用 be seen V-ing。
    - year: 113
      n: 2
      zh: 除了祈求好的選舉結果，他們也希望展現對在地文化與習俗的尊重。
      en: "Besides (Aside from / Apart from / In addition to) praying for good election (voting) results, they also hope to show respect to local culture and customs."
      tip: Besides／In addition to 後面接 V-ing；show respect to（對…表示尊重）。
    - year: 112
      n: 1
      zh: 歷史一再證明，戰爭會造成極為可怕的災難。
      en: "History proves (has proven / has proved) time and again (repeatedly) that wars will cause (lead to) extremely terrible (horrible) disasters."
      tip: time and again／repeatedly（一再）；prove that＋子句。
    - year: 112
      n: 2
      zh: 避免衝突、確保世界和平應該是所有人類追求的目標。
      en: "To avoid (Avoiding) conflicts and ensure (ensuring) world peace should be the goal pursued by all human beings."
      tip: 不定詞或動名詞當主詞（兩個動作用同一種形式）；the goal pursued by…（過去分詞修飾名詞）。
    - year: 111
      n: 1
      zh: 飼養寵物並非一項短暫的人生體驗，而是一個對動物的終生承諾。
      en: "Keeping (Raising) a pet (pets) is not a short-term (temporary) life experience (experience in life), but a lifelong commitment (promise) to an animal (animals)."
      tip: 動名詞當主詞用單數動詞 is；not A but B（不是 A 而是 B）；commitment to（對…的承諾）。
    - year: 111
      n: 2
      zh: 在享受寵物所帶來的歡樂時，我們不該忽略要善盡照顧他們的責任。
      en: "When we enjoy (When enjoying / While enjoying) the joy (fun / pleasure) they (pets) bring (to) us, we should not ignore (neglect / overlook) the responsibility of taking (to take) good care of them."
      tip: 「在…時」可用 When／While V-ing；the joy (that) pets bring us 省略關係代名詞；the responsibility of V-ing。

essay:
  rules:
    - 滿分 20 分，依內容、組織、文法句構、字彙拼字四項評分，四項加總給一個整體分數。
    - 每一項：優 5–4 分、可 3 分、差 2–1 分、劣 0 分；總分分為特優（19–20）、優（15–18）、可（10–14）、差（5–9）、劣（0–4）。
    - 字數明顯不足（少於 120 個單詞）扣總分 1 分；沒有分段也扣總分 1 分。
    - 空白、完全文不對題、完全抄襲題目文章，或文句完全錯誤，得 0 分。
  rubric:
    - {item: 內容, good: 主題（句）清楚切題，並有具體、完整的相關細節支持。}
    - {item: 組織, good: 重點分明，有開頭、發展、結尾，前後連貫，轉承語使用得當。}
    - {item: 文法句構, good: 全文幾無文法、格式、標點錯誤，文句結構富變化。}
    - {item: 字彙拼字, good: 用字精確、得宜，且幾無拼字、大小寫錯誤。}
  scores_115:
    essay: 115 年作文 15 分以上的考生約 5%，12 分以上約 22%，10 分以上約 36%，一半考生在 8 分以下。
