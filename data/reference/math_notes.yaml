# 數學A、數學B 重點整理：各觀念的必背公式（must）、解題流程（steps）、易錯點（traps）。
# Claude 撰寫，老師審閱後可修改。觀念代碼對應 data/concepts/mathA.yaml、mathB.yaml。
# 「考卷附」：學測數學試題本最後會附參考公式（等差、等比數列和，正弦、餘弦定理，標準差、相關係數、迴歸直線；數A 另附和角公式），還有常用的根號值與對數值。

mathA:
  M1:
    must:
      - 指數律（a＞0）：aᵐ·aⁿ＝aᵐ⁺ⁿ、(aᵐ)ⁿ＝aᵐⁿ、a⁰＝1、a⁻ⁿ＝1/aⁿ、a^(m/n)＝ⁿ√(aᵐ)。
      - 對數的定義：log_a b＝x ⇔ aˣ＝b（a＞0、a≠1、b＞0）。
      - 運算：log_a(MN)＝log_a M＋log_a N；log_a(M/N)＝log_a M－log_a N；log_a(Mᵏ)＝k·log_a M。
      - 換底：log_a b＝log b÷log a；log_a b·log_b c＝log_a c。
      - 位數：正數 N 的整數部分是 k 位數 ⇔ k−1≤log N＜k；首位數字看 log N 的小數部分。
      - 絕對值：|x−a| 是數線上 x 到 a 的距離；|x−a|≤r ⇔ a−r≤x≤a＋r。
    steps:
      - 比較大小：先化成同底的指數或對數；底數＞1 時函數遞增，0＜底數＜1 時遞減。
      - 解指數方程式：令 t＝aˣ（t＞0），換成多項式方程式；解完檢查 t 是不是正的。
      - 解對數方程式：先寫出「真數＞0」的條件，合併成一個對數再去掉 log，最後回代檢查。
    traps:
      - 底數介於 0 和 1 之間時，兩邊取指數或對數後，不等號要變向。
      - 對數的真數一定要大於 0，解出來的值要回代檢查。
      - 考卷附 log 2≈0.3010、log 3≈0.4771、log 5≈0.6990、log 7≈0.8451，估算時直接用。
  M2:
    must:
      - 除法原理：f(x)＝g(x)·q(x)＋r(x)，餘式 r(x) 的次數比除式 g(x) 低。
      - 餘式定理：f(x) 除以 x−a 的餘式是 f(a)；因式定理：f(a)＝0 ⇔ x−a 是 f(x) 的因式。
      - 二次函數配方：y＝a(x−h)²＋k，頂點 (h, k)；a＞0 開口向上、最小值 k。
      - ax²＋bx＋c＝0：判別式 b²−4ac 決定實根個數；兩根和＝−b/a、兩根積＝c/a。
      - 三次函數 y＝ax³＋bx²＋cx＋d 的圖形對稱於點 (−b/(3a), f(−b/(3a)))。
    steps:
      - 求餘式：除式是一次式就代值；除式是二次式，設餘式為 px＋q，再代入兩個根解聯立。
      - 解多項式不等式：因式分解 → 在數線上標出所有根 → 最右邊的正負由最高次項係數決定，往左每過一個根變號一次。
      - 兩個函數圖形的交點：把兩個函數相減，交點的 x 坐標就是相減後方程式的實根。
    traps:
      - 偶次重根的兩側正負號相同，不會變號。
      - 二次函數在限定範圍內的最大值、最小值，要比較頂點和兩個端點。
  M3:
    must:
      - 特殊角：sin 30°＝1/2、sin 45°＝√2/2、sin 60°＝√3/2；sin²θ＋cos²θ＝1；tan θ＝sin θ/cos θ。
      - 弧度：π＝180°；扇形弧長 s＝rθ、面積＝½r²θ（θ 用弧度）。
      - 和角公式（考卷附）；倍角：sin 2θ＝2 sin θ cos θ，cos 2θ＝cos²θ−sin²θ＝2cos²θ−1＝1−2sin²θ。
      - 正弦定理 a/sin A＝b/sin B＝c/sin C＝2R、餘弦定理 c²＝a²＋b²−2ab cos C（考卷附）；三角形面積＝½ab sin C。
      - y＝a sin(bx＋c)＋d：振幅 |a|、週期 2π/|b|、上下平移 d。
      - 疊合：a sin x＋b cos x＝√(a²＋b²)·sin(x＋φ)，最大值 √(a²＋b²)、最小值 −√(a²＋b²)。
    steps:
      - 解三角方程式或不等式：用倍角或疊合化成同一個三角函數 → 解出 sin θ 或 cos θ 的範圍 → 在單位圓上找出對應的角。
      - 解三角形：已知兩角一邊、兩邊一對角用正弦定理；已知三邊、兩邊夾角用餘弦定理。
      - 測量題：先畫出三角形，標出已知的邊和角，再選正弦或餘弦定理。
    traps:
      - 已知兩邊和其中一邊的對角時，可能有兩個三角形，要檢查。
      - 週期是 2π/|b|，不是 2π·|b|。
  M8:
    must:
      - 等差數列 aₙ＝a₁＋(n−1)d；前 n 項和 Sₙ＝n(a₁＋aₙ)/2（考卷附）。
      - 等比數列 aₙ＝a₁·rⁿ⁻¹；前 n 項和 Sₙ＝a₁(1−rⁿ)/(1−r)，r≠1（考卷附）。
      - 1＋2＋…＋n＝n(n＋1)/2；1²＋2²＋…＋n²＝n(n＋1)(2n＋1)/6；1³＋2³＋…＋n³＝[n(n＋1)/2]²。
      - 三數成等差：中間項是兩旁的平均；三數成等比：中間項的平方＝兩旁的乘積。
    steps:
      - 遞迴式 aₙ₊₁＝p·aₙ＋q（p≠1）：解 c＝pc＋q 得到 c，則 aₙ₊₁−c＝p(aₙ−c)，aₙ−c 是公比 p 的等比數列。
      - 找規律：先列出 n＝1、2、3、4 的值，看差或比，猜出一般項後再驗證。
      - 數學歸納法：先驗證 n＝1 成立，再由 n＝k 成立推出 n＝k＋1 也成立。
    traps:
      - 公比 r＝1 時不能用等比級數公式，前 n 項和是 n·a₁。
      - 注意 Σ 從 k＝0 還是 k＝1 開始，項數會差一個。
  M9:
    must:
      - 斜率 m＝(y₂−y₁)/(x₂−x₁)＝tan θ（θ 是斜角）；兩直線平行 ⇔ 斜率相等；垂直 ⇔ 斜率乘積＝−1（兩條都不是鉛直線時）。
      - 點 (x₀, y₀) 到直線 ax＋by＋c＝0 的距離＝|ax₀＋by₀＋c|÷√(a²＋b²)；兩平行線 ax＋by＋c₁＝0、ax＋by＋c₂＝0 的距離＝|c₁−c₂|÷√(a²＋b²)。
      - 圓 (x−h)²＋(y−k)²＝r²；圓心到直線的距離 d：d＜r 交兩點、d＝r 相切、d＞r 不相交；弦長＝2√(r²−d²)。
      - 線段的中垂線：通過中點，斜率是線段斜率的負倒數；中垂線上的點到兩端點等距。
      - ax＋by＋c＞0 表示直線某一側的區域：代一個不在直線上的點（常用原點）檢查。
    steps:
      - 先把條件畫在坐標平面上，再決定用距離、斜率還是代入。
      - 求圓：圓心在某條直線上，就用參數設圓心，再用「圓心到切線的距離＝半徑」列方程式。
      - 求面積：把多邊形切成三角形；頂點在原點、另兩點 (x₁, y₁)、(x₂, y₂) 的三角形面積＝½|x₁y₂−x₂y₁|。
    traps:
      - 等腰、直角三角形要分「哪兩邊相等」「哪個角是直角」討論，並排除三點共線。
      - 斜率乘積＝−1 不適用於鉛直線（斜率不存在）。
  M4:
    must:
      - 內積 a·b＝|a||b|cos θ＝a₁b₁＋a₂b₂＋a₃b₃；a⊥b ⇔ a·b＝0；|a|²＝a·a。
      - a 在 b 上的正射影＝(a·b÷|b|²)·b；投影長＝|a·b|÷|b|。
      - 分點：P 在線段 AB 上且 AP:PB＝m:n ⇒ OP＝(n·OA＋m·OB)÷(m＋n)。
      - 平面上 a＝(a₁, a₂)、b＝(b₁, b₂) 所張三角形的面積＝½|a₁b₂−a₂b₁|。
      - 外積 a×b 同時垂直 a 和 b，長度＝a、b 所張平行四邊形的面積；平行六面體體積＝|a·(b×c)|＝三階行列式的絕對值。
      - 平面：法向量 (a, b, c)、過 (x₀, y₀, z₀) → a(x−x₀)＋b(y−y₀)＋c(z−z₀)＝0；點到平面 ax＋by＋cz＋d＝0 的距離＝|ax₀＋by₀＋cz₀＋d|÷√(a²＋b²＋c²)。
      - 空間直線的參數式：(x, y, z)＝(x₀＋at, y₀＋bt, z₀＋ct)，(a, b, c) 是方向向量。
    steps:
      - 幾何條件翻成向量：垂直 → 內積為 0；共線 → 一個向量是另一個的倍數；面積、體積 → 外積、行列式。
      - 求平面：找出平面上的兩個向量，外積得到法向量，再代入一點。
      - 求垂足或最近點：用參數式設直線上的點，再用「連線向量和方向向量垂直」解出參數。
    traps:
      - 內積是負的，表示夾角是鈍角，不一定是算錯。
      - 在多面體上找離某點最遠的點，要比較所有頂點（115 年第 20 題最遠的不是對角的頂點）。
  M5:
    must:
      - 矩陣乘法：AB 的第 (i, j) 元＝A 的第 i 列和 B 的第 j 行對應相乘再相加；一般 AB≠BA。
      - 二階方陣 A＝[[a, b], [c, d]]：det A＝ad−bc；det A≠0 時 A⁻¹＝(1/(ad−bc))·[[d, −b], [−c, a]]。
      - (AB)⁻¹＝B⁻¹A⁻¹（順序相反）；det(AB)＝det A·det B。
      - 聯立方程式寫成 AX＝B：det A≠0 時恰有一組解 X＝A⁻¹B。
      - A 乘上行向量 (x, y, z)ᵀ＝x·(A 的第 1 行)＋y·(第 2 行)＋z·(第 3 行)。
    steps:
      - 求 Aⁿ：先算 A²、A³，找出規律或週期。
      - 已知 A 作用在幾個向量的結果：把要求的向量拆成這幾個向量的組合，再用 A(su＋tv)＝sAu＋tAv。
    traps:
      - 矩陣乘法不能交換順序，左乘、右乘的結果不同。
      - 反方陣存在的條件是行列式不為 0。
  M6:
    must:
      - 古典機率 P(A)＝n(A)÷n(S)，前提是每個樣本點出現的機會相等。
      - P(A∪B)＝P(A)＋P(B)−P(A∩B)；P(A′)＝1−P(A)。
      - 條件機率 P(B｜A)＝P(A∩B)÷P(A)；乘法原理 P(A∩B)＝P(A)·P(B｜A)。
      - A、B 獨立 ⇔ P(A∩B)＝P(A)·P(B)。
      - 期望值 E＝x₁p₁＋x₂p₂＋…＋xₙpₙ。
      - 資料 y＝ax＋b：平均 μy＝a·μx＋b、標準差 σy＝|a|·σx；a＞0 時相關係數不變，a＜0 時變號。
      - 迴歸直線 y−μy＝r·(σy÷σx)·(x−μx)，一定通過 (μx, μy)（考卷附）。
    steps:
      - 多階段的機率：畫樹狀圖，同一條路徑相乘，不同路徑相加。
      - 已知結果反推原因：P(原因｜結果)＝這條路徑的機率÷所有得到這個結果的路徑機率總和。
      - 「至少一次」：用 1 減去「一次都沒有」。
    traps:
      - 獨立和互斥不同：兩事件互斥、機率又都大於 0 時，一定不獨立。
      - 標準差不受「加減常數」影響，只受「乘除」影響。
      - 相關係數接近 0，只表示沒有「線性」關係。
  M7:
    must:
      - 加法原理（分類，各類不重疊）；乘法原理（分步）。
      - n 個不同的東西取 k 個排列：n!÷(n−k)!；取 k 個的組合：C(n, k)＝n!÷(k!(n−k)!)。
      - 有相同物的排列：n!÷(p!·q!·…)。
      - k 個位置、每個位置都有 m 種選擇：mᵏ 種（重複排列）。
      - k 個相同的東西分給 n 個人（可以有人沒分到）：C(n＋k−1, k) 種（排 k 個東西和 n−1 個隔板）。
      - 二項式定理：(a＋b)ⁿ 展開式的第 k＋1 項是 C(n, k)·aⁿ⁻ᵏ·bᵏ。
    steps:
      - 先決定分類還是分步；有限制條件的先處理（指定位置、相鄰、不相鄰）。
      - 相鄰：先綁成一塊一起排，塊內再排；不相鄰：先排其他的，再插入空隙。
      - 「至少」的問題用補集：全部減去不符合的。
    traps:
      - 分組時組與組沒有分別（例如平均分成兩組），要除以組數的排列數，避免重複計算。
      - 「每人至少一個」先每人發一個，剩下的再用隔板法分。

mathB:
  B1:
    must:
      - 指數律（a＞0）：aᵐ·aⁿ＝aᵐ⁺ⁿ、(aᵐ)ⁿ＝aᵐⁿ、a⁰＝1、a⁻ⁿ＝1/aⁿ、a^(m/n)＝ⁿ√(aᵐ)。
      - 對數：log_a b＝x ⇔ aˣ＝b；log(MN)＝log M＋log N、log(M/N)＝log M－log N、log(Mᵏ)＝k·log M。
      - 自然對數 ln x＝logₑ x（e≈2.718），運算規則和 log 相同；ln(a/b)＝ln a－ln b。
      - 換底：log_a b＝log b÷log a。
      - 位數：正數 N 的整數部分是 k 位數 ⇔ k−1≤log N＜k。
      - 絕對值：|x−a| 是數線上 x 到 a 的距離；|x−a|≤r ⇔ a−r≤x≤a＋r。
    steps:
      - 成長或衰退模型：每期變成原來的 (1＋r) 倍，n 期後是 A₀·(1＋r)ⁿ；求期數就兩邊取對數。
      - 比較大小：化成同底；底數＞1 時遞增，0＜底數＜1 時遞減。
      - 估算：用考卷附的對數值，log 5＝1－log 2。
    traps:
      - 每期成長 4%，n 期後是乘 (1.04)ⁿ，不是乘 (1＋0.04n)。
      - ln(135/100)＝ln 135－ln 100，不是 ln(135－100)：對數把除法變成減法。
      - 對數的真數一定要大於 0。
  B2:
    must:
      - 除法原理：f(x)＝g(x)·q(x)＋r(x)，餘式的次數比除式低；餘式定理：f(x) 除以 x−a 的餘式是 f(a)。
      - 二次函數配方：y＝a(x−h)²＋k，頂點 (h, k)；a＞0 開口向上。
      - ax²＋bx＋c＝0：判別式 b²−4ac 決定實根個數；兩根和＝−b/a、兩根積＝c/a。
      - 三次函數 y＝ax³＋bx²＋cx＋d 的圖形對稱於點 (−b/(3a), f(−b/(3a)))。
    steps:
      - 求函數值或係數：代特殊值（x＝0、1、−1）最快。
      - 解多項式不等式：因式分解 → 在數線上標出根 → 由最高次項係數決定最右邊的正負，往左依次變號。
      - 兩個圖形的交點：兩個函數相減，交點的 x 坐標就是相減後方程式的實根。
    traps:
      - 偶次重根的兩側正負號相同，不會變號。
      - 限定範圍內的最大值、最小值，要比較頂點和兩個端點。
  B3:
    must:
      - 特殊角：sin 30°＝1/2、sin 45°＝√2/2、sin 60°＝√3/2；sin²θ＋cos²θ＝1。
      - 弧度：π＝180°；扇形弧長 s＝rθ、面積＝½r²θ。
      - 正弦定理 a/sin A＝2R、餘弦定理 c²＝a²＋b²−2ab cos C（考卷附）；三角形面積＝½ab sin C。
      - y＝a sin(bx＋c)＋d：振幅 |a|、週期 2π/|b|、上下平移 d。
      - 仰角、俯角：視線和水平線的夾角；方位角：從正北順時針量到目標方向的角。
    steps:
      - 測量題：先畫圖，把已知的長度和角度標在三角形上，再選正弦或餘弦定理。
      - 週期現象（潮汐、日照、摩天輪）：由最高、最低點求振幅和中線，由一個完整週期的時間求 b。
    traps:
      - 已知兩邊和其中一邊的對角時，可能有兩個三角形。
      - 週期是 2π/|b|；f 在一段時間內都是正的、兩端是 0，這段時間是半個週期。
  B4:
    must:
      - 等差數列 aₙ＝a₁＋(n−1)d、Sₙ＝n(a₁＋aₙ)/2；等比數列 aₙ＝a₁·rⁿ⁻¹、Sₙ＝a₁(1−rⁿ)/(1−r)（考卷附）。
      - 1＋2＋…＋n＝n(n＋1)/2；1²＋2²＋…＋n²＝n(n＋1)(2n＋1)/6。
    steps:
      - 遞迴式 aₙ₊₁＝p·aₙ＋q（p≠1）：解 c＝pc＋q 得到 c，則 aₙ−c 是公比 p 的等比數列，會趨近 c（|p|＜1 時）。
      - 週期規律：兩個週期 p、q 同時回到起點，要經過 p、q 的最小公倍數。
      - 找規律：列出前幾項，看差或比。
    traps:
      - 第 1 項是 a₁ 還是 a₀ 要看清楚，項數會差一個。
      - 公比 r＝1 時不能用等比級數公式。
  B5:
    must:
      - 斜率 m＝(y₂−y₁)/(x₂−x₁)＝tan θ；平行 ⇔ 斜率相等；垂直 ⇔ 斜率乘積＝−1（都不是鉛直線時）。
      - 點到直線 ax＋by＋c＝0 的距離＝|ax₀＋by₀＋c|÷√(a²＋b²)；平行線距離＝|c₁−c₂|÷√(a²＋b²)。
      - 線段的中垂線：通過中點，斜率是線段斜率的負倒數。
      - 圓 (x−h)²＋(y−k)²＝r²；圓心到直線的距離 d＜r 交兩點、d＝r 相切、d＞r 不相交。
      - 頂點在原點、另兩點 (x₁, y₁)、(x₂, y₂) 的三角形面積＝½|x₁y₂−x₂y₁|。
    steps:
      - 先畫圖，把點、線放到坐標平面上，再決定用斜率、距離還是面積公式。
      - 平分面積的直線：先算總面積的一半，判斷直線會和哪一條邊相交，再設交點坐標列式。
    traps:
      - 斜率乘積＝−1 不適用於鉛直線。
      - 等腰三角形要分情況，並排除三點共線。
  B6:
    must:
      - 向量的坐標：AB＝(x_B−x_A, y_B−y_A)；長度 |(a, b)|＝√(a²＋b²)。
      - 線性組合：OP＝α·OA＋β·OB；α＋β＝1 ⇔ P 在直線 AB 上；0≤α≤1 且 0≤β≤1 ⇔ P 在 OA、OB 所張的平行四邊形內（含邊界）。
      - 分點：AP:PB＝m:n ⇒ OP＝(n·OA＋m·OB)÷(m＋n)。
      - 內積 a·b＝a₁b₁＋a₂b₂＝|a||b|cos θ；a⊥b ⇔ a·b＝0。
    steps:
      - 把向量寫成坐標，列出 α、β 的聯立方程式解出係數，再看係數的範圍判斷位置。
      - 求長度的最大值：讓兩個分量的絕對值同時最大（各分量可以分開調整時）。
    traps:
      - 三角不等式 |a＋b|≤|a|＋|b| 只是上界，兩向量不同方向時達不到。
  B7:
    must:
      - 矩陣乘法：AB 的第 (i, j) 元＝A 的第 i 列和 B 的第 j 行對應相乘再相加；一般 AB≠BA。
      - 二階方陣 A＝[[a, b], [c, d]]：ad−bc≠0 時 A⁻¹＝(1/(ad−bc))·[[d, −b], [−c, a]]。
      - A 乘上行向量 (x, y)ᵀ＝x·(A 的第 1 行)＋y·(第 2 行)。
    steps:
      - 用矩陣表示「輸入 → 輸出」：AX＝Y；已知輸出求輸入，就用反方陣 X＝A⁻¹Y。
      - 表格資料轉矩陣：先確認列、行各代表什麼，乘法的維度要對得上。
    traps:
      - 矩陣乘法不能交換順序。
      - ad−bc＝0 時沒有反方陣。
  B8:
    must:
      - 地球半徑 R，緯度 θ 的緯線半徑＝R cos θ。
      - 同一條經線上兩地的距離＝R×緯度差（弧度）；赤道上兩地的距離＝R×經度差（弧度）；同一條緯線上沿緯線走的距離＝R cos θ×經度差（弧度）。
      - 球面上兩點之間的最短路徑，是通過這兩點的大圓上的劣弧。
      - 透視圖：和畫面平行的直線畫出來仍然平行；和畫面不平行的一組平行線，畫出來會交於同一個消失點。
      - 圓錐截痕：截面與軸線的夾角 β、圓錐半頂角 α：β＝90° 是圓、α＜β＜90° 是橢圓、β＝α 是拋物線、β＜α 是雙曲線。
    steps:
      - 球面問題：畫出過地心的剖面（大圓）或緯線圓，再用弧長 s＝rθ 或三角函數。
      - 截痕問題：先判斷 β 和 α 的大小關係，再對應截痕的種類。
    traps:
      - 除了赤道，緯線都不是大圓，沿緯線走不是最短路徑。
      - 經緯度的角度要換成弧度再乘半徑。
  B9:
    must:
      - 加法原理（分類）、乘法原理（分步）。
      - 排列 n!÷(n−k)!；組合 C(n, k)＝n!÷(k!(n−k)!)；有相同物的排列 n!÷(p!·q!·…)。
      - k 個相同的東西分給 n 個人（可以有人沒分到）：C(n＋k−1, k) 種。
    steps:
      - 相鄰的先綁成一塊再排，塊內再排；不相鄰的先排其他人，再插空隙。
      - 分組、分派：先滿足「每組都要有」的條件，再用補集扣掉不合的情形。
    traps:
      - 組與組沒有分別時要除以組數的排列數。
      - 「至少」的問題用補集比較快、不容易重複計算。
  B10:
    must:
      - 古典機率 P(A)＝n(A)÷n(S)（每個樣本點機會相等）；P(A′)＝1－P(A)。
      - P(A∪B)＝P(A)＋P(B)－P(A∩B)。
      - 條件機率 P(B｜A)＝P(A∩B)÷P(A)；A、B 獨立 ⇔ P(A∩B)＝P(A)·P(B)。
    steps:
      - 列聯表：設一個未知數把表格填滿（每列、每行的和要對），再把題目的條件翻成方程式或不等式。
      - 多階段的試驗：畫樹狀圖，路徑相乘、不同路徑相加。
      - 「至少一次」：1 減去「一次都沒有」。
    traps:
      - 「A 之中有多少比例是 B」是條件機率，分母是 A，不是全體。
      - 獨立和互斥不同。
  B11:
    must:
      - 中位數、第 k 百分位數：資料由小到大排，算 n×k/100；不是整數就取下一個整數的位置，是整數 m 就取第 m 和第 m＋1 個的平均。
      - 標準差、相關係數、迴歸直線的公式考卷附；迴歸直線一定通過 (μx, μy)，斜率＝r·σy÷σx。
      - 資料 y＝ax＋b：平均變成 a·μx＋b、標準差變成 |a|·σx；a＞0 時相關係數不變，a＜0 時變號。
    steps:
      - 看散布圖：點越接近一條直線，|r| 越接近 1；斜向右上 r＞0、右下 r＜0。
      - 用迴歸直線預測：把 x 代入 y−μy＝r(σy÷σx)(x−μx)。
    traps:
      - 標準差只受乘除影響，加減常數不會改變。
      - 相關係數不受單位換算（乘正數）影響。
      - 由 x 預測 y 和由 y 預測 x 是兩條不同的迴歸直線。
