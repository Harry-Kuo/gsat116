# 國文必考觀念樹。summary＝答題後顯示的一行重點；points＝Notion 觀念頁的重點條列（第 1 週的觀念先寫完整）。
# match：除了主觀念代碼相符，也可用標籤對應（例如研判題、核心選文）。
subject: chinese
name: 國文
modules:
  - id: A
    name: 語文知識
    concepts:
      - id: A1
        name: 字音辨識
        summary: 每年第 1 題必考。最大陷阱是形聲字「有邊讀邊」：聲符相同不代表讀音相同，要一個字一個字確認。
        points:
          - 近六屆每年第 1 題都是字音題，全國答對率從 14% 到 54% 不等，是鑑別度高的「拉分題」。
          - 出題方式固定：四組「」內的字比較讀音是否相同，只要找出唯一相同的一組。
          - 陷阱一：同聲符不同音，例如「攲」（ㄑㄧ）與「旖」（ㄧˇ）、「諳」（ㄢ）與「喑」（ㄧㄣ）。
          - 陷阱二：形近字，例如「舁」（ㄩˊ）與「臾」（ㄩˊ）其實同音，容易被字形誤導以為不同。
          - 作答法：先刪掉「一眼看出不同」的選項，把時間留給不確定的一兩組；平時用錯字本累積「易誤讀字」。
      - id: A2
        name: 字形辨正
        summary: 每年第 2 題必考。錯字多藏在成語與常用詞裡，用「字義」判斷，不要憑印象。
        points:
          - 近六屆每年第 2 題都是「完全沒有錯別字」題，答對率常在 20% 左右，2 分很難拿。
          - 高頻錯字集中在成語與常用語，例如「以儆效尤」「無遠弗屆」「離群索居」「人情世故」「價格不菲」。
          - 判斷法：拆開詞語想每個字的意思，例如「世故」指處世經驗，不是「事故」；「不菲」的菲是微薄，不是「斐」。
          - 作答法：四個選項逐句圈出可疑字，只要找到一個錯字就刪去該選項。
      - id: A3
        name: 詞語與成語運用
        summary: 看語境是否相符：褒貶、對象、程度都要對；最常見陷阱是成語「望文生義」。
        points:
          - 每年至少一題，多為多選題（例：115 第 26 題），也有單選「填入詞語」題（例：114 第 3 題）。
          - 檢查三件事：①褒貶色彩（始作俑者是貶義）②使用對象（不次拔擢指破格升遷）③程度與情境。
          - 望文生義陷阱：「不次拔擢」不是「不升遷」、「曲突徙薪」是事先預防而不是事後補救。
          - 填詞題：先看空格前後的修飾關係與對比，再用刪去法縮小範圍。
      - id: A4
        name: 文言詞義與虛詞
        summary: 一詞多義題幾乎年年考，例句多出自 15 篇核心選文；把詞放回原句，看它的詞性與語法位置。
        points:
          - 近六屆每年都有「」內詞義前後相同題（多選），例句大量取自核心選文（115 第 25 題一題就用了 9 篇）。
          - 高頻虛詞：之、其、而、以、於、為、與、乃、則、所、且、竊、向、得、既。
          - 判斷法：先判斷詞性（動詞／介詞／連詞／副詞），再代入現代語意比對。
          - 例：「為寒所勒」「為所虜」都是「為…所…」被動句的「為」（被），意義相同。
          - 例：「竊以為過矣」「竊慕管夫人之墨竹」的「竊」都是「私下、私自」的謙詞，意義相同。
      - id: A5
        name: 語法、句式與修辭
        summary: 題幹通常先給定義（判斷句、假設、比較、目的、量詞），照定義一個選項一個選項檢驗。
        points:
          - 題型特色：題幹先舉例說明一種語法或修辭，再要你找「相同用法」。例如 114 第 29 題「則」表假設結果。
          - 作答法：把題幹的例句結構抄成公式（如「條件＋則＋結果」），逐項套公式。
          - 常考：判斷句「…者，…也」、比較句「形容詞＋於＋名詞」、目的「以」、量詞、對偶。
      - id: A6
        name: 文意排序與填句
        summary: 找關聯詞、代名詞與首尾呼應；排序題先確定開頭與結尾，再用刪去法。
        points:
          - 幾乎每年都有排序或填句題，文言、白話都會考。
          - 排序三步驟：①找能接題幹開頭的句子 ②找結尾句 ③用「然、故、則、及其」等關聯詞串中間。
          - 填句題：空格前後常有對應關係（因果、轉折、總分），先判斷空格的功能再選。
          - 115 第 5 題（蘇軾〈書論〉）答對率只有 38%，平時要練文言的語氣與邏輯連接詞。
  - id: B
    name: 國學與文化常識
    concepts:
      - id: B1
        name: 應用文與稱謂
        summary: 題辭、書信用語、親屬稱謂：先確認場合（婚、壽、喪、賀）以及雙方的關係與輩分。
        points:
          - 常以情境題出現，例如 115 第 3 題（賀生子詩與稱謂）、111 第 32 題（家書的啟封詞與提稱語）。
          - 親屬稱謂：先畫出兩人的關係圖，再判斷是否「家」「舍」「令」的用法。
          - 題辭：婚（珠聯璧合）、壽（椿萱並茂）、新居（君子攸居）、德望（望重桑梓）。
      - id: B2
        name: 文學與文化常識
        summary: 文體、韻律、文學史常融入情境題，重點是「時代與作品是否對應」以及各文體的特徵。
        points:
          - 文學史題多半考「作品與時代、文體是否對應」：先秦《詩經》（北方、四言）與《楚辭》（南方、屈原、句中多「兮」）→ 漢賦、樂府 → 魏晉南北朝駢文 → 唐詩、唐傳奇、古文運動 → 宋詞 → 元曲 → 明清小說與小品文；完整整理在〈國學常識〉的「文學史與文體」。
          - 近體詩在唐代成熟：絕句 4 句、律詩 8 句，押平聲韻、一韻到底，律詩中間兩聯（頷聯、頸聯）要對仗；古體詩的句數、平仄比較自由。
          - 詞依詞牌填寫，又稱詩餘、長短句；曲（散曲、雜劇）依曲牌填寫，可以加襯字，用語比較口語。
          - 對聯：上下聯字數相同、詞性相對，上聯最後一字是仄聲、下聯最後一字是平聲。
          - 六書：象形、指事、會意、形聲是造字的方法，轉注、假借是用字的方法；漢字中形聲字最多。
      - id: B3
        name: 經典與思想（論孟諸子）
        summary: 論語、孟子等經典常當作「佐證」選項，要先讀懂原句的論點，再比對文章觀點。
        points:
          - 儒家：孔子重視仁與禮（《論語》）；孟子主張性善、仁政、民貴君輕；荀子主張性惡，重視禮與學習（〈勸學〉）。
          - 道家：老子主張無為、柔弱勝剛強、返璞歸真；莊子追求逍遙、齊物，常用寓言說理。
          - 墨家主張兼愛、非攻、節用；法家由韓非集大成，主張以法、術、勢治國。
          - 四書是《論語》《孟子》《大學》《中庸》，五經是《詩》《書》《易》《禮》《春秋》；〈大同與小康〉出自《禮記．禮運》。
          - 作答法：選項引用經典時，先弄懂那句話的原意（例如「己所不欲，勿施於人」是推己及人的恕道），再看它能不能支持文章的論點。
  - id: C
    name: 閱讀理解
    concepts:
      - id: C1
        name: 白話知性閱讀
        summary: 先看題幹再讀文，抓每段主旨；選項常見陷阱是過度推論、因果倒置、以偏概全。
        points:
          - 題組占國綜最大宗，平均每題約 1.5–2 分鐘，要控制閱讀時間。
          - SOP：①先看題目問什麼 ②讀文時標出段落重點 ③每個選項都要回到原文找依據。
          - 選項四大陷阱：過度推論（原文沒說）、偷換概念、因果倒置、以偏概全（「皆」「總能」）。
      - id: C2
        name: 白話文學閱讀
        summary: 散文、小說、新詩：抓意象、情感轉折與敘事觀點，每個選項都要能在文本中找到依據。
        points:
          - 散文：找出作者寫的對象、事件與情感轉折，留意結尾的體悟；常考寫作手法，例如以小見大、借物抒情、今昔對比。
          - 小說：掌握人物、情節、場景與敘事觀點（第一人稱、第三人稱）；人物的性格要從言行細節推斷，不要只看旁人的評語。
          - 新詩：先找意象（具體的事物）與它象徵的情感或意義，再看分行、斷句造成的停頓與強調。
          - 選項陷阱：把作者的情感說錯（例如把懷念說成怨恨）、把象徵的意義說反、延伸到文本沒有寫的內容。
      - id: C3
        name: 文言閱讀
        summary: 先抓人物、事件、觀點；課外文言就用核心選文學過的詞義和句式來推敲。
        points:
          - 先讀出文章的人物、事件、時間與觀點，再回頭處理詞義；遇到生字，從上下文與核心古文學過的用法推敲。
          - 文言常省略主語、賓語，閱讀時要自己補出「誰對誰做了什麼」，才不會弄錯主客體。
          - 常見的論說結構：先舉事例再下結論，或先提出主張再用古人古事印證；結論常在「故」「是以」「由是觀之」之後。
          - 題目附的注釋常解釋關鍵字詞，是重要線索，作答前一定要看。
      - id: C4
        name: 古典韻文
        summary: 詩詞曲看意象、情感、格律；題目附的注解、評點都是線索。
        points:
          - 詩詞先找時間、地點、景物與人物，再推作者的情感；景物描寫常用來襯托情感（以景襯情、情景交融）。
          - 常見意象：月（思鄉、團圓）、柳（離別，古人折柳送別）、雁（書信、思鄉）、菊（隱逸）、梅（高潔、堅貞）、杜鵑（悲傷、思歸）。
          - 判斷體裁：每句字數相同、全首 4 句或 8 句 → 近體詩；長短句、有詞牌 → 詞；有曲牌、襯字、口語 → 曲。
          - 題目附的評點、注釋或寫作背景，通常就是解題的關鍵。
      - id: C5
        name: 跨文本比較
        summary: 甲乙丙文先各自抓主旨，再比較立場與寫法；選項出現「皆、均、二者」時，要每一篇都查核。
        points:
          - 先各自歸納每篇的主旨與立場，再比較：觀點相同或相反、寫作角度（抒情、說理、敘事）、舉例方式。
          - 選項出現「兩文皆」「甲乙均」時，每一篇都要找到依據，只有一篇符合就是錯的。
          - 比較題常考「同中有異」：題材相同但態度不同，或結論相同但理由不同。
      - id: C6
        name: 圖表判讀
        summary: 先看表頭、單位與註記，再逐項驗證選項；圖表題答對率通常較高，是穩拿分的題型。
        points:
          - 先看圖表的標題、單位、資料來源與註記，再看座標軸或欄位代表什麼。
          - 逐一驗證選項：數字能不能從圖表直接算出；比例與總量不能混用；圖表沒有呈現的資料不能推論。
          - 圖表題通常答對率較高，是要穩穩拿下的分數，但要分清楚「整體趨勢」和「單一年份」。
      - id: C7
        name: 研判題（符合／不符合／無法判斷）
        match: {tag: 研判}
        summary: 「無法判斷」＝文章沒有提到；「不符合」＝和文章矛盾。先逐句判斷，再對照選項組合。
        points:
          - 近年幾乎每份國綜都有 2–3 題，格式固定：①②（③）各自判斷，再選組合。
          - 三種判斷：符合（文中有依據）、不符合（與文中矛盾）、無法判斷（文中沒有提到，推不出來）。
          - 最常錯在把「無法判斷」當成「不符合」：文章沒說，不等於文章說錯。
          - 作答法：每一句都要在原文畫出依據；找不到依據時，先考慮「無法判斷」。
      - id: C8
        name: 15 篇核心選文
        match: {tag_prefix: "核心:"}
        summary: 核心選文不只考課文本身，更常被拆成詞義、句式、佐證選項，熟讀原文最划算。
        points:
          - 15 篇核心古文：〈燭之武退秦師〉〈大同與小康〉〈諫逐客書〉〈鴻門宴〉〈出師表〉〈桃花源記〉〈師說〉〈虯髯客傳〉〈赤壁賦〉〈晚遊六橋待月記〉〈項脊軒志〉〈勞山道士〉〈勸和論〉〈鹿港乘桴記〉〈畫菊自序〉；原文、翻譯與重點詞義整理在〈核心古文 15 篇〉。
          - 命題方式：直接考課文的詞義、句式與文意，或把課文的句子當成選項的佐證。
          - 讀核心古文時，同時記住作者、時代與文體，例如〈虯髯客傳〉是唐傳奇、〈晚遊六橋待月記〉是晚明公安派的小品文、〈勞山道士〉出自《聊齋誌異》。
  - id: D
    name: 混合題
    concepts:
      - id: D1
        name: 混合題簡答
        summary: 照字數與題幹要求作答：寫出關鍵詞、分清人物主客體，每個小題都要回答完整。
        points:
          - 國綜第貳部分占 22–24 分，其中非選 18–20 分（折合國文考科 9–10 分），分量很重。
          - 依 115 官方評分原則，常見失分：①只答一半（題目問「基於何種考量＋採取什麼行動」只答其一）②主客體弄錯（誰對誰感到抱歉）③超出文本自行發揮 ④錯別字。
          - 作答格式：用題幹的關鍵詞開頭，直接回答，不要重複題目；嚴守字數。
  - id: E
    name: 國寫
    concepts:
      - id: E1
        name: 國寫知性題
        summary: 國寫 1 分＝國綜 2 分。知性題要統整資料、提出判斷，結構清楚、論點有依據。
        points:
          - 國寫兩大題各 25 分：第一大題是知性題，第二大題是情意題；國寫 1 分＝國綜 2 分，兩題都要寫完。
          - 近六屆知性題的形式固定：問題（一）文長限 80 字以內、占 4 分，依據引文說明或比較；問題（二）文長限 400 字以內、占 21 分，就議題提出看法並說明理由。
          - 問題（一）要精準摘要：用引文的關鍵詞直接回答題目問的項目，不要加入自己的評論。
          - 問題（二）的寫法：開頭明確表態（贊成、反對或有條件的立場）→ 提出 2～3 個理由，每個理由搭配例子或引文證據 → 回應可能的反對意見 → 收束結論；不要只複述引文。
          - 評分採「三等六級」：A＋（25–22）、A（21–18）、B＋（17–14）、B（13–10）、C＋（9–6）、C（5–1），另有 0 分；閱卷先判等、再定級、最後給分。
          - 第一題寫在答案卷正面、第二題寫在背面；要用 0.5～0.7 mm 的黑色墨水筆，不能用鉛筆。
          - 近六屆知性題：110「經驗機器」、111「樂齡出遊」、112 福爾摩斯與華生的生活態度、113「標籤」現象、114 擬社會互動、115「無臉」與責任的承擔。
      - id: E2
        name: 國寫情意題
        summary: 情意題重在真實的感受與體悟，扣緊題旨，用具體的生活細節撐起情感。
        points:
          - 情意題 25 分，給定題目、文長不限，評量能不能寫出真實的生活經驗，並從中感知、聯想，真誠抒發情感與體會。
          - 寫法：從一個具體的場景或物件切入 → 寫出細節（感官、動作、對話）→ 呈現情感的轉折 → 結尾提升到體悟，但不要說教。
          - 扣緊題目的每一個要求：例如 115「隔在我們之間的種種」要寫出隔閡的原因、自己的看法、換位思考與回應，少寫一項就會失分。
          - 近六屆情意題：110「如果我有一座新冰箱」、111「當我打開課本」、112「花草樹木的氣味記憶」、113「縫隙的聯想」、114「關於 52 赫茲，我想說的是……」、115「隔在我們之間的種種」。
