subject: social
name: 社會
modules:
  - id: G
    name: 公民與社會
    concepts:
      - {id: G1, name: "社會安全與公共政策", summary: "先找出題文的價值立場（例如健保是社會安全制度），再選最能呼應的敘述。"}
      - {id: G2, name: "民主政治與媒體", summary: "同溫層、演算法、投票參與；推論只能根據題目提供的資料。"}
      - {id: G3, name: "法律原則", summary: "罪刑法定、不溯及既往、禁止類推；無罪推定、不自證己罪要分清楚。"}
      - {id: G4, name: "經濟學概念", summary: "支出面 GDP＝C＋I＋G＋(X−M)；比例資料不能推論總量；比較利益看機會成本。"}
      - {id: G5, name: "全球化與多元文化", summary: "注意政策的「目的」：保障少數族群文化權、全球不平等。"}
  - id: H
    name: 歷史
    concepts:
      - {id: H1, name: "臺灣史", summary: "清代治臺與海防、日治時期的身分與皇民化；看史料推論官方的關注重點。"}
      - {id: H2, name: "中國史", summary: "郡縣制與編戶齊民、元代海運、中共的民族政策。"}
      - {id: H3, name: "世界史", summary: "從史料的時間、人物、用語判斷背景（邱吉爾演說、啟蒙與法國大革命、殖民擴張）。"}
      - {id: H4, name: "東亞國際關係", summary: "宗藩（朝貢）體系、十九世紀末列強在朝鮮的角力、滿洲國移民。"}
  - id: D
    name: 地理
    concepts:
      - {id: D1, name: "地圖與地理資訊系統", summary: "GIS 功能要分清楚：環域、疊圖、路網、屬性查詢；讀地圖先看圖例與分布。"}
      - {id: D2, name: "氣候與生態", summary: "由氣溫雨量圖判斷氣候類型；熱帶高地氣溫溫和、雙雨季。"}
      - {id: D3, name: "區域與產業", summary: "產業區位看先決條件（資訊通訊、原料、市場）；各區域的優勢產品決定貿易流向。"}
      - {id: D4, name: "聚落與交通", summary: "通勤流量可劃分生活圈，反映運輸活動與聚落系統的關係。"}
