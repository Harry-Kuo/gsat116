subject: mathA
name: 數學A
modules:
  - id: A
    name: 數與函數
    concepts:
      - {id: M1, name: "數與式、指數對數", summary: "指數、對數先化成同底，再比較指數；高斯記號 [x] 要一個一個代值確認。"}
      - {id: M2, name: "多項式與二次函數", summary: "多項式看首項係數與對稱中心；二次函數先配方找頂點。"}
      - {id: M3, name: "三角函數", summary: "先畫出單位圓或函數圖形，再判斷範圍與交點；倍角公式要熟。"}
      - {id: M8, name: "數列與級數", summary: "等差看中項、等比看公比；遞迴式試著找出「平移後成等比」的形式。"}
  - id: B
    name: 幾何與向量
    concepts:
      - {id: M9, name: "坐標幾何（直線、圓、不等式區域）", summary: "把條件畫在坐標平面上；點到直線距離與圓的切割、弦長公式是核心。"}
      - {id: M4, name: "向量與空間", summary: "內積判斷垂直與夾角，外積或行列式算面積與體積；比例分點用向量表示最快。"}
      - {id: M5, name: "矩陣", summary: "矩陣乘法先算小次方找規律；線性組合可以把未知向量拆成已知向量。"}
  - id: C
    name: 機率統計與計數
    concepts:
      - {id: M6, name: "機率與統計", summary: "期望值＝Σ（值×機率）；條件機率＝交集／條件；迴歸直線與標準化分數是常考。"}
      - {id: M7, name: "排列組合", summary: "先分類再計數，注意「相同結果」只算一次；綁在一起的排列先排區塊。"}
