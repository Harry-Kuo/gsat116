subject: science
name: 自然
modules:
  - id: P
    name: 物理
    concepts:
      - {id: P1, name: "力學與運動", summary: "v–t 圖斜率是加速度、面積是位移；功等於動能變化。"}
      - {id: P2, name: "電磁學", summary: '電場 $E=\dfrac{F}{q}$；變化的磁場產生感應電流（電磁感應）。'}
      - {id: P3, name: "近代物理與基本交互作用", summary: "強力＞電磁力＞弱力＞重力；接觸力的本質是電磁力；物質波會干涉。"}
      - {id: P4, name: "波動與光", summary: "都卜勒效應：接近時頻率升高、遠離時降低。"}
  - id: C
    name: 化學
    concepts:
      - {id: C1, name: "化學計量與熱化學", summary: "先換算莫耳數，再乘上每莫耳的熱量；有沒有達到熔點、沸點決定要不要加相變熱。"}
      - {id: C2, name: "酸鹼與溶液", summary: '指示劑顏色對應 pH 範圍；$[\mathrm{H^+}]$ 越大 pH 越小。'}
      - {id: C3, name: "原子結構與週期表", summary: "同週期由左而右半徑變小、陰電性變大；鹼金屬易失去一個電子。"}
      - {id: C4, name: "物質結構與鍵結", summary: "金屬鍵＝陽離子晶格＋自由電子；離子晶體、共價網狀、分子是不同結構。"}
  - id: B
    name: 生物
    concepts:
      - {id: B1, name: "細胞與細胞分裂", summary: "DNA 在間期 S 期複製；同源染色體配對只在減數分裂。"}
      - {id: B2, name: "遺傳", summary: "由子代表現型反推親代基因型；分離律適用於複等位、性聯、不完全顯性。"}
      - {id: B3, name: "代謝與能量", summary: "ATP 是直接能量來源；光反應提供固碳反應所需的 ATP 與 NADPH。"}
      - {id: B4, name: "演化與分類", summary: "鳥類與恐龍親緣最近；分子序列可推論共同祖先。"}
      - {id: B5, name: "生物技術與實驗", summary: "DNA 水解產生核苷酸；萃取的 DNA 不會自行形成染色體。"}
  - id: E
    name: 地球科學
    concepts:
      - {id: E1, name: "天文", summary: "光年是距離單位；矮行星：穀神星、冥王星、鬩神星；日食發生在新月。"}
      - {id: E2, name: "大氣與氣象", summary: "飽和水氣壓曲線：降溫到飽和就凝結；颱風逆時針旋轉、中心氣壓最低。"}
      - {id: E3, name: "地質與地球歷史", summary: "由珊瑚年輪推知古代一年天數較多 → 地球自轉逐漸變慢。"}
      - {id: E4, name: "海洋", summary: "副熱帶海域蒸發旺盛鹽度高；赤道多雨、河口與極區鹽度較低。"}
