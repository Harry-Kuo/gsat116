subject: mathB
name: 數學B
modules:
  - id: A
    name: 數與函數
    concepts:
      - {id: B1, name: "數與式、指數對數", summary: '絕對值是「距離」；指數、對數先化成同底再比較；$\ln$ 與 $e$ 用在連續複利，$\log$ 值範圍要會估。'}
      - {id: B2, name: "多項式與函數圖形", summary: "二次函數配方找頂點；三次函數看對稱中心；多項式用「代特殊值」與除法原理最快。"}
      - {id: B3, name: "三角函數與三角測量", summary: '$y=a\sin(bx+c)+d$ 看振幅、週期與平移；解三角形用正弦、餘弦定理。'}
      - {id: B4, name: "數列、遞迴與規律", summary: "等差看公差、等比看公比；遞迴式找「平移後成等比」的形式；週期規律用最小公倍數。"}
  - id: B
    name: 坐標、向量與空間
    concepts:
      - {id: B5, name: "直線與坐標幾何", summary: "斜角與斜率、平行線距離、點到直線距離；面積問題把圖形放在坐標上算。"}
      - {id: B6, name: "平面向量", summary: '$\overrightarrow{OP}=\alpha\overrightarrow{OA}+\beta\overrightarrow{OB}$ 解出 $\alpha$、$\beta$ 再看範圍；係數都在 0 到 1 之間時 P 落在平行四邊形內。'}
      - {id: B7, name: "矩陣", summary: "A 乘上一個行向量＝A 的各行依係數組合；反方陣把「輸入、輸出」對調。"}
      - {id: B8, name: "空間概念（經緯度、透視、截痕）", summary: '緯度 $\theta$ 的緯線半徑是 $R\cos\theta$；大圓弧是球面最短路徑；透視圖的消失點與圓錐截痕類型要會判斷。'}
  - id: C
    name: 機率統計與計數
    concepts:
      - {id: B9, name: "排列組合", summary: "相鄰的先綁成一塊再排；分組分派先滿足「每組都要有」的條件，再用補集扣掉不合的情形。"}
      - {id: B10, name: "機率", summary: '獨立事件機率相乘；$\text{條件機率}=\dfrac{\text{交集}}{\text{條件}}$；列聯表先把各格用同一個未知數表示。'}
      - {id: B11, name: "數據分析", summary: '資料乘以 a 倍時標準差乘 $|a|$、相關係數不變（$a>0$）；迴歸直線過（平均, 平均），斜率 $=r\cdot\dfrac{\sigma_y}{\sigma_x}$；百分位數依定義找位置。'}
