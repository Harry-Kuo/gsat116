# ---------- Day 50：中國史、世界區域地理、世界史 ----------
soc113-05:
  key: 民家緊鄰壕溝、跨溝蓋屋，垃圾穢物丟進溝裡 → 城市人口密集、空間擁擠，公共衛生不佳。
  explain: |
    (D) 南宋城市繁華、人口密集，房屋擠到壕溝上，垃圾處理不良，造成髒亂惡臭 ✓
    (A) 資料描述的是居民生活與衛生，看不出政府因抗金而無力管理（全國 14% 誤選）✗
    (C) 坊市制瓦解代表商業活動不受限制，和維修城郭無關（全國 12% 誤選）✗
    (B) 惡臭潮濕是垃圾穢物造成的，不是瘴癘造成的 ✗
soc110-50:
  key: 「教義規範一生至少朝覲聖地一次」→ 伊斯蘭教五功之一的朝覲（到麥加）；葉門摩卡港就在阿拉伯半島。
  explain: |
    (B) 有能力的穆斯林一生至少要到麥加朝覲一次，是伊斯蘭教的五功之一 ✓
    (A) 印度教沒有一生必須朝覲一次的規定，聖地也不在阿拉伯半島（全國 13% 誤選）✗
    (C) 猶太教的聖地是耶路撒冷，也沒有這項義務 ✗
    (D) 希臘正教沒有這項義務 ✗
soc110-51:
  key: 十九世紀新開通、大幅縮短歐洲到印度航程的航道 → 1869 年通航的蘇伊士運河，不必再繞過非洲南端的好望角。
  explain: |
    (D) 蘇伊士運河連接地中海與紅海，歐洲船隻可直接經紅海進入印度洋 ✓
    (B) 麻六甲海峽是印度洋通往太平洋的天然水道，不是新開通的航道（全國 19% 誤選）✗
    (C) 巴拿馬運河 1914 年通航，連接大西洋與太平洋，和歐洲到印度的航程無關（全國 19% 誤選）✗
    (A) 英吉利海峽是天然海峽，不是新航道 ✗
soc110-52:
  key: 馬拉巴海岸在印度西南岸，夏季迎著西南季風，溫暖潮溼 → 圖中西南沿海的乙。
  explain: |
    (B) 乙位在印度西南岸，正是馬拉巴海岸，夏季迎西南季風 ✓
    (C) 丙在東南岸（科羅曼德海岸），夏季位於西南季風的背風側（全國 27% 誤選）✗
    (D) 丁在東岸偏北，面向孟加拉灣（全國 21% 誤選）✗
    (A) 甲在西北部，氣候較乾燥（全國 16% 誤選）✗
soc110-07:
  key: 2008 年立委選舉改採「單一選區兩票制」，單一選區只選出一人，有利大黨，政黨生態走向兩黨。
  explain: |
    (C) 立委選舉由複數選區改為單一選區兩票制，小黨在單一選區很難勝選，政黨體系趨向兩黨 ✓
    (A) 社會分歧並沒有突然兩極化，關鍵是制度改變（全國 35% 誤選）✗
    (D) 中央政府體制沒有改變（全國 19% 誤選）✗
    (B) 不是民眾厭惡小黨，而是選制不利小黨 ✗

# ---------- Day 51：中國史、民主政治與媒體、世界史 ----------
soc113-07:
  key: 二十年間戶口數幾乎不動（象山完全相同，鄞縣每十年只多 5 戶），顯然沒有認真清查 → 賦役逐漸改成按田畝、人丁折銀徵收（一條鞭法的趨勢），戶口登記流於形式。
  explain: |
    (A) 賦役改為按土地人丁徵銀後，官府不再需要精確掌握戶口，方志上的數字多是沿用舊數 ✓
    (D) 定海的戶數反而增加，而且數字幾乎不變的問題不能用限制移民解釋（全國 36% 誤選）✗
    (C) 資料中只有慈溪減少，無法說明大量人民遷往遼東（全國 23% 誤選）✗
    (B) 沒有史料記載官員強制遷移人口（全國 11% 誤選）✗
soc110-08:
  key: 只有跨國企業經理級以上主管才能參選總統 → 不合理地限制人民的被選舉權，違反政治平等。
  explain: |
    (B) 參選資格設下與能力無關的身分限制，人民的政治權利不平等 ✓
    (C) 總統直選、不對國會負責，是總統制的設計，仍向選民負責，不必然違反責任政治（全國 10% 誤選）✗
    (A)(D) 制度由憲法、法律規定，和多數統治、法治無直接衝突 ✗
soc113-08:
  key: 菁英中畫家、雕塑家占一半以上，家庭背景以工匠、店主為主 → 文藝復興時期的義大利（十五世紀），藝術家多出身工匠作坊。
  explain: |
    (C) 十五世紀義大利文藝復興，城市商業繁榮，藝術家多半從工匠學徒出身，畫家和雕塑家是最受重視的菁英 ✓
    (B) 十一世紀的拜占庭以宗教與官僚為主，藝術家不會是社會菁英的主體（全國 13% 誤選）✗
    (D) 十九世紀的日耳曼以科學、工業與哲學著稱，科學家比例不會這麼低（全國 10% 誤選）✗
    (A) 西元前一世紀的亞歷山卓以學術、科學研究聞名 ✗
soc110-09:
  key: 契約自由：店家可以決定給誰優惠；甲按標價自願成交，不能因別人拿到折扣就主張不公平。
  explain: |
    (B) 私人之間的交易，依契約自由原則，店家可以自由決定給哪些顧客優惠 ✓
    (C) 對不同顧客給不同折扣是常見的商業行為，不違反公平交易法（全國 34% 誤選）✗
    (D) 平等原則拘束的是國家，消保官不能用它來要求私人店家（全國 31% 誤選）✗
    (A) 商品價格清楚標示，甲依標價購買，沒有資訊不透明 ✗
soc113-10:
  key: 1958 年中共砲擊金門（八二三砲戰）；同時期蘇聯要求西方撤出西柏林（柏林危機），美國表態支持西柏林。
  explain: |
    (A) 金門是中共砲擊的沿海小島；柏林是冷戰時美國堅持保衛的歐洲城市 ✓
    (D) 華沙是東歐共產國家波蘭的首都，屬蘇聯陣營（全國 13% 誤選）✗
    (C) 澎湖不是靠近大陸、遭中共攻擊的沿海小島；巴黎沒有遭受共產陣營威脅（全國 11% 誤選）✗
    (B) 大陳島在 1955 年就已撤守；倫敦也不是冷戰對峙的焦點 ✗

# ---------- Day 52：法律原則、中國史、東亞國際關係 ----------
soc110-10:
  key: 躺臥只是妨礙他人，卻要罰款加上禁止入園六個月，手段太重 → 違反比例原則。
  explain: |
    (A) 為了維持秩序，用勸導或較輕的罰則就能達到目的；禁止入園半年對人民權利限制過大，違反比例原則 ✓
    (C) 有法律授權只符合法律保留，措施仍要符合比例原則，才算合乎法治（全國 43% 誤選）✗
    (B) 罰鍰、禁止入園限制人民權利，須有法律或法律授權的依據（全國 9% 誤選）✗
    (D) 一般行為自由也受憲法保障，只能依法在必要範圍內限制 ✗
soc113-11:
  key: 「國民黨領導的國民革命」「三民主義將取代帝國主義和社會主義」→ 國民政府統治中國大陸、推行黨化教育的時期：1930 年代初的上海。
  explain: |
    (B) 1928 年北伐完成後，國民政府在全國推行三民主義教育，上海出版的教科書會有這樣的論述 ✓
    (A) 1910 年代初的北京是北洋政府統治，國民革命還沒開始（全國 30% 誤選）✗
    (C) 1960 年代末南京在中共統治下，正值文化大革命，不會推崇三民主義（全國 27% 誤選）✗
    (D) 1990 年代末香港剛回歸中國，教科書不會宣揚三民主義 ✗
soc110-11:
  key: 不服環保局的罰單（行政處分）→ 先向上級機關（縣市政府）提起訴願，不服訴願決定才提行政訴訟。
  explain: |
    (C) 罰單是行政處分；對行政處分不服，先向原處分機關的上級機關提起訴願 ✓
    (B) 行政訴訟原則上要先經過訴願程序（全國 19% 誤選）✗
    (D) 罰單屬公法爭議，不是民事訴訟（全國 16% 誤選）✗
    (A) 大法官解釋憲法爭議，不處理個案罰單 ✗
soc113-12:
  key: 授田給人民、不得買賣、死後歸還（班田收授）＋ 徵收穀物、布疋、土產 → 日本大化革新仿效唐代的均田制與租庸調法。
  explain: |
    (C) 唐代均田制配合租庸調：租繳穀物、調繳布帛與土產，日本孝德天皇時的大化革新加以仿效 ✓
    (B) 占田制只規定占田的限額，沒有死後歸還的規定，日本也是學唐制（全國 21% 誤選）✗
    (D) 一條鞭法把賦役合併折銀徵收，和授田無關（全國 14% 誤選）✗
    (A) 戶調制只是按戶徵收絹綿，沒有授田 ✗
soc110-12:
  key: 只有模糊畫面、沒有其他證據能證明甲有罪 → 罪證有疑，利歸被告，判無罪 → 無罪推定原則。
  explain: |
    (D) 被告在判決確定前推定無罪；檢察官的證據不足以證明犯罪時，就應判無罪 ✓
    (B) 罪刑法定是指犯罪和刑罰都要有法律明文規定，和證據不足無關（全國 24% 誤選）✗
    (A) 審檢分立是法院和檢察署分開（全國 17% 誤選）✗
    (C) 從舊從輕是法律變更時適用對被告有利的法律 ✗
soc110-13:
  key: 本案經過地方法院、高等法院、最高法院 → 三級三審；最高法院是法律審，不自己調查證據。
  explain: |
    (A) 刑事案件原則上採三級三審，讓被告有機會救濟，保障人權 ✓
    (D) 最高法院是法律審，撤銷發回的理由是原判決適用法律有違誤（例如證據法則），不是自行重新認定事實（全國 29% 誤選）✗
    (B) 被害人不是訴訟當事人，不能自己上訴，只能請檢察官上訴（全國 28% 誤選）✗
    (C) 最高法院原則上不調查證據，只審查法律適用 ✗

# ---------- Day 53：東亞國際關係、經濟學概念、中國史 ----------
soc113-13:
  key: 1818–1819 年英國人萊佛士來到此地、開為商埠，數年間成為大都會，華人「唐人」來此經商 → 新加坡（碑文出自天福宮）。
  explain: |
    (A) 1819 年英國東印度公司在新加坡開港，迅速發展成商業都會，華人移民建廟奉祀媽祖 ✓
    (C) 馬尼拉是西班牙在十六世紀建立的殖民城市（全國 24% 誤選）✗
    (B) 雅加達（巴達維亞）是荷蘭在十七世紀經營的據點（全國 21% 誤選）✗
    (D) 長崎是日本的港口，不是英國開闢的（全國 11% 誤選）✗
soc110-14:
  key: 轉型觀光工廠是經營者看準機會、整合資源、承擔風險的創新決策 → 發揮企業才能。
  explain: |
    (C) 企業才能是組織土地、勞動、資本等生產要素，並創新、承擔風險的能力；改走觀光工廠路線正是這種創新經營 ✓
    (D) 社會資本指人際網絡與信任，不是題文的重點（全國 22% 誤選）✗
    (B) 人力資本是勞工的知識與技能 ✗
    (A) 題文沒有提到政府 ✗
soc110-15:
  key: 選擇歇業或轉型，要比較放棄的那個選項能帶來多少利益 → 比較兩者的機會成本。
  explain: |
    (D) 做任何選擇都要放棄其他選項；比較歇業與轉型的機會成本，選代價較小的 ✓
    (A)(B)(C) 市場均衡、外部性、智慧財產權都不是在兩個選項間做選擇的依據 ✗
soc113-15:
  key: 「稠山谷瘠、就耕無地」＝人多地少、土地貧瘠；「每歲造舟通異域」＝靠海外貿易謀生。
  explain: |
    (D) 泉州山多田少、人口壓力大，居民轉向海上貿易，宋代泉州因此成為重要的國際貿易港 ✓
    (B) 北宋時期漢人還沒有前往臺灣墾殖，大規模移墾是明末清初以後的事（全國 53% 誤選）✗
    (A) 詩中說的是造船通商，不是漁業 ✗
    (C) 詩中沒有提到手工業與產業升級 ✗
soc110-16:
  key: 政見是「修法」、「立法」→ 小麗是立法委員；立法院有權提出總統、副總統罷免案。
  explain: |
    (B) 立法委員可在立法院提出總統、副總統罷免案，通過後交由全國選舉人投票 ✓
    (A) 提出縣市總預算案的是縣市政府（縣市長），縣市議員只能審議（全國 23% 誤選）✗
    (C) 縣（市）間的事權爭議由中央各該主管機關解決（直轄市與縣市之間才由行政院解決），不是民意代表的職權（全國 18% 誤選）✗
    (D) 總統、副總統彈劾案由立法院提出，交憲法法庭審理，立委不審理 ✗
soc110-17:
  key: 排放權的價格由供需決定；如果廠商自己治汙很便宜，就不需要買排放權 → 需求減少，價格下降。
  explain: |
    (B) 治汙成本比預估低，廠商寧可自己減少排放，對排放權的需求下降，價格跟著下跌 ✓
    (D) 能出售排放權獲利的廠商少，表示市場上賣方少、供給少，價格應該上升，不是下降（全國 35% 誤選）✗
    (A) 首輪拍賣出去的數量少，排放權稀少，價格應上升 ✗
    (C) 題文沒有民眾抗議影響交易的線索 ✗

# ---------- Day 54：臺灣史、經濟學概念、聚落與交通 ----------
soc113-17:
  key: 茶業因 1860 年代開港而發達 → 北部的茶產區（開港後烏龍茶、包種茶大量出口）；唱的是閩南語相褒歌 → 閩南人聚居的文山茶區：新北石碇。
  explain: |
    (A) 石碇屬於文山茶區，開港後茶葉經淡水出口而興盛，居民多為閩南人 ✓
    (D) 阿里山的高山茶是 1980 年代以後才發展的，和開港無關（全國 35% 誤選）✗
    (B) 北埔是客家庄，流行的是客家山歌，不是閩南語相褒歌（全國 23% 誤選）✗
    (C) 杉林溪的高山茶也是近數十年才發展的（全國 12% 誤選）✗
soc110-44:
  key: 大都市球隊用高薪挖走明星，讓其他球隊變弱、比賽失衡，損害整個聯盟 → 對他人造成成本卻不負擔，屬於負的外部性。
  explain: |
    (B) 有錢球隊過度挖角，使聯盟競爭失衡、比賽不精彩，損害其他球隊與聯盟的利益，但這些成本不由挖角的球隊負擔 → 外部性；罰款就是讓它負擔這個成本 ✓
    (C) 增加的是挖角球隊自己的成本，不需要聯盟介入（全國 15% 誤選）✗
    (A) 挖角的球隊本身可能獲利，並非每一隊都受損（全國 14% 誤選）✗
    (D) 轉隊不會降低球員的技能 ✗
soc110-45:
  key: 被罰款的多是紐約、洛杉磯、波士頓、芝加哥等大都市的球隊 → 都市階層高，經濟產值大、企業資金充裕，能出高薪。
  explain: |
    (C) 高階層的大都市生產總值高、企業多，球隊能以高薪吸引球員 ✓
    (A) 通勤時間和吸引球員無關；大都市通勤時間反而較長 ✗
    (B) 大都市的產業以服務業為主，藍領比例不一定較高 ✗
    (D) 土地利用分區和吸引球員無關 ✗
soc113-27:
  key: 胡椒要從印度遠渡重洋運到羅馬，價格昂貴；用精緻的銀罐盛裝，是富有家庭展現財富與地位的方式。
  explain: |
    (B) 胡椒是昂貴的進口香料，銀器也是貴重物品，兩者都能彰顯擁有者的身分 ✓
    (D) 羅馬人用銀罐裝胡椒是為了炫耀財富，不是因為銀很普遍（全國 21% 誤選）✗
    (C) 胡椒的主要價值是調味與珍貴，放入貴重容器並不是重視防腐的寓意（全國 7% 誤選）✗
    (A) 銀器不會和胡椒產生增加香味的化學作用 ✗
soc110-46:
  key: 專利讓廠商獨占、把藥價訂得很高 → 買不起的人退出市場，交易量低於競爭市場，這就是經濟效率降低（無謂損失）。
  explain: |
    (C) 專利保護下藥價偏高，許多患者買不起，交易數量減少，社會總剩餘下降 ✓
    (B) 題目問的是「智慧財產權」本身為何降低效率；大藥廠受損是強制授權的後果，不是原因（全國 41% 誤選）✗
    (A) 多家廠商加入生產是強制授權的做法，反而能增加產量 ✗
    (D) 仲裁資源的消耗不是文中說的效率降低 ✗
soc110-47:
  key: 愛滋病毒感染率最高的地區在非洲南部（南非、波札那、辛巴威、賴索托、史瓦帝尼、莫三比克等）。
  explain: |
    (D) 陰影集中在非洲東南部、南部，正是成人愛滋感染率最高的國家群 ✓
    (A) 範圍包含澳洲、印度、巴西與大部分熱帶非洲，澳洲的愛滋感染率很低，不符合（全國 48% 誤選）✗
    (B) 包含俄羅斯與東南亞等地，不是感染率最高的國家群 ✗
    (C) 包含美國、墨西哥、阿根廷、中東等地，不是感染率最高的國家群 ✗

# ---------- Day 55：世界史、民主政治與媒體、地圖與地理資訊系統 ----------
soc113-33:
  key: 普丁說烏克蘭「原本就屬於俄國」→ 反駁要指出烏克蘭有自己的歷史源頭：九世紀以基輔為中心的基輔羅斯，比莫斯科公國的興起更早。
  explain: |
    (C) 烏克蘭人把基輔羅斯視為自己歷史文化的源頭，表示烏克蘭有獨立的歷史傳承，不是本來就屬於俄國 ✓
    (B) 說烏克蘭是俄國共產主義者創造的，正是支持俄國入侵的說法（全國 8% 誤選）✗
    (A) 說兩國屬同一民族、不可分割，也是俄國的立場（全國 9% 誤選）✗
    (D) 以俄羅斯文化聯合東斯拉夫民族，同樣是俄國的主張（全國 8% 誤選）✗
soc113-34:
  key: 判斷訊息真偽，關鍵是證據能否互相印證：英美媒體指出影像在占領期間就已上傳社群網站、衛星影像也拍到同時同地的屍體 → 佐證充分且符合時序。
  explain: |
    (D) 檢視證據是否充分、時間先後是否合理，才能判斷是誰在說謊：屍體影像早在俄軍占領期間就出現，俄方「烏軍偽造」的說法就不成立 ✓
    (A) 國籍與所有權只能提醒立場可能有偏差，不能直接判斷內容真偽（全國 11% 誤選）✗
    (B) 清晰的影像也可能被偽造，要看能否和其他證據互相印證（全國 9% 誤選）✗
    (C) 知名度與公信力不等於這則報導一定正確（全國 7% 誤選）✗
soc113-35:
  key: 要在影像中數出倒臥路旁的人，解析度必須非常高（公尺以下）；W 衛星解析度 0.3 公尺，重返週期 4.5 天也夠用。
  explain: |
    (B) 解析度 0.3 公尺才能分辨出單一個人的身形，適合計算受害人數 ✓
    (A) 解析度 250 公尺，一個像素就涵蓋大片範圍，根本看不到人（全國 31% 誤選）✗
    (C) 解析度 10 公尺仍無法辨識個人（全國 21% 誤選）✗
    (D) 解析度 30 公尺太粗，重返週期也太長（全國 7% 誤選）✗
soc110-48:
  key: 晴天大家不急著買傘，需求較有彈性 → 降價可以明顯增加購買量；雨天急需，不打折也買得到。
  explain: |
    (B) 價格下降、需求量增加（需求法則），晴天打折可多賣一些，提升獲利 ✓
    (D) 打折是價格變動，影響的是需求量，不是提高市場供給（全國 17% 誤選）✗
    (C) 天氣不確定不是市場失靈（全國 16% 誤選）✗
    (A) 題目說許多店都這樣做，是針對晴雨的需求差異，不是和同業打價格戰 ✗
soc110-49:
  key: 雨天不打折，所以年雨日越多的都市，傘店獲利越好 → 找臺灣年雨日最多的地方：東北部的基隆。
  explain: |
    (B) 北緯 25°07'、東經 121°44' 是基隆，東北季風加上地形，冬季多雨，年雨日全臺最多 ✓
    (C) 北緯 22°38'、東經 120°18' 是高雄，冬季乾燥，年雨日少（全國 26% 誤選）✗
    (A) 東經 119°33' 是澎湖，雨量少 ✗
    (D) 北緯 24°03'、東經 120°25' 是彰化鹿港，冬季位於東北季風的背風側，雨日不多 ✗

# ---------- Day 56：臺灣史、法律原則、民主政治與媒體 ----------
soc113-39:
  key: 日治初期東臺灣開發較晚，人口稀少、還有大片未開墾的土地，總督府容易取得並規劃成大型試驗與栽培農場。
  explain: |
    (B) 東臺灣尚未大規模開發，有廣大且容易取得的荒地，適合設立熱帶栽培業與軍需作物的試驗地 ✓
    (D) 東臺灣多山地與縱谷，平原面積不如西部廣闊（全國 17% 誤選）✗
    (A) 東臺灣人口稀少，勞動力反而不足，總督府還要招募移民（全國 10% 誤選）✗
    (C) 原住民族並不熟悉咖啡、金雞納等外來熱帶作物 ✗
soc110-63:
  key: 法治國原則看的不只是「有沒有依據法令」，還要看法令本身是否保障人權；審查都通過，可能只是創作者先自我設限。
  explain: |
    (D) 創作者為了通過審查而自我審查，表面上禁歌減少，言論自由其實仍受限制 ✓
    (A) 依據戒嚴法與行政命令限制言論自由，限制過度且違反法律保留，不能只看有依據就說符合法治國（全國 32% 誤選）✗
    (C) 只是主管機關換人，審查制度仍在，談不上轉向人權保障（全國 12% 誤選）✗
    (B) 歌曲本身沒有違法，改用罰款一樣是不當限制言論自由（全國 8% 誤選）✗
soc110-64:
  key: 憲政主義的核心：政府權力要受限制，目的是保障人民的自由與尊嚴；經濟成就不能拿來換取人民的自由。
  explain: |
    (C) 樂評的意思是：經濟再好，不保障自由的政府仍不是好政府；保障自由、維護人性尊嚴才是良善的政府 ✓
    (D) 憲政國家在必要時仍可依法律限制自由（例如比例原則），說法太絕對（全國 32% 誤選）✗
    (B) 推動經濟成長不等於威權，說法以偏概全（全國 21% 誤選）✗
    (A) 樂評批判的是用經濟成果掩蓋威權統治，不是生活品質（全國 13% 誤選）✗
soc110-65:
  key: 用流行音樂帶動反抗、叛逆、迷惘的時代精神 → 1960 年代美國的搖滾與民謠，和反越戰、反文化運動結合。
  explain: |
    (C) 1960 年代反越戰運動中，搖滾樂與抗議歌曲成為青年反抗的象徵 ✓
    (D) 1990 年代臺灣已經解嚴、民主化，反共也不是對現狀的反抗（全國 26% 誤選）✗
    (B) 1940 年代戰時推行皇民化，臺語歌受壓制，無法公開抗議戰爭（全國 16% 誤選）✗
    (A) 1910 年代沒有這樣的流行音樂風潮（全國 14% 誤選）✗
soc110-66:
  key: 1930 年代的音樂廳在大稻埕、西門町等最熱鬧的商業區 → 圖 9 中最靠近淡水河、建成區最密的核心丁。
  explain: |
    (D) 丁靠近淡水河，是發展最早、建成區最密集的商業核心，音樂廳等娛樂場所多集中在這裡 ✓
    (C) 丙在圓環與鐵道之間，是向外擴張的區域，商業不如丁集中（全國 30% 誤選）✗
    (B) 乙在鐵道外側，多為機關、宿舍與零星建物（全國 14% 誤選）✗
    (A) 甲在水圳外，是水稻田與郊區 ✗

