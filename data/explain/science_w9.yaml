# ---------- Day 57：演化與分類、大氣與氣象、力學與運動 ----------
sci110-45:
  key: 丙是樟、榕、楠、楓香組成的低海拔闊葉林，物種多、數量平均 → 生物多樣性最高。
  explain: |
    依優勢植物判斷：甲有紅檜、扁柏、鐵杉 → 中高海拔的針闊葉混合林（檜木林）；乙以臺灣冷杉、玉山箭竹為主 → 高海拔的冷杉林；丙有雀榕、樟樹、楓香、大葉楠 → 低海拔闊葉林。
    (E) 丙是闊葉林，物種最多、各物種數量也最平均，多樣性最高 ✓
    (C) 乙是冷杉林；臺灣海拔最高的是更上方的高山寒原（玉山圓柏灌叢、高山草原）（全國 54% 誤選）✗
    (A) 針闊葉混合林在其他溫帶山區也有，不是臺灣特有（全國 8% 誤選）✗
    (B) 圖中看不出人為干擾 ✗　(D) 丙是低海拔的闊葉林，不在 1800～2000 公尺 ✗
sci110-21:
  key: 05 時颱風剛在東岸登陸 → 東半部雨多（乙）；11 時中心在山區 → 全島大雨（丙）；17 時出海到臺灣海峽 → 西南部雨多（甲）。
  explain: |
    颱風中心的位置決定迎風面：
    05 時中心在東南部海岸 → 東部、山區雨量最大 → 乙
    11 時中心越過中央山脈 → 雨區擴大到全島，南部尤其多 → 丙
    17 時中心移到臺灣海峽 → 西南氣流帶來西南部豪雨 → 甲
    (D) 乙丙甲 ✓
    (E) 丙乙甲（全國 23% 誤選）：把 05 時和 11 時的情形對調了。
sci110-60:
  key: 繩子不可伸長 → $a_1=a_2=a$；吊桶：$M_2g-T=M_2a$；整體：$M_2g-f=(M_1+M_2)a$。
  explain: |
    木塊和吊桶用同一條不伸長的繩子相連，加速度大小相同。
    (C) 對吊桶：$M_2g-T=M_2a_2$ ⇒ $a_2=\dfrac{M_2g-T}{M_2}$ ✓
    (E) 把木塊和吊桶看成一個系統，外力是吊桶的重力 $M_2g$ 和摩擦力 f：$a_1=\dfrac{M_2g-f}{M_1+M_2}$ ✓
    (B) 忘了扣摩擦力 f（全國 40% 誤選）✗
    (D) 推動的是整個系統，分母要是 $M_1+M_2$（全國 36% 誤選）✗
    (A) 吊桶受繩子向上的拉力，不是自由落體 ✗
sci110-61:
  key: 功能定理：木塊所受合力 $(T-f)$ 作功 $=K_1$；整個系統 $M_2g$ 作正功、f 作負功 ⇒ $K_1+K_2=(M_2g-f)s$。
  explain: |
    (A) 木塊水平方向受 T（向左）和 f（向右），合力作功 $(T-f)s$＝動能增加量 $K_1$ ✓
    (D) 整個系統：重力對吊桶作功 $M_2gs$，摩擦力作功 $-fs$；繩子的張力是內力，對木塊作正功、對吊桶作負功，互相抵銷 → $K_1+K_2=(M_2g-f)s$ ✓
    (C) 吊桶受 $M_2g$ 向下、T 向上，$K_2=(M_2g-T)s$（全國 38% 誤選）✗
    (B) 木塊的動能和 $M_2g$ 無關（全國 33% 誤選）✗
    (E) 張力是內力，不必再扣（全國 26% 誤選）✗
sci110-46:
  key: 能量沿食物鏈每升一級約只傳下 10%～20%，80%～90% 經呼吸作用、分解作用以熱能散失。
  explain: |
    (B) 生物呼吸作用產生的熱、分解者分解遺骸，能量最後都以熱散失 ✓
    (C) 呼吸作用與分解作用造成能量流失 ✓
    (D) 每提高一個營養階層，約有 80%～90% 的能量流失 ✓
    (A) 營養階層高的生物不一定體型大，例如寄生蟲（全國 17% 誤選）✗
    (E) 圖是「生物量」塔，流失的是能量；個體數不一定依比例減少（全國 17% 誤選）✗

# ---------- Day 58：海洋、生物技術與實驗、科學探究與實作 ----------
sci110-22:
  key: 下午太陽偏西，臺東海岸被中央山脈遮住陽光；7/13 前後是大潮，低潮時潮間帶露出得多 → 7/13 下午 3 時最好。
  explain: |
    兩個條件：(1) 避免日曬：臺東在山脈東側，下午太陽西斜，陽光被山脈擋住；上午太陽在東邊海面上，直射海岸。(2) 安全：要在低潮時進入潮間帶，而且潮差大時露出的範圍最大。
    (E) 7/13 下午 3 時：潮差大的大潮期間，又避開上午的直射陽光 ✓
    (A)(C)(D) 都是上午 10 時，太陽從東方海面直射海岸，容易中暑 ✗（(A) 全國 18% 誤選）
    (B) 7/7 前後潮差小，潮間帶露出的範圍有限（全國 19% 誤選）✗
sci110-47:
  key: 雜交選育是傳統育種，利用有性生殖讓遺傳因子重新組合，和孟德爾的豌豆雜交原理相同。
  explain: |
    (D) 孟德爾的豌豆試交實驗也是靠交配讓性狀重新組合，原理相同 ✓
    (A) 抗蟲玉米是用轉殖技術把外來基因直接送入生物體（全國 11% 誤選）✗
    (E) 殖入生長激素基因的鮭魚也是基因轉殖 ✗
    (B) 桃莉羊是複製技術（無性生殖）✗　(C) 組織培養也是無性繁殖 ✗
sci110-23:
  key: 驗孕要找「只有懷孕才會有、又驗得到」的東西：胎盤才會分泌（未懷孕沒有胎盤）＋會出現在尿液中。
  explain: |
    (A) 只有懷孕形成胎盤後才會分泌這種激素，所以有它就表示懷孕 ✓
    (E) 它會出現在尿液中，驗孕筆才驗得到 ✓
    (B)(C)(D) 維持動情素、黃體激素分泌與子宮內膜增厚，是這種激素的「功能」，不能拿來判斷是否懷孕（(B) 全國 15% 誤選、(C) 35%、(D) 42%）✗
sci110-35:
  key: 1989–2009 年豐水年 3144→3322→3568 越來越多；年雨量增加、降雨時數減少 → 豐水年的降雨強度越來越高。
  explain: |
    由圖讀出 1989–2009 年：豐水年 1990（3144）、1998（3322）、2005（3568）；枯水年 1993（1645）、2002（1572）。
    (A) 豐水年的年雨量越來越多 ✓
    (D) 降雨強度＝雨量÷時數：豐水年雨量增加、降雨時數又減少 → 強度越來越高 ✓
    (B) 枯水年由 1645 降到 1572，是越來越少（全國 13% 誤選）✗
    (C) 枯水年雨量和時數都減少，無法確定強度是升還是降（全國 30% 誤選）✗
    (E) 1949–1989 的 40 年間有 4 個豐枯水年，1989–2009 的 20 年間就有 5 個，頻率明顯增加（全國 15% 誤選）✗
sci110-36:
  key: 海流的成因：盛行風吹拂海面（風吹流）＋海水溫度、鹽度不同造成密度差（溫鹽環流）。
  explain: |
    (A) 盛行風吹動表層海水，形成表面海流 ✓
    (E) 海水密度不同（溫度、鹽度造成）驅動深層的溫鹽環流 ✓
    (D) 地球自轉產生的科氏力只會讓海流的方向偏轉，不是海流的成因（全國 45% 誤選）✗
    (B) 日、月引力造成的是潮汐，海水週期性漲落，不是固定流向的海流（全國 35% 誤選）✗
    (C) 海底地震可能引起海嘯，不是持續的海流 ✗

# ---------- Day 59：大氣與氣象、力學與運動、化學計量與熱化學 ----------
sci110-37:
  key: 空氣中最多的是氮氣（約 78%），氧氣只約 21%。
  explain: |
    吸進的就是大氣，成分以氮氣最多。
    (C) 氮氣 ✓
    (A) 氧氣約占 21%，不是最主要的成分（全國 26% 誤選）✗
sci110-39:
  key: 靜止休息、體溫不變時的代謝率就是基礎代謝率：$1.0\ \text{W/kg}\times50\ \text{kg}=50$ W，代謝率定義為 $-\Delta U/\Delta t$。
  explain: |
    題文把 $-\Delta U/\Delta t$ 定義為代謝率；靜止休息時的代謝率就是基礎代謝率，每公斤約 1.0 瓦特。
    50 公斤 → $\left|\dfrac{-\Delta U}{\Delta t}\right|=50$ 瓦特 (C) ✓
    (A) 靜止躺著沒有對外作功，$\Delta W=0$（全國 8% 誤選）✗
    (B)(D)(E) 瓦特是功率（每秒的能量），$\Delta W$、$\Delta U$、$\Delta Q$ 是能量，不能用瓦特表示 ✗
sci110-40:
  key: 2 小時消耗 $50\ \text{W}\times7200\ \text{s}=360000\ \text{J}=360$ kJ；每克葡萄糖 16 kJ → $360\div16=22.5$ g。
  explain: |
    能量＝功率×時間＝$50\times2\times3600=360000$ J＝360 kJ
    需要的葡萄糖＝$360\div16=22.5$ 公克 (B) ✓
    (C) 62.5（全國 19% 誤選）：時間或單位換算錯誤。
    (D) 360（全國 11% 誤選）：是能量的千焦耳數，還沒除以每克 16 kJ。
sci110-62:
  key: 煤層在甲點出露、向東傾斜 45°；往西走 100 公尺，煤層就升高 $100\times\tan45^\circ=100$ 公尺 → 要往上挖。
  explain: |
    煤層走向南北、向東傾斜 45°，在甲點附近的西側山腳出露。
    煤層向東越來越深，反過來說，向西就越來越高：水平往西 100 公尺，煤層高度上升 $100\times\tan45^\circ=100$ 公尺。
    所以在乙點，煤層在頭頂上方約 100 公尺 → (A) 往上挖 100 公尺 ✓
    (B) 往下挖（全國 26% 誤選）：方向弄反了，煤層是往「東」傾斜變深。
    (C)(D) 走向是南北，沿南北方向挖，高度不會改變 ✗
sci110-63:
  key: $m-M=5\log d-5$：$m-M$ 越大，距離越遠；戊的 $m-M=4.2-5.3=-1.1$ 最大。
  explain: |
    計算 $m-M$：甲 $-3.3$、乙 $-2.8$、丙 $-2.9$、丁 $-2.2$、戊 $-1.1$。
    $m-M$ 越大，$\log d$ 越大，距離越遠 → 戊最遠 (E) ✓
    (A) 甲（全國 34% 誤選）：甲的視星等最大（看起來最暗），但它本身也很暗（絕對星等 12.8），其實離我們最近。
sci110-64:
  key: 光譜型依溫度由高到低是 O、B、A、F、G、K、M；乙是 A 型，溫度最高。
  explain: |
    光譜型 O→B→A→F→G→K→M，表面溫度由高到低。
    甲、丁 M 型，丙 K 型，戊 G 型，乙 A 型 → 乙最熱 (B) ✓
    (A) 甲（全國 18% 誤選）：M 型是溫度最低的紅色恆星。

# ---------- Day 60：海洋、天文、地質與地球歷史 ----------
sci110-65:
  key: 南太平洋的副熱帶環流把表層海水往中心推，形成「高水位」；大洋西側海流較快 → 坡度較陡 → 高水位中心偏西。
  explain: |
    副熱帶海域的環流使表層海水向中心匯聚，海面中央較高 → 要選「高水位」的圖。
    題目說大洋西側的海流較快，而高度梯度越大流速越快 → 西側等高線較密 → 高水位中心偏向西側 (A) ✓
    (B) 高水位中心偏東，東側等高線較密（全國 22% 誤選）✗
    (D)(E) 中央是低水位 ✗（(D) 全國 16% 誤選）
sci110-66:
  key: 高溫恆星藍光比例高、低溫恆星紅光比例高；比較同一顆星在藍、紅兩張影像中的亮度，就能找出藍色高溫恆星。
  explain: |
    單看一張影像，星星亮可能是因為本身亮或距離近；但比較同一顆星在「藍、紅」兩張影像中的亮度比，就能知道它偏藍還是偏紅，也就是表面溫度的高低。
    (C) 藍色影像中相對較亮的是高溫恆星 ✓
    (D) 只看藍色影像，暗的星可能只是距離遠，無法判斷是低溫恆星（全國 26% 誤選）✗
    (B) 顏色只反映溫度，無法判斷距離（全國 15% 誤選）✗
    (E) 紅色影像中紅色恆星相對較亮，但遠方的紅星仍可能很暗（全國 13% 誤選）✗
    (A) 顏色不能直接判斷年齡 ✗
sci110-67: 
  key: 沒有變動 → 下面的岩層較老：礫岩（最早）→ 砂岩 → 頁岩（最晚），顆粒越來越細 → 水流越來越慢。
  explain: |
    依疊置定律，最下面的礫岩最早沉積，最上面的頁岩最晚。
    礫石要水流很快才搬得動，泥（頁岩）在水流很慢的環境才能沉積 → 越晚期水流越慢 (B) ✓
    (E) 砂岩、頁岩是另外沉積的碎屑，不是礫岩在原地風化而成（全國 27% 誤選）✗
    (A) 顆粒變細通常表示離岸更遠、水更深更靜，不是水變淺（全國 15% 誤選）✗
    (C)(D) 題目沒有火山、斷層的線索，而且沒有經過變動 ✗
sci110-68:
  key: 星期一每升高 1 km 降溫 15°C（比乾絕熱的 10°C/km 還快）→ 很不穩定、易對流；星期二氣溫隨高度上升（逆溫）→ 很穩定、汙染物不易擴散。
  explain: |
    判斷穩定度：周圍空氣隨高度降溫越快，上升的空氣塊越容易比周圍暖，就會一直上升 → 不穩定。
    (A) 星期一地面 30°C、1 km 處 15°C，每公里降 15°C，大於乾絕熱減溫率（約 10°C/km）→ 不穩定，容易對流 ✓
    (D) 星期二是逆溫層（越高越暖），空氣不易上升，汙染物積在近地面 → 容易空氣汙染 ✓
    (B) 星期二很穩定，不容易發展出旺盛的對流雲（全國 48% 誤選）✗
    (C) 星期一不穩定，容易有垂直發展的雲（全國 42% 誤選）✗
    (E) 兩天穩定度相反，雲的發展不同 ✗

