# 自然 Day 29–35 解析（Claude 撰寫；已對照原卷圖。答案皆為大考中心公布答案；老師審閱後可修改）
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。
# 110 年是舊課綱試卷，超出 108 課綱必修範圍的題目已在 science_tags.yaml 標為範圍外，不排入練習。

# ---------- Day 29：演化與分類、天文、近代物理與基本交互作用 ----------
sci111-27:
  key: 天擇作用在突變產生的性狀上：有利的保留、有害的淘汰；DNA 若發生趨同，會讓人誤判親緣關係。
  explain: |
    (B) 突變產生的有利性狀，經天擇被保留下來 ✓
    (C) 大部分有害的突變，會因個體較難存活或繁殖而被淘汰 ✓
    (E) 不同物種的 DNA 序列若因趨同演化而變得相似，會讓人誤以為親緣很近，較難推論長時間的演化 ✓
    (D) 現代遺傳學補充、支持了達爾文的演化論，不是取代它（全國 26% 誤選）✗
    (A) 天擇正是作用在 DNA 改變所產生的性狀上（全國 11% 誤選）✗
sci111-33:
  key: 春分：太陽在黃道和天球赤道的交點（雙魚座，丁）→ 夏至：最北點（雙子座，丙）→ 秋分：另一交點（室女座，乙）→ 冬至：最南點（人馬座，甲）。
  explain: |
    太陽在黃道上每年繞一圈。二分點是黃道和天球赤道的交點，二至點是黃道最北、最南的位置。
    春分在雙魚座附近的交點（丁）→ 夏至在最北的雙子座附近（丙）→ 秋分在室女座附近的交點（乙）→ 冬至在最南的人馬座附近（甲）。
    (D) 丁→丙→乙→甲 ✓
    (B) 乙→丙→丁→甲（全國 16% 誤選）(C) 甲→丁→丙→乙（全國 14% 誤選）：把春分、冬至的位置弄錯。
sci112-28:
  key: 預測光是電磁波的是馬克士威（赫茲是用實驗證實）；首先提出能量量子化的是普朗克（愛因斯坦用光子解釋光電效應）。
  explain: |
    甲：湯姆森以陰極射線實驗發現電子 → 正確
    乙：拉塞福由 α 粒子散射實驗提出有核原子模型 → 正確
    丙：厄斯特發現電流會產生磁場 → 正確
    丁：首先「推論」光是電磁波的是馬克士威，赫茲是用實驗證實電磁波存在 → 錯誤
    戊：法拉第首先由實驗發現電磁感應 → 正確
    己：首先提出能量量子化的是普朗克 → 錯誤
    (D) 甲乙丙戊 ✓
    (E) 甲乙丁己（全國 11% 誤選）✗
sci111-17:
  key: 由質子數認元素：a 碳、b 氟、c 鈉、d 磷、e 硫-32、f 硫-34、g 氯、h 鈣。
  explain: |
    (A) 碳和氟同在第二週期，原子序越大半徑越小 → 碳比氟大 ✓
    (E) e、f 都是硫（16 個質子）；e 有 32－16＝16 個中子，f 有 34－16＝18 個 ✓
    (B) d（15）與 e（16）質子數不同，是不同元素，不是同位素（全國 22% 誤選）✗
    (D) 鈣有 2 個價電子，硫有 6 個 → h 比 f 少（全國 22% 誤選）✗
    (C) 鈉的氧化物溶於水呈強鹼性，磷的氧化物溶於水呈酸性 → c 比 d 鹼（全國 18% 誤選）✗
sci111-46:
  key: RNA 核苷酸＝磷酸基（甲）＋核糖（乙）＋含氮鹼基（丙：A、U、C、G）。
  explain: |
    (A) 甲接在五碳糖上，是磷酸基 ✓
    (C) RNA 的鹼基有 A、U、C、G，丙可能是胞嘧啶 ✓
    (D) 丙也可能是鳥糞嘌呤 ✓
    (B) RNA 的五碳糖是「核糖」，去氧核糖在 DNA 中（全國 28% 誤選）✗
    (E) 尿嘧啶（U）正是 RNA 特有的鹼基（全國 21% 誤選）✗
sci111-47:
  key: 三域分類系統以細胞為基礎，病毒沒有細胞構造，所以沒有被列入；冠狀病毒基因重組頻繁，不易用同源構造推演化。
  explain: |
    (C) 病毒沒有細胞構造，無法放進以細胞特徵分類的三域系統 ✓
    (D) 基因重組頻繁，序列變化很大，較難用同源構造（相同來源的序列）重建演化關係 ✓
    (B) 有些病毒（如 DNA 病毒）也有 DNA，一樣沒被列入；關鍵是沒有細胞構造（全國 29% 誤選）✗
    (E) 病毒有自己的命名規則，不用二名法不是沒被納入的原因（全國 16% 誤選）✗
    (A) 很多細菌也小於幾微米，大小不是分類標準（全國 7% 誤選）✗

# ---------- Day 30：大氣與氣象、力學與運動、化學與生活、環境 ----------
sci111-34:
  key: 甲是鋒面（冷暖氣團交會）的長條雲帶，乙是颱風；臺灣同時受兩者影響（共伴效應），東北部要防豪雨。
  explain: |
    (B) 乙有螺旋狀雲系和中心，是颱風（或熱帶低壓）✓
    (C) 臺灣位在鋒面雲帶南端，又在颱風外圍環流中，同時受兩個系統影響 ✓
    (E) 東北季風與颱風環流共伴，臺灣東北部（迎風面）容易下豪雨 ✓
    (A) 長帶狀的雲是冷、暖氣團交會的鋒面造成，不是黑潮（全國 34% 誤選）✗
    (D) 颱風是熱帶海洋上的低壓系統，不是冷暖氣團交會形成（全國 15% 誤選）✗
sci112-29:
  key: 負壓病房氣壓比外面低，空氣只會往內流；冰枕靠接觸傳導降溫；額溫槍接收額頭發出的紅外線（電磁波）。
  explain: |
    (A) 病房內氣壓較低，空氣由外往內流，病毒不易隨空氣外洩 ✓
    (D) 冰枕和額頭直接接觸，熱以傳導方式由額頭傳到冰枕 ✓
    (E) 額溫槍偵測額頭發出的紅外線，是以輻射（電磁波）傳遞 ✓
    (C) 人體溫度約 37°C，通常高於環境溫度，會持續散熱，並不和環境處於熱平衡（全國 35% 誤選）✗
    (B) 若病房內氣壓較高，空氣反而會往外洩（全國 13% 誤選）✗
sci111-18:
  key: 酵素多是蛋白質（胺基酸的聚合物）；胃蛋白酶在強酸（pH 約 2）時最有活性，吃大量制酸劑會降低它的催化能力。
  explain: |
    (A) 大多數酵素是蛋白質，由胺基酸聚合而成 ✓
    (D) 制酸劑中和胃酸、使 pH 上升，偏離胃蛋白酶的最適 pH → 催化能力下降 ✓
    (B) 胃蛋白酶在胃的強酸環境（pH 約 2）活性最佳，不是 pH 7.4（全國 13% 誤選）✗
    (C) 溫度太高，酵素會變性失去活性（全國 12% 誤選）✗
    (E) 酵素有專一性，胃蛋白酶只分解蛋白質（全國 18% 誤選）✗
sci112-10:
  key: 要證明「2b 有助 CMV 存活」→ 看病毒量：有 2b 的 CMV 病毒量高，失去 2b 的病毒量低。
  explain: |
    題目問的是病毒本身能不能在植物體內存活，要比較「病毒量」。
    (D) 未感染（H）幾乎沒有病毒；正常 CMV 病毒量很高；失去 2b 的 CMV 病毒量明顯較低 → 2b 幫助病毒存活 ✓
    (A) 比較的是蚜蟲產子數，只能說明 2b 對蚜蟲有利（全國 16% 誤選）✗
    (E) 有沒有 2b，病毒量都很高，反而表示 2b 和病毒存活無關（全國 14% 誤選）✗
    (B)(C) 也都是蚜蟲產子數 ✗
sci112-11:
  key: 只有 CMV 才有的東西才有專一性：CMV 的 RNA（基因）和它製造的蛋白質。
  explain: |
    (B) CMV 的 RNA 是這種病毒特有的遺傳物質 ✓
    (C) CMV 的蛋白質由它的基因製造，也具專一性 ✓
    (A) 病毒沒有核糖體，要借用宿主的核糖體（全國 22% 誤選）✗
    (D) 植物也可能因其他原因釋放氣味（全國 24% 誤選）✗
    (E) 蚜蟲多不一定是 CMV 造成的（全國 13% 誤選）✗

# ---------- Day 31：海洋、波動與光 ----------
sci111-36:
  key: 設黑潮水 x、河水 y：$33x+1\cdot y=25(x+y)$ ⇒ $8x=24y$ ⇒ $x:y=3:1$。
  explain: |
    鹽度是每 1000 g 水中鹽的克數，混合時鹽的總量守恆。
    $33x+1\times y=25(x+y)$ ⇒ $8x=24y$ ⇒ $x:y=3:1$ (A) ✓
    (B) 2:3（全國 18% 誤選）(D) 3:2（全國 13% 誤選）：比例列式錯誤。
sci112-30:
  key: 要產生明顯的干涉，波長要和原子層的間距差不多；原子間距約 $10^{-10}$ m（1 埃）。
  explain: |
    路徑差 2L 和 d 同一數量級，干涉要明顯，X 光的波長必須和原子層間距相近。原子的大小約 $10^{-10}$ m。
    (C) $10^{-10}$ ✓
    (B) $10^{-7}$ m 是可見光、紫外光的數量級，比原子間距大太多（全國 28% 誤選）✗
sci112-31:
  key: 暗紋處兩道光一個波峰、一個波谷互相抵銷；原子、電子等粒子也有波動性，同樣會出現雙狹縫干涉。
  explain: |
    (C) 暗紋是破壞性干涉：一道光的波峰和另一道光的波谷同時抵達 ✓
    (D) 物質波：原子在適當縫距下也會產生干涉 ✓
    (A) 亮紋處是波峰遇波峰、也有波谷遇波谷（建設性干涉），不是只有波峰（全國 20% 誤選）✗
    (B) 暗紋處是波峰遇波谷，不是只有波谷（全國 17% 誤選）✗
    (E) 電子雙狹縫實驗就觀察到干涉條紋（全國 9% 誤選）✗

# ---------- Day 32：化學與生活、環境、大氣與氣象、化學計量與熱化學 ----------
sci111-37:
  key: 油母質的碳隨時間被二鉻酸（氧化劑）大量消耗，木炭幾乎不變 → 油母質較易反應（被氧化）；三種濃度下木炭的殘留量都差不多。
  explain: |
    (C) 同樣條件下，油母質的碳殘留比例降得很低，木炭維持約 85% → 油母質較容易和二鉻酸反應 ✓
    (E) 木炭圖中三種濃度的數據幾乎重疊 → 濃度不同，殘留量沒有明顯差異 ✓
    (D) 二鉻酸是氧化劑，油母質的碳是被「氧化」，不是被還原（全國 26% 誤選）✗
    (B) 實驗沒有提供顆粒大小的資料（全國 18% 誤選）✗
    (A) 也無法由此判斷分子量（全國 9% 誤選）✗
sci111-39:
  key: 黑碳對氣溫的影響＝大氣中黑碳的總量 × 每單位黑碳吸收的太陽輻射。
  explain: |
    (A) 影響氣溫的是懸浮在大氣中的黑碳，要知道總量 ✓
    (D) 每單位重量的黑碳能吸收多少太陽輻射，決定它加熱大氣的能力 ✓
    (E) 只算家庭烹調與暖氣排放的量，漏掉其他來源（全國 17% 誤選）✗
    (C) 分子量和吸收太陽輻射的能力沒有直接關係（全國 13% 誤選）✗
    (B) 沉積在地殼中的黑碳不在大氣中，不影響氣溫（全國 8% 誤選）✗
sci111-41:
  key: 把黑碳完全燃燒成 CO₂，先用過氯酸鎂吸水、再用氫氧化鈉吸收 CO₂，稱 NaOH 增加的質量 → 換算碳量。
  explain: |
    (D) 燃燒產生 CO₂ 和 H₂O；過氯酸鎂先吸收水，氫氧化鈉再吸收 CO₂。NaOH 增加的質量就是 CO₂ 的質量，乘以 $\dfrac{12}{44}$ 就是碳的質量 ✓（順序不能顛倒，否則 NaOH 也會吸到水）
    (C) CO₂ 會溶於水，用排水集氣法收集不準確（全國 19% 誤選）✗
    (A)(B) 樣品中還有其他不燃的物質（土壤礦物），直接秤重不等於黑碳的量（(B) 全國 15% 誤選）✗
    (E) 碳和氫氣不容易直接反應生成甲烷 ✗
sci111-42:
  key: 火山噴發釋放 CO₂、植物光合作用吸收也呼吸釋放 CO₂；人類燃燒化石燃料打破了碳循環的平衡。
  explain: |
    (A) 火山噴發把岩石圈中的碳以 CO₂ 釋放到大氣 ✓
    (B) 植物行光合作用吸收 CO₂，也行呼吸作用釋放 CO₂ ✓
    (E) 化石燃料把長期封存的碳快速釋放到大氣中，使大氣 CO₂ 濃度上升 ✓
    (D) 早期地球大氣以 CO₂ 為主，後來被海洋吸收、形成岩石、被生物利用，比例已大幅下降（全國 16% 誤選）✗
    (C) 海水溶解 CO₂ 的量有限，而且會造成海洋酸化（全國 13% 誤選）✗
sci112-12:
  key: 每個細胞有很多粒線體 DNA，比核 DNA 容易取得；古 DNA 早已斷裂，難取得連續序列；學名不同就是不同物種。
  explain: |
    (A) 一個細胞內有大量粒線體，粒線體 DNA 的拷貝數遠多於核 DNA，較容易從化石中取得 ✓
    (B) 尼安德塔人的 DNA 經過數萬年已降解成碎片，要取得長而連續的序列比現代人困難得多 ✓
    (C) 學名用二名法，種名不同（denisova 與 sapiens）表示是不同物種 ✓
    (E) 侏羅紀（約 2 億年前）根本還沒有人類，DNA 也無法保存那麼久（全國 36% 誤選）✗
    (D) 核基因體的證據是補充、修正粒線體 DNA 的推論，並沒有徹底否定（全國 32% 誤選）✗

# ---------- Day 33：地質與地球歷史、波動與光、化學與生活、環境 ----------
sci111-43:
  key: 海蝕凹壁是波浪侵蝕、風化後碎屑被搬走，再由地震抬升離開海面；過程中沒有高溫高壓的變質作用。
  explain: |
    凹壁形成：岩石經風化、被潮水侵蝕，碎屑被海水搬運帶走；之後地震把它瞬間抬升到海面上。
    (C) 變質作用需要高溫高壓，和海蝕凹壁的形成無關 ✓
    (B) 搬運作用（全國 18% 誤選）：侵蝕下來的碎屑要被海水帶走，凹壁才會形成。
sci111-44:
  key: 碳-14 有放射性，用來測「絕對」年代；它衰變是指數衰減，半衰期 5730 年，適合數萬年以內的樣品。
  explain: |
    (A) 放射性定年得到的是絕對年代 ✓
    (B) 碳-14 會進行 β 衰變，具放射性 ✓
    (D) 每經過一個半衰期剩一半，是指數衰減，不是線性（全國 42% 誤選）✗
    (C) 經過約十個半衰期（約 5 萬多年）後，碳-14 已少到難以測量，不適合十萬年以上的事件（全國 20% 誤選）✗
    (E) 碳的原子序是 6：碳-14 有 6 個質子、8 個中子（全國 18% 誤選）✗
sci112-32:
  key: 紅血球往右流：遠離左上方的發射器 E，收到的頻率先變低；再把聲波反射給左下方的 R₂，紅血球又遠離 R₂ → $f_2<f$。
  explain: |
    都卜勒效應分兩段看：先把紅血球當「接收者」，再把它當「發射者」。
    第一段：紅血球往右移，遠離左上方的 E → 紅血球接收到的頻率低於 f。
    第二段：紅血球反射聲波；對左下方的 R₂ 而言，紅血球也在遠離 → 頻率再降低 → $f_2<f$ (B) ✓
    R₁ 在右上方，紅血球朝它接近，第二段頻率升高，所以 $f_1>f_2$。
    (A) $f_1=f_2$（全國 19% 誤選）✗　(D) $f_1<f_2$（全國 13% 誤選）✗
sci111-55:
  key: 溶液一 480→約 85 ppb、溶液二 190→約 35 ppb，移除率都約 80%；溶液二低於 50 ppb，同時符合兩個標準。
  explain: |
    (A) 移除率：溶液一 $\dfrac{480-85}{480}\approx82\%$，溶液二 $\dfrac{190-35}{190}\approx82\%$，都高於 70% ✓
    (D) 溶液二處理後約 35 ppb，低於 WHO 的 50 ppb 和 EPA 的 100 ppb ✓
    (E) 實驗比較的是加入 MOF 前後六價鉻濃度的變化，就是在測試吸附能力 ✓
    (C) 溶液一處理後約 85 ppb，高於 WHO 的 50 ppb（全國 24% 誤選）✗
    (B) 移除率約 80%，不是低於 30%（全國 20% 誤選）✗
sci111-56:
  key: 操縱變因是吸附材料的種類，其他條件（如初始濃度）要相同；聚合物單獨幾乎不吸附，MOF@聚合物吸附效果反而最好。
  explain: |
    (A) 實驗改變的是吸附材料（MOF、MOF@聚合物、聚合物）→ 操縱變因 ✓
    (B) 要公平比較，三組要用相同初始濃度的六價鉻 ✓
    (E) 單用聚合物，濃度幾乎沒有下降 ✓
    (C) 聚合物組是對照：證明 MOF@聚合物的吸附能力來自 MOF，而不是聚合物，剔除會影響解讀（全國 27% 誤選）✗
    (D) MOF@聚合物處理後濃度最低（約 0.5 ppm），吸附能力沒有變差（全國 26% 誤選）✗

# ---------- Day 34：細胞與細胞分裂、大氣與氣象、力學與運動 ----------
sci112-13:
  key: 保衛細胞在葉片的表皮；把葉片用手指折斷撕開，就能撕下一層薄薄的表皮，直接觀察保衛細胞。
  explain: |
    (B) 石蓮的葉片肥厚，用手指折撕可以撕下透明的下表皮，保衛細胞清楚可見 ✓
    (D) 用牙籤塗抹適合口腔皮膜這類鬆散的細胞，葉片會變成一團碎塊（全國 30% 誤選）✗
    (A) 徒手切片不易切得夠薄，也不容易剛好切到表皮（全國 25% 誤選）✗
    (C) 壓散會破壞組織排列，看不出保衛細胞的形態 ✗
    (E) 葉片太厚，光線無法穿透 ✗
sci112-01:
  key: 颱風逆時針旋轉；中心在東方時，兩地都位於颱風西側 → 吹北風；中心往西北移過去後，兩地位於颱風東南側或東側 → 吹南風。
  explain: |
    北半球颱風的環流是逆時針：中心的西側吹北風，東側吹南風。
    颱風從東方往西北移動、穿過兩地之間：靠近時兩地都在中心西方 → 北風；通過後中心跑到兩地的西北、西方 → 兩地都在中心的東側 → 南風。
    (A) 基隆由北風轉南風 ✓
    (B) 彭佳嶼由北風轉南風 ✓（兩地轉變的經過不同：彭佳嶼在路徑北側，風向經由東風轉；基隆在南側，經由西風轉）
    (C)(D) 方向相反 ✗（(C) 全國 31% 誤選、(D) 33%）
    (E) 颱風通過前後，基隆的風向會改變 ✗
sci112-33:
  key: 終端速率時 $\alpha v^\beta=mg$：質量 1：4：9 對應速率 1：2：3 → $m\propto v^2$ → $\beta=2$。
  explain: |
    速率穩定時，阻力與浮力的合力等於重力：$\alpha v^\beta=mg$，所以 $m\propto v^\beta$。
    質量比 1：4：9，終端速率比 1：2：3 → $4=2^\beta$、$9=3^\beta$ ⇒ $\beta=2$ (E) ✓
    (C) $\beta=\dfrac12$（全國 30% 誤選）：把關係倒過來，寫成 $v\propto m^2$ 了。
    (D) $\beta=1$（全國 16% 誤選）：阻力和速率成正比時，速率比應為 1：4：9。
sci112-19:
  key: 指示劑本身是弱酸或弱鹼，會和 H⁺ 或 OH⁻ 反應，酸型、鹼型的結構不同所以顏色不同。
  explain: |
    (A) 指示劑在不同 pH 下以酸型或鹼型存在，顏色改變正是它和酸、鹼反應的結果 ✓
    (D) 變色範圍約 2 個 pH 單位，代表氫離子濃度相差約 100 倍，不是 2 倍（全國 15% 誤選）✗
    (C) 等莫耳的鹽酸和氫氧化鈉完全中和，溶液 pH 約 7，酚酞是無色（全國 12% 誤選）✗
    (B) 食鹽水 pH 約 7，大於 6.3，甲基紅呈黃色（全國 10% 誤選）✗
    (E) 甲基紅在強鹼中、酚紅在強酸中都只是單一顏色，混用並不能更有效辨識強酸和強鹼 ✗
sci112-14:
  key: 大腸桿菌是原核生物、酵母菌是真核生物；兩者都有的是核糖體（原核生物沒有膜狀胞器）。
  explain: |
    (D) 核糖體負責合成蛋白質，原核與真核細胞都有 ✓
    (A)(B)(C)(E) 細胞核、粒線體、高基氏體、內質網都是有膜的構造，原核的大腸桿菌沒有（(B) 全國 14% 誤選）✗

# ---------- Day 35：大氣與氣象、近代物理與基本交互作用、物質結構與鍵結 ----------
sci112-02:
  key: 未來氣候的曲線整體往低溫移 → 未來的低溫事件較多、高溫事件較少；現今氣候的低溫事件反而較少。
  explain: |
    這題選「錯誤」的。
    (A) 現今氣候的曲線偏右（高溫），低溫事件的機率較低，不是較高 → 錯誤 ✓
    (B) 未來氣候偏低溫，高溫事件機率較低 → 正確
    (C) 未來曲線的峰值在左，平均溫度較低 → 正確
    (D) 未來較冷，可耐低溫的作物較易生存 → 正確
    (E) 未來曲線的峰值落在甲～乙之間，落在適應區間的機率比現今高 → 正確
sci112-34:
  key: 甲：核分裂有質量轉成能量，總質量變少；丙：變壓器插著就有電流、會耗電；其他三項都錯。
  explain: |
    甲：依 $E=mc^2$，放出能量後總質量減少 → 正確
    乙：只有極小部分質量轉換為能量 → 錯誤
    丙：變壓器的線圈接上插座就有電流，會有熱損耗 → 正確
    丁：兩輛車各載一人，要推動兩輛車，耗油較多 → 錯誤
    戊：LED 燈把電能轉成光的效率比白熾燈高很多 → 錯誤
    (E) 甲丙 ✓
sci112-21:
  key: 1 atm 時液、氣的交界在 445°C（沸點）；三條相界交會的點就是三相共存點：圖中有「斜方、單斜、液」和「斜方、單斜、氣」兩個。
  explain: |
    (A) 1 atm 的虛線和液／氣相界交在 445°C → 沸點 ✓
    (B) 上方三條線交會處，斜方硫、單斜硫、液態硫可以共存 ✓
    (E) 斜方硫和單斜硫都由硫原子組成，結構不同，可以隨溫度互相轉變 → 同素異形體 ✓
    (C) 左下方的交點就是斜方硫、單斜硫、氣態硫的三相點，三者可以共存（全國 32% 誤選）✗
    (D) 圖中斜方硫的區域沒有同時和液態、氣態相接的點（全國 24% 誤選）✗
sci112-15:
  key: 2n＝12：有 6 對同源染色體，聯會形成 6 個四分體；配子（卵、精子）的染色體數是 6。
  explain: |
    (D) 卵是配子，染色體數減半 → 6 ✓
    (C) 減數分裂Ⅰ分開的是同源染色體，每個子細胞有 6 條染色體（每條含兩條染色分體），二分體數是 6，不是 12（全國 26% 誤選）✗
    (B) 12 條染色體組成 6 對同源染色體，不是 24 對（全國 15% 誤選）✗
    (A) 6 對同源染色體聯會成 6 個四分體 ✗
    (E) 精子也是 6 條 ✗
sci112-03:
  key: 隕石中元素的同位素比例和火星探測得到的數據相符，才能判斷它來自火星。
  explain: |
    (C) 每個天體形成時元素的同位素比例各有特徵；隕石與火星樣本（探測器分析的火星大氣、岩石）的比例相符 ✓
    (D) 很多隕石或地球岩石也含氧化鐵、呈紅色，不能證明來自火星（全國 24% 誤選）✗
    (A) 至今沒有載人太空船登陸火星 ✗
    (B)(E) 隕石穿過大氣層都會燒焦，不能用來判斷來源 ✗

