# 社會 Day 22–28 解析（Claude 撰寫；地圖、照片、圖表題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）
# 110 年是舊課綱試卷，排入的題目都已確認在 108 課綱必修範圍內。

# ---------- Day 22：社會規範與社會化、史料與歷史解釋、聚落與交通 ----------
soc111-01:
  key: 報導沒查生活困境（結構因素），就把健康問題歸因於原住民「自己不注重健康」→ 把結構問題個人化，形成「個人不負責」的刻板印象。
  explain: |
    (B) 報導把問題說成個人飲食選擇不當，讓大眾以為原住民個人不為自己的健康負責 ✓
    (D) 報導談的是飲食習慣，不是生活步調的策略（全國 9% 誤選）✗
    (A) 報導沒有提到傳統習慣，而是說偏好垃圾食物 ✗
    (C) 報導沒有談到傳統飲食文化的傳承 ✗
soc111-05:
  key: 族譜、旅券（護照）、同鄉會名簿、人口與戶口資料 → 都在追蹤人從哪裡來、移到哪裡去。
  explain: |
    (A) 這些史料可以呈現家族遷徙、出國與同鄉聚集的情形，主題是人群的移動與交流 ✓
    (C) 這些資料主要記錄人口與遷徙，不是文化類型 ✗
    (B) 沒有涉及國家建立的資料 ✗
    (D) 沒有宗教相關的史料 ✗
soc111-18:
  key: 中南美洲都市化程度和歐美相當，經濟卻較落後 → 過度都市化：鄉村推力大，人口湧進大都市，但工作機會與建設跟不上。
  explain: |
    (D) 中南美洲土地集中在大地主手中，鄉村貧困，人口大量移入大都市，形成貧民窟，都市化程度高於經濟發展程度 ✓
    (B) 中南美洲大都市的產業並非都以農產加工為主（全國 17% 誤選）✗
    (C) 基礎設施健全是已開發國家的都市化，和經濟落後的現象不符（全國 10% 誤選）✗
    (A) 人口最多的是亞洲，也不可能全部集中在都市 ✗
soc111-02:
  key: 民主國家的主權在民：執政者是人民選出來、受人民監督的管理者，人民不需要效忠特定領袖或政黨。
  explain: |
    (C) 民主國家的執政領袖和政黨只是受託管理國家，人民可以監督、更換他們，不是效忠的對象 ✓
    (D) 民主國家的政府要對人民負責，不是人民效忠政府（全國 34% 誤選）✗
    (B) 多元認同是民主社會的現象，不是和威權國家最根本的差異 ✗
    (A) 多黨競爭是民主的表現之一，但最根本的差異在執政者與人民的關係 ✗
soc111-06:
  key: 以人民為主體的歷史 → 研究庶民的生活、信仰與社會，而不是統治者的政策與制度。
  explain: |
    (C) 王爺信仰是沿海民間百姓的宗教生活，屬於人民的歷史 ✓
    (D) 殖民體制的建立是統治者的作為（全國 10% 誤選）✗
    (A) 屯田政策是鄭氏政權的統治措施 ✗
    (B) 職官制度是統治機構的演變 ✗

# ---------- Day 23：區域與產業、生活中的法律、世界史 ----------
soc111-19:
  key: 已開發國家有能力研發、生產疫苗並優先自用；非洲缺乏產能、只能等待 → 資源與技術集中在核心，邊陲依賴核心。
  explain: |
    (D) 疫苗產能集中在歐美等核心國家，非洲等邊陲地區取得困難，呈現核心與邊陲的落差 ✓
    (C) 擴散與反吸指核心發展會帶動或吸走周邊地區的資源，文中說的是全球產能分布的不均（全國 10% 誤選）✗
    (B) 區位移轉是產業從一地搬到另一地（全國 8% 誤選）✗
    (A) 時空收斂是交通進步使兩地往來時間縮短（全國 7% 誤選）✗
soc111-03:
  key: 實際取得遺產的女性比例（28%）比法定繼承人中的女性比例（36%）更低 → 有些女性沒拿到遺產，可能是被繼承人用遺囑把財產留給男性。
  explain: |
    (B) 遺囑自由讓被繼承人能依傳統觀念把財產多留給兒子，使實際取得遺產者男性比例升高 ✓
    (A) 性別平權原則應該縮小男女差距，不會造成差異（全國 16% 誤選）✗
    (C) 配偶是當然繼承人；女性配偶多，反而會提高女性比例（全國 12% 誤選）✗
    (D) 限定繼承是債務責任的規定，和性別無關 ✗
soc111-07:
  key: 二十世紀初、主張廢除貨幣、由政府以實物分配工作所得 → 共產主義（例如蘇俄革命初期的「戰時共產主義」）。
  explain: |
    (C) 共產主義主張廢除私有財產與市場交換，由國家統一分配物資 ✓
    (D) 法西斯主義強調國家至上與領袖獨裁，但保留私有財產與貨幣經濟（全國 26% 誤選）✗
    (A) 重商主義重視累積金銀貨幣，正好相反（全國 15% 誤選）✗
    (B) 自由主義重視市場交易與私有財產（全國 13% 誤選）✗
soc111-20:
  key: 不同年份的電話簿記載各行業營業場所的地址 → 可以畫出各類商店、機構的分布，比較都市內部機能（商業、服務等）的空間變化。
  explain: |
    (A) 電話簿記錄的是各行業營業場所的位置，適合分析都市機能結構的變遷 ✓
    (D) 都市成長的歷程要看人口、建成區範圍等資料，電話簿只有營業場所（全國 23% 誤選）✗
    (C) 地租資料要看地價，電話簿沒有（全國 7% 誤選）✗
    (B) 電話簿載的是工商業營業場所，不是住宅（全國 6% 誤選）✗
soc111-04:
  key: 汰舊換新補助提高、新購補助降低 → 汰舊換新的誘因變大；舊機車被報廢，汙染減少得更多。
  explain: |
    (B) 汰舊換新補助從 8000 元提高到 10000 元，更多人會報廢舊車換新車；新車的數量不變，舊的高汙染機車減少，空汙改善較多 ✓
    (A) 舊車報廢得更多，今年的政策更能改善空汙（全國 17% 誤選）✗
    (C) 新購補助降低，單純新購機車的誘因變小 ✗
    (D) 新購補助降低，單純新購機車的誘因變小 ✗

# ---------- Day 24：東亞國際關係、世界區域地理、全球化與多元文化 ----------
soc111-08:
  key: 在中國「公平、促進社會流動」→ 科舉讓平民也能憑考試入仕；在日本、朝鮮卻只開放給貴族或兩班，成了保障特定身分的工具。
  explain: |
    (D) 科舉在中國打破門第、促進階層流動；朝鮮的科舉主要由兩班應考，日本則只學了形式，任官仍看家世 ✓
    (B) 律令是法律制度，談不上促進社會流動（全國 14% 誤選）✗
    (C) 賦役是稅收與勞役制度（全國 11% 誤選）✗
    (A) 戶籍是人口管理制度 ✗
soc111-21:
  key: 生產商分布在中南美洲、非洲、南亞與東南亞 → 都在熱帶，種植咖啡、可可、香蕉等熱帶作物；這些地方二十世紀中期前大多是歐洲殖民地。
  explain: |
    (C) 這些地區多在熱帶，過去曾是歐洲列強的殖民地，發展熱帶栽培業，至今仍是農產原料的生產者 ✓
    (B) 分布遍及美洲、非洲，不只是熱帶季風區，也不是東亞人群的移入地（全國 10% 誤選）✗
    (D) 這些地方不全在信風帶，也不全是冷戰的緩衝區 ✗
    (A) 熱帶沙漠無法發展農業；美洲也不曾是阿拉伯帝國的範圍 ✗
soc111-22:
  key: 背包客是全球化下人力的跨國流動，替澳洲解決缺工（貢獻）；疫情邊境管制後人力斷鏈、農產價格上漲（挑戰）。
  explain: |
    (D) 澳洲農業依賴國外背包客，全球化帶來勞動力，人員流動中斷時就出現缺工與漲價，正好說明全球化的貢獻與挑戰 ✓
    (B) 文中的關鍵是勞動力流動與中斷，不是交通技術的改變（全國 18% 誤選）✗
    (A) 文中沒有提到區域結盟（全國 11% 誤選）✗
    (C) 文中沒有談到文化的交流與並存 ✗
soc111-09:
  key: 同時接待中國冊封使與日本薩摩藩官員 → 十七世紀以後「兩屬」中國與日本的琉球王國，宮殿是首里城。
  explain: |
    (D) 琉球接受明、清冊封，1609 年後又受薩摩藩控制，所以首里城設北殿、南殿分別接待兩方 ✓
    (A) 朝鮮雖受中國冊封，但沒有受薩摩藩控制，不需要專門接待薩摩官員（全國 51% 誤選）✗
    (B) 暹羅和薩摩藩沒有這種關係（全國 23% 誤選）✗
    (C) 安南也和薩摩藩沒有這種關係 ✗
soc111-28:
  key: 甲是棉花，生長需要 20–30°C 的高溫 → 在歐洲要找最南、最溫暖的地中海地區：希臘（歐盟最大的棉花產國）。
  explain: |
    (C) 寅在希臘，緯度最低，夏季炎熱，是歐洲的棉花主要產區 ✓
    (B) 丑在義大利北部的波河平原，主要種植稻米、玉米與小麥（全國 28% 誤選）✗
    (A) 子在法國北部，氣溫太低（全國 22% 誤選）✗
    (D) 卯在芬蘭，緯度高、生長季短，無法種棉花 ✗
soc111-29:
  key: 照片都是大面積單一作物、大型機械採收 → 專業化、機械化的商業性農業，靠大規模生產降低成本。
  explain: |
    (C) 大片單一作物、大型機具收割，是專業化耕作與規模經濟的表現 ✓
    (B) 照片看不出在農場旁設工廠加工（全國 14% 誤選）✗
    (A) 照片看不出灌溉與生物科技 ✗
    (D) 照片看不出和畜牧業的連鎖關係 ✗

# ---------- Day 25：社會安全與公共政策、經濟學概念、世界史 ----------
soc111-23:
  key: 長照是因應人口老化的社會安全制度，讓失能者得到照顧、照顧者不必獨自承擔，保障人民有尊嚴的生活。
  explain: |
    (C) 政府廣設日照中心、引進看護、建立證照、補助家庭，都是為了因應高齡化，保障失能者與家庭的生活 ✓
    (A) 增加長照人力只是手段，不是最重要的目標（全國 23% 誤選）✗
    (D) 長照的重點不是財富重分配（全國 13% 誤選）✗
    (B) 長照是由政府分擔家庭照顧，不是規定子女平均分擔 ✗
soc111-24:
  key: GDP 只計算當年生產的最終財貨與勞務；政府花錢建日照中心、提供服務算政府支出（會增加 GDP），直接發錢給家庭是移轉性支付（不算）。
  explain: |
    (D) 丁是直接補助給家庭，只是把錢從政府移給民眾，沒有對應的生產，不計入 GDP ✓
    (C) 補助家庭沒有購買財貨或勞務，不算政府支出（全國 21% 誤選）✗
    (B) 廣設日照中心是政府購買建設與服務，屬於政府支出，不是移轉性支付（全國 19% 誤選）✗
    (A) 甲計入政府支出，會增加 GDP（全國 11% 誤選）✗
soc111-25:
  key: 日間照顧中心可以由政府出資、委託民間團體經營（公辦民營）；證照制度、移工政策、補助發放都是政府的公權力。
  explain: |
    (A) 日照中心是提供照顧服務，適合委託民間專業機構經營 ✓
    (C) 證照制度涉及資格認定的公權力，應由政府建立（全國 8% 誤選）✗
    (B) 外籍看護工的引進政策屬於政府的管理權限 ✗
    (D) 補助的審核與發放由政府辦理 ✗
soc111-10:
  key: 十七世紀歐洲人在美洲熱帶殖民地開設甘蔗種植園，用非洲黑奴生產蔗糖 → 加勒比海的西印度群島。
  explain: |
    (B) 圖中是黑人奴隸操作的榨蔗機；西印度群島氣候炎熱多雨，是當時最重要的蔗糖產地 ✓
    (D) 剛果盆地在十七世紀還沒有被歐洲人開發成蔗糖種植園，它是奴隸的來源地之一（全國 19% 誤選）✗
    (A) 阿爾及利亞氣候乾燥，十七世紀也不是歐洲殖民地（全國 15% 誤選）✗
    (C) 紐芬蘭島氣候寒冷，不能種甘蔗 ✗
soc111-30:
  key: 先看指北針：北朝左，所以圖的左上方才是東北。子位在高地的左上緣，往東北一路下坡、前方沒有遮擋。
  explain: |
    (A) 子在台地的東北側邊緣，外側等高線密集、地勢陡降，往東北方向的低處視野開闊 ✓
    (B) 丑在台地的東南側，往東北方向要越過 220 公尺以上的台地，視線被擋住（全國 17% 誤選）✗
    (C) 寅在南側，往東北方向一樣被台地擋住（全國 7% 誤選）✗
    (D) 卯在台地的西南側，往東北方向也被擋住 ✗
soc111-31:
  key: 谷地的等高線呈 V 字形，尖端指向高處；丁沿著兩側較高、中間凹入的等高線往上走。
  explain: |
    (D) 丁所在處等高線向高處凸入，形成 V 字，是谷地 ✓
    (C) 丙沿著較陡的坡面上下，不在谷地中（全國 14% 誤選）✗
    (B) 乙沿著山脊、坡面設置（全國 7% 誤選）✗
    (A) 甲沿著坡面設置 ✗

# ---------- Day 26：民主政治與媒體、臺灣史、地圖與地理資訊系統 ----------
soc111-47:
  key: 警告的重點是「沒有充分授權與告知」卻「擁有左右使用者認知與行為的能力」→ 擔心平台在使用者不知情下持續監視、操縱行為。
  explain: |
    (D) 平台未經同意就追蹤足跡、預測偏好，進而影響使用者的認知與行為，這正是警告所擔心的 ✓
    (C) 製作廣告只是平台獲利的方式之一，警告的核心是未經授權的監視與操縱（全國 19% 誤選）✗
    (A) 蒐集分析足跡只是手段，警告擔心的是藉此左右使用者（全國 18% 誤選）✗
    (B) 文中沒有提到替政黨分析民意 ✗
soc111-12:
  key: 洋樓＝西洋建築；裝飾卻是鳳梨、麥穗、螃蟹等傳統吉祥寓意，還有西洋時鐘、印度苦力 → 清末民初下南洋致富的僑民回鄉蓋屋，中西融合。
  explain: |
    (C) 民國初年金門僑民從南洋（英、荷殖民地）帶回西式建築，再加上傳統吉祥裝飾，印度苦力也是南洋殖民地常見的形象 ✓
    (A) 荷蘭主導遠東貿易是十七世紀，金門洋樓多建於二十世紀初，且有科舉、多子等華人傳統寓意（全國 28% 誤選）✗
    (B) 鄭氏家族並沒有大量在金門興建洋樓（全國 17% 誤選）✗
    (D) 日本占領金門是 1937–1945 年，洋樓主要由僑民興建，不是日本商人 ✗
soc111-36:
  key: 照片是寬闊筆直的道路、整齊的新式住宅大樓 → 位在高鐵站旁新開發、經過重劃的街區，而不是農地或河濱。
  explain: |
    (C) 丙位在車站西側新開發的棋盤狀街區，道路寬、建物新，符合照片景觀 ✓
    (A) 甲周邊仍是農地，沒有成排的建築 ✗
    (B) 乙在鐵道旁的農地中，沒有這樣的街道景觀 ✗
    (D) 丁在河岸邊，是河灘與空地 ✗
soc111-37:
  key: 比較兩張圖：較早的圖 8 已有高鐵路線和規劃好的道路，建物卻很少；較晚的圖 9 建物變密 → 先有交通建設，地區才跟著開發。
  explain: |
    (D) 圖 8 已經看得到鐵道與道路網，周邊仍多空地，圖 9 才布滿建物，可見鐵道建設早於地區發展 ✓
    (A) 圖 8 的區域原本是農地，是新開發的車站特定區，不是原有的中心商業區（全國 46% 誤選）✗
    (B) 兩張圖看到的是農地變成建地，不是轉作休閒農業 ✗
    (C) 兩張圖的河道位置沒有明顯改變 ✗
soc111-49:
  key: 修法後透過保障名額當選的席次只從 31 增加到 32，女性當選席次卻增加 49 席；同時女性候選人從 359 人增加到 505 人 → 保障名額的效果主要在吸引更多女性參選。
  explain: |
    (D) 保障名額提高後，女性候選人大幅增加，多數女性靠一般票數當選，可見保障名額主要是提高女性投入選舉的誘因 ✓
    (C) 靠保障名額當選的席次幾乎沒變，無法用這項變化證明積極平權措施的效益（全國 31% 誤選）✗
    (B) 保障名額增加了 71 席，靠保障名額當選的席次只多 1 席，看不出正向相關（全國 17% 誤選）✗
    (A) 靠保障名額當選的只多 1 席，女性席次成長主要不是靠保障名額（全國 14% 誤選）✗

# ---------- Day 27：世界史、地圖與地理資訊系統、全球化與多元文化 ----------
soc111-13:
  key: 蘇聯（東線）是二戰歐洲最主要的陸上戰場，德軍入侵、焦土作戰、圍城（例如列寧格勒）造成大量平民死於戰火與飢荒。
  explain: |
    (B) 德蘇戰爭在蘇聯境內進行，戰火加上糧食短缺與飢荒，平民傷亡極為慘重 ✓
    (A) 滅絕營主要設在波蘭，屠殺對象以猶太人為主，不是蘇聯平民大量死亡的主因（全國 21% 誤選）✗
    (D) 駐防東歐是戰後冷戰時期的事，也無法解釋平民死亡（全國 16% 誤選）✗
    (C) 軸心國的武器並沒有全面勝過同盟國 ✗
soc111-42:
  key: 開放平台讓任何人免費使用、編輯 → 主流商用地圖沒照顧到的需求（救災、飲水機等）也能被滿足，資源配置更有效率。
  explain: |
    (B) 民眾可以自行新增圖資，提供商用地圖沒有的資訊，滿足更多需求，提升經濟效率 ✓
    (D) 免費圖資讓更多人得到地圖的好處，市場價值不是判斷經濟效率的標準（全國 14% 誤選）✗
    (A) 外部成本指的是生產或消費對他人造成的損害（例如汙染），免費查詢地圖並不是降低外部成本（全國 13% 誤選）✗
    (C) 開放式地圖讓所有人使用及編輯，不是只滿足特定群體 ✗
soc111-43:
  key: 協作平台的特色是「民眾自己」新增空間資料；政府機關或受政府委託製作的都不是。
  explain: |
    (B) 社群成員自行建置登山步道地圖，是民眾協作產出的空間資料 ✓
    (C) 公車 APP 由政府委製，不是民眾協作產出（全國 9% 誤選）✗
    (A) 地面天氣圖由中央氣象局製作 ✗
    (D) 車次表由鐵路局製作 ✗
soc111-51:
  key: 野火被認為和排碳量有關，政府要禁燃油車、改用綠能，卻不利產業發展、引發業者不滿 → 氣候變遷下，環境保護與生產成本的兩難。
  explain: |
    (B) 減碳能保護環境、避免災害，但會提高產業的生產成本，形成兩難 ✓
    (C) 文中沒有提到作物轉型（全國 11% 誤選）✗
    (A) 文中說的是排碳造成極端氣候，不是油價高漲 ✗
    (D) 文中說排碳主要來自石油消耗，不是葡萄酒產業造成氣候變遷 ✗
soc111-14:
  key: 十六世紀只有甲（葡萄牙最早來到亞洲）；十七世紀起乙最多（荷蘭東印度公司的全盛期）；丙逐漸追上（英國東印度公司在十八世紀崛起）。
  explain: |
    (A) 葡萄牙在 1500 年代獨占亞洲航線，之後衰退；荷蘭在 1600–1700 年代船隻最多；英國後來居上 ✓
    (B) 西班牙主要經營美洲與菲律賓，經大西洋、太平洋航線，不是十六世紀從歐洲前往亞洲的主要國家（全國 24% 誤選）✗
    (C) 荷蘭、英國要到十七世紀初才成立東印度公司，不會出現在 1500 年代（全國 14% 誤選）✗
    (D) 英國也是十七世紀才到亞洲 ✗

# ---------- Day 28：區域與產業、經濟學概念、中國史 ----------
soc111-57:
  key: 企業的策略是「用資訊科技提供遠端客服、維運」並精簡行銷與研發 → 需要資訊科技、知識與人才普及的知識經濟作為基礎。
  explain: |
    (A) 遠端客服與維運要靠資訊科技、數位人才與網路基礎建設，也就是知識經濟發達 ✓
    (C) 經濟結構轉型是指一國產業重心改變（例如從工業轉向服務業），不是企業因應疫情所需的條件（全國 30% 誤選）✗
    (D) 產品規格化和遠端服務沒有直接關係（全國 12% 誤選）✗
    (B) 文中說工廠據點分散反而受影響，產業群聚不是這項策略需要的要素（全國 7% 誤選）✗
soc111-53:
  key: 塑膠吸管危害健康與海洋，這些代價不由生產者、使用者負擔 → 社會成本高於私人成本（負外部性），市場會生產過多，從整體社會來看要管制。
  explain: |
    (B) 有負外部性時，社會成本＝私人成本＋外部成本，大於私人成本；市場只看私人成本，從整體社會看產量過多 ✓
    (D) 有外部成本時是社會成本高於私人成本，不是私人成本較高（全國 32% 誤選）✗
    (A) 從市場經濟（只看私人成本）的觀點，產量是剛好的；從整體社會的觀點才會過多（全國 8% 誤選）✗
    (C) 私人成本並不高於社會成本（全國 6% 誤選）✗
soc111-15:
  key: 民國初年因「外交失敗」引發抵制某國貨 → 1919 年巴黎和會山東問題失敗，引發五四運動與抵制日貨。
  explain: |
    (B) 巴黎和會把德國在山東的權益交給日本，學生與商人發起五四運動，抵制日貨 ✓
    (C) 九一八事變是日本的軍事侵略，不是「外交失敗」，時間也已經不算民國初年（全國 26% 誤選）✗
    (D) 七七事變是全面戰爭的開始，也不是外交失敗（全國 16% 誤選）✗
    (A) 三一運動是 1919 年朝鮮的獨立運動，不在中國（全國 14% 誤選）✗
soc112-18:
  key: 吉安鄉的龍鬚菜面積從 57 增加到 180 公頃，一直居全臺之冠、遠多於第二名 → 依當地條件發展特色作物，形成區域專業化生產。
  explain: |
