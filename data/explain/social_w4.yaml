soc111-59:
  key: 美國是總統制：總統與國會分別由人民選出、各自對選民負責；雙方立場不同時，預算案無法通過，政府就可能「關門」。
  explain: |
    (D) 總統制下行政與立法完全分立，總統要的築牆經費國會不同意，雙方僵持，預算無法通過，部分部門停擺 ✓
