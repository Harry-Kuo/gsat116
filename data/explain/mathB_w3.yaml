# 數學B 第 3 週（Day 15–21）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）
# 109、110 年是舊課綱的「數學」卷（數A、數B 同一份），每題只排在一科。

# ---------- Day 15：數與式、指數對數 ----------
mb111-01:
  key: 分 x≥0、x＜0 去掉絕對值：x≥0 時 3x＜10；x＜0 時 −x＜10。
  explain: |
    x≥0：2x＋x＝3x＜10 ⇒ x＝0、1、2、3，共 4 個
    x＜0：−2x＋x＝−x＜10 ⇒ x＞−10 ⇒ x＝−9～−1，共 9 個
    合計 13 個 → 答案 (1)
mb111-13:
  key: 2log y＝1 ⇒ y²＝10；代入 x^(−1/3)·10＝1 ⇒ x^(1/3)＝10 ⇒ x＝1000。
  explain: |
    2log y＝1 ⇒ log(y²)＝1 ⇒ y²＝10。
    x^(−1/3)×10＝1 ⇒ x^(−1/3)＝1/10 ⇒ x^(1/3)＝10 ⇒ x＝1000。
    (x−y²)/10＝(1000−10)/10＝99：13-1＝9、13-2＝9
mb114-18:
  key: UVI＝每平方公尺的焦耳數÷100，地面是 4；每升高 300 公尺乘上 1.04，4500 公尺共 15 次。
  explain: |
    地面每平方公尺 400 焦耳 ⇒ UVI＝400÷100＝4。
    每上升 300 公尺，UVI 變成上升前的 (1＋4%)＝1.04 倍；4500÷300＝15 次。
    UVI＝4×1.04¹⁵＝4(1＋0.04)¹⁵ → 答案 (3)
    (4) 多乘了 100：題目問的是 UVI，不是焦耳數（全國 33% 誤選）。
mb110-09:
  key: 甲總票＝0.4x＋0.55y，乙＝0.6x＋0.45y；甲−乙＝0.1(y−2x)，甲勝 ⇔ x/y＜1/2。
  explain: |
    甲−乙＝(0.4x＋0.55y)−(0.6x＋0.45y)＝0.1y−0.2x＝0.1(y−2x)。
    ⇒ x:y＜1/2 時甲當選；x:y＞1/2 時乙當選。
    (1) 只知道 x＋y，不知道 x、y 的比例 ✗（全國 32% 誤選）
    (2) x:y＜1/2 ⇒ 甲當選 ✓
    (3) x＞y ⇒ x/y＞1＞1/2 ⇒ 乙當選 ✓
    (4) 0.4x＞0.55y ⇒ x/y＞1.375＞1/2 ⇒ 乙當選 ✓
    (5) 0.45y＞0.6x ⇒ x/y＜0.75，可能小於 1/2，也可能介於 1/2 和 0.75 之間 ✗
    → 答案 (2)(3)(4)
mb109-05:
  key: √101≈10.05，距離小於 5 ⇒ 6～15；√38≈6.16，距離大於 3 ⇒ x＜3.16 或 x＞9.16。
  explain: |
    √101≈10.05，|x−√101|＜5 ⇒ 5.05＜x＜15.05 ⇒ 整數 x＝6～15。
    √38≈6.16，|x−√38|＞3 ⇒ x＜3.16 或 x＞9.16。
    兩個條件都成立：x＝10～15，共 6 個 → 答案 (3)

# ---------- Day 16：多項式與數列 ----------
mb111-09:
  key: f(1)＝0 ⇒ f(x)＝(x−1)(2x²＋2x−1)；三次函數的對稱中心在 x＝−b/(3a)＝0。
  explain: |
    f(1)＝2−3＋1＝0 ⇒ f(x)＝(x−1)(2x²＋2x−1)，2x²＋2x−1＝0 的判別式＝4＋8＞0。
    (1) 通過 (1,0) ✓
    (2) 和 x 軸有 3 個交點 ✗
    (3) f(x) 沒有 x² 項，對稱中心是 (0, f(0))＝(0,1) ✗
    (4) f(x)＝2x³−3x＋1，在對稱中心 (0,1) 附近近似直線 y＝−3x＋1 ✗
    (5) 平移不會改變 x³ 的係數；3x³−6x²＋2x 的 x³ 係數是 3，不是 2 ✗
    → 答案 (1)
mb111-12:
  key: 把 a(□)²＋b(□)＋c＝0 看成原方程式：□ 要落在 1 和 3 之間，再解出 x 的範圍。
  explain: |
    原方程式的兩根 r 都在 1 和 3 之間。a(g(x))²＋b·g(x)＋c＝0 ⇔ g(x)＝r。
    (1) x−2＝r ⇒ x＝r＋2，介於 3 和 5 之間，不一定在 4、5 之間 ✗
    (2) x＋2＝r ⇒ x＝r−2，介於 −1 和 1 之間 ✗
    (3) 2x−7＝r ⇒ x＝(r＋7)/2，介於 4 和 5 之間 ✓
    (4) (x＋7)/2＝r ⇒ x＝2r−7，介於 −5 和 −1 之間 ✗
    (5) 3x−11＝r ⇒ x＝(r＋11)/3，介於 4 和 14/3 之間，在 4、5 之間 ✓
    → 答案 (3)(5)
mb109-10:
  key: 把 x² 當未知數分解：f(x)＝(3x²−1)(x²＋4)，實根只有 ±1/√3。
  explain: |
    3x⁴＋11x²−4＝(3x²−1)(x²＋4)。
    x²＋4＝0 沒有實根；3x²−1＝0 ⇒ x＝±1/√3≈±0.577。
    (1) f(0)＝−4＜0 ✓
    (2) 只有 2 個實根 ✗
    (3) ±1/√3 不是有理數，沒有有理根 ✗
    (4) 1/√3≈0.577 介於 0 與 1 之間 ✓
    (5) 實根只有 ±0.577，1 與 2 之間沒有根 ✗
    → 答案 (1)(4)
mb110-14:
  key: 一個週期（8 秒）前進 6×4＝24；4 個週期（32 秒）走到 96，剩下 20 單位再走 5 秒。
  explain: |
    每個週期 8 秒，前 6 秒以每秒 4 單位前進 ⇒ 每週期 24 單位。
    4 個週期後（32 秒）走到 96；第 5 個週期一開始就在移動，剩下 116−96＝20 單位要 20÷4＝5 秒。
    共 32＋5＝37 秒：⑭＝3、⑮＝7
    20＜24，抵達時還在第 5 個週期的移動時段，不用再加休息的 2 秒。
mb109-08:
  key: 得 100 元＝恰好滿足一個條件；第三顆點數 x，分別檢查 (A) 全奇或全偶、(B) 排序後成等差。
  explain: |
    已知兩顆是 1、3（都是奇數），第三顆 x：
    (A) 三個點數同奇偶 ⇔ x 是奇數（1、3、5）
    (B) 由小到大成等差：{1,2,3}、{1,3,5} ⇒ x＝2 或 5
    恰好滿足一個條件才是 100 元：
    x＝1：只滿足 (A)（1,1,3 不是等差）；x＝2：只滿足 (B)；x＝3：只滿足 (A)
    x＝4、6：兩個都不滿足；x＝5：兩個都滿足，是 200 元
    選項中可能的是 2、3 → 答案 (1)(2)

# ---------- Day 17：三角函數與三角測量 ----------
mb111-18:
  key: 180° 等於 π 弧度，18°＝18×π/180＝π/10。
  explain: |
    180°＝π 弧度 ⇒ 1°＝π/180。
    18°＝18×π/180＝π/10 → 答案 (4)
mb110-03:
  key: PB＝PC，△PBC 等腰，∠PBC＝90°−θ/2；弦切角 ∠PBC＝∠A。
  explain: |
    PB、PC 是切線 ⇒ PB＝PC，△PBC 是等腰三角形，∠PBC＝(180°−θ)/2＝90°−θ/2。
    弦切角：切線 PB 和弦 BC 的夾角＝弦 BC 所對的圓周角 ⇒ ∠A＝∠PBC＝90°−θ/2。
    cosA＝cos(90°−θ/2)＝sin(θ/2) → 答案 (3)
    另解：設圓心 O，∠BOC＝2∠A；四邊形 OBPC 中 ∠OBP＝∠OCP＝90°，所以 2∠A＋θ＝180°。
mb109-01:
  key: sinα＝對邊/斜邊＝3/5＝0.6；sinβ＝5/13≈0.38；sin30°＝0.5。
  explain: |
    α 在 3、4、5 的直角三角形中，對邊是 3 ⇒ sinα＝3/5＝0.6。
    β 在 5、12、13 的直角三角形中，對邊是 5 ⇒ sinβ＝5/13≈0.385。
    sin30°＝0.5 ⇒ sinα＞sin30°＞sinβ → 答案 (2)
mb109-17:
  key: 箏形的對稱軸是 BD，AC⊥BD；先用餘弦定理求 BD，再用面積求 A 到 BD 的距離。
  explain: |
    AB＝BC、AD＝CD ⇒ 對角線 BD 是對稱軸，AC⊥BD，且 BD 平分 AC。
    △ABD：BD²＝2＋4−2×√2×2×cos135°＝6＋4＝10 ⇒ BD＝√10
    △ABD 面積＝½×√2×2×sin135°＝1
    A 到 BD 的距離＝2×1/√10＝2/√10 ⇒ AC＝2×2/√10＝4/√10＝2√10/5
    ㉑＝2、㉒＝1、㉓＝0、㉔＝5
mb109-07:
  key: y＝−√3x³ 的圖形對稱於原點，單位圓也對稱於原點 ⇒ 交點 P 的對稱點 −P 也是交點。
  explain: |
    f(x)＝−√3x³ 滿足 f(−x)＝−f(x)，圖形對稱於原點；單位圓也對稱於原點。
    P 在兩個圖形上 ⇒ −P＝(−cosθ, −sinθ) 也在兩個圖形上。
    y＝−√3x³ 遞減，和單位圓只有兩個交點 ⇒ Q＝(−cosθ, −sinθ)＝(−cosθ, sin(−θ)) → 答案 (4)

# ---------- Day 18：坐標幾何與平面向量 ----------
mb111-08:
  key: 光束是射線 y＝ax（x≥0）；擊中靶子 ⇔ 圓心到直線的距離≤1。
  explain: |
    光束沿原點往 (1,a) 方向射出，落在直線 ax−y＝0 上。圓心 (p,q) 到直線的距離＝|ap−q|/√(1＋a²)，≤1 就擊中。
    (1) 過原點、斜率 a 的直線 ✓
    (2) a＝3/2：(4,6) 到直線的距離＝|6−6|/√(13/4)＝0，正好通過圓心 ✓
    (3) 擊中 (4,6)：(4a−6)²≤1＋a² ⇒ 15a²−48a＋35≤0 ⇒ 約 1.12≤a≤2.08；擊中 (8,1) 要 a≤16/63≈0.25（見 (5)），兩個範圍沒有交集，一道光束做不到 ✗
    (4) a＝1.3 時，(2,2)、(4,6) 的距離分別約 0.37、0.49，一道光束就能擊中兩個靶，再加一道打 (8,1)，兩道就夠 ✗
    (5) 擊中 (8,1)：|8a−1|≤√(1＋a²) ⇒ 63a²−16a≤0 ⇒ 0≤a≤16/63 ✓
    → 答案 (1)(2)(5)
mb111-11:
  key: OD、OE 可以寫成 −(αOA＋βOB)（α、β＞0），和 v 的內積一定小於 0；其他點都找得到內積為正的 v。
  explain: |
    v·OA＞0、v·OB＞0 ⇒ 對任何正數 α、β，v·(αOA＋βOB)＞0。
    圖中 D、E 落在 −OA 與 −OB 之間的範圍（第二、三象限，夾在 A、B 的反方向之間）⇒ OD、OE＝−(αOA＋βOB) ⇒ v·OD＜0、v·OE＜0 ✓
    C、F、G 不在這個範圍：
    (1) 取 v 沿 OB 方向，OB 和 OC 的夾角小於 90°，內積為正 ✗
    (4) 取 v 在 OA 稍微往下轉的方向，和 OF 的夾角會小於 90° ✗
    (5) 取 v 沿 OA 方向，A、G 都在第四象限，內積為正 ✗
    → 答案 (2)(3)
mb111-04:
  key: Q＝P＋PQ＝(log(1/2)＋log(1/5), 2⁻⁵−10⁻⁵)＝(−1, 正數)。
  explain: |
    Q 的 x 坐標＝log(1/2)＋log(1/5)＝log(1/10)＝−1。
    Q 的 y 坐標＝2⁻⁵−10⁻⁵＝1/32−0.00001＞0。
    x＜0、y＞0 ⇒ Q 在第二象限 → 答案 (2)
mb115-18:
  key: 起點 (8,0)、終點 (0,0) 的連線在 x 軸上，中點 (4,0)，中垂線是鉛直線 x＝4。
  explain: |
    兩點 (8,0)、(0,0) 都在 x 軸上，中點是 (4,0)。
    中垂線過中點且垂直 x 軸 ⇒ x＝4 → 答案 (1)
mb112-18:
  key: 先求消失點 P＝L∩M；由 A₃B₃＝2A₁B₁ 找出 A₃ 的位置，再比較 PA₁ 和 PA₃。
  explain: |
    L：x＋3y＝0 與 M：2x−3y＋9＝0 相加得 3x＋9＝0 ⇒ x＝−3、y＝1，P＝(−3,1)。
    電線桿平行 y 軸：A₃＝(t, −t/3)、B₃＝(t, (2t＋9)/3)，A₃B₃＝(2t＋9)/3＋t/3＝t＋3。
    A₁B₁＝3 ⇒ t＋3＝6 ⇒ t＝3，A₃＝(3,−1)。
    PA₁＝(3,−1)、PA₃＝(6,−2) ⇒ PA₁＝(1/2)PA₃，k＝1/2：18-1＝1、18-2＝2

# ---------- Day 19：向量、矩陣與空間概念 ----------
mb113-18:
  key: 截去 8 個角：原本 6 個面各剩中間一塊，再多出 8 個三角形截面，共 14 個面。
  explain: |
    長方體有 6 個面、8 個頂點。每個角截下去，截面通過三條鄰邊的中點，是一個三角形。
    原來的 6 個面都還在（各剩下連接四邊中點的四邊形）；8 個角各多出 1 個三角形的面。
    6＋8＝14 ⇒ 十四面體 → 答案 (4)
mb111-07:
  key: 等距的四點 K＝(3d×d)/(2d×2d)＝3/4；畫在紙上的四點 K 值也要是 3/4，且順序不變。
  explain: |
    Q₁Q₂＝Q₂Q₃＝Q₃Q₄＝d ⇒ K＝(Q₁Q₄×Q₂Q₃)/(Q₁Q₃×Q₂Q₄)＝(3d×d)/(2d×2d)＝3/4。
    逐一計算選項的 K：
    (1) 1,2,4,8：(7×2)/(3×6)＝7/9
    (2) 3,4,6,9：(6×2)/(3×5)＝4/5
    (3) 1,5,8,9：(8×3)/(7×4)＝6/7
    (4) 1,2,4,9：(8×2)/(3×7)＝16/21
    (5) 1,7,9,10：(9×2)/(8×3)＝3/4 ✓
    → 答案 (5)
mb110-11:
  key: 過 B 作 AD 的平行線交 DC 於 E′：△BE′C 的三邊是 BC＋1、BC、5，角度和內積都能從這個三角形算。
  explain: |
    設 BC＝x，AD＝x＋1。過 B 作 BE′∥AD 交 DC 於 E′：ABE′D 是平行四邊形，BE′＝x＋1、E′C＝15−10＝5。
    在 △BE′C 中 BE′＞BC ⇒ ∠C＞∠BE′C＝∠D。
    (1) ∠A＝180°−∠D、∠B＝180°−∠C，∠C＞∠D ⇒ ∠A＞∠B ✓
    (2) ∠B＋∠D＝180°−∠C＋∠D＜180° ✓
    (3) ∠B 可能是直角：例如 BC＝12、AD＝13（高 12）時 ∠B＝90°，BA·BC＝0 ✗
    (4) △BE′C 的三角形不等式：x＋(x＋1)＞5 ⇒ x＞2，BC 不能是 2 ✗
    (5) 餘弦定理：(x＋1)²＝x²＋25−10x·cosC ⇒ x·cosC＝(24−2x)/10，CB·CD＝15x·cosC＝36−3x＜30（因為 x＞2）✓
    → 答案 (1)(2)(5)
mb109-03:
  key: 正六邊形中 OD＝OC＋OE；以 OC、OE 為基底，△ODE 內部 ⇔ OP＝x·OC＋y·OE，0＜x＜y＜1。
  explain: |
    正六邊形中 OCDE 是菱形 ⇒ OD＝OC＋OE。
    寫成 OP＝x·OC＋y·OE：O 對應 (0,0)、E 對應 (0,1)、D 對應 (1,1)。
    △ODE 內部（不含邊界）⇔ x＞0、y＜1、y＞x，也就是 0＜x＜y＜1。
    (1) (1,1) 是 D 點，在邊界上 ✗
    (2) (1/4, 1/2)：0＜1/4＜1/2＜1 ✓
    (3)(5) x＜0 ✗；(4) y＜0 ✗
    → 答案 (2)
mb110-01:
  key: A 是上三角矩陣，A²＝[[1,8],[0,9]]，A⁴＝(A²)²。
  explain: |
    A²＝[[1,2],[0,3]]·[[1,2],[0,3]]＝[[1,8],[0,9]]
    A⁴＝(A²)²＝[[1,8],[0,9]]·[[1,8],[0,9]]＝[[1,8＋72],[0,81]]＝[[1,80],[0,81]]
    a＋b＋c＋d＝1＋80＋0＋81＝162 → 答案 (2)

# ---------- Day 20：機率與數據分析 ----------
mb111-15:
  key: 條件機率：P(找到｜有裝)＝P(找到且有裝)／P(有裝)。
  explain: |
    找到且有裝：0.7×0.6＝0.42
    沒找到且有裝：0.3×(1−0.9)＝0.03
    P(找到｜有裝)＝0.42/(0.42＋0.03)＝0.42/0.45＝14/15：15-1＝1、15-2＝4、15-3＝1、15-4＝5
mb111-16:
  key: 由「兩球都藍」「兩球都綠」的機率反推球數：C(b,2)＝3、C(g,2)＝10。
  explain: |
    C(10,2)＝45。C(藍,2)/45＝1/15 ⇒ C(藍,2)＝3 ⇒ 藍 3 顆；C(綠,2)/45＝2/9 ⇒ C(綠,2)＝10 ⇒ 綠 5 顆；黃 2 顆。
    同色：C(3,2)＋C(5,2)＋C(2,2)＝3＋10＋1＝14 ⇒ 同色機率 14/45
    相異顏色＝1−14/45＝31/45：16-1＝3、16-2＝1、16-3＝4、16-4＝5
mb111-10:
  key: y＝ax＋b ⇒ 平均也是 a×原平均＋b、標準差是 |a|×原標準差；反推兩班的原始平均與標準差。
  explain: |
    甲班：60＝0.8μ₁＋20 ⇒ μ₁＝50；16＝0.8σ₁ ⇒ σ₁＝20
    乙班：60＝0.75μ₂＋25 ⇒ μ₂≈46.7；15＝0.75σ₂ ⇒ σ₂＝20
    (1) 0.8x＋20≥x ⇔ x≤100，滿分 100，每個人都不會被調低 ✓
    (2) 甲班原始平均 50＞乙班約 46.7 ✓
    (3) 兩班原始標準差都是 20 ✗
    (4) 0.8x_A＋20＞0.75x_B＋25 ⇒ x_A＞0.9375x_B＋6.25；x_B≤100 時 0.9375x_B＋6.25≥x_B ⇒ x_A＞x_B ✓
    (5) 調整後不及格：甲班是原始分數＜50 的人、乙班是原始分數＜約 46.7 的人；原始分數＜60 的人數無法比較 ✗
    → 答案 (1)(2)(4)
mb110-07:
  key: 「實際是 6 被看成…」是表中的一列；「被看成 6 而實際是 6」要用條件機率，三張卡出現機會相同。
  explain: |
    (1) 實際是 8 被看成 8 的機率是 0.4，不到一半 ✗
    (2) 實際是 6 被看成不是 6：1−0.4＝0.6 ✓
    (3) 被看錯的機率：6 是 0.6、8 是 0.6、9 是 0.5，以 9 最低 ✓
    (4) 三張卡出現的機會一樣：P(實際 6｜看成 6)＝0.4/(0.4＋0.3＋0.2)＝4/9＜1/2 ✓
    (5) P(實際 9｜看成 9)＝0.5/(0.2＋0.1＋0.5)＝5/8＝0.625＜2/3 ✗
    → 答案 (2)(3)(4)
mb109-15:
  key: 第一次任意顏色，第二、三次都和前一次同色，各 1/3。
  explain: |
    第一次出現什麼顏色都可以（機率 1）。
    第二次和第一次同色：1/3；第三次和第二次同色：1/3。
    三次都同色的機率＝1×1/3×1/3＝1/9：⑰＝1、⑱＝9

# ---------- Day 21：計數、矩陣與綜合 ----------
mb111-03:
  key: 8 棟選 3 棟不相鄰：C(6,3)＝20；扣掉含 3 號的情形。
  explain: |
    8 棟選 3 棟互不相鄰：用插空法，5 棟不選的大廈之間（含兩端）有 6 個空位，選 3 個 ⇒ C(6,3)＝20 種。
    含 3 號：2、4 號不能選，另外兩棟從 {1,5,6,7,8} 選且不相鄰：
    1 配 5、6、7、8 共 4 種；{5,6,7,8} 中不相鄰的 (5,7)、(5,8)、(6,8) 共 3 種 ⇒ 7 種。
    20−7＝13 種 → 答案 (2)
mb111-17:
  key: 三男不全在同一側 ⇒ 一側 2 男 1 女、另一側 1 男 2 女；再扣掉那一對女生、男生相鄰的排法。
  explain: |
    老師在第 4 位，左右各 3 人。三位男生不全在同一側 ⇒ 一側 2 男 1 女、另一側 1 男 2 女：
    選哪一側 2 男（2）×選哪 2 位男生（3）×選哪位女生跟他們同側（3）×兩側各自排列（3!×3!）＝648 種。
    扣掉有過不愉快的女甲、男甲相鄰（左右兩側之間隔著老師，只會在同一側相鄰）：
    ① 兩人都在 2 男那一側：選側（2）×另一位男生（2）×該側三人排列中兩人相鄰的 4 種×另一側 3!＝96
    ② 兩人都在 1 男那一側：選側（2）×另一位同側的女生（2）×4×另一側 3!＝96
    648−96−96＝456 種：17-1＝4、17-2＝5、17-3＝6
mb109-12:
  key: 逐年檢查表格：注意單位（萬人、千人），比率要換成同單位再比。
  explain: |
    (1) 65 歲以上：69.7→72.6→73.2→73.3→74.8→79.4（2013–2018）逐年遞增 ✓
    (2) 50–64 歲在 2016 年從 181.3 降到 176.4 ✗
    (3) 男性農業就業人口換成萬人約 38.6～41.5 萬，總就業人口 1,070～1,143 萬，比率約 3.6%，每年都小於 5% ✓
    (4) 2011 年 50–64 歲 164.2 千人，比 49 歲以下 67.6＋85.4＝153.0 千人多 ✗
    (5) 65 歲以上：79.4−69.1＝10.3 千人＝1.03 萬人，超過一萬人 ✗
    → 答案 (1)(3)
mb109-04:
  key: BA＝(I＋A＋A⁻¹)A＝A＋A²＋I，不必真的求反矩陣。
  explain: |
    BA＝(I＋A＋A⁻¹)A＝A＋A²＋I（A⁻¹A＝I）。
    A²＝[[1,1],[3,4]]·[[1,1],[3,4]]＝[[4,5],[15,19]]
    BA＝[[1,0],[0,1]]＋[[1,1],[3,4]]＋[[4,5],[15,19]]＝[[6,6],[18,24]] → 答案 (5)
mb109-09:
  key: OP、OQ 和 L 的銳角夾角都是 30° ⇒ 兩向量的夾角只可能是 60°、120° 或 180°。
  explain: |
    以 L 的方向為 0°，OP、OQ 的方向只能是 30°、−30°、150°、210° 其中之一（和 L 夾銳角 30°）。
    P、Q 相異，兩向量的夾角可能是 60°、120° 或 180°。
    OP·OQ＝2×2×cos(夾角)＝2、−2、−4。
    選項中 −2、−4 可能發生 → 答案 (4)(5)
