# 數學B 第 3 週（Day 15–21）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）
# 109、110 年是舊課綱的「數學」卷（數A、數B 同一份），每題只排在一科。

# ---------- Day 15：數與式、指數對數 ----------
mb111-01:
  key: 分 $x\ge0$、$x<0$ 去掉絕對值：$x\ge0$ 時 $3x<10$；$x<0$ 時 $-x<10$。
  explain: |
    $x\ge0$：$2x+x=3x<10$ ⇒ $x=0$、1、2、3，共 4 個
    $x<0$：$-2x+x=-x<10$ ⇒ $x>-10$ ⇒ $x=-9\sim-1$，共 9 個
    合計 13 個 → 答案 (1)
mb111-13:
  key: $2\log y=1$ ⇒ $y^2=10$；代入 $x^{-1/3}\cdot10=1$ ⇒ $x^{1/3}=10$ ⇒ $x=1000$。
  explain: |
    $2\log y=1$ ⇒ $\log(y^2)=1$ ⇒ $y^2=10$。
    $x^{-1/3}\times10=1$ ⇒ $x^{-1/3}=\dfrac{1}{10}$ ⇒ $x^{1/3}=10$ ⇒ $x=1000$。
    $\dfrac{x-y^2}{10}=\dfrac{1000-10}{10}=99$：13-1＝9、13-2＝9
mb114-18:
  key: $\text{UVI}=\text{每平方公尺的焦耳數}\div100$，地面是 4；每升高 300 公尺乘上 1.04，4500 公尺共 15 次。
  explain: |
    地面每平方公尺 400 焦耳 ⇒ $\text{UVI}=400\div100=4$。
    每上升 300 公尺，UVI 變成上升前的 $(1+4\%)=1.04$ 倍；$4500\div300=15$ 次。
    $\text{UVI}=4\times1.04^{15}=4(1+0.04)^{15}$ → 答案 (3)
    (4) 多乘了 100：題目問的是 UVI，不是焦耳數（全國 33% 誤選）。
mb110-09:
  key: 甲總票 $=0.4x+0.55y$，乙 $=0.6x+0.45y$；$\text{甲}-\text{乙}=0.1(y-2x)$，甲勝 ⇔ $\dfrac{x}{y}<\dfrac{1}{2}$。
  explain: |
    $\text{甲}-\text{乙}=(0.4x+0.55y)-(0.6x+0.45y)=0.1y-0.2x=0.1(y-2x)$。
    ⇒ $x:y<\dfrac{1}{2}$ 時甲當選；$x:y>\dfrac{1}{2}$ 時乙當選。
    (1) 只知道 $x+y$，不知道 x、y 的比例 ✗（全國 32% 誤選）
    (2) $x:y<\dfrac{1}{2}$ ⇒ 甲當選 ✓
    (3) $x>y$ ⇒ $\dfrac{x}{y}>1>\dfrac{1}{2}$ ⇒ 乙當選 ✓
    (4) $0.4x>0.55y$ ⇒ $\dfrac{x}{y}>1.375>\dfrac{1}{2}$ ⇒ 乙當選 ✓
    (5) $0.45y>0.6x$ ⇒ $\dfrac{x}{y}<0.75$，可能小於 $\dfrac{1}{2}$，也可能介於 $\dfrac{1}{2}$ 和 0.75 之間 ✗
    → 答案 (2)(3)(4)
mb109-05:
  key: $\sqrt{101}\approx10.05$，距離小於 5 ⇒ 6～15；$\sqrt{38}\approx6.16$，距離大於 3 ⇒ $x<3.16$ 或 $x>9.16$。
  explain: |
    $\sqrt{101}\approx10.05$，$|x-\sqrt{101}|<5$ ⇒ $5.05<x<15.05$ ⇒ 整數 $x=6\sim15$。
    $\sqrt{38}\approx6.16$，$|x-\sqrt{38}|>3$ ⇒ $x<3.16$ 或 $x>9.16$。
    兩個條件都成立：$x=10\sim15$，共 6 個 → 答案 (3)

# ---------- Day 16：多項式與數列 ----------
mb111-09:
  key: $f(1)=0$ ⇒ $f(x)=(x-1)(2x^2+2x-1)$；三次函數的對稱中心在 $x=-\dfrac{b}{3a}=0$。
  explain: |
    $f(1)=2-3+1=0$ ⇒ $f(x)=(x-1)(2x^2+2x-1)$，$2x^2+2x-1=0$ 的判別式 $=4+8>0$。
    (1) 通過 $(1,0)$ ✓
    (2) 和 x 軸有 3 個交點 ✗
    (3) $f(x)$ 沒有 $x^2$ 項，對稱中心是 $(0,f(0))=(0,1)$ ✗
    (4) $f(x)=2x^3-3x+1$，在對稱中心 $(0,1)$ 附近近似直線 $y=-3x+1$ ✗
    (5) 平移不會改變 $x^3$ 的係數；$3x^3-6x^2+2x$ 的 $x^3$ 係數是 3，不是 2 ✗
    → 答案 (1)
mb111-12:
  key: 把 $a(\square)^2+b(\square)+c=0$ 看成原方程式：$\square$ 要落在 1 和 3 之間，再解出 x 的範圍。
  explain: |
    原方程式的兩根 r 都在 1 和 3 之間。$a(g(x))^2+b\cdot g(x)+c=0$ ⇔ $g(x)=r$。
    (1) $x-2=r$ ⇒ $x=r+2$，介於 3 和 5 之間，不一定在 4、5 之間 ✗
    (2) $x+2=r$ ⇒ $x=r-2$，介於 $-1$ 和 1 之間 ✗
    (3) $2x-7=r$ ⇒ $x=\dfrac{r+7}{2}$，介於 4 和 5 之間 ✓
    (4) $\dfrac{x+7}{2}=r$ ⇒ $x=2r-7$，介於 $-5$ 和 $-1$ 之間 ✗
    (5) $3x-11=r$ ⇒ $x=\dfrac{r+11}{3}$，介於 4 和 $\dfrac{14}{3}$ 之間，在 4、5 之間 ✓
    → 答案 (3)(5)
mb109-10:
  key: 把 $x^2$ 當未知數分解：$f(x)=(3x^2-1)(x^2+4)$，實根只有 $\pm\dfrac{1}{\sqrt{3}}$。
  explain: |
    $3x^4+11x^2-4=(3x^2-1)(x^2+4)$。
    $x^2+4=0$ 沒有實根；$3x^2-1=0$ ⇒ $x=\pm\dfrac{1}{\sqrt{3}}\approx\pm0.577$。
    (1) $f(0)=-4<0$ ✓
    (2) 只有 2 個實根 ✗
    (3) $\pm\dfrac{1}{\sqrt{3}}$ 不是有理數，沒有有理根 ✗
    (4) $\dfrac{1}{\sqrt{3}}\approx0.577$ 介於 0 與 1 之間 ✓
    (5) 實根只有 $\pm0.577$，1 與 2 之間沒有根 ✗
    → 答案 (1)(4)
mb110-14:
  key: 一個週期（8 秒）前進 $6\times4=24$；4 個週期（32 秒）走到 96，剩下 20 單位再走 5 秒。
  explain: |
    每個週期 8 秒，前 6 秒以每秒 4 單位前進 ⇒ 每週期 24 單位。
    4 個週期後（32 秒）走到 96；第 5 個週期一開始就在移動，剩下 $116-96=20$ 單位要 $20\div4=5$ 秒。
    共 $32+5=37$ 秒：⑭＝3、⑮＝7
    $20<24$，抵達時還在第 5 個週期的移動時段，不用再加休息的 2 秒。
mb109-08:
  key: 得 100 元＝恰好滿足一個條件；第三顆點數 x，分別檢查 (A) 全奇或全偶、(B) 排序後成等差。
  explain: |
    已知兩顆是 1、3（都是奇數），第三顆 x：
    (A) 三個點數同奇偶 ⇔ x 是奇數（1、3、5）
    (B) 由小到大成等差：$\{1,2,3\}$、$\{1,3,5\}$ ⇒ $x=2$ 或 5
    恰好滿足一個條件才是 100 元：
    $x=1$：只滿足 (A)（1,1,3 不是等差）；$x=2$：只滿足 (B)；$x=3$：只滿足 (A)
    $x=4$、6：兩個都不滿足；$x=5$：兩個都滿足，是 200 元
    選項中可能的是 2、3 → 答案 (1)(2)

# ---------- Day 17：三角函數與三角測量 ----------
mb111-18:
  key: 180° 等於 $\pi$ 弧度，$18^{\circ}=18\times\dfrac{\pi}{180}=\dfrac{\pi}{10}$。
  explain: |
    $180^{\circ}=\pi$ 弧度 ⇒ $1^{\circ}=\dfrac{\pi}{180}$。
    $18^{\circ}=18\times\dfrac{\pi}{180}=\dfrac{\pi}{10}$ → 答案 (4)
mb110-03:
  key: $PB=PC$，$\triangle PBC$ 等腰，$\angle PBC=90^{\circ}-\dfrac{\theta}{2}$；弦切角 $\angle PBC=\angle A$。
  explain: |
    PB、PC 是切線 ⇒ $PB=PC$，$\triangle PBC$ 是等腰三角形，$\angle PBC=\dfrac{180^{\circ}-\theta}{2}=90^{\circ}-\dfrac{\theta}{2}$。
    弦切角：切線 PB 和弦 BC 的夾角＝弦 BC 所對的圓周角 ⇒ $\angle A=\angle PBC=90^{\circ}-\dfrac{\theta}{2}$。
    $\cos A=\cos\left(90^{\circ}-\dfrac{\theta}{2}\right)=\sin\left(\dfrac{\theta}{2}\right)$ → 答案 (3)
    另解：設圓心 O，$\angle BOC=2 \angle A$；四邊形 OBPC 中 $\angle OBP=\angle OCP=90^{\circ}$，所以 $2 \angle A+\theta=180^{\circ}$。
mb109-01:
  key: $\sin\alpha=\dfrac{\text{對邊}}{\text{斜邊}}=\dfrac{3}{5}=0.6$；$\sin\beta=\dfrac{5}{13}\approx0.38$；$\sin30^{\circ}=0.5$。
  explain: |
    $\alpha$ 在 3、4、5 的直角三角形中，對邊是 3 ⇒ $\sin\alpha=\dfrac{3}{5}=0.6$。
    $\beta$ 在 5、12、13 的直角三角形中，對邊是 5 ⇒ $\sin\beta=\dfrac{5}{13}\approx0.385$。
    $\sin30^{\circ}=0.5$ ⇒ $\sin\alpha>\sin30^{\circ}>\sin\beta$ → 答案 (2)
mb109-17:
  key: 箏形的對稱軸是 BD，$AC\perp BD$；先用餘弦定理求 BD，再用面積求 A 到 BD 的距離。
  explain: |
    $AB=BC$、$AD=CD$ ⇒ 對角線 BD 是對稱軸，$AC\perp BD$，且 BD 平分 AC。
    $\triangle ABD$：$BD^2=2+4-2\times\sqrt{2}\times2\times\cos135^{\circ}=6+4=10$ ⇒ $BD=\sqrt{10}$
    $\triangle ABD$ 面積 $=\dfrac{1}{2}\times\sqrt{2}\times2\times\sin135^{\circ}=1$
    A 到 BD 的距離 $=2\times\dfrac{1}{\sqrt{10}}=\dfrac{2}{\sqrt{10}}$ ⇒ $AC=2\times\dfrac{2}{\sqrt{10}}=\dfrac{4}{\sqrt{10}}=\dfrac{2\sqrt{10}}{5}$
    ㉑＝2、㉒＝1、㉓＝0、㉔＝5
mb109-07:
  key: $y=-\sqrt{3}x^3$ 的圖形對稱於原點，單位圓也對稱於原點 ⇒ 交點 P 的對稱點 $-P$ 也是交點。
  explain: |
    $f(x)=-\sqrt{3}x^3$ 滿足 $f(-x)=-f(x)$，圖形對稱於原點；單位圓也對稱於原點。
    P 在兩個圖形上 ⇒ $-P=(-\cos\theta,-\sin\theta)$ 也在兩個圖形上。
    $y=-\sqrt{3}x^3$ 遞減，和單位圓只有兩個交點 ⇒ $Q=(-\cos\theta,-\sin\theta)=(-\cos\theta,\sin(-\theta))$ → 答案 (4)

# ---------- Day 18：坐標幾何與平面向量 ----------
mb111-08:
  key: 光束是射線 $y=ax$（$x\ge0$）；擊中靶子 ⇔ 圓心到直線的距離 $\le1$。
  explain: |
    光束沿原點往 $(1,a)$ 方向射出，落在直線 $ax-y=0$ 上。圓心 $(p,q)$ 到直線的距離 $=\dfrac{|ap-q|}{\sqrt{1+a^2}}$，$\le1$ 就擊中。
    (1) 過原點、斜率 a 的直線 ✓
    (2) $a=\dfrac{3}{2}$：$(4,6)$ 到直線的距離 $=\dfrac{|6-6|}{\sqrt{13/4}}=0$，正好通過圓心 ✓
    (3) 擊中 $(4,6)$：$(4a-6)^2\le1+a^2$ ⇒ $15a^2-48a+35\le0$ ⇒ 約 $1.12\le a\le2.08$；擊中 $(8,1)$ 要 $a\le\dfrac{16}{63}\approx0.25$（見 (5)），兩個範圍沒有交集，一道光束做不到 ✗
    (4) $a=1.3$ 時，$(2,2)$、$(4,6)$ 的距離分別約 0.37、0.49，一道光束就能擊中兩個靶，再加一道打 $(8,1)$，兩道就夠 ✗
    (5) 擊中 $(8,1)$：$|8a-1|\le\sqrt{1+a^2}$ ⇒ $63a^2-16a\le0$ ⇒ $0\le a\le\dfrac{16}{63}$ ✓
    → 答案 (1)(2)(5)
mb111-11:
  key: $\overrightarrow{OD}$、$\overrightarrow{OE}$ 可以寫成 $-(\alpha\overrightarrow{OA}+\beta\overrightarrow{OB})$（$\alpha$、$\beta>0$），和 $\overrightarrow{v}$ 的內積一定小於 0；其他點都找得到內積為正的 $\overrightarrow{v}$。
  explain: |
    $\overrightarrow{v}\cdot\overrightarrow{OA}>0$、$\overrightarrow{v}\cdot\overrightarrow{OB}>0$ ⇒ 對任何正數 $\alpha$、$\beta$，$\overrightarrow{v}\cdot(\alpha\overrightarrow{OA}+\beta\overrightarrow{OB})>0$。
    圖中 D、E 落在 $-\overrightarrow{OA}$ 與 $-\overrightarrow{OB}$ 之間的範圍（第二、三象限，夾在 A、B 的反方向之間）⇒ $\overrightarrow{OD}$、$\overrightarrow{OE}=-(\alpha\overrightarrow{OA}+\beta\overrightarrow{OB})$ ⇒ $\overrightarrow{v}\cdot\overrightarrow{OD}<0$、$\overrightarrow{v}\cdot\overrightarrow{OE}<0$ ✓
    C、F、G 不在這個範圍：
    (1) 取 v 沿 OB 方向，OB 和 OC 的夾角小於 90°，內積為正 ✗
    (4) 取 v 在 OA 稍微往下轉的方向，和 OF 的夾角會小於 90° ✗
    (5) 取 v 沿 OA 方向，A、G 都在第四象限，內積為正 ✗
    → 答案 (2)(3)
mb111-04:
  key: $Q=P+\overrightarrow{PQ}=\left(\log\dfrac{1}{2}+\log\dfrac{1}{5},2^{-5}-10^{-5}\right)=(-1,\text{正數})$。
  explain: |
    Q 的 x 坐標 $=\log\dfrac{1}{2}+\log\dfrac{1}{5}=\log\dfrac{1}{10}=-1$。
    Q 的 y 坐標 $=2^{-5}-10^{-5}=\dfrac{1}{32}-0.00001>0$。
    $x<0$、$y>0$ ⇒ Q 在第二象限 → 答案 (2)
mb115-18:
  key: 起點 $(8,0)$、終點 $(0,0)$ 的連線在 x 軸上，中點 $(4,0)$，中垂線是鉛直線 $x=4$。
  explain: |
    兩點 $(8,0)$、$(0,0)$ 都在 x 軸上，中點是 $(4,0)$。
    中垂線過中點且垂直 x 軸 ⇒ $x=4$ → 答案 (1)
mb112-18:
  key: 先求消失點 $P=L\cap M$；由 $A_3B_3=2A_1B_1$ 找出 $A_3$ 的位置，再比較 $PA_1$ 和 $PA_3$。
  explain: |
    L：$x+3y=0$ 與 M：$2x-3y+9=0$ 相加得 $3x+9=0$ ⇒ $x=-3$、$y=1$，$P=(-3,1)$。
    電線桿平行 y 軸：$A_3=\left(t,-\dfrac{t}{3}\right)$、$B_3=\left(t,\dfrac{2t+9}{3}\right)$，$A_3B_3=\dfrac{2t+9}{3}+\dfrac{t}{3}=t+3$。
    $A_1B_1=3$ ⇒ $t+3=6$ ⇒ $t=3$，$A_3=(3,-1)$。
    $\overrightarrow{PA_1}=(3,-1)$、$\overrightarrow{PA_3}=(6,-2)$ ⇒ $\overrightarrow{PA_1}=\dfrac{1}{2}\overrightarrow{PA_3}$，$k=\dfrac{1}{2}$：18-1＝1、18-2＝2

# ---------- Day 19：向量、矩陣與空間概念 ----------
mb113-18:
  key: 截去 8 個角：原本 6 個面各剩中間一塊，再多出 8 個三角形截面，共 14 個面。
  explain: |
    長方體有 6 個面、8 個頂點。每個角截下去，截面通過三條鄰邊的中點，是一個三角形。
    原來的 6 個面都還在（各剩下連接四邊中點的四邊形）；8 個角各多出 1 個三角形的面。
    $6+8=14$ ⇒ 十四面體 → 答案 (4)
mb111-07:
  key: 等距的四點 $K=\dfrac{3d\times d}{2d\times2d}=\dfrac{3}{4}$；畫在紙上的四點 K 值也要是 $\dfrac{3}{4}$，且順序不變。
  explain: |
    $Q_1Q_2=Q_2Q_3=Q_3Q_4=d$ ⇒ $K=\dfrac{Q_1Q_4\times Q_2Q_3}{Q_1Q_3\times Q_2Q_4}=\dfrac{3d\times d}{2d\times2d}=\dfrac{3}{4}$。
    逐一計算選項的 K：
    (1) 1,2,4,8：$\dfrac{7\times2}{3\times6}=\dfrac{7}{9}$
    (2) 3,4,6,9：$\dfrac{6\times2}{3\times5}=\dfrac{4}{5}$
    (3) 1,5,8,9：$\dfrac{8\times3}{7\times4}=\dfrac{6}{7}$
    (4) 1,2,4,9：$\dfrac{8\times2}{3\times7}=\dfrac{16}{21}$
    (5) 1,7,9,10：$\dfrac{9\times2}{8\times3}=\dfrac{3}{4}$ ✓
    → 答案 (5)
mb110-11:
  key: 過 B 作 AD 的平行線交 DC 於 E′：$\triangle BE'C$ 的三邊是 $BC+1$、BC、5，角度和內積都能從這個三角形算。
  explain: |
    設 $BC=x$，$AD=x+1$。過 B 作 $BE'\parallel AD$ 交 DC 於 E′：ABE′D 是平行四邊形，$BE'=x+1$、$E'C=15-10=5$。
    在 $\triangle BE'C$ 中 $BE'>BC$ ⇒ $\angle C>\angle BE'C=\angle D$。
    (1) $\angle A=180^{\circ}-\angle D$、$\angle B=180^{\circ}-\angle C$，$\angle C>\angle D$ ⇒ $\angle A>\angle B$ ✓
    (2) $\angle B+\angle D=180^{\circ}-\angle C+\angle D<180^{\circ}$ ✓
    (3) $\angle B$ 可能是直角：例如 $BC=12$、$AD=13$（高 12）時 $\angle B=90^{\circ}$，$\overrightarrow{BA}\cdot\overrightarrow{BC}=0$ ✗
    (4) $\triangle BE'C$ 的三角形不等式：$x+(x+1)>5$ ⇒ $x>2$，BC 不能是 2 ✗
    (5) 餘弦定理：$(x+1)^2=x^2+25-10x\cdot\cos C$ ⇒ $x\cdot\cos C=\dfrac{24-2x}{10}$，$\overrightarrow{CB}\cdot\overrightarrow{CD}=15x\cdot\cos C=36-3x<30$（因為 $x>2$）✓
    → 答案 (1)(2)(5)
mb109-03:
  key: 正六邊形中 $\overrightarrow{OD}=\overrightarrow{OC}+\overrightarrow{OE}$；以 $\overrightarrow{OC}$、$\overrightarrow{OE}$ 為基底，$\triangle ODE$ 內部 ⇔ $\overrightarrow{OP}=x\cdot\overrightarrow{OC}+y\cdot\overrightarrow{OE}$，$0<x<y<1$。
  explain: |
    正六邊形中 OCDE 是菱形 ⇒ $\overrightarrow{OD}=\overrightarrow{OC}+\overrightarrow{OE}$。
    寫成 $\overrightarrow{OP}=x\cdot\overrightarrow{OC}+y\cdot\overrightarrow{OE}$：O 對應 $(0,0)$、E 對應 $(0,1)$、D 對應 $(1,1)$。
    $\triangle ODE$ 內部（不含邊界）⇔ $x>0$、$y<1$、$y>x$，也就是 $0<x<y<1$。
    (1) $(1,1)$ 是 D 點，在邊界上 ✗
    (2) $\left(\dfrac{1}{4},\dfrac{1}{2}\right)$：$0<\dfrac{1}{4}<\dfrac{1}{2}<1$ ✓
    (3)(5) $x<0$ ✗；(4) $y<0$ ✗
    → 答案 (2)
mb110-01:
  key: A 是上三角矩陣，$A^2=\begin{bmatrix}1&8\\0&9\end{bmatrix}$，$A^4=(A^2)^2$。
  explain: |
    $A^2=\begin{bmatrix}1&2\\0&3\end{bmatrix}\cdot\begin{bmatrix}1&2\\0&3\end{bmatrix}=\begin{bmatrix}1&8\\0&9\end{bmatrix}$
    $A^4=(A^2)^2=\begin{bmatrix}1&8\\0&9\end{bmatrix}\cdot\begin{bmatrix}1&8\\0&9\end{bmatrix}=\begin{bmatrix}1&8+72\\0&81\end{bmatrix}=\begin{bmatrix}1&80\\0&81\end{bmatrix}$
    $a+b+c+d=1+80+0+81=162$ → 答案 (2)

# ---------- Day 20：機率與數據分析 ----------
mb111-15:
  key: 條件機率：$P(\text{找到}\mid\text{有裝})=\dfrac{P(\text{找到且有裝})}{P(\text{有裝})}$。
  explain: |
    找到且有裝：$0.7\times0.6=0.42$
    沒找到且有裝：$0.3\times(1-0.9)=0.03$
    $P(\text{找到}\mid\text{有裝})=\dfrac{0.42}{0.42+0.03}=\dfrac{0.42}{0.45}=\dfrac{14}{15}$：15-1＝1、15-2＝4、15-3＝1、15-4＝5
mb111-16:
  key: 由「兩球都藍」「兩球都綠」的機率反推球數：$C(b,2)=3$、$C(g,2)=10$。
  explain: |
    $C(10,2)=45$。$\dfrac{C(\text{藍},2)}{45}=\dfrac{1}{15}$ ⇒ $C(\text{藍},2)=3$ ⇒ 藍 3 顆；$\dfrac{C(\text{綠},2)}{45}=\dfrac{2}{9}$ ⇒ $C(\text{綠},2)=10$ ⇒ 綠 5 顆；黃 2 顆。
    同色：$C(3,2)+C(5,2)+C(2,2)=3+10+1=14$ ⇒ 同色機率 $\dfrac{14}{45}$
    相異顏色 $=1-\dfrac{14}{45}=\dfrac{31}{45}$：16-1＝3、16-2＝1、16-3＝4、16-4＝5
mb111-10:
  key: $y=ax+b$ ⇒ 平均也是 $a\times\text{原平均}+b$、標準差是 $|a|\times\text{原標準差}$；反推兩班的原始平均與標準差。
  explain: |
    甲班：$60=0.8\mu_1+20$ ⇒ $\mu_1=50$；$16=0.8\sigma_1$ ⇒ $\sigma_1=20$
    乙班：$60=0.75\mu_2+25$ ⇒ $\mu_2\approx46.7$；$15=0.75\sigma_2$ ⇒ $\sigma_2=20$
    (1) $0.8x+20\ge x$ ⇔ $x\le100$，滿分 100，每個人都不會被調低 ✓
    (2) 甲班原始平均 50＞乙班約 46.7 ✓
    (3) 兩班原始標準差都是 20 ✗
    (4) $0.8x_A+20>0.75x_B+25$ ⇒ $x_A>0.9375x_B+6.25$；$x_B\le100$ 時 $0.9375x_B+6.25\ge x_B$ ⇒ $x_A>x_B$ ✓
    (5) 調整後不及格：甲班是原始分數＜50 的人、乙班是原始分數＜約 46.7 的人；原始分數＜60 的人數無法比較 ✗
    → 答案 (1)(2)(4)
mb110-07:
  key: 「實際是 6 被看成…」是表中的一列；「被看成 6 而實際是 6」要用條件機率，三張卡出現機會相同。
  explain: |
    (1) 實際是 8 被看成 8 的機率是 0.4，不到一半 ✗
    (2) 實際是 6 被看成不是 6：$1-0.4=0.6$ ✓
    (3) 被看錯的機率：6 是 0.6、8 是 0.6、9 是 0.5，以 9 最低 ✓
    (4) 三張卡出現的機會一樣：$P(\text{實際 6}\mid\text{看成 6})=\dfrac{0.4}{0.4+0.3+0.2}=\dfrac{4}{9}<\dfrac{1}{2}$ ✓
    (5) $P(\text{實際 9}\mid\text{看成 9})=\dfrac{0.5}{0.2+0.1+0.5}=\dfrac{5}{8}=0.625<\dfrac{2}{3}$ ✗
    → 答案 (2)(3)(4)
mb109-15:
  key: 第一次任意顏色，第二、三次都和前一次同色，各 $\dfrac{1}{3}$。
  explain: |
    第一次出現什麼顏色都可以（機率 1）。
    第二次和第一次同色：$\dfrac{1}{3}$；第三次和第二次同色：$\dfrac{1}{3}$。
    三次都同色的機率 $=1\times\dfrac{1}{3}\times\dfrac{1}{3}=\dfrac{1}{9}$：⑰＝1、⑱＝9

# ---------- Day 21：計數、矩陣與綜合 ----------
mb111-03:
  key: 8 棟選 3 棟不相鄰：$C(6,3)=20$；扣掉含 3 號的情形。
  explain: |
    8 棟選 3 棟互不相鄰：用插空法，5 棟不選的大廈之間（含兩端）有 6 個空位，選 3 個 ⇒ $C(6,3)=20$ 種。
    含 3 號：2、4 號不能選，另外兩棟從 $\{1,5,6,7,8\}$ 選且不相鄰：
    1 配 5、6、7、8 共 4 種；$\{5,6,7,8\}$ 中不相鄰的 $(5,7)$、$(5,8)$、$(6,8)$ 共 3 種 ⇒ 7 種。
    $20-7=13$ 種 → 答案 (2)
mb111-17:
  key: 三男不全在同一側 ⇒ 一側 2 男 1 女、另一側 1 男 2 女；再扣掉那一對女生、男生相鄰的排法。
  explain: |
    老師在第 4 位，左右各 3 人。三位男生不全在同一側 ⇒ 一側 2 男 1 女、另一側 1 男 2 女：
    選哪一側 2 男（2）×選哪 2 位男生（3）×選哪位女生跟他們同側（3）×兩側各自排列（$3!\times3!$）＝648 種。
    扣掉有過不愉快的女甲、男甲相鄰（左右兩側之間隔著老師，只會在同一側相鄰）：
    ① 兩人都在 2 男那一側：選側（2）×另一位男生（2）×該側三人排列中兩人相鄰的 4 種×另一側 $3!$＝96
    ② 兩人都在 1 男那一側：選側（2）×另一位同側的女生（2）×4×另一側 $3!$＝96
    $648-96-96=456$ 種：17-1＝4、17-2＝5、17-3＝6
mb109-12:
  key: 逐年檢查表格：注意單位（萬人、千人），比率要換成同單位再比。
  explain: |
    (1) 65 歲以上：69.7→72.6→73.2→73.3→74.8→79.4（2013–2018）逐年遞增 ✓
    (2) 50–64 歲在 2016 年從 181.3 降到 176.4 ✗
    (3) 男性農業就業人口換成萬人約 38.6～41.5 萬，總就業人口 1,070～1,143 萬，比率約 3.6%，每年都小於 5% ✓
    (4) 2011 年 50–64 歲 164.2 千人，比 49 歲以下 $67.6+85.4=153.0$ 千人多 ✗
    (5) 65 歲以上：$79.4-69.1=10.3$ 千人＝1.03 萬人，超過一萬人 ✗
    → 答案 (1)(3)
mb109-04:
  key: $BA=(I+A+A^{-1})A=A+A^2+I$，不必真的求反矩陣。
  explain: |
    $BA=(I+A+A^{-1})A=A+A^2+I$（$A^{-1}A=I$）。
    $A^2=\begin{bmatrix}1&1\\3&4\end{bmatrix}\cdot\begin{bmatrix}1&1\\3&4\end{bmatrix}=\begin{bmatrix}4&5\\15&19\end{bmatrix}$
    $BA=\begin{bmatrix}1&0\\0&1\end{bmatrix}+\begin{bmatrix}1&1\\3&4\end{bmatrix}+\begin{bmatrix}4&5\\15&19\end{bmatrix}=\begin{bmatrix}6&6\\18&24\end{bmatrix}$ → 答案 (5)
mb109-09:
  key: OP、OQ 和 L 的銳角夾角都是 30° ⇒ 兩向量的夾角只可能是 60°、120° 或 180°。
  explain: |
    以 L 的方向為 0°，OP、OQ 的方向只能是 30°、$-30^{\circ}$、150°、210° 其中之一（和 L 夾銳角 30°）。
    P、Q 相異，兩向量的夾角可能是 60°、120° 或 180°。
    $\overrightarrow{OP}\cdot\overrightarrow{OQ}=2\times2\times\cos(\text{夾角})=2$、$-2$、$-4$。
    選項中 $-2$、$-4$ 可能發生 → 答案 (4)(5)

# ---------- 第 3 週上課：混合題實作（114 年第 19–20 題；第 18 題在 Day 15）----------
mb114-19:
  key: $f(0)=f(12)=0$ 且中間都是正的 → 12 小時是半個週期，$12b=\pi$，$b=\dfrac{\pi}{12}$；$f(2)=a \sin\left(\dfrac{\pi}{6}\right)=4$ → $a=8$。
  reference: |
    日照的 12 小時內 $f(x)>0$，而且 $f(0)=f(12)=0$ → $0\le x\le12$ 剛好是正弦函數的半個週期：$12b=\pi$，$b=\dfrac{\pi}{12}$。
    （若 $12b=2\pi$ 或更大，0 到 12 之間會出現 $f(x)\le0$ 的時候，不合題意。）
    $f(2)=a \sin\left(\dfrac{2\pi}{12}\right)=a \sin\left(\dfrac{\pi}{6}\right)=\dfrac{a}{2}=4$ → $a=8$。
    答：$a=8$，$b=\dfrac{\pi}{12}$。
    評分重點（大考中心評分原則）：要依題意列出 a、b 須滿足的關係式，再求出正確的 a、b，兩項都對才滿分；過程部分正確可得部分分數。
mb114-20:
  key: $4\sqrt{2}\le8 \sin\left(\dfrac{\pi t}{12}\right)\le4\sqrt{3}$ → $\dfrac{\sqrt{2}}{2}\le\sin\left(\dfrac{\pi t}{12}\right)\le\dfrac{\sqrt{3}}{2}$ → $\dfrac{\pi t}{12}$ 在 $\left[\dfrac{\pi}{4},\dfrac{\pi}{3}\right]$ 或 $\left[\dfrac{2\pi}{3},\dfrac{3\pi}{4}\right]$ → $3\le t\le4$ 或 $8\le t\le9$。
  reference: |
    由第 19 題，$f(t)=8 \sin\left(\dfrac{\pi t}{12}\right)$，$0\le t\le12$。
    $4\sqrt{2}\le8 \sin\left(\dfrac{\pi t}{12}\right)\le4\sqrt{3}$ → $\dfrac{\sqrt{2}}{2}\le\sin\left(\dfrac{\pi t}{12}\right)\le\dfrac{\sqrt{3}}{2}$。
    在 $0\le\dfrac{\pi t}{12}\le\pi$ 的範圍內：$\dfrac{\pi}{4}\le\dfrac{\pi t}{12}\le\dfrac{\pi}{3}$ 或 $\dfrac{2\pi}{3}\le\dfrac{\pi t}{12}\le\dfrac{3\pi}{4}$。
    → $3\le t\le4$ 或 $8\le t\le9$。
    注意：正弦在 0 到 $\pi$ 之間先升後降，上午、下午各有一段，兩段都要寫。
    評分重點（大考中心評分原則）：要正確列出 $f(t)$ 須滿足的不等式，並求出 t 的最大可能範圍，兩項都對才滿分；過程部分正確可得部分分數。
