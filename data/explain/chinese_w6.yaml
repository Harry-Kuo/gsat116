# 國文 Day 36–39 解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。

# ---------- Day 36：臺灣杉、福爾摩斯的破綻 ----------
chn115-06:
  key: 學者推測臺灣杉祖先原本廣布東亞，因第四紀冰河期而分布破碎化 → 時空環境影響分布，冰河期是關鍵。
  explain: |
    (D) 依 DNA 與分子鐘的分析，學者推測臺灣杉「受第四紀冰河期影響而導致分布破碎化」，避難所的族群再擴張出去 ✓
    (A) 全文主軸是臺灣杉的發現、化石分布與遺傳分析，祖先如何擴張只在最後略提 ✗
    (B) 早田文藏根據的是小西成章採的標本，沒有化石（全國 22% 誤選）✗
    (C) 最古老的化石在阿拉斯加，文中沒說臺灣杉是從亞洲南部擴散出去（全國 12% 誤選）✗
chn115-07:
  key: 臺灣杉億萬年來樣貌幾乎沒變，基因卻各自演化 → ①符合；後來在中國、緬甸、越南也有發現，「臺灣特有屬的位階不再」→ ②不符合。
  explain: |
    ① 「億萬年來臺灣杉似乎未改變樣貌」，臺灣島與亞洲大陸的族群「各自演化出新的或保留了獨特的古老基因型」→ 符合
    ② 臺灣杉相繼在中國大陸、緬甸、越南被發現，「臺灣特有屬的位階不再」；遺傳多樣性高也不能證明它是特有屬 → 不符合
    (C) ①符合，②不符合 ✓
chn115-08:
  key: 方框是論文作者說「本研究……」，報告自己的成果；底線處是作者綜述「依據……取樣的結果，發現……」→ 都客觀，但角色不同。
  explain: |
    (D) 方框用「本研究使用……」，是研究者自述成果；底線處說「依據現生臺灣杉族群DNA取樣的結果，發現……」，是寫作者綜合別人的研究；兩者都沒有主觀評價 ✓
    (A) 底線處也是客觀說明，沒有加入個人感受 ✗
    (B) 底線處也用了「遺傳多樣性」「基因型」「分子鐘」等專有名詞（全國 22% 誤選）✗
    (C) 兩段都沒有談研究限制或他人觀點 ✗
chn115-09:
  key: 福爾摩斯因毛巾是乾的，誤判死者沒下水；那死者和水母纏鬥時頭髮也沒溼嗎？→ 感嘆道爾的線索安排太粗疏。
  explain: |
    (A) 作者用「半根頭髮都沒溼嘍」反諷：毛巾乾不代表沒下水，這個線索設計不合理，「唉」是對道爾寫作疏漏的感嘆 ✓
    (B) 作者說「先別管故事裡的水母是否真那麼危險」，感嘆的不是水母 ✗
    (C) 這段在說線索的漏洞，不是福爾摩斯不會敘事 ✗
    (D) 福爾摩斯自己說出原先誤判的原因，不是不坦誠（全國 16% 誤選）✗
chn115-10:
  key: 華生太太死於 1893 年，故事卻寫 1903 年華生結婚期間 → 福爾摩斯迷「懷疑善良的華生結過不只一次婚」，替錯誤找到新解釋。
  explain: |
    (C) 時間前後矛盾，福爾摩斯迷不說作者寫錯，而是推想華生再婚 → 順著錯誤產生新的解釋 ✓
    (A) 文中批評的疏漏不只出現在改換敘事者的作品，也沒說改換敘事者就容易失誤（全國 26% 誤選）✗
    (B) 「一般讀者雖不必像福爾摩斯迷那樣」懂歌劇唱片，也知道當時的唱片不能播五分鐘 ✗
    (D) 「總能」太絕對；文中舉〈皮膚變白的軍人〉的病情巧合「實在牽強」（全國 15% 誤選）✗

# ---------- Day 37：俠與士、勞山道士、氣候變遷 ----------
chn115-11:
  key: 「儒家傳統中本有一股『狂』的精神，能與『俠風』一拍即合」→ 俠風和儒者的批判精神相契。
  explain: |
    (D) 後世富於批判精神的儒者「往往帶有『俠氣』」，因為儒家的「狂」與俠風一拍即合 ✓
    (A) 東漢起俠「進入儒生文士的道德意識中」，兩者相互影響，不是對立（全國 10% 誤選）✗
    (B) 方向相反：是「士」的議政傳統受到俠的見義勇為影響，不是俠的氣概源自儒家（全國 15% 誤選）✗
    (C) 東漢時俠作為武力集團已經解體，成為一種精神；文中沒說俠的勢力超過以往 ✗
chn115-12:
  key: 文章拿西方騎士對照的是「俠」不屬於國家武力；全文重點是俠對「士」批判精神的影響，不是俠文化的興衰。
  explain: |
    ① 第一段以騎士對照的是「俠」：騎士是國家武力的主體，俠卻被朝廷視為敵對；第三段說「士」和騎士相似，談的是維持秩序與批判傳統，不是武力 → 不符合
    ② 文章討論俠如何進入士的道德意識、影響儒者的批判精神，不是比較儒家與俠來說明俠文化的興衰 → 不符合
    (B) ①、②皆不符合 ✓
    (C) ①不符合（全國 22% 誤選）✗　(D) ②可以判斷為不符合（全國 25% 誤選）✗
chn115-13:
  key: 孟子說紂王是殘害仁義的「一夫」，殺他不算弒君 → 以「道」評判君王、不屈服於權威。
  explain: |
    畫線處是「不肯屈服於權威、持『道』以議政」的批判傳統。
    (B) 孟子以仁義為標準，認為殘害仁義的君主只是「一夫」，誅紂不是弒君 → 敢於批判君權 ✓
    (A) 說明桀紂失天下是因為失去民心，講的是得民心的道理，沒有不屈服於權威的意味（全國 13% 誤選）✗
    (C) 荀子說天的運行有常規，人要用正確的方法應對，和議政無關（全國 49% 誤選）✗
    (D) 子貢說紂的惡名有些被誇大，所以君子不願居於下流，是勸人自重，不是批判權威（全國 22% 誤選）✗
chn111-33:
  key: 甲文只敘事、不發議論；乙文開頭「奇門遁甲之書……皆非真傳」是作者的看法，再接著說宋清遠的故事。
  explain: |
    (B) 甲文全是王生學道的經過，作者沒有現身評論；乙文先說「奇門遁甲之書，所在多有，然皆非真傳。真傳不過口訣數語」，表達作者的看法，再述說宋清遠與友人的故事 ✓
    (A) 「二鼓後，見一人踰垣入……友笑遣之」是依時間順序發生的事，不是插補的追憶（全國 16% 誤選）✗
    (C) 宋清遠「謝不願」學法術，文中沒有寫他畏苦怕難；短垣是友人施法造成的幻象（全國 16% 誤選）✗
    (D) 王生「慚忿，罵老道士之無良」，是惱羞成怒，不是愧疚；友人「悵悵」是嘆惜法術將要失傳 ✗
chn111-37:
  key: 作者悲觀是因為不相信各國能在短期內貫徹減碳；日韓不連署（②）、措辭由「淘汰」改「減少」（④）都是減碳打折扣。
  explain: |
    作者「不覺得人們能在短期內貫徹解方」：要關閉汙染的能源基礎設施、有周全的能源政策、人人接受受限的生活。
    ② 日、韓等大金主國沒有加入終止化石燃料投資的連署 → 各國難以一致行動，印證悲觀
    ④ 協定措辭從「逐步淘汰」退為「逐步減少」→ 減碳承諾打折扣，印證悲觀
    ① 提供資金、③ 確立碳交易規則都是因應氣候變遷的進展，不能印證悲觀
    (B) ②④ ✓
    (D) 多了①（全國 24% 誤選）✗　(C) 多了①③（全國 13% 誤選）✗

# ---------- Day 38：肥皂的歷史、〈出師表〉 ----------
chn115-16:
  key: 皂莢「莢之樹皂，故名」（皂是黑色）；肥皂莢「肥厚多肉」→ 一個名稱和顏色有關，一個和莢果有關。
  explain: |
    (D) 《本草綱目》說皂莢「莢之樹皂，故名」，皂是黑色；肥皂莢「結莢……肥厚多肉」，《雞肋編》也說「膏潤於皂莢，故一名肥皂」✓
    (A) 文中沒說洗淨力取決於莢果長短；皂莢是「以多脂者為佳」✗
    (B) 「將果實搗碎加水揉搓」就能洗濯；煮熟搗爛是製作肥皂團的步驟（全國 29% 誤選）✗
    (C) 有一種皂莢「全無滋潤」，而肥皂團「去垢而膩潤，勝於皂莢」→ 皂莢的滋潤不比肥皂莢好（全國 11% 誤選）✗
chn115-17:
  key: 李漁說好香皂「價值稍昂」，文中也說香皂在富貴家庭普遍使用，尋常百姓家少見 → 象徵身分與品味。
  explain: |
    (B) 西門慶、《紅樓夢》的賈府都是富貴人家；李漁說六合縣的香皂最好但「價值稍昂」，量少時只用來洗臉 → 香皂可以區別身分階層 ✓
    (A) 文中沒有藉香皂談人心的淨化 ✗
    (C) 李漁提到產地，是說哪裡的品質最好，不是植物分布的特色 ✗
    (D) 文中沒談到依功能客製化 ✗
chn115-18:
  key: 手工皂用植物油低溫皂化、保留天然甘油、保溼力高；工業皂製程快、成本低，又加了防腐劑。
  explain: |
    (D) 手工皂以「植物油與草本萃取物」製成，「保留了天然甘油，保溼力高」；工業皂「製程快、成本低」，添加防腐劑 ✓
    (A) 古代肥皂團是把含皂素的果實搗爛加入麵粉與香料，不是經過皂化反應（全國 8% 誤選）✗
    (B) 皂化反應是油脂和鹼性物質作用；香料、防腐劑是另外添加的，也沒有「合成皂素」（全國 14% 誤選）✗
    (C) 文中只說防腐劑可能刺激皮膚，沒說工業皂抗菌力高（全國 17% 誤選）✗
chn115-30:
  key: 諸葛亮感念先帝與陛下、自謙「駑鈍」仍願北伐；曹操「復蒙試用」受上將之任，自謙「闇鈍之才」仍願竭節授命。
  explain: |
    (C) 乙文「臣不勝受恩感激」，要以北伐「報先帝而忠陛下」；丙文「陛下即祚，復蒙試用，遂受上將之任」→ 都感念國君在用人之際賦予重任 ✓（全國 44% 漏選）
    (D) 乙文「庶竭駑鈍」；丙文「以區區之質，而當鐘鼎之任；以闇鈍之才，而奉明明之政」→ 謙稱能力有限，仍願承擔 ✓
    (A) 郭攸之、費禕、董允原本就是侍中、侍郎；「不效，則治臣之罪」是說自己北伐不成願受罰，不是識人不明（全國 32% 誤選）✗
    (B) 曹操條列的是「遵奉舊訓權時之宜十四事」：遵循舊訓、因應時勢的十四件事，不是要揚棄舊訓（全國 31% 誤選）✗
    (E) 乙文「願陛下託臣以討賊興復之效」，但丙文沒有要求國君授權作後盾（全國 47% 誤選）✗
chn115-31:
  key: 〈出師表〉屢提先帝、以「臨表涕泣」收尾，打破表的常規；兩文雖少了部分套語，仍保持臣下的口吻。
  explain: |
    (A) 甲文說「文中十三次提及『先帝』，使『陛下』成了虛位」→「上」不只陛下一人 ✓（全國 31% 漏選）
    (B) 以「今當遠離，臨表涕泣，不知所云」取代「誠惶誠恐，稽首頓首」，像長輩叮嚀晚輩般真情流露 ✓（全國 30% 漏選）
    (E) 兩文仍以「臣」自稱、稱「陛下」，用謙敬的語氣進言 ✓（全國 28% 漏選）
    (C) 「實所不堪」是謙稱自己不能勝任重任，不是在職位間猶豫，也沒暗示朝廷依賴他（全國 36% 誤選）✗
    (D) 「庶以蒸螢增明太陽」是把自己比作微小的螢火、國君比作太陽，是謙敬，不是暗諷國君（全國 16% 誤選）✗

# ---------- Day 39：懷素〈自敘帖〉、聽見她的聲音 ----------
chn115-19:
  key: 「心手相師勢轉奇，詭形怪狀翻合宜」：字形看似怪異，卻恰到好處；筆下彷彿幻化出蛇、龍等物象，引人聯想。
  explain: |
    (D) 心與手互相引導，筆勢越來越奇，怪異的字形反而合宜；觀者從中看到奔蛇、盤龍、激電等種種物象 ✓
    (A) 奔蛇、走虺形容筆勢，遠鶴、孤雲比喻懷素孤高的個性，都不是在說身形伸展（全國 25% 誤選）✗
    (B) 「字成只畏盤龍走」是說字寫成後彷彿龍要飛走，「滿壁縱橫千萬字」寫字數之多，都不是運筆的快慢（全國 14% 誤選）✗
    (C) 宗教氛圍下，觀者期待的是懷素幻化物象的能力，不是從中印證佛道之理（全國 15% 誤選）✗
chn115-20:
  key: 故宮本「每行第一字墨色飽滿，漸寫漸乾，直到寫完行末最後一字」→ 可推知每換一行才蘸一次墨。
  explain: |
    (A) 墨色從行首的飽滿漸漸變乾到行末，可見懷素是每行開頭蘸墨，一口氣寫完一行 ✓
    (B) 作者強調字形「謹守草法」，法度「無所不在」；藉神異力量書寫是當時觀者的認知（全國 21% 誤選）✗
    (C) 摹本、臨本是說一般唐代草書名品的流傳方式；文中沒說故宮本是唯一存世的真跡（全國 10% 誤選）✗
    (D) 〈自敘帖〉記的是出身、經歷與交遊，文中沒提到師承與創作理念（全國 20% 誤選）✗
chn115-21:
  key: 眾人觀看懷素作書所寫的詩，「為八世紀的書法表演現場留下難得的紀錄」。
  explain: |
    (A) 詩作描述懷素在眾人圍觀下即席揮毫的景況，保存了盛唐藝文活動的現場 ✓
    (B) 懷素二十餘歲就以草書聞名，結交當代名公，不是不被人知 ✗
    (C) 詩作是文字描寫，不能提供臨摹用的字形與布局（全國 11% 誤選）✗
    (D) 「法度」是作者觀察〈自敘帖〉筆跡得到的看法，不是詩作揭示的（全國 31% 誤選）✗
chn115-35:
  key: 丙文是受訪者自述，還轉述屘嬸婆、養父等人的話；從女兒被送養到成年，時間跨度大，有些事她未必親眼見到。
  explain: |
    (C) 曾林阿珠的口述中引了屘嬸婆、女兒養父的話；女兒在養家的情形與「作新娘」的經過，多半是聽來的，不是她親歷 ✓
    (A) 大母拿出祖先上朝用的象笏，是期勉作者讀書求取功名，不是暗示她是掌權者（全國 8% 誤選）✗
    (B) 乙文的「黑色河流」「黑森林」比喻孩子內心湧動的負面情緒，不是母親反抗傳統的不安（全國 38% 誤選）✗
    (D) 三文沒有寫世代之間的對立，更沒有「最終找到平衡點」（全國 33% 誤選）✗
