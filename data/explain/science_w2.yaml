# 自然第 2 週（Day 8–14）解析（Claude 撰寫；已對照原卷圖。答案皆為大考中心公布答案；老師審閱後可修改）

sci114-03:
  key: 折撕法：葉片對折後反向撕開，在撕口不平整的邊緣取下薄而透明的表皮。
  explain: |
    (C) 折撕法的步驟正是對折、反向撕開，再從撕口邊緣取下表皮 ✓
    (A) 要取下表皮，應由上表皮往下表皮的方向對折撕開；「由下向上」方向相反 ✗（全國 25% 誤選）
    (B) 洋蔥表皮細胞是長在地下的鱗葉，沒有葉綠體 ✗
    (D) 亞甲藍液主要把細胞核染色，不會讓葉綠體外膜更清楚 ✗（全國 19% 誤選）
    (E) 亞甲藍液只讓細胞核更明顯，無法用來區分細胞膜和細胞壁 ✗
sci114-05:
  key: 病毒的遺傳物質可能是 DNA 或 RNA、單股或雙股；$\mathrm{G}=\mathrm{C}$ 只在雙股核酸成立。
  explain: |
    (A) 有 DNA 病毒，也有 RNA 病毒 ✓
    (B) 有的病毒核酸是雙股（例如雙股 DNA 病毒）✓
    (D) 複製、轉錄、轉譯都需要酵素等蛋白質參與 ✓
    (C) 鹼基配對 $\mathrm{G}=\mathrm{C}$ 只在雙股核酸成立；單股核酸的 G、C 數量不一定相等 ✗（全國 42% 誤選）
    (E) 只有反轉錄病毒（例如 HIV）要先把 RNA 反轉錄成 DNA；新冠病毒等 RNA 病毒可直接以 RNA 轉譯出蛋白質 ✗
sci114-13:
  key: 黃赤交角越大、陸地多的北半球在近日點過夏天、遠日點過冬天 → 冬夏溫差最大。
  explain: |
    三個因素：
    ① 黃赤交角越大，冬夏的日照角度與晝長差越大 → (A)(B) 的 40° 比 23.5°、0° 更大。
    ② 北半球陸地多，陸地比熱小、升溫降溫都快，溫差比海洋大。
    ③ 夏天在近日點（更熱）、冬天在遠日點（更冷），溫差會再加大。
    (A) 40°，而且北半球在近日點時北極傾向太陽（北半球夏天）→ 三個因素都讓北半球溫差變大 ✓
    (B) 雖然也是 40°，但北半球夏天在遠日點，距離效應反而抵消一部分 ✗（全國 21% 誤選）
    (D) 就是現在的地球：23.5°、北半球冬天在近日點。
sci114-20:
  key: 可融化的冰＝能量÷融化熱：$4.3\times10^{17}\,\mathrm{J}\div3.2\times10^5\,\mathrm{J/kg}\approx1.3\times10^{12}\,\mathrm{kg}$。
  explain: |
    融化熱 $80\,\mathrm{kcal/kg}\times4\,\mathrm{kJ/kcal}=320\,\mathrm{kJ/kg}=3.2\times10^5\,\mathrm{J/kg}$。
    $m=4.3\times10^{17}\div3.2\times10^5\approx1.3\times10^{12}$ kg → 最接近 $10^{12}$ → (B) ✓
    若忘了把 kJ 換成 J（用 320 當融化熱），會算出約 $1.3\times10^{15}$，最接近 (C) $10^{16}$（全國 23% 誤選）。
    提醒：先把所有單位換成 J、kg 再計算。
sci114-21:
  key: 抬升一座水庫的水需 $mgh=8\times10^{10}\,\mathrm{kg}\times10\times4000\approx3.2\times10^{15}\,\mathrm{J}$，$4.3\times10^{17}$ J 約可抬 130 座。
  explain: |
    一座水庫的水：$m=8.0\times10^7\,\mathrm{m^3}\times1000\,\mathrm{kg/m^3}=8.0\times10^{10}\,\mathrm{kg}$
    抬升 4000 m 的位能：$mgh=8.0\times10^{10}\times10\times4000=3.2\times10^{15}$ J
    座數 $=4.3\times10^{17}\div3.2\times10^{15}\approx134$ → 最接近 $10^2$ → (A) ✓
    全國答對率只有 43%。忘了乘水的密度（把 $8.0\times10^7\,\mathrm{m^3}$ 當成 kg），就會算出約 $10^5$ 而誤選 (B)（全國 20% 誤選）。
sci114-06:
  key: 葉片長出小苗是營養器官繁殖（無性生殖）：靠有絲分裂，子代與親代遺傳幾乎相同。
  explain: |
    用葉片繁殖是無性生殖，新細胞都由有絲分裂產生。
    (C) 有絲分裂不會發生同源染色體聯會（聯會只出現在減數分裂）✓
    (E) 無性生殖的子代遺傳組成與親代幾乎相同 ✓
    (A) 葉片小只是因為小苗還在長大，沒有基因重組，也不是天擇的結果 ✗
    (B) 無性生殖不改變遺傳組成，一代一代繁殖葉片也不會越來越小 ✗（全國 23% 誤選）
    (D) 長大後仍可開花，生殖器官的細胞能行減數分裂產生配子 ✗
sci114-14:
  key: 學校所在的一側「遠離斷層」→ 張裂 → 正斷層；震源在斷層面上、震央在斷層東側 → 斷層面向東傾斜。
  explain: |
    (E) 斷層兩側向外分開，表示受張力作用 → 正斷層 ✓
    (A) 震源在斷層面上，震央在它的正上方。震央位在地表斷層線的東邊，表示斷層面往地下延伸時向東傾斜 ✓
    (B) 若向西傾斜，震央應在斷層線西側 ✗（全國 26% 誤選）
    (C) 平移斷層的兩側沿斷層線（南北向）錯動，不會遠離斷層 ✗
    (D) 逆斷層受擠壓，兩側向斷層靠近 ✗（全國 27% 誤選）
sci114-30:
  key: 再結晶要選能溶解目標物、溶解度隨溫度變化大的溶劑；高沸點的色素不能用蒸餾餾出。
  explain: |
    (A) 硝酸鉀是離子化合物，易溶於水、難溶於汽油，再結晶要用水當溶劑 ✓（只有 37% 的考生選這個選項）
    (C) 蒸餾出部分水之後，剩下的溶液變濃，繼續蒸發或冷卻就能析出氯化鈉 ✓
    (B) 硫酸銅水溶液裡沒有鈉離子，結晶出來的是硫酸銅晶體，不可能是硫酸鈉 ✗（全國 29% 誤選）
    (D) 葉綠素的沸點很高，蒸餾時先餾出的是沸點低的乙酸乙酯（約 77 ℃），葉綠素留在瓶中 ✗（全國 40% 誤選）
    (E) 硝酸鉀和氯化鉀的溶解度隨溫度變化差很多，應該用再結晶分離，不是濾紙層析 ✗
sci114-22:
  key: 距離＝光速×10 分鐘 $\approx1.8\times10^{11}$ m；時間 200 天 $\approx1.7\times10^7$ s → 速率約 $10^4$ m/s。
  explain: |
    火星到地球的距離：$d=3\times10^8\,\mathrm{m/s}\times600\,\mathrm{s}=1.8\times10^{11}\,\mathrm{m}$
    飛行時間：200 天 $\times\,86400\,\mathrm{s}\approx1.7\times10^7\,\mathrm{s}$
    平均速率 $=1.8\times10^{11}\div1.7\times10^7\approx1\times10^4\,\mathrm{m/s}$ → (C) ✓
    把天換成秒時少乘一個 24 或 60，會算出 $10^5$–$10^6\,\mathrm{m/s}$ 而誤選 (D)（全國 18% 誤選）。
sci114-23:
  key: 都卜勒效應看「接近或遠離」，不看加速或減速：太空船一直遠離地球，所以測得 f 一律小於 $f_0$。
  explain: |
    波源遠離觀察者時，測得的頻率變低（$f<f_0$）；太空船整趟都在遠離地球。
    (A) 加速時在遠離 → $f<f_0$ ✓
    (D) 等速時也在遠離 → $f<f_0$ ✓
    (B) 加速時 $f<f_0$，不是等於 ✗
    (C) 等速遠離仍有都卜勒效應，只是 f 不再變化；$f=f_0$ 要相對速度為 0 才成立 ✗（全國 38% 誤選）
    (E) 減速時仍在遠離，$f<f_0$ ✗
sci114-09:
  key: 同一個體的細胞 DNA 都相同，差別在「哪些基因被表現」；let-7 很保守，表示它的突變大多被天擇淘汰。
  explain: |
    (A) mRNA 把 DNA 的遺傳訊息帶到核糖體，是轉載訊息的物質 ✓
    (C) 基因表現要先轉錄成 RNA，再轉譯成蛋白質 ✓
    (D) 文中說 microRNA 會與某些 RNA 配對結合，let-7 就是一種 microRNA ✓
    (B) 身體細胞都由同一個受精卵經有絲分裂而來，DNA 訊息相同；腦和四肢不同，是基因表現不同 ✗（全國 31% 誤選）
    (E) 「保守、變化少」表示這個基因的突變大多對個體不利而被天擇淘汰，保留下來的突變型很少 ✗（全國 25% 誤選）
sci114-15:
  key: 規模 9 以上的大地震都發生在隱沒帶，也就是聚合型板塊邊界。
  explain: |
    五個震央（智利、阿拉斯加、蘇門答臘、日本、堪察加）都在海洋板塊隱沒到另一個板塊下方的地方，箭頭顯示兩側板塊互相靠近 → 聚合型 (B) ✓
    (C) 錯動型（轉形斷層）的兩側是平行錯開，箭頭不會相向（全國 17% 誤選）。
    (A) 張裂型多在中洋脊，地震規模較小；(D) 熱點在板塊內部，例如夏威夷。
sci114-32:
  key: 各元素重量百分比÷原子量 → 莫耳數比 $\mathrm{C:H:N:O}=18:23:1:3$。
  explain: |
    取 100 g 樣品：
    C $71.75\div12.0\approx5.98$ mol、H $7.65\div1.0=7.65$ mol、N $4.65\div14.0\approx0.332$ mol、O $15.95\div16.0\approx0.997$ mol
    都除以最小的 0.332：C 18、H 23、N 1、O 3 → $\mathrm{C_{18}H_{23}NO_3}$ (C) ✓
    驗算：分子量 $216+23+14+48=301$，碳的比例 $216\div301\approx71.8\%$，符合。
    (D) $\mathrm{C_{17}H_{21}NO_4}$ 的氧比例約 21%，和 15.95% 差很多（全國 13% 誤選）。
sci114-07:
  key: 找麻雀和三角龍「最近」的共同祖先：兩者的分支往回追，第一次交會的節點是庚。
  explain: |
    三角龍在「己」這一支，麻雀在「辛」這一支；己和辛往回追，最先交會在「庚」→ (D) ✓
    (A) 丁是更早的祖先，它的後代還包括戊那一支（艾雷拉龍、祿豐龍、梁龍），不是「最近」的共同祖先（全國 12% 誤選）。
sci114-08:
  key: 恐龍改從「丁」算起；分支圖中越晚分開的兩支親緣越近。
  explain: |
    艾雷拉龍、祿豐龍、梁龍（戊）也算恐龍，恐龍就是「丁」和它所有的後代。
    讀分支圖：最左邊最早分出去，最右邊兩支最晚分開、親緣最近。
    (A) 人 → 波斯特鱷 → 西里龍 → 恐龍，與甲、乙、丙的分岔順序相同 ✓
    (C) 人最早分出；祿豐龍（戊）再分出；三角龍和暴龍在庚交會 ✓
    (D) 波斯特鱷 → 西里龍 → 三角龍與始盜龍（在庚交會）✓
    (B) 梁龍、天宇龍、始盜龍本身都是恐龍，不能畫在「恐龍」這一支的外面 ✗（全國 21% 誤選）
    (E) 麻雀和暴龍在辛交會，比三角龍更近；圖中卻把麻雀畫成最早分出 ✗
sci114-02:
  key: 甲＝有氧呼吸（放出能量）；乙＝光合作用（在葉綠體、需要光能，$\mathrm{O_2}$ 來自水的分解）。
  explain: |
    甲：$\text{食物}+\mathrm{O_2}\to\mathrm{CO_2}+\mathrm{H_2O}$，是人的有氧呼吸；乙：$\mathrm{CO_2}+2\mathrm{H_2O}\to\text{食物}+\mathrm{O_2}$，是植物的光合作用。
    (C) 光合作用在葉綠體中進行 ✓
    (D) 呼吸作用分解食物會釋放能量，可在右側加上「代謝能量」的輸出 ✓
    (A) 甲是呼吸作用，不是光合作用 ✗
    (B) 光合作用放出的 $\mathrm{O_2}$ 來自水的分解，所以式子裡寫 $2\mathrm{H_2O}$ ✗（全國 26% 誤選）
    (E) 光合作用需要的是「光能」，熱能無法被利用 ✗（全國 36% 誤選）
sci114-16:
  key: 岩石循環：三大岩類都能互相轉變；張裂型板塊邊界有岩漿上湧，常見火成岩。
  explain: |
    (C) 變質岩露出地表後，經風化、侵蝕、搬運、沉積就能形成沉積岩 ✓
    (E) 張裂型邊界（中洋脊、裂谷）岩漿上湧，冷卻後形成玄武岩等火成岩 ✓
    (A) 臺灣地表分布最廣的是沉積岩，其次是中央山脈的變質岩；火成岩只在大屯火山群、澎湖、海岸山脈等地 ✗（全國 23% 誤選）
    (B) 任何岩石受到夠高的溫度都會熔融成岩漿 ✗
    (D) 火成岩受到高溫高壓也會變質成變質岩 ✗
sci114-33:
  key: 聚合物＝許多單體連接成的大分子：澱粉、纖維素（葡萄糖）、蛋白質（胺基酸）、DNA 和 RNA（核苷酸）。
  explain: |
    (A) 澱粉和纖維素的單體都是葡萄糖，只是連接方式不同 ✓
    (E) RNA 的單體是核苷酸（核糖＋磷酸＋含氮鹼基）✓
    (B) 蛋白質的單體是胺基酸 ✗
    (C) DNA 的單體是核苷酸（去氧核糖＋磷酸＋含氮鹼基），不是葡萄糖與胺基酸 ✗
    (D) 脂肪由 1 個甘油和 3 個脂肪酸結合而成，是小分子，不是聚合物 ✗（全國 35% 誤選）
sci114-44:
  key: 氣溫、氣壓隨高度有固定的遞減率；濕球溫度和相對濕度要看當時的水氣量，沒有固定的遞減率。
  explain: |
    本題選「不可行」的方法。
    (C) 濕球溫度由當時的氣溫和濕度共同決定，沒有固定的垂直遞減率 → 不可行 ✓
    (E) 相對濕度由氣溫與水氣含量決定，也沒有固定的垂直遞減率 → 不可行 ✓
    (A) 對流層平均每升高 1 公里氣溫約降 6.5 ℃ → 可行，不選
    (B) 地面附近每升高 1 公里氣壓約降 100 百帕 → 可行，不選
    (D) 沸點是飽和蒸氣壓等於外界氣壓時的溫度，量沸點就能推回氣壓 → 可行，不選（全國 32% 誤選）
sci114-45:
  key: 颱風中心氣壓最低：颱風接近時氣壓一路下降，中心通過時最低，遠離後回升。
  explain: |
    31 日 15 時颱風中心通過，那時氣壓最低；之前颱風逐漸接近，氣壓持續下降；之後遠離，氣壓回升 → 呈 V 字形，最低點在三角形處 → (B) ✓
    (A) 高低相反：颱風是低氣壓，中心通過時氣壓最低，不是最高（全國 10% 誤選）。
sci114-18:
  key: $\text{行星亮度}\propto\text{半徑}^2\div(\text{到太陽距離})^2\div(\text{到地球距離})^2$：土星比木星暗約 30 倍，星等大 3–4 等。
  explain: |
    行星靠反射太陽光發亮，反照率相近時，$\text{亮度}\propto\text{截面積}\div(\text{到太陽距離})^2\div(\text{到地球距離})^2$。
    土星和木星都在「衝」（離地球最近）時最亮：
    - 半徑：$\left(\dfrac{9}{11}\right)^2\approx0.67$
    - 到太陽的距離是木星的 2 倍 → 受光只有 $\dfrac{1}{4}$
    - 到地球的距離：土星約 $10-1=9$、木星約 $5-1=4$ 天文單位 → $\left(\dfrac{4}{9}\right)^2\approx0.2$
    合計約 $0.67\times0.25\times0.2\approx\dfrac{1}{30}$。1 個星等約差 2.5 倍（$2.5^3\approx16$、$2.5^4\approx39$），所以土星最亮時暗了 3–4 個星等，約 +0.7 等 → $X>-2$ → (C) ✓
    (B) 土星更小、更遠，不可能跟木星一樣亮（全國 17% 誤選）
    (D) 6 等是肉眼極限，土星用肉眼就看得到 ✗；(E) 最大亮度是固定的值 ✗
sci114-31:
  key: 酯化是有機酸與醇的縮合，中和才是 $\mathrm{H^+}+\mathrm{OH^-}\to \mathrm{H_2O}$；乙酸、HCl 是會解離的分子化合物（電解質，不是離子化合物）。
  explain: |
    (B) 兩者溶於水都能解離出 $\mathrm{H^+}$，水溶液能導電，都是電解質 ✓
    (D) 乙酸乙酯沸點約 77 ℃、水 100 ℃，可用沸點差蒸餾分離 ✓
    (E) 酸鹼中和是放熱反應 ✓
    (A) 只有式 2 是中和反應；乙醇不會解離出 $\mathrm{OH^-}$，式 1 不能寫成 $\mathrm{H^+}+\mathrm{OH^-}\to \mathrm{H_2O}$ ✗（全國 40% 誤選）
    (C) 乙酸和 HCl 都是分子（共價）化合物，溶於水才解離；「會解離」不等於「離子化合物」✗
sci114-34:
  key: 氣體的溶解度隨溫度升高而降低：冰涼的汽水喝進 37 ℃ 的體內，$\mathrm{CO_2}$ 溶不住就冒出來（打嗝）。
  explain: |
    (甲) 由圖 7，0 ℃ 時 $\mathrm{NH_3}$ 約 90、HCl 約 84、$\mathrm{SO_2}$ 約 25 g/100 g 水，順序是 $\mathrm{SO_2}<\mathrm{HCl}<\mathrm{NH_3}$，題目寫反了 ✗
    (乙) 圖中三條曲線和 $\mathrm{CO_2}$ 的數據（0.334→0.058）都隨溫度升高而下降 ✓
    (丙) 4 ℃ 的飲料進入約 37 ℃ 的體內，$\mathrm{CO_2}$ 溶解度大幅下降而逸出，所以會打嗝 ✓
    乙與丙正確 → (E) ✓
    (B) 只有乙：漏掉了丙也是溫度造成的（全國 20% 誤選）。
sci114-35:
  key: $\mathrm{CO_2}$（C 為 +4）變成甲醇（C 為 −2）是還原；氧化亞銅是光觸媒，關燈就不反應；甲醇易溶於水。
  explain: |
    (A) $\mathrm{CO_2}$ 中 C 的氧化數 +4，甲醇中 −2，氧化數下降 → 還原 ✓
    (C) 關掉光源就沒有氧氣生成，表示光照是反應的必要條件 ✓
    (E) 原子數檢查：C $2=2$；H $8=8$；O $4+4=2+6$ ✓
    (B) $\mathrm{CO_2}$ 溶於水形成碳酸，水溶液呈酸性 ✗
    (D) 甲醇能和水以任意比例互溶；難溶於水的只有氧氣 ✗（全國 42% 誤選）
sci114-36:
  key: 先扣掉水分解產生的 $\mathrm{O_2}$（$\mathrm{H_2}$ 的一半），剩下的 $\mathrm{O_2}$ 才來自甲醇反應，再用係數比 $\mathrm{CH_3OH}:\mathrm{O_2}=2:3$。
  explain: |
    $2\mathrm{H_2O}\to 2\mathrm{H_2}+\mathrm{O_2}$：生成 $0.40\,\mathrm{mol}\ \mathrm{H_2}$，同時生成 $0.20\,\mathrm{mol}\ \mathrm{O_2}$。
    甲醇反應生成的 $\mathrm{O_2}=1.40-0.20=1.20$ mol
    $2\mathrm{CO_2}+4\mathrm{H_2O}\to2\mathrm{CH_3OH}+3\mathrm{O_2}$：甲醇 $=1.20\times\dfrac{2}{3}=0.80$ mol → (C) ✓
    常見錯誤：直接用 $1.40-0.40$（把 $\mathrm{H_2}$ 的莫耳數當成 $\mathrm{O_2}$ 扣掉），會算出約 0.67，誤選 (B)（全國 14% 誤選）。
sci114-19:
  key: 週期短 → 軌道半徑小 → 速率、加速度都較大（與質量無關）；位能、力學能還跟衛星質量有關，不能說「一定」。
  explain: |
    克卜勒第三定律：$r^3\propto\text{週期}^2$。ISS 週期 90 分鐘，遠小於同步衛星的 24 小時 → ISS 的軌道半徑較小。
    (D) 圓周運動速率 $v=\sqrt{\frac{GM}{r}}$，與衛星質量無關，r 小則 v 大 ✓
    (E) 加速度 $a=\dfrac{GM}{r^2}$，與衛星質量無關，r 小則 a 大 ✓
    (A) ISS 的軌道半徑較小 ✗
    (B) 力學能 $E=T+U=-T$，是負值。每公斤來比，離地球越近越負（越小），而且 E 還跟質量有關，不能說「一定比較大」✗（全國 32% 誤選）
    (C) 重力位能 $U=-\dfrac{GMm}{r}$ 同樣越近越負，也跟質量有關 ✗（全國 34% 誤選）
sci115-16:
  key: 電子受質子吸引，力永遠指向原點：$x>0$ 時 F 為負、$x<0$ 時 F 為正，越靠近原點越大（$\propto\dfrac{1}{x^2}$）。
  explain: |
    質子帶正電、電子帶負電，互相吸引，電子受力指向原點：
    - 電子在 $x>0$：力朝 $-x$，$F<0$
    - 電子在 $x<0$：力朝 $+x$，$F>0$
    - 大小 $\propto\dfrac{1}{x^2}$，越靠近原點越大，遠離時趨近 0
    符合的是 (B) ✓
    (A) 正負剛好相反，是同性電荷「互斥」的圖（全國 32% 誤選）。
    (C)(D) 是直線，不符合平方反比；(E) 兩側都是負值，力的方向錯。
sci115-09:
  key: 鐵杉喜冷涼、蕨類喜潮濕；平原鐵杉花粉一直少是因為平原溫暖，但蕨類比例變化大，表示濕度並沒有維持不變。
  explain: |
    (A) 鐵杉喜歡冷涼的環境，花粉比例越高，表示當時越冷涼 ✓
    (C) 高山湖泊的鐵杉花粉比例幾乎都比平原高，因為高山氣溫低，附近鐵杉多 ✓
    (B) 平原的鐵杉花粉一直少，是因為平原溫暖、附近少有鐵杉；但平原的蕨類孢子比例在 2 m 以下大多在 50% 以上，到 1–2 m 降到 10%–25%，濕度明顯改變，不能說「氣候維持潮濕」✗（全國 49% 誤選）
    (D) 岩芯越深越古老。從 5 m 到 4 m，高山湖泊的鐵杉花粉從約 60% 降到約 35%，表示變溫暖，不是更冷涼 ✗
    (E) 題目用孢粉紀錄重建長時間尺度的氣候變遷，圖中沒有人為活動的證據 ✗
sci114-47:
  key: E 是電壓，$\log$ 沒有單位 → $\dfrac{\alpha T}{e}$ 的單位是伏特 → $\alpha T$ 和 $eE$（電量×電壓）都是能量。
  explain: |
    $\log$ 裡面是濃度比，沒有單位，所以 $\dfrac{\alpha T}{e}$ 的單位和電壓 E 相同。
    (A) $eE=\text{電量}\times\text{電壓}$，單位是焦耳，是能量 ✓
    (E) $\alpha T=e\times\dfrac{\alpha T}{e}=\text{電量}\times\text{電壓}$，也是能量（$\alpha$ 的角色類似波茲曼常數，單位 J/K）✓
    (B) T 是絕對溫度，單位 K ✗
    (C) $\dfrac{\alpha}{e}$ 的單位是 V/K ✗（全國 35% 誤選）
    (D) $\dfrac{T}{e}$ 的單位是 K/C ✗
sci114-48:
  key: 平衡電壓 $E\propto$ 絕對溫度 T，要用克氏溫度：$300\,\mathrm{K}\div290\,\mathrm{K}$。
  explain: |
    n內、n外 不變時，E 只和絕對溫度 T 成正比。
    27 ℃＝300 K，17 ℃＝290 K → E 變為 $\dfrac{300}{290}$ 倍 → (C) ✓
    (A) $\dfrac{27}{17}$ 是直接用攝氏溫度計算的錯誤（全國 17% 誤選）。凡是公式裡的 T，都要換成克氏溫度。
sci115-25:
  key: 步驟 4、5 用濾紙分離固體和溶液（過濾），步驟 4 加 $\mathrm{NH_4ClO_4}$ 讓鉀離子沉澱（沉澱法）。
  explain: |
    (C) 步驟 4 濾除不溶物、步驟 5 收集沉澱，都是過濾 ✓
    (D) 步驟 4 加入 $\mathrm{NH_4ClO_4}$，使 $\mathrm{K^+}$ 形成難溶的 $\mathrm{KClO_4}$ 沉澱，是沉澱法 ✓
    (B) 整個過程沒有加熱汽化再冷凝收集液體，沒有蒸餾 ✗（全國 20% 誤選）
    (A) 沒有用濾紙分離色素等成分，不是層析 ✗
    (E) 沒有用另一種溶劑把溶質從原溶劑中移出，不是萃取 ✗
sci115-26:
  key: 看表 6 的溶解度：碳酸鈣、碳酸鎂難溶（先濾掉），$\mathrm{KClO_4}$ 只溶 1.3 g、$\mathrm{NaClO_4}$ 溶 209 g → 加 $\mathrm{ClO_4^-}$ 只沉澱鉀。
  explain: |
    (A) 醣類、脂肪、蛋白質、胺基酸都是含碳的有機化合物 ✓
    (B) $\mathrm{CaCO_3}$、$\mathrm{MgCO_3}$ 溶解度 $<0.01$，變成碳酸鹽後在步驟 4 被濾掉；$\mathrm{K_2CO_3}$、$\mathrm{Na_2CO_3}$ 易溶，留在濾液中 ✓
    (C) $\mathrm{KClO_4}$ 溶解度只有 1.3，$\mathrm{NaClO_4}$ 高達 209，加入 $\mathrm{ClO_4^-}$ 只有 $\mathrm{K^+}$ 沉澱，可以分開鈉和鉀 ✓
    (D) $\mathrm{K_2SO_4}$ 溶解度 130，易溶，改用 $\mathrm{(NH_4)_2SO_4}$ 不會產生沉澱 ✗（全國 40% 誤選）
    (E) 沉澱物是 $\mathrm{KClO_4}$；$\mathrm{NaClO_4}$ 非常易溶，而且香蕉的鈉只有 1 mg ✗（全國 51% 誤選）
sci115-27:
  key: 用重量減少 46.2% 反推：$\mathrm{KClO_4}$（138.5）→ KCl（74.5）＋$2\mathrm{O_2}$（64），$64\div138.5=46.2\%$。
  explain: |
    沉澱物是 $\mathrm{KClO_4}$。若分解成 KCl，減少的是 $\mathrm{O_2}$：$(138.5-74.5)\div138.5=64\div138.5\approx46.2\%$，與實驗相符。
    反應式：$\mathrm{KClO_4}\to \mathrm{KCl}+2\mathrm{O_2}$
    (A) 產生氧氣逸出，所以重量減少 ✓
    (B) Cl 的氧化數由 +7（$\mathrm{ClO_4^-}$）變為 −1（KCl），被還原 ✓
    (E) 係數 $1+1+2=4$ ✓
    (C) 若產物是 KClO（90.5），只會減少 $48\div138.5\approx34.7\%$，不符合 46.2% ✗（全國 57% 誤選）
    (D) 1 莫耳 $\mathrm{KClO_4}$ 分解產生 2 莫耳 $\mathrm{O_2}$ ✗（全國 49% 誤選）
sci114-37:
  key: 讀圖：RGN 在肝、腸表現最多；淡水魚遇冷 RGN mRNA 大增，鹹水魚遇冷反而減少卻更耐寒 → 耐寒不只靠 RGN。
  explain: |
    (A) 圖 8 甲：肝約 1.25、腸約 0.4，鰓、脾幾乎為 0，器官間差很多 ✓
    (C) 鹹水魚在 18 ℃ 時 RGN mRNA 從約 1.1 降到約 0.4，卻比淡水魚耐寒，表示還有其他因素參與 ✓
    (D) 淡水魚在 18 ℃ 時 RGN mRNA 從約 0.3 增加到約 3.2，約 10 倍，表示淡水魚適應低溫需要大量生成 RGN mRNA ✓
    (B) RGN 會和鈣離子結合，並藉鈣離子調控基因表現，抗低溫機制與離子濃度有關 ✗
    (E) 由圖 8 甲，RGN 在肝、腸表現最多，應該取這些組織，而不是血液 ✗（全國 29% 誤選）
sci114-39:
  key: RGN 在脊椎動物中保守：脊椎動物都有這個基因，親緣越近序列越像；一個基因可以影響耐寒、老化等多個性狀。
  explain: |
    (C) 鰻魚是脊椎動物，應該有 RGN 基因並能表現 ✓
    (D) 人和大鼠都是哺乳類，親緣比大鼠和小丑魚近，序列相似度較高 ✓
    (E) RGN 同時和耐寒、老化有關，一個基因可以影響多個性狀 ✓
    (A) 圖 8 乙中，鹹水池的虱目魚也測得 RGN mRNA，有表現 ✗
    (B) 大鼠是脊椎動物，每個體細胞都有相同的基因；肝臟正是 RGN 表現最多的器官 ✗（全國 34% 誤選）
