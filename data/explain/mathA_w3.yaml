ma110-20:
  key: BC²＝96＋96−2×96×(1/3)＝128 ⇒ △BCD 是 D 為直角的等腰直角三角形；A 到 B、C、D 等距 ⇒ A 在平面 BCD 的投影是斜邊 BC 的中點。
