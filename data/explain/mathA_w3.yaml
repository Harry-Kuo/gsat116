# ---------- Day 20：機率與統計 ----------
ma111-03:
  key: 資料集中在 y＝2x 附近；投影到和資料走向垂直的直線，投影點最集中，變異數最小。
  explain: |
    圖中的點大致落在 y＝2x 附近（方向 (1,2)）。
    投影到 y＝2x：點沿著資料的走向散開，投影點分得最開，變異數最大。
    投影到和 (1,2) 垂直的方向 (2,−1)，也就是 y＝−x/2：每個點離 y＝2x 都很近，投影點擠在原點附近，變異數最小 → 答案 (5)
    全國 63% 選了 (1) y＝2x，那正好是變異數最大的方向。
ma111-13:
  key: 23000＝1500×15＋500，可以抽 15 次；每次十連抽的期望值＝9×0.02＋0.1＝0.28 張。
  explain: |
    23000＝1500×15＋500 ⇒ 十連抽 15 次（剩 500 枚不夠再抽）。
    每次十連抽：前九張各有 2% 機率是金卡，第十張 10%，期望值＝9×0.02＋1×0.1＝0.28 張。
    15 次 ⇒ 15×0.28＝4.2 張：13-1＝4、13-2＝2
ma110-12:
  key: 用位置算：P(A)＝6/21＝2/7；C 用插空法，P(C)＝2/7；全機率 P(C)＝P(A)P(C|A)＋P(B)P(C|B)。
  explain: |
    7 個位置選 2 個放黑球有 C(7,2)＝21 種，相鄰的有 6 種 ⇒ P(A)＝2/7、P(B)＝5/7 ⇒ (1) ✗
    顏色排法共 7!/(2!2!3!)＝210 種。
    C：先排 2 黑 2 白（4!/(2!2!)＝6 種），3 顆紅球插進 5 個空隙（C(5,3)＝10 種）⇒ 60 種，P(C)＝60/210＝2/7 ⇒ (2) ✓
    A∩C：兩顆黑球綁成一塊，和 2 白共 3 件（3 種排法），紅球插進 4 個空隙（4 種）⇒ 12 種；A 共 6!/(2!3!)＝60 種 ⇒ P(C|A)＝12/60＝0.2 ⇒ (4) 不大於 0.2 ✗
    P(C|B)＝(60−12)/(210−60)＝48/150＝0.32 ⇒ (5) ✓
    (3) 全機率：P(C)＝(2/7)P(C|A)＋(5/7)P(C|B)＝2/7 ⇒ 2P(C|A)＋5P(C|B)＝2，等於 2，不是小於 2 ✗
    → 答案 (2)(5)
ma110-16:
  key: 把 1–9 去掉平方因數：{1,4,9}→1、{2,8}→2、3、5、6、7；三數乘積是平方數 ⇔ 剩下的部分相乘是平方數。
  explain: |
    每個數寫成「平方數×不含平方因數的部分」：1、4、9→1；2、8→2；3→3；5→5；6→6；7→7。
    乘積是完全平方數 ⇔ 三個「剩下的部分」相乘是完全平方數：
    ① 三個都是 1：{1,4,9}，1 組
    ② 2 和 8 再配一個 1：{2,8,1}、{2,8,4}、{2,8,9}，3 組
    ③ 2×3×6＝36：{2,3,6}、{8,3,6}，2 組
    共 6 組；C(9,3)＝84 ⇒ 機率＝6/84＝1/14：⑲＝1、⑳＝1、㉑＝4
ma109-06:
  key: log(a²)＋log b＝log(a²b)＞1 ⇔ a²b＞10；a 從 1 到 6 逐一數。
  explain: |
    log(a²)＋log b＝log(a²b)＞1 ⇔ a²b＞10。
    a＝1：b＞10，沒有；a＝2：4b＞10 ⇒ b≥3，4 種；a＝3：9b＞10 ⇒ b≥2，5 種；a＝4、5、6：b 任意，各 6 種
    共 0＋4＋5＋6＋6＋6＝27 種，機率＝27/36＝3/4 → 答案 (4)

# ---------- Day 21：計數、矩陣與空間挑戰 ----------
ma111-01:
  key: C(n,2)＞100 ⇒ 最少 n＝15；兩球可以同一口味是重複組合 H(15,2)＝C(16,2)＝120。
  explain: |
    任選兩球不同口味：C(14,2)＝91、C(15,2)＝105 ⇒ 最少 n＝15。
    兩球可以同一口味 ⇒ 不同口味 105 種＋同口味 15 種＝120 種（也就是 H(15,2)＝C(16,2)）→ 答案 (4)
    (2) 105 是漏了「可為同一口味」（全國 32% 誤選）；(5) 225＝15² 是把兩球當成有順序（全國 24% 誤選）。
ma111-14:
  key: 高斯消去法不改變解：從化簡後的矩陣解出 z＝0、y＝−5/b、x＝7＋10/b，代回原方程組求 a、b。
  explain: |
    化簡後：bz＝0、by＋5z＝−5、x＋2y＋bz＝7。方程組恰有一組解 ⇒ b≠0。
    ⇒ z＝0、y＝−5/b、x＝7−2y＝7＋10/b
    消去法得到的方程組和原方程組同解，代回原來的式子：
    第二式 x＋ay＝7：7＋10/b−5a/b＝7 ⇒ a＝2
    第一式 2x＋5y＝4：14＋20/b−25/b＝4 ⇒ b＝1/2
    第三式驗算：3x＋8y＝21＋30/b−40/b＝21−20＝1 ✓
    a＝2、b＝1/2：14-1＝2、14-2＝1、14-3＝2
ma111-17:
  key: 底面積＝|(P₂−P₁)×(P₃−P₁)|＝√181；高＝另一面的頂點到底面所在平面的距離，頂點在 xy 平面的單位圓上找最大值。
  explain: |
    P₁(−1,2,1)、P₂(−4,1,3)、P₃(2,0,−3)：P₂−P₁＝(−3,−1,2)、P₃−P₁＝(3,−2,−4)
    外積＝(4＋4, 6−12, 6＋3)＝(8,−6,9)，長度 √181。底面平行四邊形面積＝√181（三個頂點圍成的三角形是底面的一半，不論哪個點是頂角）。
    底面所在平面：8x−6y＋9z＝8×(−1)−6×2＋9×1＝−11
    另一面的頂點 (x,y,0)，x²＋y²＝1：高＝|8x−6y＋11|/√181
    8x−6y 在單位圓上的最大值＝√(8²＋6²)＝10 ⇒ 高的最大值＝21/√181
    最大體積＝√181×21/√181＝21：17-1＝2、17-2＝1（全國答對率只有 5%）
ma109-13:
  key: 邊長設 s：OB＝OC＝AB＝AC＝s；△ABC 與 △OBC 三邊對應相等，∠CAB＝∠BOC＝30°；兩面角是 ∠BMC（M 是 OA 中點）。
  explain: |
    設邊長 s：OA＝OB＝AB＝s，OA＝OC＝AC＝s，∠BOC＝30°。
    BC²＝s²＋s²−2s²cos30°＝(2−√3)s²，BC≈0.52s。
    (1) BC＜OC ✗
    (2) OB＝OC＝s，是等腰三角形 ✓
    (3) △OBC＝½s²sin30°＝s²/4，△OAB＝(√3/4)s²≈0.43s²，△OBC 比較小 ✗
    (4) △ABC 的 AB＝AC＝s，BC 和 △OBC 的一樣 ⇒ 兩個三角形全等，∠CAB＝∠BOC＝30° ✓
    (5) 取 OA 中點 M：BM⊥OA、CM⊥OA，兩面角＝∠BMC。BM＝CM＝(√3/2)s，
    cos∠BMC＝(3/4＋3/4−(2−√3))/(2×3/4)＝(2√3−1)/3≈0.82＜cos30°≈0.87 ⇒ ∠BMC＞30° ✗
    → 答案 (2)(4)
