# 數學A 第 3 週（Day 15–21）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）
# 109、110 年是舊課綱的「數學」卷（數A、數B 同一份），每題只排在一科。

# ---------- Day 15：數與式、指數對數 ----------
ma111-02:
  key: 誤按算出的是 log_b a＝1/log_a b；設 t＝log_a b，1/t＝(9/4)t ⇒ t＝2/3。
  explain: |
    正確值是 log_a b，誤按得到的是 log_b a＝1/log_a b。
    設 t＝log_a b（a、b＞1，所以 t＞0）：1/t＝(9/4)t ⇒ t²＝4/9 ⇒ t＝2/3。
    log_a b＝2/3 ⇒ b＝a^(2/3) ⇒ b³＝a² → 答案 (1)
    (3) a⁴＝b⁹ 對應 t＝4/9，是忘了把 t² 開根號（全國 28% 誤選）。
ma111-07:
  key: 兩邊都非負可以平方：(5n−21)²≥49n² ⇔ (4n−7)(2n＋21)≤0 ⇔ −10.5≤n≤1.75。
  explain: |
    |5n−21|≥7|n| 兩邊都非負，平方不改變大小關係：
    (5n−21)²≥49n² ⇔ 24n²＋210n−441≤0 ⇔ 8n²＋70n−147≤0 ⇔ (4n−7)(2n＋21)≤0
    ⇔ −21/2≤n≤7/4，整數 n＝−10, −9, …, 1，共 12 個。
    (1) |5n−7n|＝2|n|≥21 ⇒ |n|≥10.5；n＝0 符合原式卻不符合這一式 ✗
    (2) n 是整數，5n−21≠0；兩邊同除以 |5n−21| 得 |7n/(5n−21)|≤1，和原式等價 ✓
    (3) 7n≤5n−21 ⇒ n≤−10.5，n＝0 就不成立 ✗
    (4) 就是平方後的式子，和原式等價 ✓
    (5) 只有 12 個 ✗
    → 答案 (2)(4)
ma110-17:
  key: 圖形通過正方形上的點 (x,y) ⇔ a＝y·2^(−x)；最大值在 (−1,3)，最小值在 (−1,−1)。
  explain: |
    正方形中心 (1,1)、邊長 4，範圍是 −1≤x≤3、−1≤y≤3。
    y＝a·2ˣ 通過點 (x,y) ⇔ a＝y·2^(−x)。2^(−x) 在 x＝−1 時最大，等於 2：
    a 最大＝3×2＝6（點 (−1,3)）；a 最小＝(−1)×2＝−2（點 (−1,−1)）。
    a 隨點在正方形上連續變化，−2 到 6 之間的值都取得到 ⇒ −2≤a≤6
    ㉒＝−、㉓＝2、㉔＝6
ma110-18:
  key: log(∛49)¹⁰⁰＝(200/3)log7≈56.34 ⇒ n＝56；a＝10^0.34，介於 2 和 3 之間。
  explain: |
    (∛49)¹⁰⁰＝7^(200/3)，取對數：(200/3)×0.8451≈56.34。
    所以 (∛49)¹⁰⁰＝10^56.34＝10^0.34×10⁵⁶ ⇒ n＝56，a＝10^0.34。
    log2≈0.3010＜0.34＜log3≈0.4771 ⇒ 2＜a＜3 ⇒ 整數部分 m＝2。
    (m,n)＝(2,56)：㉕＝2、㉖＝5、㉗＝6
ma109-11:
  key: log 值成等差 ⇒ a、b、c 成等比（公比 10^1.1）；c＝10^3.3＝1000×10^0.3，10^0.3 略小於 2。
  explain: |
    a＝10^1.1、b＝10^2.2、c＝10^3.3。
    (1) a＋c＝2b 是等差的條件；這裡 b/a＝c/b＝10^1.1，是等比（a＋c≈2008，2b≈317）✗
    (2) a＝10^1.1＞10 ✗
    (3) c＝10³×10^0.3；log2≈0.301＞0.3 ⇒ 10^0.3＜2 ⇒ 1000＜c＜2000 ✓
    (4) b/a＝10^1.1≈12.6，不是 2 ✗
    (5) b²＝10^4.4＝ac，成等比 ✓
    → 答案 (3)(5)

# ---------- Day 16：多項式與數列 ----------
ma111-10:
  key: g(x)＝f(−x)−3 沒有常數項，g(0)＝0；對稱中心 (1,0) ⇒ g(2)＝0，所以 g(x)＝kx(x−1)(x−2)，k＝−a。
  explain: |
    g(x)＝f(−x)−3＝−ax³＋bx²−cx，所以 g(0)＝0。
    三次函數對稱於中心 (1,0)：g(1)＝0，且 g(1＋t)＝−g(1−t) ⇒ g(2)＝−g(0)＝0。
    ⇒ g(x)＝kx(x−1)(x−2)，首項係數 k＝−a。
    g(−1)＝k(−1)(−2)(−3)＝−6k＜0 ⇒ k＞0 ⇒ a＜0。
    (1) 根是 0、1、2，三個相異整數 ✓
    (2) a＝−k＜0 ✓
    (3) f(x)＝g(−x)＋3，對稱中心是 (−1,3)，不是 (−1,−3) ✗
    (4) f(100)＝g(−100)＋3＝−k×100×101×102＋3；k 可以很小（例如 k＝10⁻⁷），f(100) 不一定是負的 ✗
    (5) f(x)＝−kx(x＋1)(x＋2)＋3，令 u＝x＋1：f＝−k(u³−u)＋3＝−ku³＋ku＋3，在 u＝0 附近近似直線 y＝ku＋3，斜率是 k＝−a，不是 a ✗
    → 答案 (1)(2)（全國全對只有 3%）
ma111-12:
  key: g²＝fq＋g ⇒ g(g−1)＝fq；f 沒有實根又至少三次 ⇒ f 是四次、q 是常數，g(x) 不能等於 0 或 1 ⇒ 頂點 y 坐標＞1。
  explain: |
    (g(x))² 除以 f(x) 餘 g(x) ⇒ g²−g＝f·q ⇒ g(g−1)＝f·q。
    餘式 g 是二次 ⇒ f 至少三次；f 的圖形和 x 軸沒有交點 ⇒ f 沒有實根 ⇒ f 是偶數次 ⇒ f 是四次，q 是非零常數。
    所以 g(x)(g(x)−1)＝q·f(x) 沒有實根 ⇒ g(x) 永遠不等於 0，也不等於 1。
    g 開口向上，會取到頂點 y 坐標 k 以上的所有值；要避開 0 和 1 ⇒ k＞1。
    (1) √2/2、(2) 1 都不可能；(3) √2、(4) 2、(5) π 都大於 1，可能 → 答案 (1)(2)
ma110-05:
  key: 設 (x＋1)f(x)＝(x³＋2)(px＋q)＋(x＋2)，比較係數，再用 f(0)＝4。
  explain: |
    設 f(x)＝ax³＋bx²＋cx＋4。(x＋1)f(x) 是四次式，除以 x³＋2 的商是一次式 px＋q：
    (x＋1)f(x)＝(x³＋2)(px＋q)＋x＋2＝px⁴＋qx³＋(2p＋1)x＋(2q＋2)
    左邊展開＝ax⁴＋(a＋b)x³＋(b＋c)x²＋(c＋4)x＋4
    常數項：4＝2q＋2 ⇒ q＝1；x³ 項：a＋b＝1；x² 項：b＋c＝0；x 項：c＋4＝2a＋1
    ⇒ a＝2、b＝−1、c＝1，f(x)＝2x³−x²＋x＋4
    f(2)＝16−4＋2＋4＝18 → 答案 (4)
ma110-02:
  key: 每一項都是 a₁ 的 2^k 倍，相鄰兩項的 k 差 1；a₁＝log36≈1.56，減半就小於 1，所以 k 不能是負的。
  explain: |
    相鄰兩項一個是另一個的兩倍 ⇒ aₙ＝a₁×2^(kₙ)，k₁＝0，每往後一項 k 加 1 或減 1。
    a₁＝log36≈1.556，a₁/2≈0.78＜1；每一項都要大於 1 ⇒ k 不能小於 0。
    從 k₁＝0 走 4 步到 k₅：k₅ 是偶數且 0≤k₅≤4，0、2、4 都做得到（例如 0,1,0,1,0／0,1,2,1,2／0,1,2,3,4）。
    a₅＝log36、4log36、16log36，共 3 種 → 答案 (1)
    (3) 5 種是沒用到「每一項都大於 1」，把 k＝−2、−4 也算進去（全國 33% 誤選）。
ma109-14:
  key: 利潤 800 元，每次減半：800→400→200→100，售價＝成本 200＋利潤 100。
  explain: |
    成本 200 元，售價 1000 元，利潤 800 元。
    每次利潤減少一半：800 → 400 → 200 → 100（調降三次）
    售價＝成本＋利潤＝200＋100＝300 元
    ⑭＝3、⑮＝0、⑯＝0

# ---------- Day 17：三角函數與三角形 ----------
ma111-15:
  key: 新路寬＝C 到直線 BE 的距離＝16sin30°＝8；原方案剩 9/16 ⇒ 相似比 3/4 ⇒ 路寬是高的 1/4，高＝32。
  explain: |
    兩平行線 BE、FC 的距離＝C 到 BE 的距離＝BC·sin∠EBC＝16×1/2＝8 ⇒ 路寬 h＝8。
    原方案剩下的 △ADE 和 △ABC 相似，面積比 9/16 ⇒ 相似比 3/4 ⇒ 路寬是 △ABC 高的 1/4 ⇒ 高 H＝32。
    △ABC 面積＝½×16×32＝256。
    E 在 DE 上，到 BC 的距離是 8 ⇒ △BCE 面積＝½×16×8＝64。
    剩下 △ABE＝256−64＝192 平方公尺：15-1＝1、15-2＝9、15-3＝2
ma112-18:
  key: AP＝OA＝1 ⇒ △AOP 是等腰三角形，兩底角都是 θ ⇒ 底邊 OP＝2cosθ。
  explain: |
    AP＝OA＝1 ⇒ △AOP 是等腰三角形，底角 ∠AOP＝∠APO＝θ。
    從 A 作 OP 的垂線，垂足是 OP 的中點：OP/2＝1×cosθ ⇒ OP＝2cosθ → 答案 (4)
    (3) 2sinθ 是把鄰邊、對邊弄反（全國 17% 誤選）。
ma110-10:
  key: 已知兩邊 b＝6、c＝4：再知道夾角 A，或大邊的對角 B，三角形唯一；知道小邊的對角 C、sinA 或外接圓半徑，都可能有兩解。
  explain: |
    已知 AB＝c＝4、AC＝b＝6。
    (1) 知道 cosA：兩邊夾一角（SAS）⇒ 唯一 ✓
    (2) 知道 cosB（B 是 AC＝6 的對角）：b²＝a²＋c²−2ac·cosB ⇒ a²−8a·cosB−20＝0，兩根相乘＝−20＜0，只有一個正根 ⇒ 唯一 ✓
    (3) 知道 cosC（C 是 AB＝4 的對角）：c²＝a²＋b²−2ab·cosC ⇒ a²−12a·cosC＋20＝0，兩根相乘＝20＞0，可能有兩個正根 ⇒ 不一定唯一 ✗
    (4) 知道面積 ⇒ 知道 sinA，A 可能是銳角也可能是鈍角 ✗
    (5) 知道外接圓半徑 R ⇒ sinB＝6/(2R)、sinC＝4/(2R)，角 B 可能是銳角也可能是鈍角 ✗
    → 答案 (1)(2)（全國全對只有 3%）
ma110-19:
  key: 每兩步合成一段長 s 的位移、方向轉 45°，八段圍成正八邊形；每兩步中間的轉折點往內凹，要扣掉 8 個小三角形。
  explain: |
    兩步一組：走一公尺、左轉 45° 再走一公尺，接著右轉 90°。每組結束時，前進方向比開始時右轉 45°。
    八組（16 步）方向轉滿一圈，回到起點，路徑封閉。
    每組起點到終點的距離 s：兩段長 1、夾角 135°，s²＝1＋1−2cos135°＝2＋√2。
    八組的端點圍成邊長 s 的正八邊形，面積＝2(1＋√2)s²＝2(1＋√2)(2＋√2)＝8＋6√2。
    每組中間的轉折點在正八邊形內側（往內凹），每個凹進去的三角形面積＝½×1×1×sin135°＝√2/4，共 8 個。
    封閉區域面積＝8＋6√2−8×√2/4＝8＋4√2：㉘＝8、㉙＝4、㉚＝2
ma109-20:
  key: 灰色面積＝半圓面積−（圓 P 被弦 QT 切下的弓形）；PO＝1、∠QPT＝120°。
  explain: |
    半圓 QRT：半徑 √3，面積＝½×π×3＝3π/2。
    圓弧 QST 的圓心 P、半徑 2：PO＝√(2²−(√3)²)＝1，sin∠QPO＝√3/2 ⇒ ∠QPO＝60°，∠QPT＝120°。
    弦 QT 切下的弓形（S 那一側）＝扇形 PQT−△PQT＝(1/3)×π×2²−½×2×2×sin120°＝4π/3−√3
    灰色面積＝3π/2−(4π/3−√3)＝π/6＋√3
    a＝1/6、b＝3：㉞＝1、㉟＝6、㊱＝3

# ---------- Day 18：坐標幾何與平面向量 ----------
ma111-06:
  key: L1、L2 斜率都是正的，斜率 11/9 的是它們 60° 夾角的平分線；正三角形頂角的平分線垂直對邊 ⇒ L 的斜率是 −9/11。
  explain: |
    L、L1、L2 圍成正三角形 ⇒ L1、L2 的夾角是 60°。
    兩條斜率都是正的直線，銳角夾角的平分線斜率也是正的 ⇒ 斜率 11/9 的是 60° 角的平分線。
    正三角形頂角的平分線垂直對邊 ⇒ L 的斜率＝−9/11。
    L 過 (2, 1/3)：y−1/3＝−(9/11)(x−2)，兩邊乘 33 ⇒ 33y−11＝−27x＋54 ⇒ 27x＋33y＝65 → 答案 (5)
    (3) 11x＋9y＝25 有通過 (2, 1/3)，但斜率 −11/9 不垂直平分線（全國 17% 誤選）。
ma111-18:
  key: B 同時在 x²＋y²＝4 和以 A 為圓心、半徑 1 的圓上：兩式相減得 x＝√3。
  explain: |
    B(x,y) 在 C₂ 上：x²＋y²＝4；掃描棒長 1：(x−√3)²＋y²＝1。
    兩式相減：2√3x−3＝3 ⇒ x＝√3，代回得 y²＝1，y≥0 ⇒ y＝1。
    B＝(√3, 1) → 答案 (4)
    驗算：OA＝√3、AB＝1、OB＝2，OA²＋AB²＝OB²，掃描棒和 OA 垂直。
ma111-09:
  key: P 在 △ABC 內部 ⇔ a＞0、b＞0、a＋b＜1；面積比：△ABP＝b·△ABC，△ACP＝a·△ABC，△BCP＝(1−a−b)·△ABC。
  explain: |
    AP＝a·AB＋b·AC，P 在三角形內部 ⇔ a＞0、b＞0、a＋b＜1。
    面積比：△ABP＝b·△ABC（看 AC 的係數），△ACP＝a·△ABC，△BCP＝(1−a−b)·△ABC。
    (1) Q 的係數 b、a 都是正的、和小於 1 ⇒ Q 在內部；但 R 的 AC 係數 b−0.05 在 b≤0.05 時不是正的 ⇒ R 不一定在內部 ✗
    (2) |AP|、|AQ| 和 AB、AC 的長度與夾角有關，一般不相等 ✗
    (3) △ABP＝b·△ABC；△ACQ＝(AQ 中 AB 的係數)·△ABC＝b·△ABC ⇒ 相等 ✓
    (4) △BCP＝(1−a−b)·△ABC＝△BCQ ✓
    (5) △ABR＝|b−0.05|·△ABC；b＜0.025 時 |b−0.05|＞b，△ABR 反而比較大 ✗
    → 答案 (3)(4)（全國全對只有 4%）
ma110-04:
  key: 兩向量所張三角形面積＝½|det|；det(2a＋b, a＋2b)＝3det(a,b)，det(3a＋b, a＋3b)＝8det(a,b)。
  explain: |
    det 可以像乘法一樣分配，且 det(a,a)＝0、det(b,a)＝−det(a,b)：
    det(2a＋b, a＋2b)＝4det(a,b)＋det(b,a)＝3det(a,b)
    ½×3|det(a,b)|＝6 ⇒ |det(a,b)|＝4
    det(3a＋b, a＋3b)＝9det(a,b)＋det(b,a)＝8det(a,b)
    面積＝½×8×4＝16 → 答案 (5)
ma110-08:
  key: "|BC|＝|OA|＝5＝半徑 ⇒ △OBC 是正三角形；BC∥OA，A 到 BC 的距離等於 O 到 BC 的距離。"
  explain: |
    A(3,4) 在圓上 ⇒ 半徑 5。向量 BC＝OA ⇒ BC∥OA、BC＝5，所以 △OBC 是邊長 5 的正三角形。
    (1) L 與 Γ 的另一個交點是 A 對原點的對稱點 (−3,−4) ✗
    (2) BC∥OA，斜率是 4/3 ✗
    (3) 由 BC＝OA 得 AC＝OB（向量），所以 OACB 是平行四邊形，AC＝OB＝5；又 OA＝OC＝5 ⇒ △OAC 是正三角形，∠AOC＝60° ✓
    (4) △ABC 和 △OBC 同底 BC，而 OA∥BC，A、O 到 BC 的距離相等 ⇒ △ABC＝△OBC＝(√3/4)×25＝25√3/4，不是 25√3/2 ✗
    (5) C 在 OA 轉 60° 的方向，B 再轉 60°：逆時針轉時 C 約在 113°、B 約在 173°，都在第二象限；順時針轉時 C 約在 −7°、B 約在 −67°，都在第四象限 ⇒ 一定同一象限 ✓
    → 答案 (3)(5)

# ---------- Day 19：空間向量與平面 ----------
ma111-11:
  key: 兩個矩形都以 AD 為邊 ⇒ AD⊥AB、AD⊥AC，這是直三角柱；把要比較的角放進直角三角形算三角比。
  explain: |
    ADEB、ADFC 都是矩形 ⇒ AD⊥AB、AD⊥AC ⇒ AD⊥平面 ABC，BE、CF 也都垂直平面 ABC。
    又 AC⊥BC、AC⊥CF ⇒ AC⊥平面 BCFE。
    (1) 沿平面 ACE 切開：一塊是四面體 ABCE；另一塊有 A、C、D、E、F 五個頂點，是以 E 為頂點、矩形 ACFD 為底的四角錐，不是四面體 ✗
    (2) 兩平面的交線是 AD，AB、AC 都垂直 AD ⇒ 兩面角＝∠BAC，tan∠BAC＝BC/AC＝6/5＞1 ⇒ 大於 45° ✓
    (3) BE 垂直 BC 和 AB：tan∠CEB＝BC/BE＝6/BE，tan∠AEB＝AB/BE＝√61/BE ⇒ ∠CEB＜∠AEB ✓
    (4) AC⊥CE：tan∠AEC＝AC/CE＝5/CE；BC⊥BE：sin∠CEB＝BC/CE＝6/CE ⇒ tan∠AEC＜sin∠CEB ✓
    (5) tan∠AEC＝5/CE＜6/CE＝sin∠CEB＜tan∠CEB ⇒ ∠AEC＜∠CEB，(5) 說反了 ✗
    → 答案 (2)(3)(4)
ma111-16:
  key: L、L′ 都在平面 x−y＋2z＝3 上；L′ 在 E 上的投影是 L ⇒ 這個平面垂直 E。E 的法向量要同時垂直 L 的方向與這個平面的法向量。
  explain: |
    L：x/2−1＝y＋1＝−2z＝t ⇒ (x,y,z)＝(2＋2t, −1＋t, −t/2)，方向 (2,1,−1/2)∥(4,2,−1)，過點 (2,−1,0)。
    L′ 投影到 E 上是 L ⇒ 包含 L′ 且垂直 E 的平面也包含 L；L、L′ 是平面 x−y＋2z＝3 上兩條相異的直線，所以這個平面就是 x−y＋2z＝3 ⇒ 它垂直 E。
    E 的法向量 n 要垂直 (4,2,−1)，也要垂直 (1,−1,2)：
    n＝(4,2,−1)×(1,−1,2)＝(4−1, −1−8, −4−2)＝(3,−9,−6)∥(1,−3,−2)
    E 過 (2,−1,0)：x−3y−2z＝2＋3＝5
    E：x＋(−3)y＋(−2)z＝5：16-1＝−、16-2＝3、16-3＝−、16-4＝2、16-5＝5
ma113-18:
  key: O 在平面上的投影 Q 沿法向量方向：Q＝(t,0,−t)，代入 x−z＝4 得 t＝2。
  explain: |
    平面 x−z＝4 的法向量是 (1,0,−1)，O 的投影 Q 在過 O、沿法向量的直線上：Q＝(t,0,−t)。
    代入：t−(−t)＝4 ⇒ t＝2 ⇒ Q＝(2,0,−2)。
