# 國文 Day 15–21 解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。

# ---------- Day 15：白話閱讀：情緒與心結 ----------
chn113-18:
  key: 文中說聲音「可以憑意志完全關閉」，想隱藏表情可能是人常用電話溝通的原因。
  explain: |
    (A) 文中舉「嘲笑別人」為例，說快樂也可能很殘忍，不是總能帶給他人愉快 ✗
    (B) 文中說控制身體動作，比完全不露出臉部和聲音的情緒訊號更容易 → 方向相反 ✗
    (C) 聲音時斷時續、可以憑意志關閉；「想隱藏表情，可能是人常以電話取代面對面溝通的原因」✓
    (D) 文中說「最立即的情緒訊號是臉部表情」，不是身體動作 ✗
chn113-19:
  key: 文中說驚訝時會「把注意力固定在產生情緒的對象」→「驚顧」正是眾人驚訝地盯著嫦娥。
  explain: |
    (A) 嫦娥歌畢躍上几案，「驚顧之間」又變回筷子：眾人驚訝地看著她，符合「驚訝則是把注意力固定在產生情緒的對象」✓
    (B) 〈赤壁賦〉中客聽完蘇軾的話「喜而笑」，酒足飯飽後彼此枕靠在船中睡著 → 放鬆的身體姿勢，表現的是心情舒坦，不是感傷人生苦短 ✗
    (C) 〈虯髯客傳〉中李靖說「烈士不欺人，固無畏！」才「促鞭而行」→ 是放心、急著趕路，不是驚懼之下急於離開 ✗
    (D) 〈出師表〉的「嘆息痛恨」是透過聲音流露情緒，不是壓抑表情與聲調 ✗
chn113-20:
  key: 《禮記》說聖人用「禮」來調治人的七情 → 情緒可以透過後天的教化學習來調整。
  explain: |
    題目要找「情緒調整可以學習」→ 要有後天的教化、修養。
    (D) 聖人用禮來調治人的七情、培養十種倫理，講求誠信和睦、崇尚辭讓、去除爭奪 → 以禮教化調整情緒 ✓
    (A) 人天生有七情，受外物觸動就有感，感物吟詠心志都是自然的 → 強調情緒是自然反應，不是學來的（全國 24% 誤選）✗
    (B) 「真」受於天、自然不可改變，所以聖人效法天、重視真性 → 反對後天改變 ✗
    (C) 登山時情感充滿山間，觀海時情意溢滿海上 → 講情感隨景物興發，與學習無關 ✗
chn110-05:
  key: 日光奪走髮中的黑色素（頭髮變白）、汗水（勞動）→ 暗喻祖母辛勞且逐漸老去。
  explain: |
    (B) 日光「攫取祖母髮中的黑色素」→ 頭髮漸白；和汗水蘸成墨汁 → 長年在烈日下勞動 ✓
    (A) 「烈陽如漿」寫祖母在田裡耕種時陽光毒辣，是艱苦的勞動環境，不是關愛子孫 ✗
    (C) 黑夜是時間流逝的結果，祖母在夜裡仍不停忙碌；文中沒有「不敢寄望光明的未來」✗
    (D) 「背負著浩大的夜色，如同白日頂著烈陽」寫祖母日夜操勞，文中沒有提到收成有限 ✗
chn110-06:
  key: 心結像座標的「原點」、釘住地圖的「大頭針」→ 人生因心結而有所定著、覺得踏實。
  explain: |
    (C) 「有了原點，我們才知自己置身哪一個座標格子裡，才覺得踏實」「如果大頭針掉失了，牆上的地圖也就垮下來」✓
    (A) 文中說不管心結被珍愛還是被憎惡，都證明心結很要緊，沒有說痛苦的心結應該解開 ✗
    (B) 有些人回鄉「一定要去母校走走」，不是總令人卻步 ✗
    (D) 作者反問「人生怎麼少得了心結？」，主張心結不可少，不是無須回首 ✗

# ---------- Day 16：文言小品：寓言、筆記與自序 ----------
chn110-40:
  key: 郄雍能從眉睫之間看出盜賊，卻被群盜殺害；文子說「察見淵魚者不祥」，治盜要靠教化。
  explain: |
    文意：郄雍看人的眉目神情就能認出盜賊，晉侯很高興；趙文子卻說靠偵察抓盜賊，盜賊抓不完，郄雍也會不得好死。後來群盜果然合謀殺了郄雍。文子建議任用賢人、推行教化，讓百姓有羞恥心；晉侯任用隨會主政，群盜都逃到秦國。
    (A) 「能視盜之貌，察其眉睫之間，而得其情」✓
    (B) 晉侯只是派他辨認盜賊，沒有授以專權；晉國也沒有因郄雍而大治，反而他被殺了（全國 21% 誤選）✗
    (C) 殺害郄雍的是群盜（「吾所窮者，郄雍也」），不是同儕嫉妒（全國 28% 誤選）✗
    (D) 「察見淵魚者不祥，智料隱匿者有殃」：看得太清楚、猜得太準，會給自己招來災禍 ✓
    (E) 群盜是「奔秦」（逃到秦國），不是遷善改過；文中也只說晉侯任用隨會，沒說是文子推薦（全國 39% 誤選）✗
chn112-07:
  key: 滿漢各做拿手菜才好吃，模仿別人反而「畫虎不成」；作文也要寫自己的文字，不要模仿考官。
  explain: |
    前半：滿人、漢人各用自己擅長的菜請客，反而新鮮；硬要做對方的菜，就「依樣葫蘆，有名無實」。
    後半：秀才考試專心寫自己的文字，自然會被賞識；一味模仿宗師、主考官的風格，就「掇皮無真」（只學到表皮，沒有真東西）。
    (D) 料理要發揮自己的特長，作文也以呈現本色為上 ✓
    (A) 重點不在辨別菜系或文章流派 ✗　(B) 文中正是反對模仿宗師 ✗
    (C) 「童而習之」只是說明擅長的原因，文章重點不是學習要趁早 ✗
chn111-30:
  key: 先寫春景、再寫野菜之味、再論饑荒與達官貴人，最後以「士大夫不可無此味」作結。
  explain: |
    (A) 新雨後園蔬青翠（春景）→ 野香從匙筷間出（野菜之味）→ 憐惜野菜、悲嘆中原饑荒（所感）→ 「民不可有此色，士大夫不可無此味」（對士大夫的期許）✓
    (B) 引蘇軾「飽霜雪之精、味含土膏」說野菜含天地精華；「寒窗一嚼，勝十日太牢」→ 對貧士來說勝過豐盛的祭品（全國 45% 漏選）✓
    (C) 「折骨解肢，與烏鳶爭攫啄之利」是饑民連屍骨都吃，和烏鴉老鷹搶食；不是烏鳶搶饑民的雁糞、榆皮（全國 61% 誤選）✗
    (D) 第一次：野菜不能送進達官貴人的華宴；第二次：反問他們享樂時可曾想到百姓連野菜都吃不上 ✓
    (E) 「民不可有此色」是不能讓百姓餓到面有菜色；「士大夫不可無此味」是士大夫要嘗過、體會百姓吃野菜的滋味，才能體恤民生，不是回歸素樸自然（全國 27% 誤選）✗
chn111-12:
  key: 「五十年來，總成一夢……遙思往事，憶即書之」→《陶庵夢憶》寫的是對一生的回憶。
  explain: |
    (A) 回想自己一生的繁華，「五十年來，總成一夢」，想到往事就寫下來 ✓
    (B) 「偶拈一則，如遊舊徑，如見故人」是隨手翻讀一則，彷彿重遊舊地、重見故人而欣喜，不是對寫法感到欣喜 ✗
    (C) 「雞鳴枕上」是雞鳴時躺在枕上回想往事，不是寫書寫到天亮 ✗
    (D) 繁華如夢是寫作時（晚年）回顧的感悟，不是早年就已領悟（全國 32% 誤選）✗
chn111-13:
  key: 腳夫打破酒甕賠不起，希望是夢；寒士考中，怕不是真的 → 一個「惟恐其非夢」，一個「惟恐其是夢」。
  explain: |
    (C) 腳夫替人挑酒、失足打破酒甕，想到賠不起，呆坐說「要是夢就好了」→ 承受不了突來的不幸，遺憾這不是夢 ✓
    (A)(B) 兩人都被張岱稱為「癡人」，既不豁達，也不是在談興趣 ✗
    (D) 寒士是「鄉試中式」（考中了），要去參加鹿鳴宴，因為太高興而懷疑是夢，不是落榜 ✗

# ---------- Day 17：文言題組：海防策論與題跋 ----------
chn112-15:
  key: 海上作戰「彼之所挾者小，我之所勞者大」；敵人登陸則「民心易動，軍心易震」→ 兼論海、陸兩方面的利弊。
  explain: |
    文意：在海上追逐，敵人損失小、我方勞累大，不如引誘敵人上岸再設伏殲滅；但敵人一登陸，民心、軍心容易動搖，沒有老將強兵不能成功。接著依地形分析：臺北可以引敵近岸，臺南則不可，澎湖一定要守。
    (B) 海戰的不利、陸戰的風險都有分析 ✓
    (A) 「我果戰士有勇，大將有謀……」是假設語氣；文中還強調誘敵上岸「非有成算，則斷不可」，沒有說準備已經充足 ✗
    (C) 只是說海戰不如誘敵上岸，沒有主張完全放棄海戰；還提醒要守住澎湖 ✗
    (D) 文中說敵人登陸後「民心易動，軍心易震」，正好相反 ✗
chn112-17:
  key: 文中談到將士（宿將強兵）、地形（港道、風浪、淺灘）、攻守路線（誘敵、澎湖），沒有提到外援。
  explain: |
    (A) 將士經驗：「非宿將強兵不能得手」→ 有
    (B) 地理環境：臺北港道深通、臺南風浪甚苦、臺中沙線淺灘 → 有
    (C) 攻守路線：引敵從臺北登岸、澎湖被占後敵船四處劫掠 → 有
    (D) 外援力量：全文沒有提到 ✓
chn112-19:
  key: 四十年後讀到李公家書，想起他當年說「青鞋布襪行矣」的英氣 → 連結今昔，流露欽佩。
  explain: |
    背景：李光（李莊簡公）罷官回鄉時常來陸游家，痛罵秦檜；他說若被貶，就穿上青鞋布襪上路，不會像別人那樣悲傷哭泣。
    (C) 「後四十年，偶讀公家書，雖徙海表，氣不少衰……猶想見其道青鞋布襪時也」✓
    (A) 讀的是李公寫給家人的家書，陸游寫的是題在書後的「跋」，不是回信 ✗
    (B) 「跋」寫在書或文章之後，和放在前面的「書序」不同；內容是追憶與讚嘆，不是說明撰作動機 ✗
    (D) 昔日是「劇談終日」「共飯」，不是共聚議事；文末是欽佩李公氣節，不是感嘆難以再見 ✗
chn112-20:
  key: 用「側盾撞倒衛士、披帷西向立、瞋目視項王」這些動作細節，寫出樊噲的勇猛。
  explain: |
    上文用「目如炬，聲如鐘」等細節寫李參政的剛毅。
    (B) 〈鴻門宴〉中樊噲撞倒衛士、闖進帳中、怒目直視項王 → 用動作細節呈現勇猛 ✓
    (A) 〈出師表〉直接評價向寵「性行淑均，曉暢軍事」，是概括說明，不是細節描寫（全國 18% 誤選）✗
    (C) 〈虯髯客傳〉寫紅拂女長髮垂地、在床前梳頭，是為虯髯客出場鋪陳，看不出性格 ✗
    (D) 〈勞山道士〉寫三人移入月中飲酒，是描寫法術奇景，不是人物性格 ✗
chn115-29:
  key: 孔子從曲→數→意→人→類，逐步深入；師襄子讚許孔子、孔子認同曾子 → 彈奏者樂於有人聽懂。
  explain: |
    甲：孔子跟師襄子學琴，一首曲子練了很久不換。他先掌握曲調，再掌握技法，再體會意境，再想見作曲者的為人，最後推斷是周文王所作。師襄子起身再拜說「善」，證實是文王的曲子。
    乙：孔子彈瑟時看到貓躡手躡腳要抓老鼠，把這份心思彈進樂聲；曾子聽出「貪狼之志」。孔子說曾子這樣認為很合理。
    (A) 說「趨利之甚」的是曾子，而且孔子承認琴聲確實有貪狼之意，不是聽者把自己的想法投射進去（全國 46% 誤選）✗
    (B) 曲子是文王所作，孔子的體悟和原意相合，並沒有超出；也不是師襄子作的曲子（全國 42% 誤選）✗
    (C) 從技巧（曲、數）深入到意境（意、人、類）✓
    (D) 師襄子讚許孔子的見解；孔子聽了曾子的評論，說明原因並認為「不亦宜乎」→ 都樂於有人成為知音（全國 59% 漏選）✓
    (E) 師襄子說「可以進矣」是要孔子進一步學新的曲子，不是聽出孔子有上進之心（全國 46% 誤選）✗

# ---------- Day 18：跨文本：檳榔與硃砂 ----------
chn112-23:
  key: 李時珍說檳榔「醉能使之醒」，並引朱晦庵「檳榔收得為祛痰」→ 嚼檳榔有助醒酒。
  explain: |
    (B) 「酒後嚼之，則寬氣下痰，餘酲頓解，朱晦庵所謂『檳榔收得為祛痰』也」✓
    (A) 「賦性疏通而不泄氣」是說檳榔的藥性，文中沒有說有益呼吸系統（全國 20% 誤選）✗
    (C) 「飢能使之飽，飽能使之飢」是李時珍說的功效，文中沒有說是多酚類化合物的作用 ✗
    (D) 世界衛生組織證實的是檳榔素、檳榔鹼「具潛在致癌性」；作者還說自己「不知它的成癮機轉」✗
chn112-24:
  key: 甲文羅大經住了一年多就「不可一日無此君」，乙文作者說嚼檳榔「很容易成癮」→ 都有親身經驗與成癮現象。
  explain: |
    (D) 甲：羅大經從敬謝不敏到「不可一日無此君矣」；乙：作者自己的「嚼食經驗」覺得很容易成癮 ✓
    (A) 甲文呈現古人對檳榔的不同態度，「實可厭惡」是周去非的看法，不是甲文作者不鼓勵食用 ✗
    (B) 乙文確實兼論功效與危害，但只寫自己的感受，沒有呼籲大家抗拒（全國 38% 誤選）✗
    (C) 甲文引的是詩和宋人筆記，沒有醫療知識（全國 25% 誤選）✗
chn112-25:
  key: 乙文只說檳榔「用來待客」，沒有提到用檳榔化解紛爭。
  explain: |
    (A) 益精神：乙文說檳榔能「提高警覺度」→ 有提及
    (B) 解紛惟有送檳榔：用檳榔化解糾紛，甲、乙兩文都沒有提到 ✓
    (C) 吃了腥羶的魚，細嚼檳榔讓口中清爽：乙文說檳榔「稟味嚴正而更有餘甘」、「那麼清香」→ 有提及（全國 64% 誤選）
    (D) 淡可療飢：乙文「飢能使之飽」→ 有提及
chn113-29:
  key: 機器研磨的高溫會讓硃砂產生劇毒；升煉得水銀，水銀加硫黃成銀朱；安全炮製可用，但臺灣已禁用。
  explain: |
    (A) 水飛法是先「軋碎如微塵」再加清水澄浸，三天後取下沉的部分曬乾；不是先淘洗再研磨 ✗
    (B) 中醫師說機器研磨的高溫會使硃砂產生劇毒 ✓
    (C) 升煉：品質差的「次砂」加熱，水銀流到下面；水銀「加硫黃升而為銀朱」✓
    (D) 資料沒有比較速度；而且丹砂「入火則熱而有毒」，升煉得到的東西毒性並不比頭朱低 ✗
    (E) 中醫師說重複水飛多次「方可」入藥 → 不是完全不能用；衛生署 94 年起禁止中藥用硃砂 → 臺灣目前完全禁用 ✓
chn114-27:
  key: 展場布置與參觀路線決定「可以看什麼、看不到什麼」；參觀者受權威限制，卻也意識到自己是知識的主體。
  explain: |
    (A) 文中說參觀者會配合場所的調性（例如穿著），是場所影響參觀者，不是參觀者身分影響場所調性（全國 22% 誤選）✗
    (B) 入館程序像「宗教淨化」，是約束參觀者的規則；「現場」感是展示造成的（全國 58% 誤選）✗
    (C) 展場布置與建議路線提供一個有秩序的世界，也決定參觀者能看到什麼 → 已預設理解的途徑 ✓
    (D) 文中沒有說秩序減低了教育成效，反而說博物館能「對參觀者進行教育」✗
    (E) 博物館決定了參觀者能看什麼（受限），也讓觀眾意識到自己是知識的主體（滿足）✓

# ---------- Day 19：詩詞：杜甫與現代詩 ----------
chn115-22:
  key: 「既飽歡娛亦蕭瑟」：吃飽了很歡樂，卻也感到淒涼 → 口腹之慾滿足後難免悵然。
  explain: |
    (C) 吃飽歡樂之餘也覺得蕭瑟，接著說魚被宰割後「咫尺波濤永相失」✓
    (A) 「色勝銀」「數百鱗」描寫魚多、色澤鮮亮，詩中沒有談收入 ✗
    (B) 徐州禿尾、漢陰槎頭都是有名的魚，用來襯托眼前魚鱠的美味（乙注、丙解都說是陪襯），不是襯托刀工 ✗
    (D) 盧注說魚一經剖割，就永遠離開水波 → 感嘆魚失去生命、不忍殺生，不是竭澤而漁的長遠損失（全國 19% 誤選）✗
chn115-23:
  key: 丙解：「此詩從來誤會以魴為鱠……乃知作鱠者謂赤鯉，魴其陪襯也。」
  explain: |
    (B) 一般人以為做成魚鱠的是魴魚，丙解認為其實是赤鯉，魴魚只是陪襯 ✓
    (A) 誤會的是「這首詩裡做成鱠的是魴魚」，不是「魴魚最適合做魚鱠」（全國 17% 誤選）✗
    (C) 「朝來之苦」是赤鯉被宰殺烹煮的痛苦，不是味道變苦 ✗
    (D) 丙解自己就說「禿尾、槎頭之類魴者」，這不是別人的誤解 ✗
chn110-07:
  key: 「全世界的沙灘都是如此的」強調孤獨小舟歪斜擱淺的普遍，不是說沙灘單調。
  explain: |
    這題選「最不適當」的。
    (A) 小舟像歪斜的頭，裡面充滿悲哀 → 以舟喻人，寫擱淺的悲哀 → 適當（全國 21% 誤選）
    (B) 詩的重點是「孤獨的小舟都是歪斜地擱著」，沙灘只是小舟擱淺的地方，沒有寫沙灘單調、生活千篇一律 → 不適當 ✓
    (C) 「都是如此的」→ 孤獨是普遍的 → 適當（全國 15% 誤選）
    (D) 小舟「歪斜地擱著」、頭「歪斜」→ 頹然無力 → 適當
chn112-30:
  key: 兩首詩都用「聽診器」點出賴和的醫師身分；甲詩寫苦難讓醫師成為詩人，乙詩寫苦難的人物被寫進文學而留存。
  explain: |
    賴和是醫師，也是臺灣新文學作家，小說〈一桿稱仔〉寫菜販秦得參的秤仔被日本巡警折斷。
    (A) 「被折斷的秤錘」比喻殖民律令不公平（在不等重的兩端），不是人民被拷打（全國 34% 誤選）✗
    (B) 甲詩說聽診器也無法診療的喘鳴；乙詩說用聽診器聽到病人心房裡的故事 → 醫者仁心，聽取民間疾苦（全國 48% 漏選）✓
    (C) 「喘鳴」「癱瘓」是百姓受壓迫的痛苦，不是民智蒙昧（全國 30% 誤選）✗
    (D) 兩首詩都沒有「慶幸」；甲詩說苦難連聽診器也無法診療，乙詩寫把人物供奉在文壇，不是洗滌苦厄（全國 43% 誤選）✗
    (E) 甲：無法診療的喘鳴「沉吟為一位詩人」；乙：帶小說人物走出情節，「把他們供奉在文壇」✓
chn110-42:
  key: 籃框像「天使的光環」又像「發亮的手銬」→ 既嚮往又想掙脫；「空白」兼指考卷與青春，「倒數」「告別」都指人生轉折。
  explain: |
    (A) 甲詩「等待過一次最美的跳投」是期待；乙詩「等到油墨吸乾文字後」只是表示時間，都不是焦慮（全國 28% 誤選）✗
    (B) 光環是嚮往的榮耀，手銬是束縛 → 既期待又想擺脫 ✓
    (C) 「填完這些空白」表面上是考卷的空格，也暗示為考試留白的青春（全國 65% 漏選）✓
    (D) 籃框是要「被命中」的目標，油墨是用來作答、「撫慰紙張的傷口」，都和才能難以發揮、答案千篇一律無關 ✗
    (E) 「倒數」七十六天、「和今天的自己告別」→ 考試是進入人生下一階段的轉折 ✓

# ---------- Day 20：小說與散文 ----------
chn113-16:
  key: 賈政「呵護成長尚未到來前的浪漫存在」、建立人間樂園 → 寶玉在賈政的守護下享受青春。
  explain: |
    (B) 「賈政依舊呵護成長尚未到來前的浪漫存在，嘗試建立人間樂園」「寶玉是補天之石，支撐著現實人間的則是賈政」→ 寶玉被關愛，在賈政撐起的樂園裡成長 ✓
    (A) 文中說寶玉「承盡了愛和哀」，沒有說他的哀是因為還沒準備好承擔責任（全國 50% 誤選，比答對的人還多）✗
    (C) 文中明說「賈政其實是瞭解寶玉的」，還看得見他的「奇異天生」（全國 15% 誤選）✗
    (D) 是賈政自己嘗試建立人間樂園，不是要寶玉去建 ✗
chn113-17:
  key: 賈政「擔盡了事和責」，作者肯定成年是生命的必要階段 → 歷練後學會承擔才是成熟。
  explain: |
    (B) 賈政扶養寶釵母子、歸葬賈母與黛玉、送別寶玉，「擔盡了事和責」；「成年在小說中不是罪過，反被認知成生命的必要階段」✓
    (A)(C) 作者肯定賈政，沒有諷刺禮教，也沒有說他守舊、暗示家族衰敗 ✗
    (D) 文中把寶玉的浪漫和賈政的現實當作互補的兩面，不是說可以任選一種過生活 ✗
chn110-39:
  key: 推銷員的笑是「為下一次進攻做準備」；茉莉積了滿肚子的話，終於有人聽她說。
  explain: |
    (A) 「發出很醜惡的聲響」是鄭大全自己餓得肚子咕嚕叫，不是嫌茉莉的聲音 ✗
    (B) 茉莉以為他的笑友善體貼，其實他是在盤算怎麼把床賣出去 ✓
    (C) 很久沒有人肯聽她「盡興地東拉西扯」，話像堵在肚中的棉絮 → 心裡積了很多話，急著傾吐 ✓
    (D) 「紡出線來」「有的紡呢」是說話源源不絕、沒完沒了，鄭大全急得插不上嘴；不是口才好、引人入勝（全國 15% 誤選）✗
    (E) 懷孕七個月的妻子還在拼裝塑膠玩具做代工，腿都腫了 → 寫家境困苦，不是想像和孩子玩耍（全國 28% 誤選）✗
chn111-28:
  key: 花開是花的本性，「有人看見與否，皆與花無涉」；孤崖喻無人過問的處境。
  explain: |
    (A) 文中沒有說石縫能避風雨；花在哪裡都會開，因為開花是它的本性 ✗
    (B) 花在熱鬧場中或孤崖頂上都會開，只有「拂其性，禁之開花」才會死，不是取決於栽植環境與方法（全國 15% 誤選）✗
    (C) 花「向路人迎笑」，但「有人看見與否，皆與花無涉」→ 不是為了迎合路人而開 ✓
    (D) 花開比喻「有話要說必說之」的本性，不是奉獻社會；孤崖是無人過問的處境，不是忘懷得失的人格（全國 28% 誤選）✗
    (E) 花開＝率性表達自我；孤崖＝無人理解、無人過問（如屈原哀號、古人著書）✓
chn112-28:
  key: 祕密換祕密是怕孤獨的人取暖；說別人的祕密能轉移焦點、藏住自己的；保有祕密反映孤獨是生命基調。
  explain: |
    (A) 「幽暗的本能」是祕密讓人發現的人性，不是因為說別人的祕密才幽暗不安 ✗
    (B) 「害怕孤獨的人……開始訴說祕密。祕密換祕密，那是朋友的定情儀式」✓
    (C) 說別人的祕密是「無本生意」（不用賠上自己），也是「聲東擊西的詭計」（大家忙著說別人，自己的祕密就不會被刺探）✓
    (D) 隱匿祕密，「阻止你順暢讀取我全部的檔案」；祕密讓人發現「孤獨如何成為每個人真正的生命基調」✓
    (E) 文中說祕密「讓人類理解語言的限制」→ 祕密讓人看見語言的限制，不是因為語言有限制才有祕密，因果顛倒（全國 33% 誤選）✗

# ---------- Day 21：填句與語意邏輯 ----------
chn110-31:
  key: 前一句「其所以不已乎辭者，非得已也」→ 孟子「予豈好辯哉？予不得已也」。
  explain: |
    曾鞏說：求道的人不必汲汲於文辭；孟子之所以不停地說，是出於不得已。
    (A) 《孟子》：「我難道喜歡辯論嗎？我是不得已啊！」正好呼應「非得已也」✓
    (B) 「無辭讓之心，非人也」講四端，「辭讓」是謙讓，和言辭無關（全國 19% 誤選）✗
    (C) 「不以文害辭，不以辭害志」是孟子談讀詩的方法：不要拘泥字句而誤解作者的本意（全國 44% 誤選，被「辭」字吸引）✗
    (D) 「盡信書，則不如無書」講讀書要有判斷 ✗
    技巧：填句題先找空格前後的關鍵句，這題是「非得已也」，不要只看選項裡有沒有相同的字。
chn110-32:
  key: 李沿想求「道」，問的卻是「辭」→ 曾鞏提醒他「務其淺，忘其深」，為學不要捨本逐末。
  explain: |
    曾鞏認為道是根本（得諸心、充諸身、推及國家天下），文辭是末節。
    (D) 「無乃務其淺，忘其深，當急者反徐之歟」→ 為學不宜捨本逐末 ✓
    (A) 文中沒有談治理天下要體恤百姓、重視承諾（全國 22% 誤選）✗
    (B) 文中沒有談寫文章的技巧 ✗
    (C) 「何遽急於辭也」的「急」是急著追求文辭，問題在先後輕重，不是讀書求快（全國 32% 誤選）✗
chn112-21:
  key: 穿補丁衣服、吃混合麵也不以為苦 →「士志於道而恥惡衣惡食者，未足與議也」。
  explain: |
    空格前後：生活困苦，《論語》的語句給她精神力量，不以為苦。
    (B) 有志於道的讀書人如果以粗衣淡飯為恥，就不值得和他討論道 → 不以貧苦為意 ✓
    (A) 孔子責備宰我：守喪期間吃好米、穿錦衣，你心安嗎？✗
    (C) 孔子講究飲食：顏色不好、氣味不好、烹調不當、不合時令都不吃 ✗
    (D) 孔子稱讚禹自己飲食簡單、衣服粗陋，祭祀卻很豐盛隆重；講的是禹的節儉，不是讀書人如何面對貧困（全國 20% 誤選）✗
chn112-22:
  key: 由貧苦自處聯想到「四書」，子貢由修養聯想到《詩經》→ 經典語句可以透過聯想互相印證。
  explain: |
    (B) 作者「進而聯想到『四書』中的其他語句」；子貢從「貧而樂，富而好禮」聯想到《詩經》的「如切如磋，如琢如磨」✓
    (A) 熟背時「無論懂與不懂」都印入腦中，烙印的是文字，深意要靠日後體會；作者也沒有主張這是對當代學子有益的方式 ✗
    (C) 子貢是由修養的道理「聯想」到詩句，重點在觸類旁通，不是用修養之道解釋詩句的意思（全國 25% 誤選）✗
    (D) 作者說讀書最大的樂趣是「從書中去體會一份活潑的、可以提昇人精神的力量」（全國 26% 誤選）✗
chn111-27:
  key: 條件是「除了兩造另有協議及放假日外」，結果是「一、三、五晚上 7–8 時，且每日（含放假日）不超過 30 分鐘」。
  explain: |
    先切開判決文：條件「除了兩造另有協議及放假日外」→ 結果「聯絡時間為每週一、三、五晚上7時至8時之間，且每日（含放假日）合計不得超過30分鐘」。
    (A) 條件的部分正確 ✓
    (B) 平日的週二、四不在可聯絡的時間內；而且每天都有 30 分鐘的上限 ✗
    (C) 漏掉了「放假日」這個例外：放假日不受「一、三、五晚上」的限制（全國 62% 誤選）✗
    (D) 「每日（含放假日）合計不得超過30分鐘」→ 遇到放假日，時長一樣受 30 分鐘限制 ✓
    (E) 結果的部分正確 ✓
    技巧：「除了……外」後面接的是例外，例外的情況不適用後面的規定；括號「（含放假日）」則把放假日又放回 30 分鐘的限制裡。
