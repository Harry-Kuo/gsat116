# 社會 Day 36–42 解析（Claude 撰寫；地圖、照片、圖表題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）
# 110 年是舊課綱試卷，排入的題目都已確認在 108 課綱必修範圍內。

# ---------- Day 36：地圖與地理資訊系統、臺灣史、民主政治與媒體 ----------
soc112-42:
  key: 避難所要「易達性高」（靠近主要道路）又「安全」（避開河流匯流、低窪處）→ 丁緊鄰台 14 線，又不在溪流匯流口。
  explain: |
    (D) 丁緊鄰台 14 線主要道路，交通方便，又遠離南山溪與眉溪的匯流處，相對安全 ✓
    (A) 甲在山坡上，沒有道路直接到達，易達性差（全國 24% 誤選）✗
    (C) 丙只靠小路連接，易達性不如丁（全國 21% 誤選）✗
    (B) 乙位在兩條溪的匯流口，風災時容易淹水，不安全（全國 9% 誤選）✗
soc112-43:
  key: 1930 年霧社事件後，日本把倖存的賽德克族人與其他部落強制遷離原居地（集團移住），眉溪一帶的南豐村也是遷居地之一。
  explain: |
    (C) 霧社事件後，總督府推動集團移住，把部落族人遷到南豐村等地，以便管控 ✓
    (A) 隘勇線是包圍、壓縮原住民生活範圍的封鎖線，不是集團移住（全國 17% 誤選）✗
    (B) 林野調查是把無主林野收歸國有，不是遷移部落的主因（全國 12% 誤選）✗
    (D) 霧社事件的倖存者在 1931 年就被強制遷到川中島，不是 1937 年皇民化以後的事；而且題目問的是南豐村 ✗
soc112-44:
  key: 部落族人參與討論、投票決定經費用在族語、弓箭等傳統文化 → 讓在地民眾參與公共決策，回應在地需求（參與式預算）。
  explain: |
    (D) 族人直接參與公共資源分配，決策更能反映部落的需要，是民主治理中的公民參與 ✓
    (B) 計畫的重點是開放參與，不是說多數決一定最公平（全國 12% 誤選）✗
    (C) 直接參與不一定比議會決定更符合公共利益，說法太絕對（全國 8% 誤選）✗
    (A) 計畫由族人討論、投票決定，不是由地方政府主導 ✗
soc112-45:
  key: 傳統智慧創作專用權是部落以「集體名義」申請 → 屬於原住民族的集體權；傳統領域權也是屬於族群或部落的集體權。
  explain: |
    (B) 傳統領域屬於整個族群或部落，和傳統智慧創作專用權一樣是集體權 ✓
    (C) 回復傳統姓名是個人可以行使的權利，屬於個人權（全國 41% 誤選）✗
    (D) 原住民保留地由原住民個人申請取得權利（全國 13% 誤選）✗
    (A) 宗教信仰自由是個人權 ✗

# ---------- Day 37：民主政治與媒體、生活中的法律、經濟學概念 ----------
soc112-27:
  key: 公民團體擔心人民失去對個資的控制、要求立法明訂授權與監督 → 國家權力一旦掌握全民整合資料，影響範圍廣又深，所以要更審慎。
  explain: |
    (D) 數位身分證整合戶口、醫療、租稅等資料，國家權力的行使範圍與影響都很大，需要以法律限制並審慎規劃 ✓
    (A) 跨部會合作只是計畫的內容之一，不是要求更審慎的根本理由（全國 24% 誤選）✗
    (C) 公民團體擔心的是權力與個資，不是人民的認同感（全國 11% 誤選）✗
    (B) 提供便捷服務是支持者的理由，不是要求審慎的理由（全國 7% 誤選）✗
soc112-28:
  key: 疫苗地圖用政府資訊幫民眾找施打地點 → 增強知的權利；數位身分證整合全民個資 → 可能削弱隱私權（資訊自主權）。
  explain: |
    (B) 兩者對個人權利的影響不同：疫苗地圖提供公共資訊，數位身分證卻涉及個人資料的集中與使用，評價自然不同 ✓
    (A) 數位身分證引發的爭議是隱私，不是增強知的權利（全國 5% 誤選）✗
    (C) 疫苗地圖使用的是施打場所等公共資訊，不涉及個人隱私（全國 6% 誤選）✗
    (D) 兩者都沒有削弱人身自由或行動自由 ✗
soc112-29:
  key: 機會成本是「放棄的選擇中價值最高的那一個」→ 放棄換發計畫，就失去了整合資訊所帶來的便利，也就是民眾辦事成本的降低。
  explain: |
    (A) 放棄計畫後，原本可以減少民眾申辦業務的時間與麻煩，這個好處就失去了，是機會成本 ✓
    (C) 蒐集整合資訊要投入的成本，放棄計畫後反而省下來，不是機會成本（全國 36% 誤選）✗
    (B) 保護個資是放棄計畫得到的好處，不是失去的（全國 21% 誤選）✗
    (D) 制定特別法的成本也因放棄計畫而省下，不是失去的好處（全國 18% 誤選）✗
soc112-06:
  key: 董仲舒建議「罷黜百家、獨尊儒術」，又擴大察舉、設太學 → 讀書人（儒生）取代宗室、軍人、富人，成為官員的主要來源。
  explain: |
    (B) 察舉以孝廉等儒家德行為標準，太學也教授儒家經典，儒生從此大量進入官僚體系 ✓
    (A) 漢武帝的改革是加強中央集權，君權反而提高（全國 10% 誤選）✗
    (D) 輪調制度不是採納董仲舒建議的結果 ✗
    (C) 題目問的是任用讀書人為官的結果，和壓抑商人無關 ✗
soc112-50:
  key: 北緯 22.63°、東經 120.31° 是高雄市區旁的壽山，由隆起珊瑚礁石灰岩構成，覆蓋熱帶闊葉林，是臺灣獼猴的棲地。
  explain: |
    (D) 壽山是海岸隆起的珊瑚礁石灰岩山丘，林木蓊鬱，有大量臺灣獼猴棲息 ✓
    (C) 針葉林多在高海拔山區，不會出現在海拔 300 公尺、低緯度的海岸山丘（全國 34% 誤選）✗
    (B) 高雄市區旁沒有廣大的沙丘群（全國 17% 誤選）✗
    (A) 這裡不是火山地形（全國 14% 誤選）✗

# ---------- Day 38：民主政治與媒體、世界史、地圖與地理資訊系統 ----------
soc112-46:
  key: 學者說的現象是：網路上只認同立場相同的言論、敵視不同立場的人（同溫層、政治極化）→ 要同時看網路言論傾向和對其他政黨支持者的好感度。
  explain: |
    (C) 若網路言論越偏向單一立場的人，對不同政黨支持者的好感度越低，就能佐證這種對立現象 ✓
    (D) 對施政滿意度無法看出人民之間是否彼此敵對（全國 14% 誤選）✗
    (A) 只看提案者的政黨立場，看不出網路上對不同立場者的敵意（全國 12% 誤選）✗
    (B) 教育程度與網路使用的相關，和同溫層對立現象無關 ✗
soc112-07:
  key: 「偉大宣言揭櫫的原則」「正義、自由、繁榮與獨立」只由你們享受 → 美國獨立宣言與獨立紀念日；十九世紀中期仍有黑奴制度。
  explain: |
    (A) 1852 年廢奴運動者道格拉斯在美國獨立紀念日的演說，控訴黑奴沒有享有獨立宣言所說的自由與平等 ✓
    (C) 俄國革命在 1917 年，十九世紀中期還沒有俄國革命紀念日（全國 8% 誤選）✗
    (B) 拿破崙戰爭沒有揭櫫自由、獨立的「偉大宣言」 ✗
    (D) 印度在 1947 年才獨立 ✗
soc112-58:
  key: 山脊線是等高線向低處凸出的地方；玉山主峰往北到北峰，路線沿著高度 3600 公尺以上的主稜前進，視野可遠眺西邊的安平港。
  explain: |
    (C) 玉山到北峰的路線沿著主稜線走，兩側地勢都較低，視野開闊，可以向西遠眺 ✓
    (B) 北峰到西峰是直線，橫越多條等高線，中間要下切到山谷再上升，不是沿著山脊（全國 37% 誤選）✗
    (A) 西峰到玉山的路線也橫切多條等高線，不是一路沿著稜線前進（全國 25% 誤選）✗
    (D) 東峰到北峰在主稜線的東側，往西的視線被主稜擋住（全國 6% 誤選）✗
soc112-52:
  key: 新法增加「夫或妻」請育嬰假的彈性、提高津貼，結果男性申請成長特別多 → 鼓勵夫妻共同分擔育兒，減輕女性負擔，以提高生育意願。
  explain: |
    (B) 讓父親也能請育嬰假，男性申請人數大幅成長，政策目標是夫妻共同分攤育嬰責任 ✓
    (D) 政策對象是已婚勞工，內容是育嬰假，不是鼓勵早婚（全國 28% 誤選）✗
    (C) 政策沒有針對高齡婦女（全國 7% 誤選）✗
    (A) 育嬰假是留職停薪，保留工作，不是鼓勵退出職場 ✗
soc112-53:
  key: 北歐國家的出生率雖然比東亞高，但都是醫療發達的高所得國家，出生率、死亡率都低 → 人口轉型的低穩定階段。
  explain: |
    (A) 北歐國家出生率、死亡率都低，人口自然增加緩慢，屬於低穩定階段；出生率「相對」東亞較高，不代表處在擴張階段 ✓
    (B) 高穩定階段是出生率、死亡率都高的傳統社會（全國 30% 誤選）✗
    (D) 晚期擴張階段出生率仍明顯高於死亡率，人口增加還算快，不符合北歐現況（全國 21% 誤選）✗
    (C) 早期擴張階段死亡率剛開始下降、出生率仍高（全國 19% 誤選）✗

# ---------- Day 39：臺灣史、聚落與交通、民主政治與媒體 ----------
soc112-08:
  key: 駐軍沒錢買貨，中國商人就不來了 → 商人來基隆的目的是賣貨換取西班牙人的錢，也就是從美洲運來的白銀。
  explain: |
    (C) 西班牙人以美洲白銀購買中國貨物，駐軍若拿不到白銀薪餉，商人就失去來基隆的理由 ✓
    (D) 文中說貨物只能賣給駐軍，可見當地市場並不大（全國 21% 誤選）✗
    (A) 良港是條件之一，但傳教士的話強調的是駐軍有沒有錢購買（全國 20% 誤選）✗
    (B) 駐軍保障安全不是商人來的主因 ✗
soc113-18:
  key: 北營對聯「營靖洪流」→ 這個村落常受洪水威脅；要找顯示地勢低窪、靠近水域的地名。
  explain: |
    (A) 「大潭」表示有大片水潭，地勢低窪，容易積水淹水，和對聯中的洪流相符 ✓
    (C) 東澳、烏石鼻是海灣與岬角，屬於海岸地形，對應的是海浪而非洪流（全國 22% 誤選）✗
    (D) 大坪頂、松柏崙是台地、山丘頂，地勢高，不易淹水（全國 21% 誤選）✗
    (B) 崁頂、馬頭山都在高處（全國 15% 誤選）✗
soc112-60:
  key: 媒體報導不等於真實，而是經過選擇、詮釋後「再現」的世界；大量轉載西班牙的疫情新聞，讓人誤以為流感起源於西班牙。
  explain: |
    (C) 媒體再現：媒體呈現的內容會塑造大眾的認知，報導集中在西班牙，就讓人把疫情和西班牙連在一起 ✓
    (A) 媒體近用是民眾使用、接近媒體表達意見的權利（全國 26% 誤選）✗
    (B) 媒體壟斷是媒體所有權過度集中（全國 23% 誤選）✗
    (D) 媒體守門是編輯決定哪些消息可以刊出；各國審查只能解釋當時的報導，不能解釋至今仍以訛傳訛（全國 16% 誤選）✗
soc112-09:
  key: 波斯文說刺桐（泉州）是「艾哈瑪德家族母親的城市」→ 他的母親來自泉州，可見泉州的波斯人會和漢人通婚。
  explain: |
    (B) 母親的家鄉是泉州，碑文又兼用漢文與漢式的「先君」紀年，顯示這個波斯家族已和漢人通婚、融入當地 ✓
    (A) 一方墓碑無法證明「客死他鄉者多」，墓主母系也是泉州人，不算客死他鄉（全國 35% 誤選）✗
    (D) 碑文刻的是伊斯蘭教的經句，看不出採用儒家喪葬儀式（全國 18% 誤選）✗
    (C) 一方墓碑無法證明「全數」改信 ✗
soc113-19:
  key: 終年潮濕積水、廣布泥炭地、會被開礦或焚林種油棕 → 熱帶雨林（印尼、馬來西亞等）；這些國家多曾是殖民地，經濟仍受外資與殖民地式結構支配。
  explain: |
    (D) 礦產、油棕園多由外資經營，利潤流回外國，國內生產毛額（GDP）雖高，國民所得（GNI）卻偏低 ✓
    (C) 熱帶雨林國家多輸出原料，不是以出口擴張的製造業為主（全國 41% 誤選）✗
    (A) 熱帶雨林國家不全以穆斯林為主（例如巴西、剛果）（全國 9% 誤選）✗
    (B) 題目討論的是熱帶雨林的開發與經濟結構，和世界都市的形成無關（全國 6% 誤選）✗

# ---------- Day 40：全球化與多元文化、臺灣史、世界區域地理 ----------
soc113-01:
  key: 原住民族各族的祭儀日定為法定節日並放假 → 承認少數群體的文化、分配資源讓他們能實踐自己的文化；手語納入國家語言也是保障少數群體（聾人）的語言文化。
  explain: |
    (B) 臺灣手語納入國家語言，和原住民族祭儀放假一樣，是肯定少數群體的文化並給予資源保障 ✓
    (C) 解除新住民參政限制是保障平等的政治權利，不是針對群體文化分配資源（全國 26% 誤選）✗
    (A) 子女姓氏約定是家庭內的平等問題 ✗
    (D) 限制外國人持股是國家安全與媒體管理的規定 ✗
soc112-10:
  key: 傳教士跟著洋行商人進入淺山 → 開港後洋行到淺山地區經營樟腦（樟樹長在丘陵淺山），傳教範圍也跟著擴大。
  explain: |
    (D) 樟腦是開港後臺灣的重要出口品，樟樹分布在淺山丘陵，洋行深入當地收購，傳教士也一同進入 ✓
    (B) 圍獵捕鹿是十七世紀荷蘭時期的鹿皮貿易，十九世紀晚期鹿已很少（全國 23% 誤選）✗
    (C) 甘蔗種在南部平原，不在淺山（全國 15% 誤選）✗
    (A) 種椰取汁不是洋行經營的事業 ✗
soc113-20:
  key: 有袋類從北美洲經南美洲，在岡瓦納大陸內部遷移 → 從南美洲經南極洲到達澳洲；和亞洲、非洲的化石關係較遠，所以路線不經過非洲、印度。
  explain: |
    (D) 丁從南美洲經南極洲到澳洲，沒有經過非洲與印度，符合學界觀點 ✓
    (A) 甲經過非洲與印度，但亞洲、非洲的有袋類化石和澳洲關係較遠（全國 40% 誤選）✗
    (B) 乙是往南美洲的方向遷移，而且經過非洲（全國 19% 誤選）✗
    (C) 丙是從南極洲往南美洲遷移，方向和「從南美洲進入澳洲」相反（全國 11% 誤選）✗
soc113-03:
  key: 價格下跌表示供給增加的幅度大於需求增加的幅度：需求因咖啡風行而增加，但殖民地大量種植使供給增加更多。
  explain: |
    (B) 需求與供給都增加時，若供給增加較多，均衡價格會下跌 ✓
    (C) 消費成長是需求增加，只會使價格上升，不能解釋價格下跌（全國 8% 誤選）✗
    (A) 市場短缺會使價格上升 ✗
    (D) 文中沒有提到價格管制 ✗
soc112-12:
  key: 移民群體遷居八、九代，靠俸祿過活、不親自耕作 → 西晉末年南渡江左的北方士族；顏之推《顏氏家訓》就批評南朝士族不懂世務。
  explain: |
    (C) 永嘉之亂後北方士族南遷，到南朝已八、九代，憑門第世代任官，脫離實務 ✓
    (D) 宋明時期官員主要由科舉產生，不是世代靠門第領俸祿的移民群體（全國 21% 誤選）✗
    (B) 兩漢時期還沒有這種南渡士族群體（全國 19% 誤選）✗
    (A) 春秋時期由世襲貴族擔任官職，沒有「遷居八、九代的移民群體」靠俸祿為生的現象（全國 10% 誤選）✗

# ---------- Day 41：世界區域地理、經濟學概念、社會規範與社會化 ----------
soc113-29:
  key: 依國內生產毛額大小與人均判斷：乙經濟規模最大（德國，西歐）；丙規模次之、人均低於歐盟平均（西班牙，南歐）；丁規模小但人均最高（瑞典，北歐）；甲規模最小、人均最低（保加利亞，東歐）。
  explain: |
    (B) 甲在東歐（保加利亞）、乙在西歐（德國）、丙在南歐（西班牙）、丁在北歐（瑞典）✓
    (D) 德國的經濟規模是歐盟最大，應是乙，不是丁（全國 20% 誤選）✗
    (A) 甲的國內生產毛額只有約 890 億美元，不可能是西班牙這樣的大國（全國 13% 誤選）✗
    (C) 乙、丁的位置顛倒，甲、丙也不符（全國 10% 誤選）✗
soc113-30:
  key: 四國人均國內生產毛額從約 1.4 萬到 5.6 萬美元，差距很大 → 經濟發展落差使歐盟要推動共同政策（例如共同貨幣、財政規範）時面臨挑戰。
  explain: |
    (C) 會員國之間的發展差距大，各國需求不同，政策難以整合 ✓
    (D) 表 3 只有各國的國內生產毛額與出口品項，看不出彼此交換的價格是否不平等（全國 28% 誤選）✗
    (A) 四國都有出口機械設備，看不出製造業的困境（全國 15% 誤選）✗
    (B) 表 3 只有單一年份的資料，看不出向東擴散的趨勢（全國 11% 誤選）✗
soc113-21:
  key: 校長認為男性「先天」在數理能力上就比女性強 → 某一方生產能力直接比另一方高，是絕對利益的概念。
  explain: |
    (D) 絕對利益指某人生產同一項產品的能力（效率）比別人高；校長主張男性的數理能力本來就比較強 ✓
    (B) 比較利益是比較雙方生產不同產品的機會成本，校長並沒有比較機會成本（全國 50% 誤選）✗
    (A) 人力資本是透過教育、訓練累積的能力，不是先天的優勢（全國 9% 誤選）✗
    (C) 市場機能是價格調節供需的作用 ✗
soc113-22:
  key: 校長的推論前提是「男性數理能力先天較強」→ 只要證明男女數理能力相當，前提就不成立，觀點就被推翻。
  explain: |
    (C) 若男女在各學習階段的數理能力相當，「男性先天有優勢」的前提就不成立，足以反駁校長 ✓
    (B) 老師高估男生的成績只能說明評量有偏誤，不能證明男女能力相當（全國 13% 誤選）✗
    (D) 女性老師的啟蒙只說明了榜樣的影響，不能直接反駁能力差異的說法（全國 13% 誤選）✗
    (A) 大眾的尊敬與信任程度和數理能力無關 ✗
soc112-13:
  key: 「甲午年打下敗陣」「庚子歲慘遭殺傷」→ 寫於八國聯軍（1900 年）之後；「驅外族、復我冠裳」是要推翻滿清 → 革命黨人的宣傳（陳天華〈猛回頭〉）。
  explain: |
    (C) 內容提到甲午戰爭與庚子拳亂，又主張驅逐滿人，是八國聯軍後革命黨人的排滿宣傳 ✓
    (B) 戊戌變法發生在 1898 年，早於庚子；維新派主張保皇，不會說驅逐外族（全國 18% 誤選）✗
    (A) 太平天國在 1864 年就失敗了，不可能提到甲午與庚子（全國 12% 誤選）✗
    (D) 立憲派主張在清朝體制下改革，不主張驅逐外族（全國 12% 誤選）✗

# ---------- Day 42：氣候與生態、地形與自然環境、民主政治與媒體 ----------
soc113-31:
  key: 9 月、夜間、上游山區豪雨 → 颱風季節；颱風外圍環流把潮濕氣流帶到山區，迎風面降下大雨。
  explain: |
    (A) 9 月仍是颱風季，颱風外圍環流帶來的西南或東北氣流遇山抬升，常在山區造成夜間豪雨 ✓
    (C) 熱力對流旺盛多發生在夏季午後，不是夜晚（全國 16% 誤選）✗
    (D) 滯留鋒面（梅雨）主要在 5、6 月（全國 14% 誤選）✗
    (B) 強烈冷鋒多在冬、春季南下（全國 10% 誤選）✗
soc113-32:
  key: 雨下在上游，洪峰從上游往下游傳遞 → 依「最高水位發生時間」由早到晚排列：丙（23:20）→戊（23:50）→乙（00:40）→甲（01:20）→丁（12:40）。
  explain: |
    (B) 越上游的測站越早出現最高水位，依時間先後排出丙戊乙甲丁 ✓
    (A) 這是依水面距堤防的高差由小到大排列，和上下游無關（全國 25% 誤選）✗
    (D) 這是依高差由大到小排列（全國 24% 誤選）✗
    (C) 和最高水位發生的時間順序不符（全國 6% 誤選）✗
soc113-23:
  key: 民主課責：政府要向人民說明施政情況、為決策負責，接受監督 → 定期公布治安狀況並提出因應措施，性質相同。
  explain: |
    (A) 主管機關公開治安狀況與因應措施，讓人民了解施政並監督政府，是民主課責的表現 ✓
    (C) 公告衛生標準並邀請學者修正，是政策制定的程序，不是向人民報告施政成果（全國 13% 誤選）✗
    (B) 民意調查是了解民意，不是政府交代施政 ✗
    (D) 宣導健康飲食是政策宣傳，不是課責 ✗
soc113-24:
  key: 指揮中心先前的命令限制了人民權利卻缺乏明確的法律授權，所以立法院趕緊立特別條例授權 → 法律保留原則；土地登記規則影響財產權、應改以法律規定，也是法律保留。
  explain: |
    (D) 限制人民財產權的重要事項應以法律規定，不能只靠行政命令，和特別條例要解決的問題一樣是法律保留原則 ✓
    (B) 大法官釋憲後戶政機關依解釋辦理，談的是憲法解釋的拘束力（全國 27% 誤選）✗
    (C) 政府突然停止原有補助，涉及信賴保護原則（全國 26% 誤選）✗
    (A) 不分情節一律最高額罰鍰，違反的是比例原則（全國 10% 誤選）✗
soc113-25:
  key: 重罰讓隔離者不敢出門，改用外送平台購買國內的商品與服務 → 新增國內生產的最終財貨與勞務，計入 GDP。
  explain: |
    (C) 隔離者透過外送平台購買營養品，帶動國內的生產與外送服務，會增加 GDP ✓
    (B) 罰鍰轉為紓困補貼是移轉性支付，不計入 GDP（全國 22% 誤選）✗
    (A) 重罰的目的就是讓人不敢擅自出門，擅自外出購買不是重罰衍生的影響（全國 12% 誤選）✗
    (D) 報名國外大學的課程是購買外國的服務，屬於進口，不會增加國內生產毛額（全國 10% 誤選）✗
soc113-26:
  key: 偏鄉學生家中的電腦、網路設備不足，線上教學的學習品質受影響 → 數位落差。
  explain: |
    (D) 不同地區、家庭取得與使用科技的機會不同（近用落差），偏鄉學生較難順利線上學習 ✓
    (A) 科技導致社會變遷是一般現象，不能說明偏鄉學生特別受影響 ✗
    (B) 時空收斂是距離的時間成本縮短，對偏鄉學生反而有利 ✗
    (C) 產品生命週期和學習品質無關 ✗

