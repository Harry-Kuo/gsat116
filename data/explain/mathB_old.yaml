# 數學B 舊課綱學測（100–108 年）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）
# 100–108 年是舊課綱的「數學」卷（數A、數B 同一份），每題只排在一科；超出 108 課綱範圍的題目不收。

mb108-03:
  key: 化成同底：$2^{k+2m+3n}=2^9$，數 $k+2m+3n=9$ 的正整數解。
  explain: |
    $2^k4^m8^n=2^{k+2m+3n}=512=2^9$ ⇒ $k+2m+3n=9$（k、m、n 都是正整數）
    $n=1$：$k+2m=6$ ⇒ $(m,k)=(1,4),(2,2)$，2 組
    $n=2$：$k+2m=3$ ⇒ $(m,k)=(1,1)$，1 組
    $n\ge3$：$k+2m\le0$，不可能
    共 3 組 → 答案 (3)
mb108-04:
  key: 每道菜恰好一種肉，可以用肉來代表菜；三種素食材各自選一道菜：$3^3=27$。
  explain: |
    3 種肉、3 道菜，每道菜一定要有肉、每種食材只用一次 ⇒ 每道菜恰好一種肉。
    所以三道菜可以叫做「豬肉菜」「雞肉菜」「牛肉菜」，分配方法只看素食材放進哪一道。
    白菜、豆腐、香菇各有 3 道菜可選：$3\times3\times3=27$ → 答案 (5)
mb108-05:
  key: $\log100=2$，代入得 $3\log b=5$，$\log b=\dfrac{5}{3}\approx1.67$，介於 1.5 與 2 之間。
  explain: |
    $\log100=2$ ⇒ $2\log b+2+\log b=7$ ⇒ $\log b=\dfrac{5}{3}$
    選項端點取對數：$\log(10\sqrt{10})=1.5$、$\log100=2$
    $1.5\le\dfrac{5}{3}\le2$ ⇒ $10\sqrt{10}\le b\le100$ → 答案 (4)
mb108-06:
  key: 相關係數 $-0.99$ 幾乎是一條直線：氣溫每升 1°C 約少賣 38 杯，從 11°C 往回推 3°C。
  explain: |
    相關係數接近 $-1$，資料幾乎落在一條遞減的直線上，可以用斜率外推。
    氣溫每升 2°C 的銷量變化：$-75,-76,-82,-76,-68$，平均約 $-75$，也就是每 1°C 約少 38 杯。
    （最適直線斜率 $=\dfrac{\sum(x-\bar{x})(y-\bar{y})}{\sum(x-\bar{x})^2}=\dfrac{-2669}{70}\approx-38.1$）
    8°C 比 11°C 低 3°C：$512+3\times38\approx626$，最接近 625 杯 → 答案 (2)
mb108-08:
  key: 先判斷兩人是相向、背向還是同向追趕；同一段時間內「路程比＝速率比」。
  explain: |
    甲在 −8、乙在 10，乙的速率是甲的 a 倍（$a>1$），設甲的速率為 v。
    (1) 甲往負、乙往正：背向而行，越離越遠 ✗
    (2) 都往負：乙在甲的正向那一側又比較快，會追上甲 ✗
    (3) 甲到原點要 $\dfrac{8}{v}$，乙要 $\dfrac{10}{av}$；只有 $a>\dfrac{5}{4}$ 時乙才先到，不一定 ✗
    (4) 都往正：甲在後、乙在前且乙較快，距離越來越大 ✓
    (5) 在 −2 相遇：甲走 6、乙走 12，路程比＝速率比 ⇒ $a=2$ ✓
    → 答案 (4)(5)
mb108-09:
  key: 用奇偶分類：和為奇＝一奇一偶，差為偶＝同奇偶，積為奇＝兩個都奇。
  explain: |
    從 7 個數取 2 個：$C(7,2)=21$ 種；奇數 1、3、5、7 有 4 個，偶數 2、4、6 有 3 個。
    (1) 和大於 10：$(4,7),(5,6),(5,7),(6,7)$，機率 $\dfrac{4}{21}\ne\dfrac{1}{7}$ ✗
    (2) 和小於 5：$(1,2),(1,3)$，機率 $\dfrac{2}{21}\ne\dfrac{1}{7}$ ✗
    (3) 和為奇數 ⇔ 一奇一偶：$\dfrac{4\times3}{21}=\dfrac{4}{7}$ ✓
    (4) 差為偶數 ⇔ 同奇偶：$\dfrac{C(4,2)+C(3,2)}{21}=\dfrac{3}{7}$ ✗
    (5) 積為奇數 ⇔ 兩個都奇：$\dfrac{C(4,2)}{21}=\dfrac{2}{7}$ ✓
    → 答案 (3)(5)
mb108-10:
  key: 先求 $\angle C$ 的範圍：$60^\circ<C<80^\circ$；銳角時 sin 遞增、cos 遞減；大角對大邊。
  explain: |
    $100^\circ<A+B<120^\circ$ ⇒ $60^\circ<C<80^\circ$，三個角都是銳角且 $A<B<C$。
    (1) 銳角範圍內 sin 遞增，$A<B$ ⇒ $\sin A<\sin B$ ✓
    (2) $B\le60^\circ<C$ ⇒ $\sin B<\sin C$ ✓
    (3) cos 遞減 ⇒ $\cos A>\cos B$ ✗
    (4) $C>45^\circ$ ⇒ $\sin C>\cos C$ ✗
    (5) $\overline{AB}$ 對 $\angle C$、$\overline{BC}$ 對 $\angle A$，$C>A$ ⇒ $\overline{AB}>\overline{BC}$ ✗
    → 答案 (1)(2)
mb108-14:
  key: 矩陣乘開得 $3x-y=3$、$2x+4y=-5$，解出 $x=\dfrac{1}{2}$、$y=-\dfrac{3}{2}$。
  explain: |
    $\begin{bmatrix}3&-1&3\\2&4&-1\end{bmatrix}\begin{bmatrix}x\\y\\1\end{bmatrix}=\begin{bmatrix}3x-y+3\\2x+4y-1\end{bmatrix}=\begin{bmatrix}6\\-6\end{bmatrix}$
    ⇒ $3x-y=3$、$2x+4y=-5$ ⇒ $x=\dfrac{1}{2}$、$y=-\dfrac{3}{2}$
    $x+3y=\dfrac{1}{2}-\dfrac{9}{2}=-4$ → ⑭＝−、⑮＝4
mb108-18:
  key: $\angle BED=60^\circ=\angle EDB$ ⇒ △BED 是正三角形；$\angle DAC=30^\circ=\angle C$ ⇒ $AD=DC=15$。
  explain: |
    A、E、D 共線：$\angle BED=180^\circ-120^\circ=60^\circ$，又 $\angle EDB=60^\circ$ ⇒ △BED 是正三角形，$BD=ED=7$。
    $\angle ADC=180^\circ-60^\circ=120^\circ$、$\angle C=30^\circ$ ⇒ $\angle DAC=30^\circ$ ⇒ $AD=DC=15$
    △ABD 中 $\angle ADB=60^\circ$，餘弦定理：$\overline{AB}^2=15^2+7^2-2\times15\times7\times\dfrac{1}{2}=169$ ⇒ $\overline{AB}=13$
    → ㉕＝1、㉖＝3
mb107-01:
  key: $PA=PB=AB$：P 在 AB 的中垂面上，且到 AB 中點的距離固定是 $\dfrac{\sqrt{3}}{2}AB$。
  explain: |
    $PA=PB$ ⇒ P 在線段 AB 的中垂面上。
    $PA=AB$ ⇒ P 到 AB 中點 M 的距離 $PM=\sqrt{AB^2-\left(\dfrac{AB}{2}\right)^2}=\dfrac{\sqrt{3}}{2}AB$，是定值。
    所以 P 是中垂面上「以 M 為圓心、半徑 $\dfrac{\sqrt{3}}{2}AB$」的圓 → 答案 (4)
    平面上只有 2 個點，到了空間會轉成一整圈。
mb107-02:
  key: 每題猜對機率 $\dfrac{1}{5}$，10 題全對 $=\left(\dfrac{1}{5}\right)^{10}=\dfrac{2^{10}}{10^{10}}\approx1.02\times10^{-7}$。
  explain: |
    各題獨立，全對機率 $=\left(\dfrac{1}{5}\right)^{10}=\left(\dfrac{2}{10}\right)^{10}=\dfrac{1024}{10^{10}}\approx1.02\times10^{-7}$
    最接近 $10^{-7}$ → 答案 (3)
mb107-04:
  key: 取常用對數：$\dfrac{9}{\log2}<x<\dfrac{10\log9}{\log2}$，也就是 $29.9<x<31.7$。
  explain: |
    $10^9<2^x$ ⇒ $x>\dfrac{9}{\log2}=\dfrac{9}{0.3010}\approx29.9$
    $2^x<9^{10}$ ⇒ $x<\dfrac{10\log9}{\log2}=\dfrac{10\times0.9542}{0.3010}\approx31.7$
    整數 $x=30,31$，共 2 個 → 答案 (2)
    驗算：$2^{30}\approx1.07\times10^9$、$2^{31}\approx2.15\times10^9$、$9^{10}\approx3.49\times10^9$。
mb107-06:
  key: 第三週成本跌 50% ⇒ 售價跌 25%；第四週成本漲 80% ⇒ 售價漲 40%。
  explain: |
    第三週：成本 $\dfrac{50-100}{100}=-50\%$ ⇒ 售價 $-25\%$：$x=180\times0.75=135$
    第四週：成本 $\dfrac{90-50}{50}=+80\%$ ⇒ 售價 $+40\%$：$y=135\times1.4=189$
    $120<x=135<180<y=189$ → 答案 (5)
    注意：漲跌幅都以「前一週」為基準，第四週要用 135 而不是 180 來算。
mb107-08:
  key: 先把小華各科對到的標準寫出來：國文、數學、自然只到均標，英文、社會到前標。
  explain: |
    小華：國文 11（均標 10、前標 12）→ 只到均標；英文 12 → 到前標；數學 9（均標 7、前標 10）→ 只到均標；自然 9（均標 9、前標 11）→ 剛好均標；社會 12 → 到前標。
    (1) 甲：國文均標 ✓、英文前標 ✓、社會均標 ✓ ⇒ 可以 ✓
    (2) 乙：國文要前標，11 未達 12 ✗
    (3) 丙：數學、自然都沒有達前標 ✗
    (4) 丁：英文達前標 ✓、自然均標 ✓、社會均標 ✓ ⇒ 可以 ✓
    (5) 戊：自然要前標，9 未達 11 ✗
    → 答案 (1)(4)
mb107-13:
  key: 三點共線 ⇒ 斜率相等；$\log6-\log3=\log2$，橫坐標每加 3，縱坐標加 $\log2$。
  explain: |
    前兩點斜率 $=\dfrac{\log6-\log3}{6-3}=\dfrac{\log2}{3}$
    第三點：$y=\log6+(12-6)\times\dfrac{\log2}{3}=\log6+2\log2=\log24$ → ⑬＝2、⑭＝4
mb107-14:
  key: 梯子長 L 不變：$\overline{BC}=L\cos60^\circ$、$\overline{FC}=L\cos\angle EFC=0.8L$，兩者相差 51。
  explain: |
    設梯長 L：$\overline{BC}=L\cos60^\circ=0.5L$
    $\sin\angle EFC=0.6$ ⇒ $\cos\angle EFC=0.8$ ⇒ $\overline{FC}=0.8L$
    $\overline{FC}-\overline{BC}=0.3L=51$ ⇒ $L=170$ → ⑮＝1、⑯＝7、⑰＝0
mb107-17:
  key: 配方求頂點 $C(-1,-4)$，因式分解求 $A(1,0)$、$B(-3,0)$，再用內積算夾角。
  explain: |
    $y=(x+1)^2-4$ ⇒ 頂點 $C(-1,-4)$；$y=(x+3)(x-1)$ ⇒ 與 x 軸交於 $(1,0)$、$(-3,0)$
    $\overrightarrow{CA}=(2,4)$、$\overrightarrow{CB}=(-2,4)$，長度都是 $\sqrt{20}$
    $\cos\angle ACB=\dfrac{-4+16}{20}=\dfrac{3}{5}$ → ㉓＝3、㉔＝5
mb107-18:
  key: 先用第三列 $[1\ \ 2]$ 求出 $e=8$，再由第二列對第一、三行的兩個等式解出 c、d。
  explain: |
    第三列：$1\times7+2e=23$ ⇒ $e=8$
    第二列：$-3c-4d=0$、$7c+8d=7$ ⇒ $c=7$、$d=-\dfrac{21}{4}$
    $y=5c+6d=35-\dfrac{63}{2}=\dfrac{7}{2}$ → ㉕＝7、㉖＝2
mb106-01:
  key: 全校比率是加權平均 $\dfrac{T r_1+S r_2}{T+S}$，只要知道師生人數的比 $T:S$ 就能算。
  explain: |
    設老師 T 人、學生 S 人，全校玩過的比率 $=\dfrac{Tr_1+Sr_2}{T+S}=\dfrac{(T/S)r_1+r_2}{(T/S)+1}$，只跟 $\dfrac{T}{S}$ 有關。
    (1) 師生人數比，就能算出 ✓
    (2)(3)(4) 只知道其中一個人數，不知道比例，算不出來
    (5) 只知道玩過的總人數，不知道全校人數，算不出來
    → 答案 (1)
mb106-02:
  key: 點三次：$b\to b^2\to b^4\to b^8$；$b^8=81^3=3^{12}$ ⇒ $b=3^{3/2}=3\sqrt{3}$。
  explain: |
    點一次平方一次：$b\to b^2\to b^4\to b^8$
    $b^8\approx81^3=3^{12}$ ⇒ $b\approx3^{12/8}=3^{3/2}=3\sqrt{3}\approx5.2$ → 答案 (3)
mb106-04:
  key: 設正立方體邊長 1、放上坐標：$P=(t,0,0)$、$Q=(1,1,t)$，距離平方是 t 的二次函數。
  explain: |
    取 $A(0,0,0)$、$B(1,0,0)$、$C(1,1,0)$、$D(1,1,1)$（邊長 1）。
    t 秒時兩質點在 $P(t,0,0)$、$Q(1,1,t)$
    $\overline{PQ}^2=(1-t)^2+1+t^2=2t^2-2t+2=2\left(t-\dfrac{1}{2}\right)^2+\dfrac{3}{2}$
    $t=\dfrac{1}{2}$ 時距離最小，之前變小、之後變大 → 答案 (4)
mb106-05:
  key: 把每個點的「溫差＝$y-x$」算出來：最高溫越高的月份溫差越小，但沒有原來排得那麼直。
  explain: |
    從圖讀出 12 個月的（最低溫，最高溫），算溫差：
    最高溫 4～9°C 的月份溫差約 12～17°C；最高溫 18～27°C 的月份溫差只有 7～11°C。
    最高溫越高、溫差越小 ⇒ 負相關。
    原圖的點幾乎排成一直線（相關係數接近 1）；新圖的點比較散，相關性比較弱 → 答案 (4)
mb106-07:
  key: 麵不能連兩天 ⇒ 先決定「吃麵的日子」（不相鄰），再排兩種麵和兩種飯（相鄰的飯也不能重複）。
  explain: |
    兩種麵 N₁、N₂，兩種飯 R₁、R₂。吃麵的日子不能相鄰，且兩種麵都要出現 ⇒ 吃麵 2 天或 3 天。
    ① 吃麵 2 天（不相鄰的兩天有 6 種）：兩種麵排法 2 種；剩下 3 天吃飯，相鄰的飯要交錯：
    　麵在 1、3 天：飯在 2 和 4、5 ⇒ $2\times2=4$；1、4：$2\times2=4$；1、5：飯在 2、3、4 連三天 ⇒ 2；
    　2、4：飯在 1、3、5 各自選但兩種都要出現 ⇒ $2^3-2=6$；2、5：4；3、5：4
    　小計 $2\times(4+4+2+6+4+4)=48$
    ② 吃麵 3 天：只能 1、3、5，兩種麵都要出現 $2^3-2=6$ 種；飯在 2、4 兩種都要出現 2 種 ⇒ 12
    共 $48+12=60$ → 答案 (2)
mb106-09:
  key: 圓心 $(h,k)$ 要比較靠近 $(2,6)$、離原點較遠：$h^2+k^2>(h-2)^2+(k-6)^2$ ⇔ $h+3k>10$，且半徑介於兩個距離之間。
  explain: |
    原點在外、$(2,6)$ 在內 ⇒ $\text{圓心到}(2,6)\text{的距離}<r<\text{圓心到原點的距離}$，化簡得圓心滿足 $h+3k>10$。
    (1) 例如圓心 $(-1,6)$、$r=4$ 就可以，第二象限可能 ✗
    (2) 第三象限 $h<0$、$k<0$，$h+3k<0$，不可能 ✗
    (3) 圓心 $(100,100)$、r 約 137 也可以，半徑不一定小於 10 ✗
    (4) 圓心在 x 軸上 ⇒ $h>10$，x 坐標必定大於 10 ✗
    (5) 第四象限 $k<0$ ⇒ $h>10-3k>10$，$r>\sqrt{(h-2)^2+(k-6)^2}>\sqrt{8^2+6^2}=10$ ✓
    → 答案 (5)
mb106-11:
  key: △ADE 是等腰直角 ⇒ $AD=2\sqrt{2}$、$\angle DAB=60^\circ$；△ABD 用餘弦定理求 BD，再看 △BCD 是直角三角形。
  explain: |
    △ADE：$\overline{AD}=\sqrt{2^2+2^2}=2\sqrt{2}$、$\angle DAE=45^\circ$ ⇒ $\angle DAB=105^\circ-45^\circ=60^\circ$
    △ABD 餘弦定理：$\overline{BD}^2=(\sqrt{6}+\sqrt{2})^2+8-2(\sqrt{6}+\sqrt{2})(2\sqrt{2})\cdot\dfrac{1}{2}=(8+4\sqrt{3})+8-(4\sqrt{3}+4)=12$ ⇒ $\overline{BD}=2\sqrt{3}$
    正弦定理：$\sin\angle ABD=\dfrac{2\sqrt{2}\sin60^\circ}{2\sqrt{3}}=\dfrac{\sqrt{2}}{2}$ ⇒ $\angle ABD=45^\circ$
    △BCD：$2^2+(2\sqrt{3})^2=16=4^2$，B 是直角，面積 $\dfrac{1}{2}\times2\times2\sqrt{3}=2\sqrt{3}$
    (1) $\overline{AD}=2\sqrt{2}$ ✓
    (2) 是 60° ✗
    (3) 是 $2\sqrt{3}$ ✗
    (4) $\angle ABD=45^\circ$ ✓
    (5) 面積是 $2\sqrt{3}$ ✗
    → 答案 (1)(4)
mb106-12:
  key: 英文及格 ⊂ 國文及格 ⇒「三科全及格」＝「數學和英文都及格」的 x 人；再由 $y\le11$ 求 x 的範圍。
  explain: |
    數學及格 34 人 ⇒ $x+y=34$；英文不及格的只有 $50-39=11$ 人 ⇒ $y\le11$，所以 $23\le x\le34$。
    英文及格的人國文也及格 ⇒ 三科都及格 $=x$ 人，至少一科不及格 $=50-x$ 人，介於 16 與 27 之間。
    (1) $x+y=34$ ✗
    (2) ✓
    (3) 應為 $50-x$，只有 $y=11$ 時才等於 $39-x+y$ ✗
    (4) 最少 16 人 ✗
    (5) 最多 $50-23=27$ 人 ✓
    → 答案 (2)(5)
mb106-14:
  key: $f(0)=a_2-a_1=1$、$f(1)=3$、$f(2)=7$；二次函數的二階差固定，$f(3)=13$。
  explain: |
    $f(n-2)=a_n-a_{n-1}$：$f(0)=1$、$f(1)=3$、$f(2)=7$
    一階差 2、4，二次函數的二階差固定為 2 ⇒ 下一個一階差 6 ⇒ $f(3)=13$
    $a_5=a_4+f(3)=12+13=25$ → ⑭＝2、⑮＝5
mb106-16:
  key: 代 $x=-1$ 恰為 0 ⇒ 有因式 $x+1$；剩下的 $5x^2+(a-1)x+1$ 要有有理根 ⇒ 判別式是完全平方數。
  explain: |
    $x=-1$：$-5+(a+4)-a+1=0$ ⇒ $5x^3+(a+4)x^2+ax+1=(x+1)(5x^2+(a-1)x+1)$
    $5x^2+(a-1)x+1=0$ 的根是有理數 ⇒ $(a-1)^2-20=m^2$（m 為整數）
    $(a-1-m)(a-1+m)=20$，兩因數同奇偶 ⇒ $2\times10$ ⇒ $a-1=6$、$m=4$ ⇒ $a=7$
    驗算：$5x^2+6x+1=(5x+1)(x+1)$ → ㉔＝7
mb105-01:
  key: 最小值在 $x=2$ ⇒ 圖形對稱於 $x=2$，$f(1)=f(3)=3$。
  explain: |
    $x=2$ 有最小值 1 ⇒ $f(x)=a(x-2)^2+1$，$a>0$；$f(3)=a+1=3$ ⇒ $a=2$
    $f(1)=2(1-2)^2+1=3$（也可以直接用對稱：1 和 3 對稱於 $x=2$）→ 答案 (3)
mb105-02:
  key: 化成銳角：$\sin146^\circ=\sin34^\circ$、$\sin219^\circ=-\sin39^\circ$、$\sin292^\circ=-\sin68^\circ$、$\sin365^\circ=\sin5^\circ$。
  explain: |
    正的三個：$\sin73^\circ>\sin34^\circ\,(=\sin146^\circ)>\sin5^\circ\,(=\sin365^\circ)>0$
    負的兩個：$\sin219^\circ=-\sin39^\circ$、$\sin292^\circ=-\sin68^\circ$
    由小到大：$\sin292^\circ<\sin219^\circ<\sin365^\circ<\sin146^\circ<\sin73^\circ$，中位數是 $\sin365^\circ$ → 答案 (5)
mb105-03:
  key: $(x+y)^2=1$ 是兩條直線 $x+y=\pm1$；比較圓心到直線的距離和半徑。
  explain: |
    $\Gamma_1$：圓心 $(-1,0)$、半徑 1；$\Gamma_2$：$x+y=1$ 或 $x+y=-1$ 兩條直線。
    圓心到 $x+y=1$：$\dfrac{|-1+0-1|}{\sqrt{2}}=\sqrt{2}>1$，不相交
    圓心到 $x+y=-1$：距離 0，直線過圓心，交 2 點
    共 2 個交點 → 答案 (2)
mb105-04:
  key: 120 小時是 A 的 16 個半衰期：$2m\left(\dfrac{1}{2}\right)^{16}=m\left(\dfrac{1}{2}\right)^{15}$，所以 B 剛好經過 15 個半衰期。
  explain: |
    設 B 原有 m、A 原有 $2m$。120 小時後：A 剩 $2m\left(\dfrac{1}{2}\right)^{120/7.5}=2m\left(\dfrac{1}{2}\right)^{16}=m\left(\dfrac{1}{2}\right)^{15}$
    B 剩 $m\left(\dfrac{1}{2}\right)^{120/T}$，兩者相等 ⇒ $\dfrac{120}{T}=15$ ⇒ $T=8$ 小時 → 答案 (1)
mb105-07:
  key: 數線上 $|x|+|x-5|$＝到 0 和到 5 的距離和，最小 5；$|x|-|x-5|$＝距離差，介於 −5 與 5 之間。
  explain: |
    $|x|+|x-5|\ge5$（x 在 0 與 5 之間時等於 5）；$-5\le|x|-|x-5|\le5$。
    (1) 1 小於 5，無解 ✗
    (2) 6 大於 5，有解（$x=-\dfrac{1}{2}$ 或 $\dfrac{11}{2}$）✓
    (3) 有解（$x=3$：$3-2=1$）✓
    (4) 6 超過 5，無解 ✗
    (5) 有解（$x=2$：$2-3=-1$）✓
    → 答案 (2)(3)(5)
mb105-08:
  key: 逐項比價；(3) 先用最便宜的包裝買，剩下的錢再補單顆；(5) 找一個反例（10 顆蘋果）。
  explain: |
    (1) 甲：3 顆一袋 130 元，3 袋 1 顆裝 135 元，比較便宜 ✓
    (2) 乙奇異果每顆：18、$16.\overline{6}$、16.25、$15.8\overline{3}$ 元，袋越大越便宜 ✓
    (3) 甲 5 顆裝每顆 16 元最便宜：6 袋 30 顆 480 元，剩 20 元再買 1 顆，共 31 顆 ✗
    (4) 甲：奇異果 12 顆最少 $80+80+35=195$、蘋果 4 顆最少 $130+45=175$，共 370 元；乙：奇異果 $95\times2=190$、蘋果 4 顆一袋 190，共 380 元，甲較少 ✓
    (5) 10 顆蘋果：乙 420 元；甲最少 $340+45+45=430$ 元，甲反而貴 ✗
    → 答案 (1)(2)(4)
mb105-11:
  key: 新成績是原始成績的遞增函數（順序不變，中位數跟著對應），但不是一次函數（平均數、全距不會照比例）。
  explain: |
    (1) $40\log\dfrac{10}{10}+60=60$ ✓
    (2) $x>20$ ⇒ $\dfrac{x+1}{10}>2.1$ ⇒ 新成績 $>40\log2.1+60\approx72.9>70$ ✓
    (3) 函數越往右越平緩：若全班都在 50～59 分，新成績只在 88～91 分，全距反而變小 ✗
    (4) 遞增函數不改變名次，第 21 名還是第 21 名，中位數對應到中位數 ✓
    (5) log 不是一次函數，「平均的函數值」不等於「函數值的平均」✗
    → 答案 (1)(2)(4)
mb105-13:
  key: 分「A 有沒有抽走甲的鑰匙」討論：B 不會拿甲，所以甲的鑰匙集中留給 C、D。
  explain: |
    A 抽到四把的機率各 $\dfrac{1}{4}$。
    甲的鑰匙：A 沒抽到（$\dfrac{3}{4}$）時，B 不拿甲，留給 C、D 各一半 ⇒ $P(C\text{ 抽到甲})=P(D\text{ 抽到甲})=\dfrac{3}{8}$
    乙的鑰匙：A 抽到甲（$\dfrac{1}{4}$）時 B 從三把裡抽，乙占 $\dfrac{1}{3}$；A 抽到丙或丁（$\dfrac{1}{2}$）時 B 從乙和另一把裡抽，乙占 $\dfrac{1}{2}$
    $P(B\text{ 抽到乙})=\dfrac{1}{4}\times\dfrac{1}{3}+\dfrac{1}{2}\times\dfrac{1}{2}=\dfrac{1}{3}$，同理 B 抽到丙也是 $\dfrac{1}{3}$
    C 抽到乙、丙、丁的機率相同：$\dfrac{1-3/8}{3}=\dfrac{5}{24}$
    (1) $\dfrac{1}{4}<\dfrac{3}{8}$ ✗
    (2) 兩者都是 $\dfrac{3}{8}$ ✗
    (3) $\dfrac{1}{4}<\dfrac{1}{3}$ ✗
    (4) $\dfrac{1}{3}>\dfrac{5}{24}$ ✓
    (5) $\dfrac{3}{8}>\dfrac{5}{24}$ ✓
    → 答案 (4)(5)
mb105-18:
  key: 先算 $x+2y\le14$ 在第一象限的三角形面積 49，再扣掉 $x-3y>a$ 切掉的小三角形。
  explain: |
    $x+2y\le14$ 在第一象限是三角形，面積 $\dfrac{1}{2}\times14\times7=49$。
    $x-3y=a$ 交 x 軸於 $(a,0)$、交 $x+2y=14$ 於 $\left(\dfrac{2a+42}{5},\dfrac{14-a}{5}\right)$，切掉的三角形底 $14-a$、高 $\dfrac{14-a}{5}$
    $49-\dfrac{(14-a)^2}{10}=\dfrac{213}{5}$ ⇒ $(14-a)^2=64$ ⇒ $a=6$（$0<a<14$）→ ㉕＝6
mb104-01:
  key: 把前幾項逐一代進遞迴式檢查；$a_{n+1}-a_n$ 依序是 1、4、9、16，正好是 $n^2$。
  explain: |
    相鄰兩項的差：$2-1=1$、$6-2=4$、$15-6=9$、$31-15=16$，正好是 $1^2,2^2,3^2,4^2$ ⇒ $a_{t+1}=a_t+t^2$
    其他選項代入都有不合：(1) $a_3=3\times2-1=5$；(2) $3!=6$ 但 $4!=24$；(4) $2^2-1=3$；(5) $a_3=2\times2+1=5$
    → 答案 (3)
mb104-02:
  key: 等比級數 $1+2+\cdots+2^{29}=2^{30}-1$，而 $2^{10}=1024\approx10^3$ ⇒ $2^{30}\approx10^9$。
  explain: |
    第 n 天得 $2^{n-1}$ 元，30 天共 $1+2+4+\cdots+2^{29}=2^{30}-1$ 元。
    $2^{30}=(2^{10})^3=1024^3\approx1.07\times10^9$ → 答案 (4)
mb104-03:
  key: 串接時「前面壞＝兩個都壞」，所以機器壞的機率＝前面那個壞的機率；並列時兩個獨立都壞才壞。
  explain: |
    (一) A 在前：A 壞會連帶 B 壞，兩個都壞；A 沒壞時 A 還能用，機器能運作 ⇒ $p_1=0.1$
    (二) B 在前：同理 $p_2=0.15$
    (三) 並列、互不影響：$p_3=0.1\times0.15=0.015$
    $p_2>p_1>p_3$ → 答案 (2)
mb104-05:
  key: 表上是「每公里的平均心率」，看不出最高心率；相關的正負看「一個變大時另一個是變大還是變小」。
  explain: |
    (1) 188 是第十公里的「平均」心率，瞬間最高心率可能更高 ✗
    (2) 總步數 $990+1000+1005+995+1015+1005+1050\times3+1100=10260$ 步，10 公里 ⇒ 每步不到 1 公尺 ✓
    (3) 越後面完成時間越短、心率越高 ⇒ 負相關 ✗
    (4) 步數多的公里心率也比較高 ⇒ 正相關 ✓
    (5) 步數多的公里完成時間比較短 ⇒ 負相關 ✓
    → 答案 (2)(4)(5)
mb104-07:
  key: 四點 $A\left(-1,\dfrac{1}{2}\right)$、$B(0,1)$、$C(1,2)$、$D(2,4)$；指數函數圖形凹口向上，弦在圖形上方。
  explain: |
    $A\left(-1,\dfrac{1}{2}\right)$、$B(0,1)$、$C(1,2)$、$D(2,4)$
    (1) 直線 AC 在 $x=0$ 時 $y=\dfrac{1}{2}+\dfrac{2-1/2}{2}=1.25>1$，B 在直線下方 ✓
    (2) 斜率 AB $=\dfrac{1}{2}$、BC $=1$、CD $=2$，CD 最大 ✓
    (3) A 的 y 坐標 $\dfrac{1}{2}$ 最小，A 最靠近 x 軸 ✗
    (4) $2^x=2x$ 在 $x=1$、$x=2$ 成立（就是 C、D 兩點），只有這兩個交點 ✓
    (5) A、C 的 y 坐標不同，不對稱 ✗
    → 答案 (1)(2)(4)
mb104-10:
  key: 全部用 A 表示：$B=35-A$、$C=24-A$、$D=A-14$；各數都不能是負的 ⇒ $14\le A\le24$。
  explain: |
    $B=35-A$、$C=24-A$、$D=45-(A+B+C)=A-14$；$C\ge0$、$D\ge0$ ⇒ $14\le A\le24$
    (1) $A>B$ ⇔ $A>17.5$，不一定 ✗
    (2) $A>C$ ⇔ $A>12$，恆成立 ✓
    (3) $B-C=11>0$，恆成立 ✓
    (4) $B>D$ ⇔ $A<24.5$，恆成立 ✓
    (5) $C>D$ ⇔ $A<19$，不一定 ✗
    → 答案 (2)(3)(4)
mb104-11:
  key: 設山高 h，山腳到 A、B 的水平距離分別是 $\dfrac{h}{\tan13^\circ}$、$\dfrac{h}{\tan15^\circ}$，相差 37。
  explain: |
    $\dfrac{h}{0.231}-\dfrac{h}{0.268}=37$ ⇒ $h=\dfrac{37\times0.231\times0.268}{0.268-0.231}=\dfrac{37\times0.061908}{0.037}\approx61.9$
    四捨五入約 62 公丈 → ⑪＝6、⑫＝2
mb104-16:
  key: 複利本利和 $3\times10^6\times1.03^3$，單利本利和 $3\times10^6\times(1+3\times0.03)$，相減。
  explain: |
    $1.03^3=1.092727$
    複利：$3000000\times1.092727=3278181$ 元；單利：$3000000\times1.09=3270000$ 元
    少繳 $3278181-3270000=8181$ 元 → ㉓＝8、㉔＝1、㉕＝8、㉖＝1
mb104-20:
  key: A 處輪子沿 AB 前進 ⇒ $AC\perp AB$；B 處輪子偏 28° ⇒ $\angle ACB=28^\circ$，直角三角形 $\overline{BC}=\dfrac{\overline{AB}}{\sin28^\circ}$。
  explain: |
    後輪 A 的行進方向沿著 AB ⇒ $\overline{AC}\perp\overline{AB}$，△ABC 在 A 是直角。
    前輪偏了 28°，而 BC 垂直前輪方向 ⇒ BC 和 AC 的夾角也是 28°，即 $\angle ACB=28^\circ$。
    $\overline{BC}=\dfrac{\overline{AB}}{\sin28^\circ}=\dfrac{2.85}{0.4695}\approx6.07$，約 6.1 公尺 → ㊱＝6、㊲＝1
mb103-01:
  key: $\log(a^n)=n\log a$，這裡指數是 $3^5$：$\log\left(2^{(3^5)}\right)=3^5\log2$。
  explain: |
    $\log\left(2^{(3^5)}\right)=3^5\log2$（指數 $3^5$ 整個拿到前面）→ 答案 (5)
    常見錯誤：把 $2^{(3^5)}$ 看成 $(2^3)^5=2^{15}$，那是 (2) 的 $3\times5\log2$。
mb103-02:
  key: $PA=PB$ ⇒ P 在 AB 的中垂面 $x=0$ 上；再用 $PA=13$ 求出 P。
  explain: |
    A、B 只有 x 坐標不同（$\pm5$），中垂面是 $x=0$；P 又在 xy 平面上 ⇒ $P(0,y,0)$
    $\overline{PA}^2=25+y^2+144=169$ ⇒ $y=0$ ⇒ $P(0,0,0)$ → 答案 (4)
mb103-03:
  key: 配方：$(x+1)^2+(y+1)^2=1$，圓心正好是正方形的頂點 $(-1,-1)$、半徑 1。
  explain: |
    圓 $(x+1)^2+(y+1)^2=1$：圓心 $(-1,-1)$、半徑 1。
    正方形邊長 2，圓心在左下角頂點上，圓只會碰到經過這個頂點的兩條邊：
    $x=-1$ 上交於 $(-1,0)$；$y=-1$ 上交於 $(0,-1)$（另外兩個交點 $(-1,-2)$、$(-2,-1)$ 不在邊上）
    另兩條邊離圓心 2，碰不到。共 2 個交點 → 答案 (2)
mb103-04:
  key: $|A|\le B$ ⇔ $-B\le A\le B$：$-2x\le4x-12\le2x$ ⇒ $2\le x\le6$。
  explain: |
    $-2x\le4x-12$ ⇒ $x\ge2$；$4x-12\le2x$ ⇒ $x\le6$
    解為 $[2,6]$，長度 4 → 答案 (4)
mb103-05:
  key: 二項式展開 $\sum C^6_k(\sqrt{2})^k$：k 為奇數的項才有 $\sqrt{2}$，$(\sqrt{2})^3=2\sqrt{2}$、$(\sqrt{2})^5=4\sqrt{2}$。
  explain: |
    $(1+\sqrt{2})^6=\sum_{k=0}^{6}C^6_k(\sqrt{2})^k$
    k 為奇數時：$C^6_1\sqrt{2}+C^6_3\cdot2\sqrt{2}+C^6_5\cdot4\sqrt{2}$
    $b=C^6_1+2C^6_3+2^2C^6_5$ → 答案 (2)
mb103-08:
  key: $\sqrt{13}\approx3.606$、$\sqrt{3}\approx1.732$；或兩邊平方比較（兩邊都是正數時才能平方）。
  explain: |
    $3.6^2=12.96<13$ ⇒ $\sqrt{13}>3.6$
    (1) $\sqrt{13}>3.6>3.5$ ✓
    (2) $\sqrt{13}>3.6$ ✗
    (3) $\sqrt{13}-\sqrt{3}\approx1.87<\sqrt{10}\approx3.16$ ✗
    (4) $\sqrt{13}+\sqrt{3}\approx5.34>4$ ✓
    (5) $\dfrac{1}{\sqrt{13}-\sqrt{3}}=\dfrac{\sqrt{13}+\sqrt{3}}{10}\approx0.534<0.6$ ✗
    → 答案 (1)(4)
mb103-09:
  key: 位置 $(-3+tv_1,\ 6+tv_2)$：要同時讓 $x>0$、$y>0$。$v_1>0$ 才可能讓 x 變正，再看那時 y 還是不是正的。
  explain: |
    t 秒後位置 $(-3+tv_1,\ 6+tv_2)$，$t>0$。
    (1) $x>0$ 要 $t>3$，此時 $y=6-2t<0$ ✗
    (2) $3<t<6$ 時 $x>0$、$y>0$ ✓
    (3) y 一直是 6，x 終究會變正 ✓
    (4) x 終究變正，y 越來越大 ✓
    (5) x 一直變小，不會變正 ✗
    → 答案 (2)(3)(4)
mb103-10:
  key: $f(1)>0$、$f(2)<0$、$f(3)>0$ ⇒ f 開口向上，兩根分別在 $(1,2)$、$(2,3)$；$(x-2)(x-3)$ 在 $x=2,3$ 時為 0。
  explain: |
    f 在 2 的值比兩旁都小 ⇒ 開口向上，兩根一個在 $(1,2)$、一個在 $(2,3)$。
    (1) 開口向上 ✗
    (2) g 的領導係數是 f 的領導係數加 1，仍為正，開口向上 ✗
    (3) $g(1)=f(1)+(-1)(-2)=f(1)+2>f(1)$ ✓
    (4) $g(1)>0$、$g(2)=f(2)<0$；g 開口向上且 $g(2)<0$，兩根分在 2 的兩側 ⇒ $(1,2)$ 間恰有一根 ✓
    (5) $2<\alpha<3$ ⇒ $g(\alpha)=0+(\alpha-2)(\alpha-3)<0$ ✗
    → 答案 (3)(4)
mb103-12:
  key: 35～44 歲的失業率是 35～39 與 40～44 兩組的「加權平均」，權重是各組勞動力人數。
  explain: |
    (1) 13.17% 最高 ✓
    (2) 只有比率、沒有人數，無法比較 ✗
    (3) 要兩組勞動力相同才是簡單平均 ✗
    (4) $12.66\%$ 介於 9.80% 與 13.17% 之間且很靠近 13.17% ⇒ 40～44 歲的權重比較大，勞動力比較多 ✓
    (5) 兩組失業率沒有因果關係 ✗
    → 答案 (1)(4)
mb103-13:
  key: 切線垂直半徑：直角三角形 ODC 中 $CD=10$、$\sin\angle DOC=\dfrac{10}{26}=\dfrac{5}{13}$；$AB=OA\sin\angle AOB$。
  explain: |
    $CD\perp OD$ ⇒ $\overline{CD}=\sqrt{26^2-24^2}=10$，$\sin\angle DOC=\dfrac{10}{26}=\dfrac{5}{13}$
    $\overline{AB}=\overline{OA}\sin\angle AOB=24\times\dfrac{5}{13}=\dfrac{120}{13}$ → ⑬＝1、⑭＝2、⑮＝0、⑯＝1、⑰＝3
mb103-15:
  key: 以道路為 x 軸、A 的垂足為原點：$A(0,6)$、$B(6\sqrt{3},0)$，超市 $P(p,0)$ 滿足 $PA=PB$。
  explain: |
    A 到道路的垂足 H：$\overline{HB}=\sqrt{12^2-6^2}=6\sqrt{3}$。設 $H(0,0)$、$A(0,6)$、$B(6\sqrt{3},0)$、超市 $P(p,0)$。
    $p^2+36=(p-6\sqrt{3})^2$ ⇒ $12\sqrt{3}p=72$ ⇒ $p=2\sqrt{3}$
    $\overline{PA}=\sqrt{12+36}=4\sqrt{3}$ → ㉑＝4、㉒＝3
mb102-01:
  key: 國文 65 分沒到 70 ⇒ 資格變成「英文 70 以上且數學及格」；不符合 ⇒ 兩個條件至少一個不成立。
  explain: |
    國文未達 70 分，第一項要求只能靠英文 ⇒ 參選資格＝「英文 70 分以上」且「數學及格」。
    不符合資格 ⇒「且」的否定是「或」：英文未達 70 分，或數學不及格（至少一項）→ 答案 (5)
    (1)～(4) 都只是其中一種可能，不一定成立。
mb102-02:
  key: 都提出 $2.6^9$：$a=1.6\times2.6^9$、$b=1.6\times2.6\times2.6^9$、$c=\dfrac{2.6^2-1}{2}\times2.6^9$。
  explain: |
    $a=2.6^9(2.6-1)=1.6\times2.6^9$
    $b=2.6^{10}(2.6-1)=4.16\times2.6^9$
    $c=\dfrac{2.6^9(2.6^2-1)}{2}=\dfrac{5.76}{2}\times2.6^9=2.88\times2.6^9$
    $b>c>a$ → 答案 (4)
mb102-05:
  key: 黃 $=2a+1$、綠 $=2b+1$，紅 $=22-2a-2b\ge1$ ⇒ $a+b\le10$；數非負整數解。
  explain: |
    設黃 $2a+1$ 顆、綠 $2b+1$ 顆（$a,b\ge0$），紅 $=24-(2a+1)-(2b+1)=22-2(a+b)$ 顆。
    紅至少 1 顆 ⇒ $a+b\le10$（此時紅是正的偶數）。
    $a+b=0,1,\ldots,10$ 的解各有 $1,2,\ldots,11$ 組，共 $1+2+\cdots+11=66$ → 答案 (2)
mb102-06:
  key: 水平距離固定，高度 $=d\tan\theta$；等速上升 ⇒ $\tan\theta$ 每 10 分鐘增加相同的量。
  explain: |
    設水平距離 d，高度 $h=d\tan\theta$。10:00 時 $h=0.577d$，10:10 時 $h=0.675d$，每 10 分鐘升 $0.098d$。
    10:30 時 $h=0.577d+3\times0.098d=0.871d$ ⇒ $\tan\theta\approx0.871$，最接近 $\tan41^\circ=0.869$ → 答案 (3)
mb102-07:
  key: 算 $M^2$、$M^3$ 找規律：$M^n=\begin{bmatrix}1&2^n-1\\0&2^n\end{bmatrix}$。
  explain: |
    $M^2=\begin{bmatrix}1&3\\0&4\end{bmatrix}$、$M^3=\begin{bmatrix}1&7\\0&8\end{bmatrix}$ ⇒ $a_n=1$、$b_n=2^n-1$、$c_n=0$、$d_n=2^n$
    (1) $a_2=1$ ✓
    (2) 1, 1, 1 是公比 1 的等比數列 ✓
    (3) 2, 4, 8 等比 ✓
    (4) 1, 3, 7 不是等差 ✗
    (5) 0, 0, 0 是公差 0 的等差數列 ✓
    → 答案 (1)(2)(3)(5)
mb102-12:
  key: 公比為負 ⇒ $a_9$、$a_{10}$ 一正一負；不論哪個是負的，b 數列都比它小 ⇒ 公差必為負。
  explain: |
    (1) 公比 $-0.8$，相鄰兩項異號 ⇒ $a_9a_{10}<0$ ✓
    若 $a_{10}<0$：$b_{10}<a_{10}<0$；若 $a_9<0$：$b_9<a_9<0$，公差 $d<-\dfrac{10}{8}$，$b_{10}$ 更小。
    所以 $b_{10}<0$，且 $10+9d<0$ ⇒ $d<0$。
    (2) $b_{10}<0$ ✗
    (3) $d<0$ ⇒ $b_9>b_{10}$ ✓
    (4) 兩種正負情形都可能發生（例如 $a_9=\pm1$、$d=-2$），不一定 ✗
    (5) 反例 $a_9=1$、$d=-1.3$：$a_8=-1.25$、$b_8=0.9$，$a_8<b_8$ ✗
    → 答案 (1)(3)
mb102-13:
  key: 同乘 3：$k<3\sqrt{31}<k+1$，而 $3\sqrt{31}=\sqrt{279}$，$16^2=256<279<289=17^2$。
  explain: |
    $\dfrac{k}{3}<\sqrt{31}<\dfrac{k+1}{3}$ ⇔ $k<3\sqrt{31}<k+1$，k 是 $3\sqrt{31}$ 的整數部分。
    $3\sqrt{31}=\sqrt{279}$，$16^2=256<279<289=17^2$ ⇒ $k=16$ → ⑬＝1、⑭＝6
mb102-15:
  key: C 在 AB 外、$AC:BC=3:1$ ⇒ 順序是 A、B、C，$AB:BC=2:1$，B 是 AC 的內分點。
  explain: |
    C 不在 A、B 之間且 $AC>BC$ ⇒ 三點順序 A、B、C，$\overline{AB}=2\overline{BC}$
    B 把 AC 分成 $2:1$：$B=\dfrac{A+2C}{3}$ ⇒ $16=\dfrac{a+38}{3}$、$b=\dfrac{3+24}{3}$
    $a=10$、$b=9$，$a+b=19$ → ⑲＝1、⑳＝9
mb102-16:
  key: 設第二天賣 x 公斤，第一天就是 $100-x-t$；列總收入方程式解出 x。
  explain: |
    第一天賣 $100-x-t$ 公斤：$40(100-x-t)+36x+32t=3720$
    $4000-4x-8t=3720$ ⇒ $x=70-2t$
    $a=-2$、$b=70$ → ㉑＝−、㉒＝2、㉓＝7、㉔＝0
mb101-01:
  key: 通分：$\dfrac{1}{25}+\dfrac{1}{16}+1=\dfrac{16+25+400}{400}=\dfrac{441}{400}$，開根號得 $\dfrac{21}{20}$。
  explain: |
    $\dfrac{1}{5^2}+\dfrac{1}{4^2}+1=\dfrac{16+25+400}{400}=\dfrac{441}{400}$
    $\sqrt{\dfrac{441}{400}}=\dfrac{21}{20}=1.05$ → 答案 (2)
mb101-02:
  key: 分六個方向看：前、後各是 $1+2+\cdots+10=55$；上、下、左、右各是 10。
  explain: |
    正面看到的是階梯形，面積 $10+9+\cdots+1=55$，背面相同。
    從上往下看、從下往上看都是一排 10 格；從左看是一列 10 格，從右看每一層露出一格，也是 10。
    表面積 $=2\times55+4\times10=150$ 平方公分 → 答案 (5)
mb101-05:
  key: $x^2=10^{5.6}=y$，所以 $x^2+y=2\times10^{5.6}$，取對數 $=\log2+5.6$。
  explain: |
    $\log x^2=2\times2.8=5.6$ ⇒ $x^2=10^{5.6}$，而 $y=10^{5.6}$
    $\log(x^2+y)=\log(2\times10^{5.6})=\log2+5.6\approx5.901$ → 答案 (3)
mb101-06:
  key: 差的絕對值為 k（$k\ge1$）有 $2(10-k)$ 種，k 越小越多；差 0 只有 10 種。
  explain: |
    兩次抽取共 100 種結果。
    差為 0：$(0,0),\ldots,(9,9)$ 共 10 種
    差為 k（$1\le k\le9$）：$(a,a+k)$ 有 $10-k$ 種，順序可對調，共 $2(10-k)$ 種
    $k=1$ 時有 18 種最多（大於差 0 的 10 種）→ 答案 (2)
mb101-09:
  key: 每邊兩個三等分點選一個：$2^3=8$ 個三角形；放坐標逐一檢查，2 個正三角形，其餘 6 個都是直角三角形。
  explain: |
    三點都取「沿逆時針方向的第一個三等分點」或都取「第二個」，得到 2 個邊長 $\sqrt{3}$ 的正三角形（銳角三角形）。
    其餘 6 個：例如取 AB 上靠近 A 的點 P、BC 上靠近 B 的點 Q、CA 上靠近 A 的點 R，PQ 與 PR 一個鉛直、一個水平，P 是直角；逐一用內積檢查，6 個都是直角三角形。
    (1) 每邊選一點，共 $2\times2\times2=8$ 個三角形 ✓
    (2) 銳角恰 2 個 ✓
    (3) 直角有 6 個 ✗
    (4) 沒有鈍角 ✗
    (5) 正三角形有 2 個 ✗
    → 答案 (1)(2)
mb101-15:
  key: 和三角形「恰有一個交點」⇒ 直線只碰到一個頂點、三角形在直線同一側；L 由兩個三角形各一個頂點決定。
  explain: |
    L 要經過兩個三角形各一個頂點，並讓兩個三角形各自在 L 的同一側。逐一檢查斜率為負的候選：
    A、E：斜率 −4，但 D、F 在 L 的兩側，會穿過 △DEF ✗
    B、F：斜率 $-\dfrac{11}{5}$，但 A、C 在兩側 ✗
    C、F：$y=-3x+18$，A、B 都在下方，D、E 也都在下方 ✓，斜率 −3
    A、F：斜率 −1 也可以，但比 −3 大
    最小斜率 −3 → ⑰＝−、⑱＝3
mb101-16:
  key: 北極星 ＝ 天樞 ＋ 5 ×（天璇到天樞的向量）。
  explain: |
    天璇 → 天樞的向量 $=(7-9,\ 11-8)=(-2,3)$
    北極星 $=(7,11)+5(-2,3)=(-3,26)$ → ⑲＝−、⑳＝3、㉑＝2、㉒＝6
mb101-18:
  key: 設 $AP=x$、$AR=y$：Q 在 BC 上 ⇔ $x+y=13$；面積 $xy\sin60^\circ=20\sqrt{3}$ ⇒ $xy=40$。
  explain: |
    平行四邊形 APQR：$\overrightarrow{AQ}=\overrightarrow{AP}+\overrightarrow{AR}$，Q 在 BC 上 ⇔ $\dfrac{x}{13}+\dfrac{y}{13}=1$ ⇒ $x+y=13$
    面積 $=xy\sin60^\circ=20\sqrt{3}$ ⇒ $xy=40$ ⇒ $\{x,y\}=\{5,8\}$
    $\overline{PR}^2=x^2+y^2-2xy\cos60^\circ=25+64-40=49$ ⇒ $\overline{PR}=7$ → ㉗＝7
mb100-01:
  key: 期望值 $=\sum(\text{獎金}\times\text{機率})=50\times\dfrac{3}{5}+100\times\dfrac{2}{5}$。
  explain: |
    取到黑球機率 $\dfrac{3}{5}$、白球 $\dfrac{2}{5}$
    期望值 $=50\times\dfrac{3}{5}+100\times\dfrac{2}{5}=30+40=70$（元）→ 答案 (1)
mb100-02:
  key: 展開後合併：$2x^3-2x=2x(x-1)(x+1)$；也可以代 $x=0,1,-1$ 檢查哪個選項的值相同。
  explain: |
    $(x+1)^2(x-3)=x^3-x^2-5x-3$，$(x-1)^3=x^3-3x^2+3x-1$
    相加再加 $4x^2+4$：$2x^3+0x^2-2x+0=2x(x^2-1)=2x(x-1)(x+1)$ → 答案 (5)
    快速檢查：代 $x=0$、$x=1$ 原式都是 0，只有 (3)(5) 符合；再代 $x=2$：原式 $20-9+1=12$，(5) 是 12。
mb100-04:
  key: 乘積為 0 ⇔ 其中一個因式為 0：第一個因式只有原點，第二個因式是兩條直線 $y=\pm\dfrac{4}{3}x$。
  explain: |
    第一個因式 $\dfrac{x^2}{25}+\dfrac{y^2}{16}=0$ ⇔ $x=y=0$，只有原點。
    第二個因式 $\dfrac{x^2}{9}-\dfrac{y^2}{16}=0$ ⇔ $\left(\dfrac{x}{3}-\dfrac{y}{4}\right)\left(\dfrac{x}{3}+\dfrac{y}{4}\right)=0$ ⇔ $y=\pm\dfrac{4}{3}x$，兩條直線。
    原點已經在這兩條直線上，圖形就是兩條相異直線 → 答案 (3)
    注意：等號右邊是 0 而不是 1，所以不是橢圓也不是雙曲線。
mb100-06:
  key: 61 筆資料的中位數是第 31 小；已有 24 筆小於 0.2，只要把 0.2 以上的值由小到大排，找第 7 個。
  explain: |
    中位數是第 31 小的資料。小於 0.2 的有 24 筆，再找「0.2 以上」的第 7 小。
    0.2 附近的資料由小到大：0.2019、0.2034、0.2051、0.2085、0.2123、0.2137、0.2164、0.2166、0.2190…
    第 7 個是 0.2164 → 答案 (2)
mb100-09:
  key: 直角三角形的外心是斜邊中點、外接圓半徑是斜邊一半；內切圓半徑 $r=\dfrac{3+4-5}{2}=1$，圓心 $(1,1)$。
  explain: |
    $\angle O=90^\circ$，斜邊 $\overline{AB}=5$。
    外接圓 $C_1$：圓心是斜邊中點 $\left(\dfrac{3}{2},2\right)$，半徑 $\dfrac{5}{2}$
    內切圓 $C_2$：$r=\dfrac{3+4-5}{2}=1$，圓心 $(1,1)$
    (1) 半徑是 $\dfrac{5}{2}$ ✗
    (2) $\left(\dfrac{3}{2},2\right)$ 不在 $y=x$ 上 ✗
    (3) $4\times\dfrac{3}{2}+3\times2=12$ ✓（就是斜邊 AB 所在直線）
    (4) $(1,1)$ 在 $y=x$ 上 ✓
    (5) $4+3=7\ne6$ ✗
    → 答案 (3)(4)
mb100-16:
  key: 用餘事件：1 −（全男）−（全女）$=1-\dfrac{C^{20}_3+C^{15}_3}{C^{35}_3}$。
  explain: |
    $C^{35}_3=6545$，全男 $C^{20}_3=1140$，全女 $C^{15}_3=455$
    $P=1-\dfrac{1140+455}{6545}=\dfrac{4950}{6545}=\dfrac{90}{119}$ → ⑲＝9、⑳＝0、㉑＝1、㉒＝1、㉓＝9
