# ---------- Day 57：史料與歷史解釋、東亞國際關係、世界史 ----------
soc113-41:
  key: 資料甲的分期：古老的印度教文明 → 十三世紀伊斯蘭統治者入侵、專制統治 → 近代英國殖民者帶領進入另一階段。
  explain: |
    (D) 依資料甲，印度歷史分為印度教時期、伊斯蘭統治時期、英國殖民時期 ✓
    (A) 資料甲沒有把英國殖民稱為「民主自由時期」，分期是依統治者的宗教與政權（全國 19% 誤選）✗
    (C) 資料甲沒有提到神權、王權、帝國的區分（全國 11% 誤選）✗
    (B) 共產社會、封建、資本主義是馬克思的社會發展分期，資料甲沒有提到 ✗
soc113-42:
  key: 資料甲說伊斯蘭統治使印度文明僵化，資料乙說蒙兀兒帝國帶來進步 → 對不同文化（印度教、伊斯蘭）如何影響印度發展，有不同的評價。
  explain: |
    (B) 甲、乙對伊斯蘭文化進入印度後的影響看法相反，適合探討文化異同與其發展機會 ✓
    (A) 兩則資料談的是印度內部不同統治時期的評價，不是全球化經濟（全國 12% 誤選）✗
    (C) 兩則資料的重點不在獨立運動（全國 8% 誤選）✗
    (D) 兩則資料沒有談到區域之間的貿易交換 ✗
soc113-44:
  key: 明治政府仿效英國扶植輪船公司、經營歐亞航路，和英、法輪船公司競爭 → 發展航運與貿易，富國強兵。
  explain: |
    (C) 開闢歐亞航路可以發展海運與對外貿易，增加國家財富，是殖產興業的一環 ✓
    (A) 大東亞共榮圈是 1940 年代的口號，不是 1890 年代（全國 19% 誤選）✗
    (D) 航路的目的是經營貿易運輸，不是爭奪東南亞資源（全國 10% 誤選）✗
    (B) 開闢航路不是為了海外殖民 ✗
soc113-45:
  key: 1850 年蘇伊士運河還沒開通（1869 年才通航）→ 從英國經伊比利半島後，要繞過非洲南端的好望角，再到印度、東南亞、上海。
  explain: |
    (C) 經好望角繞過非洲，到印度孟買，再經檳城、麻六甲海峽、新加坡前往上海，符合當時航路 ✓
    (D) 蘇伊士運河 1869 年才開通，1850 年無法通過；而且航路是從英國出發（全國 25% 誤選）✗
    (B) 航路要經過印度，巽他海峽、雅加達、馬尼拉也不在題文所列的航線上（全國 18% 誤選）✗
    (A) 巴拿馬運河 1914 年才開通，而且航路不經美國 ✗
soc113-51:
  key: 依時代排序：古希臘陶瓶（特洛伊戰爭題材，古典希臘時期）→ 君士坦丁金幣（四世紀羅馬）→ 希臘文福音故事馬賽克（拜占庭時期）→ 古蘭經（鄂圖曼帝國時期）。
  explain: |
    (D) 丁古希臘 → 乙羅馬君士坦丁 → 甲拜占庭基督教藝術 → 丙伊斯蘭的鄂圖曼時期 ✓
    (C) 古蘭經屬於伊斯蘭時期，是最晚的，不會排第一（全國 17% 誤選）✗
    (B) 古希臘陶瓶比君士坦丁時代更早（全國 14% 誤選）✗
    (A) 古希臘陶瓶最早，應排第一（全國 8% 誤選）✗
soc113-52:
  key: 修憲後改為總統制：總統由普選產生、組成政府，不對國會負責；但國會仍掌握預算審議權，可以制衡總統。
  explain: |
    (C) 總統制下行政與立法分立，國會的預算審議權是制衡總統的重要工具 ✓
    (B) 行政首長到國會報告、對國會負責是內閣制的特色（全國 19% 誤選）✗
    (A) 國會沒有過半就要組聯合政府，是內閣制的特色（全國 15% 誤選）✗
    (D) 國會提出不信任案倒閣，也是內閣制的特色（全國 13% 誤選）✗

# ---------- Day 58：臺灣史、社會規範與社會化、中國史 ----------
soc113-58:
  key: 初等女子教育以日語、裁縫、家政為主 → 目標是培養會持家、具日本婦德的「賢妻良母」，不是培養專業人才。
  explain: |
    (D) 課程集中在裁縫、家政，加上日語教育，反映培養具日本婦德的賢妻良母的理念 ✓
    (C) 基層人員需要的是實務技能，裁縫、家政課程是為了家庭角色，不是為殖民統治培養人員（全國 20% 誤選）✗
    (B) 醫師、教員等專業人才是後來中等以上教育的結果，不是初等教育課程的設計理念（全國 10% 誤選）✗
    (A) 題文說臺灣女童受教育仍屬少數，課程也偏重家事，不是為了男女平權 ✗
soc113-59:
  key: 女性高度集中在家政、照顧類職業 → 社會期待女性扮演照顧者，造成男女集中在不同職業（職業性別隔離）。
  explain: |
    (D) 傳統性別角色期待女性擔任照顧工作，使女性集中在特定職業，形成職業隔離 ✓
    (B) 玻璃天花板指的是女性升遷到高層受阻，不是集中在某類職業（全國 15% 誤選）✗
    (C) 女性能進入專業職業是社會變遷的進步，題文的重點在職業分布不均 ✗
    (A) 女性集中在少數職業，正好不是多元化 ✗
soc110-18:
  key: 清廷治臺消極、以防範亂事為主；大規模民變（如朱一貴事件、林爽文事件）後，常增設縣廳加強控制。
  explain: |
    (C) 朱一貴事件後增設彰化縣、淡水廳，林爽文事件後也調整行政區 → 主要考量治安 ✓
    (D) 設廳並不是為了保障原住民 ✗
    (A)(B) 清廷調整行政區不是依自然地形或交通線規劃 ✗
soc110-19:
  key: 《氏族志》改以「現在的官爵」排名，禁止山東士族互相通婚 → 打壓傳統門第，抬高皇室與新貴的地位。
  explain: |
    (B) 皇帝要把士族的社會地位壓到皇室與當朝官員之下，並禁止他們以聯姻結成勢力 ✓
    (A) 科舉制度並沒有因為士族通婚而被壟斷（全國 18% 誤選）✗
    (C) 「七姓十家不得自為婚」針對的是特定士族之間的聯姻，不是近親通婚 ✗
    (D) 題文沒有提到土地兼併 ✗
soc110-20:
  key: 食物配給、只有紅茶沒咖啡、乳製品從紐西蘭與加拿大輸入、政府鼓勵自己種菜（Dig for Victory）→ 二戰時的英國。
  explain: |
    (B) 二戰時英國實施配給制，海運受德國潛艇威脅，奶油、乳酪多來自大英國協的紐西蘭與加拿大；政府號召民眾自己種糧食 ✓
    (A) 一戰時的德國不會從紐西蘭、加拿大（英國的協約國陣營）取得物資（全國 15% 誤選）✗
    (C) 文革時期的中國，生活中不會有茶會、乳酪、紐西蘭貨 ✗
    (D) 伊朗是產油國，石油危機不會造成這樣的糧食配給 ✗

# ---------- Day 59：中國史、東亞國際關係、世界史 ----------
soc110-21:
  key: 二十世紀初王道士在敦煌莫高窟藏經洞發現大批文書，被斯坦因、伯希和等人買走 → 甘肅。
  explain: |
    (C) 敦煌位於甘肅河西走廊，是絲路上的佛教重鎮，藏經洞文書有漢文、梵文、藏文等，大量流入英、法、俄 ✓
    (D) 雲南（全國 30% 誤選）、(A) 山西、(B) 遼寧都不是藏經洞所在 ✗
soc110-23:
  key: 研究並仿造西洋船砲 → 魏源等人主張「師夷長技以制夷」。
  explain: |
    (C) 鴉片戰爭後，有識之士研究西方火器、輪船，想學習西方的技術來抵抗西方 ✓
    (B) 只學軍事技術，不是全盤西化（全國 37% 誤選）✗
    (A) 嚴守夷夏之防是排斥西方事物，不會去研究西洋軍事 ✗
    (D) 目的是自強禦侮，不是對外擴張的軍國主義 ✗
soc110-24:
  key: 雲南、貴州、廣西、四川大規模叛變後平定 → 清聖祖（康熙）平定三藩之亂，之後與民休息、減稅。
  explain: |
    (D) 三藩（吳三桂等）之亂波及西南各省，平定後康熙推行減稅、墾荒 ✓
    (C) 靖難之役是明朝宗室奪位，戰場在華北、江南，不在西南各省（全國 16% 誤選）✗
    (A) 唐太宗親征高麗是對外戰爭 ✗
    (B) 宋高宗與金議和，戰場在北方 ✗
soc110-25:
  key: 禁止乙國貨物登陸「歐洲大陸」、沒收乙國商品，乙國靠海外貿易支撐 → 拿破崙對英國的大陸封鎖。
  explain: |
    (B) 1806 年拿破崙頒布大陸封鎖令，禁止歐陸與英國通商；英國靠海外殖民地與貿易撐過 ✓
    (C) 無限制潛艇作戰是擊沉船隻，不是禁止貨物登陸歐陸、沒收商品（全國 22% 誤選）✗
    (A) 英國航海法限制外國船隻運貨到英國，針對荷蘭的轉運貿易，不是封鎖歐陸（全國 21% 誤選）✗
    (D) 美國參戰後的封鎖不是「保護自己的經濟發展」 ✗
soc110-26:
  key: 1950 年 6 月韓戰爆發，美國派第七艦隊巡防臺灣海峽，中共被迫取消攻臺計畫。
  explain: |
    (C) 韓戰爆發後美國宣布臺海中立化，第七艦隊協防臺灣，中共攻金門、攻臺的計畫擱置 ✓
    (A) 中共剛攻下海南島、萬山群島，並非無力作戰（全國 7% 誤選）✗
    (B)(D) 都不是取消攻擊的主因 ✗

# ---------- Day 60：中國史、世界史 ----------
soc110-27:
  key: 法國傳教士殷弘緒寫信介紹景德鎮製瓷技術，歐洲人才仿製成功 → 江西景德鎮瓷器。
  explain: |
    (A) 景德鎮在群山中的盆地，宋代以後就是瓷器重鎮，外銷全世界；十八世紀初殷弘緒的書信讓歐洲學會製瓷 ✓
    (B) 杭州絲綢歐洲早已能生產，而且杭州不在群山之中（全國 39% 誤選）✗
    (C)(D) 茶葉、藥材不是「作坊」的工業產品 ✗
soc110-28:
  key: 1720 年、和「夷商」（外國商人）交易、同行共同議價 → 廣州十三行商人組成「公行」，壟斷對外貿易。
  explain: |
    (A) 1720 年廣州行商成立公行，訂行規統一和外商議價、排除其他商人私自交易 ✓
    (B) 鹿港要到 1784 年才開放與蚶江對渡，行郊的貿易對象是中國大陸，不是夷商（全國 46% 誤選，比答對的人還多）✗
    (C) 香港要到 1842 年才割讓給英國 ✗
    (D) 天津通商大臣是 1860 年後才設 ✗
soc110-29:
  key: 工農學兵結合、私有物交公、公共食堂、托兒所，結果經濟大倒退 → 1958 年大躍進時的人民公社。
  explain: |
    (D) 人民公社「一大二公」，集體生產、集體生活、吃大鍋飯，導致生產停頓與大饑荒 ✓
    (A) 太平天國的天朝田畝制度有土地平均分配的理想，但沒有「工業停頓、國民生產總值大減」這類現代經濟數據（全國 11% 誤選）✗
    (B)(C) 義和團、中華蘇維埃都沒有推行這樣全面的集體化 ✗
soc110-30:
  key: 十三世紀形成、在北海與波羅的海間貿易、擁有武力並在各地設據點 → 德意志商人為主的漢撒同盟。
  explain: |
    (A) 漢撒同盟以德意志北方城市商人為主，控制北海、波羅的海貿易，在倫敦等地設有商館 ✓
    (D) 荷蘭東印度公司 1602 年成立，經營亞洲貿易，不是十三世紀（全國 28% 誤選）✗
    (C) 英格蘭布商公會沒有在各地建立行政機構、擁有武力（全國 26% 誤選）✗
    (B) 威尼斯商人活躍於地中海，不是北海、波羅的海（全國 21% 誤選）✗
soc110-31:
  key: 遷徙關東富人到首都附近的皇帝陵墓區（陵邑），削弱地方豪強 → 漢代的陵邑制度；又說「違背孝道」，符合漢代重視儒術、以孝治天下。
  explain: |
    (A) 西漢多次把各地豪富遷到長安附近的陵邑，既充實京畿又削弱地方勢力；後來因儒家重孝道、豪強反對而停止 ✓
    (B) 東晉偏安江南，首都在建康，不可能遷徙「關東」富人（全國 25% 誤選）✗
    (C)(D) 唐、宋沒有這樣的陵邑遷徙政策 ✗

# ---------- Day 61：世界史、臺灣史、地形與自然環境 ----------
soc110-32:
  key: 記錄者對漢字直排、喝茶都感到新奇，而且還得解釋「他們稱其為茶」→ 初到中國的西方人：十六世紀的耶穌會士。
  explain: |
    (A) 十六世紀利瑪竇等耶穌會士來華，才開始向歐洲介紹漢字與飲茶等中國文化 ✓
    (D) 十九世紀英國人早已大量飲茶，不會把茶當成新奇的東西介紹（全國 19% 誤選）✗
    (C) 安南使用漢字，也熟悉茶，不會覺得新奇（全國 13% 誤選）✗
    (B) 滿洲人早已和漢人接觸，認識漢字與茶 ✗
soc110-53:
  key: 從黎巴嫩、埃及到印度都在統治範圍內 → 橫跨西亞、北非到印度河流域的古代大帝國：波斯帝國（大流士興建首都蘇薩、波斯波利斯）。
  explain: |
    (A) 波斯帝國的版圖東到印度河、西到埃及，可從這些地方徵集建材 ✓
    (B) 羅馬帝國雖統治黎巴嫩、埃及，但從未統治印度（全國 28% 誤選）✗
    (C) 法蘭西王國沒有統治過黎巴嫩、埃及、印度這三地 ✗
    (D) 德意志帝國（1871–1918）也沒有統治這些地方 ✗
soc110-55:
  key: 地名的時代線索：「營」是明鄭屯兵、「結」是清代開墾組織、「萬華」是日治時期由「艋舺」改的、「光復」是戰後改名。
  explain: |
    (C) 丙左營（明鄭營盤）→ 丁五結（清代噶瑪蘭開墾的「結」）→ 甲萬華（日治 1920 年改名）→ 乙光復（戰後改名）✓
    (D) 五結晚於左營；明鄭時期還沒有開墾宜蘭（全國 10% 誤選）✗
    (A) 甲萬華的名稱出現在日治時期，不是最早 ✗
    (B) 乙光復是戰後地名，應該最晚 ✗
soc110-56:
  key: 圖中是鐘乳石洞，表示矮丘是隆起的珊瑚礁石灰岩；高雄的壽山、半屏山、龜山都是這種矮丘 → 左營舊城就依龜山而建。
  explain: |
    (C) 丙左營的鳳山縣舊城，把龜山圈進城內，利用石灰岩矮丘防禦 ✓
    (B) 光復位在花東縱谷，附近沒有石灰岩矮丘群（全國 41% 誤選）✗
    (D) 五結在蘭陽平原上，地勢低平（全國 25% 誤選）✗
    (A) 萬華在臺北盆地的平地上 ✗
soc110-57:
  key: 輸出象牙、犀牛角、奴隸，飼養駱駝，位在印度與羅馬的紅海商道上 → 東北非的阿克蘇姆王國（今衣索比亞、厄利垂亞一帶），範圍延伸到撒哈拉南緣的半乾燥帶。
  explain: |
    (A) 撒赫爾是撒哈拉沙漠南緣的半乾燥帶，東段就在東北非，符合象牙、犀牛角、駱駝等非洲物產 ✓
    (C) 馬其頓在巴爾幹半島，不產象牙、犀牛角，也不在印度到羅馬的商道中間（全國 37% 誤選）✗
    (B) 高加索在黑海與裏海之間，不產象牙與犀牛角（全國 26% 誤選）✗
    (D) 賽普勒斯是地中海島嶼，西元四世紀已屬羅馬帝國，不是獨立結盟的國家（全國 17% 誤選）✗
soc110-58:
  key: 古代羅馬從印度輸入的高價商品以胡椒等香料為主。
  explain: |
    (C) 印度盛產胡椒等香料，經紅海、阿拉伯海商道運往羅馬 ✓
    (A) 咖啡原產衣索比亞，十五世紀後才普及，古羅馬沒有咖啡（全國 7% 誤選）✗
    (B) 瓷器是中國的特產，不是印度 ✗
    (D) 茶葉來自中國，近代才大量輸往歐洲 ✗

# ---------- Day 62：世界史、臺灣史、氣候與生態 ----------
soc110-60:
  key: 饑荒時穀物照樣出口到英國、佃農運動要求「合理地租」→ 問題出在地主剝削、人民太窮，有糧也買不起。
  explain: |
    (A) 佃農要繳高額地租，種出的穀物被運往英國換錢，自己只能靠馬鈴薯；馬鈴薯歉收時又買不起穀物 ✓
    (B) 文中說馬鈴薯是十七世紀以後才成為主食，不是「自古以來」（全國 18% 誤選）✗
    (C) 文中沒有宗教因素的說法 ✗
    (D) 文中說穀物輸出英國，沒有提到英國禁止輸入 ✗
soc110-61:
  key: 十六世紀統治墨西哥、中美洲、古巴、菲律賓，還曾占領臺灣北部 → 西班牙的新西班牙總督府。
  explain: |
    (D) 西班牙在美洲設新西班牙總督府，管轄範圍跨到菲律賓；1626 年占領臺灣北部雞籠，1628 年再占淡水 ✓
    (B) 荷蘭占領的是臺灣南部，沒有統治墨西哥與中美洲（全國 18% 誤選）✗
    (C) 葡萄牙在美洲的殖民地是巴西（全國 10% 誤選）✗
    (A) 英國沒有統治過墨西哥與菲律賓（全國 9% 誤選）✗
soc110-62:
  key: 中美洲與加勒比海夏秋常有颶風；位在板塊交界，多地震、火山。
  explain: |
    (A) 甲颶風（大西洋與加勒比海的熱帶氣旋）、乙地震（中美洲在環太平洋地震帶）都是當地常見現象 ✓
    (C) 龍捲風最常見於美國中部大平原，不是中美洲的特色（全國 12% 誤選）✗
    (D) 中美洲氣候濕潤，沙塵暴不常見（全國 11% 誤選）✗
    (B) 沙塵暴發生在乾燥地區，不符合 ✗
soc110-67:
  key: 1938 年正值中日戰爭、皇民化運動時期 → 拆廟、禁遶境是要以日本神道取代臺灣傳統信仰，使臺灣人效忠天皇。
  explain: |
    (B) 皇民化運動推行國語（日語）、改姓名、參拜神社，寺廟整理就是其中的宗教改造 ✓
    (A) 「破除迷信」只是表面說法，真正目的是同化臺灣人（全國 13% 誤選）✗
    (C) 國民學校是 1941 年的學制改革，和拆廟無關 ✗
    (D) 拆廟不是為了改建軍事基地 ✗
soc110-68:
  key: 文化權是人民保有、實踐自己文化的權利；政府提供資源、讓地方群體自己發聲，不同文化才能並存傳承 → 多元文化。
  explain: |
    (C) 政府投入資源、結合在地力量，讓群體能實踐與傳承自己的文化，就是保障文化權、促成多元文化 ✓
    (A) 只描述廟宇重建與活動恢復，沒有說到文化權「受保障」與多元文化的關係（全國 30% 誤選）✗
    (B) 寺廟整理運動是壓制地方信仰，不是文化復興 ✗
    (D) 說統治者都利用媽祖信仰鞏固統治，和文化權保障無關，日治時期反而是壓制 ✗
soc110-69:
  key: 要知道每張照片落在哪個行政區 → 把照片點圖層和行政區面圖層直接套疊（點落在哪個面內）。
  explain: |
    (A) 點資料與面資料套疊，就能判斷每個拍攝點位於哪一個行政區 ✓
    (D) 環域分析會在點周圍畫出範圍，一個點的環域可能跨好幾個行政區，反而無法區分（全國 32% 誤選）✗
    (C) 視域分析是算從某點看得到的範圍，不是拍攝地點所在的行政區（全國 23% 誤選）✗
    (B) 距離最近的行政區不一定是照片所在的行政區 ✗

# ---------- Day 63：臺灣史、社會安全與公共政策、氣候與生態 ----------
soc110-70:
  key: 客家人原本住在閩粵內陸的丘陵、盆地、河谷 → 來臺後也選擇相似的丘陵、台地、近山平原，延續原鄉的生活方式。
  explain: |
    (A) 文中強調客家人來自內陸丘陵與河谷，在臺灣也分布在丘陵、台地、近山地帶，和原鄉環境與生活方式相近 ✓
    (B) 分類械鬥確實造成部分族群遷移，但文中的線索是原鄉環境，不是械鬥（全國 24% 誤選）✗
    (C) 水圳多開在平原，和向內陸集中的趨勢相反（全國 11% 誤選）✗
    (D) 保甲制度是地方治安組織，和分布趨勢無關 ✗
soc110-71:
  key: 「中央籌劃、企業加盟、地方執行、社區營造」→ 政府、企業、社區多方合作處理公共事務，這就是地方治理。
  explain: |
    (B) 地方治理強調公部門與企業、社區、民間團體建立公私協力的夥伴關係 ✓
    (A) 地方自治是地方政府依法自行處理地方事務；桐花祭由中央的客委會籌劃，又有企業、社區參與，不只是地方政府（全國 44% 誤選）✗
    (C) 地方分權化是中央把權力下放給地方，文中沒有權力移轉（全國 17% 誤選）✗
    (D) 全球在地化是全球性的產品或文化配合在地調整，不符合 ✗
soc110-72:
  key: 桐花祭在 4、5 月 → 正是梅雨季，最怕滯留鋒面停在臺灣附近帶來連日降雨。
  explain: |
    (C) 鋒面從華南延伸到臺灣附近，呈東北—西南走向，是春末夏初的梅雨鋒面（滯留鋒）✓
    (A) 颱風多在夏、秋季，4、5 月較少見（全國 13% 誤選）✗
    (B) 太平洋高壓勢力在東南方、亞洲大陸是低壓，是夏季的天氣型態 ✗
    (D) 大陸冷高壓南下、冷鋒通過，是冬季的天氣型態 ✗

