# 國文：第 1 週課堂範例題與觀念頁代表題（Claude 撰寫；混合題參考答案取自大考中心公布之評分原則）

chn115-01:
  key: 「枇」「毗」都讀ㄆㄧˊ；「取枕攲臥」（〈虯髯客傳〉）的攲讀ㄑㄧ。
  explain: |
    (A) 攲ㄑㄧ（斜靠；取枕攲臥出自核心選文〈虯髯客傳〉）／旖ㄧˇ（旖旎）→ 不同
    (B) 諳ㄢ（熟悉；略諳水性）／喑ㄧㄣ（喑啞）→ 不同
    (C) 枇ㄆㄧˊ（枇杷）／毗ㄆㄧˊ（毗鄰）→ 相同 ✓
    (D) 遏ㄜˋ（遏止）／謁ㄧㄝˋ（拜謁）→ 不同
    全國只有 14% 答對，49% 選 (A)：把「攲」誤讀成和「旖」一樣的ㄧˇ。核心選文裡的難字，是字音題的高頻來源。
chn115-02:
  key: 無遠弗「屆」、離群「索」居、人情「世」故；以儆效尤完全正確。
  explain: |
    (A) 以儆效尤：懲戒一人以警告想仿效的人 → 全部正確 ✓
    (B) 無遠弗<u>界</u> → 應為「無遠弗屆」（屆：到達）
    (C) 離群<u>所</u>居 → 應為「離群索居」（索：孤單、獨自）；全國 50% 誤選這個選項
    (D) 人情<u>事</u>故 → 應為「人情世故」
chn112-02:
  key: 價格不「菲」、人謀不「臧」、「承」載願望；命蹇時乖完全正確。
  explain: |
    全國答對率只有 14%，是近年最難的字形題。
    (A) 價格不<u>斐</u> → 應為「不菲」（菲：微薄；不菲＝不便宜）
    (B) 人謀不<u>彰</u> → 應為「人謀不臧」（臧：善；指人為的謀劃不周全）
    (C) 命蹇ㄐㄧㄢˇ時乖：命運不好、時運不順 → 全部正確 ✓
    (D) 天燈<u>乘</u>載 → 應為「承載」（承：承接）；全國 42% 誤選 (D)
chn115-26:
  key: 沆瀣一氣（貶）、授人以柄、秣馬厲兵都用對；不次拔擢是破格升遷，曲突徙薪是事先預防。
  explain: |
    (A) 沆瀣一氣：比喻氣味相投的人勾結在一起（貶義）→ 官商勾結，適當 ✓
    (B) 授人以柄：把把柄交給別人，讓人有機可乘 → 適當 ✓
    (C) 不次拔擢：不依一般次序，破格提拔 → 競標失利被調職，不當 ✗
    (D) 秣馬厲兵：餵飽戰馬、磨利兵器，指積極準備作戰 → 適當 ✓
    (E) 曲突徙薪：把煙囪改彎、把柴薪移開，比喻防患未然 → 發現錯誤後才調整，不當 ✗
chn115-25:
  key: 「為…所…」的為都表被動；「竊以為」「竊慕」的竊都是謙詞「私下」。
  explain: |
    這題 10 個例句有 9 個出自核心選文，是「熟讀課文就能拿分」的代表題。
    (A) 仲尼「與」於蜡賓（〈大同與小康〉：參與，音ㄩˋ）／吾「與」點也（《論語》：贊同）→ 不同
    (B) 梅花「為」寒所勒（〈晚遊六橋待月記〉）／若屬皆且「為」所虜（〈鴻門宴〉）→ 都是「被」→ 相同 ✓
    (C) 且貳「於」楚也（〈燭之武退秦師〉：對、向）／困「於」周郎（〈赤壁賦〉：被）→ 不同
    (D) 「乃」不知有漢（〈桃花源記〉：竟然）／「乃」知真人之興也（〈虯髯客傳〉：才）→ 不同
    (E) 「竊」以為過矣（〈諫逐客書〉：私下）／「竊」慕管夫人之墨竹（〈畫菊自序〉：私下）→ 相同 ✓
chn113-26:
  key: 「以」表目的＝「作為＋以＋目的」；「託臣以討賊」的以是「把」，「挾飛仙以遨遊」的以同「而」。
  explain: |
    全國答對率 17%，B、D 兩個陷阱各有六七成的人誤選。
    (A) 垣牆周庭，以當南日（〈項脊軒志〉：築牆圍住庭院，用來擋住南邊的陽光）→ 目的 ✓
    (B) 託臣以討賊興復之效（〈出師表〉：把討賊興復的任務託付給我，「以」是「把」）✗
    (C) 殺身以成仁（《論語》：犧牲生命來成全仁德）→ 目的 ✓
    (D) 挾飛仙以遨遊（〈赤壁賦〉：「以」同「而」，連接兩個動作）✗
    (E) 作師說以貽之（〈師說〉：寫〈師說〉來送給他）→ 目的 ✓
chn111-18:
  key: 「王欲無厭」的厭＝滿足（通「饜」）；「學而不厭」也是「不知滿足」。
  explain: |
    「王欲無厭」：周厲王的欲望沒有滿足的時候。厭＝滿足。
    (A) 學而不厭：學習不知滿足 → 相同 ✓
    (B) 館人厭之：討厭 ✗
    (C) 淡而不厭：平淡而不令人厭倦（全國 35% 誤選）✗
    (D) 厭常而反古：厭棄 ✗
chn115-05:
  key: 「故天下有故」承接不忍欺民；商議→觀民意→不可行→反覆說明→使之心服。
  explain: |
    完整原文：夫三代之君，惟不忍鄙其民而欺之，〔丁〕故天下有故，而其議及於百姓，〔乙〕以觀其意之所嚮，〔甲〕及其不可聽也，〔戊〕則又反覆而諭之，以窮極其說，〔丙〕而服其不然之心，是以其民親而愛之。（蘇軾〈書論〉）
    1. 因為不忍欺騙人民，「故」國家有事就和百姓商議（丁）。
    2. 商議的目的是觀察民意傾向（乙）。
    3. 等到民意不可採行時（甲），就反覆說明、把道理講透（戊），讓人民心服（丙）。
    4. 所以人民親愛君主。
    答案：丁乙甲戊丙（C）。訣竅：先找能承接首句的關聯詞（故），再抓「及其…則又…」這種固定呼應。
chn115-07:
  key: 「億萬年來似乎未改變樣貌」→ ① 符合；「臺灣特有屬的位階不再」→ ② 不符合。
  explain: |
    ① 原文：「億萬年來臺灣杉似乎未改變樣貌」「各自演化出新的或保留了獨特的古老基因型」→ 符合
    ② 原文：臺灣杉後來在中國大陸、緬甸、越南都被發現，「臺灣特有屬的位階不再」→ 與原文矛盾，不符合
    答案 (C)。這題全國答對率 85%，是研判題的基本型：一句有依據、一句與原文矛盾。
chn115-12:
  key: 文中與騎士比較「武力」的是「俠」，不是「士」；也沒有談俠文化的興衰。
  explain: |
    ① 文中以西方騎士對照的是「俠」與武力的關係（騎士是國家武力，俠卻被朝廷視為敵對）；談「士」時是比較兩者都維持秩序、又有批判傳統 → 不符合
    ② 文章說明「俠」如何進入儒生文士的道德意識，影響批判精神，並不是透過比較來說明俠文化的「興衰」→ 不符合
    答案 (B)。研判題要注意「對照的對象」有沒有被偷換。
chn115-35:
  key: 丙文是受訪阿嬤的口述，裡面還轉述先生、嬸婆、養父的話，時間跨度大。
  explain: |
    (A) 大母「持笏」是期勉孫子求取功名，不是暗喻她是家中掌權者 ✗
    (B) 「黑色河流」「黑森林」比喻的是孩子的負面情緒，不是母親反抗傳統的不安 ✗
    (C) 丙文記錄受訪者的聲音，也轉述先生、屘嬸婆、養父的話；從女兒送養到論及婚嫁，時間跨度大，有些場景受訪者並未親歷 ✓
    (D) 三篇並沒有都呈現「代間對立而最終平衡」✗
chn115-36:
  key: ① 有甲文依據、③ 有甲丙文依據；② 比較「自我敘說」與「受訪紀錄」誰更動人，文中沒有依據。
  explain: |
    ① 甲文提到女性聲音「長期被忽略、壓抑」，史傳重視「幽閑貞靜」之德 → 正確
    ② 題組資料沒有談到教育普及，也沒有比較兩種紀錄的感染力 → 無法判斷
    ③ 歸有光批評史傳只記「非平常之行」，丙文則以口述歷史保留一般女性的聲音 → 正確
    答案 (A)。這題官方鑑別度為負值，連高分的考生也常誤判，關鍵在於判斷推論是否過度。
chn115-g32:
  passage: |
    【框】「聽見她的聲音」，不僅是在文本中發掘女性話語的紀錄，更在於理解女性能否主動發聲，或如何被表達、被建構。
    【框】聽見<br>［圖］<br>她的聲音
    【框】在文學與歷史的敘事中，女性的聲音長期被忽略、壓抑或誤讀……
    <b>甲</b>
    【框】歸有光
    【框】我認為：三代王教修明，內外順治，「閨門之事皆可歌詠而傳道之」。所述雖「婦人女子之常，而事之至微者」，但「幽閑貞靜之德，隱然寓於其間，而足以章明王者之化」。可惜的是，此後女子在史傳作者眼中，必有「非平常之行」，乃能「著美名」於後世，導致女性「罕可紀述」，幾近銷聲匿跡。
    【框】下列三段節錄文字，都出自歸有光的作品：<br>〈項脊軒志〉：一日，大母過余曰：「吾兒，久不見若影，何竟日默默在此，大類女郎也？」比去，以手闔門，自語曰：「吾家讀書久不效，兒之成，則可待乎？」頃之，持一象笏至，曰：「此吾祖太常公宣德間執此以朝，他日汝當用之。」<br>〈先妣事略〉：有光七歲，與從兄有嘉入學。每陰風細雨，從兄輒留，有光意戀戀，不得留也。孺人中夜覺寢，促有光暗誦《孝經》，即熟讀，無一字齟齬，乃喜。<br>〈祭外姑文〉：昔吾亡妻，能孝於吾父母，友於吾女兄弟，知夫人(按：即外姑，指妻子的母親)之能教也；粗食之養，未嘗不甘，知夫人之儉也。
    <b>乙</b>
    作為一位母親，如果不選擇「你無理取鬧，我不睬你」，也不以打罵碎唸管束，那麼她所碰上的難題不但超乎想像，要處理的委屈恐怕也成倍增長。如果長輩在旁，複雜度往往更高。想耐心等待哭泣的雲朵飄去，接納他表達情緒的自由時，就會被貼上「怎麼都不教小孩？」「不教以後他長大很難控制」的標籤。我練習克制脾氣，盡可能耐心走過他們哭泣、踢東西等情緒。有時得忍耐譴責，背對著理所當然的教養方式，爭取時間讓孩子認識自己的負面情緒。看看內心湧動出多少黑色河流，在高大濃密的黑森林裡，試著踏出一條日光照得到的路徑。（改寫自李欣倫〈水面下〉）
    <b>丙</b>
    以前生活比較艱苦，小孩又多，養不活，很多人只好把女兒送給人家做媳婦仔。我們也不例外，七個女兒中除了最大的和最小的，其餘那五個都曾經送給別人養。第六個女兒養到四、五歲時，屘嬸婆又來強要我們把女兒送給她親戚，一直說：「她會疼她啦！她只有兩個兒子而已！」我先生只好又把女兒抱給他們。那麼多個女兒都是他抱給人背走的，我都不忍心，把頭轉走，不敢看。這個女兒真的是「媳婦仔王」，因為他們沒有生女兒，所以很疼愛她。但後來要她「作新娘」，沒想到她還是不肯，實在對不住。因為她和養兄沒有感情，不願意和他結婚。她養母很生氣，但養父親自來家裡跟我們說：「她已經和一個男的在交往，人家也打算來訂親了。那個男的我去探聽過，聽說很乖啦！既然不能在一起，就不要勉強。不然，像我這樣，就一輩子不幸福了。」她養母也是小時候養大的，「作新娘」後，兩個感情並不好。（改寫自曾秋美訪問整理《消失中的台灣阿嬤‧將女兒送養的阿母─曾林阿珠》）
chn115-32:
  stem: |
    歸有光的抒情散文中，有意識地留存了家族女性的聲音，而成為其特色，請回答下列問題：
    （1）依據甲文所引三段文字，文中的「大母」、「孺人」、「夫人」對自己角色所擔負責任的認知，共通點是什麼？（占2分，作答字數：10字以內。）
    （2）當代學者指出歸有光書寫女性，取材固然與後世史傳不同，但也有其所本。請依據上述的「我認為……」，說明：①他的取材有別於後世史傳的內容是什麼？
    ②他的特定標準是什麼？（占4分，作答字數：①、②各15字以內。）
  key: 大母、孺人、夫人的共通點：教育栽培子孫。
  reference: |
    <b>滿分參考答案（大考中心）</b>
    (1) 教育栽培子孫。（2 分）
    (2) ① 取材女子日常生活的平凡小事。（2 分）② 幽閑貞靜之德，能章明王者教化。（2 分）
    <b>常見失分</b>：只寫「照顧家庭」「擔負責任」，沒有抓到「教育子孫」；忽略〈祭外姑文〉中岳母教導女兒的線索；錯字如「閏門」「幽閉」會扣分。
chn115-33:
  key: 「理所當然」指長輩主張的高壓管教；阿嬤是對「養父母」感到抱歉。
  reference: |
    <b>滿分參考答案（大考中心）</b>
    (1) 長輩所主張的高壓控制方式。或：打罵碎念管束。（2 分）
    (2) ① 覺得很抱歉；② 基於習俗約定或養父母對她的疼愛，應該嫁卻不肯嫁，所以很抱歉。（4 分；部分錯誤或不完整得 2 分）
    <b>常見失分</b>：把抱歉的對象誤寫成六女兒；原因只寫「沒有感情」「已有男友」，沒有扣緊習俗約定與養父母的恩情。
chn115-34:
  key: 題目問「基於何種考量＋採取什麼行動」，兩部分都要寫到才拿滿分。
  reference: |
    <b>滿分參考答案（大考中心）</b>
    (1) 基於讓孩子學習認識自己的負面情緒，耐心陪伴孩子。或：基於讓小孩有表達情緒的自由，承受譴責，對抗長輩高壓控制的教養方式。（4 分）
    (2) 基於婚姻要有感情基礎，不接受「作新娘」的安排。或：基於與養兄沒有感情，拒絕與養兄結婚。（4 分）
    <b>常見失分</b>：行動寫得太籠統（如「不顧一切幫助孩子」）；加入文本沒有的詮釋（如「自由戀愛訂親」）；只回答考量或只回答行動。
