    上文<u>　　　　</u>內最適合填入的文句是：
chn112-g21:
  passage: |-
    《論語》是對我平生影響最大，使我受益最多的一本書。
    早年我所受的傳統教育，以熟讀背誦為主。故所讀的書，無論懂與不懂，都深深地印入腦中。《論語》既是我最早背誦的一本書，也是我最為熟記的一本書。抗戰後期在北平淪陷區，雖然不得不穿著補丁的衣服，吞食難以下嚥的混合麵，我也能不以為苦。因為當面臨這些情境時，《論語》中「<u>　　　　　　</u>」等語句立即湧現，給予我精神力量，使我可以不復介意。且經由在貧苦中如何自處的反思，進而聯想到「四書」中的其他語句。這種融會貫通的聯想和體悟，應該正是孔子極為重視的一種教學方式。
    在詩歌教學中，這種聯想作用尤為可貴。子貢從孔子談做人修養的「貧而樂，富而好禮」，聯想到《詩經》的「如切如磋，如琢如磨」，而被孔子讚美是「可與言詩」的人。孔門論詩，特別注重「興」，因此，我日後教授詩詞，也特別注重詩歌中的興發感動。而這種感發，往往與人生之體驗和修養關係密切。
    我平生讀書的最大樂趣，就是從書中去體會一份活潑的、可以提昇人精神的力量。正是從這一點來說，《論語》是對我影響最大，使我受益最多的一本書。（改寫自葉嘉瑩《論語百則・前言》）
