    <table><tr><th>甲詩</th><th>乙注</th><th>丙解</th></tr><tr><td>綿州江水之東津，魴魚鱍鱍色勝銀。<br>漁人漾舟沉大網，截江一擁數百鱗。<br>眾魚常才盡卻棄，赤鯉騰出如有神。<br>潛龍無聲老蛟怒，迴風颯颯吹沙塵。<br>饔子左右揮霜刀，鱠飛金盤白雪高。<br>徐州禿尾不足憶，漢陰槎頭遠遁逃。<br>魴魚肥美知第一，既飽歡娛亦蕭瑟。<br>君不見朝來割素鬐，咫尺波濤永相失。<br>（杜甫〈觀打魚歌〉）</td><td>（前八句）敘打魚事。魴魚味美，故漁人取之。眾魚、赤鯉、潛龍、老蛟，俱屬伴說。<br>（後八句）復記魚鱠。鱠飛，言其薄；金盤，言其華；白雪高，言其潔且多；一句中含數義。禿尾、槎頭，亦屬伴說。<br>盧注：此魚一經剖割，永與波濤相失，漁人能不見之而傷心乎？<br>鍾云：數語可當一篇戒殺文。</td><td>此詩從來誤會以魴為鱠，……今詳玩詩意，乃知作鱠者謂赤鯉，魴其陪襯也。<br>前八句，敘打魚事，鱍鱍、數百，皆眾魚常才爾。赤鯉騰出，特筆以表之，乃是主句。<br>後八句，志啖鱠事。鱠鯉堆盤，使人神旺，則凡禿尾、槎頭之類魴者，俱退舍矣。<br>末再繳醒之，言魴魚固其美者，然當厭飫之餘，無復朵頤焉，況忍多戕物命乎？不見赤鯉就烹朝來之苦若是乎？</td></tr></table>
    【框】鱠：細切的魚肉，同「膾」。
    【框】乙注：仇兆鰲《杜詩詳注》。<br>丙解：浦起龍《讀杜心解》。

# 111 年：補回①②編號、甲乙丙標籤錯位、鄭崇和墓碑圖（文字依原卷）
chn111-g14:
  passage: "【框】甲\n人為萬物之靈，志有萬端之異。學琴學詩均從所好，工書工畫各有專長，是故咳唾珠玉，謫仙闢詩學之源；節奏鏗鏘，蔡女撰胡笳之拍，此皆不墮聰明，而有志竟成者也。若夫銀鈎鐵畫，固屬難窺；儷白妃青，亦非易事。余因停機教子之餘，調藥助夫之暇，竊慕管夫人之墨竹，紙上生風；敢藉陶彭澤之黃花，圖中寫影。庶幾秋姿不老，四座流芬，得比勁節長垂，千人共仰，竟率意而鴉塗，莫自知其鳩拙云爾！（張李德和〈畫菊自序〉）\n【框】乙\n茲就詞章論，世多訾女子之作，大抵裁紅刻翠，寫怨言情，千篇一律，不脫閨人口吻者。予以為抒寫性情，本應各如其分，惟須推陳出新，不襲窠臼，尤貴格律雋雅，情性真切，即為佳作。詩中之溫、李，詞中之周、柳，皆以柔豔擅長，男子且然，況於女子寫其本色，亦復何妨？（呂碧城〈女界近況雜談〉）\n【框】呂碧城（1883～1943），被譽為近三百年來最後一位女詞人。"
chn111-g33:
  passage: "【框】甲\n道士笑曰：「我固謂不能作苦，今果然。明早當遣汝行。」王曰：「弟子操作多日，師略授小技，此來為不負也。」道士問：「何術之求？」王曰：「每見師行處，牆壁所不能隔，但得此法足矣。」道士笑而允之。乃傳以訣，令自咒畢，呼曰：「入之！」王面牆不敢入。又曰：「試入之。」王果從容入，及牆而阻。道士曰：「俯首輒入，勿逡巡！」王果去牆數步，奔而入，及牆，虛若無物，回視，果在牆外矣。大喜，入謝。道士曰：「歸宜潔持，否則不驗。」遂助資斧遣之歸。抵家，自詡遇仙，堅壁所不能阻。妻不信。王效其作為，去牆數尺，奔而入；頭觸硬壁，驀然而踣。妻扶視之，額上墳起如巨卵焉。妻揶揄之。王慚忿，罵老道士之無良而已。（蒲松齡《聊齋志異・勞山道士》）\n【框】乙\n奇門遁甲之書，所在多有，然皆非真傳。真傳不過口訣數語，不著諸紙墨也。德州宋先生清遠言：曾訪一友，友留之宿，曰：「良夜月明，觀一戲劇可乎？」因取凳十餘，縱橫布院中，與清遠明燭飲堂上。二鼓後，見一人踰垣入，環轉階前，每遇一凳，輒蹣跚，努力良久，乃跨過。始而順行，曲踊一二百度；轉而逆行，又曲踊一二百度。疲極踣臥，天已向曙矣。友引至堂上，詰問何來。叩首曰：「吾實偷兒，入宅以後，惟見層層皆短垣，愈越愈不能盡，窘而退出，又愈越愈不能盡，故困頓見擒，死生惟命。」友笑遣之。謂清遠，曰：「昨卜有此偷兒來，故戲以小術。」問：「此何術？」曰：「奇門法也。他人得之，恐召禍；君真端謹，如願學，當授君。」清遠謝不願。友太息曰：「願學者不可傳，可傳者不願學，此術其終絕矣。」意若有失，悵悵送之返。（紀昀《閱微草堂筆記・如是我聞二》）"
chn111-g20:
  passage: "【框】甲\n<table><tr><td>國定古蹟鄭崇和墓介紹（位於苗栗縣後龍鎮）</td></tr><tr><td>墓始建於道光7年，規制悉依《大清會典事例》，占地廣大，氣勢宏偉，又於同治6年重修。鄭崇和生於乾隆21年，卒於道光7年。康熙年間，始祖鄭懷仁自福建漳州遷入金門（浯江）。乾隆40年，三世長子鄭國周率四弟國唐、五弟國慶及國唐四子崇和來臺，定居後龍。鄭崇和少時好讀書，但屢試不第，後來捐為監生。他先在後龍教書，後遷至竹塹。鄭家因從事土地開墾，遂成為竹塹鉅富。鄭崇和生活儉約，厚待親族，也留心公共事務，濟助鄉里，義行深受肯定，去世後即獲朝廷同意入祀鄉賢祠。<br>鄭崇和先是收養大哥鄭崇聰之子用鍾，後生三子：用錫、用錦、用銛。用鍾雖無功名，但以經營實業著稱。用錦是秀才，用銛是歲貢生，用錫是道光3年進士，官至禮部員外郎。鄭崇和父以子貴，去世後也獲誥贈。<br>鄭崇和之妻卒於道光25年，原葬寶斗仁山，後移葬與鄭崇和同穴。在臺灣現存古墓中，鄭崇和墓規模僅次於嘉義王得祿（一品官）墓，與新竹鄭用錫墓相似。</td></tr></table>\n墓碑部分文字：\n<img class=\"qimg\" src=\"img/chinese/111-g20.webp\" alt=\"鄭崇和墓碑部分文字\" loading=\"lazy\">\n【框】乙\n<table><tr><td>鄭崇和臨終前交代</td></tr><tr><td>作善降祥，作惡降殃，天之理也。吾見今人受祖父生前蔭庇，歿後又妄信風水，乞靈枯骨，不亦慎乎﹖吾歿後，爾輩勿惑堪輿家言，貪尋吉地，為福利計。吾後龍山中田有老屋地焉，營而葬之，吾願足矣。將來為吉為凶，爾輩自取之，何與墳塋？</td></tr></table>\n【框】丙\n<table><tr><td>《古蹟指定及廢止審查辦法》第二條</td></tr><tr><td>古蹟之指定，應符合下列基準之一：<br>一、具高度歷史、藝術或科學價值者。<br>二、表現各時代營造技術流派特色者。<br>三、具稀少性，不易再現者。<br>國定古蹟之指定基準，係擇前項已指定之古蹟中較具重要、保存完整並為各時代或某類型之典範者。</td></tr></table>"
