chn115-08:
  stem: "下列方框內（□）是一段學術論文摘要，內容與上文第三段畫底線處（＿＿）相近。關於二者寫作方式的異同，敘述最適當的是：\n【框】本研究使用五個cpDNA序列片段，分析臺灣杉屬族群間的遺傳變異，結果只找到八種cpDNA單套型，而在臺灣的臺灣杉屬族群中只發現一種cpDNA單套型，且此單套型與東南亞洲大陸所有臺灣杉屬族群普遍存在的單套型，有八個突變步驟的差異，顯示兩者存在極大分化。"
  options:
    A: "□的口吻不忌冷硬，＿＿則筆調溫婉淺近，並加入個人的感受吸引讀者"
    B: "□不忌用專有名詞，＿＿則幾乎不用專有名詞，但引用數據讓讀者易懂"
    C: "二者皆揭示研究方法與主要發現，並述及研究限制與他人觀點，以求審慎"
    D: "二者立場皆客觀，但□是研究者自述成果，＿＿是寫作者綜述既有成果"
