chn113-29:
  stem: '關於硃砂（主成分為硫化汞），符合下列資料所述的是：

    【框】我家因硃砂礦業而致富。硃砂應視原料品質與加工目的，而有不同的處理方式。

    【框】水飛

    【框】巴寡婦清

    【框】▲惟取好砂，軋碎如微塵，入缸注清水澄浸。<br>▲過三日夜，其上浮者不堪入藥，傾入別缸。其下沉結者，曬乾即頭朱也。

    【框】行政院衛生署公告<br>（署授藥字第0940002424號）<br>主旨：自94年5月1日起，禁止中藥用硃砂製造、調劑、輸入、輸出、販賣或陳列。

    【框】升煉

    【框】▲次砂不入藥，作爐置砂於中，下承以水，上覆以盆，器外加火，則煙飛於上，水銀溜於下。<br>▲丹砂性寒而無毒，入火則熱而有毒，能殺人。<br>▲水銀乃至陰毒物，因火煅丹砂而出，或加鹽、礬煉而為輕粉，或加硫黃升而為銀朱。

    【框】炮製藥用硃砂，須重複水飛法多次方可，耗時費力。若不肖者私下以機器研磨，會因機器運轉的高溫，使硃砂產生劇毒，一旦入藥，極其危險。

    【框】中醫師

    【框】古文敘述參考《天工開物》、《本草綱目》。'
  options:
    A: 水飛法是將硃砂先以清水反覆淘洗，再曬乾研成粉末
    B: 今日若以機器研磨取代水飛法，將因高溫使硃砂含有劇毒
    C: 升煉法主要用於煉製水銀，水銀加入硫黃之後可再產生銀朱
    D: 銀朱藉升煉獲得，不僅速度快，毒性也比水飛法獲得的頭朱低
    E: 藥用硃砂若以安全方式炮製，非全不可用，但臺灣目前完全禁用
