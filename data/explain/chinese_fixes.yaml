chn112-g10:
  passage: "2020年壓軸的天文現象是木星合土星。從地球看，兩顆星在12月21日的視覺距離僅約6.5角分，幾乎黏在一起。由於木星繞太陽一周將近12年，土星則要29.5年，因此平均約20年才會兩星相合。\n古人稱一個運動中的天體逼近另一天體曰「犯」，所以史書記載這兩星相合為「歲星（木星）犯填星（土星）」。但哪顆星犯哪顆星，是如何判斷呢？\n以公轉速度而言，木星比土星跑得快。但因地球軌道短於外側行星的軌道，所以從地球上看V星的運動（如右圖），會發生順行（如A1→A2）、逆行（如A2→A3）的變化。而當木星在順逆行轉換、看似靜止不動時（古人稱為「留」），視覺上便可能土星快於木星。例如西元828年11月5日到21日，明顯是木星順行衝向土星，但21到25日，卻是土星以反方向接近木星，跑了2.2角分，但順行的木星只跑了1角分。以現代天文學看，木星每天頂多移動0.2度，小於宋元之際觀測誤差，約等於清代觀測誤差。如果真要依據這五天的變化寫誰犯誰，古人恐怕辦不到。\n<img class=\"qimg\" src=\"img/chinese/112-g10.webp\" alt=\"從地球看V星的運動路徑\" loading=\"lazy\">\n古代「填星犯某星」的記載很少，《明實錄》的「填星犯太白（金星）」，到正史中改為「太白犯填星」。又彙整唐代之前國運占星術的《開元占經》，雖有「歲星犯太白」的占辭，但史書向來寫「太白犯歲星」。故可確定快慢印象是判斷誰犯誰的依據。（改寫自歐陽亮〈都是星星惹的禍？木星合土星─歲星犯填星〉）"
chn114-g22:
  passage: "【框】甲\n《小兒藥證直訣》匯集北宋兒科大家錢乙的醫療觀點與方法，是世界現存最早的兒科專著。錢乙注重五臟、五行間的生剋關係，並提出相應的治法和方劑，而小兒臟腑柔弱，故主張用藥應避免強攻。\n書中保存了二十多個醫療案例與一百多種方劑。這些方劑或以五臟與五色的對應關係命名，如導赤散、益黃散、瀉白散、瀉青丸；或以方中主要藥材阿膠命名，如阿膠散。\n<img class=\"qimg\" src=\"img/chinese/114-g22.webp\" alt=\"五臟、五行、五色相生圖\" loading=\"lazy\">\n阿膠散是錢乙研創新方的代表，注重補肺止咳的主要療效，又用甘草、糯米護脾胃以培土生金。至於化裁古方，如香連丸，主治熱痢。古制用黃連苦降以清熱，木香芳烈以行滯。錢乙則加入豆蔻溫澀止瀉，命名豆蔻香連丸。雖同樣治療腹痛腹瀉，但寒熱通澀之性有別。\n【框】乙\n東都張氏孫，九歲，病肺熱。……其證：嗽喘，悶亂，飲水不止，全不能食。錢氏用使君子丸、　　　。張曰：「本有熱，何以又行溫藥？他醫用涼藥攻之，一月尚無效。」錢曰：「涼藥久則寒不能食。小兒虛不能食，當補脾，候飲食如故，即瀉肺經，病必愈矣。」服補脾藥二日，其子欲飲食。錢以　　　瀉其肺，遂愈。張曰：「何以不虛？」錢曰：「先實其脾，然後瀉其肺，故不虛也。」（《小兒藥證直訣》）"
chn115-g30:
  passage: "【框】表，下言於上，故須先曰「臣某言」，後曰「臣某誠惶誠恐，稽首頓首」。\n【框】甲\n〈出師表〉違異了「表」的典型特質。全篇始於「臣亮言」，但這位說話的「臣」受劉備遺命：「若嗣子可輔，輔之，如其不才，君可自取」，其實具有廢立的權柄。文中十三次提及「先帝」，使「陛下」成了虛位，故「討賊興復之效」乃陛下「託」臣而非「命」臣。又此表也不以「誠惶誠恐，稽首頓首」結束，而是頗具生離死別意味的真情流露：「今當遠離，臨表涕泣，不知所云」，是以格外感人。（改寫自柯慶明〈「表」、「奏」作為文學類型之美感特質的研究〉）\n【框】乙\n今南方已定，兵甲已足，當獎率三軍，北定中原。庶竭駑鈍，攘除姦凶，興復漢室，還於舊都，此臣所以報先帝而忠陛下之職分也。至於斟酌損益，進盡忠言，則攸之、禕、允之任也。願陛下託臣以討賊興復之效，不效，則治臣之罪，以告先帝之靈。若無興德之言，則責攸之、禕、允等之慢，以彰其咎。陛下亦宜自課，以諮諏善道，察納雅言，深追先帝遺詔，臣不勝受恩感激。今當遠離，臨表涕泣，不知所云。（諸葛亮〈出師表〉）\n【框】丙\n陛下即祚，復蒙試用，遂受上將之任，統領二州，內參機事，實所不堪。……臣以區區之質，而當鐘鼎之任；以闇鈍之才，而奉明明之政。顧恩念責，亦臣竭節授命之秋也。謹條遵奉舊訓權時之宜十四事，奏如左，庶以蒸螢增明太陽，言不足採。（曹操〈陳損益表〉）\n【框】東漢建安元年，曹操迎漢獻帝至許都，受封司空，進呈此表。"
chn115-g32:
  passage: "【框】聽見她的聲音\n【框】在文學與歷史的敘事中，女性的聲音長期被忽略、壓抑或誤讀……\n【框】「聽見她的聲音」，不僅是在文本中發掘女性話語的紀錄，更在於理解女性能否主動發聲，或如何被表達、被建構。\n【框】歸有光\n【框】我認為：三代王教修明，內外順治，「閨門之事皆可歌詠而傳道之」。所述雖「婦人女子之常，而事之至微者」，但「幽閑貞靜之德，隱然寓於其間，而足以章明王者之化」。可惜的是，此後女子在史傳作者眼中，必有「非平常之行」，乃能「著美名」於後世，導致女性「罕可紀述」，幾近銷聲匿跡。\n【框】甲\n下列三段節錄文字，都出自歸有光的作品：\n〈項脊軒志〉：一日，大母過余曰：「吾兒，久不見若影，何竟日默默在此，大類女郎也？」比去，以手闔門，自語曰：「吾家讀書久不效，兒之成，則可待乎？」頃之，持一象笏至，曰：「此吾祖太常公宣德間執此以朝，他日汝當用之。」\n〈先妣事略〉：有光七歲，與從兄有嘉入學。每陰風細雨，從兄輒留，有光意戀戀，不得留也。孺人中夜覺寢，促有光暗誦《孝經》，即熟讀，無一字齟齬，乃喜。\n〈祭外姑文〉：昔吾亡妻，能孝於吾父母，友於吾女兄弟，知夫人(按：即外姑，指妻子的母親)之能教也；粗食之養，未嘗不甘，知夫人之儉也。\n【框】乙\n作為一位母親，如果不選擇「你無理取鬧，我不睬你」，也不以打罵碎唸管束，那麼她所碰上的難題不但超乎想像，要處理的委屈恐怕也成倍增長。如果長輩在旁，複雜度往往更高。想耐心等待哭泣的雲朵飄去，接納他表達情緒的自由時，就會被貼上「怎麼都不教小孩？」「不教以後他長大很難控制」的標籤。我練習克制脾氣，盡可能耐心走過他們哭泣、踢東西等情緒。有時得忍耐譴責，背對著理所當然的教養方式，爭取時間讓孩子認識自己的負面情緒。看看內心湧動出多少黑色河流，在高大濃密的黑森林裡，試著踏出一條日光照得到的路徑。（改寫自李欣倫〈水面下〉）\n【框】丙\n以前生活比較艱苦，小孩又多，養不活，很多人只好把女兒送給人家做媳婦仔。我們也不例外，七個女兒中除了最大的和最小的，其餘那五個都曾經送給別人養。第六個女兒養到四、五歲時，屘嬸婆又來強要我們把女兒送給她親戚，一直說：「她會疼她啦！她只有兩個兒子而已！」我先生只好又把女兒抱給他們。那麼多個女兒都是他抱給人背走的，我都不忍心，把頭轉走，不敢看。這個女兒真的是「媳婦仔王」，因為他們沒有生女兒，所以很疼愛她。但後來要她「作新娘」，沒想到她還是不肯，實在對不住。因為她和養兄沒有感情，不願意和他結婚。她養母很生氣，但養父親自來家裡跟我們說：「她已經和一個男的在交往，人家也打算來訂親了。那個男的我去探聽過，聽說很乖啦！既然不能在一起，就不要勉強。不然，像我這樣，就一輩子不幸福了。」她養母也是小時候養大的，「作新娘」後，兩個感情並不好。（改寫自曾秋美訪問整理《消失中的台灣阿嬤‧將女兒送養的阿母─曾林阿珠》）"
chn113-g06:
  passage: "<img class=\"qimg\" src=\"img/chinese/113-g06.webp\" alt=\"女書\" loading=\"lazy\">\n中國湖南省江永地區，一種神祕的菱形文字—女書—悄悄流傳超過百年。它是一種使用當地方言，須以「唱誦」方式表達與理解的表音文字。女人用它來自傳訴情、互通心跡、結交姊妹、祝禱祈願、傳說紀聞……。\n江永是典型的農業社會，女孩從小「不得亂步出娘房」，因此未嫁的女兒稱作「樓中女」。未嫁的女兒在娘樓做女紅時，邊唱歌、邊學認女書、寫女書、織女書字，進入正統教育體系之外的知識系統，且因熱愛女書而結為姊妹。當有姊妹出嫁，每個姑娘從婚前幾天便開始哭嫁，餽贈女書留念，感懷女性身不由己的共同命運，娘樓是她們建立封閉又親密的女性空間，但事實上又是「無常」的象徵。\n在以哭嫁為主題的女書作品中，常常描述父系社會婚姻將女人從原生土壤連根剜起的滋味，顯示哭嫁不僅是少女面對未知命運的恐懼，更是女人剪斷血緣、地緣與人緣臍帶時的哀號。但也由於有女書，因而婚後她們並不像其他文盲婦女喪失向外通訊、結盟的能力。姊妹們的通信中苦多樂少，但總是盡心相勸、彼此扶持。她們透過女書，在社會現實與磨難中掙扎、拉鋸、妥協，尋找生存之道。甚至在書寫過程中，執筆者也不止於代書，悲憐勸解的同時，常將自己的身世寫了進去，形成風格特殊的「參與寫作」。\n【框】哭嫁：哭唱儀式，新娘出嫁時會在娘家唱哭嫁歌，訴說離愁別緒。\n關於女書的起源至今仍是個謎，江永女性發明了世界上獨一無二的女書，但因以土話為音，加上地方阻隔，僅局限於江永一帶流傳。也由於女性死後女書多作為殉葬而被焚毀，以及隨著教育的普及、傳統習俗、社會情境的改變等因素，女書逐漸式微。然而，女書的研究與應用方興未艾，尤其是在消費時代裡，女書反成為一種時尚符號，常出現在文創設計中。（改寫自鄭至慧、劉斐玟等相關研究報告）"
chn115-g19:
  passage: "西元八世紀左右的盛唐，出現一種新型態的草書，後人以「狂草」稱呼。唐代狂草真跡存世者寥寥無幾，草書名品多以摹本、臨本、仿本或刻本的形式廣為流傳。今傳世名聲最大、影響最廣的狂草作品，堪稱唐代僧人懷素的〈自敘帖〉長卷。\n<img class=\"qimg\" src=\"img/chinese/115-g19.webp\" alt=\"懷素〈自敘帖〉（局部）；故宮博物院為慶祝百年院慶，透過異業合作，推出〈自敘帖〉特仕版電動摩托車，將草書意境融入設計中。\" loading=\"lazy\">\n〈自敘帖〉本幅部分書有126行，702字，是懷素自述出身、經歷與交遊的重要文獻。懷素二十餘歲即以草書聞名，並以驚人的即席表演結交當代名公。〈自敘帖〉中將近一半篇幅節錄眾人觀其作書有感所撰之詩作，描述他在眾人圍觀下激情揮毫的景況，例如：「奔蛇走虺勢入座，驟雨旋風聲滿堂」、「筆下唯看激電流，字成只畏盤龍走」、「醉來信手兩三行，醒後卻書書不得」、「心手相師勢轉奇，詭形怪狀翻合宜」、「忽然絕叫三五聲，滿壁縱橫千萬字」、「遠鶴無前侶，孤雲寄太虛。狂來輕世界，醉裡得真如」等，為八世紀的書法表演現場留下難得的紀錄。懷素的書法表演頗富神異色彩，筆下充滿驚奇的物象變化，詩作中還有人強調連懷素自己也不知如何寫成的。在觀賞者眼中，懷素能在草書中興風作浪、幻化出種種物象的能力，恐怕是當時人的普遍認知與期待，是唐代佛道盛行、社會瀰漫濃厚宗教氛圍下的產物。\n〈自敘帖〉書法用筆迅速，筆勢連綿，然字形結構謹守草法，線條穩定圓轉。全卷可見節奏緩起漸快，卷中段以後愈書愈放，但絕非倚靠靈感驅使的即興之作。國立故宮博物院藏本〈自敘帖〉，每行第一字墨色飽滿，漸寫漸乾，直到寫完行末最後一字。所謂「法度」看似不存在，卻其實無所不在，是興風作浪的浪漫藉以依存的基礎。\n（改寫自盧慧紋〈興風作浪的浪漫〉）"
chn110-g20:
  passage: "我曾開玩笑說，專業經理人像哈士奇，吃的是每個月主人給的飼料；創業家像狼，必須聞得到血的味道，捕不到獵物就無法生存。哈士奇的時間是主人的，沒有了主人，他的時間就沒有價值，狼的時間則屬於自己。出售有限的時間，是上班族哈士奇的獲利模式。狼的視野不一樣，他們不會單獨行動，因為狩獵靠的是狼群，所以狼懂得購買別人的時間來做事。\n哈士奇的時間如何計價？價格通常來自價值，而「to be（你是誰）」的價值比「to do（做的內容）」高很多。以演講為例，如果會製作精美的簡報，可能一小時計價千元；如果內容很有用，可能一小時值萬元。不過，如果請林志玲演講，企業願意付更高費用的理由，不是簡報精美或內容有用，而是因為演講者是林志玲。\n雖然有血統的哈士奇比會看家的土狗值錢，但不斷學習成長的土狗，當他的價值被公司過度低估，那就是他出走的時候。出走的頂尖土狗沒有主人的飼料，很快就會變成狼。（改寫自盧希鵬《為什麼員工都是哈士奇，狼呢？》）"
chn112-g36:
  passage: "能實現新奇構想的原創者，可能比想像中謹慎保守。要實現原創構想，通常意謂挑戰現狀，所以原創者更懂得透過溝通爭取認同。例如好萊塢編劇的劇本能否開拍，往往取決於能否說服高層主管。1990年代早期，一群迪士尼編劇希望片廠不要繼續改編「灰姑娘」、「白雪公主」等故事，而能接受嶄新的《獅子王》。他們最初是以「把鹿換成獅子的非洲版小鹿斑比」介紹給片廠主管，未脫動物對抗人類的基調。經過修改，才讓老獅王木法沙、小獅王辛巴、大反派叔父刀疤，接近莎士比亞《哈姆雷特》的主要角色─叔父殺死了身為國王的父親，兒子為父親復仇。同時，發覺來自莎劇「To be or not to be」的困惑，反映了人性現實，相信能獲得普遍回響。最終，片廠支持這個由獅子演出《哈姆雷特》的構想，創下動畫電影史上的票房紀錄。\n在這個案例中，新奇固然是原創性的關鍵，但也是一項挑戰。當編劇提出《獅子王》類似《哈姆雷特》時，這個熟悉感有助於高層主管把新奇的大草原腳本和經典故事連結起來。絕對的原創性有時並不讓人放心，畢竟高層主管需要參考座標，找到向觀眾行銷的著力點。（改寫自亞當‧格蘭特著，黃翫譯《作個原創者》）"
chn114-g32:
  passage: "【框】張氏以髮長委地，立梳床前。靖方刷馬，忽有一人，中形，赤髯而虯，乘蹇驢而來，投革囊於爐前，取枕攲臥，看張氏梳頭。靖怒甚，未決，猶刷馬。張氏熟視其面，一手握髮，一手映身搖示靖，令勿怒。急急梳頭畢，斂衽前問其姓。臥客答曰：「姓張。」對曰：「妾亦姓張，合是妹。」遽拜之。……張氏遙呼曰：「李郎且來拜三兄！」靖驟拜之，遂環坐。曰：「煮者何肉？」曰：「羊肉，計已熟矣。」客曰：「飢甚！」靖出市胡餅。客抽腰間匕首，切肉共食。……客曰：「觀李郎之行，貧士也，何以致斯異人？」曰：「靖雖貧，亦有心者焉。他人見問，固不言，兄之問，則無隱耳。」具言其由。曰：「然則將何之？」曰：「將避地太原。」客曰：「然，吾故謂非君所能致也。」曰：「有酒乎？」靖曰：「主人西則酒肆也。」靖取酒一斗，酒既巡，客曰：「吾有少下酒物，李郎能同之乎？」靖曰：「不敢。」於是開革囊，取一人頭並心肝，卻頭囊中，以匕首切心肝共食之。曰：「此人天下負心者，銜之十年，今始獲，吾憾釋矣。」又曰：「觀李郎儀形器宇，真丈夫也。」\n・貼這段〈虯髯客傳〉，是打算討論明天的報告？\n・有默契。我們現在完全沒主題、沒框架……\n・那就拿「概念框架」當框架吧！\n・什麼？不懂！\n・凡是理解、思考，都需要概念框架。剛才你說「有默契」，就是明白對方有相同的理解框架；又說「不懂」，則是缺乏理解對方的框架。框架不同的人，很容易雞同鴨講。若不試著接近對方的框架，就無法消除隔閡。\n・這麼說，《西遊記》的唐僧剛收孫悟空為徒時，曾因為孫悟空打死強盜大吵一架，就是沒有相同理解框架。孫悟空強調那是正當防衛，唐僧則認為打劫罪不致死，不該傷人性命。\n・唐僧斥責孫悟空沒有慈悲好善之心，「去不得西天，做不得和尚」，也出自特定的身分框架。\n・哈！你們不打遊戲去看《西遊記》？不過，身分確實是人際關係的常見框架。「你是哥哥，怎不讓弟弟？」就是在設定兄長本分框架。紅拂去找李靖並說「願託喬木」，則是引導對方走進終身伴侶的框架。\n・孫悟空氣得丟下師父，本想回花果山，但東海龍王提醒他：若不保護唐僧，「到底是個妖仙，休想得成正果」。孫悟空想了想，選擇回唐僧身邊。\n・當初他大鬧天宮，得到「弼馬溫」一職，又棄官自封「齊天大聖」，應該也是在找合適的身分框架。\n・人們常說要跳脫框架，活出自我。但孫悟空若不走進「西天取經」的框架，就成不了「鬥戰聖佛」。人們即使能擺脫一個框架，也無法擺脫所有框架。甚至可以說，若沒活在某個框架裡，可能也不知道什麼是自我肯定的方式。"
chn112-g33:
  passage: "【框】甲\n古典是穿越世代的共有智慧，也是橫跨國界的共享遺產。\n在人文教育上，思想的開放是終極目標。文化應通過批判性地消化繼承，而不能全盤否定或粗暴對抗。美國獨立成功，文化上仍與英國文學緊密銜接。主張脫亞入歐的日本，從來就持續接納儒學的薰陶。\n古典之成為古典，並不是因為年齡蒼老，而是因為它經過不同歷史階段的過濾與篩選，禁得起解釋、開發、創造。無論時代如何進步，只有人性是千古不變。即使是千年以前的《詩經》，在恰當時刻也能感發不同時代的心靈。\n追求進步並非要摒棄古典，而應以開放的精神重新檢視。所有的古典，經過閱讀、解釋、再創造，就會變成當代價值的一部分。\n經過閱讀與再閱讀，創造與再創造，古典就是永遠的現代。（改寫自陳芳明〈古典是永遠的現代〉）\n【框】乙\n古典不等於古文，年代也未必久遠。披頭四的歌曲迄今不過半世紀，但對後世音樂影響深遠；蘇聯導演艾森斯坦《波坦金戰艦》的蒙太奇手法，如今已是電影的基本文法。這些在當時展現新手法或開創新視野的作品，後人愈是追隨，愈能顯出其永恆的地位。\n2006年，龜山郁夫新譯杜思妥也夫斯基1880年的《卡拉馬助夫兄弟們》，一出版即暢銷百萬冊。優秀的譯筆能賦予古典現代生命。\n古典的耀眼光彩從不會因古老而褪色。《論語》提供的建言，到今日仍可為人生的困境解惑。古典有時理解不易，可參考專家的引導，但不要變成先入之見。正岡子規認為《古今和歌集》不及《萬葉集》，但他是為了替低迷的短歌灌注活力，才批判有貴族傾向的和歌，讀者不能斷章取義。（改寫自齋藤孝著，莊雅琇譯《古典力》）"
chn113-g32:
  passage: "【框】甲\n回憶一直是文學重要的題材和主題。在書寫回憶的文學作品裡，一般關注的是追憶的內容、方式以及其中的自我。沒有記憶，我們就不知道自己是誰，過去曾是什麼，未來又將有什麼樣的發展。我們是自我記憶的總和，記憶提供持續的自我意識，若改變記憶，就改變了那稱之為「我」的人。\n引起回憶的事物，把我們的注意力引向不復存在的過往情景。這些事物就像是過去時光斷裂後餘存的碎片，出現在當下的現實，具有路標作用，引發我們向恢復整體的方向前進。一如《追憶似水年華》主角馬塞爾，因為椴花茶與瑪德蓮糕混融的氣味，喚醒童年和過去的記憶。\n文學作品常見的回憶方式有二：一種是自主的回憶，一種是不由自主的回憶。前者是主動地重建過去，而後者則是在無預期的狀況下，透過某種感覺和提醒物（例如瑪德蓮糕），將早已遺忘了的往日時光，一下子召喚到眼前，從而湧現出失而復得的喜悅與幸福；同時，記憶中的往事，只是碎裂的斷片，其實無法完整恢復，從而讓人意識到時光的失落和自我的變化，於是懷舊、惆悵、感傷。\n【框】乙\n長期記憶分布在腦內各處，不像短期記憶一樣分布在某個專屬區域。因此，人不會突如其來地完全忘記某件事，而是在時光流逝中，對那件事的記憶逐漸喪失精準，逐漸失去細節。這個過程和照片褪色沒有太大不同：我們慢慢地、不知不覺地遺忘。\n【框】短期記憶：腦中一種低容量記憶類型，可將自外界接收的資訊，於短時間（5～20秒）內保持使用狀態。<br>長期記憶：儲存在腦中且可長時間保存的記憶，記憶容量較大。\n重啟感情記憶的開關，就在於各種感官體驗，尤其是難以關閉、無法拒絕的嗅覺。一般來說，人體接收感官訊息時，會經過大腦的視丘，再由視丘將訊息傳遞給大腦其他部位。而產生嗅覺的氣味因子則會繞過視丘直達杏仁核（負責處理情緒）與海馬迴（負責處理記憶），因此嗅覺與情感、記憶的連結，比其他感官更直接。所見所聽的可能旋即消失在短期記憶中，但嗅覺幾乎沒有短期記憶。大腦把這些氣味和情感融合在一起，從而在遙遠的未來，藉由氣味喚起深藏的記憶，掀起濃重的懷舊思緒。\n（改寫自戴安・艾克曼《氣味、記憶與愛欲》）\n【框】丙\n簾外雨潺潺，春意闌珊。羅衾不耐五更寒。夢裡不知身是客，一晌貪歡。　獨自莫憑欄，無限江山，別時容易見時難。流水落花春去也，天上人間。（李煜〈浪淘沙〉）\n【框】李煜：南唐最後一任國君，在位十五年，國滅被俘入宋。\n【框】丁\n醉裡挑燈看劍，夢回吹角連營。八百里分麾下炙，五十絃翻塞外聲。沙場秋點兵。　馬作的盧飛快，弓如霹靂弦驚。了卻君王天下事，贏得生前身後名。可憐白髮生。（辛棄疾〈破陣子〉）\n【框】辛棄疾：生於北方，二十餘歲聚眾加入義軍抗金，後率軍投奔南宋。南歸後，為當權者所忌，或放廢家居，或沉淪下僚。"
