    <table><tr><th>甲詩</th><th>乙注</th><th>丙解</th></tr><tr><td>綿州江水之東津，魴魚鱍鱍色勝銀。<br>漁人漾舟沉大網，截江一擁數百鱗。<br>眾魚常才盡卻棄，赤鯉騰出如有神。<br>潛龍無聲老蛟怒，迴風颯颯吹沙塵。<br>饔子左右揮霜刀，鱠飛金盤白雪高。<br>徐州禿尾不足憶，漢陰槎頭遠遁逃。<br>魴魚肥美知第一，既飽歡娛亦蕭瑟。<br>君不見朝來割素鬐，咫尺波濤永相失。<br>（杜甫〈觀打魚歌〉）</td><td>（前八句）敘打魚事。魴魚味美，故漁人取之。眾魚、赤鯉、潛龍、老蛟，俱屬伴說。<br>（後八句）復記魚鱠。鱠飛，言其薄；金盤，言其華；白雪高，言其潔且多；一句中含數義。禿尾、槎頭，亦屬伴說。<br>盧注：此魚一經剖割，永與波濤相失，漁人能不見之而傷心乎？<br>鍾云：數語可當一篇戒殺文。</td><td>此詩從來誤會以魴為鱠，……今詳玩詩意，乃知作鱠者謂赤鯉，魴其陪襯也。<br>前八句，敘打魚事，鱍鱍、數百，皆眾魚常才爾。赤鯉騰出，特筆以表之，乃是主句。<br>後八句，志啖鱠事。鱠鯉堆盤，使人神旺，則凡禿尾、槎頭之類魴者，俱退舍矣。<br>末再繳醒之，言魴魚固其美者，然當厭飫之餘，無復朵頤焉，況忍多戕物命乎？不見赤鯉就烹朝來之苦若是乎？</td></tr></table>
    【框】鱠：細切的魚肉，同「膾」。
    【框】乙注：仇兆鰲《杜詩詳注》。<br>丙解：浦起龍《讀杜心解》。
