    夫足下之書，始所云者欲至乎道也，而所質者則辭也，無乃務其淺，忘其深，當急者反徐之歟！夫道之大歸非他，欲其得諸心，充諸身，擴而被之國家天下而已，非汲汲乎辭也。其所以不已乎辭者，非得已也。孟子曰：「<u>　　　　　　</u>」此其所以為孟子也。今足下其自謂已得諸心、充諸身歟？擴而被之國家天下而有不得已歟？不然，何遽急於辭也？（曾鞏〈答李沿書〉）
