# 數學A 第 2 週（Day 8–14）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

ma112-01:
  key: 按 3 次 $\sqrt{\ }$ 等於開 8 次方根：$N^{1/8}=2$ ⇒ $N=2^8$。
  explain: |
    按一次 $\sqrt{\ }$ 是 $N^{1/2}$，連按 3 次是 $\left(\left(N^{1/2}\right)^{1/2}\right)^{1/2}=N^{1/8}$。
    $N^{1/8}=2$ ⇒ $N=2^8=256$ → 答案 (4)
    (1) $2^3$ 是把「按 3 次」誤當成 3 次方（全國 9% 誤選）。
ma113-07:
  key: 圖形相同要連「定義域」一起相同：$\log(x^2)$ 在 $x<0$ 也有定義，$\log(x^3)$ 只在 $x>0$ 有定義。
  explain: |
    $\Gamma$：$y=\log x$，只有 $x>0$ 的部分。
    (1) $y=\log(5x)-\dfrac{1}{2}=\log x+\left(\log5-\dfrac{1}{2}\right)\approx\log x+0.2$，整條往上平移 ✗
    (2) $x^2>0$ 只要 $x\ne0$，所以 $2y=\log(x^2)$ 即 $y=\log|x|$，多出 $x<0$ 的一支 ✗（全國 78% 誤選）
    (3) $x^3>0$ ⇔ $x>0$，此時 $3y=3\log x$ ⇔ $y=\log x$ ✓
    (4) $x=10^y$ 就是 $y=\log x$ 的指數寫法 ✓
    (5) 取對數得 $y^3=3\log x$，例如 $x=10$ 時 $y=\sqrt[3]{3}\ne1$ ✗
    → 答案 (3)(4)。這題全對的只有 8%，關鍵就在 (2) 的定義域。
ma113-03:
  key: 三根 $-7$、$-7+a$、$-7+2a$，$f(0)=7a(7-a)(7-2a)$；逐一代入 6 個 a，只有 $a=2$ 使 $f(0)>0$。
  explain: |
    $f(x)=a(x+7)(x+7-a)(x+7-2a)$，所以 $f(0)=7a(7-a)(7-2a)$。
    $a=-6$：$\text{負}\times\text{正}\times\text{正}<0$；$a=-4$、$-2$：同樣 $<0$
    $a=2$：$7\times2\times5\times3>0$ ✓
    $a=4$：$7\times4\times3\times(-1)<0$；$a=6$：$7\times6\times1\times(-5)<0$
    只有 1 個 → 答案 (1)
    全國只有 31% 答對，比選 (3) 的 34% 還少。首項係數 a 的正負也會影響 $f(0)$，每個值都要把四個因式的正負號看完。
ma113-04:
  key: 展開後整理成 $\cos x-1=(2-\sqrt{3})\sin x$，用半角得 $x=0$ 或 $\tan\left(\dfrac{x}{2}\right)=-\tan15^{\circ}$。
  explain: |
    $\sin\left(x+\dfrac{\pi}{6}\right)=\dfrac{\sqrt{3}}{2}\sin x+\dfrac{1}{2}\cos x$，代入得 $\cos x-1=(2-\sqrt{3})\sin x$。
    用半角：$-2\sin^2\left(\dfrac{x}{2}\right)=2(2-\sqrt{3})\sin\left(\dfrac{x}{2}\right)\cos\left(\dfrac{x}{2}\right)$
    ⇒ $\sin\left(\dfrac{x}{2}\right)\left[\sin\left(\dfrac{x}{2}\right)+(2-\sqrt{3})\cos\left(\dfrac{x}{2}\right)\right]=0$
    ① $\sin\left(\dfrac{x}{2}\right)=0$ ⇒ $x=0$
    ② $\tan\left(\dfrac{x}{2}\right)=-(2-\sqrt{3})=-\tan15^{\circ}$ ⇒ $\dfrac{x}{2}=165^{\circ}$ ⇒ $x=330^{\circ}=\dfrac{11\pi}{6}$
    驗算：$x=0$ 時兩邊都是 $\dfrac{1}{2}$；$x=\dfrac{11\pi}{6}$ 時兩邊都是 0 ✓
    共 2 個 → 答案 (2)
    兩邊同除 $\sin\left(\dfrac{x}{2}\right)$ 會漏掉 $x=0$，只剩 1 個而誤選 (1)（全國 17% 誤選）。
ma112-14:
  key: 兩個都是二次式，商就是 a；餘式 $=(a^2+b)x+(2a^2-12)$，要等於 6。
  explain: |
    首項係數比是 a，所以商是 a：
    $ax^2+(2a+b)x-12-a[x^2+(2-a)x-2a]=(a^2+b)x+(2a^2-12)$
    餘式是常數 6 ⇒ $a^2+b=0$ 且 $2a^2-12=6$
    ⇒ $a^2=9$，$a>0$ ⇒ $a=3$，$b=-9$
    $(a,b)=(3,-9)$：14-1＝3、14-2＝−、14-3＝9
ma112-04:
  key: 第 5 位同時是遞增的最後一位、遞減的第一位，一定是最大的 9；其餘 8 個數選 4 個放左邊。
  explain: |
    前 5 位遞增、後 5 位遞減，第 5 位比兩邊都大 ⇒ 第 5 位一定是 9。
    剩下 8 個數字選 4 個放在左邊（由小到大只有一種排法），另外 4 個放右邊（由大到小也只有一種）。
    共 $C(8,4)=\dfrac{8!}{4!4!}=70$ 個 → 答案 (1)
    (3) $\dfrac{9!}{5!4!}=C(9,5)$ 是沒注意到中間一定是 9，直接從 9 個數選 5 個（全國 30% 誤選）。
ma113-05:
  key: 兩組中位數是相鄰的 m、$m+1$，比 m 小的數兩組各 12 個 ⇒ $m=25$；1–24、27–50 各自對半分。
  explain: |
    每組 25 個數，中位數是第 13 小的數。設甲組中位數 m，乙組 $m+1$。
    比 m 小的數：甲組有 12 個，乙組比 $m+1$ 小的 12 個也都比 m 小 ⇒ $m-1=24$ ⇒ $m=25$。
    所以 25 在甲組、26 在乙組：
    1–24 這 24 個數選 12 個給甲組：$C(24,12)$
    27–50 這 24 個數選 12 個給甲組：$C(24,12)$
    共 $(C(24,12))^2$ 種 → 答案 (4)
    (5) $C(48,24)\cdot C(24,12)$ 沒有把「比中位數小」和「比中位數大」的數分開算（全國 24% 誤選）。
ma112-08:
  key: $p_n=1-0.9^n$（$\text{至少中 1 次}=1-\text{全部沒中}$）。
  explain: |
    $p_n=1-0.9^n$：$p_1=0.1$、$p_2=0.19$、$p_3=0.271$。
    (1) $0.9^{n+1}<0.9^n$，所以 $p_{n+1}>p_n$ ✓
    (2) $p_3=0.271$，不是 0.3 ✗（全國 25% 誤選）
    (3) 相鄰差 0.09、0.081 不相同，不是等差數列 ✗（全國 32% 誤選）
    (4) 第一次沒中且第二次中 $=0.9\times0.1=0.09$，而 $p_2-p_1=0.19-0.1=0.09$ ✓（$\text{兩次內至少中一次}=\text{第一次就中}+\text{第一次沒中、第二次中}$）
    (5) 至少中 2 次 $=1-0.9^n-n(0.1)(0.9)^{n-1}$；$n=2$ 時是 0.01，而 $2p_2=0.38$ ✗（全國 43% 誤選）
    → 答案 (1)(4)
ma113-15:
  key: 中獎率 $0.4\%=10\div\text{報名人數}$ ⇒ 2500 顆球；前 100 人抽完後剩 2400 顆，含 4 張 5000 元、5 張 8000 元。
  explain: |
    報名人數 $=10\div0.004=2500$（球數也是 2500）。
    前 100 人抽走 1 張 5000 元與 99 顆沒獎的球，剩 2400 顆：5000 元 4 顆、8000 元 5 顆。
    第 101 號的期望值 $=(4\times5000+5\times8000)\div2400=60000\div2400=25$（元）
    15-1＝2、15-2＝5
    重點：抽後不放回時，用「剩下的球」來算機率。
ma111-05:
  key: 單次陰性中染病的比例 $P=\dfrac{0.06}{0.48}=\dfrac{1}{8}$；三次皆陰性 $P'=\dfrac{0.0024}{0.1536}=\dfrac{1}{64}$。
  explain: |
    單次檢驗為陰性：
    染病且陰性 $=0.3\times0.2=0.06$；未染病且陰性 $=0.7\times0.6=0.42$
    $P=0.06\div(0.06+0.42)=\dfrac{1}{8}$
    連續三次皆陰性（各次獨立）：
    染病 $=0.3\times0.2^3=0.0024$；未染病 $=0.7\times0.6^3=0.1512$
    $P'=0.0024\div(0.0024+0.1512)=\dfrac{1}{64}$
    $\dfrac{P}{P'}=\dfrac{1}{8}\div\dfrac{1}{64}=8$ → 答案 (2)
ma112-02:
  key: 切線垂直半徑，所以 $\angle COD=\theta$；在直角$\triangle OCD$ 中 $\tan\theta=\dfrac{CD}{OC}=CD$。
  explain: |
    切線 $\perp$ 半徑 OC，所以 $\triangle OCE$、$\triangle OCD$ 都是直角三角形（直角在 C）。
    $\triangle ODE$ 中 $\angle ODE=90^{\circ}-\theta$；在 $\triangle OCD$ 中 $\angle COD=90^{\circ}-\angle ODC=\theta$。
    $\tan\theta=\dfrac{\text{對邊}}{\text{鄰邊}}=\dfrac{CD}{OC}=\dfrac{CD}{1}=CD$ → 答案 (5)
    (4) CE：在 $\triangle OCE$ 中 $\tan\theta=\dfrac{OC}{CE}=\dfrac{1}{CE}$，所以 $CE=\cot\theta$（全國 13% 誤選）。
    順便記：$OD=\sec\theta$、$OE=\csc\theta$。
ma113-06:
  key: $PA=PB=9$、$AB=7$ ⇒ $\cos\theta=\dfrac{7}{18}$；半角 $\cos\left(\dfrac{\theta}{2}\right)=\dfrac{5}{6}$，再用餘弦定理求 BQ。
  explain: |
    兩砲台都從 AB 線往北偏 $\theta$，所以 P 在 AB 的中垂線上，$PA=PB=9$。
    $\cos\theta=\dfrac{7}{2}\div9=\dfrac{7}{18}$
    半角：$\cos^2\left(\dfrac{\theta}{2}\right)=\dfrac{1+\cos\theta}{2}=\dfrac{1+\frac{7}{18}}{2}=\dfrac{25}{36}$ ⇒ $\cos\left(\dfrac{\theta}{2}\right)=\dfrac{5}{6}$
    $\triangle ABQ$ 中 $AB=7$、$AQ=9$、$\angle A=\dfrac{\theta}{2}$：
    $BQ^2=7^2+9^2-2\times7\times9\times\dfrac{5}{6}=130-105=25$ ⇒ $BQ=5$ → 答案 (3)
ma113-08:
  key: 最大邊 $n+2$：$n^2+(n+1)^2-(n+2)^2=(n-3)(n+1)$，$n=2$ 鈍角、$n=3$ 直角、$n\ge4$ 才是銳角。
  explain: |
    (1) $n^2+(n+1)^2-(n+2)^2=(n-3)(n+1)$：$T_2$ 是鈍角三角形、$T_3$（3,4,5）是直角三角形 ✗（全國 24% 誤選）
    (2) 周長 $=3n+3$，公差 3 ✓
    (3) 海龍公式：面積 $=\dfrac{n+1}{4}\cdot\sqrt{3(n+3)(n-1)}$，n 越大越大 ✓
    (4) $\text{高}=2\times\text{面積}\div\text{邊長}$，三高比 $=\dfrac{1}{5}:\dfrac{1}{6}:\dfrac{1}{7}$，相鄰差 $\dfrac{1}{30}$、$\dfrac{1}{42}$ 不相等 ✗（全國 22% 誤選）
    (5) $T_3$ 最大角 90°；$T_2$ 最大角 $\cos=\dfrac{4+9-16}{12}=-\dfrac{1}{4}$，大於 90° ✗（全國 25% 誤選）
    → 答案 (2)(3)
ma112-12:
  key: $f(x)=2\sin\left(x+\dfrac{\pi}{3}\right)$：最大、最小值處才是對稱軸；解方程式時要換成 $u=x+\dfrac{\pi}{3}$ 的範圍 $\left[\dfrac{\pi}{3},\dfrac{7\pi}{3}\right)$。
  explain: |
    $f(x)=\sin x+\sqrt{3}\cos x=2\sin\left(x+\dfrac{\pi}{3}\right)$。
    (1) $f\left(\dfrac{\pi}{6}\right)=2\sin\left(\dfrac{\pi}{2}\right)=2$ 是最大值，$x=\dfrac{\pi}{6}$ 是對稱軸 ✓
    (2) 對稱軸在最大值或最小值處，例如 $x=\dfrac{\pi}{6}$（值 2）和 $x=\dfrac{7\pi}{6}$（值 $-2$）都是對稱軸，但函數值不同 ✗（全國 41% 誤選）
    (3) $\sin\left(x+\dfrac{\pi}{3}\right)=\dfrac{\sqrt{3}}{2}$，$x=0$ 或 $\dfrac{\pi}{3}$，有 2 個 ✗（全國 41% 誤選）
    (4) $\sin u=\dfrac{1}{4}$，$u=x+\dfrac{\pi}{3}\in\left[\dfrac{\pi}{3},\dfrac{7\pi}{3}\right)$。令 $\alpha=\arcsin\dfrac{1}{4}<\dfrac{\pi}{3}$，解為 $u=\pi-\alpha$ 與 $2\pi+\alpha$，所以 $x=\dfrac{2\pi}{3}-\alpha$ 或 $\dfrac{5\pi}{3}+\alpha$，兩解和 $=\dfrac{7\pi}{3}>2\pi$ ✗（全國 71% 誤選）
    (5) $4\sin^2\left(\dfrac{x}{2}\right)=2-2\cos x=2+2\sin\left(x-\dfrac{\pi}{2}\right)$，和 f 一樣是振幅 2、週期 $2\pi$ 的正弦曲線，左右、上下平移就能重合 ✓
    → 答案 (1)(5)。全對的只有 6%。
ma113-10:
  key: 只有一個交點 ⇒ 正方形左邊剛好碰到正六邊形最右邊的頂點，頂點高度 $=\dfrac{\sqrt{3}}{2}\times\text{邊長}=2\sqrt{3}$ ⇒ 邊長 4。
  explain: |
    正六邊形一邊在 x 軸上時，最右邊的點是右側頂點，高度是 $\dfrac{\sqrt{3}}{2}t$（t 是邊長）。
    正方形的左邊是一條鉛直線段，兩圖形恰有一個交點 ⇒ 交點 P 就是這個頂點：$\dfrac{\sqrt{3}}{2}t=2\sqrt{3}$ ⇒ $t=4$。
    設 $B=(h,2\sqrt{3})$，則 $P=(h+4,2\sqrt{3})$，正方形中心 $A=(h+4+3,3)=(h+7,3)$。
    (1) A 到 x 軸距離 3，B 是 $2\sqrt{3}\approx3.46$，A 較小 ✗（全國 39% 誤選）
    (2) 正六邊形邊長是 4 ✗
    (3) $\overrightarrow{BA}=(7,3-2\sqrt{3})$ ✓
    (4) $AP^2=3^2+(3-2\sqrt{3})^2=30-12\sqrt{3}\approx9.2<10$，所以 $AP<\sqrt{10}$ ✗（全國 53% 誤選）
    (5) AP 斜率 $=\dfrac{3-2\sqrt{3}}{3}\approx-0.15$，大於 $-\dfrac{1}{\sqrt{3}}\approx-0.58$ ✓
    → 答案 (3)(5)
ma113-11:
  key: 行列式 $\Delta=ab-6$：$ab\ne6$ 有唯一解；$(a,b)=(6,1)$ 無限多解、$(3,2)$ 無解。共 12 種等可能結果。
  explain: |
    骰子 6 種 × 硬幣 2 種＝12 種等可能結果，$\Delta=ab-6$。
    $ab=6$ 只有 $(6,1)$、$(3,2)$：
    $(6,1)$：兩式都是 $x+y=1$ → 無限多解；$(3,2)$：$x+2y=2$ 與 $x+2y=1$ 矛盾 → 無解。
    (1) $a=b$ 只有 $(1,1)$、$(2,2)$，機率 $\dfrac{2}{12}=\dfrac{1}{6}$ ✗（全國 23% 誤選）
    (2) 無解只有 $(3,2)$，機率 $\dfrac{1}{12}$ ✓
    (3) 唯一解：$12-2=10$ 種，機率 $\dfrac{5}{6}$ ✓
    (4) 反面（$b=2$）且有解：$a=1,2,4,5,6$ 共 5 種，機率 $\dfrac{5}{12}$ ✗（全國 32% 誤選）
    (5) $b=2$ 時 $x=\dfrac{6}{2a-6}=\dfrac{3}{a-3}$，$x>0$ ⇔ $a>3$，在 5 種有解的情況中有 $a=4,5,6$ 三種，機率 $\dfrac{3}{5}$ ✗（全國 50% 誤選）
    → 答案 (2)(3)
ma113-12:
  key: $T(x,y)=(3x,ax+y)$：y 軸上的點不動；$\det T=3$，面積變 3 倍且 T 可逆。
  explain: |
    A→$(3,a)$、B→$(0,1)$、C→$(-3,-a)$。
    (1) $a=0$ 時頂點 $(3,0)$、$(0,1)$、$(-3,0)$：兩腰 $\sqrt{10}$ 相等，但 $(3,-1)\cdot(-3,-1)=-8\ne0$，不是直角 ✗（全國 34% 誤選）
    (2) $T(x,y)=(x,y)$ ⇔ $x=0$，y 軸上的點都不動；$\triangle ABC$ 的邊上有 $B(0,1)$ 和原點 $(0,0)$ ✓
    (3) $a\ge0$ 時，右半邊的點 $(x,y)$（$x>0$、$y\ge0$）變成 $(3x,ax+y)$，y 坐標仍 $\ge0$，不會進入第四象限 ✗
    (4) $\det T=3\ne0$，T 可逆，取 $\Omega=T^{-1}(\triangle ABC)$ 即可 ✓
    (5) 面積 $=|\det T|\times\triangle ABC\text{ 面積}=3\times1=3$，與 a 無關 ✓
    → 答案 (2)(4)(5)
ma112-11:
  key: 寫出四個矩陣：$A=\begin{bmatrix}0&1\\-1&0\end{bmatrix}$、$B=\begin{bmatrix}0&-1\\1&0\end{bmatrix}$、$C=\begin{bmatrix}0&1\\1&0\end{bmatrix}$、$D=\begin{bmatrix}0&-1\\-1&0\end{bmatrix}$。
  explain: |
    (1) $A(1,0)=(0,-1)$，$C(1,0)=(0,1)$，不同 ✗（全國 38% 誤選）
    (2) $-B=\begin{bmatrix}0&1\\-1&0\end{bmatrix}=A$ ✓
    (3) 鏡射的反矩陣是自己：$D^{-1}=D\ne C$ ✗（全國 47% 誤選）
    (4) $AB=I$（轉回原位），$CD=\begin{bmatrix}-1&0\\0&-1\end{bmatrix}=-I$（旋轉 180°）✗（全國 38% 誤選）
    (5) $AC=\begin{bmatrix}1&0\\0&-1\end{bmatrix}$，$BD=\begin{bmatrix}1&0\\0&-1\end{bmatrix}$，都是對 x 軸鏡射 ✓
    → 答案 (2)(5)
ma112-13:
  key: 第 1 天的杯數剛好是第 2 天果汁、奶茶的 2 倍：$\text{第 1 天}-2\times\text{第 2 天}$，只剩咖啡。
  explain: |
    設果汁、奶茶、咖啡每杯 j、m、c 元：
    $60j+80m+50c=12900$
    $30j+40m+30c=6850$
    $\text{第 1 式}-2\times\text{第 2 式}$：$-10c=12900-13700=-800$ ⇒ $c=80$
    咖啡每杯 80 元：13-1＝8、13-2＝0
ma113-13:
  key: 平均利潤是加權平均：甲乙合計平均 280 ⇒ $A:B=2:3$；再和丙（240）合成 260 ⇒ $C=A+B$。
  explain: |
    甲乙：$100A+400B=280(A+B)$ ⇒ $120B=180A$ ⇒ $A:B=2:3$
    三型：$280(A+B)+240C=260(A+B+C)$ ⇒ $20(A+B)=20C$ ⇒ $C=A+B$
    取 $A=2$、$B=3$，則 $C=5$ ⇒ $A:B:C=2:3:5$
    13-1＝2、13-2＝3、13-3＝5
ma112-07:
  key: 列出每個月的加薪：甲第 m 個月多 $200\times\left[\dfrac{m-1}{3}\right]$，乙多 $1000\times\left[\dfrac{m-1}{12}\right]$（$[\ ]$ 為高斯記號）。
  explain: |
    設起薪 S。甲：第 1–3 月 S、4–6 月 $S+200$、7–9 月 $S+400$……；乙：第 1–12 月 S、13–24 月 $S+1000$、25–36 月 $S+2000$。
    (1) 甲第 9 個月是 $S+400$，只多 400 元 ✗（全國 20% 誤選）
    (2) 第 13 個月：甲 $S+800$，乙 $S+1000$，甲較低 ✗
    (3) 第 19 個月：甲 $S+1200$，乙 $S+1000$，甲較高 ✓
    (4) 前 18 個月多領的錢：甲 $=3\times(200+400+600+800+1000)=9000$，乙 $=6\times1000=6000$，甲較多 ✗（全國 26% 誤選）
    (5) 第 25–36 個月乙是 $S+2000$；甲依序是 +1600、+1800、+2000、+2200，只有第 34–36 月較高，恰 3 個月 ✓
    → 答案 (3)(5)
ma112-09:
  key: $\log_3 a_k=1.5k-0.5$ 是等差數列；兩兩一組相減各得 $-1.5$，n 為偶數時總和是負的。
  explain: |
    $a_k=3\cdot(3\sqrt{3})^{k-1}=3^{1.5k-0.5}$，所以 $\log_3 a_k=1.5k-0.5$。
    相鄰兩項一正一負：$(1.5k-0.5)-(1.5(k+1)-0.5)=-1.5$。
    n 為偶數：總和 $=\dfrac{n}{2}\times(-1.5)<0$，不可能 $>18$。
    n 為奇數：總和 $=-0.75(n-1)+(1.5n-0.5)=0.75n+0.25>18$ ⇒ $n>23.67$
    (1) $n=23$：$0.75\times23+0.25=17.5$，不到 18 ✗（全國 33% 誤選）
    (2) $n=24$、(4) $n=26$ 是偶數，總和為負 ✗（(4) 全國 44% 誤選）
    (3) $n=25$：總和 19 ✓
    (5) $n=27$：總和 20.5 ✓
    → 答案 (3)(5)
ma113-09:
  key: 迴歸直線通過 $(\bar{x},\bar{y})$，斜率 $=r\cdot\dfrac{\sigma_y}{\sigma_x}$；由此求出 $\bar{y}$ 和 $\sigma_y$ 再比較。
  explain: |
    $\bar{y}_A=2\times5.2-0.6=9.8$，$\bar{y}_B=1.5\times6+0.4=9.4$
    $\sigma_y=\text{斜率}\times\sigma_x\div r$：$\sigma_{yA}=2\times0.3\div0.6=1$，$\sigma_{yB}=1.5\times0.1\div0.3=0.5$
    (1) $\bar{y}_A=9.8>\bar{y}_B=9.4$ ✗（全國 25% 誤選）
    (2) A 的體重標準差 1 比 B 的 0.5 大 ✗（全國 37% 誤選）
    (3) $|8.6-9.8|=1.2>\sigma_{yA}=1$ ✓
    (4) 到 $L_A$：$\dfrac{|2\times5.6-8.6-0.6|}{\sqrt{5}}=\dfrac{2}{\sqrt{5}}\approx0.89$；到 $L_B$：$\dfrac{|1.5\times5.6-8.6+0.4|}{\sqrt{3.25}}\approx0.11$，到 $L_A$ 較遠 ✗（全國 50% 誤選）
    (5) 到 $(5.2,9.8)$ 的距離 $\sqrt{1.6}\approx1.26$，到 $(6,9.4)$ 的距離 $\sqrt{0.8}\approx0.89$，離 B 的平均點較近 ✗（全國 50% 誤選）
    → 答案只有 (3)。多選題也可能只有一個正確選項。
ma112-03:
  key: 點 $(s,\log t)$ 大致落在過原點、斜率 $\dfrac{1}{2}$ 的直線上：$\log t=\dfrac{s}{2}$ ⇒ $t^2=10^s$。
  explain: |
    圖中的點大約通過 $(0,0)$、$(1,0.5)$、$(-1,-0.5)$，所以 $\log t\approx\dfrac{s}{2}$。
    $2\log t=s$ ⇒ $\log t^2=s$ ⇒ $t^2=10^s$ → 答案 (4)
    (3) $t=10^s$ 的斜率是 1，會通過 $(1,1)$（全國 25% 誤選）；(5) $t^3=10^s$ 的斜率是 $\dfrac{1}{3}$。
    重點：取對數後呈直線，就把直線方程式「還原」回指數式。
ma111-04:
  key: $\log a_1$、$\log a_3$、$\log a_6$ 成等差 ⇔ $a_1$、$a_3$、$a_6$ 成等比 ⇒ $a_3^2=a_1a_6$，解得 $a_1=4d$。
  explain: |
    $(a_1+2d)^2=a_1(a_1+5d)$ ⇒ $4a_1d+4d^2=5a_1d$ ⇒ $4d^2=a_1d$ ⇒ $a_1=4d$（$d>0$）
    所以 $a_1=4d$、$a_3=6d$、$a_6=9d$，公比 $\dfrac{3}{2}$。
    $\log$ 數列的公差 $=\log a_3-\log a_1=\log\dfrac{6d}{4d}=\log\dfrac{3}{2}$ → 答案 (3)
ma113-02:
  key: $\overrightarrow{AD}\times\overrightarrow{AG}$ 垂直於平面 ADG（就是對角面 ABGD）；$\overrightarrow{OE}$ 同時垂直 $\overrightarrow{AD}$ 和 $\overrightarrow{AB}$，所以 $\overrightarrow{OE}$ 與外積平行。
  explain: |
    設 $O(0,0,0)$、$A(1,0,0)$、$C(0,1,0)$、$D(0,0,1)$，則 $E(1,0,1)$、$G(0,1,1)$。
    $\overrightarrow{AD}=(-1,0,1)$，$\overrightarrow{AG}=(-1,1,1)$，$\overrightarrow{AD}\times\overrightarrow{AG}=(-1,0,-1)$，與 $\overrightarrow{OE}=(1,0,1)$ 平行 → 答案 (5)
    不用坐標也行：平面 ADG 就是對角面 ABGD；OE 和 AD 是正方形 OADE 的兩條對角線，互相垂直；OE 也垂直稜 AB。所以 OE 是這個平面的法向量。
    (3) $\overrightarrow{CE}=(1,-1,1)$ 不平行（全國 18% 誤選）。
ma112-05:
  key: $\overrightarrow{PQ}\times\overrightarrow{PR}$ 平行於平面的法向量 $(2,-3,5)$；行列式 $=(\text{第一列})\cdot(\overrightarrow{PQ}\times\overrightarrow{PR})$，只要比較第一列與 $(2,-3,5)$ 內積的絕對值。
  explain: |
    $\overrightarrow{PQ}$、$\overrightarrow{PR}$ 都在平面上，所以 $\overrightarrow{PQ}\times\overrightarrow{PR}=k(2,-3,5)$，$k\ne0$。
    三階行列式 $=\text{第一列}\cdot(\overrightarrow{PQ}\times\overrightarrow{PR})=k\times(\text{第一列}\cdot(2,-3,5))$：
    (1) $-2-3+5=0$　(2) $2+3+5=10$　(3) $2-3-5=-6$　(4) $-2+3+5=6$　(5) $-2+3-5=-4$
    絕對值最大的是 (2) → 答案 (2)
ma112-06:
  key: 所有兩兩內積的和 $=\left[\left(\sum P\right)^2-\sum|P|^2\right]\div2=(48-12)\div2=18$，共 $C(7,2)=21$ 組，期望值 $\dfrac{18}{21}=\dfrac{6}{7}$。
  explain: |
    設 O 為原點，其他 7 個頂點的坐標都由 0、1 組成（不全為 0）。
    $\sum P=(4,4,4)$（每個坐標為 1 的頂點各 4 個），$|\sum P|^2=48$
    $\sum|P|^2=3\times1+3\times2+1\times3=12$（相鄰頂點 3 個、面對角 3 個、體對角 1 個）
    所有兩兩內積的和 $=(48-12)\div2=18$
    期望值 $=18\div C(7,2)=\dfrac{18}{21}=\dfrac{6}{7}$ → 答案 (3)
    也可以把 21 組分類直接加總：內積為 0 的有 6 組、為 1 的有 12 組、為 2 的有 3 組（面對角與體對角），$6+12+3=21$ 組，內積總和同樣是 18。
ma112-15:
  key: $3AD=8BD$ 有內分、外分兩種；內分時 $\overrightarrow{OC}\cdot\overrightarrow{OD}$ 一定 $>0$，只能是外分 $D=-\dfrac{3}{5}A+\dfrac{8}{5}B$。
  explain: |
    設 $|\overrightarrow{OA}|=p$、$|\overrightarrow{OB}|=q$，$\overrightarrow{OA}\cdot\overrightarrow{OB}=0$。
    D 在直線 AB 上且 $AD:BD=8:3$：
    ① 內分：$\overrightarrow{OD}=\dfrac{3}{11}\overrightarrow{OA}+\dfrac{8}{11}\overrightarrow{OB}$，$\overrightarrow{OC}\cdot\overrightarrow{OD}$ 各項都是正的，不可能為 0 ✗
    ② 外分（D 在 B 外側，$\overrightarrow{AD}=\dfrac{8}{5}\overrightarrow{AB}$）：$\overrightarrow{OD}=-\dfrac{3}{5}\overrightarrow{OA}+\dfrac{8}{5}\overrightarrow{OB}$
    $\overrightarrow{OC}\cdot\overrightarrow{OD}=\dfrac{3}{5}\left(-\dfrac{3}{5}\right)p^2+\dfrac{2}{5}\left(\dfrac{8}{5}\right)q^2=\dfrac{16q^2-9p^2}{25}=0$ ⇒ $\dfrac{q}{p}=\dfrac{3}{4}$
    $\dfrac{OB}{OA}=\dfrac{3}{4}$：15-1＝3、15-2＝4
    易錯點：只考慮內分點。
ma112-16:
  key: 投影點到 A、B、C 等距 ⇒ 它是 $\triangle ABC$ 的外心 M（在 E 上）；P 由 M 沿法向量 $(1,0,1)$ 移到 $z=1$。
  explain: |
    設 $M(x,y,z)$ 在 E 上（$x+z=2$），$MA=MB=MC$：
    $MA^2=MB^2$ ⇒ $-x+y+z=0$；$MB^2=MC^2$ ⇒ $z-x=4$
    與 $x+z=2$ 聯立：$x=-1$、$z=3$、$y=-4$，$M(-1,-4,3)$（驗算 $MA^2=MB^2=MC^2=27$）
    $P=M+t(1,0,1)$，z 坐標 $3+t=1$ ⇒ $t=-2$，$P(-3,-4,1)$
    P 到 E 的距離 $=|t|\times\sqrt{2}=2\sqrt{2}$：16-1＝2、16-2＝2
ma112-10:
  key: 把 k 提出來：$5y-4x+k(2x-10)=0$，L 恆過定點 $(5,4)$；$D(0,2k)$、$E(10,8-2k)$。
  explain: |
    L 與 $x=0$ 交於 $D(0,2k)$，與 $x=10$ 交於 $E(10,8-2k)$，斜率 $=\dfrac{4-2k}{5}$。
    (1) $k=4$：$5y+4x-40=0$，代入 $A(10,0)$ 成立 ✓
    (2) 過 $C(0,6)$ ⇒ $2k=6$，$k=3$，斜率 $=\dfrac{4-6}{5}=-\dfrac{2}{5}$，不是 $-\dfrac{5}{2}$ ✗（全國 27% 誤選）
    (3) D 在線段 OC 上 ⇔ $0\le2k\le6$ ⇔ $0\le k\le3$ ✓
    (4) $k=\dfrac{1}{2}$：$E(10,7)$，超出長方形（y 最大 6）✗（全國 42% 誤選）
    (5) DE 在長方形內 ⇔ $0\le2k\le6$ 且 $0\le8-2k\le6$ ⇔ $1\le k\le3$，斜率範圍 $-\dfrac{2}{5}\sim\dfrac{2}{5}$；斜率 $\dfrac{3}{10}$ 對應 $k=1.25$，可以 ✓
    → 答案 (1)(3)(5)
ma113-14:
  key: 除以 $x^2-2x+3$ 時可用 $x^2\equiv2x-3$ 化簡：$xf+ag+bh\equiv x(x+1)+a(x-3)-2b$，要 $\equiv0$。
  explain: |
    只看除以 $x^2-2x+3$ 的餘式：$f\equiv x+1$、$g\equiv x-3$、$h\equiv-2$。
    $x\cdot f\equiv x^2+x\equiv(2x-3)+x=3x-3$（因為 $x^2\equiv2x-3$）
    $xf+ag+bh\equiv(3+a)x+(-3-3a-2b)$，整除 ⇒ 兩個係數都是 0：
    $a=-3$；$-3+9-2b=0$ ⇒ $b=3$
    14-1＝−、14-2＝3、14-3＝3
ma113-16:
  key: $(2,-3)$ 與 $(3,2)$ 互相垂直，可當成座標軸：$\overrightarrow{v}$ 的兩個分量是 $|\overrightarrow{v}|-1$、$|\overrightarrow{v}|-2$，由畢氏定理解出 $|\overrightarrow{v}|=5$。
  explain: |
    $(2,-3)\cdot(3,2)=0$，兩方向垂直。設 $|\overrightarrow{v}|=r$，夾角都是銳角，所以兩個正射影長 $r-1$、$r-2$ 都是正的，而且就是 $\overrightarrow{v}$ 在這兩個垂直方向的分量：
    $(r-1)^2+(r-2)^2=r^2$ ⇒ $r^2-6r+5=0$ ⇒ $r=5$（$r=1$ 會讓 $r-2<0$，不合）
    $\overrightarrow{v}=\dfrac{4(2,-3)+3(3,2)}{\sqrt{13}}=\dfrac{(17,-6)}{\sqrt{13}}$
    在 $(4,7)$ 方向的正射影長 $=\dfrac{\overrightarrow{v}\cdot(4,7)}{\sqrt{65}}=\dfrac{68-42}{\sqrt{13}\cdot\sqrt{65}}=\dfrac{26}{13\sqrt{5}}=\dfrac{2\sqrt{5}}{5}$
    16-1＝2、16-2＝5、16-3＝5
    全國答對率只有 8%。關鍵是發現兩個方向互相垂直。
ma112-17:
  key: $L_3$ 是公垂線；$L_1$ 的方向 $(1,-1,1)$ 與 $L_2$ 的方向 $(2,1,-1)$ 互相垂直，所以 $PQ^2=\text{公垂線段}^2+3^2+3^2$。
  explain: |
    設公垂線與 $L_1$、$L_2$ 的交點為 $P_0$、$Q_0$：
    $P_0=(1+t,1-t,2+t)$、$Q_0=(2+2s,5+s,6-s)$，$\overrightarrow{P_0Q_0}$ 同時垂直兩方向向量 ⇒ $t=\dfrac{1}{3}$、$s=-\dfrac{1}{3}$
    $\overrightarrow{P_0Q_0}=(0,4,4)$，長度 $4\sqrt{2}$
    P 在 $L_1$ 上、到 $L_3$ 距離 3 ⇒ $\overrightarrow{P_0P}$ 沿 $L_1$ 方向、長 3；同理 $\overrightarrow{Q_0Q}$ 沿 $L_2$ 方向、長 3。
    $\overrightarrow{PQ}=\overrightarrow{PP_0}+\overrightarrow{P_0Q_0}+\overrightarrow{Q_0Q}$，三段兩兩垂直（$(1,-1,1)\cdot(2,1,-1)=0$）：
    $PQ^2=3^2+32+3^2=50$ ⇒ $PQ=5\sqrt{2}$：17-1＝5、17-2＝2
    因為三段互相垂直，P、Q 取在哪一側答案都一樣。
ma111-08:
  key: $AB=\sqrt{5}$、$BC=\sqrt{10}$、$AC=\sqrt{17}$，$AB^2+BC^2<AC^2$ ⇒ $\angle B$ 是鈍角；$\sin B$ 用外積（面積）最快。
  explain: |
    (1) $AC=\sqrt{17}$ 最長 ✓
    (2) 正弦定理：$\sin A:\sin C=BC:AB=\sqrt{10}:\sqrt{5}$，$\sin A$ 較大 ✗（全國 17% 誤選）
    (3) $5+10<17$，$\angle B$ 是鈍角 ✗（全國 23% 誤選）
    (4) $\overrightarrow{BA}=(-1,2)$、$\overrightarrow{BC}=(3,1)$，$|\overrightarrow{BA}\times\overrightarrow{BC}|=|-1-6|=7=\sqrt{5}\cdot\sqrt{10}\cdot\sin B$ ⇒ $\sin B=\dfrac{7}{5\sqrt{2}}=\dfrac{7\sqrt{2}}{10}$ ✓
    (5) $R=AC\div(2\sin B)=\sqrt{17}\div\dfrac{7\sqrt{2}}{5}\approx2.08$，比 2 大 ✗（全國 32% 誤選）
    → 答案 (1)(4)
