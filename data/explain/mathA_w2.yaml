# 數學A 第 2 週（Day 8–14）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

ma112-01:
  key: 按 3 次 √ 等於開 8 次方根：N^(1/8)＝2 ⇒ N＝2⁸。
  explain: |
    按一次 √ 是 N^(1/2)，連按 3 次是 ((N^(1/2))^(1/2))^(1/2)＝N^(1/8)。
    N^(1/8)＝2 ⇒ N＝2⁸＝256 → 答案 (4)
    (1) 2³ 是把「按 3 次」誤當成 3 次方（全國 9% 誤選）。
ma113-07:
  key: 圖形相同要連「定義域」一起相同：log(x²) 在 x＜0 也有定義，log(x³) 只在 x＞0 有定義。
  explain: |
    Γ：y＝log x，只有 x＞0 的部分。
    (1) y＝log(5x)−1/2＝log x＋(log 5−1/2)≈log x＋0.2，整條往上平移 ✗
    (2) x²＞0 只要 x≠0，所以 2y＝log(x²) 即 y＝log|x|，多出 x＜0 的一支 ✗（全國 78% 誤選）
    (3) x³＞0 ⇔ x＞0，此時 3y＝3log x ⇔ y＝log x ✓
    (4) x＝10ʸ 就是 y＝log x 的指數寫法 ✓
    (5) 取對數得 y³＝3log x，例如 x＝10 時 y＝∛3≠1 ✗
    → 答案 (3)(4)。這題全對的只有 8%，關鍵就在 (2) 的定義域。
ma113-03:
  key: 三根 −7、−7＋a、−7＋2a，f(0)＝7a(7−a)(7−2a)；逐一代入 6 個 a，只有 a＝2 使 f(0)＞0。
  explain: |
    f(x)＝a(x＋7)(x＋7−a)(x＋7−2a)，所以 f(0)＝7a(7−a)(7−2a)。
    a＝−6：負×正×正＜0；a＝−4、−2：同樣＜0
    a＝2：7×2×5×3＞0 ✓
    a＝4：7×4×3×(−1)＜0；a＝6：7×6×1×(−5)＜0
    只有 1 個 → 答案 (1)
    全國只有 31% 答對，比選 (3) 的 34% 還少。首項係數 a 的正負也會影響 f(0)，每個值都要把四個因式的正負號看完。
ma113-04:
  key: 展開後整理成 cos x−1＝(2−√3)sin x，用半角得 x＝0 或 tan(x/2)＝−tan15°。
  explain: |
    sin(x＋π/6)＝(√3/2)sin x＋(1/2)cos x，代入得 cos x−1＝(2−√3)sin x。
    用半角：−2sin²(x/2)＝2(2−√3)sin(x/2)cos(x/2)
    ⇒ sin(x/2)[sin(x/2)＋(2−√3)cos(x/2)]＝0
    ① sin(x/2)＝0 ⇒ x＝0
    ② tan(x/2)＝−(2−√3)＝−tan15° ⇒ x/2＝165° ⇒ x＝330°＝11π/6
    驗算：x＝0 時兩邊都是 1/2；x＝11π/6 時兩邊都是 0 ✓
    共 2 個 → 答案 (2)
    兩邊同除 sin(x/2) 會漏掉 x＝0，只剩 1 個而誤選 (1)（全國 17% 誤選）。
ma112-14:
  key: 兩個都是二次式，商就是 a；餘式＝(a²＋b)x＋(2a²−12)，要等於 6。
  explain: |
    首項係數比是 a，所以商是 a：
    ax²＋(2a＋b)x−12 − a[x²＋(2−a)x−2a]＝(a²＋b)x＋(2a²−12)
    餘式是常數 6 ⇒ a²＋b＝0 且 2a²−12＝6
    ⇒ a²＝9，a＞0 ⇒ a＝3，b＝−9
    (a,b)＝(3,−9)：14-1＝3、14-2＝−、14-3＝9
ma112-04:
  key: 第 5 位同時是遞增的最後一位、遞減的第一位，一定是最大的 9；其餘 8 個數選 4 個放左邊。
  explain: |
    前 5 位遞增、後 5 位遞減，第 5 位比兩邊都大 ⇒ 第 5 位一定是 9。
    剩下 8 個數字選 4 個放在左邊（由小到大只有一種排法），另外 4 個放右邊（由大到小也只有一種）。
    共 C(8,4)＝8!/(4!4!)＝70 個 → 答案 (1)
    (3) 9!/(5!4!)＝C(9,5) 是沒注意到中間一定是 9，直接從 9 個數選 5 個（全國 30% 誤選）。
ma113-05:
  key: 兩組中位數是相鄰的 m、m＋1，比 m 小的數兩組各 12 個 ⇒ m＝25；1–24、27–50 各自對半分。
  explain: |
    每組 25 個數，中位數是第 13 小的數。設甲組中位數 m，乙組 m＋1。
    比 m 小的數：甲組有 12 個，乙組比 m＋1 小的 12 個也都比 m 小 ⇒ m−1＝24 ⇒ m＝25。
    所以 25 在甲組、26 在乙組：
    1–24 這 24 個數選 12 個給甲組：C(24,12)
    27–50 這 24 個數選 12 個給甲組：C(24,12)
    共 (C(24,12))² 種 → 答案 (4)
    (5) C(48,24)·C(24,12) 沒有把「比中位數小」和「比中位數大」的數分開算（全國 24% 誤選）。
ma112-08:
  key: pₙ＝1−0.9ⁿ（至少中 1 次＝1−全部沒中）。
  explain: |
    pₙ＝1−0.9ⁿ：p₁＝0.1、p₂＝0.19、p₃＝0.271。
    (1) 0.9ⁿ⁺¹＜0.9ⁿ，所以 pₙ₊₁＞pₙ ✓
    (2) p₃＝0.271，不是 0.3 ✗（全國 25% 誤選）
    (3) 相鄰差 0.09、0.081 不相同，不是等差數列 ✗（全國 32% 誤選）
    (4) 第一次沒中且第二次中＝0.9×0.1＝0.09，而 p₂−p₁＝0.19−0.1＝0.09 ✓（兩次內至少中一次＝第一次就中＋第一次沒中、第二次中）
    (5) 至少中 2 次＝1−0.9ⁿ−n(0.1)(0.9)ⁿ⁻¹；n＝2 時是 0.01，而 2p₂＝0.38 ✗（全國 43% 誤選）
    → 答案 (1)(4)
ma113-15:
  key: 中獎率 0.4%＝10÷報名人數 ⇒ 2500 顆球；前 100 人抽完後剩 2400 顆，含 4 張 5000 元、5 張 8000 元。
  explain: |
    報名人數＝10÷0.004＝2500（球數也是 2500）。
    前 100 人抽走 1 張 5000 元與 99 顆沒獎的球，剩 2400 顆：5000 元 4 顆、8000 元 5 顆。
    第 101 號的期望值＝(4×5000＋5×8000)÷2400＝60000÷2400＝25（元）
    15-1＝2、15-2＝5
    重點：抽後不放回時，用「剩下的球」來算機率。
ma111-05:
  key: 單次陰性中染病的比例 P＝0.06/0.48＝1/8；三次皆陰性 P'＝0.0024/0.1536＝1/64。
  explain: |
    單次檢驗為陰性：
    染病且陰性＝0.3×0.2＝0.06；未染病且陰性＝0.7×0.6＝0.42
    P＝0.06÷(0.06＋0.42)＝1/8
    連續三次皆陰性（各次獨立）：
    染病＝0.3×0.2³＝0.0024；未染病＝0.7×0.6³＝0.1512
    P'＝0.0024÷(0.0024＋0.1512)＝1/64
    P/P'＝(1/8)÷(1/64)＝8 → 答案 (2)
ma112-02:
  key: 切線垂直半徑，所以 ∠COD＝θ；在直角△OCD 中 tanθ＝CD/OC＝CD。
  explain: |
    切線 ⊥ 半徑 OC，所以 △OCE、△OCD 都是直角三角形（直角在 C）。
    △ODE 中 ∠ODE＝90°−θ；在 △OCD 中 ∠COD＝90°−∠ODC＝θ。
    tanθ＝對邊/鄰邊＝CD/OC＝CD/1＝CD → 答案 (5)
    (4) CE：在 △OCE 中 tanθ＝OC/CE＝1/CE，所以 CE＝cotθ（全國 13% 誤選）。
    順便記：OD＝secθ、OE＝cscθ。
ma113-06:
  key: PA＝PB＝9、AB＝7 ⇒ cosθ＝7/18；半角 cos(θ/2)＝5/6，再用餘弦定理求 BQ。
  explain: |
    兩砲台都從 AB 線往北偏 θ，所以 P 在 AB 的中垂線上，PA＝PB＝9。
    cosθ＝(7/2)÷9＝7/18
    半角：cos²(θ/2)＝(1＋cosθ)/2＝(1＋7/18)/2＝25/36 ⇒ cos(θ/2)＝5/6
    △ABQ 中 AB＝7、AQ＝9、∠A＝θ/2：
    BQ²＝7²＋9²−2×7×9×(5/6)＝130−105＝25 ⇒ BQ＝5 → 答案 (3)
ma113-08:
  key: 最大邊 n＋2：n²＋(n＋1)²−(n＋2)²＝(n−3)(n＋1)，n＝2 鈍角、n＝3 直角、n≥4 才是銳角。
  explain: |
    (1) n²＋(n＋1)²−(n＋2)²＝(n−3)(n＋1)：T₂ 是鈍角三角形、T₃（3,4,5）是直角三角形 ✗（全國 24% 誤選）
    (2) 周長＝3n＋3，公差 3 ✓
    (3) 海龍公式：面積＝((n＋1)/4)·√(3(n＋3)(n−1))，n 越大越大 ✓
    (4) 高＝2×面積÷邊長，三高比＝1/5：1/6：1/7，相鄰差 1/30、1/42 不相等 ✗（全國 22% 誤選）
    (5) T₃ 最大角 90°；T₂ 最大角 cos＝(4＋9−16)/12＝−1/4，大於 90° ✗（全國 25% 誤選）
    → 答案 (2)(3)
ma112-12:
  key: f(x)＝2sin(x＋π/3)：最大、最小值處才是對稱軸；解方程式時要換成 u＝x＋π/3 的範圍 [π/3, 7π/3)。
  explain: |
    f(x)＝sin x＋√3cos x＝2sin(x＋π/3)。
    (1) f(π/6)＝2sin(π/2)＝2 是最大值，x＝π/6 是對稱軸 ✓
    (2) 對稱軸在最大值或最小值處，例如 x＝π/6（值 2）和 x＝7π/6（值 −2）都是對稱軸，但函數值不同 ✗（全國 41% 誤選）
    (3) sin(x＋π/3)＝√3/2，x＝0 或 π/3，有 2 個 ✗（全國 41% 誤選）
    (4) sin u＝1/4，u＝x＋π/3∈[π/3, 7π/3)。令 α＝arcsin(1/4)＜π/3，解為 u＝π−α 與 2π＋α，所以 x＝2π/3−α 或 5π/3＋α，兩解和＝7π/3＞2π ✗（全國 71% 誤選）
    (5) 4sin²(x/2)＝2−2cos x＝2＋2sin(x−π/2)，和 f 一樣是振幅 2、週期 2π 的正弦曲線，左右、上下平移就能重合 ✓
    → 答案 (1)(5)。全對的只有 6%。
ma113-10:
  key: 只有一個交點 ⇒ 正方形左邊剛好碰到正六邊形最右邊的頂點，頂點高度＝(√3/2)×邊長＝2√3 ⇒ 邊長 4。
  explain: |
    正六邊形一邊在 x 軸上時，最右邊的點是右側頂點，高度是 (√3/2)t（t 是邊長）。
    正方形的左邊是一條鉛直線段，兩圖形恰有一個交點 ⇒ 交點 P 就是這個頂點：(√3/2)t＝2√3 ⇒ t＝4。
    設 B＝(h, 2√3)，則 P＝(h＋4, 2√3)，正方形中心 A＝(h＋4＋3, 3)＝(h＋7, 3)。
    (1) A 到 x 軸距離 3，B 是 2√3≈3.46，A 較小 ✗（全國 39% 誤選）
    (2) 正六邊形邊長是 4 ✗
    (3) BA＝(7, 3−2√3) ✓
    (4) AP²＝3²＋(3−2√3)²＝30−12√3≈9.2＜10，所以 AP＜√10 ✗（全國 53% 誤選）
    (5) AP 斜率＝(3−2√3)/3≈−0.15，大於 −1/√3≈−0.58 ✓
    → 答案 (3)(5)
ma113-11:
  key: 行列式 Δ＝ab−6：ab≠6 有唯一解；(a,b)＝(6,1) 無限多解、(3,2) 無解。共 12 種等可能結果。
  explain: |
    骰子 6 種 × 硬幣 2 種＝12 種等可能結果，Δ＝ab−6。
    ab＝6 只有 (6,1)、(3,2)：
    (6,1)：兩式都是 x＋y＝1 → 無限多解；(3,2)：x＋2y＝2 與 x＋2y＝1 矛盾 → 無解。
    (1) a＝b 只有 (1,1)、(2,2)，機率 2/12＝1/6 ✗（全國 23% 誤選）
    (2) 無解只有 (3,2)，機率 1/12 ✓
    (3) 唯一解：12−2＝10 種，機率 5/6 ✓
    (4) 反面（b＝2）且有解：a＝1,2,4,5,6 共 5 種，機率 5/12 ✗（全國 32% 誤選）
    (5) b＝2 時 x＝6/(2a−6)＝3/(a−3)，x＞0 ⇔ a＞3，在 5 種有解的情況中有 a＝4,5,6 三種，機率 3/5 ✗（全國 50% 誤選）
    → 答案 (2)(3)
ma113-12:
  key: T(x,y)＝(3x, ax＋y)：y 軸上的點不動；det T＝3，面積變 3 倍且 T 可逆。
  explain: |
    A→(3,a)、B→(0,1)、C→(−3,−a)。
    (1) a＝0 時頂點 (3,0)、(0,1)、(−3,0)：兩腰 √10 相等，但 (3,−1)·(−3,−1)＝−8≠0，不是直角 ✗（全國 34% 誤選）
    (2) T(x,y)＝(x,y) ⇔ x＝0，y 軸上的點都不動；△ABC 的邊上有 B(0,1) 和原點 (0,0) ✓
    (3) a≥0 時，右半邊的點 (x,y)（x＞0、y≥0）變成 (3x, ax＋y)，y 坐標仍 ≥0，不會進入第四象限 ✗
    (4) det T＝3≠0，T 可逆，取 Ω＝T⁻¹(△ABC) 即可 ✓
    (5) 面積＝|det T|×△ABC 面積＝3×1＝3，與 a 無關 ✓
    → 答案 (2)(4)(5)
ma112-11:
  key: 寫出四個矩陣：A＝[[0,1],[−1,0]]、B＝[[0,−1],[1,0]]、C＝[[0,1],[1,0]]、D＝[[0,−1],[−1,0]]。
  explain: |
    (1) A(1,0)＝(0,−1)，C(1,0)＝(0,1)，不同 ✗（全國 38% 誤選）
    (2) −B＝[[0,1],[−1,0]]＝A ✓
    (3) 鏡射的反矩陣是自己：D⁻¹＝D≠C ✗（全國 47% 誤選）
    (4) AB＝I（轉回原位），CD＝[[−1,0],[0,−1]]＝−I（旋轉 180°）✗（全國 38% 誤選）
    (5) AC＝[[1,0],[0,−1]]，BD＝[[1,0],[0,−1]]，都是對 x 軸鏡射 ✓
    → 答案 (2)(5)
ma112-13:
  key: 第 1 天的杯數剛好是第 2 天果汁、奶茶的 2 倍：第 1 天 − 2×第 2 天，只剩咖啡。
  explain: |
    設果汁、奶茶、咖啡每杯 j、m、c 元：
    60j＋80m＋50c＝12900
    30j＋40m＋30c＝6850
    第 1 式 − 2×第 2 式：−10c＝12900−13700＝−800 ⇒ c＝80
    咖啡每杯 80 元：13-1＝8、13-2＝0
ma113-13:
  key: 平均利潤是加權平均：甲乙合計平均 280 ⇒ A：B＝2：3；再和丙（240）合成 260 ⇒ C＝A＋B。
  explain: |
    甲乙：100A＋400B＝280(A＋B) ⇒ 120B＝180A ⇒ A：B＝2：3
    三型：280(A＋B)＋240C＝260(A＋B＋C) ⇒ 20(A＋B)＝20C ⇒ C＝A＋B
    取 A＝2、B＝3，則 C＝5 ⇒ A：B：C＝2：3：5
    13-1＝2、13-2＝3、13-3＝5
ma112-07:
  key: 列出每個月的加薪：甲第 m 個月多 200×[(m−1)/3]，乙多 1000×[(m−1)/12]（[ ] 為高斯記號）。
  explain: |
    設起薪 S。甲：第 1–3 月 S、4–6 月 S＋200、7–9 月 S＋400……；乙：第 1–12 月 S、13–24 月 S＋1000、25–36 月 S＋2000。
    (1) 甲第 9 個月是 S＋400，只多 400 元 ✗（全國 20% 誤選）
    (2) 第 13 個月：甲 S＋800，乙 S＋1000，甲較低 ✗
    (3) 第 19 個月：甲 S＋1200，乙 S＋1000，甲較高 ✓
    (4) 前 18 個月多領的錢：甲＝3×(200＋400＋600＋800＋1000)＝9000，乙＝6×1000＝6000，甲較多 ✗（全國 26% 誤選）
    (5) 第 25–36 個月乙是 S＋2000；甲依序是 +1600、+1800、+2000、+2200，只有第 34–36 月較高，恰 3 個月 ✓
    → 答案 (3)(5)
ma112-09:
  key: log₃aₖ＝1.5k−0.5 是等差數列；兩兩一組相減各得 −1.5，n 為偶數時總和是負的。
  explain: |
    aₖ＝3·(3√3)^(k−1)＝3^(1.5k−0.5)，所以 log₃aₖ＝1.5k−0.5。
    相鄰兩項一正一負：(1.5k−0.5)−(1.5(k＋1)−0.5)＝−1.5。
    n 為偶數：總和＝(n/2)×(−1.5)＜0，不可能＞18。
    n 為奇數：總和＝−0.75(n−1)＋(1.5n−0.5)＝0.75n＋0.25＞18 ⇒ n＞23.67
    (1) n＝23：0.75×23＋0.25＝17.5，不到 18 ✗（全國 33% 誤選）
    (2) n＝24、(4) n＝26 是偶數，總和為負 ✗（(4) 全國 44% 誤選）
    (3) n＝25：總和 19 ✓
    (5) n＝27：總和 20.5 ✓
    → 答案 (3)(5)
ma113-09:
  key: 迴歸直線通過 (x̄, ȳ)，斜率＝r·σy/σx；由此求出 ȳ 和 σy 再比較。
  explain: |
    ȳA＝2×5.2−0.6＝9.8，ȳB＝1.5×6＋0.4＝9.4
    σy＝斜率×σx÷r：σyA＝2×0.3÷0.6＝1，σyB＝1.5×0.1÷0.3＝0.5
    (1) ȳA＝9.8＞ȳB＝9.4 ✗（全國 25% 誤選）
    (2) A 的體重標準差 1 比 B 的 0.5 大 ✗（全國 37% 誤選）
    (3) |8.6−9.8|＝1.2＞σyA＝1 ✓
    (4) 到 LA：|2×5.6−8.6−0.6|/√5＝2/√5≈0.89；到 LB：|1.5×5.6−8.6＋0.4|/√3.25≈0.11，到 LA 較遠 ✗（全國 50% 誤選）
    (5) 到 (5.2, 9.8) 的距離 √1.6≈1.26，到 (6, 9.4) 的距離 √0.8≈0.89，離 B 的平均點較近 ✗（全國 50% 誤選）
    → 答案只有 (3)。多選題也可能只有一個正確選項。
ma112-03:
  key: 點 (s, log t) 大致落在過原點、斜率 1/2 的直線上：log t＝s/2 ⇒ t²＝10ˢ。
  explain: |
    圖中的點大約通過 (0,0)、(1, 0.5)、(−1, −0.5)，所以 log t ≈ s/2。
    2log t＝s ⇒ log t²＝s ⇒ t²＝10ˢ → 答案 (4)
    (3) t＝10ˢ 的斜率是 1，會通過 (1,1)（全國 25% 誤選）；(5) t³＝10ˢ 的斜率是 1/3。
    重點：取對數後呈直線，就把直線方程式「還原」回指數式。
ma111-04:
  key: log a₁、log a₃、log a₆ 成等差 ⇔ a₁、a₃、a₆ 成等比 ⇒ a₃²＝a₁a₆，解得 a₁＝4d。
  explain: |
    (a₁＋2d)²＝a₁(a₁＋5d) ⇒ 4a₁d＋4d²＝5a₁d ⇒ 4d²＝a₁d ⇒ a₁＝4d（d＞0）
    所以 a₁＝4d、a₃＝6d、a₆＝9d，公比 3/2。
    log 數列的公差＝log a₃−log a₁＝log(6d/4d)＝log(3/2) → 答案 (3)
ma113-02:
  key: AD×AG 垂直於平面 ADG（就是對角面 ABGD）；OE 同時垂直 AD 和 AB，所以 OE 與外積平行。
  explain: |
    設 O(0,0,0)、A(1,0,0)、C(0,1,0)、D(0,0,1)，則 E(1,0,1)、G(0,1,1)。
    AD＝(−1,0,1)，AG＝(−1,1,1)，AD×AG＝(−1,0,−1)，與 OE＝(1,0,1) 平行 → 答案 (5)
    不用坐標也行：平面 ADG 就是對角面 ABGD；OE 和 AD 是正方形 OADE 的兩條對角線，互相垂直；OE 也垂直稜 AB。所以 OE 是這個平面的法向量。
    (3) CE＝(1,−1,1) 不平行（全國 18% 誤選）。
ma112-05:
  key: PQ×PR 平行於平面的法向量 (2,−3,5)；行列式＝(第一列)·(PQ×PR)，只要比較第一列與 (2,−3,5) 內積的絕對值。
  explain: |
    PQ、PR 都在平面上，所以 PQ×PR＝k(2,−3,5)，k≠0。
    三階行列式＝第一列·(PQ×PR)＝k×(第一列·(2,−3,5))：
    (1) −2−3＋5＝0　(2) 2＋3＋5＝10　(3) 2−3−5＝−6　(4) −2＋3＋5＝6　(5) −2＋3−5＝−4
    絕對值最大的是 (2) → 答案 (2)
ma112-06:
  key: 所有兩兩內積的和＝[(ΣP)²−Σ|P|²]÷2＝(48−12)÷2＝18，共 C(7,2)＝21 組，期望值 18/21＝6/7。
  explain: |
    設 O 為原點，其他 7 個頂點的坐標都由 0、1 組成（不全為 0）。
    ΣP＝(4,4,4)（每個坐標為 1 的頂點各 4 個），|ΣP|²＝48
    Σ|P|²＝3×1＋3×2＋1×3＝12（相鄰頂點 3 個、面對角 3 個、體對角 1 個）
    所有兩兩內積的和＝(48−12)÷2＝18
    期望值＝18÷C(7,2)＝18/21＝6/7 → 答案 (3)
    也可以把 21 組分類直接加總：內積為 0 的有 6 組、為 1 的有 12 組、為 2 的有 3 組（面對角與體對角），6＋12＋3＝21 組，內積總和同樣是 18。
ma112-15:
  key: 3AD＝8BD 有內分、外分兩種；內分時 OC·OD 一定＞0，只能是外分 D＝−(3/5)A＋(8/5)B。
  explain: |
    設 |OA|＝p、|OB|＝q，OA·OB＝0。
    D 在直線 AB 上且 AD：BD＝8：3：
    ① 內分：OD＝(3/11)OA＋(8/11)OB，OC·OD 各項都是正的，不可能為 0 ✗
    ② 外分（D 在 B 外側，AD＝(8/5)AB）：OD＝−(3/5)OA＋(8/5)OB
    OC·OD＝(3/5)(−3/5)p²＋(2/5)(8/5)q²＝(16q²−9p²)/25＝0 ⇒ q/p＝3/4
    OB/OA＝3/4：15-1＝3、15-2＝4
    易錯點：只考慮內分點。
ma112-16:
  key: 投影點到 A、B、C 等距 ⇒ 它是 △ABC 的外心 M（在 E 上）；P 由 M 沿法向量 (1,0,1) 移到 z＝1。
  explain: |
    設 M(x,y,z) 在 E 上（x＋z＝2），MA＝MB＝MC：
    MA²＝MB² ⇒ −x＋y＋z＝0；MB²＝MC² ⇒ z−x＝4
    與 x＋z＝2 聯立：x＝−1、z＝3、y＝−4，M(−1,−4,3)（驗算 MA²＝MB²＝MC²＝27）
    P＝M＋t(1,0,1)，z 坐標 3＋t＝1 ⇒ t＝−2，P(−3,−4,1)
    P 到 E 的距離＝|t|×√2＝2√2：16-1＝2、16-2＝2
ma112-10:
  key: 把 k 提出來：5y−4x＋k(2x−10)＝0，L 恆過定點 (5,4)；D(0,2k)、E(10,8−2k)。
  explain: |
    L 與 x＝0 交於 D(0, 2k)，與 x＝10 交於 E(10, 8−2k)，斜率＝(4−2k)/5。
    (1) k＝4：5y＋4x−40＝0，代入 A(10,0) 成立 ✓
    (2) 過 C(0,6) ⇒ 2k＝6，k＝3，斜率＝(4−6)/5＝−2/5，不是 −5/2 ✗（全國 27% 誤選）
    (3) D 在線段 OC 上 ⇔ 0≤2k≤6 ⇔ 0≤k≤3 ✓
    (4) k＝1/2：E(10, 7)，超出長方形（y 最大 6）✗（全國 42% 誤選）
    (5) DE 在長方形內 ⇔ 0≤2k≤6 且 0≤8−2k≤6 ⇔ 1≤k≤3，斜率範圍 −2/5～2/5；斜率 3/10 對應 k＝1.25，可以 ✓
    → 答案 (1)(3)(5)
ma113-14:
  key: 除以 x²−2x＋3 時可用 x²≡2x−3 化簡：xf＋ag＋bh ≡ x(x＋1)＋a(x−3)−2b，要 ≡0。
  explain: |
    只看除以 x²−2x＋3 的餘式：f≡x＋1、g≡x−3、h≡−2。
    x·f ≡ x²＋x ≡ (2x−3)＋x＝3x−3（因為 x²≡2x−3）
    xf＋ag＋bh ≡ (3＋a)x＋(−3−3a−2b)，整除 ⇒ 兩個係數都是 0：
    a＝−3；−3＋9−2b＝0 ⇒ b＝3
    14-1＝−、14-2＝3、14-3＝3
ma113-16:
  key: (2,−3) 與 (3,2) 互相垂直，可當成座標軸：v 的兩個分量是 |v|−1、|v|−2，由畢氏定理解出 |v|＝5。
  explain: |
    (2,−3)·(3,2)＝0，兩方向垂直。設 |v|＝r，夾角都是銳角，所以兩個正射影長 r−1、r−2 都是正的，而且就是 v 在這兩個垂直方向的分量：
    (r−1)²＋(r−2)²＝r² ⇒ r²−6r＋5＝0 ⇒ r＝5（r＝1 會讓 r−2＜0，不合）
    v＝[4(2,−3)＋3(3,2)]/√13＝(17,−6)/√13
    在 (4,7) 方向的正射影長＝v·(4,7)/√65＝(68−42)/(√13·√65)＝26/(13√5)＝2√5/5
    16-1＝2、16-2＝5、16-3＝5
    全國答對率只有 8%。關鍵是發現兩個方向互相垂直。
ma112-17:
  key: L₃ 是公垂線；L₁ 的方向 (1,−1,1) 與 L₂ 的方向 (2,1,−1) 互相垂直，所以 PQ²＝公垂線段²＋3²＋3²。
  explain: |
    設公垂線與 L₁、L₂ 的交點為 P₀、Q₀：
    P₀＝(1＋t, 1−t, 2＋t)、Q₀＝(2＋2s, 5＋s, 6−s)，P₀Q₀ 同時垂直兩方向向量 ⇒ t＝1/3、s＝−1/3
    P₀Q₀＝(0,4,4)，長度 4√2
    P 在 L₁ 上、到 L₃ 距離 3 ⇒ P₀P 沿 L₁ 方向、長 3；同理 Q₀Q 沿 L₂ 方向、長 3。
    PQ＝PP₀＋P₀Q₀＋Q₀Q，三段兩兩垂直（(1,−1,1)·(2,1,−1)＝0）：
    PQ²＝3²＋32＋3²＝50 ⇒ PQ＝5√2：17-1＝5、17-2＝2
    因為三段互相垂直，P、Q 取在哪一側答案都一樣。
ma111-08:
  key: AB＝√5、BC＝√10、AC＝√17，AB²＋BC²＜AC² ⇒ ∠B 是鈍角；sinB 用外積（面積）最快。
  explain: |
    (1) AC＝√17 最長 ✓
    (2) 正弦定理：sinA：sinC＝BC：AB＝√10：√5，sinA 較大 ✗（全國 17% 誤選）
    (3) 5＋10＜17，∠B 是鈍角 ✗（全國 23% 誤選）
    (4) BA＝(−1,2)、BC＝(3,1)，|BA×BC|＝|−1−6|＝7＝√5·√10·sinB ⇒ sinB＝7/(5√2)＝7√2/10 ✓
    (5) R＝AC÷(2sinB)＝√17÷(7√2/5)≈2.08，比 2 大 ✗（全國 32% 誤選）
    → 答案 (1)(4)
