# 國文 Day 22–28 解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。

# ---------- Day 22：字音、字形、虛詞與成語 ----------
chn115-01:
  key: 「枇」杷、「毗」鄰都讀ㄆㄧˊ；攲（ㄑㄧ）／旖（ㄧˇ）、諳（ㄢ）／喑（ㄧㄣ）、遏（ㄜˋ）／謁（ㄧㄝˋ）都不同。
  explain: |
    (C) 「枇」杷ㄆㄧˊ／「毗」鄰ㄆㄧˊ ✓
    (A) 取枕「攲」臥ㄑㄧ（傾斜，出自〈虯髯客傳〉）／風光「旖」旎ㄧˇ（全國 49% 誤選）✗
    (B) 略「諳」水性ㄢ（熟悉）／「喑」啞難言ㄧㄣ（全國 17% 誤選）✗
    (D) 燎原莫「遏」ㄜˋ／登門拜「謁」ㄧㄝˋ（全國 20% 誤選）✗
chn115-02:
  key: 無遠弗「屆」、離群「索」居、人情「世」故；「以儆效尤」寫法正確。
  explain: |
    (A) 「以儆效尤」：用來警戒仿效壞榜樣的人 ✓
    (B) 無遠弗「界」→「屆」（屆：到達）（全國 18% 誤選）✗
    (C) 離群「所」居→「索」（索：孤單）（全國 50% 誤選）✗
    (D) 人情「事」故→「世」（全國 10% 誤選）✗
chn112-02:
  key: 價格不「菲」、人謀不「臧」、「承」載；「命蹇時乖」是命運不好、時運不佳，寫法正確。
  explain: |
    (C) 「命蹇時乖」：命運不順，時運不佳 ✓
    (A) 價格不「斐」→「菲」（菲：微薄；不菲＝價格很高）（全國 33% 誤選）✗
    (B) 人謀不「彰」→「臧」（臧：善；人謀不臧＝人為的謀劃不周）（全國 12% 誤選）✗
    (D) 「乘」載→「承」載（承受、裝載）（全國 42% 誤選）✗
chn115-25:
  key: 「為……所……」都是被動；兩個「竊」都是謙詞「私下」；與（參與／贊同）、於（對／被）、乃（竟然／才）意思不同。
  explain: |
    (B) 梅花「為」寒所勒／若屬皆且「為」所虜：都是「被」✓（全國 19% 漏選）
    (E) 「竊」以為過矣／「竊」慕管夫人之墨竹：都是謙詞，私下 ✓（全國 45% 漏選）
    (A) 「與」於蜡賓：參與／吾「與」點也：贊同（全國 17% 誤選）✗
    (C) 貳「於」楚：對楚有二心，「於」表對象／困「於」周郎：被周瑜所困，「於」表被動（全國 46% 誤選）✗
    (D) 「乃」不知有漢：竟然／「乃」知真人之興也：才、於是（全國 39% 誤選）✗
chn115-26:
  key: 沆瀣一氣＝臭味相投的人勾結；授人以柄＝讓人抓到把柄；秣馬厲兵＝準備作戰。不次拔擢是破格提拔，曲突徙薪是事前防範。
  explain: |
    (A) 沆瀣一氣：比喻臭味相投的人勾結在一起 → 用於官商勾結，適當 ✓（全國 43% 漏選）
    (B) 授人以柄：把把柄交給別人，讓人有機可乘 ✓（全國 36% 漏選）
    (D) 秣馬厲兵：餵飽戰馬、磨利兵器，比喻做好準備 ✓
    (C) 不次拔擢：不依一般次序破格提拔；老張是失利被調職，不適當（全國 25% 誤選）✗
    (E) 曲突徙薪：把煙囪改彎、移走柴薪，比喻防患於未然；發現錯誤後才補救，不適當（全國 30% 誤選）✗

# ---------- Day 23：文意排序、「以」的用法、量詞 ----------
chn115-05:
  key: 有大事就讓百姓議論（丁）→ 觀察民意（乙）→ 若意見不可行（甲）→ 再三說明（戊）→ 讓百姓心服（丙）。
  explain: |
    完整句：夫三代之君，惟不忍鄙其民而欺之，<b>故天下有故，而其議及於百姓</b>（丁），<b>以觀其意之所嚮</b>（乙）；<b>及其不可聽也</b>（甲），<b>則又反覆而諭之，以窮極其說</b>（戊），<b>而服其不然之心</b>（丙），是以其民親而愛之。
    線索：丁的「故」承接「不忍鄙其民而欺之」；乙「以觀」說明讓百姓議論的目的；甲「及其不可聽也」和戊「則又反覆而諭之」是「及……則……」的句式；丙「服其不然之心」是說明的結果，接「是以其民親而愛之」。
    (C) 丁乙甲戊丙 ✓
    (A) 乙沒有承接的主語，不能放在開頭（全國 23% 誤選）✗
chn113-26:
  key: 表目的的「以」可以換成「來、用來」：垣牆周庭「來」擋南日、殺身「來」成仁、作師說「來」送他。
  explain: |
    判斷方法：「以」前面是作為、後面是目的，可以換成「來、用來」。
    (A) 用牆圍住庭院，用來遮擋（迎著）南面的日光 → 目的 ✓（全國 47% 漏選）
    (C) 犧牲生命來成全仁德 → 目的 ✓（全國 58% 漏選）
    (E) 寫〈師說〉來送給李蟠 → 目的 ✓（全國 32% 漏選）
    (B) 「託臣以討賊興復之效」的「以」是「把」：把討賊興復的任務交給我（全國 73% 誤選）✗
    (D) 「挾飛仙以遨遊」是挾著飛仙遨遊，「以」連接動作的方式，不表目的（全國 59% 誤選）✗
chn111-09:
  key: 「媜」从女从貞，作者說「自字面推想……寓意品德貞潔女子」；讀音如「爭」，不是「真」。
  explain: |
    (C) 「《康熙字典》收有『媜』字，自字面推想，从女从貞，寓意品德貞潔女子」✓
    (A) 「媜」讀音如「爭」非「真」，和「楨」「嫃」讀音不同 ✗
    (B) 甲骨文字形像寶鼎加上神杖、表示占卜的是「貞」字；「善占卜的女巫」是作者自己的聯想 ✗
    (D) 「媜」字的意思是「女字」（女子名字）；「寫得一手好字」是由張佛千對聯「女子美字」衍生的意思 ✗
chn111-10:
  key: 作者小學四年級以前寫「楨」，之後才改寫「嫃」，所以「上高中前一直寫嫃」不對。
  explain: |
    這題選「最不符合」的。
    (A) 高中入學被大嬸譏笑，「此生第一次翻看戶口名簿，果然是『媜』」→ 符合（全國 15% 誤選）
    (B) 小學四年級以前寫「楨」，導師要她改成「嫃」之後才一直寫「嫃」→ 不是上高中前一直寫「嫃」→ 不符合 ✓
    (C) 字寫錯，讀音也錯：「媜」讀音如「爭」非「真」→ 符合（全國 13% 誤選）
    (D) 「从女从貞，寓意品德貞潔女子，然我更愛這麼想：一個善占卜的女巫」→ 符合（全國 11% 誤選）
chn111-11:
  key: ①一位大嬸、③一口寶鼎、④一桿稱仔都等於「一個……」，後面的名詞都可以一個一個數。
  explain: |
    數詞和名詞之間的「位、手、口、桿、船、碟」都是量詞。
    (B) ①③④可以換成「個」：一個大嬸、一個寶鼎、一個稱仔，大嬸、寶鼎、稱仔都是可數名詞 ✓
    (A) 「位」是對人的敬稱，「手」表示技藝，都沒有描寫大嬸、好字的外形（全國 15% 誤選）✗
    (C) 一般量詞和名詞之間不能加「的」（不說「一位的大嬸」「一口的寶鼎」）；能加「的」的是借容器當量詞的⑤「一船的星輝」、⑥「一碟的茴香豆」✗
    (D) 數詞和名詞之間通常要有量詞，「一大嬸」「一寶鼎」不通順；「一船星輝」少了「船」，也失去滿船星光的意思 ✗

# ---------- Day 24：量詞分類、周處除三害 ----------
chn115-14:
  key: 類、乘（車）、載（年）是計算人事物、時間的單位 → 名量詞；番、巡是動作的次數 → 動量詞。
  explain: |
    ① 一「類」：事物的類別 → 名量詞
    ② 車五十「乘」：車的數量 → 名量詞
    ③ 打量一「番」：打量這個動作的次數 → 動量詞
    ④ 環飲十數「巡」：飲酒的輪次 → 動量詞
    ⑤ 三二十「載」：年，時間單位，像表中的「星期、小時」→ 名量詞（準量詞）
    (B) 名量詞①②⑤；動量詞③④ ✓
    (A) ⑤「載」是年數，不是動作的次數（全國 24% 誤選）✗
chn115-15:
  key: 「一腔熱血」「一身傲骨」的「一」是滿、全，但「一床棉被」「一葉扁舟」的「一」就是一個 → A 說得太絕對。
  explain: |
    這題選「不適當」的。
    (A) 一腔、一身的「一」有「滿、全」的意思，但一床棉被、一葉扁舟的「一」只是數量 → 不適當 ✓
    (B) 看一眼、踢兩腳、切五刀：是動作次數，也表示動作憑藉的眼、腳、刀 → 適當（全國 9% 誤選）
    (C) 腔、身、床、葉、眼、腳、刀、口原本都是名詞，和數詞結合才成為量詞 → 適當（全國 25% 誤選）
    (D) 「一葉扁舟」「一腔熱血」都比用「個、艘」更有畫面感 → 適當（全國 17% 誤選）
chn113-13:
  key: 丙前問「同一件事，何以在記述上各有其偏重之處？」→ 丙要填答案：民間口傳、各記見聞，彼此不同很平常。
  explain: |
    (C) 填入丙：前一句提問兩書為什麼記述不同，這句正好回答「蓋由民間口傳，各記見聞，彼此歧異，故是尋常事」✓
    (A) 甲後面接「如孔約《志怪》云」舉例，甲要填的是「有軼聞流傳」的概括說法，不是解釋記述為何不同（全國 28% 誤選）✗
    (B) 乙後面才接著問「兩書……時間相近……何以各有其偏重」，答案要放在問題之後 ✗
    (D) 丁之後在總結《世說新語》固定了情節單元，和記述歧異無關 ✗
chn113-14:
  key: 《世說新語》加入「殺虎」是讓「三橫」都被處理、傳說更完整；重點在周處聽到里人相慶後悔悟，不是渲染殺虎來凸顯兇彊。
  explain: |
    這題選「不適當」的。
    (A) 孔約只說義興有三害，周處是其中之一，沒提到他改過 → 適當（全國 15% 誤選）
    (B) 祖台之只寫周處在橋邊伺機斬蛟，「流血滿溪」等描寫比孔約生動 → 適當
    (C) 《世說新語》增加殺虎，是結合「三害」與「斬蛟」，「使傳說更為完整」；不是渲染殺虎來顯示他兇彊 → 不適當 ✓
    (D) 周處「聞里人相慶，始知為人情所患，有自改意」→ 突出悔悟自新的轉折 → 適當（全國 11% 誤選）
chn113-15:
  key: 電影把蛟、虎換成排名在他前面的兩大通緝犯（他自己是第三害），又說真正困住他的是貪嗔痴 → 模仿三害概念並創造新義。
  explain: |
    (D) 陳桂林追殺「排名在他之前的二大通緝要犯」，自己也是通緝犯 → 對應三害；結尾說困住他的是「內心的貪、嗔、痴」→ 新的意義 ✓
    (A) 他的動機是「不希望自己死後被別人遺忘」，不是為民除害（全國 10% 誤選）✗
    (B) 結局是投案自首、接受槍決，不是改過後奮發向上 ✗
    (C) 醫師勸的是「自首」，不是勸他為人間除惡 ✗

# ---------- Day 25：孟子與論語：人禽之辨、畏大人 ----------
chn110-18:
  key: 乙文說禽獸也知「庶物」、有「倫類」、有所愛、會求所宜，只是不明、不察、不能行仁義 → 禽獸也有認知能力與情感好惡。
  explain: |
    乙文逐句解釋甲文：禽獸「亦未嘗不知庶物，只是不明；亦未嘗不有倫類，只是不察；未嘗不有所愛，而不能行仁；未嘗不求所宜，而不能行義」。
    (B) 禽獸知道外在事物（認知能力），也有所愛、有所求（情感與好惡）✓
    (A) 乙文說「凡事之異無多」「俱差不遠」，人禽的差別很小，不是很大 ✗
    (C) 乙文的「稍一差錯，則墮入彼中」是指沒有守住那一點點差異（明、察、行仁義）；選項說只要稍有過錯就墮入禽獸，把一般過失都等同失去人性，說得太絕對（全國 31% 誤選）✗
    (D) 禽獸「有所愛」「求所宜」，但乙文沒說禽獸有仁義之心；「不能行仁、不能行義」也不是說缺乏意志和智力（全國 44% 誤選）✗
chn110-19:
  key: 君子「存之」＝存其所以異於禽獸者，要「戰兢惕厲」思求其所以異 → 嚴別差異，彰顯人道。
  explain: |
    甲文說「庶民去之，君子存之」；乙文解釋「存之」是「存其所以異者」，也就是人道，並要時時「戰兢惕厲」思考人和禽獸不同在哪裡。
    (A) 嚴別人禽之異，彰顯人道的尊嚴 ✓
    (B) 君子要保存的是「異」，不是「存同去異」（全國 21% 誤選）✗
    (C) 重點在辨明差異，不是異中求同（全國 22% 誤選）✗
    (D) 乙文以人道為本位，沒有主張萬物平等（全國 20% 誤選）✗
chn111-23:
  key: 朱熹說「纔知得（天命），便自不容不畏」→ 知道天命就一定會敬畏，不是「可知所以不必畏」。
  explain: |
    這題選「不符合」的。
    (A) 「理會得道理，便謹去做……如非禮勿視聽言動……皆所以畏天命也」→ 符合
    (B) 「小人不知天命，而不畏也」→ 符合（全國 17% 誤選）
    (C) 朱熹說「纔知得，便自不容不畏」：知道了天命就不能不敬畏；選項說天命可知就不必畏，意思相反 → 不符合 ✓
    (D) 小人不畏天命，因而「狎大人」（輕慢有位、有齒、有德的人）→ 符合（全國 22% 誤選）
chn111-24:
  key: 孟子藐視的是大人「堂高數仞」「食前方丈」那些崇高富貴；楊素「奢貴自奉」「踞床而見」公卿，正是倚恃富貴的大人。
  explain: |
    朱熹說孟子所藐的不是大人本身，而是「他許多『堂高數仞，榱題數尺』之類」，也就是大人的奢華排場與富貴氣勢。
    (D) 楊素生活奢華、禮數超過人臣，公卿來見也坐在床上接見 → 倚仗富貴、氣勢逼人 ✓
    (A) 鄭文公的過失是對晉無禮、又依附楚國，屬於外交問題 ✗
    (B) 項羽按劍而跽，是警戒闖入的樊噲（全國 11% 誤選）✗
    (C) 劉備感嘆桓帝、靈帝亂政，表現的是憂國之心（全國 14% 誤選）✗
chn111-25:
  key: 孟子說「在我者，皆古之制也」，所藐的是違背古制的奢華；合於古制的大人不會被藐，朱熹也說「大人固當畏」。
  explain: |
    (C) 孟子藐的是「堂高數仞」等奢華，他自己遵行的是古制；朱熹說「大人固當畏」→ 合於古制的大人正是孔子所畏 ✓
    (A) 朱熹說「大人」是「有位、有齒、有德者」，小人狎侮的正是這樣的大人，不是只有高位、沒有德行的人（全國 19% 誤選）✗
    (B) 因果顛倒：小人是「不知天命，而不畏也」，所以才狎大人、侮聖人之言（全國 18% 誤選）✗
    (D) 「我得志，弗為也」是說自己得志也不會這樣奢華，不是無意於大人之位 ✗

# ---------- Day 26：推敲的學問、鳥會說話嗎 ----------
chn110-26:
  key: 朱光潛認為「推」可以無聲，和上句「鳥宿池邊樹」的冷寂比較調和；「敲」會驚起宿鳥。
  explain: |
    (B) 「就上句『鳥宿池邊樹』看來，『推』似乎比『敲』要調和些」：推可以無聲，敲則剝啄有聲、打破岑寂 ✓
    (A) 文中說「推」顯出僧人自有胸襟氣度，但懷疑的理由是與全詩是否調和，不是胸襟 ✗
    (C) 敲門聲驚起的是宿鳥、打破的是夜的岑寂，不是寺內的莊嚴氣氛（全國 18% 誤選）✗
    (D) 「推」表示孤僧步月歸寺；「乘月夜訪友」是「敲」的意境 ✗
chn110-27:
  key: 王夫之：詩人「即景會心」，依當下真實的景與情來寫，推或敲自然只有一個，不必苦苦擬議。
  explain: |
    王夫之批評賈島「沉吟推敲二字，就他作想」，像在「說他人夢」；如果是「即景會心」，當時是推是敲，本來就只有一種。
    (D) 賈島依真實經驗寫出當時的景物與情感，就知道該用哪個字 ✓
    (A) 王夫之談的是詩人自己的即景會心，不是韓愈有沒有類似經驗 ✗
    (B) 「從全詩調和的情境考慮」是朱光潛的看法，不是王夫之（全國 22% 誤選）✗
    (C) 王夫之反對「措大燈窗下鑽故紙」，不主張從前人佳作鍛鍊字句 ✗
chn110-28:
  key: 「首重全詩情調一致」只是朱光潛的看法；王夫之認為佳句來自即景會心，不在文字上擬議。
  explain: |
    這題選「最不適當」的。
    (A) 朱光潛說「更動了文字，就同時更動了思想情感」→ 適當
    (B) 王夫之說推敲「縱令形容酷似，何嘗毫髮關心」→ 文辭再巧，也不是出自真實情感 → 適當（全國 23% 誤選）
    (C) 朱光潛懷疑韓愈的修改；王夫之只說即景會心自然知道，沒有評判推、敲高下 → 適當（全國 21% 誤選）
    (D) 王夫之認為佳句是「因景因情，自然靈妙」，不靠推敲；「與全詩調和」是朱光潛的主張，不是兩人共同的看法 → 最不適當 ✓
chn110-29:
  key: 知更鳥的高、低頻轉換只表達感受程度；牠的創造力在於「用不同方式做相同訊息的鳴叫」。
  explain: |
    (D) 「知更鳥的創造力，在於能用不同方式做相同訊息的鳴叫」✓
    (A) 「這些鳥叫聲看不出任何內在的結構」✗
    (B) 短叫聲是「鳥語」，傳達危險、餵食等環境訊息；表達擁有慾、決心強弱的是知更鳥宣示勢力範圍的鳴聲 ✗
    (C) 知更鳥「不能利用各種單位作不同組合，表達不同訊息」✗
chn110-30:
  key: 人類語言的單位彼此獨立，可以重新排序、合併、分開 → 差別在語法結構，不在有沒有語音。
  explain: |
    (C) 人類語言的特質是「單位之間有次序，可重新排序，可合併也可分開」，動物的叫聲做不到 ✓
    (A) 「鸚鵡只會說人家教牠或牠所聽到的，再無其他」✗
    (B) 「動物的溝通系統和人類語言的不同，絕非在於缺少語音」✗
    (D) 人能用手語溝通，可知「語音並非語言的必要因素」✗

# ---------- Day 27：白話閱讀：哈士奇與狼、族語認證 ----------
chn110-20:
  key: 林志玲演講價碼高，是因為「她是誰」（to be）→ 人才形成品牌，就難用一般標準衡量價值。
  explain: |
    (B) 「to be（你是誰）」的價值比「to do（做的內容）」高很多：企業請林志玲演講，不是因為簡報精美或內容有用，而是因為演講者是她 ✓
    (A) 文中只說狼懂得購買別人的時間，沒說創業家不需要專業經理人的學養 ✗
    (C) 出售時間是哈士奇自己的獲利模式，不是被狼的侵略性逼迫 ✗
    (D) 文中說出走的頂尖土狗會變成狼，沒說哈士奇熬得久就成為狼 ✗
chn110-21:
  key: 李斯是被驅逐的客卿，上書勸秦王別逐客，不是想出走 → 甲錯；虬髯自己打天下（狼），勸李靖輔佐英主、竭心盡善（哈士奇）→ 乙對。
  explain: |
    甲：〈諫逐客書〉是秦王要驅逐客卿，李斯上書說逐客等於資助敵國、讓秦國陷入危險；李斯並沒有因為價值被低估而想出走 → 錯誤
    乙：虬髯本想「於此世界求事」自己建立功業（狼，時間屬於自己）；見到李世民是真英主，便期許李靖「輔清平之主，竭心盡善，必極人臣」，也就是成為優秀的專業經理人（哈士奇）→ 正確
    (D) 甲錯誤，乙正確 ✓
    (B) 乙的推論是合理的（全國 20% 誤選）✗
chn110-22:
  key: 「雖然只是在七樓」→ 後句要和「高度」形成對比：族人齊聚，彷彿瀰漫高山森林的芬多精。
  explain: |
    空格前是「雖然只是在七樓」，「雖然」要接一個轉折：樓層不高，卻有高山的氣息 → 和族人（作者的族名 Ciwas 是泰雅語）來自山林的背景呼應。
    (D) 「高海拔的芬多精」和「只是在七樓」形成對比 ✓
    (C) 篝火的氣味和「七樓」的高度無關，接不上「雖然」的轉折（全國 15% 誤選）✗
    (A)(B) 原野、海洋都和「七樓」的高度無關 ✗
chn110-23:
  key: 「不是我的家」是因為別人總把她當原住民、不承認她是臺北人，不是她無法接受臺北。
  explain: |
    這題選「最不適當」的。
    (A) 「我是否在正確的位置？」「我卻是整個歷史洪流中的盲點」→ 對身分歸屬的叩問 → 適當
    (B) 別人一再追問「妳──真正──從哪裡來」，不接受她來自臺北 → 被刻板印象貼上標籤 → 適當
    (C) Ciwas 是「真正」的名字，卻「真正沒人稱呼」→ 語帶無奈與自嘲 → 適當（全國 12% 誤選）
    (D) 首段說臺北「不是我的家」，是因為「比起臺北人，他們更喜歡叫我原住民」；文中沒有說她無法接受繁華都城 → 最不適當 ✓
chn110-41:
  key: 背景知識像篩網、像架構，讓新知識不流失、找到位置而有意義；大師的記憶力並沒有比較好。
  explain: |
    (C) 網越細密，新知識越不會流失；有了架子，新知識才知道往哪兒放 → 影響接受與理解新知識 ✓
    (D) 基模把新知識放在適當位置，組合成有意義的東西 ✓
    (A) 實驗證明大師的記憶力沒有比較好，是「意義度減輕了記憶的負擔」，不是增強記憶力或讓知覺更敏銳（全國 33% 誤選）✗
    (B) 大師和生手的差別在於有沒有西洋棋的背景知識，文中沒說要「多種類」的背景知識（全國 54% 誤選）✗
    (E) 基模會主動搜尋「已存的」有用資訊，不是向外搜尋資料（全國 41% 誤選）✗

# ---------- Day 28：女性創作：〈畫菊自序〉與呂碧城 ----------
chn111-14:
  key: 「莫自知其鳩拙」是謙稱畫藝拙劣；她期望畫作「四座流芬」「千人共仰」，並不是不在意評價。
  explain: |
    這題選「最不可能」的。
    (A) 文末希望畫作「庶幾秋姿不老，四座流芬，得比勁節長垂，千人共仰」，可見她在意畫作的評價；「莫自知其鳩拙」是自謙，不是不在意任何評論 → 最不可能 ✓
    (B) 開頭說學琴學詩「均從所好」，李白、蔡琰都是「有志竟成」→ 有志於繪畫就努力去做，不必在意拙不拙 → 可能（全國 13% 誤選）
    (C) 只能在「停機教子之餘，調藥助夫之暇」作畫，所以謙稱技巧拙劣 → 可能（全國 14% 誤選）
    (D) 「竟率意而鴉塗」謙稱隨意塗抹，又「竊慕」管夫人、「敢藉」陶淵明的菊花，可見創作的欲望很強 → 可能（全國 25% 誤選）
chn111-15:
  key: 男性作家溫、李、周、柳都以柔豔見長，女子寫自己的本色又何妨；只要格律雋雅、情性真切就是佳作。
  explain: |
    (D) 乙文認為女子作品「裁紅刻翠，寫怨言情」不必被譏笑，只要「情性真切」就是佳作 ✓
    (A) 乙文說「尤貴格律雋雅」，重視格律，不是拋棄格律（全國 13% 誤選）✗
    (B) 「各如其分」是說抒寫性情要合乎各人的本分；乙文沒說詞章要以閨人口吻為本色（全國 18% 誤選）✗
    (C) 舉溫、李、周、柳是要說明「男子且然」，柔豔不只是女子的毛病，不是要女子模仿他們 ✗
chn111-16:
  key: 甲文「志有萬端之異」是說每個人志趣不同，乙文「情性真切」是好作品的標準，兩者都不是從性別論證。
  explain: |
    這題選「最不適當」的。
    (A) 「停機教子之餘，調藥助夫之暇」：先盡相夫教子的本分，才利用空閒作畫 → 適當
    (B) 乙文說「女子寫其本色，亦復何妨」→ 不必以閨人口吻、柔豔為非 → 適當（全國 16% 誤選）
    (C) 甲文的「志有萬端之異」是說人人志趣不同，乙文的「情性真切」是評判作品的標準，都不是從性別角度立論 → 最不適當 ✓
    (D) 甲文舉李白、蔡琰、管夫人、陶淵明等前輩的成就；乙文舉以柔豔擅長的男性作家，說明柔豔不是女性專屬，更有破除性別刻板印象的意味 → 適當（全國 20% 誤選）
chn111-17:
  key: 「湘篁染淚」「無由見顏色」「託微波」寫相思難見、淚灑竹上，纏綿柔婉，最接近「柔豔」。
  explain: |
    乙文說溫、李、周、柳「皆以柔豔擅長」：寫男女情愛、相思怨別，詞藻柔美。
    (B) 書信斷絕、淚染湘竹（湘妃竹的典故），見不到對方的容顏，只能託水波傳情 → 纏綿的相思 ✓
    (A) 世俗機心消盡，衣著飄然，一室山月、滿瓶澗泉 → 隱逸閒適（全國 29% 誤選）✗
    (C) 雪中人蹤滅盡、乾坤空闊 → 寫遼闊清寂的雪景 ✗
    (D) 宦遊在外成了羈旅，萬水千山不知家鄉何處 → 羈旅鄉愁（全國 13% 誤選）✗
chn113-23:
  key: 柳宗元說門生不知感恩「非人也」，崔群把門生當良田 → 兩人的看法都反映當時的世俗意識。
  explain: |
    (D) 柳宗元的話是當時「社會意識」的代表；作者說崔群「對座主與門生關係，卻表露出相當世俗的看法」✓
    (A) 文中沒說韓愈知貢舉；只能從「君非陸相門生乎」知道陸贄曾是崔群的座主 ✗
    (B) 〈與顧十郎書〉只引了柳宗元的話，文中沒說他是在顧十郎知貢舉時及第 ✗
    (C) 韓愈只是稱讚崔群「言行而無瑕尤」，文中沒有說韓愈不認同他對座主門生的看法（全國 42% 誤選）✗
