# 數學B 第 1 週解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

mb115-01:
  key: '|N−95|/95×100%＜5% ⇔ |N−95|＜4.75，N＝91～99 共 9 個。'
  explain: |
    兩邊同乘 95：|N−95|＜95×5%＝4.75
    ⇒ −4.75＜N−95＜4.75 ⇒ 90.25＜N＜99.75
    整數 N＝91, 92, …, 99，共 9 個 → 答案 (4)
    提醒：|x−a|＜r 就是「x 到 a 的距離小於 r」。
mb115-02:
  key: '100e^(3n/100)＝135 ⇒ e^(3n/100)＝135/100 ⇒ 3n/100＝ln(135/100)。'
  explain: |
    兩邊除以 100：e^(3n/100)＝135/100
    兩邊取自然對數：3n/100＝ln(135/100)
    ⇒ n＝(100/3)·ln(135/100) → 答案 (5)
    易錯：(1)(2) 的 ln(135−100) 是錯的。對數把「除法」變成減法：ln(135/100)＝ln 135−ln 100，不是 ln(135−100)。
mb115-03:
  key: 'A 把 (1,1) 送到 (0,1)、把 (1,−1) 送到 (1,0)；反方陣反過來把 (0,1) 送回 (1,1)、(1,0) 送回 (1,−1)。'
  explain: |
    由 A(1,1)ᵀ＝(0,1)ᵀ 得 A⁻¹(0,1)ᵀ＝(1,1)ᵀ，也就是 A⁻¹ 的第 2 行是 (1,1)ᵀ。
    由 A(1,−1)ᵀ＝(1,0)ᵀ 得 A⁻¹(1,0)ᵀ＝(1,−1)ᵀ，也就是 A⁻¹ 的第 1 行是 (1,−1)ᵀ。
    所以 A⁻¹ 的第一列是 1, 1，第二列是 −1, 1 → 答案 (2)
    驗算：A＝(A⁻¹)⁻¹＝(1/2)[[1, −1], [1, 1]]，A(1,1)ᵀ＝(0,1)ᵀ、A(1,−1)ᵀ＝(1,0)ᵀ ✓
mb115-04:
  key: '北緯 60° 的緯線長度只有赤道的 cos60°＝1/2；兩船速率相同，甲走的經度差是乙的 2 倍。'
  explain: |
    甲從西經 169° 向西到東經 171°：先到 180° 經線走了 11°，再到東經 171° 又走 9°，共 20°。
    北緯 60° 緯線的半徑＝R cos60°＝R/2，所以這段經度 20° 的弧長，等於赤道上經度 10° 的弧長。
    兩船速率相同，同一段時間乙在赤道上向東走了經度 10°：東經 140°＋10°＝東經 150° → 答案 (3)
    易錯：直接用經度差 20° 算，會誤選 (4) 160 度。
mb115-05:
  key: '照規則算下去會發現：從第 3 次起，每兩次投注金額乘上 (3/2)(3/2)(1/2)＝9/8。'
  explain: |
    規則：預定金額＝前次×3/2，超過 2N 就再減半。
    第 5 次：預定 (3/2)(27/16)N＝81/32 N＞2N → 投注 81/64 N
    第 6 次：預定 (3/2)(81/64)N＝243/128 N≈1.90N≤2N → 投注 243/128 N
    第 7 次：預定 (3/2)(243/128)N＝729/256 N＞2N → 投注 729/512 N＝3⁶/2⁹ N → 答案 (3)
    規律檢查：第 3、5、7 次分別是 (9/8)N、(9/8)²N、(9/8)³N＝3⁶/2⁹ N。
mb115-06:
  key: '領海在基線外側（與 (5,5) 不同側），外緣是與 L 平行、距離 12 的直線 4x＋3y＋48＝0。'
  explain: |
    與 L 平行的直線寫成 4x＋3y＋c＝0，和 L 的距離＝|c＋12|÷√(4²＋3²)＝|c＋12|/5＝12
    ⇒ c＋12＝±60 ⇒ c＝48 或 c＝−72
    (5,5) 代入 4x＋3y−12 得 23＞0，所以內側是「4x＋3y−12＞0」那一側，領海在另一側。
    4x＋3y＋48＝0 上的點滿足 4x＋3y−12＝−60＜0，在外側 ✓ → 答案 (1)
    易錯：(5) 4x＋3y−72＝0 距離也是 12，但在內側（陸地那一邊）。
mb115-07:
  key: 'p＝P(B、C 至少一個中獎)＝5/6；q＝P(A 中且至少兩個中)÷P(至少兩個中)＝15/17。'
  explain: |
    p：已知 A 中獎，只要 B、C 至少一個中獎：p＝1−(1/3)(1/2)＝5/6
    至少兩個中獎的機率：
    　三個都中 (3/4)(2/3)(1/2)＝1/4；恰 A、B (3/4)(2/3)(1/2)＝1/4
    　恰 A、C (3/4)(1/3)(1/2)＝1/8；恰 B、C (1/4)(2/3)(1/2)＝1/12
    　合計 6/24＋6/24＋3/24＋2/24＝17/24
    A 中獎且至少兩個中獎＝(3/4)×(5/6)＝15/24，所以 q＝(15/24)÷(17/24)＝15/17
    p/q＝(5/6)÷(15/17)＝(5×17)/(6×15)＝17/18 → 答案 (2)
mb115-08:
  key: 'sin(θ＋π)＝−sin θ，原函數就是 y＝−3sin(πx/5)＋3；又 sin(θ−π)＝−sin θ。'
  explain: |
    y＝3sin(πx/5＋π)＋3＝−3sin(πx/5)＋3
    (1) 振幅變成 6 ✗
    (2) x 的係數變成 π/5＋2π，週期改變了 ✗（2π 要加在整個角度上，不能乘在 x 上）
    (3) 3sin(πx/5−π)＋3＝−3sin(πx/5)＋3 ✓
    (4) 常數項是 −3，整個圖形往下移了 6 ✗
    (5) 就是化簡後的式子 ✓
    → 答案 (3)(5)
mb115-09:
  key: 'f(x)＝[(1−x)(2−x)(4＋x)]·(2−x) 可整除；找 c 就令 t＝x−2 展開。'
  explain: |
    (1) f(x)＝[(1−x)(2−x)(4＋x)]·(2−x)，整除，餘式是 0 ✗
    (2) 令 t＝x−2：(1−x)(4＋x)＝(−1−t)(6＋t)＝−(t²＋7t＋6)
    　f＝t²·[−(t²＋7t＋6)]＝−t⁴−7t³−6t²，所以 c＝−6 ✓
    (3) (2−x)²≥0，f(x)＞0 ⇔ (1−x)(4＋x)＞0 且 x≠2 ⇔ −4＜x＜1，解區間是 (−4, 1) ✗
    (4) f(2026)＝(−2025)(2024)²(2030)，f(−2022)＝(2023)(2024)²(−2018)，兩者都是負數
    　f(2026)/f(−2022)＝(2025×2030)/(2023×2018)＞1 ✓
    (5) 由 (4)，兩者皆負且 |f(2026)|＞|f(−2022)|，所以 f(2026)＜f(−2022) ✗
    → 答案 (2)(4)
mb115-10:
  key: 'B＝0.5A：標準差乘 0.5、與 A 的相關係數是 1；迴歸直線一定通過兩個平均數 (65, 50)。'
  explain: |
    (1) A 的標準差＝√225＝15，B 的標準差＝0.5×15＝15/2 ✓
    (2) 身長的中位數無法推出 A 或 B 的中位數 ✗
    (3) B 是 A 的正數倍，兩者完全正相關，相關係數是 1，不是 0.5 ✗
    (4) A 對身長的迴歸直線通過 (65, 50)，所以身長 65 時預測 A 濃度＝50 ✓
    (5) 乘正數不改變相關係數，B 與身長的相關係數仍是 0.75；斜率＝0.75×(15/2)÷10＝9/16，不是 1/2 ✗
    → 答案 (1)(4)
mb115-11:
  key: '軸線相同、地面相同，截痕由「地面與軸線的夾角 β」和「圓錐半頂角 α」比大小決定；大燈罩的 α 較大。'
  explain: |
    設地面與軸線的夾角為 β、圓錐的半頂角為 α：β＞α → 橢圓；β＝α → 拋物線；β＜α → 雙曲線。
    兩燈罩軸線相同，β 相同；大燈罩照射範圍較大，所以 α大＞α小。
    (1) Γ 是橢圓：β＞α大＞α小，γ 也是橢圓 ✗
    (2) Γ 是拋物線：β＝α大＞α小，γ 是橢圓 ✓
    (3) Γ 是雙曲線：β＜α大，但 β 與 α小 的大小不確定，γ 不一定是拋物線 ✗
    (4) γ 是拋物線：β＝α小＜α大，Γ 是雙曲線 ✗
    (5) γ 是雙曲線：β＜α小＜α大，Γ 也是雙曲線 ✓
    → 答案 (2)(5)
mb115-12:
  key: '糖的總量永遠是 100 克；aₙ₊₁＝aₙ/2＋(1/2)(100−aₙ/2)＝aₙ/4＋50，會趨近 200/3。'
  explain: |
    一次稀釋：A 倒一半到 B，A 剩 aₙ/2；B 有 (100−aₙ)＋aₙ/2 克糖，混勻後倒一半回 A。
    (1) A 倒出後剩 50 克、B 有 50 克；B 倒一半（25 克）回 A → a₁＝75 ✓
    (2) 糖的總量不變，B 瓶含糖＝100−aₙ ✗（n＝1 時 B 有 25 克，但 50−75/2＝12.5）
    (3) aₙ₊₁＝aₙ/2＋(1/2)(100−aₙ＋aₙ/2)＝(1/2)aₙ＋(1/2)(100−(1/2)aₙ) ✓
    (4) 化簡得 aₙ₊₁＝aₙ/4＋50。取 c＝200/3（c＝c/4＋50 的解），則 aₙ₊₁−c＝(1/4)(aₙ−c)，公比 1/4 ✓
    (5) aₙ＝200/3＋(100/3)(1/4)ⁿ＞200/3≈66.7，不會小於 60 ✗
    → 答案 (1)(3)(4)
mb115-13:
  key: '看三角形 A(−20,0)、O、交點 P：∠A＝30°、∠AOP＝105°、∠P＝45°，用正弦定理。'
  explain: |
    設 A(−20, 0)，P 為兩線的交點。
    ∠PAO＝30°（L₂ 的斜角）；∠AOP＝180°−75°＝105°；∠APO＝180°−30°−105°＝45°
    正弦定理：OP/sin30°＝AO/sin45° ⇒ OP＝20×(1/2)÷(√2/2)＝10√2≈14.14
    四捨五入到整數是 14 → 答案 14
mb115-14:
  key: '5、6、7 必須排成 567 或 765，3、4 綁成一塊，再和 1、2 共 4 個單位排列。'
  explain: |
    6 要同時和 5、7 相鄰，所以 5、6、7 連成一塊且 6 在中間：567 或 765，2 種。
    3、4 相鄰：34 或 43，2 種。
    「567 塊」「34 塊」、1、2 共 4 個單位排列：4!＝24
    共 24×2×2＝96 → 答案 96
mb115-15:
  key: '設「有近視且有蛀牙」的比例為 x，則 p＝1/6＋x；兩個條件給出 1/6＜x＜1/4。'
  explain: |
    設有近視且有蛀牙占 x，填列聯表：
    　有近視、無蛀牙＝1/2−x；無近視、有蛀牙＝1/3−x；無近視、無蛀牙 p＝1/2−(1/3−x)＝1/6＋x
    「有近視的學生中，有蛀牙的占少數」：x÷(1/2)＜1/2 ⇒ x＜1/4
    「有蛀牙的學生中，有近視的占多數」：x÷(1/3)＞1/2 ⇒ x＞1/6
    所以 1/6＜x＜1/4 ⇒ 1/3＜p＜5/12 → 答案 1/3＜p＜5/12
mb115-16:
  key: 'g(x)−f(x) 是二次函數，在 x＝1、5 都等於 0，所以 g(x)−f(x)＝k(x−1)(x−5)。'
  explain: |
    L 過 (1,0)、(5,4)：f(x)＝x−1
    L 與 Γ 交於 x＝1、5，所以 g(x)−f(x)＝k(x−1)(x−5)
    (2,2) 在 Γ 上：g(2)−f(2)＝2−1＝1＝k(1)(−3) ⇒ k＝−1/3
    g(x)−f(x)＝−(1/3)(x−1)(x−5)，開口向下，x＝3 時有最大值 −(1/3)(2)(−2)＝4/3 → 答案 4/3
mb114-01:
  key: '1 和 4 相距 3＜4，P 只能在兩點外側，左右各一個：P＝1/2 或 9/2。'
  explain: |
    P 在 1 與 4 之間時，距離和恆為 3，不可能等於 4。
    P 在 1 的左邊：(1−P)＋(4−P)＝4 ⇒ P＝1/2
    P 在 4 的右邊：(P−1)＋(P−4)＝4 ⇒ P＝9/2
    共 2 個 → 答案 (3)
mb114-02:
  key: '右乘 [[1,0],[−1,1]]：第 1 行＝A 的第 1 行−第 2 行，第 2 行＝A 的第 2 行。'
  explain: |
    設 A 的兩個行向量為 c₁、c₂。
    　第 1 行：A(1,−1)ᵀ＝c₁−c₂＝(4,−2,3)ᵀ
    　第 2 行：A(0,1)ᵀ＝c₂＝(−6,1,5)ᵀ
    ⇒ c₁＝(4,−2,3)ᵀ＋(−6,1,5)ᵀ＝(−2,−1,8)ᵀ
    A(1,0)ᵀ＝c₁，所以 (a,b,c)＝(−2,−1,8)，a＋b＋c＝5 → 答案 (4)
mb114-03:
  key: 'log a＜0，而 log(a²)＝2log a 比 log a 更小；log b 與 1/log b 都是正數。'
  explain: |
    1/2＜a＜1 ⇒ log a＜0，且 log(a²)＝2log a＜log a＜0
    1＜b＜2 ⇒ 0＜log b＜log 2≈0.301，1/log b＞3
    最小的是 log(a²) → 答案 (3)
mb114-04:
  key: '選 3 種款式 C(4,3)，其中 1 種抽到 2 次（3 種選法），四次的順序 4!/2!＝12。'
  explain: |
    恰抽到三種款式 ⇒ 四次中有一種款式出現 2 次，另外兩種各 1 次。
    選哪三種：C(4,3)＝4；哪一種出現 2 次：3；四次的順序：4!/2!＝12
    機率＝4×3×12÷4⁴＝144/256＝9/16 → 答案 (4)
mb114-05:
  key: '平面與圓錐的軸平行，夾角 0° 小於半頂角 24°，截痕是雙曲線。'
  explain: |
    M 繞 L 轉一圈，得到以 L 為軸、半頂角 24° 的直圓錐面（上下兩片）。
    平面與軸的夾角 β 決定截痕：β＞半頂角 → 橢圓（β＝90° 時是圓）；β＝半頂角 → 拋物線；β＜半頂角 → 雙曲線。
    E 與 L 平行，β＝0°＜24°，且 E 不過頂點，會同時切到上下兩片 → 雙曲線 → 答案 (1)
mb114-06:
  key: '分別代 x＝4、3、1，每次只剩一項，直接解出 a、b、c。'
  explain: |
    代 x＝4：a(3)(1)＝16 ⇒ a＝16/3
    代 x＝3：b(2)(−1)＝9 ⇒ b＝−9/2
    代 x＝1：c(−2)(−3)＝1 ⇒ c＝1/6
    16/3＞1/6＞−9/2 ⇒ a＞c＞b → 答案 (2)
mb114-07:
  key: '柱子離得越遠，畫出來的柱高和「柱底到地平線的距離」按相同比例縮小；兩者的比值越大，實際越高。'
  explain: |
    地平線是 y＝9。實際高度與「畫面柱高 ÷ (9−柱底的 y 坐標)」成正比：
    　A：2÷3≈0.67　B：3÷9≈0.33　C：3÷6＝0.5　D：3÷4＝0.75　E：4÷8＝0.5　F：2÷3≈0.67
    A、F 的比值相同，和題目說「兩柱實際高度相等」一致。
    比值最大的是 D → 答案 (4)
mb114-08:
  key: 'y＝x³−x 是奇函數；x 在 0 附近時 x³ 小到可以忽略，圖形接近 y＝−x。'
  explain: |
    (1) f(−x)＝−f(x)，圖形對稱於原點 ✓
    (2) x 在 0 附近，x³ 遠小於 x，y≈−x，不是 y＝x ✗
    (3) 平移後是 (x−h)³−(x−h)＋k，要讓 x² 項消失必須 h＝0，此時 x 項係數仍是 −1，不可能變成 x³＋x＋3 ✗
    (4) 對稱於 x 軸的圖形是 y＝−(x³−x)＝−x³＋x，不是 x³＋x ✗
    (5) 對稱於 y 軸：把 x 換成 −x，得 y＝(−x)³−(−x)＝−x³＋x ✓
    → 答案 (1)(5)
mb114-09:
  key: '逐一解出 α、β，兩個都在 0 到 1 之間的才可能。'
  explain: |
    (2,2)＝α·A＋β·B，逐一解聯立：
    (1) 2α−4β＝2、−3α＋3β＝2 ⇒ β＝−5/3 ✗
    (2) 3α＋3β＝2、2α＋4β＝2 ⇒ α＝β＝1/3 ✓
    (3) 3α＋4β＝2、4α−β＝2 ⇒ α＝10/19、β＝2/19 ✓
    (4) α＋2β＝2、2α＋β＝2 ⇒ α＝β＝2/3 ✓
    (5) α＋β＝2、−α＋β＝2 ⇒ α＝0、β＝2 ✗（β＞1）
    → 答案 (2)(3)(4)
mb114-10:
  key: '總用時＝次數×平均；只知道標準差無法判斷全距，但若每次都在 1.4～1.6 秒，標準差不會超過 0.1。'
  explain: |
    (1) 丙的平均 1.7 秒最大 ✓
    (2) 總用時：甲 25×1.2＝30、乙 14×1.5＝21、丙 20×1.7＝34、丁 30×1.2＝36，丁最多 ✓
    (3) 平均相同不代表每一次都相同 ✗
    (4) 只知道標準差，無法判斷全距的大小 ✗
    (5) 乙的平均是 1.5 秒；若每次都在 1.4～1.6 秒，每個離差都不超過 0.1，標準差≤0.1，與 0.3 矛盾，所以不可能 ✓
    → 答案 (1)(2)(5)
mb114-11:
  key: '經度 0° 與 180° 的經線合起來是一個通過南北極的大圓，A、B、C、D、E 都在這個大圓上。'
  explain: |
    用「圓心角」比較最短路徑長（半徑相同）：
    (1) 北極到 A、到 B 都是 90°−60°＝30° ✓
    (2) A 到 B 經過北極：30°＋30°＝60°；C 到 D：60°＋60°＝120°，不相等 ✗
    (3) A、C、E 都在經度 0° 的經線上，A（北緯 60°）到 E（赤道）的最短路徑經過 C（北緯 30°）✓
    (4) C 到 D 經過北極的弧是 120°，經過南極的弧是 240°，最短路徑經過北極 ✓
    (5) E 到北極 90°，C 到 D 120°，比為 3：4，不是 2：3 ✗
    → 答案 (1)(3)(4)
mb114-12:
  key: '9＝1＋kd ⇒ d＝8/k；81＝1＋(n−1)d ⇒ n＝10k＋1（k＝1～9）。'
  explain: |
    設公差 d，9 是第 k＋1 項：kd＝8 ⇒ d＝8/k（k 為正整數）
    末項 81：(n−1)d＝80 ⇒ n−1＝10k ⇒ n＝10k＋1；n≤100 ⇒ k＝1, 2, …, 9
    (1) n＝10k＋1 必為奇數 ✓
    (2) 41＝1＋jd ⇒ j＝40÷(8/k)＝5k，是正整數且不超過 10k，41 一定在數列中 ✓
    (3) k＝3 時 d＝8/3，不是整數 ✗
    (4) k 有 9 種，共 9 個數列，不是 10 個 ✗
    (5) n∈{11, 21, …, 91}，7 的倍數有 21 和 91（＝7×13），n 不一定是 21 ✗
    → 答案 (1)(2)
mb114-13:
  key: '至少一個有空位＝1−兩個都沒空位＝1−0.7²。'
  explain: |
    兩個停車場都沒有空位的機率＝0.7×0.7＝0.49
    至少一個有空位的機率＝1−0.49＝0.51 → 答案 0.51
mb114-14:
  key: '△ABC 面積 5，左邊 △OAB 只有 1，所以直線要交 AC 於 Q，使 △OQC 的面積是 2.5。'
  explain: |
    △ABC 面積＝(1/2)×5×2＝5，一半是 2.5；原點 O 在 BC 上。
    △OAB 面積＝(1/2)×1×2＝1＜2.5，所以直線 y＝mx 與 AC 相交，設交點為 Q。
    △OQC 面積＝(1/2)×4×(Q 的 y 坐標)＝2.5 ⇒ Q 的 y 坐標＝5/4
    AC：y＝2−x/2，代入 y＝5/4 得 x＝3/2
    m＝(5/4)÷(3/2)＝5/6 → 答案 5/6
mb114-15:
  key: '兩名翻譯各去一個部門（2 種）；研發再從 6 人選 3 人，扣掉有部門沒有工程師的 2 種：C(6,3)−2＝18。'
  explain: |
    兩個部門各需 1 名翻譯：2 名翻譯各去一個部門，2 種。
    研發部門還要 3 人，從 3 名工程師、3 名助理中選：C(6,3)＝20 種，剩下 3 人到測試部門。
    扣掉「研發 3 人全是助理」（研發沒有工程師）和「研發 3 人全是工程師」（測試沒有工程師），剩 18 種。
    共 2×18＝36 → 答案 36
mb114-16:
  key: '牆角當原點、三條交界線當坐標軸：A(20,0,0)、B(0,20,0)、C(0,0,10)。'
  explain: |
    取 O 為原點，A、B 在牆面與地面的交界線上，C 在兩牆面的交界線上：A(20,0,0)、B(0,20,0)、C(0,0,10)
    向量 AB＝(−20,20,0)，長 20√2；向量 AC＝(−20,0,10)，長 10√5；內積＝400
    cos∠CAB＝400÷(20√2×10√5)＝2/√10，sin∠CAB＝√(1−4/10)＝√6/√10
    tan∠CAB＝√6/2 → 答案 √6/2
mb114-17:
  key: '紅、綠同時暗的時段是每 24 秒中的 [15,16)，這時藍燈一定要亮。'
  explain: |
    紅燈週期 6 秒，每週期的第 3～4 秒暗；綠燈週期 8 秒，每週期的第 6～8 秒暗。
    0～24 秒內：紅燈暗 [3,4)、[9,10)、[15,16)、[21,22)；綠燈暗 [6,8)、[14,16)、[22,24)
    兩者同時暗只有 [15,16)，之後每 24 秒重複一次。
    藍燈週期 15 秒，每週期的 [0, k) 亮。15＋24c 除以 15 的餘數依序是 0, 9, 3, 12, 6（之後循環）。
    最晚的一段是 [12,13)，要亮著需 k≥13；k＝13 時其他時段也都亮著 → 答案 13
mb113-01:
  key: '210×90%＝189 是整數，第 90 百分位數＝第 189 與第 190 個數的平均。'
  explain: |
    由小到大排列，持有 1～m 顆的總人數＝1＋2＋…＋m＝m(m＋1)/2
    m＝18 時 171 人、m＝19 時 190 人 ⇒ 第 172～190 人都持有 19 顆
    210×90/100＝189 是整數 ⇒ 第 90 百分位數＝(第 189 個＋第 190 個)÷2＝(19＋19)÷2＝19 → 答案 (4)
mb113-02:
  key: '1＜a＜10 ⇒ 0＜log a＜1，所以 b 在 0 與 1 之間，c＝log b＜0。'
  explain: |
    1＜a＜10 ⇒ log 1＜log a＜log 10 ⇒ 0＜b＜1
    0＜b＜1 ⇒ c＝log b＜0
    所以 c＜0＜b＜1 → 答案 (1)
