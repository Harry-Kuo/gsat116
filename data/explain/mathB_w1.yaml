# 數學B 第 1 週解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

mb115-01:
  key: $\dfrac{|N-95|}{95}\times100\% <5\%$ ⇔ $|N-95|<4.75$，$N=91\sim99$ 共 9 個。
  explain: |
    兩邊同乘 95：$|N-95|<95\times5\% =4.75$
    ⇒ $-4.75<N-95<4.75$ ⇒ $90.25<N<99.75$
    整數 $N=91,92,\ldots,99$，共 9 個 → 答案 (4)
    提醒：$|x-a|<r$ 就是「x 到 a 的距離小於 r」。
mb115-02:
  key: $100e^{3n/100}=135$ ⇒ $e^{3n/100}=\dfrac{135}{100}$ ⇒ $\dfrac{3n}{100}=\ln\left(\dfrac{135}{100}\right)$。
  explain: |
    兩邊除以 100：$e^{3n/100}=\dfrac{135}{100}$
    兩邊取自然對數：$\dfrac{3n}{100}=\ln\left(\dfrac{135}{100}\right)$
    ⇒ $n=\dfrac{100}{3}\cdot\ln\left(\dfrac{135}{100}\right)$ → 答案 (5)
    易錯：(1)(2) 的 $\ln(135-100)$ 是錯的。對數把「除法」變成減法：$\ln\left(\dfrac{135}{100}\right)=\ln135-\ln100$，不是 $\ln(135-100)$。
mb115-03:
  key: A 把 $(1,1)$ 送到 $(0,1)$、把 $(1,-1)$ 送到 $(1,0)$；反方陣反過來把 $(0,1)$ 送回 $(1,1)$、$(1,0)$ 送回 $(1,-1)$。
  explain: |
    由 $A(1,1)^T=(0,1)^T$ 得 $A^{-1}(0,1)^T=(1,1)^T$，也就是 $A^{-1}$ 的第 2 行是 $(1,1)^T$。
    由 $A(1,-1)^T=(1,0)^T$ 得 $A^{-1}(1,0)^T=(1,-1)^T$，也就是 $A^{-1}$ 的第 1 行是 $(1,-1)^T$。
    所以 $A^{-1}$ 的第一列是 $1,1$，第二列是 $-1,1$ → 答案 (2)
    驗算：$A=(A^{-1})^{-1}=\dfrac{1}{2}\begin{bmatrix}1&-1\\1&1\end{bmatrix}$，$A(1,1)^T=(0,1)^T$、$A(1,-1)^T=(1,0)^T$ ✓
mb115-04:
  key: 北緯 60° 的緯線長度只有赤道的 $\cos60^{\circ}=\dfrac{1}{2}$；兩船速率相同，甲走的經度差是乙的 2 倍。
  explain: |
    甲從西經 169° 向西到東經 171°：先到 180° 經線走了 11°，再到東經 171° 又走 9°，共 20°。
    北緯 60° 緯線的半徑 $=R\cos60^{\circ}=\dfrac{R}{2}$，所以這段經度 20° 的弧長，等於赤道上經度 10° 的弧長。
    兩船速率相同，同一段時間乙在赤道上向東走了經度 10°：東經 140°＋10°＝東經 150° → 答案 (3)
    易錯：直接用經度差 20° 算，會誤選 (4) 160 度。
mb115-05:
  key: 照規則算下去會發現：從第 3 次起，每兩次投注金額乘上 $\left(\dfrac{3}{2}\right)\left(\dfrac{3}{2}\right)\left(\dfrac{1}{2}\right)=\dfrac{9}{8}$。
  explain: |
    規則：$\text{預定金額}=\text{前次}\times\dfrac{3}{2}$，超過 $2N$ 就再減半。
    第 5 次：預定 $\left(\dfrac{3}{2}\right)\left(\dfrac{27}{16}\right)N=\dfrac{81}{32} N>2N$ → 投注 $\dfrac{81}{64} N$
    第 6 次：預定 $\left(\dfrac{3}{2}\right)\left(\dfrac{81}{64}\right)N=\dfrac{243}{128} N\approx1.90N\le2N$ → 投注 $\dfrac{243}{128} N$
    第 7 次：預定 $\left(\dfrac{3}{2}\right)\left(\dfrac{243}{128}\right)N=\dfrac{729}{256} N>2N$ → 投注 $\dfrac{729}{512} N=\dfrac{3^6}{2^9} N$ → 答案 (3)
    規律檢查：第 3、5、7 次分別是 $\dfrac{9}{8}N$、$\left(\dfrac{9}{8}\right)^2N$、$\left(\dfrac{9}{8}\right)^3N=\dfrac{3^6}{2^9}N$。
mb115-06:
  key: 領海在基線外側（與 $(5,5)$ 不同側），外緣是與 L 平行、距離 12 的直線 $4x+3y+48=0$。
  explain: |
    與 L 平行的直線寫成 $4x+3y+c=0$，和 L 的距離 $=|c+12|\div\sqrt{4^2+3^2}=\dfrac{|c+12|}{5}=12$
    ⇒ $c+12=\pm60$ ⇒ $c=48$ 或 $c=-72$
    $(5,5)$ 代入 $4x+3y-12$ 得 $23>0$，所以內側是「$4x+3y-12>0$」那一側，領海在另一側。
    $4x+3y+48=0$ 上的點滿足 $4x+3y-12=-60<0$，在外側 ✓ → 答案 (1)
    易錯：(5) $4x+3y-72=0$ 距離也是 12，但在內側（陸地那一邊）。
mb115-07:
  key: $p=P(\text{B、C 至少一個中獎})=\dfrac{5}{6}$；$q=P(\text{A 中且至少兩個中})\div P(\text{至少兩個中})=\dfrac{15}{17}$。
  explain: |
    p：已知 A 中獎，只要 B、C 至少一個中獎：$p=1-\left(\dfrac{1}{3}\right)\left(\dfrac{1}{2}\right)=\dfrac{5}{6}$
    至少兩個中獎的機率：
    　三個都中 $\left(\dfrac{3}{4}\right)\left(\dfrac{2}{3}\right)\left(\dfrac{1}{2}\right)=\dfrac{1}{4}$；恰 A、B $\left(\dfrac{3}{4}\right)\left(\dfrac{2}{3}\right)\left(\dfrac{1}{2}\right)=\dfrac{1}{4}$
    　恰 A、C $\left(\dfrac{3}{4}\right)\left(\dfrac{1}{3}\right)\left(\dfrac{1}{2}\right)=\dfrac{1}{8}$；恰 B、C $\left(\dfrac{1}{4}\right)\left(\dfrac{2}{3}\right)\left(\dfrac{1}{2}\right)=\dfrac{1}{12}$
    　合計 $\dfrac{6}{24}+\dfrac{6}{24}+\dfrac{3}{24}+\dfrac{2}{24}=\dfrac{17}{24}$
    A 中獎且至少兩個中獎 $=\dfrac{3}{4}\times\dfrac{5}{6}=\dfrac{15}{24}$，所以 $q=\dfrac{15}{24}\div\dfrac{17}{24}=\dfrac{15}{17}$
    $\dfrac{p}{q}=\dfrac{5}{6}\div\dfrac{15}{17}=\dfrac{5\times17}{6\times15}=\dfrac{17}{18}$ → 答案 (2)
mb115-08:
  key: $\sin(\theta+\pi)=-\sin\theta$，原函數就是 $y=-3\sin\left(\dfrac{\pi x}{5}\right)+3$；又 $\sin(\theta-\pi)=-\sin\theta$。
  explain: |
    $y=3\sin\left(\dfrac{\pi x}{5}+\pi\right)+3=-3\sin\left(\dfrac{\pi x}{5}\right)+3$
    (1) 振幅變成 6 ✗
    (2) x 的係數變成 $\dfrac{\pi}{5}+2\pi$，週期改變了 ✗（$2\pi$ 要加在整個角度上，不能乘在 x 上）
    (3) $3\sin\left(\dfrac{\pi x}{5}-\pi\right)+3=-3\sin\left(\dfrac{\pi x}{5}\right)+3$ ✓
    (4) 常數項是 $-3$，整個圖形往下移了 6 ✗
    (5) 就是化簡後的式子 ✓
    → 答案 (3)(5)
mb115-09:
  key: $f(x)=[(1-x)(2-x)(4+x)]\cdot(2-x)$ 可整除；找 c 就令 $t=x-2$ 展開。
  explain: |
    (1) $f(x)=[(1-x)(2-x)(4+x)]\cdot(2-x)$，整除，餘式是 0 ✗
    (2) 令 $t=x-2$：$(1-x)(4+x)=(-1-t)(6+t)=-(t^2+7t+6)$
    　$f=t^2\cdot[-(t^2+7t+6)]=-t^4-7t^3-6t^2$，所以 $c=-6$ ✓
    (3) $(2-x)^2\ge0$，$f(x)>0$ ⇔ $(1-x)(4+x)>0$ 且 $x\ne2$ ⇔ $-4<x<1$，解區間是 $(-4,1)$ ✗
    (4) $f(2026)=(-2025)(2024)^2(2030)$，$f(-2022)=(2023)(2024)^2(-2018)$，兩者都是負數
    　$\dfrac{f(2026)}{f(-2022)}=\dfrac{2025\times2030}{2023\times2018}>1$ ✓
    (5) 由 (4)，兩者皆負且 $|f(2026)|>|f(-2022)|$，所以 $f(2026)<f(-2022)$ ✗
    → 答案 (2)(4)
mb115-10:
  key: $B=0.5A$：標準差乘 0.5、與 A 的相關係數是 1；迴歸直線一定通過兩個平均數 $(65,50)$。
  explain: |
    (1) A 的標準差 $=\sqrt{225}=15$，B 的標準差 $=0.5\times15=\dfrac{15}{2}$ ✓
    (2) 身長的中位數無法推出 A 或 B 的中位數 ✗
    (3) B 是 A 的正數倍，兩者完全正相關，相關係數是 1，不是 0.5 ✗
    (4) A 對身長的迴歸直線通過 $(65,50)$，所以身長 65 時預測 A 濃度 $=50$ ✓
    (5) 乘正數不改變相關係數，B 與身長的相關係數仍是 0.75；斜率 $=0.75\times\dfrac{15}{2}\div10=\dfrac{9}{16}$，不是 $\dfrac{1}{2}$ ✗
    → 答案 (1)(4)
mb115-11:
  key: 軸線相同、地面相同，截痕由「地面與軸線的夾角 $\beta$」和「圓錐半頂角 $\alpha$」比大小決定；大燈罩的 $\alpha$ 較大。
  explain: |
    設地面與軸線的夾角為 $\beta$、圓錐的半頂角為 $\alpha$：$\beta>\alpha$ → 橢圓；$\beta=\alpha$ → 拋物線；$\beta<\alpha$ → 雙曲線。
    兩燈罩軸線相同，$\beta$ 相同；大燈罩照射範圍較大，所以 $\alpha_{\text{大}}>\alpha_{\text{小}}$。
    (1) $\Gamma$ 是橢圓：$\beta>\alpha_{\text{大}}>\alpha_{\text{小}}$，$\gamma$ 也是橢圓 ✗
    (2) $\Gamma$ 是拋物線：$\beta=\alpha_{\text{大}}>\alpha_{\text{小}}$，$\gamma$ 是橢圓 ✓
    (3) $\Gamma$ 是雙曲線：$\beta<\alpha_{\text{大}}$，但 $\beta$ 與 $\alpha_{\text{小}}$ 的大小不確定，$\gamma$ 不一定是拋物線 ✗
    (4) $\gamma$ 是拋物線：$\beta=\alpha_{\text{小}}<\alpha_{\text{大}}$，$\Gamma$ 是雙曲線 ✗
    (5) $\gamma$ 是雙曲線：$\beta<\alpha_{\text{小}}<\alpha_{\text{大}}$，$\Gamma$ 也是雙曲線 ✓
    → 答案 (2)(5)
mb115-12:
  key: 糖的總量永遠是 100 克；$a_{n+1}=\dfrac{a_n}{2}+\left(\dfrac{1}{2}\right)\left(100-\dfrac{a_n}{2}\right)=\dfrac{a_n}{4}+50$，會趨近 $\dfrac{200}{3}$。
  explain: |
    一次稀釋：A 倒一半到 B，A 剩 $\dfrac{a_n}{2}$；B 有 $(100-a_n)+\dfrac{a_n}{2}$ 克糖，混勻後倒一半回 A。
    (1) A 倒出後剩 50 克、B 有 50 克；B 倒一半（25 克）回 A → $a_1=75$ ✓
    (2) 糖的總量不變，B 瓶含糖 $=100-a_n$ ✗（$n=1$ 時 B 有 25 克，但 $50-\dfrac{75}{2}=12.5$）
    (3) $a_{n+1}=\dfrac{a_n}{2}+\left(\dfrac{1}{2}\right)\left(100-a_n+\dfrac{a_n}{2}\right)=\dfrac{1}{2}a_n+\left(\dfrac{1}{2}\right)\left(100-\dfrac{1}{2}a_n\right)$ ✓
    (4) 化簡得 $a_{n+1}=\dfrac{a_n}{4}+50$。取 $c=\dfrac{200}{3}$（$c=\dfrac{c}{4}+50$ 的解），則 $a_{n+1}-c=\left(\dfrac{1}{4}\right)(a_n-c)$，公比 $\dfrac{1}{4}$ ✓
    (5) $a_n=\dfrac{200}{3}+\dfrac{100}{3}\left(\dfrac{1}{4}\right)^n>\dfrac{200}{3}\approx66.7$，不會小於 60 ✗
    → 答案 (1)(3)(4)
mb115-13:
  key: 看三角形 $A(-20,0)$、O、交點 P：$\angle A=30^{\circ}$、$\angle AOP=105^{\circ}$、$\angle P=45^{\circ}$，用正弦定理。
  explain: |
    設 $A(-20,0)$，P 為兩線的交點。
    $\angle PAO=30^{\circ}$（$L_2$ 的斜角）；$\angle AOP=180^{\circ}-75^{\circ}=105^{\circ}$；$\angle APO=180^{\circ}-30^{\circ}-105^{\circ}=45^{\circ}$
    正弦定理：$\dfrac{OP}{\sin30^{\circ}}=\dfrac{AO}{\sin45^{\circ}}$ ⇒ $OP=20\times\dfrac{1}{2}\div\dfrac{\sqrt{2}}{2}=10\sqrt{2}\approx14.14$
    四捨五入到整數是 14 → 答案 14
mb115-14:
  key: '5、6、7 必須排成 567 或 765，3、4 綁成一塊，再和 1、2 共 4 個單位排列。'
  explain: |
    6 要同時和 5、7 相鄰，所以 5、6、7 連成一塊且 6 在中間：567 或 765，2 種。
    3、4 相鄰：34 或 43，2 種。
    「567 塊」「34 塊」、1、2 共 4 個單位排列：$4!=24$
    共 $24\times2\times2=96$ → 答案 96
mb115-15:
  key: 設「有近視且有蛀牙」的比例為 x，則 $p=\dfrac{1}{6}+x$；兩個條件給出 $\dfrac{1}{6}<x<\dfrac{1}{4}$。
  explain: |
    設有近視且有蛀牙占 x，填列聯表：
    　有近視、無蛀牙 $=\dfrac{1}{2}-x$；無近視、有蛀牙 $=\dfrac{1}{3}-x$；無近視、無蛀牙 $p=\dfrac{1}{2}-\left(\dfrac{1}{3}-x\right)=\dfrac{1}{6}+x$
    「有近視的學生中，有蛀牙的占少數」：$x\div\dfrac{1}{2}<\dfrac{1}{2}$ ⇒ $x<\dfrac{1}{4}$
    「有蛀牙的學生中，有近視的占多數」：$x\div\dfrac{1}{3}>\dfrac{1}{2}$ ⇒ $x>\dfrac{1}{6}$
    所以 $\dfrac{1}{6}<x<\dfrac{1}{4}$ ⇒ $\dfrac{1}{3}<p<\dfrac{5}{12}$ → 答案 $\dfrac{1}{3}<p<\dfrac{5}{12}$
mb115-16:
  key: $g(x)-f(x)$ 是二次函數，在 $x=1$、5 都等於 0，所以 $g(x)-f(x)=k(x-1)(x-5)$。
  explain: |
    L 過 $(1,0)$、$(5,4)$：$f(x)=x-1$
    L 與 $\Gamma$ 交於 $x=1$、5，所以 $g(x)-f(x)=k(x-1)(x-5)$
    $(2,2)$ 在 $\Gamma$ 上：$g(2)-f(2)=2-1=1=k(1)(-3)$ ⇒ $k=-\dfrac{1}{3}$
    $g(x)-f(x)=-\left(\dfrac{1}{3}\right)(x-1)(x-5)$，開口向下，$x=3$ 時有最大值 $-\left(\dfrac{1}{3}\right)(2)(-2)=\dfrac{4}{3}$ → 答案 $\dfrac{4}{3}$
mb114-01:
  key: 1 和 4 相距 $3<4$，P 只能在兩點外側，左右各一個：$P=\dfrac{1}{2}$ 或 $\dfrac{9}{2}$。
  explain: |
    P 在 1 與 4 之間時，距離和恆為 3，不可能等於 4。
    P 在 1 的左邊：$(1-P)+(4-P)=4$ ⇒ $P=\dfrac{1}{2}$
    P 在 4 的右邊：$(P-1)+(P-4)=4$ ⇒ $P=\dfrac{9}{2}$
    共 2 個 → 答案 (3)
mb114-02:
  key: 右乘 $\begin{bmatrix}1&0\\-1&1\end{bmatrix}$：第 1 行＝A 的第 1 行−第 2 行，第 2 行＝A 的第 2 行。
  explain: |
    設 A 的兩個行向量為 $c_1$、$c_2$。
    　第 1 行：$A(1,-1)^T=c_1-c_2=(4,-2,3)^T$
    　第 2 行：$A(0,1)^T=c_2=(-6,1,5)^T$
    ⇒ $c_1=(4,-2,3)^T+(-6,1,5)^T=(-2,-1,8)^T$
    $A(1,0)^T=c_1$，所以 $(a,b,c)=(-2,-1,8)$，$a+b+c=5$ → 答案 (4)
mb114-03:
  key: $\log a<0$，而 $\log(a^2)=2\log a$ 比 $\log a$ 更小；$\log b$ 與 $\dfrac{1}{\log b}$ 都是正數。
  explain: |
    $\dfrac{1}{2}<a<1$ ⇒ $\log a<0$，且 $\log(a^2)=2\log a<\log a<0$
    $1<b<2$ ⇒ $0<\log b<\log2\approx0.301$，$\dfrac{1}{\log b}>3$
    最小的是 $\log(a^2)$ → 答案 (3)
mb114-04:
  key: 選 3 種款式 $C(4,3)$，其中 1 種抽到 2 次（3 種選法），四次的順序 $\dfrac{4!}{2!}=12$。
  explain: |
    恰抽到三種款式 ⇒ 四次中有一種款式出現 2 次，另外兩種各 1 次。
    選哪三種：$C(4,3)=4$；哪一種出現 2 次：3；四次的順序：$\dfrac{4!}{2!}=12$
    機率 $=4\times3\times12\div4^4=\dfrac{144}{256}=\dfrac{9}{16}$ → 答案 (4)
mb114-05:
  key: '平面與圓錐的軸平行，夾角 0° 小於半頂角 24°，截痕是雙曲線。'
  explain: |
    M 繞 L 轉一圈，得到以 L 為軸、半頂角 24° 的直圓錐面（上下兩片）。
    平面與軸的夾角 $\beta$ 決定截痕：$\beta>\text{半頂角}$ → 橢圓（$\beta=90^{\circ}$ 時是圓）；$\beta=\text{半頂角}$ → 拋物線；$\beta<\text{半頂角}$ → 雙曲線。
    E 與 L 平行，$\beta=0^{\circ}<24^{\circ}$，且 E 不過頂點，會同時切到上下兩片 → 雙曲線 → 答案 (1)
mb114-06:
  key: 分別代 $x=4$、3、1，每次只剩一項，直接解出 a、b、c。
  explain: |
    代 $x=4$：$a(3)(1)=16$ ⇒ $a=\dfrac{16}{3}$
    代 $x=3$：$b(2)(-1)=9$ ⇒ $b=-\dfrac{9}{2}$
    代 $x=1$：$c(-2)(-3)=1$ ⇒ $c=\dfrac{1}{6}$
    $\dfrac{16}{3}>\dfrac{1}{6}>-\dfrac{9}{2}$ ⇒ $a>c>b$ → 答案 (2)
mb114-07:
  key: '柱子離得越遠，畫出來的柱高和「柱底到地平線的距離」按相同比例縮小；兩者的比值越大，實際越高。'
  explain: |
    地平線是 $y=9$。實際高度與「畫面柱高 ÷ (9−柱底的 y 坐標)」成正比：
    　A：$2\div3\approx0.67$　B：$3\div9\approx0.33$　C：$3\div6=0.5$　D：$3\div4=0.75$　E：$4\div8=0.5$　F：$2\div3\approx0.67$
    A、F 的比值相同，和題目說「兩柱實際高度相等」一致。
    比值最大的是 D → 答案 (4)
mb114-08:
  key: $y=x^3-x$ 是奇函數；x 在 0 附近時 $x^3$ 小到可以忽略，圖形接近 $y=-x$。
  explain: |
    (1) $f(-x)=-f(x)$，圖形對稱於原點 ✓
    (2) x 在 0 附近，$x^3$ 遠小於 x，$y\approx-x$，不是 $y=x$ ✗
    (3) 平移後是 $(x-h)^3-(x-h)+k$，要讓 $x^2$ 項消失必須 $h=0$，此時 x 項係數仍是 $-1$，不可能變成 $x^3+x+3$ ✗
    (4) 對稱於 x 軸的圖形是 $y=-(x^3-x)=-x^3+x$，不是 $x^3+x$ ✗
    (5) 對稱於 y 軸：把 x 換成 $-x$，得 $y=(-x)^3-(-x)=-x^3+x$ ✓
    → 答案 (1)(5)
mb114-09:
  key: 逐一解出 $\alpha$、$\beta$，兩個都在 0 到 1 之間的才可能。
  explain: |
    $(2,2)=\alpha\cdot A+\beta\cdot B$，逐一解聯立：
    (1) $2\alpha-4\beta=2$、$-3\alpha+3\beta=2$ ⇒ $\beta=-\dfrac{5}{3}$ ✗
    (2) $3\alpha+3\beta=2$、$2\alpha+4\beta=2$ ⇒ $\alpha=\beta=\dfrac{1}{3}$ ✓
    (3) $3\alpha+4\beta=2$、$4\alpha-\beta=2$ ⇒ $\alpha=\dfrac{10}{19}$、$\beta=\dfrac{2}{19}$ ✓
    (4) $\alpha+2\beta=2$、$2\alpha+\beta=2$ ⇒ $\alpha=\beta=\dfrac{2}{3}$ ✓
    (5) $\alpha+\beta=2$、$-\alpha+\beta=2$ ⇒ $\alpha=0$、$\beta=2$ ✗（$\beta>1$）
    → 答案 (2)(3)(4)
mb114-10:
  key: '總用時＝次數×平均；只知道標準差無法判斷全距，但若每次都在 1.4～1.6 秒，標準差不會超過 0.1。'
  explain: |
    (1) 丙的平均 1.7 秒最大 ✓
    (2) 總用時：甲 $25\times1.2=30$、乙 $14\times1.5=21$、丙 $20\times1.7=34$、丁 $30\times1.2=36$，丁最多 ✓
    (3) 平均相同不代表每一次都相同 ✗
    (4) 只知道標準差，無法判斷全距的大小 ✗
    (5) 乙的平均是 1.5 秒；若每次都在 1.4～1.6 秒，每個離差都不超過 0.1，標準差 $\le0.1$，與 0.3 矛盾，所以不可能 ✓
    → 答案 (1)(2)(5)
mb114-11:
  key: '經度 0° 與 180° 的經線合起來是一個通過南北極的大圓，A、B、C、D、E 都在這個大圓上。'
  explain: |
    用「圓心角」比較最短路徑長（半徑相同）：
    (1) 北極到 A、到 B 都是 $90^{\circ}-60^{\circ}=30^{\circ}$ ✓
    (2) A 到 B 經過北極：$30^{\circ}+30^{\circ}=60^{\circ}$；C 到 D：$60^{\circ}+60^{\circ}=120^{\circ}$，不相等 ✗
    (3) A、C、E 都在經度 0° 的經線上，A（北緯 60°）到 E（赤道）的最短路徑經過 C（北緯 30°）✓
    (4) C 到 D 經過北極的弧是 120°，經過南極的弧是 240°，最短路徑經過北極 ✓
    (5) E 到北極 90°，C 到 D 120°，比為 3：4，不是 2：3 ✗
    → 答案 (1)(3)(4)
mb114-12:
  key: $9=1+kd$ ⇒ $d=\dfrac{8}{k}$；$81=1+(n-1)d$ ⇒ $n=10k+1$（$k=1\sim9$）。
  explain: |
    設公差 d，9 是第 $k+1$ 項：$kd=8$ ⇒ $d=\dfrac{8}{k}$（k 為正整數）
    末項 81：$(n-1)d=80$ ⇒ $n-1=10k$ ⇒ $n=10k+1$；$n\le100$ ⇒ $k=1,2,\ldots,9$
    (1) $n=10k+1$ 必為奇數 ✓
    (2) $41=1+jd$ ⇒ $j=40\div\dfrac{8}{k}=5k$，是正整數且不超過 $10k$，41 一定在數列中 ✓
    (3) $k=3$ 時 $d=\dfrac{8}{3}$，不是整數 ✗
    (4) k 有 9 種，共 9 個數列，不是 10 個 ✗
    (5) $n\in\{11,21,\ldots,91\}$，7 的倍數有 21 和 91（$=7\times13$），n 不一定是 21 ✗
    → 答案 (1)(2)
mb114-13:
  key: $\text{至少一個有空位}=1-\text{兩個都沒空位}=1-0.7^2$。
  explain: |
    兩個停車場都沒有空位的機率 $=0.7\times0.7=0.49$
    至少一個有空位的機率 $=1-0.49=0.51$ → 答案 0.51
mb114-14:
  key: $\triangle ABC$ 面積 5，左邊 $\triangle OAB$ 只有 1，所以直線要交 AC 於 Q，使 $\triangle OQC$ 的面積是 2.5。
  explain: |
    $\triangle ABC$ 面積 $=\dfrac{1}{2}\times5\times2=5$，一半是 2.5；原點 O 在 BC 上。
    $\triangle OAB$ 面積 $=\dfrac{1}{2}\times1\times2=1<2.5$，所以直線 $y=mx$ 與 AC 相交，設交點為 Q。
    $\triangle OQC$ 面積 $=\dfrac{1}{2}\times4\times(\text{Q 的 y 坐標})=2.5$ ⇒ Q 的 y 坐標 $=\dfrac{5}{4}$
    AC：$y=2-\dfrac{x}{2}$，代入 $y=\dfrac{5}{4}$ 得 $x=\dfrac{3}{2}$
    $m=\dfrac{5}{4}\div\dfrac{3}{2}=\dfrac{5}{6}$ → 答案 $\dfrac{5}{6}$
mb114-15:
  key: 兩名翻譯各去一個部門（2 種）；研發再從 6 人選 3 人，扣掉有部門沒有工程師的 2 種：$C(6,3)-2=18$。
  explain: |
    兩個部門各需 1 名翻譯：2 名翻譯各去一個部門，2 種。
    研發部門還要 3 人，從 3 名工程師、3 名助理中選：$C(6,3)=20$ 種，剩下 3 人到測試部門。
    扣掉「研發 3 人全是助理」（研發沒有工程師）和「研發 3 人全是工程師」（測試沒有工程師），剩 18 種。
    共 $2\times18=36$ → 答案 36
mb114-16:
  key: 牆角當原點、三條交界線當坐標軸：$A(20,0,0)$、$B(0,20,0)$、$C(0,0,10)$。
  explain: |
    取 O 為原點，A、B 在牆面與地面的交界線上，C 在兩牆面的交界線上：$A(20,0,0)$、$B(0,20,0)$、$C(0,0,10)$
    向量 $\overrightarrow{AB}=(-20,20,0)$，長 $20\sqrt{2}$；向量 $\overrightarrow{AC}=(-20,0,10)$，長 $10\sqrt{5}$；內積 $=400$
    $\cos\angle CAB=400\div(20\sqrt{2}\times10\sqrt{5})=\dfrac{2}{\sqrt{10}}$，$\sin\angle CAB=\sqrt{1-\frac{4}{10}}=\dfrac{\sqrt{6}}{\sqrt{10}}$
    $\tan\angle CAB=\dfrac{\sqrt{6}}{2}$ → 答案 $\dfrac{\sqrt{6}}{2}$
mb114-17:
  key: '紅、綠同時暗的時段是每 24 秒中的 $[15,16)$，這時藍燈一定要亮。'
  explain: |
    紅燈週期 6 秒，每週期的第 3～4 秒暗；綠燈週期 8 秒，每週期的第 6～8 秒暗。
    0～24 秒內：紅燈暗 $[3,4)$、$[9,10)$、$[15,16)$、$[21,22)$；綠燈暗 $[6,8)$、$[14,16)$、$[22,24)$
    兩者同時暗只有 $[15,16)$，之後每 24 秒重複一次。
    藍燈週期 15 秒，每週期的 $[0,k)$ 亮。$15+24c$ 除以 15 的餘數依序是 0, 9, 3, 12, 6（之後循環）。
    最晚的一段是 $[12,13)$，要亮著需 $k\ge13$；$k=13$ 時其他時段也都亮著 → 答案 13
mb113-01:
  key: $210\times90\%=189$ 是整數，第 90 百分位數＝第 189 與第 190 個數的平均。
  explain: |
    由小到大排列，持有 1～m 顆的總人數 $=1+2+\cdots+m=\dfrac{m(m+1)}{2}$
    $m=18$ 時 171 人、$m=19$ 時 190 人 ⇒ 第 172～190 人都持有 19 顆
    $210\times\dfrac{90}{100}=189$ 是整數 ⇒ 第 90 百分位數 $=(\text{第 189 個}+\text{第 190 個})\div2=(19+19)\div2=19$ → 答案 (4)
mb113-02:
  key: $1<a<10$ ⇒ $0<\log a<1$，所以 b 在 0 與 1 之間，$c=\log b<0$。
  explain: |
    $1<a<10$ ⇒ $\log1<\log a<\log10$ ⇒ $0<b<1$
    $0<b<1$ ⇒ $c=\log b<0$
    所以 $c<0<b<1$ → 答案 (1)
