# ---------- Day 36：力學與運動、化學與生活、環境、演化與分類 ----------
sci112-35:
  key: 汽缸：重力作功變成熱，無法完全再轉回功，活塞停在較低處；理想彈簧：力學能守恆，振盪時頂端最高仍回到原高度 h。
  explain: |
    (C) 重物使活塞下壓，重力作的功轉成氣體的熱能 Q；熱無法完全轉換成功把活塞推回 h，最後活塞停在較低的高度 ✓
    (E) 溫度不變、沒有能量損耗時，力學能守恆，重物和彈簧在最高點的速度為零，會回到放上去時的高度 h ✓
    (D) 若彈簧溫度上升，表示有一部分力學能轉成熱，最高點會低於 h（全國 30% 誤選）✗
    (A) 汽缸系統有能量轉成熱，$h'<h$（全國 26% 誤選）✗
    (B) 兩個系統都遵守能量守恆定律（全國 20% 誤選）✗
sci112-22:
  key: 對流層的臭氧是地面的空氣汙染，不會上升到平流層補臭氧層破洞，而且還會被紫外線分解。
  explain: |
    這題選「錯誤」的。
    (E) 光化學煙霧產生的臭氧在對流層，是有害的汙染物，不能修補平流層的臭氧層破洞 → 錯誤 ✓
    (A) 反應Ⅰ：NO 和 O₃ 生成 NO₂，N 的氧化數升高 → 氧化還原反應 → 正確
    (B) 丙烯和 O₃ 反應生成甲醛、乙醛，丙烯被氧化 → 正確
    (C) NO₂ 要吸收紫外線才分解成 NO 和 O → 吸熱 → 正確
    (D) O₂＋O → O₃ 形成新的鍵，放出能量 → 正確（全國 18% 誤選）
sci112-16:
  key: 生物多樣性包含基因、物種、生態系三個層次；大滅絕後，新物種逐漸演化出現，多樣性會再增加。
  explain: |
    (B) 大規模滅絕後空出的生態區位，會讓新物種逐漸演化出來，多樣性回升 ✓
    (C) 生物多樣性分為基因多樣性、物種多樣性與生態系多樣性 ✓
    (E) 對偶基因比例 3：1 只是族群中的頻率，不能證明顯性表徵比較適應環境（全國 27% 誤選）✗
    (D) 棲地複雜度增加，生態系多樣性就增加，不必等物種組成改變（全國 14% 誤選）✗
    (A) 大滅絕主要是環境劇變（如隕石撞擊、火山活動）造成大量物種消失，不是新物種出現不足 ✗
sci112-05:
  key: 潮汐週期約 12 小時 25 分，一天不到兩個完整週期；各站乾潮時間不同；花蓮潮差最小，汙染物較難靠潮水帶走。
  explain: |
    (B) 比較四張圖，最低潮出現的時刻各站不同 ✓
    (E) 花蓮的潮差只有約 1 公尺，遠小於其他站，潮水交換弱，汙染物較難擴散 ✓
    (A) 半日潮一個週期約 12 小時 25 分，24 小時內不足兩個完整週期；花蓮的高低潮也不規則（全國 36% 誤選）✗
    (C) 7/27 上午 9 時，花蓮的潮位正在上升（漲潮），不是各站都在退潮 ✗
    (D) 臺北港的潮差約 2.5 公尺，馬祖約 4 公尺以上，馬祖較大 ✗
sci112-36:
  key: 乙浮在甲上方、沒有接觸，向上支撐乙的只能是磁力 → 排斥力；兩根直桿只提供水平的正向力，就足以讓乙靜止，不需要摩擦力。
  explain: |
    (B) 乙沒有掉到甲上，表示甲對乙的磁力向上，是排斥力；磁極均勻分布在表面，左右兩半都受排斥力，只是左半邊較大。乙受重力、磁力和直桿的正向力就能平衡，不論有沒有摩擦力都可以靜止 ✓
    (E) 不需要摩擦力也能平衡（全國 34% 誤選，比答對的人還多）✗
    (C)(D) 兩盤磁極各自均勻分布，乙的左右兩側受力性質相同，都是排斥力（(C) 全國 31% 誤選）✗
    (A) 若是吸引力，乙會被吸到甲上，不會懸浮 ✗

# ---------- Day 37：物質結構與鍵結、演化與分類、大氣與氣象 ----------
sci112-23:
  key: 組成蛋白質的單元是胺基酸：X 有 4 個鍵是碳、Y 有 2 對孤對電子是氧、W 有 1 對孤對電子是氮、Z 只有 1 個鍵是氫。
  explain: |
    依鍵數判斷：只連一個鍵的 Z 是氫；連 4 個鍵的 X 是碳；連 2 個鍵、有 2 對孤對電子的 Y 是氧；連 3 個鍵、有 1 對孤對電子的 W 是氮。這是胺基酸絲胺酸（HOCH₂CH(NH₂)COOH）。
    (A) W 為氮 ✓
    (D) Z 為氫 ✓
    (E) 未參與鍵結的價電子：3 個 O 各 2 對（共 12 個）＋N 1 對（2 個）＝14 個 ✓
    (B) X 是碳，不是氧（全國 24% 誤選）✗
    (C) Y 是氧，不是碳（全國 25% 誤選）✗
sci112-17:
  key: 病毒沒有細胞構造，放不進現有以細胞特徵分出的域或界 → 只能新立一個域或一個界。
  explain: |
    (A) 病毒不屬於細菌、古菌、真核生物任何一域，可以新立一個域 ✓
    (B) 在界的層級，也只能為它新立一個界 ✓
    (C) 原核生物是有細胞、無核膜的生物，病毒沒有細胞（全國 34% 誤選）✗
    (D) 細菌域的成員都是原核細胞（全國 21% 誤選）✗
    (E) 古菌也是單細胞的原核生物 ✗
sci112-06:
  key: 乾、溼球溫度相同 → 水分無法蒸發 → 相對溼度 100%；兩地都是飽和，但 30°C 的飽和水氣量較多。
  explain: |
    溼球溫度和乾球溫度相同，表示溼布上的水不會蒸發，空氣已飽和 → 兩地相對溼度都是 100%。
    (A) 兩地相對溼度一樣 ✓
    (E) 氣溫越高，飽和時能容納的水氣越多 → 30°C 的甲地水氣含量較多 ✓
    (B)(C) 兩地相對溼度都是 100% ✗（(B) 全國 21% 誤選）
    (D)(F) 甲地溫度高，水氣含量較多 ✗（(F) 全國 14% 誤選）
sci112-37:
  key: 水從水面落下 100 m 到進水口，每公斤的位能轉成動能：$u_w=gh=10\times100=10^3$ J/kg。
  explain: |
    每單位質量的動能＝每單位質量減少的重力位能 $=gh=10\times100=1000$ J/kg (D) ✓
    (C) $10^2$（全國 17% 誤選）：忘了乘重力加速度 g。
sci112-38: 
  key: 發電功率＝每秒流入的水質量 × 每公斤的動能 × 轉換效率：$P_1=\mu u_w\varepsilon$ → 要確定丙（μ）和丁（ε）。
  explain: |
    每秒流入發電機的水帶來的能量是 $\mu u_w$，乘上效率 ε 才是電功率：$P_1=\mu u_w\varepsilon$。$u_w$ 已由落差決定，所以要確定 μ 和 ε。
    (B) 丙丁 ✓
    (E) 丁戊（全國 29% 誤選）：每日發電時間 T 影響的是總發電量，不影響每部發電機的功率。
sci112-39:
  key: 每單位電能用掉的煤（甲 $c_1$）× 每單位煤排放的 CO₂（乙 $c_2$）＝燃煤發每單位電能排放的 CO₂，就是水力發電可減少的量。
  explain: |
    水力發電本身不排放 CO₂；它每發 1 單位電能，就省下燃煤發同樣電能所排放的 CO₂ $=c_1c_2$。
    (A) 甲乙 ✓
    (D) 乙丁戊（全國 20% 誤選）、(B) 乙丁（全國 18% 誤選）：效率 ε 和發電時間 T 跟「每單位電能」的排放量無關。

# ---------- Day 38：酸鹼與溶液、遺傳、大氣與氣象 ----------
sci112-24:
  key: NH₄NO₃ 是離子化合物，NH₄⁺ 水解使溶液偏酸；爆炸反應 $\mathrm{2NH_4NO_3\to2N_2+O_2+4H_2O}$，係數和為 9。
  explain: |
    (B) NH₄⁺ 在水中會釋出 H⁺（水解），溶液呈弱酸性：$[\mathrm{H^+}]>[\mathrm{OH^-}]$ ✓
    (C) 氮是植物合成核酸、蛋白質的必要元素 ✓
    (E) 平衡式 $\mathrm{2NH_4NO_3\to2N_2+O_2+4H_2O}$，係數和 $2+2+1+4=9$ ✓
    (D) NH₄⁺ 中的 N（－3）被氧化成 0，NO₃⁻ 中的 N（＋5）則被「還原」成 0，不是皆被氧化（全國 45% 誤選）✗
    (A) 硝酸銨由 NH₄⁺ 和 NO₃⁻ 組成，是離子化合物（全國 37% 誤選）✗
sci112-18:
  key: 兩個隱性突變株互交，子代仍是小果 → 兩者壞掉的是同一個基因（若是不同基因，子代會互補成野生型）。
  explain: |
    (A) 甲乙都是隱性同型合子：若突變在不同基因，子代會各從親代得到一個正常的對偶基因而恢復成正常大果；子代仍為小果，表示是同一個基因 ✓
    (B)(C) 若是顯性突變，子代只要帶一個突變對偶基因就會是小果，不論是不是同一基因，結果都一樣，無法證實（全國各 18% 誤選）✗
    (D)(E) 子代果實比親代更小，反而可能是不同基因的效果累加 ✗
sci112-07:
  key: 8 月：$388.5\div13\approx30$ mm／天；6 月：$419.6\div23\approx18$ mm／天 → 8 月降雨日的平均日雨量較大。
  explain: |
    (D) 8 月 $388.5\div13\approx29.9$ mm，6 月 $419.6\div23\approx18.2$ mm → 8 月較大 ✓
    (E) 降雨日數 200 天扣掉雨跡 32 天剩 168 天，不到半年（182.5 天）（全國 25% 誤選）✗
    (A) 平均月雨量 $2278.3\div12\approx190$ mm，沒有超過 200 mm ✗
    (B) 冬季（12、1、2 月）約 401 mm，夏季（6、7、8 月）約 897 mm，夏季較多 ✗
    (C) 12 月 $63.4\div7\approx9$ mm，並不是最大 ✗
sci112-51:
  key: α 衰變：質量數減 4、原子序減 2（U-238 → Th-234）；β 衰變：質量數不變、原子序加 1（Tl-206 → Pb-206）。
  explain: |
    (A) $^{238}_{92}\mathrm{U}\to{}^{234}_{90}\mathrm{Th}+{}^4_2\mathrm{He}$：質量數少 4、原子序少 2 → α 衰變 ✓
    (E) $^{206}_{81}\mathrm{Tl}\to{}^{206}_{82}\mathrm{Pb}+\mathrm{e^-}$：質量數不變、原子序多 1 → β 衰變 ✓
    (B) β 衰變不會讓質量數改變（全國 21% 誤選）✗
    (D) α 衰變會讓質量數少 4，Tl-206 變 Pb-206 質量數沒變（全國 18% 誤選）✗
    (C) γ 衰變只放出能量，原子序與質量數都不變（全國 16% 誤選）✗
sci112-53:
  key: 石油的 $^{206}\mathrm{Pb}/^{207}\mathrm{Pb}$ 是 1.067、煤是 1.186；1920 年後岩心的比值一路往下降 → 來源逐漸偏向石油（含鉛汽油）。
  explain: |
    (D) 1920 年後比值由約 1.180 降到 1.170，往石油的 1.067 方向移動 → 和使用石油有關 ✓
    (C) 同位素比例只反映鉛的來源，無法換算鉛的濃度（全國 27% 誤選）✗
    (B) 1760～1900 年代鉛濃度起伏不大，大約 1920 年後才明顯上升（全國 8% 誤選）✗
    (A) 鉛的同位素比例和大氣 CO₂ 濃度是兩回事（全國 7% 誤選）✗
    (E) 岩石、地下水本來就含鉛，比值不會變成 0 ✗

# ---------- Day 39：化學計量與熱化學、遺傳、海洋 ----------
sci112-25:
  key: 5.4 g M 最多生成 10.2 g 氧化物 → 用掉 O 4.8 g（0.3 mol）；$A=9x$，介於 20～30 → $x=3$、$A=27$（鋁）→ Al₂O₃，102 g/mol。
  explain: |
    丙、丁都生成 10.2 g，表示 5.4 g 的 M 已完全反應，用掉氧 $10.2-5.4=4.8$ g＝0.3 mol O。
    M 的莫耳數 $=\dfrac{5.4}{A}$；$\dfrac{x}{2}=\dfrac{0.3}{5.4/A}$ ⇒ $A=9x$。A 在 20～30 之間 → $x=3$、$A=27$（鋁）。
    (C) Al₂O₃ 的莫耳質量 $=2\times27+3\times16=102$ g/mol ✓
    (E) 丁通入 6.4 g 氧氣，只用掉 4.8 g，剩 1.6 g ✓
    (B) 原子量是 27，不是 24（全國 29% 誤選）✗
    (D) 丙通入 4.8 g 氧氣剛好和 5.4 g M 完全反應，沒有剩下金屬（全國 22% 誤選）✗
    (A) $x=3$（全國 15% 誤選）✗
sci112-26:
  key: 甲原本 O₂ 不足、還剩 3.6 g 鋁；丁剩 1.6 g O₂。打開氣閥後這 1.6 g O₂ 流到甲和鋁反應 → 甲的固體增加 1.6 g。
  explain: |
    甲：1.6 g O₂ 生成 3.4 g Al₂O₃，用掉鋁 1.8 g，還剩鋁 3.6 g，容器內沒有氣體。
    丁：鋁已用完，剩下 O₂ 1.6 g。
    打開氣閥，丁的 O₂ 擴散到甲，被甲中過量的鋁全部吸收（3.6 g 鋁最多可和 3.2 g O₂ 反應）。
    (B) 甲的固體質量增加 1.6 g ✓
    (A) 氧氣全部反應掉，甲內仍幾乎沒有氣體，壓力沒有變大（全國 23% 誤選）✗
    (D) 丁少了 1.6 g 氧氣（全國 22% 誤選）✗
    (C) 氣體變成固體，固體總質量增加 1.6 g（全國 21% 誤選）✗
    (E) 丁的固體 10.2 g；甲原本的固體是 $5.4+1.6=7.0$ g，再加 1.6 g 成為 8.6 g，並不相等（全國 12% 誤選）✗
sci112-48:
  key: 實驗比值和期望值 3：1 的小落差來自機率誤差：取樣誤差、親代選取的機遇、樣本數不夠大；模式本身與遺傳因子都沒有問題。
  explain: |
    (A) 統計資料時有取樣誤差 ✓
    (C) 選哪些植株作親代有機遇的成分 ✓
    (E) 樣本再大，實驗值才會更接近期望值 ✓
    (D) 圓滑／皺縮由同一對遺傳因子決定，不是因子互相干擾（全國 51% 誤選，比答對率高）✗
    (B) 分離律的模式是正確的，2.96：1 和 3：1 的差距在機率誤差範圍內（全國 47% 誤選）✗
sci112-49:
  key: 環境可控能減少干擾 → 更接近期望值；天擇或基因連鎖都會讓比值偏離期望值。
  explain: |
    (B) 溫室能控制環境、減少偶然的損失，結果較接近期望值 ✓
    (C) 若某些表徵較易存活，比例就會被天擇改變 ✓
    (D) 兩性狀的基因若在同一條染色體上（連鎖），不遵循獨立分配律，比值會偏離 9：3：3：1 ✓
    (E) F1 的圓滑種子中多數帶有皺縮的對偶基因（Rr），皺縮基因不會很快消失（全國 39% 誤選）✗
    (A) 顯性和是否適應環境無關（全國 37% 誤選）✗
sci112-08:
  key: 副熱帶高壓帶：空氣下沉、地面風向外輻散 → 晴朗少雨、蒸發旺盛 → 海水鹽度最高。
  explain: |
    鹽度高＝蒸發多、降水少，對應南北緯 20°～30° 附近的副熱帶高壓帶。
    (A) 高壓區 ✓
    (D) 下沉氣流區：空氣下沉增溫，不易成雲降雨 ✓
    (F) 地面風場輻散：下沉的空氣在地面向外流出 ✓
    (E) 輻合區（全國 44% 誤選）、(C) 上升氣流區（全國 39% 誤選）、(B) 低壓區：都是多雲多雨的赤道低壓帶特徵，降水多、鹽度較低 ✗

# ---------- Day 40：力學與運動、化學與生活、環境、原子結構與週期表 ----------
sci113-16:
  key: 碳化後的咖啡粉顏色黑，能吸收更多陽光、把光能轉成熱，使水溫升高、蒸發變快。
  explain: |
    比較乙（只照光）和丙（照光並灑碳化咖啡粉）：丙的重量減少得較快。
    (D) 黑色的碳化粉末吸光吸熱效果好，提高水面溫度，促進蒸發 ✓
    (E) 和是否吸水無關（全國 13% 誤選）✗
    (C) 碳化的咖啡粉不溶於水（全國 12% 誤選）✗
    (A)(B) 粉末不會跟著揮發，也不會把水擠出去 ✗
sci113-17:
  key: 矽烷疏水，讓咖啡粉浮在水面持續吸光；由圖：40 分到 50 分重量由約 −0.62 降到 −0.82 kg/m²，速率約 0.02 kg/(m²·min)。
  explain: |
    (A) 疏水的矽烷使咖啡粉漂浮在水面，不會沉下去，才能在水面吸熱 ✓
    (E) 丁線在 40 分鐘約 −0.62、50 分鐘約 −0.82，10 分鐘少了 0.2 kg/m² → $0.02\ \text{kg}/(\text{m}^2\cdot\text{min})$ ✓
    (C) 界面活性劑會讓粉末分散到水中；這裡是要粉末浮在表面（全國 32% 誤選）✗
    (B) 油脂特性的矽烷是疏水的（全國 11% 誤選）✗
    (D) 粉末沉入水中就照不到光，反而不利蒸發（全國 9% 誤選）✗
sci112-27:
  key: 過氧化氫（Y＝O）經 MnO₂ 催化放出 O₂，通入硫化氫（X＝S）溶液生成淡黃色的硫：$\mathrm{O_2+2H_2S\to2S+2H_2O}$。
  explain: |
    過 Y 化氫＋MnO₂ 產生氣體 → H₂O₂ 分解產生 O₂，Y 是氧；O₂ 和 X 化氫反應生成淡黃色粉末（硫）→ X 是硫，和氧同族（16 族），在氧的下方。
    (B) 硫的原子較大，價電子離原子核較遠，比氧容易失去 ✓
    (D) 產生的氣體是氧氣，可以助燃 ✓
    (E) O₂ 和硫（S₈）都是由共價鍵組成的分子 ✓
    (C) 同族元素越往下原子半徑越大，硫比氧大（全國 54% 誤選）✗
    (A) 同族越往下非金屬性越弱；O₂ 能把 H₂S 中的硫置換出來，也表示氧的非金屬性較強（全國 53% 誤選）✗

# ---------- Day 41：演化與分類、化學與生活、環境、地質與地球歷史 ----------
sci112-55:
  key: 有 X 的 113 人中只有 17 人有 Y（約 15%），沒有 X 的 31 人中有 15 人有 Y（約 48%）→ X 存在時 Y 明顯少見 → X 抑制 Y。
  explain: |
    計算比例：
    有 X：Y 出現在 $17\div113\approx15\%$；沒有 X：Y 出現在 $15\div31\approx48\%$ → X 存在時，Y 少了很多。
    反過來看，有 Y 的 32 人中仍有 17 人（過半）有 X，X 在多數人體內都存在，看不出 Y 能有效抑制 X。
    (A) X 能夠抑制 Y 的生長 ✓
    (B) Y 抑制 X（全國 27% 誤選）✗
sci112-56:
  key: 抗生素廣泛使用，細菌不斷接觸、劑量也越用越高 → 試驗要讓劑量逐步增加，看細菌能耐受到多高的劑量。
  explain: |
    (A) 劑量隨時間逐步升高，模擬細菌長期接觸抗生素；若細菌能在越來越高的劑量下生存，就表示產生抗藥性，也能量出抗藥的程度 ✓
    (C) 劑量固定（全國 12% 誤選）：無法看出抗藥性提高到什麼程度。
    (B) 劑量遞減（全國 11% 誤選）(D)(E) 劑量忽高忽低，都不符合「廣泛使用」的情境。
sci112-58:
  key: 路鄧素的環上一再出現 –CO–NH–（醯胺鍵／肽鍵），是由胺基酸串接而成 → 這些單體可以組成蛋白質。
  explain: |
    結構中反覆出現「C＝O 接 NH」的肽鍵，側鏈是異丙基、吲哚等胺基酸的側鏈 → 單體是胺基酸。
    (C) 胺基酸串接成的就是蛋白質 ✓
    (B) 核苷酸由磷酸、五碳糖、含氮鹼基組成，結構中沒有磷酸（全國 24% 誤選）✗
    (A)(E) 纖維素、葡萄糖是醣類，沒有氮 ✗
    (D) 三酸甘油酯由甘油和脂肪酸組成，沒有肽鍵 ✗
sci112-59:
  key: 纖維素 $(\mathrm{C_6H_{10}O_5})_n$ 是植物細胞壁的主成分；核苷酸＝磷酸＋五碳糖＋含氮鹼基；蛋白質是胺基酸的聚合物。
  explain: |
    (A) 植物細胞壁主要是纖維素，由葡萄糖聚合而成，分子式 $(\mathrm{C_6H_{10}O_5})_n$ ✓
    (C) 核苷酸的結構是磷酸根－五碳糖－含氮鹼基 ✓
    (E) 蛋白質由胺基酸以肽鍵聚合而成 ✓
    (B) 細胞壁的纖維素不是界面活性劑；界面活性劑要同時有親油端和親水端（全國 31% 誤選）✗
    (D) DNA 的五碳糖是去氧核糖，RNA 是核糖（全國 24% 誤選）✗
sci112-09:
  key: 環太平洋地震帶就是太平洋周圍的聚合（隱沒）板塊邊界，和環太平洋火山帶（火環）幾乎重合。
  explain: |
    (C) 隱沒帶同時造成地震與岩漿活動，地震帶和火山帶位置幾乎一致 ✓
    (B) 隱沒帶的地震可以深達數百公里，這個地震帶有許多中、深源地震（全國 14% 誤選）✗
    (A) 主要和聚合（隱沒）型板塊邊界有關，不是張裂型（全國 7% 誤選）✗
    (D) 多由逆斷層活動造成，不是平移斷層（全國 8% 誤選）✗
    (E) 臺灣位於歐亞板塊與菲律賓海板塊的交界，不是和太平洋板塊相接（全國 8% 誤選）✗

# ---------- Day 42：近代物理與基本交互作用、酸鹼與溶液、代謝與能量 ----------
sci113-19:
  key: 核電廠：鈾核分裂（質量轉成能量）→ 熱使水變成蒸汽 → 蒸汽推動渦輪（熱能轉動能）→ 發電機轉成電能。
  explain: |
    (A) 核分裂後總質量減少，依 $E=mc^2$ 轉成能量 ✓
    (C) 熱把水變成高壓蒸汽，推動渦輪轉動 ✓
    (E) 核電廠利用鈾-235 的核分裂 ✓
    (D) 核融合還沒有用在發電廠（全國 29% 誤選）✗
    (B) 過程中沒有聲能轉電能 ✗
sci112-45:
  key: pH 由 6.6 降到 5.3，差 1.3 → $[\mathrm{H^+}]$ 變為 $10^{1.3}=10\times10^{0.3}\approx10\times2=20$ 倍。
  explain: |
    pH 每降 1，氫離子濃度變成 10 倍。降了 1.3：$10^{1.3}=10\times10^{0.3}$，而 $\log2=0.30$ ⇒ $10^{0.3}\approx2$。
    所以氫離子濃度增加約 20 倍 (C) ✓
    (B) 13%（全國 19% 誤選）(A) 1.3 倍（全國 15% 誤選）：直接用 pH 的差當成倍數或百分比，忘了 pH 是對數。
sci112-46:
  key: 乳酸發酵不需要氧；pH 下降時酪蛋白的親水性改變而凝聚析出，乳清蛋白則留在酸性溶液中。
  explain: |
    (D) 酪蛋白會隨 pH 降低而凝聚析出，表示它的親水性隨 pH 改變 ✓
    (E) 酸性下酪蛋白析出、乳清蛋白仍留在溶液中 → 乳清蛋白較易溶於水 ✓
    (A) 乳酸發酵是無氧的代謝過程（全國 23% 誤選）✗
    (C) 乳酸越來越多，pH 會持續下降，不會回升（全國 22% 誤選）✗
    (B) 乳酸菌在有氧環境中也能存活（全國 17% 誤選）✗
sci113-01:
  key: 細胞形狀扁平不規則、彼此緊貼、各有一個細胞核、沒有細胞壁 → 口腔黏膜（皮膜細胞）。
  explain: |
    (B) 口腔皮膜細胞呈扁平多邊形、邊緣不規則，中央有細胞核 ✓
    (D) 洋蔥表皮細胞有細胞壁，排列整齊、呈長方形（全國 11% 誤選）✗
    (A) 血液中的紅血球沒有細胞核、呈圓盤狀 ✗
    (C) 根尖細胞小而方正，常可見分裂中的細胞 ✗
    (E) 水蘊草葉片細胞有細胞壁和許多葉綠體 ✗

