# 數學B 第 2 週（Day 8–14）解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

mb112-01:
  key: y＝kx³（k＞0）：過原點、一路遞增，而且越來越陡。
  explain: |
    用電量 y＝kx³，k＞0。x≥0 時 y 從 0 開始遞增，x 越大增加得越快（圖形向上彎）→ 答案 (1)
    (2) 是正比 y＝kx；(3) 增加得越來越慢，像 y＝k√x。
    (4) 有起伏是一般三次函數可能的形狀，但 y＝kx³ 只有三次方項，在 x≥0 時不會轉折（全國 24% 誤選）。
mb112-09:
  key: 有理數＋無理數＝無理數；但乘法要小心 d＝0。2√10≈6.32，用平方比大小。
  explain: |
    a＝6、b≈6.67、c＝2√10≈6.32（無理數）、d 為有理數。
    (1) a＋b＋d 是有理數，再加上無理數 c，一定是無理數 ✗
    (2) d＝0 時 abcd＝0 是有理數，「必為無理數」不對 ✗（全國 49% 誤選）
    (3) D＝c−(2√10＋6)＝−6 是有理數，可能 ✓
    (4) A、B 中點＝19/3，(19/3)²＝361/9≈40.1＞40＝c²，所以中點在 C 的右邊 ✓
    (5) 和 B 距離小於 8：−4/3＜x＜44/3，正整數 1～14 共 14 個，負整數只有 −1 ✓
    → 答案 (3)(4)(5)
mb112-10:
  key: 甲＝X·2^(t/3)、乙＝Y·2^(t/2)（t 為 12 點後的小時數）；18 點相等 ⇒ 4X＝8Y ⇒ X＝2Y。
  explain: |
    (1) t＝6：X·2²＝Y·2³ ⇒ X＝2Y＞Y ✓
    (2) 13 點甲＝X·2^(1/3)≈1.26X，不是 4/3X（指數成長不能按比例平分）✗（全國 32% 誤選）
    (3) 15 點乙＝Y·2^(3/2)＝2√2Y≈2.83Y ✗（全國 37% 誤選）
    (4) 19 點：乙/甲＝Y·2^(7/2)÷(2Y·2^(7/3))＝2^(1/6)≈1.12 ✗
    (5) 24 點：乙/甲＝Y·2⁶÷(2Y·2⁴)＝2 ✓
    → 答案 (1)(5)
mb112-13:
  key: 兩邊取 log：log a＋2log b＝5、2log a＋log b＝3，解聯立。
  explain: |
    令 A＝log a、B＝log b：
    A＋2B＝5，2A＋B＝3
    第一式×2 − 第二式：3B＝7 ⇒ B＝7/3
    log b＝7/3：13-1＝7、13-2＝3
mb113-11:
  key: 「每年平均減 5%」是幾何平均：Y＝0.95⁴X ⇔ ⁴√(Y/X)＝0.95；各年成長率的算術平均不一定是 −0.05。
  explain: |
    (1) 第 2 年成長率 −0.07 ⇒ A＝X(1−0.07)＝0.93X ✓
    (2) 0.95⁴≈0.8145，所以 Y≈0.8145X＞0.8X ✗（全國 39% 誤選）
    (3) 算術平均不一定是 −0.05。例如 p＝q＝r 時，由 0.93(1＋p)³＝0.95⁴ 解出 p≈−0.0432，四個成長率的平均約 −0.0499 ✗（全國 54% 誤選）
    (4) ⁴√(Y/X)＝0.95，減 1 得 −0.05 ✓
    (5) Y＝X×0.93×(1＋p)(1＋q)(1＋r)＝0.95⁴X ✓
    → 答案 (1)(4)(5)
mb113-05:
  key: f(x−2)＝f(−x−2) 表示圖形對稱於 x＝−2；在 [−3,1] 上最小值在 x＝−2、最大值在離軸最遠的 x＝1。
  explain: |
    x−2 和 −x−2 的中點是 −2，所以對稱軸是 x＝−2，f(x)＝(x＋2)²＋k。
    在 −3≤x≤1：最小值 f(−2)＝k；最大值在離 −2 最遠的 x＝1，f(1)＝9＋k。
    9＋k＝4k ⇒ k＝3，最小值是 3 → 答案 (3)
mb112-06:
  key: g＝a·f＋(−3x−17) ⇒ f＝(1/a)·g＋(3x＋17)/a，正確的餘式是一次式，x² 項係數 p＝0。
  explain: |
    g(x) 除以 f(x)：兩者都是三次，商是 a，g＝a·f＋(−3x−17)。
    移項：f＝(1/a)·g＋(3x＋17)/a，而 (3x＋17)/a 的次數比 g 低，所以它就是 f 除以 g 的餘式。
    餘式沒有 x² 項 ⇒ p＝0 → 答案 (3)
    也可以直接比對係數：g−a·f＝(b−a²)x²＋… 要等於 −3x−17，得 b＝a²；而 f−(1/a)g 的 x² 係數＝a−b/a＝0。
mb113-09:
  key: f＝(x²＋5x＋1)·商＋餘式，餘式次數要小於 2；把每個選項整理成「商 x³＋7x²＋x＋3、餘式一次以下」看看。
  explain: |
    令 D＝x²＋5x＋1、Q＝x³＋7x²＋x＋3。
    (1) 2Q·D 的商是 2Q ✗（全國 39% 誤選）
    (2) Q·D−x：餘式 −x 是一次式 ✓
    (3) x² 的次數和除式一樣，不是餘式；x²＝D−5x−1，商會變成 Q＋1 ✗（全國 35% 誤選）
    (4) (Q＋1)D−x 的商是 Q＋1 ✗（全國 42% 誤選）
    (5) (Q＋1)D−x²＝Q·D＋(D−x²)＝Q·D＋(5x＋1)，商是 Q、餘式 5x＋1 ✓
    → 答案 (2)(5)
mb113-13:
  key: 矩陣乘法可以拆開：M[2a＋1; 2b＋1]＝2·M[a; b]＋M[1; 1]。
  explain: |
    令 M＝[[1,−1],[3,−2]]，已知 M[a; b]＝[1; 0]。
    M[2a＋1; 2b＋1]＝2M[a; b]＋M[1; 1]＝2[1; 0]＋[0; 1]＝[2; 1]
    c＝2、d＝1，c−3d＝−1：13-1＝−、13-2＝1
    不需要先解出 a、b。
mb112-02:
  key: 左乘 [[0,1],[1,0]] 會交換兩列；右乘 [[1,0],[0,−2]] 會把第二行乘以 −2。
  explain: |
    [[0,1],[1,0]]·[[a,b],[c,d]]＝[[c,d],[a,b]]（兩列交換）
    再右乘 [[1,0],[0,−2]]：[[c,−2d],[a,−2b]]（第二行乘 −2）
    對照 [[3,−4],[−9,−7]]：c＝3、d＝2、a＝−9、b＝7/2
    c−2b＝3−7＝−4 → 答案 (2)
mb113-06:
  key: 相似三角形：截出的寬度與「到 P 的垂直距離」成正比。由 1/3 先求出 P 在五樓地板上方半層樓高。
  explain: |
    設每層樓高 h，P 在五樓地板上方 y。
    △PAB：AB 在五樓地板下方 h（四樓地板），到 P 的垂直距離是 y＋h。
    五樓地板截出的寬度＝L×y/(y＋h)＝L/3 ⇒ y＝h/2
    △PEF：EF 在五樓地板下方 3h（二樓地板），到 P 的垂直距離是 h/2＋3h＝7h/2。
    五樓地板截出的寬度＝L×(h/2)÷(7h/2)＝L/7 → 答案 (1)
    若分母誤用「五樓地板到 EF」的距離 3h，會得到 (h/2)÷3h＝1/6 而誤選 (2)（全國 23% 誤選）；比例要用「到 P 的距離」。
mb112-03:
  key: 水平距離是鄰邊、繩索是斜邊：繩長＝150÷cos22°。
  explain: |
    從甲樓頂看乙樓頂：水平距離 150 公尺、俯角 22°，繩索是直角三角形的斜邊。
    cos22°＝150÷繩長 ⇒ 繩長＝150/cos22° → 答案 (4)
    (5) 150/sin22° 是把水平距離當成對邊（全國 17% 誤選）；(3) 150cos22° 比 150 還短，斜邊不可能比鄰邊短。
mb112-15:
  key: 每走一段就左轉 15°：P₂P₃ 的方向比 P₀P₁ 轉了 30°，P₅P₆ 轉了 75°，兩向量夾 45°。
  explain: |
    第 k 段 PₖPₖ₊₁ 的方向比第一段 P₀P₁ 左轉了 15°×k。
    P₂P₃：轉 30°；P₅P₆：轉 75°；夾角 45°。
    內積＝2×2×cos45°＝2√2：15-1＝2、15-2＝2
mb113-04:
  key: A、B 都在單位正方形內 ⇒ AB＝(u, w)，u、w 都可以是 −1 到 1 之間任何值；取 (−1, 1) 讓 v＋AB＝(−3, 4)。
  explain: |
    AB 的 x、y 分量都在 [−1, 1] 內，而且每一組都做得到（例如 A＝(1,0)、B＝(0,1) 得 AB＝(−1,1)）。
    v＋AB＝(−2＋u, 3＋w)，要讓長度最大就讓兩個分量的絕對值都最大：u＝−1、w＝1
    |(−3, 4)|＝5 → 答案 (4)
    (5) √2＋√13 是用三角不等式估的上界，但長度 √2 的 AB 只能沿對角線方向，不會和 v 同向，達不到（全國 24% 誤選）。
mb113-15:
  key: 以 R 為基準：P₁＝R−4u、Q₁＝R−3u（u＝P₁Q₁）；P₂＝R−7w、Q₂＝R−6w（w＝P₂Q₂）。
  explain: |
    令 u＝P₁Q₁、w＝P₂Q₂。由 P₁R＝4u，Q₁ 在 P₁R 上、離 P₁ 一個 u，所以 Q₁＝R−3u。
    同理 P₂R＝7w ⇒ Q₂＝R−6w。
    Q₁Q₂＝Q₂−Q₁＝3u−6w＝3P₁Q₁−6P₂Q₂
    15-1＝3、15-2＝−、15-3＝6
mb113-08:
  key: 設公比 r＞1：看每個新數列「後項÷前項」是不是固定的數。
  explain: |
    (1) a, −b, c, −d, e 的公比是 −r ✓
    (2) 倒過來排，公比是 1/r ✓
    (3) log a, log b, … 是等差數列（公差 log r），一般不是等比；例如 a＝1 時首項是 0 ✗（全國 23% 誤選）
    (4) 3ᵇ÷3ᵃ＝3^(b−a)，但 a、b、c 是等比不是等差，b−a≠c−b，所以不是等比 ✗（全國 33% 誤選）
    (5) bcd÷abc＝d/a＝r³，cde÷bcd＝e/b＝r³ ✓
    → 答案 (1)(2)(5)
mb113-10:
  key: 相向而行時速率相加：120÷15＝8 秒第一次相遇；A 來回一趟 48 秒、B 24 秒，48 秒後兩點都回到起點。
  explain: |
    設 A 從 0 cm 端出發（每秒 5 cm），B 從 120 cm 端出發（每秒 10 cm）。
    (1) 8 秒後相遇，A 走了 40 cm，距 A 的起點 40 cm ✓
    (2) A 來回一趟 240÷5＝48 秒，週期是 48 秒 ✗（全國 38% 誤選）
    (3) A 在 48 秒的倍數回到起點；B 的週期 240÷10＝24 秒，48 秒時也剛好回到起點 ✓
    (4) 12 秒時 B 到 0 cm 折返，之後兩點同向右走，B 在 24 秒時追上 A，兩點同時在 120 cm 的端點 ✓
    (5) 一個週期（48 秒）內在 8、24、40 秒相遇，位置是 40、120、40 cm，只有 2 個不同位置 ✗（全國 32% 誤選）
    → 答案 (1)(3)(4)
mb112-08:
  key: B 廣告在第 T、3T、5T……分鐘開始，所以 30＝(奇數)×T。
  explain: |
    A 在 0、2T、4T… 分鐘開始，B 在 T、3T、5T…（T 的奇數倍）開始。
    30 分鐘時 B 開始 ⇒ 30÷T 是奇數 ⇒ T＝30、10、6、2。
    (1) 15：30÷15＝2，是偶數，會看到 A ✗（全國 19% 誤選）
    (2) 10：30÷10＝3 ✓
    (3) 8：30 不是 8 的倍數 ✗
    (4) 6：30÷6＝5 ✓
    (5) 5：30÷5＝6 是偶數 ✗（全國 23% 誤選）
    → 答案 (2)(4)
mb111-02:
  key: 一個循環「藍 5＋白 2＋紅 6＋白 2」＝15 秒；99、101 除以 15 的餘數是 9、11，都落在紅燈的 7～13 秒。
  explain: |
    一個循環 15 秒：藍 0–5、白 5–7、紅 7–13、白 13–15。
    99＝6×15＋9，101＝6×15＋11，對應循環中的第 9–11 秒，都在紅燈（7–13 秒）→ 答案 (3)
mb112-14:
  key: a＋c＝2b ⇒ a、c 同奇偶；只要選好 a、c，b 就決定了。
  explain: |
    a、b、c 成等差 ⇔ b＝(a＋c)/2，必須是整數 ⇒ a、c 同為奇數或同為偶數。
    1–20 中奇數、偶數各 10 個：C(10,2)＋C(10,2)＝45＋45＝90
    （a＜c 已由「從兩個數中取小的當 a」決定，不用再乘 2）
    14-1＝9、14-2＝0
mb113-12:
  key: 每一格都有兩個方向會出界（留在原地，機率 1/2）、兩個方向各到一個相鄰格（各 1/4）；A、D 不相鄰，B、C 也不相鄰。
  explain: |
    從任一格：停在原地 1/2，走到兩個相鄰格各 1/4。相鄰關係：A–B、A–C、B–D、C–D。
    n＝1：a₁＝1/2、b₁＝c₁＝1/4、d₁＝0
    n＝2：a₂＝3/8、b₂＝c₂＝1/4、d₂＝1/8
    (1) b₁＝1/4 ✓
    (2) b₂＝1/4，不是 1/8 ✗（全國 35% 誤選）
    (3) a₂＋d₂＝1/2 ✗（全國 27% 誤選）
    (4) 棋盤對 A–D 對角線對稱，B、C 的地位相同，機率永遠相等 ✓
    (5) 在 {A, D} 時一半機率留下、一半到 {B, C}；在 {B, C} 時也一半機率到 {A, D}。所以 n≥1 時 aₙ＋dₙ 恆為 1/2，不會大於 1/2 ✗（全國 37% 誤選）
    → 答案 (1)(4)
mb113-14:
  key: 只考 A＝3/10 是「考 A 的人」的 3/8 ⇒ 考 A 的人占 4/5；只考 B＝1−4/5＝1/5，考 B 的人＝1/2＋1/5＝7/10。
  explain: |
    設全體為 1。考 A 的人中 5/8 也考 B，所以只考 A 占考 A 的人的 3/8：
    考 A 的人＝(3/10)÷(3/8)＝4/5；兩科都考＝(4/5)×(5/8)＝1/2
    每個人至少考一科 ⇒ 只考 B＝1−4/5＝1/5
    考 B 的人＝1/2＋1/5＝7/10
    只考 B 在考 B 的人中占 (1/5)÷(7/10)＝2/7：14-1＝2、14-2＝7
mb112-05:
  key: 條件中只要包含 7，機率就是 1÷（符合條件的球數）；範圍越小機率越大。
  explain: |
    (1) 奇數 50 顆 → 1/50
    (2) 質數 25 顆 → 1/25
    (3) 7 的倍數 14 顆 → 1/14
    (4) 不是 5 的倍數 80 顆 → 1/80
    (5) 小於 10 的只有 9 顆 → 1/9，最大 → 答案 (5)
mb112-04:
  key: 29 人：第 25、50、75、95 百分位數分別是第 8、15、22、28 小的成績；前 15 名是第 15～29 小的人。
  explain: |
    n＝29：29×0.25＝7.25 → 第 8 位；29×0.5＝14.5 → 第 15 位；29×0.75＝21.75 → 第 22 位；29×0.95＝27.55 → 第 28 位（由小到大）。
    成績較高的前 15 名是由小到大第 15～29 位，加 5 分後順序不變。
    第 8 位不變：41；第 15、22、28 位都加 5：65、79、97
    (a,b,c,d)＝(41,65,79,97) → 答案 (3)
    易錯：第 50 百分位數（第 15 位）剛好在加分範圍的邊界上。
mb113-07:
  key: 城市最高溫＝兩區較高者：東區每天都至少 24 ℃ ⇒ A＝0；只有東區會到 36 ℃ ⇒ D＝5；B 最多 11。
  explain: |
    每天取兩區的較大值：
    東區沒有低於 24 ℃ 的日子 ⇒ 城市每天都至少 24 ℃，A＝0。
    西區從未到 36 ℃，東區有 5 天 ⇒ D＝5。
    城市落在 24–30 ℃ 必須東區也在 24–30 ℃（只有 11 天）⇒ B≤11，C＝25−B。
    (3) (0,9,16,5)：B＝9≤11 ✓，可能 → 答案 (3)
    (5) B＝12＞11 ✗；(1) D≠5 ✗；(4) A≠0 ✗
    (2) (3,12,15,5) 的天數加起來是 35，超過一個月的 30 天（全國 47% 誤選）。
mb113-03:
  key: 算出射擊線在 y＝5、y＝6 時的 x 坐標，看有沒有落在牆 AB（10≤x≤15）或牆 CD（0≤x≤9）上。
  explain: |
    射擊線從 Q(x₀,y₀) 到 P(12,10)，高度 y 時的 x＝x₀＋(12−x₀)(y−y₀)/(10−y₀)。
    (1) Q(6,3)：y＝6 時 x≈8.57，撞到 CD ✗
    (2) Q(7,3)：y＝5 時 x≈8.43（在 AB 左邊）；y＝6 時 x≈9.14（在 D 右邊），兩面牆都避開 ✓
    (3) Q(8,5)：y＝6 時 x＝8.8，撞到 CD ✗（全國 11% 誤選）
    (4) Q(9,1)：y＝5 時 x≈10.33，撞到 AB ✗
    (5) Q(9,2)：y＝5 時 x＝10.125，撞到 AB ✗
    → 答案 (2)
mb112-11:
  key: 與兩軸都相切 ⇒ |b|＝a＝半徑；代入 PA＝a＋c，b＝−a 會得 a＝c（不合），所以 b＝a，且 2(a−c)²＝(a＋c)²。
  explain: |
    圓與兩軸相切 ⇒ 半徑＝a＝|b|。
    若 b＝−a：(a−c)²＋(a＋c)²＝(a＋c)² ⇒ a＝c，與 a＞c 矛盾。所以 b＝a。
    (a−c)²＋(a−c)²＝(a＋c)² ⇒ √2(a−c)＝a＋c
    (1) a＝b ✓
    (2) P(c,c) 在直線 y＝x 上，不在 x＋y＝0 上 ✗（全國 31% 誤選）
    (3) PA＝a＋c＞a＝半徑，P 在圓外 ✗（全國 49% 誤選）
    (4) (a＋c)/(b−c)＝(a＋c)/(a−c)＝√2 ✓
    (5) a/c＝(√2＋1)/(√2−1)＝3＋2√2，不是 2＋3√2 ✗（全國 54% 誤選）
    → 答案 (1)(4)。全對的只有 8%。
mb112-16:
  key: 把 O 摺到 P，摺痕就是 OP 的中垂線：3x＋4y＝25，與兩邊界交於 (25/3, 0)、(0, 25/4)。
  explain: |
    以 O 為原點，P＝(6,8)，OP 中點 (3,4)。
    摺痕是 OP 的中垂線：6(x−3)＋8(y−4)＝0 ⇒ 3x＋4y＝25
    與下邊界交於 (25/3, 0)，與左邊界交於 (0, 25/4)。
    摺進去的三角形就是這兩點和 O 圍成的直角三角形：面積＝(1/2)×(25/3)×(25/4)＝625/24
    16-1＝6、16-2＝2、16-3＝5
mb113-16:
  key: A 在北緯 60°（z＝√3＝2sin60°）；赤道上離 A 最遠的點在 A 的經度加 180°，兩點夾角 30°＋90°＝120°。
  explain: |
    半徑 2。A＝(√3/2, 1/2, √3)：z＝2sin60°，緯度 60°N；經度方向是 30°。
    赤道上離 A 最遠的點在經度 30°＋180°＝210°：P＝(−√3, −1, 0)。
    A、P 在同一個經線大圓上，從 A 往北到北極 30°，再往下到赤道 90°，夾角 120°。
    驗算：cos∠AOP＝(A·P)÷4＝(−3/2−1/2)÷4＝−1/2 ⇒ 120°
    劣弧長＝2×(2π/3)＝4π/3：16-1＝4、16-2＝3
mb112-12:
  key: 經線是半個大圓（長 πR）；緯度 θ 的緯線長 2πR·cosθ；沿經線走 1° 和沿赤道走 1° 一樣長。
  explain: |
    (1) 赤道長 2πR；東經 0°、180° 經線各是半個大圓 πR，合計 2πR ✓
    (2) 北緯 45° 線長 2πR·cos45°＝(√2/2)×赤道，不是 1/2 ✗（全國 45% 誤選）
    (3) A→B 沿赤道 60°；D（北緯 30°）→北極沿經線也是 60°，都是大圓上 60° 的弧 ✓
    (4) 沿北緯 30° 線走半圈＝πR·cos30°≈2.72R；經北極走 60°＋60°＝(2π/3)R≈2.09R，不相等 ✗（全國 45% 誤選）
    (5) 設 R＝1：北極 (0,0,1)、A(1,0,0)、C(0,1,0)，兩直線方向 (1,0,−1)、(0,1,−1)，內積 1≠0，夾 60°，不垂直 ✗（全國 52% 誤選）
    → 答案 (1)(3)
mb112-07:
  key: 牆上是拋物線 ⇒ 牆與圓錐的一條母線平行（圖中下緣的母線是鉛直的）；地板和軸的夾角 60° 大於半頂角 30°，截出橢圓。
  explain: |
    光錐的頂角 60°，半頂角 30°。牆上的邊緣是拋物線，表示牆面平行於某一條母線（圖中下緣那條母線是鉛直的），所以錐軸與鉛直方向夾 30°。
    錐軸垂直於 L，地板是水平面，所以錐軸與地板夾 90°−30°＝60°。
    平面與錐軸的夾角比半頂角大（60°＞30°）→ 截出橢圓；又不是與軸垂直（不是 90°）→ 不是圓。
    → 答案 (4)
    (3) 拋物線要平面和母線平行，地板不是（全國 42% 誤選）。
mb111-06:
  key: 弧長 (7/12)πr ⇒ 圓心角 7π/12＝105°；往北走 105° 才到北極，所以起點在赤道以南 15°。
  explain: |
    沿經線（大圓）走的弧長＝r×圓心角 ⇒ 圓心角＝7π/12＝105°。
    北極在北緯 90°，往回推 105° 得 90°−105°＝−15°，即南緯 15°；經度不影響。
    選項中南緯 15° 的是東經 75°、南緯 15° → 答案 (3)
mb111-05:
  key: A²＝2I，所以 A⁷＝(A²)³A＝8A，A⁷−3A＝5A。
