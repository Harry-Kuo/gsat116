# 社會 Day 8–14 解析（Claude 撰寫；地圖、照片、漫畫題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）

# ---------- Day 8 ----------
soc114-02:
  key: 立法院對行政院長的課責手段是「不信任案」；彈劾公務員是監察院的職權。
  explain: |
    依憲法增修條文，立法院可以對行政院長提出不信任案，要求內閣負政治責任 → (D) ✓
    (A) 罷免是選民對民選公職人員行使的權利，行政院長不是民選，立法院不能罷免。
    (B) 立法院可以審議、刪減預算，但行政院長由總統任命，立法院不能「重新任命」。
    (C) 彈劾失職的公務人員是監察院的職權；立法院只能對總統、副總統提出彈劾案（全國 41% 誤選）。
soc114-06:
  key: 外國觀光客在臺消費是臺灣的勞務出口，計入 GDP；其他三項都不是臺灣這一年新生產的財貨與勞務。
  explain: |
    GDP 是一國在一定期間內，國內生產的最終財貨與勞務的市場價值。
    (乙) 國外粉絲來臺觀光，在臺灣吃住、消費，是臺灣提供給外國人的勞務（勞務出口）→ 增加臺灣的 GDP ✓
    (甲) 付給外國團體的高價酬勞，是向國外購買演出勞務，屬於外國團體的所得。
    (丙) 黃牛票是既有票券的轉手交易，不是新的生產（也是不合法的地下交易）。
    (丁) 紀念品是團體從國外帶來、免費發送，沒有國內的生產與市場交易。
soc114-08:
  key: 光復初期推行國語（丙）→ 戡亂時期強化軍訓與政治教育（甲）→ 1968 年九年國教（乙）→ 1990 年代推動大學自治（丁）。
  explain: |
    題目依序列出四個階段，各配一種做法：
    滌除日本文化思想 → (丙) 推行國語教育（戰後初期成立國語推行委員會）
    戡亂建國 → (甲) 強化軍事訓練與政治教育（1950 年代）
    提升國民素質 → (乙) 實施九年國民義務教育（1968 年）
    教育鬆綁、尊重多元 → (丁) 推動大學自治（1990 年代教育改革）
    所以順序是 (D) 丙甲乙丁 ✓
    (B) 甲丙乙丁（全國 35% 誤選）：把強化軍訓與政治教育放在推行國語之前；戰後初期是先推行國語，1950 年代才強化軍訓。
soc114-33:
  key: 臺灣議會設置請願運動要求在臺灣設立「民選」議會，審議臺灣的特別法律（律令）與預算。
  explain: |
    1920 年代的臺灣議會設置請願運動，主張由臺灣住民選出議員組成臺灣議會，對總督發布的律令與臺灣的預算有審議權 → (C) ✓
    (A) 由殖民政府遴選議員，不是民選 ✗
    (B) 選代表到日本帝國議會，是「同化、內地延長」的路線，請願運動要在臺灣自己設議會 ✗（全國 16% 誤選）
    (D) 爭取與日本本土相同權利也屬於同化路線；請願運動強調臺灣的特殊性（全國 29% 誤選）✗
soc114-34:
  key: 總督府不把行政救濟制度施行於臺灣，人民不服警察禁止結社，只能「投訴無門」。
  explain: |
    題文：「統治者不願將日本本土的行政救濟制度施行於臺灣，人民無從透過行政訴訟對抗政府」；參與者不服警察禁令又投訴無門 → (A) 不滿禁止結社的處分，卻無法向司法機關請求救濟 ✓
    (B) 一審法院判被告全數無罪，論者認為法院「仍有依法審判空間」，不能說司法完全聽命於行政權 ✗
    (C) 題文沒有提到日本憲法的權利只有母國人民享有；臺灣人仍可行使請願權（全國 28% 誤選）✗
    (D) 期成同盟會被禁是依《治安警察法》，不代表臺灣人完全沒有結社權 ✗

# ---------- Day 9 ----------
soc114-17:
  key: 宋元的公憑、琉球與暹羅的咨文、與舊港華人的文書都用漢字 → 漢字是東亞海上貿易長期通用的文字。
  explain: |
    宋元時期出海要有漢字的「公憑」，也是東亞各港口驗證商船的依據；明代琉球國王用漢字咨文和暹羅往來，官員也用漢字文書和舊港的華人領袖聯繫。
    可見東亞港口長期通行漢字，已經是慣例 → (C) ✓
    (A) 琉球和暹羅之間也用漢字，不是中國政府強制的 ✗
    (B) 題文沒有提到漢字難以竄改 ✗
    (D) 暹羅等國的官員不一定是華人，題文只說舊港有華人領袖（全國 23% 誤選）✗
soc114-18:
  key: 人口持續增加、人口轉型停在早期階段 → 出生率一直很高；戰亂與失業不會讓移入率維持高點。
  explain: |
    某國人口持續增加，但戰亂不斷、經濟沒有成長、失業率高，人口轉型停留在「高出生率、死亡率下降」的階段。
    一直維持在高點的是 (A) 出生率 ✓
    (B) 死亡率若一直很高，人口不容易持續增加（全國 19% 誤選）；(C) 移出率高會讓人口減少；(D) 戰亂與高失業不會吸引大量移民移入。
soc114-19:
  key: 這裡是澎湖：玄武岩台地低平攔不住水氣所以雨少，日照長、蒸發強所以缺水。
  explain: |
    「廈門至鹿耳門舟船往來的必經要道」是澎湖。澎湖農業不佳的環境原因：
    甲：澎湖是玄武岩熔岩台地，地勢低平，攔截不到水氣，降雨少 ✓
    丁：日照時數長、蒸發旺盛，容易嚴重缺水 ✓
    乙：澎湖風最強的是冬季東北季風，作物多在春夏生長，並不是作物生長季風勢最強 ✗
    丙：澎湖沒有沼澤密布的現象 ✗
    所以是 (B) 甲丁 ✓
    (A) 甲乙（全國 36% 誤選）：只想到澎湖風大，但風最強的季節不是作物生長季。
soc114-35:
  key: 牡蠣養在潮間帶與潟湖，颱風的強風暴雨會沖毀蚵架、破壞養殖環境。
  explain: |
    〈青蚵嫂〉唱的是養蚵、剝蚵的婦女；牡蠣多養在西南沿海的潮間帶與潟湖。
    颱風帶來強風、暴雨與大浪，最容易毀損潮間帶的蚵架 → (D) ✓
    (A) 土石流是山區的災害 ✗ (B) 潟湖的海水量主要受潮汐影響，不是梅雨 ✗（全國 16% 誤選）(C) 蚵架不在礁岩海岸 ✗
soc114-36:
  key: 青蚵嫂接受「命運寄託於婚姻」的規範，同時肯定自己的本事、改善生活 → 規範雖然框限個人，仍有突破的空間。
  explain: |
    學者訪談發現：青蚵嫂一方面覺得命運寄託於婚姻（傳統規範的框限），一方面肯定自己剝蚵本事好、多少改善了生活，學者認為女性能在傳統體制下發揮主體性、創造希望。
    這凸顯社會規範會框限個人，但並不能完全杜絕突破的空間 → (D) ✓
    (B) 題文沒有比較不同時空下規範的內涵（全國 30% 誤選）✗
    (A) 題文重點不是資源分配 ✗ (C) 題文沒有說規範本身發生轉變 ✗

# ---------- Day 10 ----------
soc114-20:
  key: 孟加拉灣屬於印度洋；鄰近印度洋、又和美日合作的是印度和澳洲（美日印澳四方合作）。
  explain: |
    「鄰近孟加拉灣及其所屬大洋」：孟加拉灣屬於印度洋，印度濱臨孟加拉灣，澳洲西岸濱臨印度洋。
    美國、日本、印度、澳洲是維護「自由開放印太」的四方合作夥伴 → (C) 印度、澳大利亞 ✓
    (A) 菲律賓面向太平洋與南海，不在印度洋（全國 43% 誤選）✗
    (B)(D) 紐西蘭在南太平洋 ✗
soc114-22:
  key: 從日治糖業鐵道寫到 1990 年代農場轉為科學園區、外銷作物與觀光鐵道 → 糖業地景在全球化下的變遷。
  explain: |
    題文的重點：日治時期糖業鐵道運甘蔗、糖輸往海外；1990 年代起，農場土地轉作科學園區、改種毛豆等外銷作物，糖業鐵道轉為觀光。
    這是糖業相關的土地與鐵道（地景）在全球化下的轉變 → (C) ✓
    (D) 題文沒有提到知識經濟，也不是談糖業本身的產業系統如何轉變，而是土地與鐵道轉作他用（全國 46% 誤選）✗
    (A) 只談國際貿易，忽略了土地利用的變遷 ✗ (B) 題文沒有提到分工與標準化 ✗
soc114-23:
  key: 零組件到整車都集中在曼谷北側，吸引更多大廠進駐 → 聚集經濟；1980 年以前的組裝才是進口替代。
  explain: |
    1990 年代後，曼谷北側聚集了許多汽車相關產業，從零組件到整車都能完成，因而吸引國際大廠投資 → 相關產業集中、降低成本 → (C) 聚集經濟 ✓
    (A) 進口替代是 1980 年以前以減稅促成在地組裝汽車、取代進口（全國 14% 誤選）✗
    (B) 工業慣性是產業因既有設備而不遷移（全國 16% 誤選）✗ (D) 產品生命週期與題文無關 ✗
soc114-37:
  key: 「進口布不如進口紗，進口紗不如進口棉花」→ 進口原料、在國內紡紗織布，就是 1950 年代的「代紡代織」。
  explain: |
    資料一：戰後初期政府保護、扶植紡織業，主張進口原料（棉花）而不是進口成品（布）。
    1950 年代政府把美援棉花交給民間紡織廠「代紡代織」，建立紡織工業的基礎 → (A) ✓
    (D) 開放布料進口，正好和「進口布不如進口紗」相反（全國 21% 誤選）✗
    (B) 題文重點不是擴大工廠規模（全國 19% 誤選）✗ (C) 田賦徵實是徵收稻穀，和種棉花無關 ✗
soc114-38:
  key: 三則資料依序是政策扶植奠基、外移與低價進口的困境、轉型做機能布出口 → 產業困境與轉型。
  explain: |
    資料一：戰後政府扶植紡織業；資料二：1988 年工廠外移、進口廉價布，市場供過於求；資料三：老字號轉型經營機能性布料出口。
    主題是臺灣紡織業的困境與產業轉型 → (B) ✓

# ---------- Day 11 ----------
soc114-24:
  key: 洞頂垂下鐘乳石、地面有石筍 → 石灰岩被水溶蝕形成的洞穴，和墾丁的溶蝕地形成因相同。
  explain: |
    照片中的洞穴有鐘乳石、石筍，是石灰岩被含二氧化碳的水溶蝕形成的喀斯特地形（猶加敦半島是石灰岩地區）。
    臺灣墾丁的珊瑚礁石灰岩也有溶蝕地形 → (B) ✓
    (A) 柱狀節理是玄武岩熔岩冷卻收縮形成（全國 21% 誤選）✗ (C) 海蝕地形由海浪侵蝕 ✗ (D) 環礁由珊瑚生長堆積 ✗
soc114-26:
  key: 把用過的漁網再製成購物袋，讓廢棄資源回到新的產業系統，正是循環經濟。
  explain: |
    循環經濟：把使用過的資源重新導入新的產業系統，減少廢棄物 → (A) 清理好的漁網尼龍紗再製成環保購物袋 ✓
    (B) 汽車共乘是減少塞車與排碳 ✗ (C) 企業群聚是聚集經濟 ✗ (D) 降低消費與生產是「減量」，不是讓資源循環再利用 ✗
soc114-27:
  key: 題文從「體制」解釋：英國殖民地帶來保障個人財產權的制度，鼓勵投資，原本人口稀少的北美、澳紐反而快速成長。
  explain: |
    某書的說法：北美、澳紐原本人口稀少、技術落後，被殖民後快速成長；中南美洲人口密集，被殖民後卻發展遲緩。
    (A) 英國法制重視個人財產權，有助繼承這套制度的北美、澳紐人民勇於投資 → 用「體制」解釋發展差異 ✓
    (B) 若中南美洲擁有較多企業，應該發展較好，無法解釋發展遲緩（全國 43% 誤選）✗
    (C) 題文說中南美洲人口相對密集，不是缺乏勞力 ✗
    (D) 古文明地區人口密集，代表環境能養活較多人，不是負載力較低 ✗
soc114-28:
  key: 沙烏地阿拉伯（遜尼派）與伊朗（什葉派）長期爭奪區域影響力；伊朗支持敘利亞政府，沙國就支持反政府勢力。
  explain: |
    伊朗和俄羅斯支持敘利亞政府；沙烏地阿拉伯與伊朗在宗教（遜尼派與什葉派）和區域勢力上長期對立。
    沙國資助反政府聯盟，是不願伊朗透過敘利亞擴大勢力 → (C) ✓
    (A) 底格里斯河從土耳其流經伊拉克，不經過沙國 ✗
    (B) 敘利亞不臨波斯灣（全國 27% 誤選）✗
    (D) 庫德族主要分布在土耳其、伊拉克、伊朗、敘利亞，不在沙國 ✗
soc114-31:
  key: 蘇伊士運河縮短航程、降低運輸成本，歐洲人擴大東南亞熱帶栽培業，需要大量人手，才吸引華人移入。
  explain: |
    題文：蘇伊士運河打通西歐與東亞的新航路，歐洲人在東南亞大力發展熱帶栽培業，需要許多人手種植、管理、加工與運輸，使新加坡華人人口迅速上升。
    → (D) 運輸成本降低活絡貿易，帶來更多勞動需求 ✓
    (A) 行政首府不是華人移入的原因（全國 16% 誤選）✗ (B) 題文沒有提到栽種技術領先（全國 16% 誤選）✗ (C) 華人並不是以草原耕作著稱，熱帶栽培業也不在草原 ✗

# ---------- Day 12 ----------
soc114-39:
  key: 1950 年美蘇對峙，右邊穿軍服、有星星標誌的大人代表蘇聯；被壓在他膝下的是受其控制的東歐。
  explain: |
    漫畫發表於 1950 年（冷戰時期）：左邊是西裝的西方政治人物（代表美國與民主陣營），右邊是穿軍服、有紅星的蘇聯領導人（代表共產集團），兩人用放大鏡檢視歐洲各國。
    被壓制在蘇聯膝下的，是戰後被蘇聯控制的東歐國家 → (B) ✓
    (A) 1950 年軸心國早已戰敗，不會有「同盟國與軸心國」兩位大人 ✗
    (C) 殖民地解放時期（全國 17% 誤選）、(D) 西歐重建時期，時代與被壓制的地區都不合 ✗
soc114-40:
  key: 煤、鋼共同管理、成員國間免關稅取得原料 → 西歐各國在經濟上相互依賴、合作，就是區域互賴。
  explain: |
    法國提出把西歐各國的煤、鋼等重要工業資源共同管理，成員國間不必繳關稅就能取得原料 → 各國資源互通、相互依賴 → (C) 區域互賴 ✓
    (A) 核心邊陲講的是中心與周邊地區的不平等關係 ✗ (B) 地緣樞紐是戰略位置 ✗ (D) 中地體系談的是聚落的服務範圍與層級 ✗
soc114-41:
  key: 東歐國家加入歐盟後，可取得歐盟的補助與西歐企業的投資，產業資金來源擴大。
  explain: |
    2004 年東歐多國加入歐盟，可以取得歐盟的發展補助，也能吸引西歐企業前往投資 → (B) 擴大東歐國家產業資金來源 ✓
    (A) 歐元在 1999 年啟用、2002 年發行現金，和 2004 年東擴無關 ✗
    (C) 西歐國家之間早已透過申根協定免簽通行 ✗
    (D) 東歐國家多半不是石油輸出國（全國 17% 誤選）✗
soc114-42:
  key: 英國與歐盟談判的是移民、國際貿易、跨國金融，都是全球化帶來的跨國治理問題，不只是自由貿易。
  explain: |
    題文：英國公投退出歐盟，並就移民、國際貿易、跨國金融與歐盟談判。這些都是全球化下人員、商品、資金跨國流動所產生的治理問題 → (A) ✓
    (B) 談判範圍包括移民與金融，不只自由貿易，而且是和歐盟談判（全國 51% 誤選）✗
    (C) 題文沒有提到本土文化受到衝擊 ✗
    (D) 英國脫歐正是要自己管理移民，不是繼續適用歐盟的移民政策 ✗
soc114-07:
  key: 噶瑪蘭是宜蘭的舊稱（清代設噶瑪蘭廳）；族人南遷花蓮後，1878 年與清軍爆發加禮宛事件，2002 年正名。
  explain: |
    線索：族名曾是地名雅化後的行政區名（清代的噶瑪蘭廳，就是今天的宜蘭）；十九世紀因原鄉土地流失遷入花蓮平原；與清軍爆發加禮宛戰役，失敗後多移居東海岸、與阿美族混居；後來正名成功，但宜蘭原鄉許多族人受限法令，未能取得原住民族身分。
    → (C) 噶瑪蘭族 ✓
    (B) 太魯閣族是 1914 年與日本發生太魯閣戰役，也不曾以地名雅化的行政區為名（全國 33% 誤選）✗
    (A) 布農族 ✗ (D) 西拉雅族分布在臺南一帶，至今仍在爭取法定身分，但沒有加禮宛戰役 ✗

# ---------- Day 13 ----------
soc114-43:
  key: 問題出在 AI 的訓練素材本身有偏頗；由該國提供自己的資料庫給國際訓練 AI，才能從源頭修正偏見。
  explain: |
    題文開頭說明：AI 仰賴大量素材學習，若素材本身偏頗，AI 的答案就會強化偏頗。
    乙指出的問題是 AI 把某國人民視為潛在恐怖分子，使他們在國際上受到不公平對待。要解決，得改善 AI 的訓練素材 → (C) 發展本國資料庫以提供國際訓練 AI 的數據 ✓
    (A) 教育本國國民，改變不了國際上的 AI 與他國對該國的偏見（全國 35% 誤選）✗
    (B) 本國的法規管不到國際上的 AI ✗
    (D) 監測頻率只能了解問題，不能解決（全國 22% 誤選）✗
soc114-44:
  key: AI 因為膚色認定再犯風險較高，是依種族做差別待遇，牴觸平等原則。
  explain: |
    丙指出：用 AI 評估受刑人再犯風險時，AI 會認定有色人種的再犯風險較高 → 同樣的情況卻因種族而受到不同對待 → (A) 平等原則 ✓
    (B) 比例原則是手段與目的要相當 ✗ (C) 誠實信用原則 ✗ (D) 信賴保護原則是保障人民對法規的合理信賴 ✗
soc114-45:
  key: 丁要「讓 AI 產品反映其潛在成本」，也就是把耗電耗水的外部成本內部化，課徵碳稅最符合。
  explain: |
    丁指出 AI 伺服器耗電量高、又用大量水降溫，主張從社會福祉的角度，讓 AI 產品反映其潛在成本 → 讓使用者負擔外部成本 → (B) 對導入 AI 的廠商課徵碳稅 ✓
    (A) 開發綠能供 AI 用電，並沒有讓 AI 產品反映成本（全國 34% 誤選）✗
    (C) 補貼水費讓 AI 成本更低，正好相反 ✗ (D) 外包運算系統只是把耗能轉移到別處 ✗
soc114-47:
  key: 學生建立社群、舉辦活動，靠的是集會、結社與表現自由；反核團體的靜坐與遊行也是集會自由。
  explain: |
    學生在校園建立原住民族社群、舉辦原住民族週活動 → 運用的是結社、集會與表現的自由。
    (A) 反核團體靜坐抗議、集會遊行 → 同樣是集會自由 ✓
    (B) 接受提名、參與選舉 → 參政權 ✗
    (C) 透過訴訟爭取登記 → 訴訟權（全國 46% 誤選）✗
    (D) 公民投票 → 參政權 ✗
soc114-48:
  key: 「需要一個能看見彼此、相互共鳴的原住民族社群，一起打造美好未來」→ 凝聚身分認同與行動力。
  explain: |
    學生說主流社會否定他們的存在、看不見他們，所以需要一個能看見彼此、相互共鳴的社群，一起打造美好未來 → (D) 凝聚原住民族群體身分肯認與行動力 ✓
    (C) 要求國家政策平等尊重（全國 12% 誤選）：學生的話重點在群體內部的認同與行動，不是向國家提出政策要求。

# ---------- Day 14 ----------
soc114-59:
  key: 機械化大量生產讓產量大增、平均成本降低（規模經濟）；超市增加商品數量與服務項目，也是擴大經營規模來獲利。
  explain: |
    題文：美國大量使用機械化農耕，產量大增、獲利豐厚。這是靠擴大生產規模、降低平均成本來獲利。
    (C) 超市增加麵包、咖啡、飯盒等商品的販售數量，並增加服務項目 → 同樣是擴大經營規模 ✓
    (A) 溫室精緻栽培、創立品牌，是走精緻化與差異化，不是大量生產（全國 26% 誤選）✗
    (B) 以原有技術進口低價石材加工，重點在原料成本與轉型 ✗
    (D) 外包到低薪地區，是降低勞動成本 ✗
soc114-60:
  key: 漫畫中世界各國都等著吃美國的農畜產品：美國產量大、需要海外市場，所以主張各國開放市場、推行自由貿易。
  explain: |
    圖 7：美國大廚端出大量牛肉、豬肉、玉米，英國人拿著「美國餐廳菜單」，其他亞、歐、美洲客人都渴求美國產品 → 美國農畜產品需要外銷市場，希望各國開放 → (D) 推行自由貿易 ✓
    (B) 建立關稅壁壘是保護國內市場，和擴大出口相反（全國 13% 誤選）✗
    (A) 門羅主義是反對歐洲干涉美洲 ✗ (C) 劃分勢力範圍是列強在中國的做法，美國反而提出門戶開放 ✗
soc114-50:
  key: 史家把殖民者羅德比作南非的華盛頓、林肯，說南非歷史大多由他書寫，是站在西方殖民者的立場看歷史。
  explain: |
    資料一：羅德堅信英國人是世界上最優秀的種族，擴張殖民對人類有好處。資料二：史家把羅德比作華盛頓、林肯，說十九世紀末的南非史大部分由他書寫。
    這種評述以殖民者為歷史的主角，忽略了非洲人民 → (D) 反映西方中心主義 ✓
    (A) 反對帝國主義、(B) 實踐民族自決（全國 15% 誤選）、(C) 支持廢奴：史家是在推崇殖民者羅德，都不合 ✗
soc114-54:
  key: 一田一主讓產權明確，企業購地只要和一位業主交易，減少協商、查證與糾紛 → 交易成本降低。
  explain: |
    清代的大小租制是一田多主，土地利益不明確、容易起糾紛；日治初期總督府買下大租權，改為「一田一主」，解決了產權不明的問題。
    日資企業購地時，只要和一位業主交易，查證、協商與日後糾紛的成本都減少 → (C) 降低交易成本 ✓
    (A) 外部成本是交易雙方以外的第三者所承擔的成本（例如污染），產權明確化降低的是交易成本（全國 38% 誤選）✗
soc114-62:
  key: 唐朝的施粥給藥出於「愛民如子」的悲憫與恩惠；現代社會救助是國家保障人民生存權的責任。
  explain: |
    題文：唐朝官府「懷抱愛民如子之心」施粥救飢、給藥治病，也有民間施恩救苦 → 出於悲憫、恩惠。
    現代的社會救助則是依法保障人民的基本生存，是人民的權利、國家的責任 → (A) ✓
    (B) 現代社會救助也包含災害救助與急難救助，不只解決貧窮（全國 26% 誤選）✗
    (C) 社會救助的對象是符合資格的低收入戶與急難者，不是所有公民（全國 23% 誤選）✗
    (D) 現代社會救助由政府依法主導，不是第三部門主導 ✗
