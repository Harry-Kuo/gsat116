sci113-22:
  key: 光子能量 $E=hf$，20 MeV 的光子頻率是 4 MeV 的 5 倍；圖上只有兩條 X 光曲線延伸到 15 公分以後。
  explain: |
    (C) $E=hf$，能量 5 倍 → 頻率 5 倍 ✓
