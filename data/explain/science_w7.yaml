    (C) 4 MeV X 光雖在 0～2 公分劑量高，但會一路穿透到深處，傷害後面的正常細胞；同樣深度用電子束較好（全國 41% 誤選）✗
    (E) 電子束約 2 公分就停止，到不了 3～8 公分（全國 10% 誤選）✗
    (A) 電子束到不了 10 公分深（全國 6% 誤選）✗

# ---------- Day 44：化學計量與熱化學、代謝與能量、地質與地球歷史 ----------
sci113-10:
  key: $\mathrm{CO_2:H_2O}$ 質量比 11：3 → 莫耳比 $\dfrac{11}{44}:\dfrac{3}{18}=3:2$ → C：H＝3：4 → 只有丁（C₆H₈O₆）符合。
  explain: |
    CO₂ 的莫耳數 $=\dfrac{11}{44}=0.25$，H₂O 的莫耳數 $=\dfrac{3}{18}\approx0.167$ → 比為 3：2。
    每個 CO₂ 含 1 個 C、每個 H₂O 含 2 個 H → C：H＝3：(2×2)＝3：4。
    丁 C₆H₈O₆ 的 C：H＝6：8＝3：4 (D) ✓
    其他：甲 19：19、乙 20：30、丙 28：44、戊 29：50，都不是 3：4（(C) 全國 13% 誤選）。
sci113-02:
  key: 甲最適溫約 25°C、乙約 18°C；平地 16～29°C 較適合甲；平地冬天約 17°C 正好接近乙的最適溫，光合作用較旺、消耗 CO₂ 較多。
  explain: |
    由圖 2：乙在 18°C 附近效率最高，溫度高時下降很快；甲在 25°C 左右最高，低溫時效率差。
    (C) 平地全年較暖（16～29°C），比山地（12～24°C）更適合甲 ✓
    (D) 平地冬天約 16～18°C，接近乙的最適溫度；夏天約 29°C，乙的效率只剩約 0.55 → 乙冬天行光合作用消耗的 CO₂ 較多 ✓
    (E) 甲在冬天（約 17°C）的效率比夏天（約 29°C）低，冬天消耗的 CO₂ 較少（全國 12% 誤選）✗
    (B) 平地夏天溫度高，乙效率低，生長較慢、需要的時間較長（全國 10% 誤選）✗
    (A) 山地溫度偏低，甲效率較差，乙較適合 ✗
sci113-28:
  key: 澎湖是玄武岩、綠島蘭嶼是安山岩；中央山脈的變質岩變質度比雪山山脈高。
  explain: |
    (A) 澎湖群島（I）主要是玄武岩，綠島、蘭嶼（VIII）主要是安山岩，種類不同 ✓
    (D) 中央山脈（V）受到的擠壓與埋藏較深，變質度比雪山山脈（IV）高 ✓
    (B) 西部麓山帶、平原也有很多活動斷層（全國 15% 誤選）✗
    (C) 臺灣的岩層大多比中生代年輕，沒有發現恐龍化石（全國 15% 誤選）✗
    (E) 臺灣的油氣主要在西部麓山帶與平原，不在海岸山脈（全國 11% 誤選）✗
sci113-24:
  key: 冰箱用電作功，把箱內的熱搬到箱外；在密閉隔熱的房間開著門運轉，輸入的電能最後都變成熱，室溫會上升。
  explain: |
    (A) 熱不會自己從低溫流向高溫，冰箱要消耗電能作功才能把熱搬出去 ✓
    (C) 冰箱門開著，搬出的熱又回到房間；再加上消耗的電能變成熱，隔熱房間的平均溫度會升高 ✓
    (E) 熱只會由高溫自然傳到低溫，冷媒溫度低於室溫時無法把熱傳給空氣（全國 31% 誤選）✗
    (D) 冷媒冷卻食物時是在低溫「低壓」的狀態（全國 23% 誤選）✗
    (B) 壓縮機壓縮冷媒，使冷媒的溫度和壓力都升高，不是降溫（全國 19% 誤選）✗
sci113-25:
  key: 1 度＝$1000\ \text{W}\times3600\ \text{s}=3.6\times10^6$ J；轉移熱能＝$2.5\times3.6\times10^6=9.0\times10^6$ J。
  explain: |
    輸入的功：1 度電 $=1\ \text{kW}\cdot\text{h}=3.6\times10^6$ J
    轉移的熱能＝性能係數×輸入的功 $=2.5\times3.6\times10^6=9.0\times10^6$ J (C) ✓
    (B) $7.2\times10^6$ J（全國 18% 誤選）(A) $3.6\times10^6$ J（全國 14% 誤選）：乘錯倍數，或忘了乘性能係數。

# ---------- Day 45：化學與生活、環境、細胞與細胞分裂、大氣與氣象 ----------
sci113-12:
  key: 要把硫化物「氧化」成 SO₄²⁻，需要氧化劑 → 過氧化氫。
  explain: |
    (B) H₂O₂ 是常見的氧化劑，能把 S²⁻ 等硫化物氧化成 SO₄²⁻ ✓
    (D) 鹽酸只提供酸性，不能把硫化物氧化（全國 18% 誤選）✗
    (C) 鋅是還原劑（全國 14% 誤選）✗
    (A) 氨水是鹼，(E) KCl 是中性鹽，都沒有氧化能力 ✗
sci113-13:
  key: 純 FeS₂ 的 S：Fe＝2；實測小於 2 → 可能混有不含硫的氧化鐵；SO₄²⁻ 比總硫少 → 還有硫化物沒被氧化。
  explain: |
    (A) FeS₂ 中硫和鐵的莫耳比是 2：1 ✓
    (C) 若樣品混有氧化鐵，鐵多、硫沒變多，比值就小於 2 ✓
    (E) 含硫總量包含 SO₄²⁻ 和其他含硫物質；$[\mathrm{SO_4^{2-}}]/[\mathrm{Fe}]$ 比總硫的比值小，表示部分硫化物還沒氧化成 SO₄²⁻ ✓
    (D) 由表可知氧氣分壓越低，$[\mathrm{SO_4^{2-}}]/[\mathrm{Fe}]$ 越小；在純氮氣中會更小，不會大於 1.46（全國 50% 誤選）✗
    (B) 氧氣分壓越高，溶出的鐵越多 → 溶解量增加，不是減少（全國 42% 誤選）✗
sci113-03:
  key: 細胞學說：生物由細胞構成、細胞是構造與功能的基本單位、細胞來自既存的細胞。病毒沒有細胞；紅血球由骨髓的造血幹細胞產生。
  explain: |
    (B) 細菌雖小，也是由細胞（單細胞）構成 ✓
    (D) 植物長大靠細胞分裂增加數量，以及細胞變大 ✓
    (E) 複雜的行為由神經、肌肉等多種細胞協調完成 ✓
    (C) 成熟的紅血球沒有細胞核，不能分裂；新的紅血球由骨髓中的幹細胞分裂、分化而來（全國 38% 誤選）✗
    (A) 病毒沒有細胞構造（全國 28% 誤選）✗
sci113-30:
  key: 水氣凝結要靠空氣降溫；下沉或越山後的落山風都會絕熱增溫，最不可能凝結。
  explain: |
    這題選「最不可能」發生凝結的。
    (D) 高壓區上空的空氣下沉，被壓縮而增溫，相對溼度降低，不會凝結 ✓
    (E) 空氣越過山後沿背風坡下沉增溫，形成又熱又乾的落山風 ✓
    (A) 空氣沿迎風坡上升、膨脹降溫，容易成雲致雨 ✗
    (B) 暖空氣吹過冷海面被冷卻，容易形成海霧（全國 17% 誤選）✗
    (C) 夜晚地表輻射冷卻，近地面的空氣降溫，可能形成霧或露（全國 14% 誤選）✗
sci113-26:
  key: 飽和壓力約 260 kPa，一半約 130 kPa；由圖讀出約在 30 ms 時達到。
  explain: |
    曲線最後平在約 260 kPa（飽和壓力），一半約 130 kPa，對應的充氣時間約 30 ms。
    (C) 30 ms ✓
    (D) 40 ms（全國 9% 誤選）(E) 50 ms（全國 9% 誤選）：50 ms 時已接近飽和壓力，不是「至少」需要的時間。
sci113-27:
  key: 30 ms 內速度由 30 m/s 降到 15 m/s：$a=\dfrac{15}{0.03}=500$ m/s²，$F=ma=50\times500=25000$ N。
  explain: |
    駕駛人碰到氣囊時，氣囊剛好達飽和壓力的一半，由上題知經過約 30 ms＝0.03 s。
    速度 108 km/h＝30 m/s 降到 54 km/h＝15 m/s，減少 15 m/s。
    $a=\dfrac{\Delta v}{\Delta t}=\dfrac{15}{0.03}=500$ m/s² → $F=50\times500=25000$ N (B) ✓
    (C)(D)(E)（全國各 14% 誤選）：時間或速度單位換算錯誤。

# ---------- Day 46：化學計量與熱化學、遺傳、海洋 ----------
sci113-15:
  key: 同溫同壓下，氣體密度和分子量成正比；雜質越輕，整體越輕、越容易浮起 → 氖（20.2）最輕。
  explain: |
    各雜質的分子量：CO₂ 44、N₂ 28、Ne 20.2、Ar 40、O₂ 32。
    雜質所占體積相同（1%），分子量越小，混合氣體的平均密度越小，浮力相同時越容易浮起。
    (C) 氖氣 ✓
    (B) 氮氣（全國 34% 誤選）：分子量 28，比氖的 20.2 大。
sci113-04:
  key: 薩登提出染色體學說；弗蘭克林拍到 DNA 的 X 光繞射圖；華生、克里克提出雙股螺旋模型；摩根用果蠅眼色發現性聯遺傳。
  explain: |
    (A) 薩登發現減數分裂時染色體的行為和遺傳因子的分離一致，提出遺傳的染色體學說 ✓
    (B) 弗蘭克林用 X 光繞射拍下 DNA 的影像，是建構雙螺旋的重要證據 ✓
    (C) 華生與克里克建構了 DNA 的雙股螺旋模型 ✓
    (D) 以果蠅眼色互交實驗發現性聯遺傳的是摩根，不是史蒂文斯（全國 46% 誤選）✗
    (E) 證明核酸（DNA）是遺傳物質的是艾佛瑞、赫雪與蔡斯等人的實驗，不是摩根（全國 32% 誤選）✗
sci113-33:
  key: 臺灣海峽中部（臺中附近）潮差最大，基隆、高雄潮差小；漲潮時潮水由海峽南北兩端湧入，退潮時再由兩端流出。
  explain: |
    (A) 潮波由海峽南、北兩端進入，在中部會合疊加 → 西部潮差由兩端向中部增大，臺中港最大 ✓
    (B) 基隆、高雄位在海峽兩端外側，外海水深，潮差較小 ✓
    (E) 退潮時，海水由臺灣海峽的南、北兩端流出 ✓
    (C) 東部海岸直接面向深廣的太平洋，潮差反而較小（全國 39% 誤選）✗
    (D) 潮波先到達東部海岸，再繞進臺灣海峽，西部滿潮較晚，不是東部較晚（全國 39% 誤選）✗
sci113-44:
  key: 冷次定律：感應電流的磁場總是「抗拒相對運動」——磁鐵接近時排斥它、離開時吸引它，對向下運動的磁鐵都施加向上的力。
  explain: |
    (E) 磁鐵靠近時，環圈產生排斥它的磁場（向上推）；穿過後要離開時，環圈產生吸引它的磁場（向上拉）→ 磁力恆向上 ✓
    (C)(D) 接近時磁通量增加、離開時減少，感應電流的方向會反轉，不會恆為同一方向（(C) 全國 25% 誤選、(D) 19%）✗
    (A)(B) 感應電流在磁鐵接近環圈時變大、穿過中心附近時變小再反向，不是持續增大或減小（(B) 全國 13% 誤選）✗
sci113-45:
  key: 感應電動勢＝磁通量變化率；磁鐵越快，變化率越大 → 電流越大；磁力線只穿過甲，乙的大小不影響。
  explain: |
    (B) 磁力線只穿過環圈甲，環圈乙的面積改變不影響磁通量的變化，電阻也不變 → I 不變 ✓
    (D) 磁鐵速度變快，同樣距離下磁通量變化得更快，感應電動勢變大 → I 變大 ✓
    (E) 圈數加倍，感應電動勢加倍，電阻仍是 R → I 也加倍（全國 18% 誤選）✗
    (C) 速度變快，I 變大不是變小（全國 16% 誤選）✗
    (A) 環圈甲的面積改變，通過它的磁通量及變化率會跟著改變（全國 15% 誤選）✗

# ---------- Day 47：化學與生活、環境、演化與分類、大氣與氣象 ----------
sci113-18:
  key: 乙不溶於水、丁溶於水 → 加水後過濾就能分開；丙和水分層 → 用分液漏斗；丁熔點高、易溶於水，可能是離子化合物。
  explain: |
    依性質判斷：甲（熔點 16.6°C、沸點 118°C、弱酸）像醋酸；乙不溶於水、熔點很高；丙和水分層的液體；丁熔點 776°C、易溶於水。
    (A) 加水後丁溶解、乙不溶，過濾就能分開 ✓
    (C) 乙不溶於水，用濾紙過濾即可分離 ✓
    (E) 熔點、沸點高又易溶於水，可能是離子化合物（如 KCl）✓
    (B) 丙和水互不相溶，要用分液漏斗分離，不是蒸發結晶（全國 28% 誤選）✗
    (D) 甲是弱酸，屬弱電解質；丙不溶於水、沒有導電離子（全國 20% 誤選）✗
sci113-07:
  key: 尼龍出現前從沒接觸過尼龍 → 消化尼龍的酵素來自 DNA 突變；有這種突變的細菌在汙水池中占優勢 → 天擇造成的適應。
  explain: |
    (B) DNA 鹼基序列發生改變（突變），產生能分解尼龍的酵素 ✓
    (E) 能利用尼龍的細菌在尼龍工廠的汙水中存活、繁殖較多 → 天擇造成的適應現象 ✓
    (C) 細胞來自細胞說明了細菌的繁殖，卻解釋不了為什麼能消化尼龍（全國 28% 誤選）✗
    (D) 細菌行無性生殖，孟德爾遺傳法則無法解釋新能力的出現（全國 18% 誤選）✗
    (A) K172 是在汙水池中自然出現的，不是人為的基因改造（全國 7% 誤選）✗
sci113-34:
  key: 雲底高度：溫度每公里降 10°C、露點降 2°C，兩者每公里接近 8°C → 高度 $=\dfrac{T-T_d}{8}$ 公里；乙 1 km、戊 2.5 km 剛好吻合。
  explain: |
    空氣塊上升到溫度＝露點時開始凝結形成雲底：$T-10h=T_d-2h$ ⇒ $h=\dfrac{T-T_d}{8}$（公里）。
    甲：$\dfrac{6}{8}=0.75$ km，圖中只到 0.5 km，還沒成雲。
    乙：$\dfrac{8}{8}=1$ km，和圖中 1 km 相符 ✓
    丙：$\dfrac{8}{8}=1$ km，圖中 1.5 km 已在雲底之上。
    丁：$\dfrac{12}{8}=1.5$ km，圖中 2 km 也在雲底之上。
    戊：$\dfrac{20}{8}=2.5$ km，和圖中 2.5 km 相符 ✓
    (B) 乙 ✓
    (E) 戊 ✓
    (C) 丙（全國 33% 誤選）(D) 丁（全國 26% 誤選）：雲底在更低的高度，圖中的高度已經是雲層內部。
sci110-11:
  key: 光速和密度成反比 → 越下面越慢；光會往速率慢（折射率大）的一側偏折 → 兩道光在溶液中都逐漸往下彎。
  explain: |
    溶液密度由下往上遞減 → 越往下光速越慢（折射率越大）。光在折射率連續變化的介質中，會一路往折射率大的一側（下方）偏折。
    從液面射入的光：進入溶液時先偏向法線，之後越走越往下彎。
    從側壁射入的光：進入後同樣逐漸往下彎曲。
    (E) 兩道光進入溶液後都向下彎曲 ✓
    (C)（全國 35% 誤選）有一道光往上彎，表示偏向速率較快的上方，方向相反 ✗
    (B)（全國 15% 誤選）(A)（全國 11% 誤選）也各有一道光的彎曲方向錯誤。
sci113-47:
  key: O＝C＝O 有兩個雙鍵、乙烯 H₂C＝CH₂ 有一個 C＝C 雙鍵；水、甲醇、正丙醇都只有單鍵。
  explain: |
    (A) 二氧化碳：碳和兩個氧各以雙鍵相連 ✓
    (D) 乙烯：兩個碳之間是雙鍵 ✓
    (E) 正丙醇 CH₃CH₂CH₂OH 全是單鍵（全國 23% 誤選）✗
    (C) 甲醇 CH₃OH 全是單鍵（全國 22% 誤選）✗
    (B) 水 H－O－H 只有單鍵 ✗
sci113-48:
  key: 每莫耳產物所需 H⁺：6、12、18 → 1：2：3；但每莫耳 CO₂ 都需要 6 個電子；NaOH 可吸收酸性的 CO₂。
  explain: |
    (A) 甲醇 6 mol、乙烯 12 mol、正丙醇 18 mol H⁺ → 1：2：3 ✓
    (B) CO₂ 是酸性氣體，會被 NaOH 溶液吸收，乙烯不會 → 可以分離 ✓
    (E) 甲醇、正丙醇都是常溫下易揮發、易燃的有機物 ✓
    (C) 正丙醇的分子小、含 –OH，可以和水互溶，不會分層（全國 50% 誤選）✗
    (D) 每莫耳 CO₂：甲醇 6、乙烯 $12\div2=6$、正丙醇 $18\div3=6$ 莫耳電子，三者相同（全國 46% 誤選）✗

# ---------- Day 48：演化與分類、大氣與氣象、近代物理與基本交互作用 ----------
sci113-08:
  key: 乙、丙、丁在上方同一大分支，共同祖先較近；甲在右下的另一分支，和它們只在靠近樹根處才有共同祖先 → 乙丁比甲乙親近。
  explain: |
    兩個物種的共同祖先離末端越近（分岔越晚），親緣越近。
    甲和乙、丙、丁都要回溯到靠近樹根的節點才有共同祖先；乙、丙、丁則在上方的分支就有較近的共同祖先。
    (D) 甲乙＜乙丁：乙丁的關係比甲乙親近 ✓
    (A)(B) 甲和乙、丙、丁的共同祖先是同一個節點，親疏相同（(A) 全國 3%、(B) 6% 誤選）✗
    (C) 乙丙比甲乙親近，所以應為甲乙＜乙丙（全國 5% 誤選）✗
    (E) 丙丁比甲乙親近 ✗
sci113-35:
  key: 風力發電量隨季風季節變化（冬季東北季風強）；太陽光電發電時不排碳，但製造光電板仍有碳排放。
  explain: |
    (B) 臺灣冬季東北季風強、夏季風較弱，同一風場的發電量有季節差異 ✓
    (D) 光電板在生產、運輸過程中仍會消耗能源、排放二氧化碳 ✓
    (A) 臺灣風場的主要來源是冬季的東北季風（全國 12% 誤選）✗
    (E) 兩者都受天氣影響，互相配合也無法保證全年穩定供電（全國 13% 誤選）✗
    (C) 臺灣位於低緯度，日照充足，適合發展太陽光電 ✗
sci110-13:
  key: 彈力、摩擦力、正向力都源自原子間的電磁力；四種基本交互作用是重力、電磁力、強力、弱作用。
  explain: |
    (A) 彈力和摩擦力都來自物體表面原子間的電磁作用 ✓
    (D) 會衰變的是中子（透過弱作用變成質子），電子不會衰變（全國 25% 誤選）✗
    (B) 原子核內質子、中子之間主要是強力（全國 16% 誤選）✗
    (C) 強力的作用範圍約 10⁻¹⁵ m，弱作用更短，約 10⁻¹⁸ m ✗
    (E) 重力是四種基本交互作用之一 ✗
sci110-05:
  key: CO₂＋Ca²⁺ 生成 CaCO₃ 沉澱，碳的氧化數都是＋4，沒有電子轉移。
  explain: |
    判斷方法：看碳的氧化數有沒有改變。
    (D) CO₂ 溶於水，和 Ca²⁺ 結合成 CaCO₃：碳都是＋4，不是氧化還原 ✓
    (A) 細胞呼吸：葡萄糖被氧化成 CO₂ → 氧化還原 ✗
    (B) 碳水化合物在地層中失去氧、變成以碳為主的煤 → 碳被還原（全國 28% 誤選）✗
    (C) 燃燒是氧化反應 ✗
    (E) 光合作用：CO₂ 被還原成葡萄糖，水被氧化成 O₂ ✗
sci113-09:
  key: 界門綱目科屬種：屬是把種歸類的第一個層級；階層越高，成員越多、共同特徵越少。
  explain: |
    (E) 種之上的第一個分類階層是屬 ✓
    (C) 同目的兩個物種也可能剛好同科，甚至同屬，不一定比較疏遠（全國 49% 誤選）✗
    (D) 物種主要以能否自然交配並產生具生殖力的後代來區分，不只看形態（全國 9% 誤選）✗
    (A) 階層越高，成員越多，但共同特徵越少（全國 8% 誤選）✗
    (B) 階層越低，成員越少、親緣越近 ✗

# ---------- Day 49：海洋、力學與運動、酸鹼與溶液 ----------
sci113-36:
  key: 2 萬年前是最後一次冰期的盛期，之後地球軌道造成的日照變化使冰川大量融化，海平面上升約 120 公尺。
  explain: |
    (C) 末次冰期後，太陽入射量（日照）的週期變化使氣候變暖，陸地冰川融化，海水面大幅上升 ✓
    (B) 人類造成的溫室效應主要發生在工業革命後約 200 年，圖中的上升從 2 萬年前就開始（全國 38% 誤選）✗
    (A) 造山作用改變的是陸地，速度也很慢 ✗
    (D) 降雨的水本來就來自海洋，不會讓海水面上升 120 公尺 ✗
    (E) 海底火山噴發不會造成全球海水面這樣持續的上升 ✗
sci110-14:
  key: 功率＝能量÷時間：J/s＝(kg·m²/s²)/s＝kg·m²/s³。
  explain: |
    (C) 功率 W＝J/s，J＝N·m＝kg·m²/s²，所以 W＝kg·m²/s³ ✓
    (D) 動能的單位是 J＝kg·m²/s²，不是 kg·m²/s（全國 20% 誤選）✗
    (B) 壓力 Pa＝N/m²＝kg/(m·s²)（全國 14% 誤選）✗
    (A) 電量 C＝A·s，不是 A·s² ✗
    (E) 熱量也是能量，單位是 J＝kg·m²/s² ✗
sci110-06:
  key: 胃乳液含制酸劑（如氫氧化鋁、氫氧化鎂），是鹼性 → 讓潤溼的紅色石蕊試紙變藍。
  explain: |
    石蕊：pH＜4.5 紅色、pH＞8.3 藍色；紅色試紙遇鹼（pH＞8.3）變藍，藍色試紙遇酸（pH＜4.5）變紅。
    (B) 胃乳液的制酸劑是鹼性物質 → 紅色石蕊試紙變藍 ✓
    (A) 血漿 pH 約 7.4，接近中性，藍色試紙不會變紅（全國 12% 誤選）✗
    (C) 鹽酸會讓藍色試紙變紅，試紙不會變白 ✗
    (D) 乙酸乙酯是中性的酯類，不會讓紅色試紙變藍（全國 12% 誤選）✗
    (E) pH 6.4 偏酸，紅色試紙仍是紅色 ✗
sci113-37:
  key: 人擇育種只改變性狀，高產肉雞仍能和原始雞種交配產生可孕後代 → 還是同一物種。
  explain: |
    這題選「不正確」的。
    (A) 經過選育的肉雞和原始雞種仍可交配並產生具生殖力的後代，屬於同一物種 → 不正確 ✓
    (B) 選育過程中，基因突變和重組仍持續發生 → 正確
    (C) 選育只留下特定性狀，原始族群保有較多遺傳變異 → 正確（全國 11% 誤選）
    (D) 縮短飼養天數、降低飼料轉化率（省飼料）都是選育的目標 → 正確
    (E) 飼料配方也會影響轉化率，評估成效時要一併考慮 → 正確
sci113-39:
  key: 純種族群一再被選育，跑得快的對偶基因幾乎都已固定，可供選擇的變異用盡 → 進步有限。
  explain: |
    (B) 選育只能篩選族群中已有的變異；純種族群的基因變異越來越少，到後來沒有更好的變異可選 ✓
    (A) 族群大小不一定變小，就算變小也不是主要原因（全國 18% 誤選）✗
    (D) 若跑得快不能遺傳，1949 年以前也不會有進展（全國 12% 誤選）✗
    (C)(E) 題目沒有提到計畫執行或基因轉殖 ✗

