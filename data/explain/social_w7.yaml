soc110-40:
  key: 原為古海盆的低地、自噴井、畜牧業、地下水鹽分高 → 澳洲中東部的大鑽井盆地（乙）。
  explain: |
    (B) 乙位於大鑽井盆地，氣候乾燥，靠自流井取得地下水發展牧羊業；深層地下水含鹽分高 ✓
