# ---------- Day 49：世界史、區域與產業、人口與遷移 ----------
soc112-63:
  key: 十九世紀下半葉是新帝國主義「瓜分非洲」的時代 → 1884–1885 年柏林會議，列強議定瓜分非洲的原則。
  explain: |
    (C) 柏林會議由歐洲列強召開，訂下「有效占領」等原則，之後非洲幾乎全被瓜分 ✓
    (B) 在西非沿岸設立奴隸貿易據點是十六至十八世紀的事，十九世紀各國已陸續廢除奴隸貿易（全國 34% 誤選）✗
    (D) 反抗種族隔離政策是二十世紀南非的事（全國 6% 誤選）✗
    (A) 尋找通往亞洲的航路是十五、十六世紀的地理大發現（全國 5% 誤選）✗
soc112-64:
  key: 只看表 4：2000 到 2020 年各區的飢餓指數幾乎都持續下降 → 糧食供應改善，人口壓力減輕。
