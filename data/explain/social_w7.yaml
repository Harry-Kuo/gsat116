# 社會 Day 43–49 解析（Claude 撰寫；地圖、照片、圖表題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）
# 110 年是舊課綱試卷，排入的題目都已確認在 108 課綱必修範圍內。

# ---------- Day 43：中國史、世界區域地理、區域與產業 ----------
soc112-14:
  key: 元代對各宗教一視同仁；儒戶待遇約略等於佛僧、道士 → 把儒士當成和宗教神職人員一樣的一種「戶」來優遇。
  explain: |
    (D) 元朝把儒士和僧、道並列為受優待的戶口，是以對待宗教神職人員的方式予以尊重 ✓
    (C) 題文說儒戶是較受優遇的一種，不是貶抑；仕進機會較少是科舉長期停辦的結果（全國 25% 誤選）✗
    (A) 題文沒有提到懷柔，重點是和僧、道並列對待（全國 22% 誤選）✗
    (B) 儒戶比娼人等其他戶口受優遇，不是均平對待（全國 7% 誤選）✗
soc113-54:
  key: 加勒比海、法國蔗糖殖民地、1804 年獨立 → 海地，位在伊斯帕尼奧拉島西部（北緯約 20 度、西經約 70 度）。
  explain: |
    (A) 甲是加勒比海的伊斯帕尼奧拉島，西部是海地、東部是多明尼加 ✓
    (B) 乙在南太平洋（南緯 20 度、東經 165 度），是新喀里多尼亞（全國 22% 誤選）✗
    (C) 丙在北緯 56 度、東經 12 度的波羅的海口，屬於丹麥（全國 16% 誤選）✗
    (D) 丁在南緯 42 度，是澳洲的塔斯馬尼亞島（全國 8% 誤選）✗
soc113-55:
  key: 海地長期作為法國的蔗糖產地，屬於世界體系的邊陲；殖民時期留下單一作物、依賴外國資本的經濟結構，獨立後仍難以擺脫。
  explain: |
    (D) 邊陲國家受核心國帶動發展的擴散效應有限，產業多由跨國企業掌控，利潤流向國外 ✓
    (A) 甘蔗笨重又容易變質，通常在產地附近就先製成粗糖再運出，不是把甘蔗運往法國加工（全國 27% 誤選）✗
    (B) 文中無法推論獨立後國民所得逐年減少（全國 24% 誤選）✗
    (C) 文中談的是奴隸解放與獨立，不是民主化造成勞工短缺 ✗
soc113-56:
  key: 海地 1804 年建國，卻因主權爭議直到十九世紀中期才被多數國家承認 → 在國外工作的國民得不到母國的外交保護（沒有使館）。
  explain: |
    (D) 多數國家不承認海地，就不會和它建交、互設使館，海地人在國外無法得到母國使館的協助 ✓
    (B) 到外國工作不一定要歸化，這和國家是否被承認無關（全國 25% 誤選）✗
    (C) 貨幣能否使用和國家是否被承認無直接關係（全國 16% 誤選）✗
    (A) 任何人到外國都要遵守當地法律，不是因為國際處境才如此（全國 11% 誤選）✗
soc113-36:
  key: 開放進口會衝擊農民 → 國際價格低於國內均衡價格（乙圖）；開放後國內價格降到國際價格，消費者剩餘增加、生產者剩餘減少。
  explain: |
    (D) 乙圖國際價格較低，開放進口後國內價格下跌，農民賣價與產量下降，生產者剩餘減少 ✓
    (C) 價格下跌時消費者能用更低的價格買到更多，消費者剩餘會增加（全國 20% 誤選）✗
    (B) 甲圖的國際價格高於國內價格，開放後會變成出口，生產者剩餘增加，不會衝擊農民（全國 12% 誤選）✗
    (A) 甲圖開放後國內價格上升，消費者剩餘減少；而且甲圖不是本題的情境（全國 8% 誤選）✗
soc113-37:
  key: 這個案件被認定為「司法不法」：法院沒有發揮審判把關的功能，採信檢方的說法而忽略反證 → 司法若不能制衡檢警的違失，人民權利就無從保障。
  explain: |
    (A) 法院應依證據獨立審判，監督檢警的偵查是否違法；司法失去制衡功能，冤案就會發生 ✓
    (B) 國家在緊急狀態下可以依法限制人權，只是不能過度（全國 21% 誤選）✗
    (C) 不論是否預謀或使用暴力，被告都受正當法律程序的保障（全國 11% 誤選）✗
    (D) 集會遊行權可以依法限制，不是絕對不得限制（全國 11% 誤選）✗

# ---------- Day 44：世界史、地圖與地理資訊系統、社會規範與社會化 ----------
soc112-15:
  key: 香港、義大利、緬甸、北非都有戰場 → 第二次世界大戰；海報「TOGETHER」畫著各地士兵 → 英國動員自治領與殖民地的軍隊共同作戰。
  explain: |
    (D) 二戰時英國號召印度、加拿大、澳洲等自治領與殖民地出兵，在亞洲、歐洲、非洲各戰場作戰 ✓
    (C) 一次大戰的戰場不包括香港、緬甸（日本在二戰才進攻這些地方）（全國 34% 誤選）✗
    (B) 文中強調的是共同作戰，不是建立國協，印度也不是以英語為母語的國家（全國 9% 誤選）✗
    (A) 1853 年的克里米亞戰爭不在這些地方作戰 ✗
soc110-33:
  key: 用手機定位列管者的位置（定位系統），在電子平台上比對位置是否超出劃定範圍、自動發出警示（地理資訊系統）。
  explain: |
    (C) 乙：取得列管者的即時位置；丙：在電子平台上套疊位置與允許的範圍，做空間分析並自動告警 ✓
    (A) 遙測是用衛星或飛機從遠處拍攝地表影像，無法追蹤個人位置（全國 37% 誤選）✗
    (B)(D) 數值地形模型是地表高程資料，和居家檢疫無關 ✗
soc113-47:
  key: 童養媳是父母從小替孩子決定將來的婚配對象；現代社會重視婚姻自由，婚姻要由當事人自主決定。
  explain: |
    (D) 燈妹從小就被指定和彭家兒子拜堂成親，違反婚姻自由，現代社會不容許 ✓
    (C) 禁止販賣兒童是保障兒少人權，男孩、女孩都適用，不是因為性別平權運動才禁止；童養媳的核心問題是被指定婚配（全國 40% 誤選）✗
    (A) 童養媳通常沒有血緣關係，和禁止近親婚配無關（全國 8% 誤選）✗
    (B) 現代社會仍允許依法收養幼兒（全國 6% 誤選）✗
soc112-16:
  key: 宗教建築先被基督教、伊斯蘭當作異教物、又被當成彈藥庫炸毀，後來外國人把雕像帶回國 → 雅典帕德嫩神殿，雕像被英國人帶走，至今收藏在大英博物館。
  explain: |
    (C) 帕德嫩神殿先後被改成教堂、清真寺，鄂圖曼時期當彈藥庫而被炸毀；十九世紀初英國人把雕像運回英國，希臘至今要求歸還 ✓
    (B) 鄂圖曼人是把神殿當彈藥庫的一方，但把雕像帶回國、說是「合法取得的藝術品」的是英國人（全國 31% 誤選）✗
    (D) 圓明園是皇家園林，不是基督教與伊斯蘭先後進入的宗教建築（全國 31% 誤選）✗
    (A) 十字軍和「欣賞廢墟、帶回國當藝術品」的情節不符（全國 13% 誤選）✗
soc110-34:
  key: 中油的石化工廠生產乙烯、丙烯等原料，供應國內下游產業 → 設在接近消費市場的地方：市場區位。
  explain: |
    (D) 石化原料要供應國內各產業，工廠設在高雄、臺中、新北等需求地附近，靠近市場 ✓
    (C) 動力導向是指耗能大、需靠近電力來源的工業，例如煉鋁（全國 42% 誤選，比答對的人還多）✗
    (A) 技術、(B) 勞力都不是題文強調的條件 ✗

# ---------- Day 45：經濟學概念、法律原則、全球化與多元文化 ----------
soc113-61:
  key: 船公司超載是因為多載一人就多賺一份錢 → 改成依「安全抵達」的人數付費，船公司就有誘因讓乘客平安到達。
  explain: |
    (C) 運費和安全抵達的人數掛鉤，華工死亡就會減少船公司的收入，船公司自然會改善待遇、減少超載 ✓
    (D) 提高運費不保證船公司會改善待遇，船公司仍可能繼續超載賺取更多利潤（全國 15% 誤選）✗
    (B) 道德教育沒有改變船公司的利益計算，誘因不足（全國 13% 誤選）✗
    (A) 華工買保險只是事後補償，船公司仍沒有改善的誘因 ✗
soc113-62:
  key: 《排華法案》經國會立法、總統簽署，程序合法，內容卻歧視特定族群 → 合法程序不等於符合人權，法律也可能是惡法。
  explain: |
    (B) 排華法案的制定過程都合法，卻是歧視性的法律，提醒我們法治不只要求依法，法律內容也要保障人權 ✓
    (A) 文中的教訓是法律本身的歧視，不是政府沒有協助融入（全國 31% 誤選）✗
    (C) 依社會接納程度訂定移民政策，可能正好成為歧視的理由（全國 15% 誤選）✗
    (D) 地方議會不能自行立法對抗中央的移民法 ✗
soc113-63:
  key: 題文的線索是華人聚居形成唐人街、族群經濟聚落 → 洛杉磯保留華人移民的歷史與文化，成為認識美國多元文化的基地。
  explain: |
    (C) 華人移民的歷史在洛杉磯留下唐人街與華人在美博物館，是了解美國多元文化的地方 ✓
    (B) 拉丁裔移民和工作機會不是題文提供的歷史資訊（全國 36% 誤選）✗
    (A) 移民遷入不代表進入人口轉型的晚期擴張階段（全國 16% 誤選）✗
    (D) 高科技產業與所得水準無法從題文推論（全國 8% 誤選）✗
soc112-17:
  key: 暴君違反上帝旨意可以抵抗（荷蘭反抗西班牙、十七世紀獨立）、為資本主義提供道德支撐（新教倫理）、嚴格禁慾 → 喀爾文教派與尼德蘭。
  explain: |
    (A) 喀爾文主張反抗暴君、勤儉致富是上帝的恩寵、生活嚴格自律；尼德蘭依此反抗西班牙，十七世紀成為獨立的貿易強權 ✓
    (C) 亞當斯密是十八世紀的經濟學家，英國也不是十七世紀才成為獨立國家（全國 32% 誤選）✗
    (B) 路德主張服從世俗統治者，德國也不是十七世紀的海外貿易強權（全國 22% 誤選）✗
    (D) 孟德斯鳩是十八世紀的啟蒙思想家，提出三權分立（全國 14% 誤選）✗
soc110-35:
  key: 高齡就業者人數與比例一路上升 → 人口老化、勞動力不足；對策是鼓勵生育、建立友善托嬰環境，增加未來的勞動人口。
  explain: |
    (B) 甲鼓勵生育、丁廣設友善托嬰環境，都能提高生育率、改善少子高齡化 ✓
    (A) 乙：延長國民教育會讓年輕人更晚投入職場，對勞動力不足沒有幫助（全國 13% 誤選）✗
    (C)(D) 丙：提高海外移民門檻會減少移入的勞動力 ✗

# ---------- Day 46：法律原則、世界史、區域與產業 ----------
soc110-01:
  key: 因懷孕被資遣違反《性別平等工作法》，侵害工作權，可以向主管機關申訴、向法院起訴；族譜、祭祖是民間習俗，不是法律問題。
  explain: |
    (D) 雇主不得因員工懷孕而解僱，公司已違反性別平等工作的規定，侵害她的工作權 ✓
    (A) 名字是父母取的，她可以依法申請改名，但「招弟」本身並不構成侵害姓名權 ✗
    (B) 能不能列名族譜是宗族的私人事務，和法律上的平等繼承權無關（全國 5% 誤選）✗
    (C) 母親說她不能回去祭祖是家庭習俗，不是國家限制她的宗教自由 ✗
soc112-19:
  key: 十五至十七世紀從殖民母國遷入馬來半島南部（麻六甲）、信天主教（彌撒、聖彼得） → 1511 年占領麻六甲的葡萄牙人，來自伊比利半島西部。
  explain: |
    (D) 葡萄牙人在 1511 年占領麻六甲，與當地女性通婚形成葡裔混血社群，至今仍過聖彼得節祈求漁獲平安 ✓
    (B) 肥沃月灣的居民多信伊斯蘭教，也不是十五至十七世紀的殖民母國（全國 24% 誤選）✗
    (A) 中國東南沿海的移民不信天主教，也不是殖民母國（全國 9% 誤選）✗
    (C) 澳洲東部當時還沒有歐洲人殖民（全國 9% 誤選）✗
soc110-36:
  key: 接到訂單後重新設定程式，馬上把織襪機改成生產布口罩，快速回應市場需求 → 即時生產（及時生產）。
  explain: |
    (B) 依訂單需求即時調整生產線，快速出貨、減少存貨 ✓
    (A) 產品從襪子換成布口罩，技術層次和附加價值並沒有明顯提升，不是產業升級（全國 32% 誤選）✗
    (C) 工廠沒有搬家，不是區位移轉 ✗
    (D) 工業慣性是工廠因既有設施而留在原地；題文重點在生產方式 ✗
soc110-02:
  key: 籃球隊員不出力、卻同樣享受抗爭成果 → 搭便車（免費享用公共財）；就像非工會會員不參加抗爭也能分享成果。
  explain: |
    籃球隊員看到很多人已經在抗議，就不參加，但抗爭成功後他們一樣受益 → 搭便車問題。
    (C) 工會爭取來的成果，沒有參加的非會員也能享受，同樣是搭便車問題 ✓
    (B) 網路按讚多、到場少，談的是參與的熱度落差，不是不出力卻分享成果（全國 47% 誤選）✗
    (A) 談的是行動策略（全國 28% 誤選）✗
    (D) 談的是環保與經濟利益的衝突 ✗
soc112-30:
  key: 清代「一田二主」：大租戶收大租，小租戶（業主）實際經營並招佃耕作。日治土地調查承認小租戶為業主（土地所有人），大租權則被收購消滅。
  explain: |
    (B) 表中「業主」劉四是劉大的繼承人；土地調查時總督府認定業主（原本的小租戶）為土地所有人 ✓
    (C) 林三是大租戶，只能收大租，總督府後來以公債收購大租權（全國 40% 誤選）✗
    (D) 徐六是佃人，向業主租地耕作，不是所有人（全國 12% 誤選）✗
    (A) 劉大已經過世，由劉四繼承成為業主（全國 9% 誤選）✗
soc112-31:
  key: 史料呈現大租戶、業主並存，而業主是登記的土地所有人 → 可以佐證清末劉銘傳清賦的「減四留六」：大租減為六成，改由小租戶納稅、成為業主。
  explain: |
    (B) 減四留六讓小租戶負擔田賦、成為業主，大租戶只收原本大租的六成；申告書中業主和大租戶並列，正是這項改革的結果 ✓
    (D) 三七五減租是戰後限制佃租的政策，和清代的大租無關（全國 40% 誤選）✗
    (A) 保甲制度是地方治安組織，申告書看不出來（全國 16% 誤選）✗
    (C) 割地換水是漢人以土地和原住民交換水源的開墾方式，申告書看不出來 ✗

# ---------- Day 47：地形與自然環境、民主政治與媒體、中國史 ----------
soc110-37:
  key: 黃河流經黃土高原後含沙量大增 → 中游以下的地質環境（鬆散的黃土）和上游不同。
  explain: |
    (A) 黃河中游流經黃土高原，黃土鬆散、易被雨水侵蝕，大量泥沙進入河中 ✓
    (D) 沙塵暴是風力搬運，不是河水含沙量增加的主因（全國 19% 誤選）✗
    (C) 都市汙染不會造成每立方公尺上千公克的泥沙（全國 17% 誤選）✗
    (B) 降水量多寡不能解釋含沙量突然大增（全國 9% 誤選）✗
soc110-03:
  key: 參與結社能累積人與人之間的信任與網絡（社會資本），也在團體中練習討論、合作等參與能力。
  explain: |
    (D) 結社參與比例成長，表示社會資本增加；成員在團體中學到溝通、組織等公民技能 ✓
    (B) 公民社會強調民間自主，由政府補助扶植反而可能影響團體的獨立性（全國 62% 誤選）✗
    (A) 宗教團體也是公民社會的一部分，政府不應任意限制結社 ✗
    (C) 校友會是自願加入的團體，屬於志願結社 ✗
soc112-48:
  key: 城隍信仰被制度化，依府、州、縣層級設廟 → 鎮城隍廟祭祀所屬縣的城隍，就像市鎮隸屬於縣一樣，反映分層的地方行政體系。
  explain: |
    (B) 城隍爺對應地方行政層級，市鎮奉祀所屬縣的城隍，土地廟再到鎮城隍廟進香，形成和行政體系相似的層級 ✓
    (C) 文中強調的是信仰的層級關係，不是交易時順道參拜（全國 23% 誤選）✗
    (A) 周圍農村信奉的是土地公，不是城隍（全國 19% 誤選）✗
    (D) 鎮城隍廟是在國家體制之外另建的，不是國家設立機構 ✗
soc110-38:
  key: 截彎取直後，原本河道右岸（東側）的一塊地變成左岸，和苑裡市街連在一起 → 2001 年最可能劃為都市計畫住宅區。
  explain: |
    比較兩張圖：1904 年苑裡溪在苑裡街附近彎曲，2001 年河道被拉直，原本河曲內側的土地改到河的左岸（西側），緊鄰苑裡市區。
    (D) 這塊地和市街相連，2001 年圖上已是街道整齊的都市計畫區 ✓
    (B) 這塊地原本是河岸農地，不會有老街建築（全國 24% 誤選）✗
    (A) 圖中沒有魚塭符號（全國 22% 誤選）✗
    (C) 苑裡一帶沒有火山地形 ✗
soc110-39:
  key: 截彎取直後河道變短、坡度變陡 → 流速加快，河流的侵蝕力增加。
  explain: |
    (D) 同樣的高度差，河道變短，坡度變大，水流變快，下切侵蝕增強 ✓
    (A) 河道長短改變不會增加上游來的水量（全國 20% 誤選）✗
    (B) 侵蝕基準面（河口的海面）沒有改變（全國 19% 誤選）✗
    (C) 流速加快，泥沙較不易堆積（全國 19% 誤選）✗

# ---------- Day 48：民主政治與媒體、東亞國際關係、世界區域地理 ----------
soc110-04:
  key: 「評論事實」：媒體不只報導發生了什麼，還要提出不同觀點的分析與改善建議。
