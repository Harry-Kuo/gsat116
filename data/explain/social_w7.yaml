    (A) 甲是北部熱帶莽原氣候區 ✗
    (D) 丁是南部的地中海型氣候區 ✗
soc110-41:
  key: 西澳洋流由南往北流向赤道，是寒流 → 和同樣由高緯流向低緯、位於大陸西岸的秘魯洋流相似。
  explain: |
    (B) 秘魯洋流沿南美西岸北流，是寒流 ✓
    (D) 北大西洋洋流是暖流（全國 14% 誤選）✗
    (A) 黑潮是暖流（全國 12% 誤選）✗
