# 社會 Day 15–21 解析（Claude 撰寫；地圖、照片、圖表題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）

# ---------- Day 15：原住民族與土地 ----------
soc115-30:
  key: 日治時期的土地、林野調查把沒有地契的原住民傳統領域當成「無主地」收歸官有，再交給日資製糖會社。
  explain: |
    題文：傳統領域被政府當成「無主土地」→ 收歸官有 → 劃給日資會社發展糖業。
    (A) 總督府進行土地調查、林野調查時，提不出所有權證明的土地都收歸官有，原住民的傳統領域因此成為官有地 ✓
    (B) 隘勇線是用來封鎖、壓縮山區原住民的活動範圍；題文說的是土地被認定為「無主地」✗
    (C) 東部確實設有官營移民村，但題文是土地交給製糖會社，不是日本移民取得地權 ✗
    (D) 以新式製糖會社取代舊式糖廍是產業改革，和取得大量土地無關 ✗
soc115-31:
  key: 花東縱谷兩側有許多沖積扇，暴雨時溪水暴漲、夾帶砂石，容易淹沒扇面上的蔗園。
  explain: |
    「糖業種植經濟區域」在花東縱谷，谷地兩側由山區流出的河川堆積出許多沖積扇。
    (D) 沖積扇的河道不穩定，暴雨時溪水暴漲、夾帶大量砂石，容易淹沒扇面上的蔗園 ✓
    (A) 臺灣的熔岩台地在澎湖，不在花東 ✗（全國 23% 誤選）
    (B) 海階分布在東部海岸，縱谷裡的蔗園不在海階上；海階崩落也不是蔗園最主要的災害 ✗（全國 23% 誤選）
    (C) 超抽地下水造成地層下陷，主要發生在西南沿海，不是花東 ✗
soc115-32:
  key: 題文的措施：承認台糖的所有權而「價購」買回、依法註記為保留地、限制保留地轉讓出租；沒有讓台糖依契約自由出售土地。
  explain: |
    題文的作法依序是：
    ① 土地已劃歸台糖所有，原民會用「價購」向台糖買回 → 承認台糖的所有權 (D)
    ② 依現有法律程序註記為原住民保留地 → 遵循保留地的相關法律 (A)
    ③ 保留地原則上不得轉讓或出租給非原住民 → 限制原住民對保留地的支配權 (C)
    (B) 買回是原民會以行政命令主導、指定特定土地，不是讓台糖依契約自由（自己決定賣不賣、賣給誰、賣多少錢）出售土地 → 不包含 ✓
    (C) 這項限制看起來對原住民不利，其實是防止保留地流失的保護措施（全國 24% 誤選）
    (D) 要「向台糖買回」，就是承認土地屬於台糖（全國 36% 誤選）
soc115-33:
  key: 把日治時期被收為官有、戰後轉給台糖的土地還給原住民 → 處理殖民統治遺留的土地不正義，也就是轉型正義。
  explain: |
    (C) 土地在日治時期被當成「無主地」奪走，戰後又轉給公營的台糖；買回並歸還原住民，是在處理歷史上殖民統治造成的不正義 ✓
    (A) 保障生存與發展是原住民族政策的一般目標，但題文的重點是補救歷史上的土地掠奪 ✗
    (B) 題文是把所有權分配給「相關原住民擁有」，沒有提到由族群共同決定分配與使用 ✗（全國 16% 誤選）
    (D) 題文沒有談不同群體之間的土地爭議與補償 ✗
soc113-09:
  key: 1895 到 1903 年，民隘從 568 人降到 0，官隘從無到 3,054 人 → 山區防禦逐漸由官方主導。
  explain: |
    表 2：1895 年只有民隘 568 人；1897 年官隘 159 人、民隘 437 人；1903 年官隘 3,054 人、民隘 0 人。
    (B) 民間出資的隘勇消失，官方雇用的隘勇大增 → 山區防禦逐漸由官方主導 ✓
    (A) 表中只有官隘、民隘的人數，看不出雇用的是平埔族人 ✗
    (C) 隘勇人數大增是加強武力防堵，不是改採安撫教化 ✗
    (D) 表中是防守的隘勇人數，不是山區居民的人數 ✗

# ---------- Day 16：黃河水患與古代防疫 ----------
soc115-57:
  key: 中原政權決堤阻擋北方民族 → 黃河奪淮；中原政權南遷、雙方以淮河為界 → 北宋與金國；乙圖出現往東南奪淮的新河道。
  explain: |
    線索：中原政權決堤阻止北方民族南下 → 黃河改道「奪淮入海」→ 中原政權被迫遷都、兩國以淮河為界。
    這是宋金戰爭：1128 年宋朝守將決開黃河阻擋金兵，黃河從此南流奪淮；宋室南遷，後來宋金和議以淮河為界 → (B) 北宋與金國 ✓
    圖 11 乙除了往東北流入渤海的河道，還多了一條往東南、經淮河入海的河道，沿線有治河措施 → 正是黃河開始奪淮的時期。
    (A) 西晉被匈奴所滅後南遷，但沒有決河奪淮、以淮河為界 ✗（全國 22% 誤選）
    (C) 南宋已經在南方，最後被蒙古所滅，沒有「改以淮河為界」✗（全國 22% 誤選）
    (D) 南明與滿清的戰爭也沒有決河奪淮、以淮河為界 ✗
soc115-58:
  key: 要知道遷出的人去了哪裡、帶來什麼影響 → 看移入地區（南方）的戶口變化。
  explain: |
    (C) 南方的戶口統計可以看出人口增加多少、集中在哪些地區，最能追蹤移入的地區與影響 ✓
    (A) 修補河堤的碑文記的是治河工程 ✗
    (B) 淮河流域是遷出地，當地的徵稅冊籍只能看出人口減少，看不出人移到哪裡 ✗（全國 22% 誤選）
    (D) 黃河水系的地圖只能看河道變遷 ✗
soc115-59:
  key: 供給線左移多少取決於減產多少；圖 11 只標出水患「地點」，補上受災範圍大小，最能估算受損的耕地與產量。
  explain: |
    水患讓農產品減產 → 供給線左移；左移的幅度取決於減產多少，也就是有多少耕地受災。
    圖 11 每個水患只是一個「點」，看不出淹了多大的範圍。
    (A) 知道受災區域的大小，就能估計受損的耕地面積與減產量 ✓
    (B)(D) 淹水深度、持續時間會影響損失程度，但要先知道淹了多大的範圍，才能估算總減產量 ✗（(D) 全國 27% 誤選）
    (C) 好發季節是長期的發生規律，無法估算某一次水患的減產幅度 ✗（全國 21% 誤選）
soc115-61:
  key: 臺灣許多王爺被視為驅逐瘟疫的神明，王爺廟遶境祈安正是「除瘟解厄」。
  explain: |
    臺灣民間信仰中，許多王爺「代天巡狩」、驅逐瘟疫（燒王船「送瘟」也是同樣的用意）。
    (C) 王爺廟在元宵節遶境，巡行境內、祈求平安 → 除瘟解厄 ✓
    (A) 中元普渡是祭祀無主的孤魂 ✗
    (B) 義民祭是紀念清代協助官府平亂而犧牲的義民 ✗
    (D) 天主教的聖母遶境是慶祝堂慶的宗教活動 ✗
soc115-62:
  key: 學者主張要看具體情形、不能一律處罰 → 刑罰會嚴重限制人權，必須有充分的理由。
  explain: |
    學者認為行為是否真的造成疾病散播要個別判斷，一律處罰是「濫用刑罰來維護社會安全感」。
    (C) 刑罰會剝奪人民的自由、財產等基本權利，動用前必須有充分理由，這正是反對濫用刑罰的觀點 ✓
    (A) 談的是用矯治減少再犯，和該不該處罰無關 ✗（全國 15% 誤選）
    (B) 加重刑罰來嚇阻犯罪，正好和學者的主張相反 ✗
    (D) 罪刑相當（應報）是另一種刑罰觀，和題文無關 ✗

# ---------- Day 17：違規停車、台積電熊本廠、巴米揚大佛 ----------
soc115-26:
  key: 提高罰鍰＝讓違停者負擔他造成的外部成本 → 違停的代價變高 → 違規次數減少。
  explain: |
    紅線違停讓其他用路人塞車、增加事故風險，這是違停者沒有負擔的外部成本；提高罰鍰，就是讓違停者自己承擔這些成本。
    (A) 違停的代價提高 → 違規次數減少 → 塞車與事故跟著減少 ✓
    (B) 每一次違停造成的塞車與危險不會因為罰鍰提高而變小，減少的是違停的「次數」✗（全國 19% 誤選）
    (C)(D) 價格上限、價格下限是政府管制市場的成交價格（例如房租上限、最低工資），罰鍰不是這種管制 ✗
soc115-27:
  key: 法治國的比例原則：罰鍰的輕重要和所保護的法益（交通安全）相互衡量。
  explain: |
    (C) 罰鍰高低要和要保護的公共利益相稱（比例原則）；把交通影響納入評估、適當調整金額 ✓
    (A) 信賴保護是保障人民對既有法規的合理信賴，不是保障違規者繼續只受低額罰鍰 ✗
    (B) 罰鍰不一定是「最」有效的手段，這也不是依法治國原則所做的判斷 ✗
    (D) 平等原則允許依情節輕重給予合理的差別待遇，不是每一案都要相同 ✗
soc115-28:
  key: 第二個考量是發展地熱、太陽能、水力等再生能源 → 工業區位中的「動力」（能源）。
  explain: |
    (C) 地熱、太陽能、水力發電都是能源的供應，屬於動力因素 ✓
    (A) 原料是製造產品所需的材料；第二個考量講的是能源，不是材料 ✗（全國 21% 誤選）
    (B) 市場、(D) 資金，題文的第二個考量都沒有提到 ✗
soc115-29:
  key: 研磨劑、電鍍藥水是台積電製程需要的材料，由上游供應到下游 → 產業連鎖。
  explain: |
    (D) 富士軟片的研磨劑、電鍍化學品大廠的電鍍藥水，都是半導體製程的投入，從上游供應到下游的台積電 → 產業連鎖 ✓
    (A) 產業群聚講的是相關產業在空間上集中、共享資源；題目問的是產品之間的「流通關係」，也就是上下游的供應鏈 ✗（全國 35% 誤選）
    (B) 互補產品是消費時要一起使用的商品，例如印表機與墨水 ✗
    (C) 工業慣性是原有的區位優勢消失後，工業仍留在原地 ✗
soc115-45:
  key: 塔利班認為佛像是偶像崇拜，違反他們所認定的伊斯蘭教義，所以炸毀大佛。
  explain: |
    (A) 伊斯蘭教反對偶像崇拜；塔利班依自己對教義的解讀，認為佛像不能存在 ✓
    (B) 題文沒有提到戰略因素 ✗
    (C) 題文沒有提到阿富汗人民反對列入世界遺產 ✗
    (D) 題文沒有提到觀光客影響人民生活 ✗

# ---------- Day 18：臺灣史：日治墓園、異域孤軍、劉銘傳的鐵路 ----------
soc115-34:
  key: 都市擴張後，城外的墓園被市區包圍，規劃成公園 → 因應建地擴張、增加民眾的活動空間。
  explain: |
    墓園原本設在城外（北廓外）；日治後期臺北市區擴大，墓園被規劃為公園預定地。
    (C) 都市發展、建地擴張，需要開放空間供民眾活動 → 公園 ✓
    (A) 公園規劃和神社文化、愛國思想無關 ✗
    (B) 公園不是用來吸引民眾移入居住 ✗（全國 25% 誤選）
    (D) 題文沒有談就業與收入 ✗
soc115-35:
  key: 學者以「人性尊嚴」為由，要求依居民的生活脈絡妥善安置 → 主張居住權。
  explain: |
    (B) 不能隨意驅離、要妥善安置，保障的是有尊嚴地居住的權利 → 居住權 ✓
    (A) 程序參與權是在都市計畫過程中表達意見的權利；學者的理由是人性尊嚴與妥善安置，重點在居住的實質保障 ✗（全國 40% 誤選，比答對的人還多）
    (C) 違章建築不受所有權保障，學者也沒有主張居民擁有土地 ✗
    (D) 題文沒有提到階級歧視 ✗
soc115-36:
  key: 眷村選在生產力差、地價便宜的邊際土地，並和舊聚落保持距離 → 甲（旱田與休耕地，旁邊是墓地）。
  explain: |
    選址三原則：農業生產力較差、地價較便宜、與舊住民聚落相隔適當距離。
    (A) 甲周圍是旱田與休耕地，附近有墓地，離聚落有一段距離，又有道路經過 → 最符合 ✓
    (B) 乙緊鄰聚落與道路交會處 ✗
    (C)(D) 丙、丁位在水田與埤塘密布的區域，是生產力較高的農地；丁附近還有聚落 ✗（(D) 全國 15% 誤選）
soc115-38:
  key: 第一手史料是當事人或當時留下的紀錄：孤軍官兵的口述與回憶錄（乙）、撤退決策的官方檔案（丁）。
  explain: |
    (B) 乙是親身經歷者的口述與回憶，丁是當時政府的決策檔案，都是第一手史料 ✓
    甲（後人的研究）、丙（文學、影視作品）、戊（故事館的新聞報導）都是事後的整理或再創作，屬於二手資料 ✗
    提醒：口述、回憶錄雖然是第一手史料，但可能有記憶偏差，使用時要和檔案互相比對。
soc115-53:
  key: 鐵路連接基隆港與北部產地，茶、樟腦等商品更容易運到港口外銷 → 民間資本家願意出資。
  explain: |
    (B) 晚清臺灣北部的茶、樟腦大量外銷，修鐵路能把貨物更快運到港口，商人有利可圖 ✓
    (A) 看不出修鐵路是為了移民 ✗
    (C) 加強防務是劉銘傳的考量之一，但民間資本家出資主要著眼於商業利益 ✗
    (D) 清廷在 1905 年才廢除科舉，那時臺灣已割讓給日本 ✗

# ---------- Day 19：貿易戰、文化政策、荷莫茲海峽 ----------
soc115-47:
  key: 貿易戰、戰爭、補貼與貿易限制讓全球貿易成長大減，美中、歐俄貿易下降 → 地緣政治與全球化的挑戰。
  explain: |
    圖 8：美國與中國（−197）、歐盟與俄羅斯（−222）、美國與俄羅斯（−18）的貿易量減少；墨西哥、東協、印度等地的貿易增加。
    (C) 國際衝突（地緣政治）使貿易限制增加、貿易成長大幅下滑，全球化面臨挑戰 ✓
    (A) 貿易對象確實有轉移，但題文的重點是衝突與貿易限制，不是產業結構的變遷 ✗
    (B) 題文沒有談交通運輸的進步 ✗
    (D) 題文沒有談核心國家的發展擴散到周邊地區 ✗
soc115-48:
  key: 關稅提高讓進口商品變貴；高科技業集中的舊金山灣區，取得亞洲生產的半導體零件成本上升。
  explain: |
    (D) 舊金山灣區（矽谷）是高科技產業重鎮，半導體零件多從東亞進口；貿易戰提高關稅 → 進口零件變貴 ✓
    (A) 烏克蘭的難民不可能經陸路抵達美國 ✗
    (B) 芝加哥（87°37'W）位在內陸的密西根湖畔，不是海港 ✗（全國 37% 誤選）
    (C) 西雅圖氣候多雲多雨，不是發展太陽能的有利地點，題文也沒有談能源價格 ✗（全國 19% 誤選）
soc115-50:
  key: 主題曲因「同性戀隱喻」、女主角「不符女性應有氣質」被禁 → 不同性別認同的人，自我實現的機會不同。
  explain: |
    (C) 帶有同性戀意涵、不符合傳統性別氣質的表現都被禁止 → 非主流性別認同的人，表達與實現自我的機會受到限制 ✓
    (A) 題文沒有提到物化女性 ✗
    (B) 歌曲因同性戀隱喻被禁，表示當時異性戀文化仍是主流 ✗
    (D) 1970 年代還沒有出現以多元性別平等取代兩性平等的訴求 ✗（全國 15% 誤選）
soc115-51:
  key: 政府推行國語運動、禁播本土語言節目，但選舉演講、鄉土文學仍普遍使用本土語言 → 政策遭遇反對力量。
  explain: |
    (B) 文化政策想強化國語的地位，但在公開場合、文學、表演藝術中，本土語言反而更普遍 → 面對反對力量 ✓
    (A) 權力不平等不只表現在媒體，題文也提到選舉演講、文學創作中的語言使用 ✗（全國 25% 誤選）
    (C) 題文的重點是語言政策與民間的反應，不是媒體品質 ✗
    (D) 題文沒有談精緻文化與通俗文化的對比 ✗
soc115-64:
  key: 荷莫茲海峽是波斯灣唯一的出口，通往阿曼灣、阿拉伯海 → 影響波斯灣往阿拉伯海的油輪航線。
  explain: |
    (D) 沙烏地、伊拉克、科威特、阿聯等國的原油，從波斯灣經荷莫茲海峽運往阿拉伯海、印度洋 ✓
    (A)(B) 紅海的出口是南端的曼德海峽和北端的蘇伊士運河，不經過荷莫茲海峽 ✗（(A) 全國 24% 誤選、(B) 全國 27% 誤選）
    (C) 從阿拉伯海到孟加拉灣要繞過印度南端，也不經過荷莫茲海峽 ✗（全國 15% 誤選）

# ---------- Day 20：修法程序、勞保補貼、殖民城市、朱一貴事件 ----------
soc115-39:
  key: 學者要求依立法程序規範、落實審議的正當程序 → 遵守議事規則、充分溝通，並公開審議結果。
  explain: |
    (D) 遵守議事規則（程序規範）、充分溝通（審議）、刊登公報（公開透明）→ 正當程序 ✓
    (A) 專家學者審查不是立法院審議法案的法定程序 ✗（全國 16% 誤選）
    (B) 黨團協商是程序的一部分，但「優先採納少數意見」違反多數決 ✗
    (C) 民間團體可以遊說、請願，但那是表達意見的管道，不是法案審議過程本身 ✗
soc115-41:
  key: 機會成本＝做這個選擇所放棄的最佳替代用途；政府用預算補貼勞保基金，就排擠了其他公共建設。
  explain: |
    政府選擇用預算直接補貼，代價是這筆錢不能用在別的地方。
    (B) 補貼勞保基金，排擠了其他公共建設的預算 → 機會成本 ✓
    (A) 獲得勞工支持是補貼可能帶來的好處，不是成本 ✗（全國 20% 誤選）
    (C) 勞工上街抗議是政策可能引起的反應，不是因為選擇補貼而放棄的東西 ✗（全國 29% 誤選）
    (D) 提高費率才會增加廠商的負擔；政府正是選擇「不提高費率」✗
soc115-55:
  key: 錫礦與橡膠、「女王」（英國維多利亞女王）、印度人當警察與傭兵 → 英屬馬來亞的檳城。
  explain: |
    (B) 十九世紀後期的馬來半島因錫礦、橡膠吸引各地移民；在英國統治下，華人經商採礦、印度人擔任警察與傭兵 → 檳城 ✓
    (A) 雅加達（巴達維亞）是荷蘭的殖民地 ✗（全國 37% 誤選）
    (C) 胡志明市（西貢）是法國的殖民地 ✗
    (D) 馬尼拉當時是西班牙的殖民地 ✗（全國 16% 誤選）
soc114-29:
  key: 朱一貴事件中，南部粵籍移民組成義民協助官府平亂，事後閩粵關係緊張，官員才要求「不許再分黨羽，再尋仇釁」。
  explain: |
    (B) 朱一貴起事後，下淡水溪一帶的粵籍（客家）移民組成義民協助清廷鎮壓，閩、粵之間因此結下仇隙 ✓
    (A) 朱一貴事件是民眾反抗地方官的民變，起因不是閩粵械鬥 ✗（全國 42% 誤選，比答對的人還多）
    (C) 渡臺禁令在事件前就已存在，文告也沒有提到偷渡 ✗
    (D) 文告講的是閩粵之間的仇釁，不是番界外私墾者的衝突 ✗
soc113-16:
  key: 蔬菜箱要裝「多樣」蔬果，小農必須少量多樣地種 → 不利於集中生產少數作物的農業專業化。
  explain: |
    農業專業化：一個農場或地區集中生產少數幾種作物，以擴大規模、降低成本。
    (D) 蔬菜箱要裝多樣蔬果，小農改為少量多樣地生產，和專業化背道而馳 ✓
    (A) 精緻農業重視品質與高附加價值，蔬菜箱直送消費者並不會阻礙它 ✗（全國 20% 誤選）
    (B) 產銷履歷是記錄生產過程；宅配直送反而更容易讓消費者知道來源 ✗（全國 26% 誤選）
    (C) 智慧農業是運用科技管理生產，和蔬菜箱無關 ✗

# ---------- Day 21：玉山地形、番茄糊市場、美中關係、大航海時代與東亞文化圈 ----------
soc114-52:
  key: 斷崖從八通關一帶往東北方的溪谷下降，乙在溪谷對岸、正對崩壞面，中間沒有阻擋。
  explain: |
    等高線顯示：斷崖上緣在八通關附近（約 2800 公尺），向東北降到溪谷（約 2200 公尺），崩壞面朝向東北。
    (B) 乙在溪谷東側的山坡上，隔著溪谷正對崩壞面 → 展望最佳 ✓
    (C) 丙在斷崖上緣附近，往下看會被崖頂擋住，看不到整個崩壞面 ✗（全國 27% 誤選）
    (A) 甲距離較遠，又不在崩壞面朝向的方向 ✗（全國 24% 誤選）
    (D) 丁在南側的另一條溪谷，和斷崖之間隔著山脊 ✗
soc114-57:
  key: 改造番茄讓生產地點不受限、成本降低 → 番茄糊供給增加（供給線右移），和補貼擴大香蕉栽種相同。
  explain: |
    可長途運輸、更好加工的番茄讓各地都能種植、生產 → 番茄糊的供給增加，供給線右移。
    (B) 補貼鼓勵擴大種植香蕉 → 香蕉的供給增加，供給線右移 ✓
    (A) 品種改良的水梨「深受消費者喜愛」→ 增加的是需求，需求線右移 ✗（全國 62% 誤選）
    (C) 颱風造成西瓜減產 → 供給減少，供給線左移 ✗
    (D) 民眾擔心基改草莓 → 需求減少，需求線左移 ✗
    陷阱：(A) 也有「品種改良」，但題目問的是市場變動，要先分清楚影響的是供給還是需求。
soc115-43:
