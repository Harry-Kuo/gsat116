# 數學A 第 1 週解析（Claude 撰寫並逐題驗算，答案皆與大考中心公布一致；老師審閱後可修改）

ma115-01:
  key: 期望值 $=\sum(\text{獎金}\times\text{機率})$。兩次都「吉」機率 $\dfrac{1}{9}$、兩次都「祥」機率 $\dfrac{1}{9}$。
  explain: |
    $P(\text{吉吉})=\left(\dfrac{1}{3}\right)\left(\dfrac{1}{3}\right)=\dfrac{1}{9}$，$P(\text{祥祥})=\dfrac{1}{9}$，其他情況 0 元。
    期望值 $=180\times\dfrac{1}{9}+90\times\dfrac{1}{9}=20+10=30$（元）→ 答案 (2)
ma115-02:
  key: 直接代入：$f(-20)=10+8=18$，$f(0)=9+9=18$，$f(1)=9+10=19$。
  explain: |
    $[a]$ 是「不超過 a 的最大整數」。
    $f(-20)=[\sqrt{119}]+[\sqrt{79}]=10+8=18$（$10^2=100\le119<121$，$8^2=64\le79<81$）
    $f(0)=[\sqrt{99}]+[\sqrt{99}]=9+9=18$
    $f(1)=[\sqrt{98}]+[\sqrt{100}]=9+10=19$
    所以 $f(-20)=f(0)<f(1)$ → 答案 (1)
ma115-03:
  key: $\dfrac{f(c_2)}{f(c_1)}=a^{10/3}=4$，所以 $a=2^{3/5}$；公比 $\dfrac{f(8)}{f(10)}=a^{-2}$。
  explain: |
    $\dfrac{f(c_2)}{f(c_1)}=a^{c_2-c_1}=a^{10/3}=4$ ⇒ $a=4^{3/10}=2^{6/10}=2^{3/5}$
    等比數列 $f(10)$, $f(8)$, $f(6)$ 的公比 $=\dfrac{f(8)}{f(10)}=a^{-2}=2^{-6/5}$ → 答案 (1)
ma115-04:
  key: 草藥 1 種＋食物 10 種＋藥水（1 基本 2 進階或 3 進階）390 種＝401。
  explain: |
    分三類計算「不同的道具」：
    ① 3 種基本材料 → 一律同一種草藥：1 種
    ② 2 基本＋1 進階 → 由進階材料決定：10 種
    ③ 其他組合都是不同藥水：$C(6,1)C(10,2)+C(10,3)=6\times45+120=390$ 種
    共 $1+10+390=401$ → 答案 (3)
    提醒：先確認「什麼情況會產生相同結果」，再決定用組合數還是直接數種類。
ma115-05:
  key: A 把 $(1,0,1)$ 送到 $(1,0,1)$……而 $(1,0,-1)$ 被送到 0，解有無限多個且第二分量恆為 0。
  explain: |
    $(1,0,1)^T=(1,1,0)^T+(0,-1,1)^T$，所以 $A(1,0,1)^T=(0,-1,1)^T+(1,1,0)^T=(1,0,1)^T$。
    又 $A(1,0,-1)^T=0$，所以所有解為 $v=(1,0,1)^T+t(1,0,-1)^T=(1+t,0,1-t)^T$。
    （三個已知向量行列式 $=2\ne0$，彼此獨立，A 的零空間就是 $(1,0,-1)$ 方向。）
    v 垂直 $(0,1,0)$ ⇔ $v_2=0$，而所有解的 $v_2$ 都是 0 → 有無窮多個 → 答案 (5)
ma115-06:
  key: 分三種等腰情況，並排除三點共線；共 2 點。
  explain: |
    $AB=\sqrt{3^2+4^2}=5$，C 在 $y=-6$ 上。
    ① $CA=CB$：C 在 AB 的中垂線 $y=\left(\dfrac{3}{4}\right)\left(x-\dfrac{1}{2}\right)$ 上，代 $y=-6$ 得 $C\left(-\dfrac{15}{2},-6\right)$，1 點。
    ② $AC=AB=5$：$(x-2)^2+16=25$ ⇒ $x=5$ 或 $-1$。但 $(5,-6)$ 在直線 AB 上（三點共線，不成三角形），只剩 $(-1,-6)$，1 點。
    ③ $BC=AB=5$：$(x+1)^2+64=25$ 無解。
    共 2 點 → 答案 (2)。易錯點：忘了排除共線的情況。
ma115-07:
  key: 兩條直線交於 $(1,-1)$，可行區域在兩線下方，落在第三、第四象限。
  explain: |
    $2x-y-3>0$ ⇔ $y<2x-3$；$x+2y+1<0$ ⇔ $y<-\dfrac{x+1}{2}$，兩線交於 $(1,-1)$。
    第一象限：$y>0$ 但 $y<-\dfrac{x+1}{2}<0$，不可能。
    第二象限：$x<0$ 時 $y<2x-3<-3$，y 不可能為正。
    第三象限：例 $(-1,-10)$ 兩式皆成立 ✓
    第四象限：例 $(2,-5)$ 兩式皆成立 ✓
    x 軸（$y=0$）：需 $x>\dfrac{3}{2}$ 且 $x<-1$，矛盾。
    → 答案 (3)(4)
ma115-08:
  key: $A^2=2A+I$ ⇒ $A^{n+2}=2A^{n+1}+A^n$；又 $A^{2n}=(A^n)^2$。
  explain: |
    $A^2=\begin{bmatrix}5&2\\2&1\end{bmatrix}$。
    (1) $b_2=2$、$c_2=2$，不是 $b_2<c_2$ ✗
    (2) $2A+I=\begin{bmatrix}5&2\\2&1\end{bmatrix}=A^2$ ✓
    (3) 由 (2) 得 $A^{n+2}=2A^{n+1}+A^n$，所以 $c_{n+2}=2c_{n+1}+c_n$，不是 $c_{n+1}+2c_n$ ✗（例：$c_4=12$，但 $c_3+2c_2=9$）
    (4) $A^n(0,1)^T=(b_n,d_n)^T$；而 $(b_{n+1},d_{n+1})^T=A^n(A(0,1)^T)=A^n(1,0)^T=(a_n,c_n)^T$，兩者不同 ✗
    (5) $A^{2n}=(A^n)^2$，$a_{2n}=a_n^2+b_nc_n$，$d_{2n}=c_nb_n+d_n^2$，相減得 $d_n^2-a_n^2$ ✓
    → 答案 (2)(5)
ma115-09:
  key: 數學 $T=50+\left(\dfrac{5}{6}\right)(S-60)$，英文 $T=50+\left(\dfrac{5}{4}\right)(S-60)$；兩科換算比例不同。
  explain: |
    (1) 英文 52 分：$T=50+10\times\left(-\dfrac{8}{8}\right)=40$ ✓
    (2) 數學 $T-S=50+\left(\dfrac{5}{6}\right)(S-60)-S=-\dfrac{S}{6}\le0$，T 不會超過原始成績 ✓
    (3) ✗ 反例：乙（數80、英60）T 平均 $=\dfrac{66.7+50}{2}\approx58.3$；丙（數60、英76）T 平均 $=\dfrac{50+70}{2}=60$。乙原始平均 70 較高，T 平均反而較低。
    (4) $T\ge40$ ⇔ 數學 $S\ge48$、英文 $S\ge52$，數學及格分數較低 ✓
    (5) 原始成績迴歸斜率 $=r\times\dfrac{12}{8}=1.5r$；T 分數兩科標準差都是 10，斜率 $=r$，一般不相同 ✗
    → 答案 (1)(2)(4)
ma115-10:
  key: $\triangle ABD$ 面積 8、$\triangle ABE$ 面積 3 ⇒ $DE:EB=5:3$ ⇒ $\overrightarrow{DC}=\dfrac{5}{3}\overrightarrow{AB}$。
  explain: |
    (1) $\cos\angle BAD=\dfrac{\overrightarrow{AB}\cdot\overrightarrow{AD}}{|\overrightarrow{AB}||\overrightarrow{AD}|}=\dfrac{2-30}{\sqrt{40}\cdot\sqrt{26}}=-\dfrac{7}{\sqrt{65}}=-\dfrac{7\sqrt{65}}{65}$ ✓
    (2) $\triangle ABD=\dfrac{1}{2}|2\times5-(-6)\times1|=8$，不是 9 ✗
    梯形 $AB\parallel DC$：設 $\overrightarrow{DC}=k\cdot\overrightarrow{AB}$，則 $BE:ED=1:k$。$\dfrac{\triangle AED}{\triangle ABE}=k$，$3+3k=8$ ⇒ $k=\dfrac{5}{3}$。
    (3) $\overrightarrow{AC}=\overrightarrow{AD}+\overrightarrow{DC}=(1,5)+\dfrac{5}{3}(2,-6)=\left(\dfrac{13}{3},-5\right)$，$\overrightarrow{AE}=\dfrac{3}{8}\overrightarrow{AC}=\left(\dfrac{13}{8},-\dfrac{15}{8}\right)$ ✗
    (4) 面積 $=\triangle ABD+\triangle BCD=8+\dfrac{5}{3}\times8=\dfrac{64}{3}$，不是 $\dfrac{65}{3}$ ✗
    (5) $\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}=\left(\dfrac{7}{3},1\right)$，$|\overrightarrow{BC}|=\dfrac{\sqrt{58}}{3}\approx2.54<\dfrac{8}{3}\approx2.67$ ✓
    → 答案 (1)(5)
ma115-11:
  key: $(0,1)$ 永遠是交點；$\cos$ 是偶函數，所以 $(a,b)$ 在 $L_m$ 上 ⇔ $(-a,b)$ 在 $L_{-m}$ 上。
  explain: |
    (1) $x=0$ 時 $\cos0=1=m\cdot0+1$，$(0,1)$ 恆為交點，x 坐標不是負的 ✗
    (2) $b=\cos\left(\dfrac{\pi a}{2}\right)=ma+1$ ⇒ $\cos\left(-\dfrac{\pi a}{2}\right)=b$ 且 $(-m)(-a)+1=b$ ✓
    (3) $\cos\left(\dfrac{10\pi}{3}\right)=\cos\left(\dfrac{4\pi}{3}\right)=-\dfrac{1}{2}\ne\dfrac{1}{2}$，該點不在 $\Gamma$ 上 ✗
    (4) $\cos\left(\dfrac{\pi x}{2}\right)=-1$ ⇒ $x=2+4k$；代入 $-1=mx+1$ ⇒ $\dfrac{1}{m}=-\dfrac{x}{2}=-(1+2k)$，是奇數 ✓
    (5) 反例：$m=-1$（過 $(1,0)$），交點有 $x=0$、1、2 三個，是奇數個 ✗
    → 答案 (2)(4)
ma115-12:
  key: $g=f-2x^3-2x$，g 首項係數 $-1$；對稱中心 $x=-\dfrac{\text{二次項係數}}{3\times\text{首項係數}}$。
  explain: |
    設 $f=x^3+px^2+qx+r$，則 $g=-x^3+px^2+(q-2)x+r$。
    (2) $a_1=-\dfrac{p}{3}$，$a_2=\dfrac{p}{3}$ ⇒ $a_1+a_2=0$ ✓
    (1) $f-g=2x^3+2x=2x(x^2+1)=0$ 只有 $x=0$，只交一點 ✗
    (3) $b_1+b_2$ 會隨 p、r 改變，無法唯一確定 ✗
    (4) $a_1=a_2$ ⇒ $a_1=0$ ⇒ $p=0$，$b_1=f(0)=r=g(0)=b_2$ ✓
    (5) $b_1-b_2=(2q-2)a_1$；取 $q=1$、$p\ne0$，$b_1=b_2$ 但 $a_1\ne a_2$ ✗
    → 答案 (2)(4)
ma115-13:
  key: 條件機率 $=\dfrac{\text{碩士且通過}}{\text{通過}}=\dfrac{9/20}{10/20}=\dfrac{9}{10}$。
  explain: |
    學士且通過：$\left(\dfrac{1}{4}\right)\left(\dfrac{1}{5}\right)=\dfrac{1}{20}$；碩士且通過：$\left(\dfrac{3}{4}\right)\left(\dfrac{3}{5}\right)=\dfrac{9}{20}$。
    $P(\text{碩士}\mid\text{通過})=\dfrac{9/20}{1/20+9/20}=\dfrac{9}{10}$
    → 13-1＝9，13-2＝1，13-3＝0
ma115-14:
  key: 直線方向向量 $(1,b)$，垂直 ⇒ $a+b^2=0$ ⇒ $a+b=-\left(b-\dfrac{1}{2}\right)^2+\dfrac{1}{4}$。
  explain: |
    $y=bx-1$ 的方向向量為 $(1,b)$。$(a,b)$ 與直線垂直 ⇒ $(a,b)\cdot(1,b)=a+b^2=0$ ⇒ $a=-b^2$。
    $a+b=-b^2+b=-\left(b-\dfrac{1}{2}\right)^2+\dfrac{1}{4}$，最大值 $\dfrac{1}{4}$（$b=\dfrac{1}{2}$ 時）
    → 14-1＝1，14-2＝4
ma115-15:
  key: b 是 a、c 的中點，三點共線 ⇒ $\log4b$ 是 $\log3a$、$\log6c$ 的平均 ⇒ $16b^2=18ac$。
  explain: |
    a、b、c 等差 ⇒ b 是 a、c 的中點；三點共線 ⇒ 中間點的 y 值也是平均：
    $2\log(4b)=\log(3a)+\log(6c)$ ⇒ $16b^2=18ac$ ⇒ $8b^2=9ac$。
    代 $c=2b-a$：$8b^2=9a(2b-a)$ ⇒ $8t^2-18t+9=0$（$t=\dfrac{b}{a}$）⇒ $t=\dfrac{3}{2}$ 或 $\dfrac{3}{4}$。
    $a<b$ ⇒ $t>1$ ⇒ $\dfrac{b}{a}=\dfrac{3}{2}$ → 15-1＝3，15-2＝2
ma115-16:
  key: $f(x)=-4x^2+1$，$P(0,1)$；平移後頂點 $(h,1+2h)$ 過 $\left(\dfrac{1}{2},0\right)$ ⇒ $h=\dfrac{3}{2}$。
  explain: |
    $\Gamma$ 過 $\left(\pm\dfrac{1}{2},0\right)$ 且頂點在 y 軸上：$f(x)=k\left(x^2-\dfrac{1}{4}\right)$，頂點 $\left(0,-\dfrac{k}{4}\right)$ 在 $y=1+2x$ ⇒ $-\dfrac{k}{4}=1$ ⇒ $k=-4$。$P=(0,1)$。
    平移後 $y=-4(x-h)^2+(1+2h)$，過 $\left(\dfrac{1}{2},0\right)$：$-4\left(\dfrac{1}{2}-h\right)^2+1+2h=0$ ⇒ $-4h^2+6h=0$ ⇒ $h=\dfrac{3}{2}$（$h=0$ 與 P 重合，不合）。
    $Q=\left(\dfrac{3}{2},4\right)$，$PQ=\sqrt{\left(\frac{3}{2}\right)^2+3^2}=\dfrac{\sqrt{45}}{2}=\dfrac{3\sqrt{5}}{2}$
    → 16-1＝3，16-2＝5，16-3＝2
ma115-17:
  key: 設 $\angle ACD=\theta$，由 $BC=2BD$ 推得 $\sin\theta=\dfrac{1}{4}$，$k=\dfrac{\tan\theta}{\tan3\theta}=\dfrac{3}{11}$。
  explain: |
    以 A 為原點、AB 為 x 軸、AC 為 y 軸，設 $AC=c$，$\angle ACD=\theta$，則 $\angle ACB=3\theta$。
    $AD=c\cdot\tan\theta$，$AB=c\cdot\tan3\theta$，$BC=\dfrac{c}{\cos3\theta}$，$BD=c(\tan3\theta-\tan\theta)$。
    $BC=2BD$ ⇒ $\dfrac{1}{\cos3\theta}=2\cdot\dfrac{\sin2\theta}{\cos3\theta\cos\theta}$ ⇒ $1=4\sin\theta$ ⇒ $\sin\theta=\dfrac{1}{4}$。
    $\tan\theta=\dfrac{1}{\sqrt{15}}$，$\tan3\theta=\dfrac{3\tan\theta-\tan^3\theta}{1-3\tan^2\theta}=\dfrac{11}{3\sqrt{15}}$。
    $k=\dfrac{AD}{AB}=\dfrac{\tan\theta}{\tan3\theta}=\dfrac{3}{11}$ → 17-1＝3，17-2＝1，17-3＝1
    這題全國答對率只有 6%，關鍵是把「角度倍數」和「邊長比例」都用 $\theta$ 表示。
ma114-01:
  key: 獨立 ⇔ $P(\text{藍}\cap\text{1號})=P(\text{藍})P(\text{1號})$：$\dfrac{2}{9+k}=\dfrac{5}{9+k}\cdot\dfrac{6}{9+k}$。
  explain: |
    總數 $9+k$。$P(\text{藍})=\dfrac{5}{9+k}$，$P(\text{1號})=\dfrac{6}{9+k}$，$P(\text{藍且1號})=\dfrac{2}{9+k}$。
    獨立 ⇒ $\dfrac{2}{9+k}=\dfrac{30}{(9+k)^2}$ ⇒ $9+k=15$ ⇒ $k=6$ → 答案 (5)
ma114-02:
  key: 兩三角形面積分別為 $\dfrac{2}{3}a^2$ 與 $\dfrac{3}{4}a^2$，差 $\dfrac{a^2}{12}=3$。
  explain: |
    $L_1$ 斜率 $-\dfrac{4}{3}$，y 截距 $\dfrac{4}{3}a$，面積 $=\dfrac{1}{2}\cdot a\cdot\dfrac{4}{3}a=\dfrac{2}{3}a^2$。
    $L_2$ 斜率 $-\dfrac{3}{2}$，y 截距 $\dfrac{3}{2}a$，面積 $=\dfrac{1}{2}\cdot a\cdot\dfrac{3}{2}a=\dfrac{3}{4}a^2$。
    面積差 $=\left(\dfrac{3}{4}-\dfrac{2}{3}\right)a^2=\dfrac{a^2}{12}=3$ ⇒ $a^2=36$ ⇒ $a=6$ → 答案 (2)
ma114-03:
  key: 三類各自綑綁排 $3!=6$ 種順序，扣掉「歌唱排第一」的 2 種，剩 4 種。
  explain: |
    同類綑綁：類別順序 $3!=6$ 種；類內排列 $5!\times4!\times3!$。
    「歌唱在鋼琴之後或小提琴之後」⇔ 歌唱不是第一個，排除「歌唱、鋼琴、小提琴」與「歌唱、小提琴、鋼琴」2 種。
    共 $4\times5!\times4!\times3!$ → 答案 (4)
ma114-04:
  key: 對每個整數 $x=3\sim30$，數 $0<y<\log_2 x$ 的整數 y；$\log_2 x$ 為整數時不含邊界。
  explain: |
    $x=2$：0 個；$x=3$、4：各 1 個；$x=5\sim8$：各 2 個（共 8）；$x=9\sim16$：各 3 個（共 24）；$x=17\sim30$：各 4 個（共 56）。
    注意 $x=4$、8、16 時 $\log_2 x$ 是整數，y 取到邊界不算，所以 $x=4$ 只有 1 個、$x=8$ 只有 2 個、$x=16$ 只有 3 個。
    總數 $=0+1+1+(2\times4)+(3\times8)+(4\times14)=2+8+24+56=90$ → 答案 (3)
ma114-05:
  key: $\cos2\theta>\cos\theta$ ⇒ $\cos\theta<-\dfrac{1}{2}$；再配合 $\sin\theta<0$，得 $\pi<\theta<\dfrac{4\pi}{3}$。
  explain: |
    $\cos2\theta>\cos\theta$ ⇔ $2\cos^2\theta-\cos\theta-1>0$ ⇔ $(2\cos\theta+1)(\cos\theta-1)>0$ ⇒ $\cos\theta<-\dfrac{1}{2}$ ⇒ $\dfrac{2\pi}{3}<\theta<\dfrac{4\pi}{3}$。
    $\sin2\theta>\sin\theta$ ⇔ $\sin\theta(2\cos\theta-1)>0$；此範圍內 $2\cos\theta-1<0$ ⇒ $\sin\theta<0$ ⇒ $\pi<\theta<2\pi$。
    交集：$\pi<\theta<\dfrac{4\pi}{3}$ ⇒ $a=1$，$b=\dfrac{4}{3}$，$b-a=\dfrac{1}{3}$ → 答案 (1)
ma114-06:
  key: 互相垂直 ⇒ $|\overrightarrow{u}-\overrightarrow{v}|^2=|\overrightarrow{u}|^2+|\overrightarrow{v}|^2$；解出 $|\overrightarrow{u}|^2=1$、$|\overrightarrow{v}|^2=4$、$|\overrightarrow{w}|^2=10$。
  explain: |
    $|\overrightarrow{u}-\overrightarrow{v}|^2=|\overrightarrow{u}|^2+|\overrightarrow{v}|^2=5$；$|\overrightarrow{v}-\overrightarrow{w}|^2=|\overrightarrow{v}|^2+|\overrightarrow{w}|^2=14$；$\overrightarrow{u}-\overrightarrow{w}=(1,1,3)$ ⇒ $|\overrightarrow{u}|^2+|\overrightarrow{w}|^2=11$。
    三式相加 ⇒ 平方和 $=15$ ⇒ $|\overrightarrow{u}|^2=1$，$|\overrightarrow{v}|^2=4$，$|\overrightarrow{w}|^2=10$。
    體積 $=|\overrightarrow{u}||\overrightarrow{v}||\overrightarrow{w}|=\sqrt{40}=2\sqrt{10}$ → 答案 (3)
ma114-07:
  key: $b_{n+1}=\dfrac{b_n}{3}$，$b_1=\dfrac{9}{4}$；$3^na_n=\dfrac{27+3^n(2n-3)}{4}$。
  explain: |
    $a_2=\dfrac{a_1+1}{3}=1$ → (1) ✗
    $b_2=1-1+\dfrac{3}{4}=\dfrac{3}{4}$ → (2) ✓
    $b_{n+1}=\dfrac{a_n+n}{3}-\dfrac{n+1}{2}+\dfrac{3}{4}=\left(\dfrac{1}{3}\right)\left(a_n-\dfrac{n}{2}+\dfrac{3}{4}\right)=\dfrac{b_n}{3}$，公比 $\dfrac{1}{3}$ → (3) ✗
    $a_n=\dfrac{9}{4}\left(\dfrac{1}{3}\right)^{n-1}+\dfrac{n}{2}-\dfrac{3}{4}$ ⇒ $3^na_n=\dfrac{27+3^n(2n-3)}{4}$，檢查 n 為奇數或偶數時分子都被 4 整除且為正 → (4) ✓
    $b_{10}=\dfrac{9}{4}\left(\dfrac{1}{3}\right)^9=\dfrac{1}{8748}\approx1.14\times10^{-4}>10^{-4}$ → (5) ✗
    → 答案 (2)(4)
ma114-08:
  key: 化簡指數得 $(x-1)^2+y^2=4$，是圓心 $(1,0)$、半徑 2 的圓。
  explain: |
    $2^{x^2-3}=2^{2x-y^2}$ ⇒ $x^2-2x+y^2=3$ ⇒ $(x-1)^2+y^2=4$。
    (1) $x=3$ ⇒ $y=0$，只有 1 個解 ✗
    (2) 圓心不在原點，不對稱於原點（例 $(3,0)$ 在圓上，$(-3,0)$ 不在）✗
    (3) 圓 ✓
    (4) 圓心到 $x+y=4$ 的距離 $=\dfrac{3}{\sqrt{2}}>2$，不相交 ✗
    (5) $x-y$ 最大值 $=(1-0)+2\times\sqrt{2}=1+2\sqrt{2}$ ✓
    → 答案 (3)(5)
ma114-09:
  key: $b^2\ge4c>(b+2)^2$ ⇒ $c>0$ 且 $b<-1$。
  explain: |
    第一式有實根：$b^2-4c\ge0$；第二式無實根：$(b+2)^2-4c<0$。
    (1) $4c>(b+2)^2\ge0$ ⇒ $c>0$ ✗
    (2) $b^2\ge4c>(b+2)^2$ ⇒ $4b+4<0$ ⇒ $b<-1$ ✓
    (3) 反例 $b=-3$、$c=2$：$(b+1)^2-4c=4-8<0$ 無實根 ✗
    (4) 判別式 $(b+2)^2+4c>0$ ✓
    (5) $b<-1$ ⇒ $(b-2)^2>b^2\ge4c$，判別式 $>0$ ✓
    → 答案 (2)(4)(5)
ma114-10:
  key: $0<k<1$ 時在 $[0,3]$ 有 4 個交點：$x_1$、$1-x_1$、$2+x_1$、$3-x_1$。
  explain: |
    要在 $(0,1)$ 內有兩交點，必須 $0<k<1$ → (1) ✓；此時 $(1,2)$ 內 $\sin$ 為負無交點，$(2,3)$ 內又有兩點，共 4 個 → (2) ✗
    $x_2=1-x_1$ ⇒ $x_1+x_2=1$ → (3) ✗
    $PQ=1-2x_1$，$QR=(2+x_1)-(1-x_1)=1+2x_1$；$2PQ=QR$ ⇒ $x_1=\dfrac{1}{6}$ ⇒ $k=\sin\left(\dfrac{\pi}{6}\right)=\dfrac{1}{2}$ → (4) ✓
    四個交點 x 坐標和 $=6>5$ → (5) ✓
    → 答案 (1)(4)(5)
ma114-11:
  key: 角平分線分對邊：$CP:PD=BC:BD=4:3$；$\overrightarrow{AP}=\dfrac{2}{7}\overrightarrow{AB}+\dfrac{3}{7}\overrightarrow{AC}$。
  explain: |
    $BD=3$，$BC=4$ ⇒ $CP:PD=4:3$ ⇒ $CP=\dfrac{4}{7}CD$ → (1) ✗
    $\overrightarrow{AP}=\dfrac{3}{7}\overrightarrow{AC}+\dfrac{4}{7}\overrightarrow{AD}=\dfrac{2}{7}\overrightarrow{AB}+\dfrac{3}{7}\overrightarrow{AC}$ → (2) ✗
    $\cos\angle BAC=\dfrac{36+25-16}{60}=\dfrac{3}{4}$ → (3) ✓
    $\sin A=\dfrac{\sqrt{7}}{4}$，$\triangle ABC=\dfrac{15\sqrt{7}}{4}$，$\triangle ACD=\dfrac{15\sqrt{7}}{8}$，$\triangle ACP=\dfrac{4}{7} \triangle ACD=\dfrac{15\sqrt{7}}{14}$ → (4) ✓
    $\overrightarrow{AP}\cdot\overrightarrow{AC}=\dfrac{2}{7}\left(6\cdot5\cdot\dfrac{3}{4}\right)+\dfrac{3}{7}\cdot25=\dfrac{45}{7}+\dfrac{75}{7}=\dfrac{120}{7}$ → (5) ✓
    → 答案 (3)(4)(5)
ma114-12:
  key: $u=100-x$、$v=\dfrac{y}{1000}$；線性轉換後迴歸直線跟著轉換：$v=2.09-0.0213u$。
  explain: |
    (1) 乙占比＝100−甲占比 ✓
    (2) 1 奈米 $=10^{-3}$ 微米，$v=\dfrac{y}{1000}$，不是 $1000y$ ✗
    (3) $u=100-x$ 只是平移加反向，標準差不變 ✓
    (4) $v=\dfrac{21.3x-40}{1000}=\dfrac{21.3(100-u)-40}{1000}=2.09-0.0213u$ ⇒ $b=2.09$ ✓
    (5) 新增的點剛好落在原迴歸線上（殘差 0），最小平方的條件不變，迴歸線不變 ✓
    → 答案 (1)(3)(4)(5)
ma114-13:
  key: $f(x)=(x+6)q(x)+3$，$q(x)=8-m(x+6)^2$；令 $t=x+6$，$f=-mt^3+8t+3$。
  explain: |
    $q(x)$ 在 $x=-6$ 有最大值 8 ⇒ $q(x)=8-m(x+6)^2$（$m>0$）。
    $f(x)=(x+6)[8-m(x+6)^2]+3$。令 $t=x+6$：$f=-mt^3+8t+3$，是奇函數再加 3。
    對稱中心在 $t=0$、$y=3$，即 $(-6,3)$ → 13-1＝−，13-2＝6，13-3＝3
ma114-14:
  key: a,b,c 皆負，決定絕對值的正負號：$4b+3c=-28$、$3b+4c=-35$ ⇒ $b=-1$、$c=-8$。
  explain: |
    到 $E_1$：$\dfrac{|4b+3c-2|}{5}=6$，b、$c<0$ ⇒ $4b+3c-2=-30$ ⇒ $4b+3c=-28$。
    到 $E_2$：$\dfrac{|3b+4c+5|}{5}=6$ ⇒ $3b+4c+5=-30$ ⇒ $3b+4c=-35$。
    解得 $b=-1$，$c=-8$。
    到 $E_3$：$\dfrac{|a+2b+2c+2|}{3}=6$ ⇒ $|a-16|=18$ ⇒ $a=-2$（$a<0$）。
    $a+b+c=-11$ → 14-1＝−，14-2＝1，14-3＝1
ma114-15:
  key: 第 3 次正面出現在第 3、4、5 次的機率分別 $\dfrac{1}{8}$、$\dfrac{3}{16}$、$\dfrac{3}{16}$，其餘 $\dfrac{1}{2}$。
  explain: |
    前 3 次都正面：$\dfrac{1}{8}$ → 240 元
    第 4 次才累積 3 正：$C(3,2)\left(\dfrac{1}{2}\right)^3\cdot\dfrac{1}{2}=\dfrac{3}{16}$ → 320 元
    第 5 次才累積 3 正：$C(4,2)\left(\dfrac{1}{2}\right)^4\cdot\dfrac{1}{2}=\dfrac{3}{16}$ → 400 元
    其餘：$1-\dfrac{1}{8}-\dfrac{3}{16}-\dfrac{3}{16}=\dfrac{1}{2}$ → 480 元
    期望值 $=30+60+75+240=405$ → 15-1＝4，15-2＝0，15-3＝5
ma114-16:
  key: 由 O 到 $L_1$ 距離 1 解出 $m=\dfrac{3}{4}$；$L_2$ 相切得半徑 $\dfrac{13}{5}$；弦長 $=2\sqrt{r^2-1}$。
  explain: |
    $L_1$：$mx-y+(1-3m)=0$，距離 $\dfrac{|1-3m|}{\sqrt{m^2+1}}=1$ ⇒ $8m^2-6m=0$ ⇒ $m=\dfrac{3}{4}$（$m=0$ 時 $L_1$、$L_2$ 重合且與圓相切，不合）。
    $L_2$：$mx+y-(1+3m)=0$ 與圓相切 ⇒ $r=\dfrac{1+\frac{9}{4}}{\frac{5}{4}}=\dfrac{13}{5}$。
    $AB=2\sqrt{r^2-1}=2\sqrt{\frac{144}{25}}=\dfrac{24}{5}$ → 16-1＝2，16-2＝4，16-3＝5
ma114-17:
  key: BD 平分 $\angle ADC$（等腰 $AB=BC$），用餘弦定理得 AD、CD 都是 $x^2-6x+7=0$ 的根。
  explain: |
    $AC^2=9+9-2\cdot9\cdot\left(-\dfrac{1}{8}\right)=\dfrac{81}{4}$ ⇒ $AC=\dfrac{9}{2}$；$\cos\angle BAC=\cos\angle BCA=\dfrac{3}{4}$。
    同弧所對圓周角相等：$\angle ADB=\angle ACB$，$\angle BDC=\angle BAC$，兩者都等於 $\alpha$（$\cos\alpha=\dfrac{3}{4}$）。
    $\triangle ABD$ 餘弦定理：$9=AD^2+16-2\cdot4\cdot AD\cdot\dfrac{3}{4}$ ⇒ $AD^2-6AD+7=0$；同理 CD 也滿足此式。
    托勒密：$AC\cdot BD=AB\cdot CD+BC\cdot AD$ ⇒ $18=3(AD+CD)$ ⇒ $AD+CD=6$，所以兩根 $3\pm\sqrt{2}$ 分別是 AD、CD。
    $AD\le CD$ ⇒ $CD=3+\sqrt{2}$ → 17-1＝3，17-2＝2
ma113-01:
  key: 半衰期 2 小時：4 小時後剩 $\left(\dfrac{1}{2}\right)^2=\dfrac{1}{4}$。
  explain: |
    殘留量 $=\left(\dfrac{1}{2}\right)^{t/2}$。
    3 小時：$\left(\dfrac{1}{2}\right)^{1.5}\approx0.35$；4 小時：$\dfrac{1}{4}$ ✓；6 小時：$\dfrac{1}{8}$；8 小時：$\dfrac{1}{16}$；10 小時：$\dfrac{1}{32}$
    → 答案 (2)
