# 自然第 3 週（Day 15–21）解析（Claude 撰寫；已對照原卷圖。答案皆為大考中心公布答案；老師審閱後可修改）
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。

# ---------- Day 15：地震海嘯預警、起重機的力與能量、DNA 鹼基 ----------
sci115-07:
  key: 311 地震發生在太平洋板塊隱沒的板塊交界；海嘯能橫越大洋到遠處造成災害，需要全球預警。
  explain: |
    (A) 311 大地震發生在日本海溝，是太平洋板塊隱沒到日本東北下方的聚合型板塊邊界 ✓
    (B) 海底山崩、火山爆發、隕石撞擊也可能引發海嘯，不是「都」由地震引發 ✗（全國 26% 誤選）
    (C) 預警系統能爭取疏散時間；傷亡重大是因為地震規模極大、海嘯極高，不代表系統無效 ✗
    (D) 臺灣東北、南方外海也有隱沒帶（琉球海溝、馬尼拉海溝），一樣可能發生海嘯 ✗
    (E) 海嘯在深海傳得快、能量損失小，可以跨越大洋在遠處造成災害 ✓
sci115-08:
  key: P 波 25 秒到站、第 35 秒發出預警；S 波 50 秒到 → 15 秒；海嘯 150÷12＝12.5 分鐘 → 約 12 分鐘。
  explain: |
    P 波到地震站：150÷6＝25 秒；再花 10 秒計算 → 地震後第 35 秒發出預警。
    S 波到海岸線：150÷3＝50 秒 → 預警時間 50－35＝15 秒 (B) ✓
    海嘯到海岸線：150÷12＝12.5 分鐘 → 扣掉 35 秒，約 12 分鐘 (D) ✓
    (C) 50 秒是 S 波抵達的時間，還要扣掉發出預警前的 35 秒 ✗（全國 18% 誤選）
    (A) 有 15 秒的預警時間 ✗；(E) 海嘯約 12 分鐘就到，不是 120 分鐘 ✗
sci115-11:
  key: 加速上升時合力向上，減速上升時合力向下；加速度永遠和合力同方向（F＝ma）。
  explain: |
    甲→乙加速上升：合力向上；乙→丙等速：合力為 0；丙→丁減速上升：合力向下。
    (A) 丙→丁的合力向下 ✗（全國 43% 誤選）
    (B) 甲→乙的合力向上 ✗
    (C) 丙→丁位移向上、合力向下，方向相反 ✗（全國 39% 誤選）
    (D) 丙→丁速度向上、合力向下，方向相反 ✓（全國 48% 漏選）
    (E) F＝ma，加速度與合力的方向永遠相同 ✓（全國 48% 漏選）
    提醒：合力方向要看速度怎麼變（加速度），不是看物體往哪裡走。
sci115-12:
  key: 從靜止到靜止 → 動能變化總和為 0，所以 ΔK甲乙＋ΔK丙丁＝0；一路往上 → 位能變化總和＞0。
  explain: |
    動能：甲（靜止）→乙（速率 v）增加 ½mv²；乙→丙等速，不變；丙→丁（停止）減少 ½mv²。
    (B) ΔK甲乙＋ΔK丙丁＝½mv²－½mv²＝0 ✓
    (E) 重物一路升高，位能變化總和＝mgh＞0 ✓
    (A) 甲→乙的位能、動能都增加，總和＞0；起重機對重物作功，力學能不守恆 ✗（全國 21% 誤選）
    (C) 乙→丙動能不變、位能增加，總和＞0 ✗（全國 32% 誤選）
    (D) 起點、終點都靜止，三段動能變化總和＝0，不是＞0 ✗（全國 29% 誤選）
sci113-06:
  key: 雙股 DNA 中 A＝T、G＝C，嘌呤總數＝嘧啶總數；本題雙股合計 A＝T＝6、G＝C＝3。
  explain: |
    已知股 ATTGCCTTA：A 2、T 4、G 1、C 2；互補股 TAACGGAAT：A 4、T 2、G 2、C 1。
    雙股合計：A＝6、T＝6、G＝3、C＝3。
    (E) G＋C＝3＋3＝6＝A ✓
    (A) A 有 6 個、C 有 3 個，不相同 ✗（全國 19% 誤選）
    (B) A＝T，不是兩倍 ✗
    (C)(D) 雙股中嘌呤（A＋G＝9）＝嘧啶（T＋C＝9），沒有誰比較多 ✗（(C) 全國 20% 誤選）
    注意題目問的是「雙股」，只數一股會算錯。

# ---------- Day 16：啤酒苦味的萃取、溫度決定性別、眼睛與相機 ----------
sci114-28:
  key: 甲、乙分子式都是 C₂₁H₃₀O₅、結構不同 → 互為異構物；苦度＝吸光度×50，與濃度成正比。
  explain: |
    數碳數：甲＝六元環 6＋兩個異戊烯基 5＋5＋右上的醯基 5＝21；乙＝五元環 5＋異戊烯基 5＋右上的醯基 5＋下方的醯基 6＝21。
    (A) 甲有 21 個 C、5 個 O（2 個 C＝O、3 個 OH）、30 個 H → C₂₁H₃₀O₅ ✓（全國 51% 漏選）
    (B) 甲、乙都是 21 個碳 ✗（全國 23% 誤選）
    (C) 乙的分子式也是 C₂₁H₃₀O₅，但結構不同 → 異構物 ✓
    (D) 吸光度與濃度成正比，苦度＝吸光度×50 → 苦度與濃度成正比，不是反比 ✗（全國 24% 誤選）
    (E) 異辛烷不溶於水，是用來把甲、乙從啤酒中萃取出來，不是幫助混合 ✗（全國 36% 誤選）
sci114-29:
  key: 甲、乙是弱酸；加強酸讓它們維持分子態、容易被異辛烷萃取；醋酸太弱，萃取不完全 → 苦度偏低。
  explain: |
    原理：甲、乙在水中會部分解離成酸根。加入強酸（[H⁺] 大）會抑制解離，讓它們保持分子態，才容易溶進非極性的異辛烷層。
    (A) 實驗一、二用強酸（苦度 26.5、28.7），實驗三用弱酸醋酸（8.8）→ 酸的強弱會影響測量 ✓
    (B) 異辛烷加倍（25.0 mL），萃取出的甲、乙被稀釋，吸光度約減半 → 苦度約 13，不是 53 ✗（全國 22% 誤選）
    (C) 加入 NaOH 會中和 H⁺，促使甲、乙解離 → 水中的酸根濃度上升，不是下降 ✗（全國 57% 誤選）
    (D) 啤酒加倍，萃取到的甲、乙變多 → 測得的苦度值變高，不是變低 ✗（全國 15% 誤選）
    (E) 步驟二用異辛烷把甲、乙從啤酒中分離出來，就是萃取 ✓（全國 64% 漏選）
sci115-37:
  key: 雌雄都有 Dmrt1 基因，差別在「表現與否」；轉錄在細胞核、轉譯在細胞質。
  explain: |
    (A) 雌、雄巴西龜都有 Dmrt1 基因，只是在 32 ℃ 時不表現 ✗（全國 15% 誤選）
    (B) Dmrt1 表現時胚胎發育為雄性 → Dmrt1 蛋白質可能促進雄性性器官發育 ✓
    (C) 真核細胞的基因都在細胞核中轉錄 ✗（全國 29% 誤選）
    (D) mRNA 送到細胞質，由核糖體轉譯 ✓
    (E) Kdm6b 蛋白質會促進 Dmrt1 轉錄，而轉錄在細胞核中進行 → 它要在細胞核發揮作用 ✓
sci115-39:
  key: 圖 14：青蛙最先分出，其次是大鼠；其餘分成（蜥蜴、蛇）和（巴西龜、（鱷魚、鳥））兩群。
  explain: |
    判讀親緣樹看「分支的先後與組合」；同一個分支點的左右對調，關係不變。
    圖 14 的關係：青蛙最早分出 → 再分出大鼠 → 剩下的分成兩群：蜥蜴＋蛇；巴西龜＋（鱷魚＋鳥）。
    (A) 青蛙、大鼠依序分出；烏龜與（鳥、鱷魚）一群，蛇與蜥蜴一群 ✓
    (D) 同樣的關係，只是把（蜥蜴、蛇）畫在左邊 ✓
    (B)(C) 都把大鼠畫成最先分出 ✗；(E) 鱷魚、鳥、大鼠的位置都不對 ✗
sci113-21:
  key: 相機和眼睛都靠透鏡折射成像，在感光元件或視網膜上形成倒立實像。
  explain: |
    (D) 凸透鏡把遠方物體成像在感光元件或視網膜上，都是倒立實像（大腦再把影像「轉正」）✓
    (A) 成像靠的是光經過角膜、水晶體時的「折射」，不是干涉 ✗
    (B) 近視、遠視用凹、凸透鏡矯正，靠的也是折射，不是繞射 ✗
    (C) 成像在感光元件之前是對焦問題，要調整鏡頭與感光元件的距離；換感光更強的元件沒有用 ✗（全國 19% 誤選）
    (E) 眼睛靠睫狀肌改變水晶體的厚薄（焦距）來對焦；瞳孔只調節進光量 ✗（全國 22% 誤選）

# ---------- Day 17：月球溫度與核能、海洋水色與聖嬰、化學計量 ----------
sci115-17:
  key: 分子平均動能正比於絕對溫度：(121＋273)/(－133＋273)＝394/140。
  explain: |
    先換成克氏溫度：日間 121＋273＝394 K；夜間 －133＋273＝140 K。
    平均動能比＝絕對溫度比＝394/140 → (E) ✓
    (C) 121/133 直接用攝氏溫度，還把負號丟掉了 ✗（全國 14% 誤選）
    (A)(B) 是地球的數據 ✗；(D) 夜間溫度換算錯誤 ✗
sci115-18:
  key: E＝Δmc²≈3×10⁻¹¹ J；電功率 Pₑ＝33%×R×E → R＝Pₑ/(0.33E)≈3×10¹⁹ 次／秒。
  explain: |
    (A) 反應前是鈾核＋1 個中子，反應後是鋇、氪＋3 個中子：Δm＝M_U＋M_n－(M_Ba＋M_Kr＋3M_n)＝M_U－M_Ba－M_Kr－2M_n ✗（全國 15% 誤選）
    (B) 質能互換是 E＝Δmc²，不是 Δm×c ✗（全國 19% 誤選）
    (C) E＝3.3×10⁻²⁸×(3×10⁸)²≈3×10⁻¹¹ J，不是 3×10⁻⁸ J ✗（全國 16% 誤選）
    (D) 每秒產生的核能是 R×E，其中 33% 變成電能：Pₑ＝0.33×R×E → R＝Pₑ/(0.33×E)；選項把 33% 放錯了位置 ✗（全國 29% 誤選）
    (E) R＝3×10⁸÷(0.33×3×10⁻¹¹)≈3×10¹⁹ 次／秒 ✓
sci114-41:
  key: 反聖嬰年信風增強、湧升旺盛，赤道的高葉綠素帶向西延伸（圖甲）；中緯度的分布則和北太平洋洋流有關。
  explain: |
    赤道太平洋吹東風（信風），把表層海水往西推，東太平洋底下富含營養鹽的冷水湧升 → 浮游植物多、葉綠素高。
    圖甲赤道的高濃度帶比圖乙延伸得遠 → 圖甲是反聖嬰年（信風強），圖乙是聖嬰年（信風弱、湧升減弱）。
    (A) 洋流與湧升把營養鹽帶上來，影響葉綠素分布 ✓
    (B) 赤道太平洋盛行東風（信風）；葉綠素較低的圖乙是聖嬰年，原因是信風減弱、湧升變弱 ✗（全國 41% 誤選）
    (C) 反聖嬰年信風增強，高濃度區向西延伸 ✓
    (D) 中緯度的高濃度區沿著北太平洋的表面洋流分布 ✓
    (E) 沿岸葉綠素高，主要是營養鹽豐富（河川輸入、沿岸湧升），不是低溫促進葉綠素合成 ✗（全國 23% 誤選）
sci114-42:
  key: 鯨魚減少 → 鐵離子不足 → 矽藻減少 → 磷蝦也減少 → 整個生態系可能崩解。
  explain: |
    食物鏈：矽藻 → 磷蝦 → 鯨魚；鯨魚的排泄物又提供矽藻需要的鐵，形成循環。
    鯨魚瀕臨滅絕 → 鐵離子不足，矽藻（生產者）減少 → 磷蝦缺乏食物也減少 (C) ✓ → 生態系面臨崩解 (E) ✓
    (A) 矽藻減少 → 葉綠素濃度變低 → 水色灰階值變大（偏白），不是變小 ✗（全國 51% 誤選）
    (B) 矽藻缺鐵，數量下降 ✗；(D) 生產者減少，總生物量下降 ✗
sci113-14:
  key: 1.54 g÷30.8＝0.050 mol；1 mol 硼烷氨產生 3 mol H₂ → 0.15×24.5≈3.68 L。
  explain: |
    硼烷氨 H₃NBH₃ 的分子量＝3＋14＋10.8＋3＝30.8 → 1.54÷30.8＝0.050 mol。
    平衡：H₃NBH₃＋HCl＋3H₂O → H₃BO₃＋NH₄Cl＋3H₂（B、N、Cl 各 1 個；O 由 H₃BO₃ 決定要 3 個 H₂O；最後用 H₂ 平衡氫：左邊 13 個 H，右邊扣掉 H₃BO₃、NH₄Cl 的 7 個，剩 6 個 → 3H₂）
    H₂＝0.050×3＝0.15 mol → 0.15×24.5≈3.68 L (C) ✓
    (A) 1.23 L 是只算 1 mol H₂ 的結果；(B) 3.36 L 是誤用 0 ℃ 的莫耳體積 22.4 L ✗

# ---------- Day 18：烷類燃燒熱、潮汐與潮汐發電、海洋的時間尺度 ----------
sci114-55:
  key: 每克放熱＝莫耳燃燒熱÷分子量：甲烷 55.6＞丁烷 49.6＞戊烷 48.7 kJ/g。
  explain: |
    每克放熱（kJ/g）：甲烷 890÷16≈55.6、乙烷 1560÷30＝52.0、丁烷 2874÷58≈49.6、戊烷 3509÷72≈48.7、辛烷 5460÷114≈47.9。
    (B) 甲烷＞丁烷＞戊烷 ✓
    (A) 1 莫耳任何物質都含 6.02×10²³ 個分子，和分子量無關 ✗（全國 19% 誤選）
    (C) 丁烷、戊烷、辛烷每克都不到 50 kJ ✗（全國 19% 誤選）
    (D) 2 莫耳甲烷放熱 1780 kJ，比 1 莫耳乙烷的 1560 kJ 多 ✗
    (E) 每多一個 CH₂，燃燒熱約增加 650 kJ（戊烷→辛烷：(5460－3509)÷3≈650）→ 己烷約 3509＋650≈4160 kJ/mol，不是 6200 ✗
sci114-57:
  key: 甲烷的氫碳比最高，放出相同熱量時產生的 CO₂ 最少；等重的不同烷類，耗氧量、生成水量都不同。
  explain: |
    (A) 液化天然氣是甲烷，CH₄＋2O₂ → CO₂＋2H₂O 已平衡 ✓（全國 36% 漏選）
    (B) 丁烷的莫耳燃燒熱比丙烷大，等莫耳數時兩者放熱不會各占一半 ✗（全國 20% 誤選）
    (C) 1 g 甲烷需 O₂ 2/16＝0.125 mol；1 g 丙烷需 5/44≈0.114 mol、1 g 丁烷需 6.5/58≈0.112 mol → 不同 ✗（全國 23% 誤選）
    (D) 1 g 甲烷生成水 2/16＝0.125 mol；1 g 丙烷生成 4/44≈0.091 mol、丁烷 5/58≈0.086 mol → 不同 ✗（全國 21% 誤選）
    (E) 每生成 1 mol CO₂ 放出的熱：甲烷 890 kJ、乙烷 780 kJ、丁烷約 719 kJ（丙烷介於兩者之間）→ 放出同樣的 3500 kJ，甲烷產生的 CO₂ 最少 ✓（全國 48% 漏選）
sci115-51:
  key: 潮汐每天約延後 50 分鐘；星期一 15 時乾潮，3 天後延後約 2.5 小時 → 星期四約 17 時半乾潮。
  explain: |
    表 9：星期一 15 時潮位最低（乾潮），21 時最高（滿潮）。
    潮汐主要由月球引力造成，月球每天約晚 50 分鐘通過同一經線 → 潮汐時間每天約延後 50 分鐘。
    星期一到星期四相隔 3 天：50×3＝150 分鐘＝2.5 小時 → 乾潮約在 17 時 30 分 → 前後各半小時，選 17–18 時 (B) ✓
    (A) 15–16 時是星期一的乾潮時間，忽略了每天延後（全國 39% 誤選，比答對的人還多）✗
sci115-52:
  key: 每次漲（退）潮的位能 ρVgh＝10¹¹ J，效率 25%；每天 2 漲 2 退 → 每年約 3.65×10¹³ J≈10⁷ 度。
  explain: |
    每一次漲潮（或退潮）的位能：ρVgh＝10³×2.5×10⁶×10×4＝1.0×10¹¹ J。
    (A) 位能增加是 mgh＝ρVgh，選項少了體積 V ✗（全國 30% 誤選）
    (B) 1.0×10¹¹ J 是千億焦耳的數量級，不是百萬（10⁶）✗（全國 40% 誤選）
    (C) 每日兩次漲潮，一年約 730 次 ✗
    (D) 漲、退潮都能發電，每天 4 次：每次電能 1.0×10¹¹×25%＝2.5×10¹⁰ J → 每年 2.5×10¹⁰×4×365≈3.65×10¹³ J，÷3.6×10⁶≈1.0×10⁷ 度 ✓
    (E) 潮汐來自月球、太陽的萬有引力；水車帶動發電機，靠電磁感應發電 ✓
sci113-29:
  key: 溫鹽環流（約千年）＞聖嬰（數年）＞潮汐（約半天）＞湧浪（十幾秒）＞風浪（幾秒）。
  explain: |
    (戊) 溫鹽環流：深層海水繞全球一圈約需上千年。
    (乙) 聖嬰現象：每隔數年（約 2–7 年）發生一次。
    (甲) 潮汐：約 12 小時 25 分漲退一次。
    (丙) 湧浪：從遠方傳來的波浪，波長較長，週期約 10 秒以上。
    (丁) 風浪：當地的風吹出的波浪，週期只有幾秒。
    → 戊乙甲丙丁 (B) ✓
    (E) 把聖嬰排在溫鹽環流之前 ✗（全國 24% 誤選）

# ---------- Day 19：光觸媒、花蜜中的苄丙酮與尼古丁、溫帶氣旋 ----------
sci114-50:
  key: 光子能量 E＝hf 只和頻率有關；要大於能隙 3.20 eV，電子才能從價帶躍遷到導電帶。
  explain: |
    (A) 提供的能量必須大於能隙（3.20 eV）才能躍遷，不是「必可」✗（全國 15% 誤選）
    (B) 電子要吸收能量才能從價帶跳到導電帶 → 價帶能量較低 ✓
    (C) 光子能量 E＝hf，與入射角無關 ✗（全國 20% 誤選）
    (D) 加強光強度或擴大照光面積只增加光子數目，每個光子的能量不變；光子能量不足，再多也無法躍遷 ✗（全國 24% 誤選）
    (E) 提高頻率 → 光子能量增加 → 可能超過能隙而躍遷 ✓
    這和光電效應的道理相同：能不能發生要看單一光子的能量（頻率），不是光的強度。
sci114-52:
  key: 水分解是氫氣燃燒的逆反應 → 吸熱；氫、氧的氧化數改變 → 氧化還原；·OH 有 7 個價電子，是強氧化劑。
  explain: |
    (A) O 有 6 個價電子、H 有 1 個 → ·OH 共 7 個，有一個未成對電子，所以是自由基 ✗（全國 19% 誤選）
    (B) 二氧化鈦是不溶於水的固體，才能塗在表面當光觸媒 ✗（全國 19% 誤選）
    (C) 氫氣燃燒生成水會放熱，反過來把水分解成氫氣、氧氣就要吸熱（由光提供能量）✓
    (D) ·OH 把有機物分解成 CO₂，是奪取電子、使有機物被氧化 → 作為氧化劑，不是還原劑 ✗（全國 33% 誤選）
    (E) 2H₂O → 2H₂＋O₂：H 由 +1 變 0、O 由 −2 變 0 → 氧化還原反應 ✓
sci115-40:
  key: 三種基改菸草的果實成熟率（約 12–14%）都比野生型（約 34%）低，基改並沒有提升成熟率。
  explain: |
    野生型是「+/+」（兩種成分都有）；這題要找「錯誤」的敘述。
    (A) 不含尼古丁的 +/−、−/− 每天受訪約 32、31 朵，比野生型的約 52 朵少 → 正確
    (B) 三種基改型的停留時間（約 1.8、1.45、1.8 秒）都比野生型的 1.2 秒長 → 正確
    (C) 不含尼古丁的 +/−、−/− 果實成熟率約 13%、14%，比野生型的約 34% 低 → 正確（全國 18% 誤選）
    (D) 只有苄丙酮的 +/− 花蜜剩餘最少（約 0.7 微升）→ 被取食得較多 → 正確
    (E) 所有基改型的果實成熟率都比野生型低 → 錯誤 ✓
sci115-43:
  key: 苄丙酮 C₁₀H₁₂O 的 O 有 2 對孤對電子；尼古丁 C₁₀H₁₄N₂ 的 2 個 N 各有 1 對 → 都是 2 對。
  explain: |
    由結構式數原子：苄丙酮 C₁₀H₁₂O（分子量 148）；尼古丁 C₁₀H₁₄N₂（分子量 162）。
    (A) 分子式不同，不是同分異構物 ✗
    (B) 兩者都有 10 個碳，但分子量不同 → 等重時莫耳數不同，產生的 CO₂ 也不同 ✗（全國 23% 誤選）
    (C) 所有 H 都接在 C 上：苄丙酮 12 個 C−H 鍵、尼古丁 14 個 ✗
    (D) H 原子周圍只有 2 個電子，不是 8 個 ✗（全國 15% 誤選）
    (E) 兩者的孤對電子都是 2 對 ✓
sci113-32:
  key: 北半球低氣壓逆時針旋轉並向中心吹；中心丙氣壓最低，西側丁吹西北風，暖區乙溫度較高。
  explain: |
    圖中丙是氣旋中心（低氣壓），兩條鋒面從中心往南延伸，乙位在兩條鋒面之間的暖區。
    (D) 北半球氣旋逆時針旋轉、向中心吹 → 中心西側的丁大約吹西北風 ✓
    (A) 中心東側的甲大約吹東南風（偏南風），不是西風 ✗
    (B) 乙在暖鋒、冷鋒之間的暖區，溫度較高，不是最低 ✗
    (C) 丙是低氣壓中心，氣壓最低 ✗（全國 19% 誤選）
    (E) 暖區的天氣通常較穩定；陰雨多出現在鋒面附近 ✗（全國 25% 誤選）

# ---------- Day 20：汞能階與極紫外光、隕石定年與隕石坑、第二週期元素 ----------
sci115-47:
  key: 365 nm 的光子能量是 3.4 eV；E₁→E₄：－1.6－(－5.0)＝3.4 eV。
  explain: |
    發光時電子從高能階跳到低能階，放出的光子能量＝兩能階的能量差。
    (A) E₁→E₃：3.7－1.6＝2.1 eV ✗
    (B) E₁→E₄：5.0－1.6＝3.4 eV ✓
    (C) E₂→E₄：5.0－2.5＝2.5 eV ✗（全國 14% 誤選）
    (D) E₂→E₅：10.4－2.5＝7.9 eV ✗
    (E) E₃→E₄：5.0－3.7＝1.3 eV ✗
sci115-48:
  key: E＝hf＝hc/λ＝6.63×10⁻³⁴×3×10⁸÷(13.5×10⁻⁹)≈1.5×10⁻¹⁷ J（約 92 eV）。
  explain: |
    (A) E＝hf，而 f＝c/λ → E＝hc/λ ✓
    (B) h/λ 是光子的動量，不是能量 ✗（全國 15% 誤選）
    (C) 能量和波長成反比，不是 hcλ ✗
    (D) 6.63×10⁻³⁴×3×10⁸÷(13.5×10⁻⁹)≈1.47×10⁻¹⁷ J ✓
    (E) 數量級錯誤 ✗（全國 16% 誤選）
    換算：1.5×10⁻¹⁷ J÷1.6×10⁻¹⁹≈92 eV，是 365 nm 紫外光（3.4 eV）的二十多倍。
sci115-55:
  key: 隕石中偶爾有來自太陽系外的物質；這種礦物在太陽系形成前就已結晶，年齡自然比太陽系老。
  explain: |
    線索在題組第一段：隕石「偶爾也會有一些來自太陽系外的物質」；而且題目已說明挑選的是同位素未被後續作用改變的礦物。
    (B) 這顆礦物在太陽系形成前就結晶了（例如來自更早的恆星），測得的年齡大於太陽系 ✓
    (A) 算出的年齡與所用的半衰期成正比：半衰期被低估，年齡會算得偏小，不是過大 ✗（全國 30% 誤選）
    (C) 題目已排除同位素被後續作用改變的礦物，風化汙染不是最可能的原因 ✗（全國 29% 誤選）
    (D) 太陽系的年齡由大量樣本、多種方法互相印證，不會因為一顆礦物就推翻 ✗
    (E) 和地球上類似的礦物是太陽系形成後才結晶的，不會比太陽系老 ✗
    這題全國答對率只有 28%，(A)(B)(C) 的選答率幾乎一樣；關鍵是讀出題組第一段的線索。
sci115-56:
  key: 月球隕石坑多，是因為幾乎沒有大氣：隕石不會燒毀，也沒有風化侵蝕；表中大氣最稀薄的固態行星是火星。
  explain: |
    地球有濃厚的大氣，小隕石進入大氣就燒毀；留下的隕石坑也會被風化、侵蝕、板塊運動抹去。月球幾乎沒有大氣，隕石坑就保留下來。
    (B) 火星表面大氣壓只有 0.01 atm，又是有固態表面的類地行星 → 最容易發現隕石坑 ✓
    (A) 金星大氣壓 92 atm，小隕石容易燒毀，濃厚的大氣也會造成風化 ✗
    (C)(D)(E) 木星、土星、天王星是類木行星，沒有能留下隕石坑的固態表面 ✗（(C) 全國 20% 誤選）
sci113-11:
  key: X＝碳、Y＝氧；同週期由左而右半徑變小；CO₂ 有 4 對孤對電子、CO 有 2 對。
  explain: |
    第二週期有 4 個價電子的是碳（C），有 6 個價電子的是氧（O）。
    (A) 同週期由左而右，核電荷增加、半徑變小 → O 的半徑比 C 小 ✗（全國 27% 誤選）
    (B) ¹²C：6 個質子、6 個中子；¹⁶O：8 個質子、8 個中子 → 比值都是 1 ✓
    (C) CO₂ 和 CO 的分子式不同，不是同分異構物 ✗（全國 29% 誤選）
    (D) CO₂（O＝C＝O）每個 O 有 2 對孤對電子，共 4 對；CO（C≡O）的 C、O 各 1 對，共 2 對 → 2 倍 ✓
    (E) CO₂ 溶於水形成碳酸，呈弱酸性 ✓

# ---------- Day 21：量子點、mRNA、基本交互作用、地震預警 ----------
sci115-44:
  key: 半胱胺酸包住量子點、幫助分散；量子點分散在水中形成膠體，雷射照射會看到光束（廷得耳效應）。
  explain: |
    (A) 半胱胺酸像界面活性劑一樣附著在 ZnS 表面，讓量子點分散在水中、控制顆粒大小 ✓（全國 56% 漏選）
    (B) 1–10 奈米的量子點分散在水中形成膠體，雷射光照射會散射出一道光束（廷得耳效應）✓
    (C) ZnS 是離子化合物、難溶於水，步驟 3 就是讓它沉澱出來 ✗（全國 18% 誤選）
    (D) 刺鼻的臭蛋味來自 S²⁻ 在酸性下生成的硫化氫（H₂S）氣體；ZnS 是固體 ✗（全國 62% 誤選）
    (E) 加入冰冷乙醇是為了降低溶解度，讓 ZnS 沉澱出來（乙醇沉澱）✗（全國 17% 誤選）
sci115-45:
  key: 讀表注意單位：Na₂S 50×10⁻⁶ mol 時產率 18.1%；超過 100×10⁻⁶ mol 都在 44% 以上；過量時 45.5%、50.2%。
  explain: |
    表中單位是 10⁻⁶ 莫耳：5.0×10⁻⁵ 莫耳＝50（×10⁻⁶），1.0×10⁻⁴ 莫耳＝100（×10⁻⁶）。
    (A) Na₂S＝50 時產率 18.1%，Na₂S 越少產率越低 → 低於 20% ✓
    (B) Na₂S 為 150、200、300、400 時，產率 44.4%、44.0%、45.5%、50.2%，都高於 40% ✓
    (C) Na₂S 過量（多於 ZnSO₄ 的 200）是樣品 5、6：45.5%、50.2%，都高於 45% ✓
    (D) 表中最高只有 50.2%，沒有證據可以達到 100% ✗（全國 23% 誤選）
    (E) 產物中 Zn²⁺/S²⁻ 約 0.77～1.0（例如 7.2/9.4、88.0/88.0），沒有遠大於 1 ✗（全國 30% 誤選）
sci113-05:
  key: 免疫系統會偵測外來的 RNA；把 U 換成假尿嘧啶能躲過免疫系統、延長存活，轉譯照樣進行 → 提高疫苗效力。
  explain: |
    (A) RNA 是單股分子，鹼基不是兩兩配對存在；配對時 U 也是和 A 配對，不是和 G ✗（全國 31% 誤選）
    (B) RNA 是單股分子；嘧啶、嘌呤配對成雙股的是 DNA ✗（全國 29% 誤選）
    (C) 題幹說 U 換掉後「可逃避免疫系統」→ 免疫系統原本會偵測外來的 RNA ✓
    (D) mRNA 疫苗要在細胞內轉譯出蛋白質才有作用 → 替換後轉譯仍能進行 ✓
    (E) 躲過免疫系統、在細胞內存活更久 → 能做出更多抗原蛋白，提高疫苗效力 ✓
sci113-20:
  key: 重力與電磁力的作用範圍都是無窮遠；強力、弱力只在原子核的尺度內作用；中子靠弱力衰變。
  explain: |
    (A) 電磁力的作用範圍也是無窮遠；重力是星系形成的主因，但不是「僅有」重力能作用到無窮遠 ✗（全國 21% 誤選）
    (B) 電子繞原子核運動靠的是電磁力（正負電荷相吸），不是重力 ✗
    (C) 自由中子會經由弱交互作用，衰變成質子、電子和反微中子 ✓
    (D) 強力、弱力的作用範圍約 10⁻¹⁵ m 以下，比原子（約 10⁻¹⁰ m）小得多 ✓
    (E) 強力存在於質子與質子、質子與中子、中子與中子之間 ✗（全國 20% 誤選）
sci113-31:
  key: P、S 波到時差 20 秒 → 震源距離 150 km；S 波 50 秒後到達，扣掉 10 秒的通知時間 → 40 秒。
  explain: |
    設距離為 d：d/3－d/5＝20 → 2d/15＝20 → d＝150 km。
    S 波抵達臺北：150÷3＝50 秒。
    市民在地震後 10 秒收到通知 → 可應變的時間＝50－10＝40 秒 (C) ✓
    (A) 30 秒剛好是 P 波到達臺北的時間（150÷5），不要和 S 波混淆 ✗（全國 25% 誤選）
