# 國文 Day 8–14 解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。

# ---------- Day 8：核心古文與文言詞義 ----------
chn115-04:
  key: 晉文公不攻秦是怕「失其所與」（失去盟友）；韓非第③條正是「無禮侮大鄰、拙於外交」。
  explain: |
    框內是韓非列舉的亡國徵兆：①大臣權勢太大、結黨 ②只聽高官的話、不用眾人意見驗證 ③無禮侮辱強大的鄰國、貪婪固執又不善外交 ④不任用國內人才，卻去求國外的人 ⑤財物少、沒有守備卻輕易發動戰爭 ⑥大臣勢盛，借外國之力、困苦百姓來攻擊私仇。
    (A) 范增說沛公「其志不在小」，是勸項羽及早攻打劉邦，和①②（大臣專權、偏聽）無關 ✗
    (B) 晉文公說「因人之力而敝之，不仁；失其所與，不知」，不攻打秦國，是避免失去盟友、得罪強大的鄰國，正是③ ✓
    (C) 李斯「藉寇兵而齎盜糧」是說驅逐客卿等於資助敵國；④是「不用國內人才、反求外人」，⑥是大臣借外力攻私仇，都對不上（全國 29% 誤選）✗
    (D) 孟子批評的是執政者不救濟百姓、把責任推給年歲，和⑤（國力弱卻輕啟戰端）無關 ✗
chn112-05:
  key: 燭之武提醒秦穆公「曾被晉國辜負」；樊噲指責項羽「要辜負有功的沛公」。
  explain: |
    甲：燭之武說秦國曾對晉君有恩，晉君答應割焦、瑕兩地，卻早上渡河、晚上就築城防秦 → 秦穆公是「被辜負」的一方。
    乙：樊噲說沛公先入咸陽、封閉宮室、等待項羽，勞苦功高卻沒有封賞，項羽反而聽信小人要殺他 → 項羽是「辜負人」的一方。
    所以 (D) 甲：受話者處於被辜負的角色；乙：受話者處於辜負人的角色 ✓
    (A) 燭之武是鄭國使者，不是旁觀者（全國 33% 誤選）(B) 燭之武是替秦國分析利害，不是向秦國討人情（全國 31% 誤選）(C) 兩段都沒有談到嫉妒。
chn115-28:
  key: 宋詞本來就講究平仄格律，B「僅注重押韻、後世才講求平仄」錯誤。
  explain: |
    (A) 元雜劇的「曲」合樂歌唱，穿插其間的賓白（口白）是說話，不用押韻 ✓
    (B) 詞在宋代合樂歌唱，除了押韻，也講究平仄與字聲；不是後世改成誦讀才講平仄 ✗
    (C) 四言詩多為「二／二」（蒹葭／蒼蒼），五言詩多為「二／三」（飄飄／何所似）✓
    (D) 「人為萬物之靈」第二、四、六字是為（平）、物（仄）、靈（平），「志有萬端之異」是有（仄）、端（平）、異（仄），平仄相對 ✓
    (E) 「夕陽中的新娘」的陽、娘同韻，「夏蟲也為我沉默」的我、默同韻，都是句中押韻的行內韻 ✓
    〈畫菊自序〉是核心古文，全文用駢文寫成，原文與翻譯見國文頁的「核心古文 15 篇」。
chn111-19:
  key: 芮季說王「欲無厭」，君子說芮伯「知王之瀆貨而啟之」：兩人都認為獻馬會引起王更大的貪欲。
  explain: |
    文意：芮季勸芮伯不要獻馬，因為周厲王貪得無厭，王身邊的人會以為芮伯得到不只一匹馬，都來索求；索求不到就會在王面前說壞話。芮伯不聽，獻了馬；榮夷公果然來要，沒要到就誣告「芮伯藏了馬」，王就趕走芮伯。君子認為芮伯也有錯：明知王貪財，還去開啟他的貪欲。
    (D) 芮季與君子都認為芮伯獻馬，會讓王想得到更多 ✓
    (A) 芮季是勸芮伯別獻馬，自己並不想要馬 ✗
    (B) 榮夷公是想為自己索取好處，不是認為芮伯應該多獻給王 ✗
    (C) 榮夷公說「伯也隱」是索求不成後的誣告；君子也沒有認為芮伯藏馬（全國 45% 誤選）✗

# ---------- Day 9：國學常識與書信 ----------
chn115-03:
  key: 「挂桑弧」「麟種」「鳳雛」都是賀生男孩；鄭、林兩家是姻親，鄭用錫可稱林祥雲「姻兄」。
  explain: |
    賀詩的「挂桑弧」（古代生男孩，在門左掛弓）、「天上誕麟種，人間浴鳳雛」都在祝賀林占梅生了兒子。
    (A) 「鳳侶鸞儔」是祝賀新婚的題辭，這首詩是賀生子（全國 34% 誤選，被詩中的「鳳雛」誤導）✗
    (B) 「田得玉」「夢投珠」都是比喻得到好兒子（藍田生玉：名門出俊秀子弟），不是稱讚林占梅的外表 ✗
    (C) 鄭用錫的兒子娶林占梅的妹妹，鄭用錫不是林占梅的岳父，不能自稱「家岳父」✗
    (D) 林祥雲撫養林占梅兄妹，鄭用錫的兒子娶了林家的女兒，兩人是同輩的姻親，可稱「姻兄」（姻親中同輩的互稱）✓
    賀生子的題辭（弄璋之喜等）與稱謂整理在國文頁的「國學常識」。
chn111-29:
  key: 新樂府「不入樂」；《三國演義》與卷首〈臨江仙〉（明代楊慎）都晚於南宋。
  explain: |
    劇情設定在南宋，所以劇中出現的書、作品都必須在南宋以前，而且敘述要正確。
    (A) 《詩經》（先秦）→《楚辭》（戰國）→《世說新語》（南朝宋）→《杜工部集》（唐代杜甫，北宋已編集）：順序正確 ✓
    (B) 陶淵明（東晉）、周敦頤（北宋）都在南宋以前，〈五柳先生傳〉〈愛蓮說〉都表現不慕榮利、高潔的性格 ✓
    (C) 流水對是上下句意思連貫、不能顛倒的對句；「欲窮千里目，更上一層樓」（唐代王之渙）正是流水對 ✓
    (D) 白居易、元稹提倡的「新樂府」是自創新題、不入樂的詩，說「入樂」錯誤 ✗
    (E) 《三國演義》是元末明初羅貫中所作，卷首〈臨江仙〉是明代楊慎的詞，南宋人不可能讀到 ✗
chn110-08:
  key: 批評君主＝諫諍；陳述國家利害＝對策；帶私情爭取利益＝遊說；上呈君王的文書＝章疏。
  explain: |
    甲（顏之推《顏氏家訓》）把上書陳事分成四類：
    「攻人主之長短」批評君王的長處短處 → 諫諍（直言規勸）
    「陳國家之利害」陳述國家的利弊 → 對策（回答皇帝對國事的策問）
    「帶私情之與奪」帶著私人情感爭取利益 → 遊說（像戰國策士遊說諸侯）
    乙：「告君文字」是寫給君王的文書 → 章疏（奏章、上疏）
    所以依序是 (A) 諫諍／對策／遊說／章疏 ✓
chn111-31:
  key: 鄭燮反對「過目成誦」：孔子韋編三絕、蘇軾讀到深夜，都說明讀書要反覆鑽研，也要慎選精讀。
  explain: |
    (A) 文中反問「過目成誦，孰有如孔子者乎？」接著說孔子讀《易》韋編三絕、讀了幾千百遍，重點是反覆研讀，不是過目成誦 ✗
    (B) 蘇軾讀〈阿房宮賦〉到四更，重點是讀書不倦，不是夜深人靜更能體會 ✗
    (C) 孔子和蘇軾都反覆鑽研，說明讀書不能只求快速瀏覽 ✓
    (D) 虞世南等人「書不再讀，迄無佳文」，是說只讀一遍的缺點，不是「盡信書不如無書」（全國 32% 誤選）✗
    (E) 《史記》以〈項羽本紀〉最好，其中又以鉅鹿之戰、鴻門宴、垓下之會最精彩，要反覆誦讀 → 讀書要慎選、精讀 ✓
chn111-32:
  key: 寫給平輩：啟封詞用「台啟、大啟」，提稱語用「足下、左右」，頌詞用「近安、大安」；「敬啟」不能當啟封詞。
  explain: |
    鄭燮寫信給堂弟鄭墨，是寫給平輩。
    (A) 大啟（平輩）／左右（書信中尊稱對方，不直接稱呼本人）／大安 → 適當 ✓
    (B) 台啟（平輩）／足下（同輩相稱的敬辭）／近安 → 適當 ✓
    (C) 惠鑒是平輩的提稱語，但「敬啟」有要收信人恭敬拆信的意思，不能用作啟封詞 ✗
    (D) 鈞啟用於尊長、長官，如晤用於晚輩，勛安用於政界 ✗（全國 58% 誤選，是這題最大的陷阱）
    (E) 收啟用於晚輩，壇席用於師長，福安用於向尊長請安 ✗
    書信的提稱語整理在國文頁的「國學常識」。

# ---------- Day 10：白話閱讀 ----------
chn114-04:
  key: 「只要邏輯推導沒有問題，就可以盡情發揮想像力」＝在論證有效的前提下，像詩人一樣馳騁想像。
  explain: |
    文中把數學和文學並談：文學家為了最好的意境，不一定忠實描寫現象（賈島推敲）；數學家創造理論也不必依隨大自然的規律，只要邏輯推導沒問題，就能盡情發揮想像，憑對大自然的感覺前進。
    (C) 數學家在論證有效下，可以像詩人一樣馳騁想像，憑感覺創造理論 ✓
    (A) 文中沒有說把寫作原理轉用在數學 ✗
    (B) 文中說數學家也「不必依隨大自然的規律」，和詩人一樣，B 說「無法如詩人般」錯誤 ✗
    (D) 比興是說文學作品，文中沒有說數學家的意圖要讀者解謎 ✗
chn113-28:
  key: 文末「中國、日本、南亞與西方國家的文化在此地交流，並融合原民的南島文化」；近代化與商業思維是荷、西帶來的。
  explain: |
    (A) 「兩波移民雖原籍地與背景不同，『過鹹水』則是共同的歷史記憶」：清代閩粵移民與 1949 年的新住民都有渡海經驗 ✓
    (B) 文中說近代化進程與商業文明思維是西班牙、荷蘭帶來的，不是奠基於漢人移民的拓墾 ✗
    (C) 港口林立是接在閩南移民「冒險謀利的商業性格」之後說的，文中沒有說被西方占領後才發展 ✗
    (D) 地處交通要衝、南島民族、渡海移民、國際貿易，共同形成臺灣的文化特色 ✓
    (E) 除了原住民與漢人文化，也受到日本、南亞與西方文化影響 ✓
chn114-09:
  key: 日本長期依賴進口糖，所以日治時期在臺灣積極推動糖業現代化。
  explain: |
    (A) 元代《島夷志略》記載的是「釀蔗漿為酒」，是釀酒，不是熬糖 ✗
    (B) 荷蘭占領時就已經引進製糖技術、把糖賣到日本，製糖不是從日治時期開始（全國 15% 誤選）✗
    (C) 明治製菓創立於臺灣，但文中沒有說用進口糖做巧克力；臺灣本身就產糖 ✗
    (D) 日本因地理環境長期依賴進口糖，日治時期就在臺灣推動糖業現代化、成立新式製糖廠 ✓
chn114-10:
  key: 余光中的「剛斷奶的孩子」寫吃甘蔗的滿足；洪愛珠的「躡步之賊」寫時光流逝、甘蔗難尋的感慨。
  explain: |
    這題選「不適當」的。
    (A) 顧愷之從尾吃到頭，「人或怪之」，可見倒吃不是常見吃法 → 適當
    (B) 余光中說「無論是倒啖或者順吃，每一口都是口福」，還笑顧愷之太拘謹 → 適當
    (C) 余光中用「剛斷奶的孩子」形容吃得痛快、捨不得停；洪愛珠的「時間這躡步之賊」感嘆社會變了、甘蔗難買，兩者的情懷不同 → 不適當 ✓
    (D) 洪愛珠寫「於齒間碾緊，吮汁，樂呵呵吐出一碗渣來」，正是焦桐說的「複雜的口腔運動」→ 適當
chn113-03:
  key: 禮最終歸於精神，卻必須從形式進入；孔子的難處是讓輕蔑形式的子路也學習禮樂的形式。
  explain: |
    文意：子路輕蔑事物的形式；孔子說「禮云禮云，玉帛云乎哉」（禮不只是玉帛）時，子路很樂意聽，一講到禮樂細則，他就一臉無趣。但「禮」雖然最終歸結於精神，卻必須從形式進入。
    所以孔子的困難是：讓子路理解禮樂的精神固然重要，形式也不可或缺 → (C) ✓
    (A) 文中沒有提到調整講授方式；子路的問題是輕蔑形式，不是缺乏耐性（全國 22% 誤選）✗
    (B) 孔子自己並不討厭禮樂的形式 ✗
    (D) 文中要子路接受的是禮樂的形式，不是用精神改變他的好勇 ✗

# ---------- Day 11：古典韻文與圖表 ----------
chn111-06:
  key: 乙詩押「拈、甜」的韻，只有「纖纖」同韻；甲詩兩句對仗，「漠漠」（仄）對「時時」（平）。
  explain: |
    乙詩是七言絕句，第一、二、四句押韻：拈、□□、甜 → 要填同韻的字。纖（ㄒㄧㄢ）和拈、甜同韻，亭不同韻；「細麥復纖纖」（麥苗細長）意思也通 → 纖纖。
    甲詩「江天□□鳥雙去，風雨□□龍一吟」是律詩的對仗句，兩句第三、四字的平仄要相對：
    漠（入聲，仄）對 時（平聲）→ 相對；朗（上聲，仄）對 瑟（入聲，仄）→ 不相對。
    意思上，「江天漠漠」寫江面與天空一片迷茫，和「風雨時時」的陰暗氣氛相合；「朗朗」是明亮，不合風雨。
    所以依序是 (B) 漠漠／時時／纖纖 ✓
    這題全國答對率只有 27%，押韻和對句平仄是判斷填詞題最可靠的依據。
chn110-10:
  key: 「烏」是何氏自比，「羅」是宋王的強權；「烏自高飛，羅當奈何」表現她不受脅迫的自主意志。
  explain: |
    宋康王想強占韓憑的妻子何氏，何氏作〈烏鵲歌〉表明心志後自縊。
    「南山有烏，北山張羅。烏自高飛，羅當奈何」：烏比喻何氏自己，羅（捕鳥的網）比喻宋王的強權；鳥自己高飛，網又能怎樣 → 表現她的自主意志 → (C) ✓
    (A) 烏是何氏自比，不是暗指宋康王 ✗
    (B) 羅比喻宋王捕捉何氏的強權，不是利誘韓憑的圈套 ✗
    (D) 「烏鵲雙飛，不樂鳳凰」：鳳凰比喻宋王（權貴），烏鵲才是韓憑夫婦 ✗
chn110-15:
  key: 《梅苑》平均每位詞人約 5 首、《樂府雅詞》約 10 首，李清照分別入選 18、23 首，遠高於平均。
  explain: |
    (D) 依備註「*」：《梅苑》421 首／82 人，平均每人約 5 首；《樂府雅詞》923 首／95 人，平均約 10 首。李清照在兩本各入選 18、23 首，遠高於平均，可見頗受青睞 ✓
    (A) 「#」只是「歸屬存疑的篇數」，不能確定真正的作者是朱淑真 ✗
    (B) 南宋詞選以李清照為主，談不上偏好孫夫人、魏夫人；明代孫夫人、魏夫人仍有入選 ✗
    (C) 《唐宋諸賢絕妙詞選》選錄女詞人 10 位共 29 首，其中李清照 8、孫夫人 5、魏夫人 7，其餘 7 位只剩 9 首，不可能每位都至少 2 首 ✗
chn110-16:
  key: 只有《梅苑》《樂府雅詞》列出總數，《花草粹編》無從比較；兩本《草堂詩餘》的女詞人作品數不同，收錄作品有更動。
  explain: |
    甲：表格只列出《花草粹編》的「女詞人」人數與作品數，沒有全書的詞人總數與詞作總數；只有《梅苑》《樂府雅詞》在備註列出總數 → 無法判斷。
    乙：《草堂詩餘》收女詞人作品 13 首，《類編草堂詩餘》15 首；李清照 10 首變 9 首、孫夫人 2 首變 5 首 → 收錄的詞作有更動 → 錯誤。
    所以 (C) 甲無法判斷，乙錯誤 ✓
    (A) 甲正確，乙錯誤（全國 29% 誤選）：把「女詞人」的人數與作品數當成全書的總數。
chn110-17:
  key: 「聞說—也擬—只恐」是遊興剛起就被愁緒打消，不是遊興越來越濃。
  explain: |
    這題選「最不適當」的。
    (A) 「花已盡」（春天將盡）、「日晚」（天色已晚），象徵美好事物凋零、歲月流逝 → 適當
    (B) 「倦梳頭」「淚先流」表現物是人非、萬事皆休的無力 → 適當
    (C) 聽說雙溪春色好，也打算去泛舟，卻怕小船載不動滿懷的愁 → 遊興由起而消，用來襯托愁的深重，不是「愈益濃烈的遊興」→ 最不適當 ✓
    (D) 小小的舴艋舟「載不動、許多愁」，把愁寫得有重量，表現愁苦深重 → 適當

# ---------- Day 12：文言閱讀 ----------
chn115-27:
  key: 「割」「蒸」寫攀登之苦；對話表現忘身遊山的豪情；「奔、立、捲、曳、披、帶」寫瀑布被風吹動的變化。
  explain: |
    (A) 「芒草割人面」「白日蒸厓，如行熱冶中」：割、蒸帶出身體的痛感與悶熱，寫出攀爬的艱辛 ✓
    (B) 作者對想回頭的客人說「戀軀惜命，何用遊山？與其死於床笫，孰若死於一片冷石也？」用對話中的反問，表現為了完成遊山之志而不顧身體的態度 ✓
    (C) 客人聽了「大笑，勇百倍」，作者是在鼓舞客人，不是諷刺好遊之名而不能涉險 ✗
    (D) 瀑布「雷奔海立，孤搴萬仞，峽風逆之，簾捲而上，忽焉橫曳，東披西帶」，連續變換動詞，捕捉瀑布受峽風吹動而瞬息萬變的樣子 ✓
    (E) 雖然從開先寺走到黃巖寺，但寫景主線是登山觀瀑，瀑布雷奔海立、氣勢壯闊，不是營造幽寂的禪意 ✗
chn110-11:
  key: 同樣是「一半」，有時可行、有時不可行，關鍵在「勢」；處事要審時度勢，不能拘泥一種做法。
  explain: |
    文意：有些事可以做一半卻不能做全部——治半身不遂的藥可以治偏枯，加倍用藥卻救不活死人；有些事可以做全部卻不能做一半——樵夫挑兩鈞重的柴快步走，拿掉一半反而走不了，不是力氣不夠，而是重量失衡、「勢不便」。
    所以處事要衡量情勢、找出合宜的做法 → (C) 應世處事不能拘執一方，必須衡量狀況，審時度勢以制其宜 ✓
    (A) 文中不是談樂天知命 ✗ (B) 文中不是談半途而廢（全國 18% 誤選）✗ (D) 文中沒有說完滿或缺殘由主體來定義（全國 21% 誤選）✗
chn110-24:
  key: 范仲淹說茶鹽專賣與商稅「但分減商賈之利耳」，對商人不算有害；與其加重農民負擔，不如取之於商賈。
  explain: |
    甲（《商君書》）：國家統管山澤之利，讓懶惰的人沒有別的謀生管道，只能務農；提高酒肉價格、加重租稅，讓商人變少、農民不能縱情飲酒、大臣不會荒於飽食。
    乙（《夢溪筆談》）：有人主張放寬茶鹽專賣、減少商稅，范仲淹（范文正）認為不可：這些收入只是分減商人的利潤，對商人不算有害；國家用度沒有減少，收入不能缺，不取之於山澤和商人，就得取之於農民，與其害農，不如取之於商人。
    (B) 范仲淹認為維持茶鹽之禁，不會危及商賈 ✓
    (A) 甲提高酒肉價格、加重租稅，是要讓商人變少，不是提高商人獲利 ✗
    (C) 甲統管山澤是為了逼人務農，不是把獲利分給百姓 ✗
    (D) 范仲淹認為應取之於山澤及商賈，以免害農，D 正好相反（全國 32% 誤選）✗
chn110-25:
  key: 甲文提高酒肉價格，讓農民不能暢飲縱情，因而不怠惰、專心務農。
  explain: |
    (A) 甲：「貴酒肉之價…農不能喜酣奭」「民不能善酣奭，則農不慢」→ 減少農民飲酒作樂的機會，使他們專心農作 ✓
    (B) 范仲淹是說國家用度有餘時，應先寬減賦役，出發點是不要傷害農民，文中沒有說以賦稅優惠獎勵務農（全國 21% 誤選）✗
    (C) 甲文提到大臣荒於飽食會使國事延宕，但沒有說這是農業不振的主因；乙文也沒談 ✗
    (D) 甲文是用限制享樂逼人務農，並不是把農民當成需要保護的弱勢 ✗
chn112-29:
  key: 豬馬「以口氣噓之」使他不死；逃到掩淲水時「魚鱉浮為橋」，得以渡河。
  explain: |
    (A) 東明是侍婢所生，侍婢說是「有氣大如雞子，從天而下」而懷孕，國王還懷疑他是天子；文中也沒有說命名的原因 ✗
    (B) 他被丟到豬圈、又移到馬欄，豬和馬都用口氣呵護他，所以沒死 ✓
    (C) 國王讓他的母親把他當奴僕養，並派他放牧牛馬；「善射」是後來的事，也是國王想殺他的原因，不是被派去放牧的原因 ✗
    (D) 國王怕他奪國而想殺他，他才逃走，不是為了救母而謀反 ✗
    (E) 他逃到掩淲水，用弓擊水，魚鱉浮起來成為橋，讓他渡河，追兵卻過不了 ✓

# ---------- Day 13：圖表與表格判讀 ----------
chn111-04:
  key: 以和平合作的態度「迅速成立國語傳習所」→ 同化越深、離散越快，人口從約一千人減到五百人左右。
  explain: |
    學者甲：斯卡羅族在日治時期以和平、合作的態度迅速成立國語傳習所（學日語）；同化程度越深，自我認知越淡，族群離散也越快。
    學者乙：大正六年約 210 戶、一千人，到昭和五至七年只剩五百人左右。
    (C) 族人響應日人政策設校學日語，間接導致族群日趨式微 ✓
    (A) 文中沒有說漢人文化造成強烈衝擊、使族人避居外地 ✗
    (B) 文中沒有說低海拔的生活條件不良 ✗
    (D) 四社合計約 140 戶（89＋19＋21＋十多），加上移住他鄉的共 210 戶，移住他鄉的約 60–70 戶，不到一半；也不是遷到豬朥束社 ✗
chn110-14:
  key: 樊噲忠於劉邦、目標一致、地位不如劉邦，鴻門宴上又提出「大行不顧細謹」的建議，符合「伙伴」。
  explain: |
    (A) 樊噲忠於劉邦、值得信賴，目標相同但地位不如劉邦；鴻門宴時他闖帳護主，並勸劉邦「大行不顧細謹」及早離開 → 符合伙伴的條件 ✓
    (B) 漁父勸屈原「與世推移」，屈原沒有接受，並沒有因此得到啟發 → 不是導師 ✗
    (C) 薛寶釵和林黛玉是爭取賈寶玉的對手，不是忠於主角、目標相同的伙伴 ✗
    (D) 胡屠戶常辱罵女婿范進，沒有傳授知識或技能 → 不是導師 ✗
chn114-13:
  key: 儒家重禮節細則、倫常原則（S、T）；道家「指約而易操」掌握大方向、「與時遷移，應物變化」隨機調整（N、P）。
  explain: |
    司馬談說儒家「博而寡要，勞而少功…然其序君臣父子之禮，列夫婦長幼之別，不可易也」：講究具體的禮節細則（S），重視倫常原則（T）→ ST。
    道家「與時遷移，應物變化…指約而易操，事少而功多」：用簡要的道理掌握大方向（N），隨著情況調整、接受改變（P）→ NP。
    所以依序是 (A) ST／NP ✓
    (C) TJ／FP（全國 34% 誤選）：文中沒有提到儒家「按計畫實現」（J），也沒有說道家重視他人情緒（F）。
chn114-14:
  key: 「理義之悅我心」是說人心天生喜愛理義，重點在理義，不是體諒他人情緒的 F。
  explain: |
    這題選「不適當」的。
    (A) ①「五畝之宅，樹之以桑…」談種桑、養雞豬的具體做法 → 符合 S（具體的指引與細節）→ 適當
    (B) ②「政者，正也」用一句話掌握為政的根本 → 符合 N（簡要掌握概念與大方向）→ 適當
    (C) ③「鄉愿，德之賊也」批評是非不分、討好眾人的人，重視原則 → 符合 T → 適當
    (D) ④「理義之悅我心，猶芻豢之悅我口」說人心喜愛理義就像口喜愛美食，談的是人性與理義，不是重視和諧、體諒他人情緒的 F → 不適當 ✓
chn110-36:
  key: 「受任於敗軍之際，奉命於危難之間」上下句意思相同，是正對；「麝蘭芳靄斜陽院，杜若香飄明月洲」也是正對，所以 B、D 錯。
  explain: |
    正對：上下句意思雷同；反對：用相反或不同性質的事物對照。
    (A) 「日星隱耀，山岳潛形」都寫天色昏暗，是正對；「西伯幽而演易，周旦顯而制禮」一幽禁、一顯達，是反對 → 符合 ✓
    (B) 「受任於敗軍之際，奉命於危難之間」（〈出師表〉）兩句都說在危難中受命，是正對，不是反對 ✗
    (C) 「塞客衣單，孀閨淚盡」都寫戰爭帶來的悲苦，是正對；「桃李春風一杯酒，江湖夜雨十年燈」（黃庭堅）一寫歡聚、一寫別後孤寂，是反對 ✓
    (D) 「麝蘭芳靄斜陽院，杜若香飄明月洲」兩句都寫香氣瀰漫的美景，是正對，不是反對 ✗
    (E) 「一死生為虛誕，齊彭殤為妄作」（〈蘭亭集序〉）兩句意思相同，是正對；「竭誠則胡越為一體，傲物則骨肉為行路」（〈諫太宗十思疏〉）竭誠與傲物相反，是反對 ✓
    (B) 的「物窮必變，慘極知悔」出自核心古文〈勸和論〉，(D) 的「位卑則足羞，官盛則近諛」出自〈師說〉。

# ---------- Day 14：赤壁的文學書寫（核心古文〈赤壁賦〉） ----------
chn114-15:
  key: 杜牧磨洗戟是為了「認前朝」，戟從殺敵的「武」器，變成承載歷史的「文」的載體。
  explain: |
    文中說：杜牧磨洗戟，並非如兵士般用來傷敵，而是為了辨認前朝，「戟由『武』的工具變成了『文』的載體」→ (A) ✓
    (B) 文中說首句的「鐵」在末句化為囚禁二喬的鐵鎖，不是暗示戰事慘烈、影響深遠 ✗
    (C) 東風是周瑜得到的偶然助力；「春深」表示草木茂盛，文中沒有說二喬享受新生活 ✗
    (D) 銅雀臺是周瑜若失敗、二喬將被囚禁的地方，不是暗示政治權力轉移（全國 15% 誤選）✗
chn114-16:
  key: 「東風不與周郎便」引入虛設情境：周瑜若沒有偶然的東風就會失敗，暗示歷史成敗未必由人決定。
  explain: |
    (C) 文中說詩的後半「藉『東風』引入虛設的情境：若周瑜未得到偶然的助力，二喬姊妹將被魏俘虜」→ 成敗取決於偶然的東風，暗示人未必是歷史成敗的關鍵 ✓
    (A) 文中說杜牧「最早將赤壁之戰與銅雀臺連結」，不是首開以赤壁之戰入詩的風氣（全國 40% 誤選）✗
    (B) 磨洗戟是為了辨認前朝，強調與歷史的相遇是個人的；文中沒有說寄託以文治取代武事的理想 ✗
    (D) 磨洗是為了辨認，不是暗示真相難明，也沒有批判梟雄 ✗
chn114-17:
  key: 客的悲簫與提問，映照出蘇子歌中「求而不得」的欲求，並否認他的浪漫描寫，引發蘇子反思。
  explain: |
    文中說：蘇子的歌傳達了「求而不得」的情思，卻歸咎於吹簫客的悲音；客提供了「與蘇子截然不同的視角」，把「凌萬頃之茫然、羽化登仙」的浪漫描寫一一否認，蘇子才提出變與不變的道理回應。
    所以客的角色是 (B) 照見蘇子的欲求，提出質疑，引發反思 ✓
    (A) 客確實引述了曹操的詩，但文中重點是客提供不同的視角，不是建構梟雄形象 ✗
    (C) 文中沒有談鐘鼎（仕）與山林（隱）的人生領悟 ✗
    (D) 空明飄逸是蘇子開篇的感受，客反而否認了這些浪漫描寫（全國 25% 誤選）✗
chn114-18:
  key: 「挾飛仙以遨遊…知不可乎驟得」正是客否認羽化登仙；回應「羨長江之無窮」的相對論，原文是「自其變者而觀之…」。
  explain: |
    ① 畫線處說客把「凌萬頃之茫然、羽化登仙」的浪漫描寫一一否認。客說「挾飛仙以遨遊，抱明月而長終。知不可乎驟得」：想和神仙同遊、與明月長存，卻知道不能輕易得到 → 正是在否認羽化登仙 → 適當。
    ② 畫線處說蘇子用莊子式的相對論回應「羨長江之無窮」。相對論的原文是「蓋將自其變者而觀之，則天地曾不能以一瞬；自其不變者而觀之，則物與我皆無盡也」；「物各有主，苟非吾之所有，雖一毫而莫取」是接下來談清風明月可以共享的前提，不是相對論 → 不適當。
    所以 (B) ①適當，②不適當 ✓（〈赤壁賦〉原文與翻譯見國文頁的「核心古文 15 篇」）
chn114-19:
  key: 杜牧用「磨洗折戟」與「東風」的想像、蘇軾把〈短歌行〉和赤壁連結，都把歷史的赤壁轉化為文學的赤壁。
  explain: |
    文中說杜牧〈赤壁〉「賦予『赤壁』具體的形象與情感」，蘇軾的赤壁作品是「赤壁」建構過程的第二個關鍵時刻，還為〈短歌行〉標示了創作的時空。
    兩人都對赤壁之戰加入個人的想像，把赤壁變成文學意象 → (B) ✓
    (A) 杜牧沒有歌詠前代詩人；把自己和曹操重疊的是蘇軾（全國 18% 誤選）✗
    (C) 兩人都不是要重現赤壁之戰的場景 ✗
    (D) 「文字使生命永恆」的想法只出現在對〈赤壁賦〉的討論，杜牧的部分沒有 ✗
