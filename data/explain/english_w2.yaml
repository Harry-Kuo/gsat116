# 英文第 2 週：課堂講義（115 年綜合測驗、文意選填、篇章結構、閱讀，以及 110–111 年詞彙題）
# 與 Day 8–14 每日練習（114 年選擇題、112 年詞彙題）的解析（Claude 撰寫，老師審閱後可直接修改）

# ---------- 課堂：詞彙題 ----------
eng111-09:
  key: go on a quest for…＝去尋找、探索…。
  explain: |
    句意：看完自然史的電視節目後，Adam 決定去南達科他州＿＿＿恐龍化石。
    go on a quest for＝踏上尋找…的旅程 → (D) quest 探索、追尋 ✓
    (A) trial 試驗、審判（全國 35% 誤選；go on trial 是「受審」）(B) route 路線 (C) strike 罷工、打擊（go on strike 是「罷工」）。
eng110-09:
  key: testing kits＝檢測套組（一整套檢測用具）。
  explain: |
    句意：數百位居民從市政府領到免費的檢測＿＿＿，用來檢查自家的水有沒有含有害的化學物質。
    居民「領到」的是實體的東西 → (A) kits 成套用具 ✓（testing kit 檢測套組、first-aid kit 急救包）
    (B) trials 試驗（全國 39% 誤選；trial 是試驗的過程，不能發給居民）(C) zones 區域 (D) proofs 證據。
eng110-10:
  key: be awarded jointly to…＝由…共同獲得（獎項）。
  explain: |
    句意：2011 年諾貝爾和平獎由三位女性＿＿＿獲得，表彰她們爭取女權的努力。
    三個人一起得獎 → (C) jointly 共同地 ✓
    (B) earnestly 認真地、誠摯地（全國 38% 誤選，是在形容「努力」的態度，不能說明「三人共同獲獎」）(A) actively 積極地 (D) naturally 自然地。
eng110-15:
  key: bus service resumed＝公車恢復行駛（resume 可以不接受詞）。
  explain: |
    句意：颱風過後一週，一些橋梁終於通車，受災最嚴重的地區也＿＿＿公車服務。
    災後「恢復」原本的服務 → (B) resumed 恢復、重新開始 ✓
    (C) transported 運送（全國 48% 誤選）：transport 是及物動詞，要說 transport passengers，「公車服務運送」沒有受詞，也不是恢復的意思。
    (A) departed 出發、離開 (D) corresponded 符合、通信。

# ---------- 課堂：115 綜合測驗 ----------
eng115-11:
  key: it turns out＝結果發現、原來；下一段 A new study indicates… 說明這是研究的新發現。
  explain: |
    句意：從營火到咖啡館，人們一直聚在一起分享最新消息。白犀牛，＿＿＿，也做一樣的事，只是牠們的聚會地點是一大堆糞便。
    白犀牛也會交換消息，是研究「發現」的事實（下一段 A new study indicates…）→ (B) it turns out 結果發現、原來 ✓
    (C) in other words 換句話說（全國 32% 誤選）：要重述前一句的內容，但這句講的是新的主角（犀牛）。
    (A) what is more 而且（補充同一個論點）(D) all in all 總而言之（放在結論）。
eng115-12:
  key: communicate＝溝通；後句說犀牛會在糞便中留下訊息（leave messages）。
  explain: |
    句意：一項新研究顯示，犀牛有一種「有味道的」方式來＿＿＿。
    後句：these animals leave messages in their poop（在糞便裡留下訊息）→ (C) communicate 溝通 ✓
    (A) demonstrate 示範、證明 (B) immigrate 移入（別的國家）(D) manipulate 操控。
eng115-13:
  key: provide important clues about…＝提供關於…的重要線索。
  explain: |
    句意：不同犀牛的糞便含有不同的化學物質，提供關於每隻犀牛年齡、性別、健康與生殖狀況的重要＿＿＿。
    化學物質讓其他犀牛「得知」這些資訊 → (D) clues 線索 ✓
    (B) icons 圖示、代表人物（全國 22% 誤選）(A) doubts 懷疑 (C) matches 比賽、火柴、相配的人或物。
eng115-14:
  key: 大家都知道彼此的狀況，打架的可能性就比較低（less likely）。
  explain: |
    句意：這對群體的和平與和諧非常重要。當所有成員都知道彼此的狀況時，牠們打架是＿＿＿的。
    前句說「對和平很重要」→ 了解彼此會讓衝突減少 → (D) less likely 比較不可能 ✓
    (A) hardly surprising 一點也不意外（變成「打架不意外」，和「和平」矛盾）(B) more acceptable 比較能接受 (C) truly important 真的很重要。
eng115-15:
  key: be responsive to＝對…有反應；後句說公犀牛聞得更久、更常回來。
  explain: |
    句意：研究人員發現，居主導地位的公犀牛對帶有發情母犀牛化學物質的「假糞便」特別＿＿＿。
    後句：公犀牛聞得比較久、更常回到同一個地點 → 「有反應」→ (A) responsive to ✓
    (C) considerate of 體貼的（全國 24% 誤選）(B) annoyed at 對…生氣 (D) tolerant with 容忍的。
eng115-16:
  key: accommodate the travelers＝提供旅客休息、住宿的地方。
  explain: |
    句意：沿著絲路穿越中國的旅人需要地方休息，於是茶館紛紛出現，來＿＿＿疲憊的旅客，提供一杯茶讓他們恢復體力。
    前句 needed places to rest（需要休息的地方）→ (A) accommodate 容納、提供住宿 ✓
    (B) compensate 補償 (C) anticipate 預期 (D) reinforce 加強。
eng115-17:
  key: had yet to develop＝（當時）還沒有發展起來；have yet to V＝還沒…。
  explain: |
    句意：但是點心的烹飪藝術＿＿＿，因為當時人們認為喝茶配食物不恰當。
    But 表示轉折：茶館出現了，點心卻「還沒」發展；後文說幾個世紀以後才知道茶能幫助消化，點心才誕生 → (B) had yet to develop ✓
    (A) would hardly develop「（之後）幾乎不會發展」，和後來點心發展起來的事實不符（全國 26% 誤選）。
    (C) was fast developing 正快速發展 (D) had almost developed 幾乎已經發展完成，都和「喝茶配食物不恰當」矛盾。
eng115-18:
  key: be meant to be＝本來就是要（成為）…。
  explain: |
    句意：點心不只是中國菜的一種，它＿＿＿一種可以持續好幾個小時的愉快用餐體驗。
    前句 more than just…（不只是…）→ 這句說明點心「本來就是」一種體驗 → (D) meant to be ✓
    (B) brought up as 被養育成…（全國 30% 誤選）(C) thought to have 被認為擁有（點心本身不會「擁有」用餐體驗）(A) passed on to 被傳給。
eng115-19:
  key: as such＝正因如此；份量小、只是「點到心」，所以一開始被當成零食吃。
  explain: |
    句意：這些小份量的食物原本只是要「點到心頭」（點心的字面意思），＿＿＿一開始是被當成零食吃的。
    前面說份量小 → 後面「因此」被當成零食 → (B) as such 正因如此、就這樣的性質而言 ✓
    (C) by then 到那時候（前文沒有提到特定的時間點，全國 37% 誤選）(A) if so 如果是這樣 (D) in that 因為（後面要接完整子句）。
    這題連高分考生都常選錯（官方鑑別度為負值），as such 當「因此」的用法要特別記住。
eng115-20:
  key: 一大群人一起吃，是一種愉快的社交活動（a joyful social activity）。
  explain: |
    句意：一大群人一起享用簡單的菜餚，當作＿＿＿，是一種習俗。最後一句說：點心這種「食物」只是點心體驗的一小部分。
    重點在「一群人一起吃」的社交性質 → (C) a joyful social activity ✓
    (A) a widely known delicacy 廣為人知的佳餚、(D) an amazing local cuisine 很棒的地方菜，強調的都是食物本身，和最後一句「食物只是一小部分」相反；(B) an intimate romantic dinner 親密浪漫的晚餐，不是「一大群人」。

# ---------- 課堂：115 文意選填 ----------
eng115-21:
  key: by no means＋形容詞＝絕不是…；後句說午睡是在讓大腦和身體充電。
  explain: |
    句意：白天午睡絕對不是＿＿＿的。事實上，你是在讓大腦和身體有時間充電。
    by no means（絕不）後面接形容詞；後句說午睡有好處 → 午睡「不是浪費時間」→ (E) unproductive 沒有生產力的 ✓
    形容詞選項還有 minimal（極少的）、dramatic（顯著的），放進去意思都不通。
eng115-22:
  key: brain size and function＝大腦的大小與功能；and 連接兩個名詞。
  explain: |
    句意：研究顯示，午睡和大腦的大小與＿＿＿有關；具體來說，午睡能提升認知和記憶。
    and 前面是名詞 brain size → 空格也要名詞；後面說的 cognition and memory（認知與記憶）都是大腦的「功能」→ (G) function ✓
eng115-23:
  key: increase dementia risk＝提高失智的風險。
  explain: |
    句意：我們 20 出頭時大腦就開始萎縮，逐漸讓認知變慢，並提高日後失智的＿＿＿。
    increases 後面需要名詞；會被「提高」的是失智的「風險」→ (F) risk ✓
    下一句 lower the possibility of developing dementia（降低失智的可能性）也在呼應這個意思。
eng115-24:
  key: may＋原形動詞；午睡可能「延緩」老化造成的大腦萎縮。
  explain: |
    句意：這表示午睡可能大幅＿＿＿老化造成的大腦萎縮，因而降低罹患失智的可能。
    may significantly 後面接原形動詞；前句說常午睡的人大腦大小保存得比較好 → 「延緩」萎縮 → (D) delay ✓
    (J) point to（全國 13% 誤選）放進去是「指向大腦萎縮」，不合句意。
eng115-25:
  key: help (to) retain knowledge＝幫助記住學到的知識。
  explain: |
    句意：對考前衝刺的學生來說，午睡能幫助＿＿＿學到的知識和技能。
    help 後面可以直接接原形動詞；前句說午睡能增強記憶與學習 → 「記住、保留」知識 → (A) retain ✓
eng115-26:
  key: while others point to shorter naps＝其他研究則指向（建議）較短的午睡。
  explain: |
    句意：有些研究建議午睡 20 到 40 分鐘，其他研究則＿＿＿較短的午睡，例如 15 到 20 分鐘。
    while 前後對比；others＝other studies（複數），需要現在式動詞，和前面的 recommend 對應 → (J) point to 指向（某個結論）✓
    (B) depend on 也是動詞片語，但「其他研究取決於較短的午睡」不通（全國 13% 誤選）。
eng115-27:
  key: may depend on…＝可能取決於…。
  explain: |
    句意：然而，最佳的午睡長度可能＿＿＿一個人的身體狀況和疲勞程度。
    may 後面接原形動詞；however 表示前面說的時間長度不一定適用每個人 → 「取決於」個人狀況 → (B) depend on ✓
eng115-28:
  key: surprisingly dramatic benefits＝出乎意料的顯著好處（副詞＋形容詞＋名詞）。
  explain: |
    句意：對某些人來說，即使只睡五分鐘，也能帶來出乎意料＿＿＿的好處。
    surprisingly（副詞）＋形容詞＋benefits（名詞）→ 需要形容詞；「即使只有五分鐘」形成反差 → 效果很大 → (I) dramatic 顯著的 ✓
    另一個形容詞 minimal（極少的）和「出乎意料」的語氣相反。
eng115-29:
  key: a quiet place with minimal light＝光線很少的安靜地方。
  explain: |
    句意：所以，找一個＿＿＿光線或有遮光窗簾的安靜地方。
    前句說 A dark space（陰暗的空間）最適合午睡 → 光線「極少」→ (H) minimal ✓
eng115-30:
  key: create a relaxing atmosphere＝營造放鬆的氣氛。
  explain: |
    句意：你也可以加上舒緩的大自然聲音，營造放鬆的＿＿＿，讓午睡更有效。
    a relaxing（冠詞＋形容詞）後面要單數名詞 → (C) atmosphere 氣氛 ✓

# ---------- 課堂：115 篇章結構 ----------
eng115-31:
  key: 空格後用「1700 年代以前的肖像畫都不笑」當例子 → 主題句：人類歷史大部分時間，露齒笑都不流行。
  explain: |
    第一段最後問：「微笑代表開心」是否古今中外皆然？空格後用 for example 舉西方 1700 年代以前的肖像畫都沒有笑容。
    空格是這一段的主題句，要能被「肖像畫不笑」支持 → (C) For most of recorded human history, the open smile has been deeply unfashionable.（在人類有記載的歷史中，大部分時間露齒而笑都很不流行）✓
    這一段談「時代」（time），下一段才談「文化」（cultures），正好對應第一段的 across time and cultures。
eng115-32:
  key: 前句說某些文化裡笑會被認為比較不聰明 → In fact 接俄國諺語「無緣無故地笑是愚蠢的象徵」。
  explain: |
    前句：在大多數文化中，笑代表正面情緒；但在某些文化裡，同一個人笑的時候會被認為比較不聰明。
    空格用具體例子補強這個說法 → (E) In fact, there is a well-known Russian proverb that goes, "Smiling with no reason is a sign of stupidity." ✓
    stupidity（愚蠢）呼應前句的 less intelligent（比較不聰明）。
eng115-33:
  key: 前面講個人主義與人口，空格後講來自世界各地的新移民 → Another crucial factor is… immigration diversity。
  explain: |
    前面：來自個人主義高、人口少的國家的人比較常笑。空格後：來自世界各地的新移民比較常笑，因為沒有共同語言，只好用笑容和人相處。
    空格要把話題從「個人主義」轉到「移民」→ (A) Another crucial factor is a society's immigration diversity.（另一個關鍵因素是社會的移民多元程度）✓
    Another（另一個）是轉到新論點的線索，immigration 呼應後面的 Newcomers。
eng115-34:
  key: 最後一段開頭，總結前面提到的各種因素（thus）→ Various factors have thus contributed to…。
  explain: |
    空格在最後一段開頭，後句說：「許多心理學家指出，這個簡單的動作其實比表面上複雜得多。」
    需要一句總結前面各段（時代、文化、個人主義、移民）的句子 → (B) Various factors have thus contributed to the phenomenon of smiling.（因此，許多因素共同造成了微笑這個現象）✓
    (D) 談真笑與假笑的差別，全文都沒有討論，是多出來的句子（全國 25% 誤選）。

# ---------- 課堂：115 閱讀測驗（Endurance 號） ----------
eng115-35:
  key: 全文依時間寫 Endurance 號前往南極的艱困航程與全員獲救 → 主旨是這趟航程。
  explain: |
    第 1 段從 2022 年找到沉船寫起，但說這只是「傳奇故事的最後一章」；第 2–5 段依時間寫 1914–1916 年船被冰困住、沉沒、船員求援與全員獲救。
    文章重點是這趟艱困的南極航程 → (C) A challenging voyage to Antarctica. ✓
    (A) 全文沒有介紹 Shackleton 的生平與其他成就，只寫這一次探險（全國 23% 誤選）；(D) 找到沉船只是開頭的引子；(B) 天氣只是困難之一。
eng115-36:
  key: exacerbate＝使惡化；冰水湧入讓情況更糟，就是「火上加油」（add fuel to the fire）。
  explain: |
    原文：冰的壓力讓船板變形，Freezing water rushed in and exacerbated the situation.（冰冷的海水湧入，讓情況更加惡化）
    exacerbate＝使惡化 → (D) Added fuel to the fire.（火上加油）✓
    (A) Broke the ice.（打破僵局；全國 28% 誤選，被文章裡的 ice 吸引）(B) Cost an arm and a leg.（非常昂貴）(C) Missed the boat.（錯失良機）。
eng115-37:
  key: 1914 年 8 月 4 日出發，1916 年 8 月 30 日才救回所有船員 → 整趟旅程超過兩年。
  explain: |
    第 2 段：1914 年 8 月 4 日出發；最後一段：1916 年 8 月 30 日 Shackleton 回到象島救出其他人 → 旅程超過兩年 → (A) ✓
    (B) 他「希望」成為第一個橫越南極大陸的人（hoping to make the first land crossing），但船被困，沒有成功。
    (C) 紮營五個月的地方是隨海漂流的浮冰（pack ice），不是象島（Elephant Island）。
    (D) 他是「親自」帶五名船員搭救生艇去求援（With five crew members, he sailed…），不是派五個人去（全國 20% 誤選）。
eng115-38:
  key: 題目問的是「船」（the Endurance）的路線：駛進威德爾海被冰困住、隨冰漂流後沉沒，沒有到象島。
  explain: |
    第 2–3 段：離開南喬治亞島兩天後遇到浮冰，船被困在威德爾海（Weddell Sea）；船隨冰先往南漂、再被推向北，最後在威德爾海沉沒。
    所以船的路線是從南喬治亞島進入威德爾海、在海中結束 → (C) ✓
    (A) 經過象島再回到南喬治亞島的是「船員」搭救生艇的行程，不是船的路線（全國 44% 誤選）；(B) 方向相反；(D) 先到象島不合。

# ---------- Day 8：114 綜合測驗（世界咖啡館） ----------
eng114-11:
  key: 從 1995 年的時間點看「之後會」擴散 → would＋原形動詞（過去的未來）。
  explain: |
    句意：他們當時都不知道，自己即將創造一個會迅速＿＿＿到全世界的社會創新。
    they were about to create（當時即將創造）→ 擴散是那之後才發生的事 → 用「過去的未來」would spread ✓
    (A) had spread、(C) had been spreading 是過去完成式，表示 1995 年以前就已經擴散，時間順序顛倒。
    (D) would have spread 表示「本來會擴散（但沒有）」，和事實（後來真的擴散到全世界）相反。
eng114-12:
  key: With their plan disrupted by the rain＝計畫被雨打亂（with＋名詞＋過去分詞）。
  explain: |
    句意：原本要在花園圍大圈討論，不巧下起大雨。計畫被雨＿＿＿，二十多位參與者只好擠進客廳。
    下雨讓計畫「被打亂」→ (B) disrupted ✓
    (A) facilitated 促進 (C) disclosed 揭露 (D) fulfilled 實現，都和「只好擠進客廳」矛盾。
eng114-13:
  key: ideas might circulate and deepen＝想法得以流通並深化；呼應 switch tables（換桌）。
  explain: |
    句意：他們定期停下來換桌，讓大家的見解與想法能夠＿＿＿並且深化。
    換桌的目的是讓想法在不同桌之間「流通」→ (A) circulate 流通、傳播 ✓（下一句也說換桌時看到新想法冒出來）
    (B) emphasize 強調（及物動詞，後面要接受詞）(C) recover 恢復 (D) preserve 保存，都不是換桌能達成的效果。
    這題四個選項的選答率很接近，是這一組最難的一題。
eng114-14:
  key: give rise to＝導致、產生；討論方式「產生」了新形式的集體合作。
  explain: |
    句意：一整個早上，這種創新的討論過程＿＿＿一種新形式的集體合作，改變了討論的深度、範圍與品質。
    討論過程「產生」新的合作形式 → (C) gave rise to ✓
    (A) made up for 彌補（全國 34% 誤選；前文沒有需要彌補的損失）(B) kept track of 記錄、追蹤 (D) looked out for 留意、照顧。
eng114-15:
  key: 前面描述了整個過程 → The World Café was thus created.＝世界咖啡館就這樣誕生了。
  explain: |
    句意：世界咖啡館＿＿＿誕生了。
    前一段說明雨天換桌討論的過程與結果 → 這一句是結果 → (D) thus 因此、就這樣 ✓
    (A) still 仍然（全國 19% 誤選）(B) also 也 (C) further 進一步，都沒有「因此」的意思。

# ---------- Day 9：114 綜合測驗（暈動症） ----------
eng114-16:
  key: 疾病、災害突然「發作、侵襲」用 strike：motion sickness can strike suddenly。
  explain: |
    句意：暈動症可能突然＿＿＿，從一陣不舒服發展到冒冷汗。
    疾病突然「發作、來襲」→ (D) strike ✓
    (C) burst 爆裂、衝出（全國 44% 誤選；常見用法是 burst into tears、pipes burst，不用來說疾病發作）(A) crash 撞毀、當機 (B) flush 臉紅、沖水。
eng114-17:
  key: 眼睛、耳朵、身體傳給大腦的訊號「不一致」就會暈。
  explain: |
    句意：當大腦從眼睛、耳朵和身體接收到的訊號＿＿＿時，就會產生暈動症。
    下一句說這些部位 send conflicting information（傳送互相衝突的訊息）→ (C) do not match 不一致 ✓
    (A) are not regular 不規律 (B) can hardly move 幾乎無法移動 (D) are rarely cued 很少被提示，都沒有「衝突」的意思。
eng114-18:
  key: but the other parts don't＝代動詞，代替前面的 detect that your body is moving。
  explain: |
    句意：平衡感系統的一部分偵測到身體在動，但其他部分卻＿＿＿。
    省略的是前面的一般動詞 detects（that…）→ 否定代動詞用 do／does；主詞 the other parts 是複數 → (C) don't ✓
    (A) aren't（全國 43% 誤選）：把 is moving 當成要省略的部分，但這裡對比的是「有沒有偵測到」，不是「身體有沒有在動」。
    (B) won't 未來式 (D) haven't 完成式，時態也不合。
eng114-19:
  key: take measures＝採取措施；後面列出的方法都是「預防」。
  explain: |
    句意：你可以採取一些＿＿＿來避免不舒服。
    後面列出前排座位、看遠方、事先吃藥等方法，都是事先「預防」→ (B) preventive measures 預防措施 ✓（take measures 是固定搭配）
    (A) special opportunities 特別的機會 (C) potential risks 潛在風險 (D) significant advantages 顯著的優點。
eng114-20:
  key: 前一句已經給了一個方法 → 看遠方「也」有幫助：help as well。
  explain: |
    句意：坐前排可以減少晃動；從車上看向遠方＿＿＿有幫助。
    前一句已經提出一個方法，這句再補充另一個 → (A) as well 也 ✓
    (B) by far 遠遠地（修飾最高級）(C) at least 至少 (D) after all 畢竟。

# ---------- Day 10–11：114 文意選填（巴黎聖母院的鐘） ----------
eng114-21:
  key: be noted for…＝以…聞名。
  explain: |
    句意：這座位在巴黎市中心的中世紀大教堂，以精細的建築、美麗的彩繪玻璃窗，尤其是它的鐘＿＿＿。
    is ＿＿ for… → 需要形容詞或過去分詞；「以…聞名」是 be noted for → (I) noted ✓
    (C) familiar（全國 20% 誤選）後面接 to／with，不接 for，而且第 26 題才用得到。
eng114-22:
  key: documented reference to…＝有文獻提到…。
  explain: |
    句意：事實上，早在大教堂完工以前（可追溯到 12 世紀），就有文獻＿＿＿敲鐘的事。
    documented（有記載的）後面接名詞，名詞後面接 to → reference to（提到…）→ (A) reference ✓
eng114-23:
  key: each bearing a name＝每一口鐘都有一個名字（bear＝帶有）。
  explain: |
    句意：這 10 口鐘大小不一，每一口都＿＿＿一個名字。下一句就說最大的一口叫 Emmanuel。
    each＋V-ing 是分詞構句（＝each of which bears a name）→ 需要 V-ing → (B) bearing 帶有 ✓
    (I) noted（全國 30% 誤選）是過去分詞，「每一口都被注意到一個名字」不通。
eng114-24:
  key: the only one that survived the French Revolution＝唯一在法國大革命中倖存的一口。
  explain: |
    句意：它是整組鐘裡唯一＿＿＿法國大革命的一口，其他的都被熔掉做成武器。
    that 後面需要動詞（過去式）；「其他都被熔掉」→ 它「倖存」→ (F) survived ✓
eng114-25:
  key: except for Emmanuel, which retained its sound＝只有 Emmanuel 保有著名的好音色。
  explain: |
    句意：因為音質不好，2013 年所有的鐘都被換掉，只有 Emmanuel 例外，因為它＿＿＿了著名、優美的音色。
    which 後面需要過去式動詞；其他鐘被換掉是因為音質差 → Emmanuel「保有」好音色 → (D) retained ✓
eng114-26:
  key: a familiar part of life＝生活中熟悉的一部分。
  explain: |
    句意：幾個世紀以來，這些鐘已成為巴黎生活中＿＿＿的一部分，被稱為「大教堂的聲音」。
    a＋形容詞＋part → (C) familiar 熟悉的 ✓
    (E) faithful（全國 24% 誤選）是「忠實的」，a faithful part of life 不通；faithful 要用在第 27 題。
eng114-27:
  key: the faithful＝信徒（the＋形容詞＝一群人）；call the faithful to prayer＝召喚信徒禱告。
  explain: |
    句意：這些鐘被用來報時、召喚＿＿＿來禱告，以及在火災、入侵等緊急情況時示警。
    the＋形容詞可以表示「一群人」（例如 the rich 有錢人）；被召喚去禱告的是 the faithful（信徒）→ (E) ✓
    這題全國答對率只有 26%，the＋形容詞＝一群人的用法要記住。
eng114-28:
  key: in times of celebration and of mourning＝在歡慶與哀悼的時刻。
  explain: |
    句意：這些鐘也在＿＿＿和哀悼的時刻響起，宣告王室婚禮、國王加冕，以及國家元首的喪禮。
    and 對等連接 of mourning（哀悼）；婚禮、加冕是「慶祝」→ (G) celebration ✓
    (B) bearing（全國 25% 誤選）放在 of 後面意思不通。
eng114-29:
  key: fall silent＝安靜下來、停止發聲（fall＋形容詞＝變成某種狀態）。
  explain: |
    句意：然而，2019 年那場嚴重的大火損壞了大教堂之後，鐘聲就＿＿＿了。
    fall＋形容詞＝變成某種狀態（fall asleep 睡著、fall ill 生病）→ fell silent 沉寂下來 → (J) silent ✓
eng114-30:
  key: a process of restoration＝修復的過程。
  explain: |
    句意：這棟建築經過複雜又耗時的＿＿＿過程，終於在 2024 年 12 月 8 日重新開放。
    of 後面接名詞；火災後重新開放 → 「修復」→ (H) restoration ✓

# ---------- Day 12：114 篇章結構（膠囊旅館） ----------
eng114-31:
  key: 第一段先說起源與最初的用途，空格接著說「今天」的情況 → Today, they provide… worldwide.
  explain: |
    空格在第一段最後。前句：膠囊旅館起源於日本，原本是讓商務人士不必花大錢就能住在商業區附近。
    接下來交代「現在」的狀況 → (D) Today, they provide low-budget, overnight lodging in commerce centers in large cities worldwide.（今天，它們在全球大城市的商業中心提供平價的過夜住宿）✓
    Today 和前句的 initially（最初）形成對比。(A)「因應需求而創新」要到第三段講新型膠囊旅館時才出現（全國 24% 誤選）。
eng114-32:
  key: 第二段描述房間：大小、牆壁材質 → 接著描述膠囊如何堆疊（兩層、用梯子上去）。
  explain: |
    第二段在描述膠囊房間：大約一張單人床大、牆壁的材質；空格後說每個膠囊有床墊、小燈、電視。
    空格也是房間外觀與配置的描述 → (C) The chambers are stacked side-by-side, two units high, with the upper rooms reached by a ladder.（膠囊並排堆疊成兩層，上層用梯子進入）✓
    (B) 講塑膠牆隔音差、會聽到隔壁打呼，是「缺點」，屬於最後一段（全國 43% 誤選）。
eng114-33:
  key: 空格後說新連鎖店改用吸引數位旅客的設計 → 空格先說「因應需求開始創新」。
  explain: |
    前句：膠囊旅館已擴展到歐洲與北美的大城市。空格後：新的連鎖店不再是傳統簡陋的樣式，改用吸引數位旅客的室內設計，還有免費 Wi-Fi 等設施。
    空格要帶出「改變」→ (A) In response to rising demands, these hotels are embracing a wave of innovation.（為了因應日益增加的需求，這些旅館掀起一波創新）✓
    innovation 對應後面的 new chains、interior design。(D) Today… 是總覽句，應放在第一段（全國 24% 誤選）。
eng114-34:
  key: 最後一段列缺點：通風差 → 牆薄會聽到打呼 → 要共用浴室 → 怕狹小空間要三思。
  explain: |
    最後一段說膠囊旅館不一定適合每個人，依序列出缺點：沒有冷氣、通風差；空格；Also（此外）要和別人共用浴室；如果怕狹小空間最好三思。
    空格也是一個缺點 → (B) The room's thin plastic walls easily transmit the sound of snoring made by neighboring guests.（薄薄的塑膠牆很容易傳來隔壁房客的打呼聲）✓
    thin plastic walls 呼應第二段說牆壁常用塑膠做。(C) 描述房間的配置，屬於第二段（全國 27% 誤選）。

# ---------- Day 13：114 閱讀（交通號誌） ----------
eng114-35:
  key: 全文依時間寫交通號誌的演變：鐵路臂式號誌 → 美國的紅綠燈與黃燈 → 自駕車時代可能不需要號誌。
  explain: |
    第 1–2 段：Knight 把鐵路號誌改成交通號誌（1868 年）；第 3 段：美國的改良與黃燈（1920 年）；第 4 段：有了自駕車，也許不再需要號誌。
    全文重點是交通管制方式如何一路演變 → (A) The evolution of traffic control systems. ✓
    (B) 發明者（Knight、Potts）只是各階段的例子，第 4 段的自駕車管理就和發明者無關（全國 43% 誤選）。
eng114-36:
  key: Knight 的號誌＝鐵路的「可動手臂」＋夜間用的紅綠煤氣燈 → 同時有手臂和燈的 (C)。
  explain: |
    第 1 段：Knight 依照鐵路的可動臂號誌設計，手臂水平伸出表示停止、放低到 45 度表示通行，並加上紅、綠煤氣燈供夜間使用。
    圖中同時有兩支可動手臂和燈的是 (C) ✓
    (A) 是只有燈、沒有手臂的號誌塔（全國 35% 誤選）(B) 只有手臂、沒有燈 (D) 是寫著 STOP／GO 的燈箱。
eng114-37:
  key: 最後一段：自駕車會自動調整速度通過路口，號誌可能不再需要。
  explain: |
    第 4 段：研究者認為有了自駕車，交通號誌可能不再必要，車子會自動調整速度通過路口 → (D) ✓
    (A) 在爆炸中受傷的是操作號誌的警察，不是 Knight。
    (B) Potts 發明的是加上黃燈的三色號誌；在那之前，美國大城市已經有英國號誌的改良版。
    (C) 號誌源自鐵路的可動臂號誌，只是手勢「像」交通指揮員，不是來自指揮員的想法（全國 21% 誤選）。
eng114-38:
  key: 「這個設計後來被全世界沿用」→ 放在介紹 Potts 三色號誌（黃燈）的第 3 段最後。
  explain: |
    句子：This design was adopted in later traffic light designs across the world.（這個設計後來被世界各地的號誌沿用）
    This design 要接在描述一個設計的句子後面；第 3 段最後正好在介紹 Potts 的三色號誌（加上「小心前進」的黃燈），而今天全世界都有黃燈 → (C) Paragraph 3 ✓
    第 2 段最後是號誌被禁用，第 4 段講未來可能不需要號誌，接這句都不合理。

# ---------- Day 14：114 閱讀（恐怖片） ----------
eng114-39:
  key: 研究談的是恐怖片對情緒、焦慮、創傷、睡眠與行為的影響 → 心理學。
  explain: |
    文中的研究內容：safe fear（安全的恐懼）、釋放壓抑的情緒、焦慮、創傷、睡眠、對暴力的敏感度，都在談人的心理與行為 → (A) Psychology 心理學 ✓
    (B) Education 教育 (C) Philosophy 哲學 (D) Communication 傳播，都不是這些研究的主題。
eng114-40:
  key: vicariously＝間接地、透過別人的經驗；觀眾「看」角色的遭遇來學習。
  explain: |
    原文：觀眾被故事吸引，會站在角色的角度、不自覺地預演劇情；研究者認為觀眾用這種方式 learning vicariously，學到面對真實威脅的技巧。
    觀眾沒有親身經歷，而是透過「觀看」角色來學 → (B) Gaining knowledge through observation.（透過觀察獲得知識）✓
    (D) 從「親身經驗」獲得資訊，意思正好相反（全國 25% 誤選）(C) 面對面互動 (A) 毫無保留地提問。
eng114-41:
  key: 最後一段：14 歲以下看恐怖片，成年後較容易焦慮，也可能對暴力變得麻木 → 可能有長期影響。
  explain: |
    第 3 段最後：14 歲以下看恐怖片的孩子，成年後比較容易焦慮；接觸血腥暴力會讓他們對真實暴力比較不敏感、比較能接受攻擊行為。
    這些都是長期的影響 → 可以推論 (D) Watching horror movies may have a long-term effect on personality. ✓
    (A) 文中只說可能對「兒童」有負面影響，沒有說大多數愛看恐怖片的人有攻擊傾向。
    (B) 文章好處、壞處都談，沒有比較哪一邊比較多。
    (C) 疫情期間恐怖片觀看量高，不是「疫情啟發了恐怖片」（全國 19% 誤選）。
eng114-42:
  key: 第 2 段談恐怖片的好處、第 3 段談壞處 → 呈現一個議題的正反兩面。
  explain: |
    第 1 段：有人覺得恐怖片太可怕、有人愛看，研究開始釐清它的好處與風險；第 2 段（One benefit…）談好處；第 3 段（However…）談壞處。
    作者用「正反兩面」來發展全文 → (B) By showing opposing views of an issue. ✓
    (C) 呈現問題的因果（全國 38% 誤選）：文中雖然提到看恐怖片造成的影響，但全文架構是好處對照壞處，不是分析一個問題的原因和結果。
    (A) 定義並舉例說明一個概念（safe fear 只是第 2 段的一小部分）(D) 提供解決爭議的步驟。

# ---------- Day 12–14：112 詞彙題 ----------
eng112-06:
  key: powers of recall＝記憶力（recall 當名詞是「回想、記憶」）。
  explain: |
    句意：我祖父有驚人的＿＿＿，到現在還能生動地描述他小時候第一天上學的情形。
    後句「還能生動描述小時候的事」→ 記性好 → (D) recall 記憶力 ✓（powers of recall 是常見說法）
    (A) resolve 決心 (B) fraction 小部分、分數 (C) privilege 特權。
eng112-07:
  key: evidence to counter the claims＝反駁說法的證據。
  explain: |
    句意：最近的研究找到許多證據來＿＿＿這家藥廠對它治癌「神藥」的說法。
    證據是用來「反駁」藥廠的說法 → (B) counter 反駁、反擊 ✓
    (C) expose 揭露（全國 33% 誤選；常用來揭露祕密、醜聞，或 expose A as B「揭穿 A 是 B」）(A) provoke 激起、挑釁 (D) convert 轉換、改變信仰。
    這題四個選項的選答率幾乎一樣，counter 當動詞的用法很多人不熟。
eng112-08:
  key: cripple the economy＝重創經濟（cripple＝使癱瘓）。
  explain: |
    句意：貪官和錯誤的政策＿＿＿國家的經濟，還讓人民背負龐大的外債。
    「貪官、錯誤政策」造成的是負面結果 → (A) crippled 使癱瘓、重創 ✓
    (B) accelerated 加速（全國 31% 誤選；accelerate the economy 是「促進經濟成長」，是正面意思）(C) rendered 使成為（後面要接受詞＋補語）(D) ventured 冒險。
