# 國文 Day 29–35 解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。

# ---------- Day 29：資料閱讀：鄭崇和墓、狼改變了河流？ ----------
chn111-20:
  key: 長子用鍾是大哥鄭崇聰的兒子過繼而來，「以經營實業著稱」，是鄭家家業發達的關鍵人物之一。
  explain: |
    (C) 鄭崇和「先是收養大哥鄭崇聰之子用鍾」，用鍾「以經營實業著稱」✓
    (A) 乾隆 40 年來臺，帶隊的是「三世長子鄭國周」，也就是鄭崇和的伯父，同行的是父親國唐與叔叔國慶，沒有祖父（全國 27% 誤選）✗
    (B) 「父以子貴，去世後也獲誥贈」，墓碑寫「誥贈」→ 是死後追贈的，不是生前晉升（全國 17% 誤選）✗
    (D) 墓碑「鄭門陳太夫人」可知妻子姓陳；但她卒於道光 25 年，比鄭崇和（道光 7 年）晚過世，後來才移葬同穴（全國 19% 誤選）✗
chn111-21:
  key: 墓碑刻「祀鄉賢祠鄭公」：入祀鄉賢祠是朝廷認可的義行，家族也把它當成榮耀刻在碑上。
  explain: |
    (D) 鄭崇和「去世後即獲朝廷同意入祀鄉賢祠」，墓碑上寫「祀鄉賢祠鄭公」✓
    (A) 鄭崇和批評「受祖父生前蔭庇，歿後又妄信風水」的人，並沒有自認受祖先陰宅風水庇蔭而致富（全國 36% 誤選）✗
    (B) 墓碑「四大房孫男如椿……等重修」是在原地重修（同治 6 年），不是另擇吉地遷葬 ✗
    (C) 「墓始建於道光 7 年，規制悉依《大清會典事例》」，一開始就依典制興建，不是後來擴大；鄭用錫在道光 3 年就已中進士 ✗
chn111-22:
  key: 資料甲沒說鄭用錫墓是國定古蹟、也沒提營造技術 → ①無法判斷；王得祿墓規模最大、墓主是一品官 → 有歷史價值 → ②正確。
  explain: |
    ① 資料甲只說鄭崇和墓「與新竹鄭用錫墓相似」，沒有說鄭用錫墓是國定古蹟，更沒有說是因為營造技術流派特色而列入 → 無法判斷
    ② 王得祿是一品官，墓的規模是臺灣現存古墓之首，符合「具高度歷史……價值」的基準 → 可能是列入古蹟的條件之一 → 正確
    (D) ①無法判斷，②正確 ✓
    (A) ①無法從資料判斷（全國 19% 誤選）✗
chn112-08:
  key: 麥可奈第承認鹿減少讓樹木變多（有些真相），但也指出獵捕、美洲獅和灰熊的影響 →「狼改變了河流」說得太誇大。
  explain: |
    (A) 麥可奈第先肯定「鹿的減少確實讓樹木變多」，再補充開放獵捕、美洲獅與灰熊也讓鹿減少 → 有些真相，但誇大了狼的作用 ✓
    (B) 他承認狼確實有影響，不是完全缺乏實證的假新聞 ✗
    (C)(D) 他是在質疑這個說法，不會說它可信度最高或是應追蹤的警訊 ✗
chn112-09:
  key: 先引蒙比爾特的「狼英雄」說法，再引米德爾頓、麥可奈第的反駁，最後以米德爾頓「提供正確訊息」作結 → 質疑「狼英雄」。
  explain: |
    (D) 支持的蒙比爾特在前，提出反證的米德爾頓、麥可奈第在後，結尾又強調「提供正確訊息仍是環境學家的職責」→ 順序本身就表達了質疑 ✓
    (A) 文中有引用論據，例如 2010 年的研究、蒙大拿州開放獵捕 ✗
    (B) 文章沒有先綜述各方的反應，而是直接從狼放生的經過寫起（全國 22% 誤選）✗
    (C) 是轉述三人的說法，不是訪談的形式 ✗

# ---------- Day 30：木星合土星、京都苔庭 ----------
chn112-10:
  key: 清代誤差小於宋元，可以從文中「小於宋元之際觀測誤差，約等於清代觀測誤差」推出 → 文中已說明，不是預設的背景知識。
  explain: |
    題目要找文中「有交代」、不需要讀者事先知道的知識。
    (C) 文中說木星每天移動的 0.2 度「小於宋元之際觀測誤差，約等於清代觀測誤差」，讀者可以直接推出清代誤差比宋元小 → 不是預設的背景知識 ✓
    (A) 文中用「太白犯填星」「太白犯歲星」說明快慢印象，卻沒說金星比土星快，預設讀者知道（全國 25% 誤選）✗
    (B) 文中同時用「角分」和「度」，沒有說明換算，預設讀者知道（全國 23% 誤選）✗
    (D) 文中說「地球軌道短於外側行星的軌道」，預設讀者知道木星、土星在地球外側 ✗
chn112-11:
  key: 828 年那五天是土星逆向接近木星，移動量又小於古代觀測誤差 → 古人無法單憑移動速度判斷誰犯誰。
  explain: |
    (C) 21–25 日土星反方向跑了 2.2 角分、木星只跑 1 角分，這麼小的差距在古代觀測誤差之內，「古人恐怕辦不到」✓
    (A) 這個例子談的是觀測，不是占星色彩 ✗
    (B) 文中沒說史料有利考證（全國 32% 誤選）✗
    (D) 古人把行星看似靜止稱為「留」，可見知道順行、逆行的變化 ✗
chn112-12:
  key: 歲星犯填星之後，皇帝病重、桓溫和王坦之為輔政之事起衝突 → 應驗的是「內亂」。
  explain: |
    史事：歲星犯填星；同年七月皇帝病重，詔書說桓溫可以自取帝位，王坦之毀了詔書，桓溫大怒要殺王坦之 → 朝廷內部的權力衝突。
    (A) 「相犯為內亂」✓
    (B) 「伐者利」是對外征伐有利 ✗　(C) 「有軍在外，戰不勝，失地」是對外戰敗 ✗
    (D) 史事中沒有亡國（全國 11% 誤選）✗
chn112-13:
  key: 乙前「崇尚蒼老之美」，乙後「因此……變成了代表庭園歷史的一種標誌」→ 中間要說明青苔要很久才長得出來。
  explain: |
    (B) 填入乙：日本庭園崇尚蒼老之美，而青苔非歷時長久不能蔓衍，因此青苔成了庭園歷史的標誌 ✓
    (C) 丙的前後在談苔的質感和顏色（濃翠卻不綺豔），接不上「歷時長久」（全國 24% 誤選）✗
    (A) 甲在說青苔是庭園綠意的要素，還沒談到時間 ✗
    (D) 丁前面已說「苔本身所給予人時間之聯想」，再說歷時長久就重複了 ✗
chn112-14:
  key: 苔在低濕氣候中慢慢蔓衍，質感厚重、濃翠不綺豔，又令人聯想時間 → 形成庭園蒼涼悲寂的情調。
  explain: |
    (C) 苔要低濕的氣候、長久的時間才能蔓衍，加上厚重的質感與時間的聯想，造成蒼涼悲寂的效果 ✓
    (A) 「苔階」「苔徑」是文學上的用法；文中沒說庭園設計者藉文學意象營造悲戚感（全國 24% 誤選）✗
    (B) 枯山水庭園以砂石為主，苔是綠色點綴的要素之一，不是最主要的元素 ✗
    (D) 苔色「雖濃翠，卻不綺豔」，不是亮麗的對比 ✗

# ---------- Day 31：女書、宋代判決書 ----------
chn113-06:
  key: 婚前在娘樓學認女書（正統教育之外的知識）、結為姊妹；婚後靠女書與姊妹通信，彼此相勸扶持。
  explain: |
    (D) 婚前：女兒在娘樓做女紅時學女書，「進入正統教育體系之外的知識系統」；婚後：姊妹們用女書通信，「盡心相勸、彼此扶持」，娘樓時期建立的情誼成為情感的依靠 ✓
    (A) 文中說娘樓是「封閉又親密的女性空間」，沒有說它禁錮青春、困鎖夢想（全國 9% 誤選）✗
    (B) 婚後的女性在夫家生活，文中沒說回娘樓處理夫家家務 ✗
    (C) 文中沒有提到婚後因哭嫁禁忌不能重返娘樓 ✗
chn113-07:
  key: 女書是因時代改變而式微，如今出現在文創設計中；文中沒說江永女性為了復甦女書而投身文創。
  explain: |
    這題選「不適當」的。
    (A) 女人用女書「自傳訴情、互通心跡、結交姊妹」，婚後也靠女書通信、彼此扶持 → 適當
    (B) 執筆者「不止於代書……常將自己的身世寫了進去，形成……『參與寫作』」→ 適當（全國 22% 誤選）
    (C) 女書在消費時代「反成為一種時尚符號，常出現在文創設計中」，但文中沒說是江永女性為了復甦女書而投身文創 → 不適當 ✓
    (D) 女書須以唱誦方式表達，女人透過女書「在社會現實與磨難中掙扎、拉鋸、妥協」，哭嫁作品也控訴父系婚姻 → 適當
chn113-08:
  key: 「粗字粗針到貴府……你在高堂好過日」是謙稱自己的字與針線粗拙，祝對方過好日子，不是寫自己婚後的失落。
  explain: |
    這題選「不是」表現婚後失落的。
    (B) 送上粗拙的字和針線，請對方見諒，祝福對方在高堂過好日子 → 是致意與祝福，不是婚後的失落 ✓
    (A) 嫁妝被分走，做媳婦吃盡苦頭 → 婚後的辛酸 ✗
    (C) 十八歲的女子嫁給三歲的丈夫，「我是寒妻不是娘」→ 婚姻的無奈 ✗
    (D) 婆婆暗中把丈夫支到別州，不知丈夫在哪裡 → 婚後的孤單（全國 9% 誤選）✗
chn113-21:
  key: 鄭七花錢買了元老，元老離開三年後，鄭七「入詞」想要回元老 → 這是訴訟一方主張的事實。
  explain: |
    (B) 劉珵把元老「賣與鄉民鄭七」，鄭七「入詞，欲取回元老」→ 鄭七主張自己有權保有這個養子 ✓
    (A) 提出陳述的是鄭七，對象是劉珵；程十乙只是第二次買元老的人，不是原告 ✗
    (C) 判決是劉珵「決小杖二十」、元老交給族長劉萬二收養，沒有判劉珵賠償鄭七（全國 29% 誤選）✗
    (D) 「於已去三年後」是元老離開鄭七家已經三年，不是鄭七撫養了三年；文中也沒說元老對生父不滿 ✗
chn113-22:
  key: 判詞痛斥劉珵「敗人倫、滅天理」，又請族長「嚴與鈐束」元老，「庶免墮落下流」→ 充滿教化口吻。
  explain: |
    (D) 斥責劉珵「為父不父」「敗人倫、滅天理之已甚者」，又期勉劉萬二嚴加管教，以免元老成為「衣冠之玷」✓
    (A) 開頭說的是父子人倫的道理，不是法律條文（全國 26% 誤選）✗
    (B) 文中沒有被告自陳、原告反駁或證人佐證 ✗
    (C) 開頭的「其罪在子、其責在父」只是說明父子雙方的責任，全文指責的是劉珵「為父不父」，沒有論述「子不子」（全國 23% 誤選）✗

# ---------- Day 32：鄭成功與鯨、回憶與夢、古典的閱讀 ----------
chn113-30:
  key: 乙文寫鄭成功出生那天大鯨現身、風濤暴漲、船隻粉碎；甲文寫他病卒，應驗「歸東即逝」。
  explain: |
    (A) 乙文：出生之夜「鯨鯢長數十丈，夭矯起波間……風濤暴漲……舟航糜碎」✓（全國 32% 漏選）
    (E) 甲文：善知識說大鯨「歸東即逝」，夢見鯨首冠帶由鯤身東入外海，「未幾，成功病卒」✓
    (B) 倭人禮敬翁氏是因為成功出生的異象，文中沒說他降伏大鯨（全國 26% 誤選）✗
    (C) 騎鯨是旁人看到或夢到的異象，不是天賦；乙文還說他「兵敗勢蹙」才東行（全國 28% 誤選）✗
    (D) 甲文說「鄭成功起兵荼毒濱海，民間患之」，他是被視為禍害的一方（全國 25% 誤選）✗
chn113-31:
  key: 兩文都記下與鯨有關的夢（轄下夢鯨首冠帶、荷蘭人夢偉人騎鯨），也都站在清廷立場把鄭氏寫成禍害、逃亡者。
  explain: |
    (C) 甲文「轄下夢見……鯨首冠帶乘馬」；乙文荷蘭左賢王「夜夢一偉人盛服騎鯨魚入鹿耳門」→ 凸顯鄭成功非常人 ✓（全國 17% 漏選）
    (E) 甲文說他「荼毒濱海」，稱他為「孽」；乙文說他「將以海外為逋逃藪」→ 都是清廷的觀點 ✓（全國 66% 漏選）
    (A) 兩文都沒有用中日混血解釋他的軍事才能（全國 21% 誤選）✗
    (B) 乙文的海水暴漲是出生時的異象，造成船毀人亡，不是凸顯軍威（全國 42% 誤選）✗
    (D) 兩文都沒有寫登陸鹿耳門後勢如破竹（全國 51% 誤選）✗
chn113-34:
  key: 李煜夢中忘了自己是俘虜、貪片刻歡樂；辛棄疾夢回沙場點兵 → 都從歡快的夢醒來，面對落空的現實。
  explain: |
    (B) 丙詞：「夢裡不知身是客，一晌貪歡」，醒來只剩「天上人間」的落差；丁詞：夢中吹角連營、沙場點兵，最後「可憐白髮生」→ 都是美夢醒來後的幻滅 ✓
    (A) 兩首詞的夢都是回到過去，沒有寫到未來 ✗
    (C) 「可憐白髮生」是醒來面對現實的感嘆，不是在夢中自憐（全國 26% 誤選）✗
    (D) 李煜感嘆的是亡國、失去江山，不是壯志未酬（全國 18% 誤選）✗
chn113-35:
  key: 短期記憶只保持 5～20 秒；李煜夢中的歡樂是往日當國君的生活，屬於長期記憶 → ①不適當；丁詞的軍中聲響是抗金記憶的斷片 → ②適當。
  explain: |
    ① 乙文說短期記憶只是「於短時間（5～20秒）內保持」的資訊；「一晌貪歡」是夢中片刻的歡樂，夢到的卻是多年前當國君的生活，屬於長期記憶 → 不適當
    ② 辛棄疾年輕時加入義軍抗金；「吹角」「塞外聲」「點兵」正是甲文說的記憶「斷片」，「了卻君王天下事」則是他的夢想 → 適當
    (D) ①不適當，②適當 ✓
    (A) ①不適當（全國 26% 誤選）✗
chn112-34:
  key: 甲文主張「批判性地消化繼承」、以「思想的開放」為目標 → 廣泛接受並適當批判古典，思想就能開闊。
  explain: |
    (A) 甲文說文化「應通過批判性地消化繼承，而不能全盤否定或粗暴對抗」，古典經過閱讀、解釋、再創造，就成為當代價值 ✓
    (B) 乙文沒有談從庶民角度閱讀古典 ✗
    (C) 甲文沒說要獨自體會；乙文雖說可參考專家引導，但提醒「不要變成先入之見」（全國 21% 誤選）✗
    (D) 兩文都沒有談到以同情共感來消解字面上的理解障礙（全國 21% 誤選）✗

# ---------- Day 33：山笑、李漁的廳壁 ----------
chn114-06:
  key: 紙片說《廣辭苑》沒收「山滴」，用語也把郭熙的「如笑」改成「山笑」→《廣辭苑》的解釋和《山水訓》不完全相同。
  explain: |
    (D) 《山水訓》四季都有比喻，《廣辭苑》卻「未採入」夏山的「山滴」；用詞也從「如笑、如睡」改為「山笑、山眠」，次序略有變動 ✓
    (A) 紙片是第五版《廣辭苑》的廣告，「與我手中捧讀的書全不相關」（全國 9% 誤選）✗
    (B) 《廣辭苑》沒有收「山滴」，所以不是四季的季節語都收錄（全國 24% 誤選）✗
    (C) 選「山笑」是配合作者手上那本書在春季印行，不是依循季節的順序（全國 31% 誤選）✗
chn114-07:
  key: 作者查出廣告詞化用了郭熙《山水訓》，佩服「郭熙的絕妙比喻，卻被生動地化為一則含帶商業性質的文字」。
  explain: |
    (C) 查得來龍去脈後「心中釋然」，佩服廣告巧妙化用郭熙的比喻，又稱讚選「山笑」為題是「神來之筆」✓
    (A) 廣告是《廣辭苑》的，不是作者手上那本書的 ✗
    (B) 作者感興趣的是廣告詞的出處，不是陶醉於俳句的文詞（全國 10% 誤選）✗
    (D) 作者查的是「山笑」的出處，不是俳句的發展脈絡，也沒有感到驕傲（全國 22% 誤選）✗
chn114-08:
  key: 「滿分上上籤」要全是吉祥話：綠柳正當時、任君作乾坤、花果結實、福祿慶家門，也和上文春山「山笑」的意象相應。
  explain: |
    (C) 春天綠柳正盛，前途任君施展，花果結實不凋謝，福祿臨門 → 句句吉祥，最適合「上上籤」✓
    (A) 前兩句說江水茫茫，還要「戶內用心再作福」才能得到好結果 → 有條件的吉，不是上上籤（全國 18% 誤選）✗
    (B) 孤單守候、盼不到音信，秋冬細雨綿綿 → 情境淒涼 ✗
    (D) 姜太公八十歲才遇到文王，勸人「且守待運通」→ 時運還沒到（全國 15% 誤選）✗
chn114-20:
  key: 李漁認為「實貼又不如實畫」，請四位名手在廳壁畫花樹，再把自己愛的鳥架在畫上 → 名家實畫加上個人喜好。
  explain: |
    (D) 「倩四名手，盡寫著色花樹」，又因「性嗜禽鳥，而又最惡樊籠」，把鸚鵡蓄在畫中的松枝上 ✓
    (A) 「廳壁不宜太素，亦忌太華」，極簡、華麗都不行 ✗
    (B) 實貼可以避免風吹損傷，「大小咸宜」是說各種尺寸都適合，不是依喜好裁切（全國 36% 誤選）✗
    (C) 引「滿壁畫滄洲」是說直接畫在壁上是高人韻事；滄洲是隱士住的地方，和懷念舊友無關（全國 11% 誤選）✗
chn114-21:
  key: 朋友先以為是神仙之筆，仔細看才知道是真鸚鵡架在畫中松枝上 → 驚嘆虛實相映，懂了裝置方法後拍手叫絕。
  explain: |
    (C) 先是「枝頭鳥動，葉底翎張……詫為仙筆」，「諦觀熟視，方知個裡情形」，才「抵掌叫絕」✓
    (A) 「詫為仙筆」是還沒看清時的驚疑，叫絕是在明白真相之後（全國 18% 誤選）✗
    (B) 主人是想養鳥又不想用籠子，不是打造鸚鵡樂園（全國 10% 誤選）✗
    (D) 鸚鵡是自己跳躍飛鳴，裝置只是固定銅架，不能操控牠 ✗

# ---------- Day 34：錢乙的藥方、晚明遊西湖 ----------
chn114-22:
  key: 古方香連丸以黃連清熱、木香行滯，錢乙加入溫澀的豆蔻來止瀉 → 不拘泥古方，依病情調整用藥。
  explain: |
    (A) 錢乙「化裁古方」，在香連丸中加入豆蔻「溫澀止瀉」，治療同樣的腹痛腹瀉，但藥性不同 ✓
    (B) 古方的黃連是苦降清熱（寒涼），錢乙是加入溫澀的豆蔻，方向正好相反（全國 29% 誤選）✗
    (C) 文中沒有說他考察古今藥材的差異 ✗
    (D) 他是改造古方，不是保存古代名藥 ✗
chn114-23:
  key: 錢乙「當補脾」→ 脾屬土、色黃 → 益黃散；「瀉肺經」→ 肺屬金、色白 → 瀉白散。
  explain: |
    方劑「以五臟與五色的對應關係命名」，對照附圖：
    第一格是補脾的藥：脾（土）（黃）→ 益黃散；第二格是瀉肺的藥：肺（金）（白）→ 瀉白散。
    (C) 益黃散／瀉白散 ✓
    (A) 導赤散對應心（赤），不是脾（全國 13% 誤選）✗
    (B)(D) 瀉青丸對應肝（青），不是肺 ✗
chn114-24:
  key: 土生金：脾是肺的「母」，錢乙「先實其脾，然後瀉其肺」→ ①符合；他主張避免強攻，等小兒「飲食如故」才瀉肺 → ②符合。
  explain: |
    ① 依附圖，土（脾）生金（肺），脾是肺之母；錢乙說「先實其脾，然後瀉其肺，故不虛也」，甲文也說「培土生金」→ 符合
    ② 甲文說小兒臟腑柔弱，「用藥應避免強攻」；乙文中錢乙先補脾，「候飲食如故，即瀉肺經」→ 符合
    (A) ①、②皆符合 ✓
    (D) ①也符合（全國 37% 誤選）✗
chn114-30:
  key: 晚明遊記記的是遊覽的所見所感與審美經驗，出版後又塑造了西湖景物的內涵；乙文待月、丙文野航都表現文人的雅趣。
  explain: |
    (A) 甲文說文人記下「所見所聞、所思所感」，對西湖風景「進行梳理、總結」；乙、丙文寫的是遊賞心得，沒有詳記食宿行程 ✓（全國 64% 漏選）
    (B) 甲文：作品發行後「不斷塑造並加強西湖景物的內涵」✓
    (D) 乙文賞月景「別是一種趣味」；丙文喜「野航兩棹……隨處夷猶」✓
    (C) 甲文說遊記對讀者產生「行為與審美的指引」，不是讓讀者模仿書寫風格（全國 20% 誤選）✗
    (E) 乙文寫的是「時間」的差異：杭人只在午、未、申三時遊湖，文人賞朝煙夕嵐與月色；只有丙文寫地點的選擇（全國 37% 誤選）✗
chn114-31:
  key: 丙文可在柳堤、僧屋隨處吃住，勝在岳墳，錢塘門「苦僧、苦客」；乙文推薦六橋待月 → B、D、E。
  explain: |
    (B) 丙文「或柳堤魚酒，或僧屋飯蔬，可信可宿」→ 依路線隨處安排食宿 ✓（全國 43% 漏選）
    (D) 乙文是〈晚遊六橋待月記〉；丙文「勝在岳墳」✓（全國 27% 漏選）
    (E) 丙文說錢塘門「苦僧、苦客」，乙文說杭人遊湖「止午、未、申三時」→ 午後的錢塘門人多吵雜 ✓（全國 58% 漏選）
    (A) 丙文「極不樂豪家徽賈，重樓架舫」，喜歡的是「野航兩棹」小船（全國 58% 誤選）✗
    (C) 乙文「此樂留與山僧遊客受用」是說這種樂趣留給山僧與遊客享受，不是山僧陪遊；丙文「侶同鷗鷺」是與鷗鷺為伴（全國 52% 誤選）✗

# ---------- Day 35：概念框架、桃花源、屈原、原創者 ----------
chn114-32:
  key: 上文說理解、思考都需要概念框架，人也無法擺脫所有框架 → ①「不適合以任何框架評論」不符合；②要有框架才看得見美 → 符合。
  explain: |
    ① 上文說「凡是理解、思考，都需要概念框架」，人「即使能擺脫一個框架，也無法擺脫所有框架」；說有框架會壓抑才能，與上文相反 → 不符合
    ② 「發現美」需要先有能「看見」它的概念框架，正是上文的觀點 → 符合
    (D) ①不符合，②符合 ✓
    (A) ①不符合上文（全國 20% 誤選）✗
chn114-33:
  key: 燭之武要秦穆公換個角度想：亡鄭只是替晉國增加土地（「亡鄭以陪鄰」）→ 提供另一個可以選擇的思考框架。
  explain: |
    (D) 秦以為滅鄭有利，燭之武指出秦隔著晉國很難管理鄭地，滅鄭只會壯大鄰國 → 讓秦穆公改用「秦國利益」的框架重新評估 ✓
    (A) 梁惠王在荒年移民移粟，是說明自己治國盡心，不是提出另一種框架（全國 10% 誤選）✗
    (B) 張李德和謙稱自己仿效管夫人畫竹、陶淵明愛菊而作畫（全國 17% 誤選）✗
    (C) 庖丁說明解牛時順著牛體的空隙下刀，所以遊刃有餘（全國 17% 誤選）✗
chn114-28:
  key: 桃花源和山水畫都以「理想化」的完美山水為基礎；〈桃花源記〉開頭的桃花林、落英繽紛就是通往仙境的引子。
  explain: |
    (B) 桃花源傳說以「理想化」的山水形象為基礎，正合山水畫的旨趣；圖繪讓它「在文字之外，再得視覺圖像傳播之利」✓（全國 23% 漏選）
    (D) 「夾岸數百步」的桃花林、「芳草鮮美，落英繽紛」的絕美景致，是「人間與仙境短暫遇合的引子」✓
    (A) 理想化的山水本來就是山水畫的主流，文中沒說是桃花源故事啟發了山水畫（全國 31% 誤選）✗
    (C) 文中說桃花源意象由文字和圖繪「共同完成」，沒說兩者開展出不同的意象（全國 48% 誤選）✗
    (E) 偶遇仙境是各地故事共同的主題；中國桃花源的特別之處在鮮明的自然山水，不是偶遇 ✗
chn112-32:
  key: 宋代從愛國的高度肯定屈原的「怨」；明代黃文煥蒙冤下獄而感同身受；現代既延續愛國面向，也思考「詩人何為」。
  explain: |
    (B) 宋朝「轉而強調其愛國之心，以國家民族興亡的高度……確立屈原情感的正當性」✓（全國 25% 漏選）
    (D) 黃文煥「因蒙冤下獄，對屈原不被理解的痛苦感同身受」✓
    (E) 抗戰時加強屈原愛國的面向（延續），詩人節後思考「詩人何為」、理想與世界的衝突（新意）✓（全國 30% 漏選）
    (A) 漢代爭議的是「怨君」合不合儒家「哀而不傷」的理想，不是和《詩經》比高下（全國 13% 誤選）✗
    (C) 甲曲「楚三閭休怪」、乙曲「不達時皆笑屈原非」，是借屈原表明自己寧可醉酒歸隱、不再執著功名，不是待時而動（全國 27% 誤選）✗
chn112-36:
  key: 編劇把新奇的《獅子王》連結到熟悉的《哈姆雷特》，讓高層主管有參考座標 → 提高接受度、降低阻力。
  explain: |
    (A) 「這個熟悉感有助於高層主管把新奇的大草原腳本和經典故事連結起來」→ 讓構想更容易被接受 ✓
    (B) 他們沒有刪減新奇的構想，而是替它找到熟悉的經典連結 ✗
    (C) 文中沒有談到延長醞釀時間 ✗
    (D) 高層主管需要「向觀眾行銷的著力點」，但原創者的做法是用熟悉感說服主管，不是審慎投注資源（全國 20% 誤選）✗
