# 自然 Day 22–28 解析（Claude 撰寫；已對照原卷圖。答案皆為大考中心公布答案；老師審閱後可修改）
# 多選題：錯誤選項標「誤選」、正確選項很多人沒選的標「漏選」，都是全國考生的比例。
# 110 年是舊課綱試卷，超出 108 課綱必修範圍的題目已在 science_tags.yaml 標為範圍外，不排入練習。

# ---------- Day 22：力學與運動、原子結構與週期表、細胞與細胞分裂 ----------
sci111-03:
  key: 重力 $F=\dfrac{GMm}{r^2}$ ⇒ $\dfrac{F_{\text{火}}}{F_{\text{地}}}=\dfrac{m_M}{m_E}\cdot\left(\dfrac{r_E}{r_M}\right)^2=\dfrac{1.86^2}{9.3}\approx0.37$。
  explain: |
    同一物體在星球表面受的重力和「星球質量÷半徑平方」成正比。
    $\dfrac{F_{\text{火}}}{F_{\text{地}}}=\dfrac{1}{9.3}\times1.86^2=\dfrac{3.46}{9.3}\approx0.37$ (B) ✓
    (C) 0.72（全國 18% 誤選）(D) 0.93（全國 12% 誤選）：半徑沒有平方，或比值倒過來。
sci111-10:
  key: 荷質比：H⁺＝1/1＝1，He²⁺＝2/4＝0.5，Li⁺＝1/6.9≈0.14 → H⁺ > He²⁺ > Li⁺。
  explain: |
    電子的質量很小，離子的質量約等於原子量。
    H⁺：$\dfrac11=1$；He²⁺：$\dfrac24=0.5$；Li⁺：$\dfrac{1}{6.9}\approx0.14$
    (A) H⁺ > He²⁺ > Li⁺ ✓
    (C)（全國 14% 誤選）(B)（全國 10% 誤選）：排序錯誤，可能只看電荷或只看質量。
sci111-19:
  key: 螢光強度∝DNA 量：間期 DNA 複製後加倍（最強）；有絲分裂完成時回到原本的量，比複製後的間期細胞弱。
  explain: |
    雙套生物的細胞，間期中完成 DNA 複製後 DNA 量加倍（染色體仍是雙套，只是每條有兩條染色分體）；有絲分裂完成後，子細胞的 DNA 量回到原來一半。
    (B) 分裂完成時仍是雙套染色體，DNA 量比複製後的間期細胞少，螢光較弱 ✓
    (E) DNA 是在「間期」中複製，不是複製完才進入間期（全國 29% 誤選）✗
    (D) DNA 複製發生在間期，不是分裂期（全國 20% 誤選）✗
    (A) 有絲分裂不會產生單套的細胞（全國 13% 誤選）✗
    (C) DNA 複製後仍是雙套，不是三套 ✗
sci111-20:
  key: 要找正在分裂的細胞 → 生長旺盛或修補中的組織：植物根尖、受傷修復中的皮膚。
  explain: |
    (B) 根尖有分生組織，細胞分裂旺盛 ✓
    (C) 傷口修復時，皮膚細胞會分裂補充 ✓
    (A) 木質部的導管細胞多是死細胞，不會分裂（全國 14% 誤選）✗
    (D) 成熟的生殖細胞（配子）不再分裂（全國 15% 誤選）✗
    (E) 成熟的神經細胞一般不再分裂 ✗
sci111-01:
  key: 以暴風半徑 180 公里當比例尺：21 日 14 時到 22 日 02 時，颱風中心移動約 120 公里，12 小時 → 約 10 公里／時。
  explain: |
    圖上 21 日 14 時與 22 日 02 時兩個位置的距離，大約是暴風圈半徑（180 公里）的三分之二，約 120 公里。
    時間 12 小時 → 平均時速 $\approx\dfrac{120}{12}=10$ 公里 (B) ✓
    (C) 20（全國 15% 誤選）：距離估成兩倍，或時間只算 6 小時。
sci111-02:
  key: 等速率但方向改變 → 合力垂直於速度；24～26 日預測位置的間隔越來越小 → 減速 → 平均合力和速度反向。
  explain: |
    (B) 速率不變、方向一直改變，表示合力只改變方向、不改變快慢 → 合力垂直於速度 ✓
    (E) 24 日 14 時到 26 日 14 時，預測路徑上每 12 小時的位置越來越密 → 速率變小 → 平均合力和速度方向相反 ✓
    (A) 方向一直在改變，一定有合力（全國 30% 誤選）✗
    (C)(D) 23 日 14 時後雖然沿直線前進，但位置間隔逐漸變小，不是等速度，合力不為零（全國 15%、21% 誤選）✗

# ---------- Day 23：近代物理與基本交互作用、化學與生活、環境、代謝與能量 ----------
sci111-04:
  key: 天氣現象（氣壓、風、降水、雲）主要受重力和電磁力影響；強力、弱作用只在原子核內作用。
  explain: |
    (D) 分子間的作用、水氣凝結、輻射吸收與摩擦力，都源自電磁力 ✓
    (E) 重力使空氣有重量、形成氣壓，讓冷空氣下沉、雨滴落下 ✓
    (A) 弱作用只在原子核衰變時明顯（全國 17% 誤選）✗
    (B) 強作用只在原子核內作用（全國 15% 誤選）✗
    (C) 「夸克作用」不是四種基本交互作用之一 ✗
sci111-11:
  key: 量圖：甲 Rf≈0.9、乙≈0.8、丙≈0.5；同時間內移動距離比＝速率比，乙：丙≈0.8：0.5＝8：5。
  explain: |
    由起始線到停止線的距離當作 1，量出甲約 0.9、乙約 0.8、丙約 0.5。
    (C) 層析時間相同，移動距離比就是速率比：乙：丙≈0.8：0.5＝8：5 ✓
    (A) 乙的 Rf 約 0.8，不是 0.2 ✗
    (B) 甲＋丙約 1.4，不是 0.6 ✗
    (D) 移動距離和成分與濾紙、展開液的作用有關，無法判斷分子量（全國 21% 誤選）✗
    (E) Rf 值是比值，在相同條件下是定值，不會因展開液走得較遠而變大（全國 14% 誤選）✗
sci111-21:
  key: 光合作用在葉綠體、會產生 ATP；發酵在細胞質；有氧呼吸大部分 ATP 在粒線體產生；植物葉肉細胞可同時進行兩者。
  explain: |
    (A) 光合作用在葉綠體中進行 ✓
    (C) 光反應會產生 ATP，再用於合成醣類 ✓
    (E) 有葉綠體的植物細胞在光照下，同時進行光合作用和有氧呼吸 ✓
    (D) 有氧呼吸產生的 ATP 大部分在粒線體內產生（全國 26% 誤選）✗
    (B) 發酵作用在細胞質中進行，不需要粒線體（全國 16% 誤選）✗
sci111-07:
  key: 圖 4 的波折線大致貼著 260 K 左右的標準曲線，$260\ \text{K}\approx-13^\circ$C → 最接近 $-10^\circ$C。
  explain: |
    五條標準曲線是 220、240、260、280、300 K。大氣向外熱輻射的波折線，大部分落在 260 K 曲線附近。
    換算攝氏：$260-273=-13^\circ$C，最接近 $-10^\circ$C (D) ✓
    (B) 260（全國 22% 誤選）：260 是克氏溫度，題目問的是攝氏。
    (C) 100（全國 19% 誤選）(A) 270（全國 11% 誤選）。
sci111-08:
  key: CO₂ 增加，被大氣吸收、留在系統內的熱變多 → 大氣內（地表附近）變暖；向外的熱輻射在 CO₂ 頻段變少 → 大氣外變冷。
  explain: |
    比較圖 4：CO₂ 為 1000 ppm 時，波折線在某段頻率明顯下凹（箭頭處），向外的熱輻射變少，熱被留在大氣內。
    (B) 留在大氣內的能量增加 → $\Delta T_{\text{內}}>0$ ✓
    (E) 向外發出的熱輻射減少，大氣外層得到的能量變少 → $\Delta T_{\text{外}}<0$ ✓
    (D) 大氣外會變冷，不是變暖（全國 24% 誤選）✗
    (A) 溫室效應使大氣內變暖（全國 16% 誤選）✗
    (C) 能量收支改變，溫度一定會變 ✗

# ---------- Day 24：力學與運動、化學與生活、環境、遺傳 ----------
sci111-05:
  key: $K=\dfrac12mv^2$ ⇒ $v^2=\dfrac{2\times3.6\times10^6}{720}=10^4$ ⇒ $v=10^2$ m/s。
  explain: |
    3600 千焦耳＝$3.6\times10^6$ J。
    $v^2=\dfrac{2K}{m}=\dfrac{7.2\times10^6}{720}=10^4$ ⇒ $v=100$ m/s (A) ✓
    (C) $10^4$（全國 14% 誤選）：算出 $v^2$ 後忘了開根號。
sci111-12:
  key: 甲烷水合物燃燒的其實是被包在裡面的甲烷；相圖上 0°C、10 atm 落在相界的低壓側 → 甲烷水合物不穩定。
  explain: |
    相界左上方（低溫、高壓）是甲烷水合物穩定存在的區域。
    (A) 水合物中能燃燒的是甲烷，水不會燒 ✓
    (E) 0°C 時，壓力要到二十多大氣壓以上，甲烷水合物才穩定；10 atm 時不會存在 ✓
    (C) 0°C、140 atm 在冰與水相界（虛線）的右側，是水不是冰（全國 19% 誤選）✗
    (D) −15°C 時，壓力大約 20 atm 以上就有甲烷水合物（全國 17% 誤選）✗
    (B) 在相界右側（溫度較高或壓力較低），甲烷氣體可以和水同時存在 ✗
sci111-22:
  key: 孟德爾的「遺傳因子」是推論出來的抽象概念；中心法則（DNA→RNA→蛋白質）說明了遺傳因子如何決定性狀。
  explain: |
    (B) 孟德爾當時並不知道基因的物質基礎，用符號（如 A、a）表示的遺傳因子是抽象的假說 ✓
    (C) 中心法則說明基因如何表現成蛋白質、進而決定性狀，解釋了性狀和遺傳因子的關聯 ✓
    (A) 「一對遺傳因子」相當於一對對偶基因，組成「一個」基因型，不是兩個基因型（全國 50% 誤選）✗
    (D) 位於同一條染色體上的基因會一起遺傳（連鎖），通常不遵循獨立分配律（全國 28% 誤選）✗
    (E) 病毒不行有性生殖，孟德爾法則不適用 ✗
sci111-28:
  key: 火星是岩石構成的類地行星；表面有河道、三角洲等流水痕跡 → 過去可能有液態水、可能適合生命。
  explain: |
    (A) 水星、金星、地球、火星都是類地行星 ✓
    (E) 毅力號降落在古代三角洲附近，就是因為那裡曾有流水，可能保存生命跡象 ✓
    (C) 體積和地球最接近的是金星（全國 29% 誤選）✗
    (D) 火星大氣稀薄，呈紅色是因為表面有氧化鐵；「大紅斑」在木星上（全國 12% 誤選）✗
    (B) 小行星帶在火星和木星之間，從地球到火星不會經過（全國 7% 誤選）✗
sci111-29:
  key: 先有流水堆積的三角洲（丙）→ 隕石撞出坑（甲）→ 風把沙堆進坑內形成沙丘（乙）。
  explain: |
    隕石坑打在三角洲上 → 三角洲比隕石坑老；沙丘在隕石坑「裡面」→ 隕石坑形成後才有沙丘。
    (D) 丙－甲－乙 ✓
    (A) 甲－乙－丙（全國 13% 誤選）：三角洲被隕石坑破壞，一定比較老。

# ---------- Day 25：電磁學、酸鹼與溶液、生物技術與實驗 ----------
sci111-06:
  key: $I_1>0$ 時磁場向下；要產生 $I_2>0$，需要「向下的磁通量增加」：$I_1>0$ 且漸增，或 $I_1<0$（磁場向上）且漸減。
  explain: |
    感應電流只在磁通量「改變」時產生，方向要反抗這個改變（冷次定律）。依題圖，$I_2>0$ 對應的是讀卡機線圈中向下的磁通量在增加。
    (B) $I_1>0$ 且漸增：向下的磁場增強 ✓
    (E) $I_1<0$ 且漸減：磁場向上且變弱，等於向上的磁通量減少，效果和向下增加相同 ✓
    (C) $I_1<0$ 且漸增：向上的磁場增強，感應電流方向相反（全國 22% 誤選）✗
    (A)(D) 電流維持定值，磁通量不變，不會產生感應電流（全國 14%、16% 誤選）✗
sci111-13:
  key: 1:1 混合後指示劑 Y 呈綠色（pH 4～7.5）、9:1 也是綠色 → 甲是弱酸（醋酸）；1:9 時呈鹼性 → 乙是鹼（氨水）。
  explain: |
    1:9（乙多）：X 粉紅、Y 藍 → pH＞8 → 乙是鹼。
    1:1：X 無色、Y 綠 → pH 4～7.5，接近中性或弱酸性。
    9:1（甲多）：Y 仍是綠色 → pH 仍在 4 以上 → 甲是「弱」酸，過量也不會讓 pH 掉到 4 以下。
    (E) 甲：CH₃COOH，乙：NH₃ ✓
    (A) 甲若是鹽酸（強酸），9:1 時鹽酸大量過量，pH 約 1.3，Y 不會是綠色（全國 37% 誤選）✗
    (B)(D) 甲是氨水時，9:1 會呈鹼性，Y 應為藍色 ✗
    (C) 甲是食鹽水，9:1 時氨水仍使溶液呈鹼性 ✗
sci111-23:
  key: 兩組魚在河水中都長得比較小 → 河水缺乏生長所需物質；轉殖魚在河水中仍比控制組大很多 → 仍分泌大量生長激素。
  explain: |
    (C) 控制組、轉殖組在河水中都比在試驗場池水中短 → 河水可能缺乏某些生長所需的物質 ✓
    (D) 在河水中，轉殖組（152 cm）仍遠大於控制組（53 cm）→ 轉殖的 GH 基因照樣大量表現 ✓
    (E) 轉殖組在河水中反而長得較小，無法推論分泌量較高（全國 13% 誤選）✗
    (A) 控制組的魚本來就會分泌生長激素，只是量較少（全國 8% 誤選）✗
    (B) 表中只有體長，沒有肌肉密度的資料（全國 11% 誤選）✗
sci111-30:
  key: 面向正東拍星跡：星跡和地平面的夾角＝90°－緯度；甲幾乎垂直 → 接近赤道；乙約 45°、往右上升 → 北緯約 45°。
  explain: |
    在赤道，星星垂直於地平面升起；緯度越高，升起的路徑越斜，夾角＝90°－緯度。北半球面向東，星星往右上方（偏南）升起；南半球則往左上方升起。
    (C) 甲的星跡幾乎垂直地平面 → 接近赤道 ✓
    (E) 乙的星跡與地平面約成 45°，且向右上方斜升 → 北半球、緯度約 45° ✓
    (B) 乙往右上方升起，是北半球（全國 18% 誤選）✗
    (A)(D) 甲接近赤道，緯度比乙低 ✗
sci111-09:
  key: 愛因斯坦用「光子」解釋光電效應（1905）；拉塞福用 α 粒子撞擊金箔（1911），波耳模型（1913）在他之後。
  explain: |
    (B) 愛因斯坦提出光由光子組成，每個光子能量 $E=hf$，成功解釋光電效應 ✓
    (D) 氫原子光譜在波耳之前就已觀測到（巴耳末等人），波耳是用他的模型去解釋它（全國 30% 誤選）✗
    (C) 拉塞福是用 α 粒子撞擊金箔，不是用電子撞擊氫原子（全國 18% 誤選）✗
    (A) 光電效應無法用馬克士威的電磁波理論解釋（全國 11% 誤選）✗
    (E) 拉塞福模型（1911）在前，波耳模型（1913）在後 ✗

# ---------- Day 26：化學計量與熱化學、遺傳、生物技術與實驗 ----------
sci111-14:
  key: 50 L 辛烷＝35 kg＝307 mol → 產生 $8\times307\approx2460$ mol CO₂ ≈ 108 kg → $108\div16\approx6.8$ 天。
  explain: |
    平衡：$\mathrm{2C_8H_{18}+25O_2\to16CO_2+18H_2O}$，1 mol 辛烷產生 8 mol CO₂。
    辛烷質量：$50000\ \text{cm}^3\times0.70=35000$ g → $35000\div114\approx307$ mol
    CO₂：$307\times8\approx2456$ mol → $2456\times44\approx1.08\times10^5$ g ≈ 108 kg
    天數：$108\div16\approx6.8$ 天 (C) ✓
    (D) 14（全國 17% 誤選）：把 1 mol 辛烷產生的 CO₂ 算成 16 mol（直接用平衡式中的係數 16）。
    (B) 2.2（全國 18% 誤選）：計算過程有誤。
sci111-24:
  key: RNA 是單股，鹼基用 U 取代 T；細胞中 RNA 由 DNA 轉錄而來；mRNA 疫苗進入細胞後直接被轉譯成病毒的蛋白質。
  explain: |
    (C) 基因表現時，DNA 先轉錄成 RNA ✓
    (D) 疫苗的 mRNA 在細胞質中被核糖體轉譯成病毒的棘蛋白，誘發免疫反應 ✓
    (E) mRNA 不需要、也不會插入人體的基因體，直接在細胞質轉譯（全國 30% 誤選）✗
    (A) RNA 通常是單股（全國 10% 誤選）✗
    (B) RNA 用尿嘧啶（U）取代 DNA 的胸腺嘧啶（T）（全國 9% 誤選）✗
sci111-25:
  key: 第 22 天（只打一劑）10～50 μg 組已超過檢測極限；第 29 天（打完第二劑）大幅上升；60 μg 組沒打第二劑，一直偏低。
  explain: |
    (C) 第 22 天時，10、30、50 μg 組的抗體量已超過虛線，第一劑在適當劑量下就有意義的免疫原性 ✓
    (D) 第 22 天打第二劑後，第 29 天各組抗體量都明顯上升 ✓
    (E) 60 μg 組劑量最高，但沒有打第二劑，抗體量始終在檢測極限附近 → 第二劑有必要 ✓
    (B) 第 1 天的值約為 $1\times10^1$，不是 1（全國 49% 誤選）✗
    (A) 五組都有打疫苗，只是劑量不同；這個試驗沒有不打疫苗的控制組（全國 31% 誤選）✗
sci111-31:
  key: 恆星自己發光，顏色反映表面溫度（藍白比紅色熱）；行星靠反射陽光，顏色不代表溫度。
  explain: |
    (A) 織女星藍白色、心宿二紅色 → 織女星表面溫度較高 ✓
    (B)(C) 天王星、火星是行星，顏色來自反射陽光與表面或大氣的成分，不能用來比較溫度 ✗
    (D) 發光能力（光度）和溫度、大小都有關；心宿二是紅超巨星，光度其實比織女星大，顏色無法判斷（全國 20% 誤選）✗
    (E) 火星本身不發光 ✗

# ---------- Day 27：波動與光、科學探究與實作、酸鹼與溶液 ----------
sci111-49:
  key: 小幅度的高頻波動約每 1 秒一次 → $f_H\approx1$ Hz；大幅度的低頻波動約每 10 秒一次 → $f_S\approx0.1$ Hz。
  explain: |
    數圖上的波：40 秒內大起伏約 4～5 次 → 週期約 10 秒 → $f_S\approx0.1$ Hz；小鋸齒在每 10 秒內約有 10 個 → 週期約 1 秒 → $f_H\approx1$ Hz。
    (B) $f_H\approx1$ Hz ✓
    (D) $f_S\approx0.1$ Hz ✓
    (A) $f_H\approx10$ Hz 表示每秒振動 10 次，圖上的鋸齒沒有那麼密（全國 41% 誤選）✗
    (C) $f_S\approx1$ Hz（全國 35% 誤選）✗
sci111-50:
  key: 血液朝感測器流動 → 反射波頻率變高（都卜勒效應）；同一介質中波速相同 → 波長變短：$\lambda_I>\lambda_R$。
  explain: |
    反射體（血液中的物質）接近感測器，接收到的反射波頻率變高：$f_R>f_I$。
    同一介質中波速相同：$v_I=v_R$，$v=f\lambda$ ⇒ 頻率高的波長短 → $\lambda_I>\lambda_R$ (D) ✓
    (E) $\lambda_I=\lambda_R$（全國 34% 誤選，比答對的人還多）：頻率改變了，波長也跟著改變。
    (C) 週期是頻率的倒數，$f_R>f_I$ ⇒ $T_I>T_R$（全國 13% 誤選）✗
    (B) 反射波頻率較高，不是較低（全國 12% 誤選）✗
sci111-52:
  key: 約 1 Hz（每分鐘約 60 次）的週期性變化，正好是心跳的頻率。
  explain: |
    高頻成分的頻率約 1 Hz，也就是每分鐘約 60 次，和心跳次數相同；心臟每次收縮都把血液推出去，流速隨之起伏。
    (B) 心跳 ✓
    (D) 酒精發酵（全國 13% 誤選）：酵母菌的發酵和人體血流的週期變化無關。
    (A) 呼吸（全國 8% 誤選）：每分鐘十幾次，頻率比心跳低。
sci111-53:
  key: 抹片中數量最多、大小約 7 μm（遠大於 800 nm 的光波長）的是紅血球 → 反射主要來自紅血球。
  explain: |
    血液中紅血球的數量遠多於白血球和血小板，大小約 7～8 μm，比 800 nm 的光波長大，能有效反射光。
    (A) 紅血球 ✓
    (B) 白血球（全國 20% 誤選）：圖中有深色細胞核的白血球很少。
    (C) 血小板（全國 10% 誤選）：數量雖多但很小，反射較弱。
sci111-15:
  key: 浮力 120 克重 → 溶液密度 1.20 g/cm³；45°C 溶解度約 40 g/100 g 水 → 140 g 溶液含 40 g X，體積 116.7 cm³ → 約 4.6 M。
  explain: |
    金屬塊體積 100 cm³，減輕 120 克重 → 排開溶液 120 g → 溶液密度 $=1.20$ g/cm³。
    由圖 7，45°C 時溶解度約 40 g/100 g 水 → 飽和溶液 140 g 含 X 40 g。
    溶液體積 $=140\div1.20\approx116.7$ cm³；X 的莫耳數 $=40\div75\approx0.533$ mol
    濃度 $=\dfrac{0.533}{0.1167}\approx4.6$ M (D) ✓
    提醒：要用浮力求出的密度，把飽和溶液的「質量」換成「體積」。
    (C) 4.0（全國 23% 誤選）(B) 3.4（全國 21% 誤選）：溶解度或溶液體積算錯。

# ---------- Day 28：演化與分類、大氣與氣象、力學與運動 ----------
sci111-26:
  key: 同源構造來自共同祖先：硬骨魚都有硬骨（吳郭魚、鮭魚），真核生物都有細胞核（動物、植物）。
  explain: |
    (C) 吳郭魚、鮭魚都是硬骨魚，鯊魚是軟骨魚 → 以硬骨這個同源構造分群 ✓
    (D) 動物、植物都是有細胞核的真核生物，細菌是原核生物 ✓
    (A) 雞和人的恆溫是各自演化出來的，不是判斷類群的同源構造（全國 36% 誤選）✗
    (B) 海豚也是四足類，祖先同樣有後肢；烏龜與蝙蝠不會因為「有後肢」而另成一群（全國 32% 誤選）✗
    (E) 生態習性不是同源構造；無尾熊其實是有育兒袋的有袋類，和袋鼠才是同一類群（全國 11% 誤選）✗
sci111-32:
  key: 由「亂」變「整齊」的相變（凝結、凝固、凝華）放熱；由「整齊」變「亂」（熔化、蒸發、昇華）吸熱。
  explain: |
    (A) 水氣凝結成露珠（氣→液）放熱 ✓
    (D) 水氣直接變成冰晶（氣→固，凝華）放熱 ✓
    (E) 對流雲形成時水氣大量凝結，放出潛熱，讓雲繼續向上發展 ✓
    (B) 冰直接變水氣（昇華）要吸熱（全國 28% 誤選）✗
    (C) 積雪融化（固→液）要吸熱（全國 28% 誤選）✗
sci111-58:
  key: SI 七個基本量：長度、質量、時間、電流、溫度、物量、光強度；電阻、電壓、能量、磁場都是導出量。
  explain: |
    (A) 質量（公斤）是基本量 ✓
    (B)(C)(D)(E) 電阻（Ω）、電壓（V）、能量（J）、磁場（T）都可以由基本量組合導出 ✗
sci111-59:
  key: 放了待測物，秤盤變重 → 線圈一側要受向下的磁力；通電線圈像磁鐵，下方磁極要和固定磁鐵上方的磁極相反（異性相吸）。
  explain: |
    用右手定則：四指沿電流方向彎曲，大拇指指向線圈內的磁場方向（線圈的 N 極）。
    (A) 由上往下看電流為逆時針 → 線圈上方是 N、下方是 S；固定磁鐵上方是 N → S 和 N 相吸，線圈被往下拉 ✓
    (D) 由上往下看電流為順時針 → 線圈下方是 N；固定磁鐵上方是 S → 相吸 ✓
    (B)(C) 線圈下方和磁鐵上方是同一種極，互相排斥，線圈被往上推，天平更不平衡（全國 28% 誤選）✗
    (E) 磁鐵橫放，線圈不會受到向下的磁力 ✗
sci111-16:
  key: 分子中有 4 個 N：氰基 N、吡唑環上兩個 N、胺基 N，每個 N 各有 1 對孤對電子 → 共 4 對。
  explain: |
    N 有 5 個價電子；形成 3 個共價鍵（含雙鍵、參鍵的計算）後，剩下 1 對孤對電子。
    圖中的 N：C≡N 的 N（1 對）、環上 N＝ 的 N（1 對）、環上連著苯環的 N（1 對）、NH₂ 的 N（1 對）→ 共 4 對 (B) ✓
    (C) 6（全國 16% 誤選）：多算了；每個 N 只有 1 對孤對電子。

