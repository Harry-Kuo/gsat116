# 社會 Day 29–35 解析（Claude 撰寫；地圖、照片、圖表題已對照原卷圖。答案為大考中心公布答案；老師審閱後可修改）
# 110 年是舊課綱試卷，排入的題目都已確認在 108 課綱必修範圍內。

# ---------- Day 29：世界史、聚落與交通、法律原則 ----------
soc111-17:
  key: 十九世紀初動力織布機領先全球的是工業革命的發源地英國；當時英國禁止技術外流，美國人洛厄爾到英國參觀後憑記憶帶回美國。
  explain: |
    (A) 英國是工業革命的先驅，十九世紀初禁止機器與技術外流；美國靠這類技術轉移開始發展紡織工業 ✓
    (B) 十九世紀初日本還在鎖國，明治維新是 1868 年以後的事（全國 46% 誤選）✗
    (C) 十九世紀初的美國工業技術落後英國，不可能「獨步全球」（全國 7% 誤選）✗
    (D) 十九世紀初的美國工業技術同樣落後英國，俄國更晚才工業化（全國 6% 誤選）✗
soc112-20:
  key: 拉丁美洲住在千萬人以上大都市的人口比例遠高於歐洲 → 過度都市化：鄉村土地集中、生計困難，人口湧入少數大都市。
  explain: |
    (C) 拉丁美洲鄉村產業不健全、土地集中在大地主手中，失業人口大量移往大都市，形成超大都市與貧民窟 ✓
    (B) 拉丁美洲大都市的就業機會其實不足，許多移入者只能從事非正式部門（全國 31% 誤選）✗
    (A) 圖表看不出政府推動首要型都市的政策（全國 19% 誤選）✗
    (D) 拉丁美洲大都市的公共設施不足，不是吸引人口的原因 ✗
soc111-65:
  key: 「非經審判，不得被捆綁、監禁或鞭打」→ 在法院判決有罪之前，不能把人當成罪犯處罰，這就是無罪推定。
  explain: |
    (C) 無罪推定原則：被告在判決確定有罪前，應被推定為無罪，不能先受刑罰 ✓
    (B) 公開審理是審判過程要公開，和「審判前不得處罰」無關（全國 12% 誤選）✗
    (A) 自由心證是法官依證據自由判斷 ✗
    (D) 偵查不公開是保護偵查中的資訊與當事人名譽 ✗
soc111-66:
  key: 從耶路撒冷到羅馬是往西航行，盛行西風由西往東吹，是逆風 → 沿著海岸、島嶼前進，利用陸地遮蔽減輕逆風的阻礙。
  explain: |
    (C) 盛行西風帶的風由西吹向東，船往西航行要逆風而行，所以沿著陸地前進 ✓
    (D) 副熱帶高壓帶天氣晴朗、風力弱，不是航行要避開的障礙（全國 27% 誤選）✗
    (A) 東北信風帶在更南的低緯，風向朝西南，對西行反而有利（全國 18% 誤選）✗
    (B) 極圈氣旋帶在高緯度，影響不到地中海 ✗
soc111-27:
  key: 臺灣輸出米、油、糖、樟腦、茶等農產，從漳、泉、福州、寧波、上海買回衣服與日用品 → 兩岸物產互補的區域分工。
  explain: |
    (D) 臺灣出口農林產品、進口大陸的手工業品與日用品，兩岸形成生產分工 ✓
    (A) 1830 年代臺灣還沒開港，外國洋行要到 1860 年開港後才設立（全國 18% 誤選）✗
    (C) 史料列的是貿易品項，看不出農產加工技術是否成熟 ✗
    (B) 史料談的是臺灣與大陸港口的貿易，沒有漢人與原住民的交易 ✗

# ---------- Day 30：世界區域地理、社會安全與公共政策、中國史 ----------
soc112-21:
  key: 中國可能在索羅門群島設基地，牽動南太平洋的安全情勢 → 同在區域內的紐西蘭可能表態，關切區域和平與穩定。
  explain: |
    (D) 紐西蘭和澳洲一樣是南太平洋的重要國家，區域安全受影響時，外交單位可能提出維護區域和平的立場 ✓
    (C) 塔斯馬尼亞是澳洲的一州，不是國家，不能自行和中國建立安全合作（全國 40% 誤選）✗
    (A) 一份安全協議不代表大洋洲的地緣角色改由其他國家掌控；澳洲、紐西蘭也不是南島語族國家（全國 17% 誤選）✗
    (B) 島國擴大安全合作，不代表會取代紐澳的區域核心角色（全國 13% 誤選）✗
soc112-01:
  key: 基於社會正義，政府應該給弱勢者（智力缺損者）更多彈性協助 → 校園中同樣是照顧身心障礙者的需求，例如無障礙環境。
  explain: |
    (B) 網友關心的是讓身心障礙者能參與社會，換成校園議題就是建造無障礙環境，保障他們平等受教與活動 ✓
    (D) 升學或就業輔導是提供給所有學生的服務，不是特別針對弱勢者（全國 32% 誤選）✗
    (C) 免費營養午餐針對的是經濟弱勢，和身心障礙者參與社會的議題不同（全國 7% 誤選）✗
    (A) 雙語教育和弱勢者參與無關 ✗
soc111-34:
  key: 山坡種滿作物、沙洲開墾、平地樹木砍光、原始林也被開發 → 人口太多，土地與資源被過度利用，超過環境能承受的限度。
  explain: |
    (A) 能開發的土地都已用盡，連邊際土地也被開墾，表示人口壓力超過環境負載力 ✓
    (B) 日記談的是當地土地利用，沒有說到和其他區域的互賴 ✗
    (C) 日記沒有提到原住居民遷出 ✗
    (D) 日記沒有談到產業分工 ✗
soc111-35:
  key: 主張放寬殺女嬰禁令 → 當時重男輕女，因為農業社會靠男性勞力耕作；可見經濟以需要大量體力的農業為主。
  explain: |
    (C) 傳統農業依賴人力耕作，男性勞動力受重視，才會出現殺女嬰的陋習 ✓
    (D) 農業社會城鄉互相依賴，城市需要鄉村供應糧食（全國 17% 誤選）✗
    (B) 和精確計算能力無關（全國 11% 誤選）✗
    (A) 採集經濟是史前時代的特徵，不是十九世紀的清代 ✗
soc112-32:
  key: 資料一是去臺北打拼的歌（1990 年代），配上流向集中到臺北的圖 6；資料三是到加工出口區、參與十大建設（1960–70 年代），配上有大量人口流向高雄的圖 5。
  explain: |
    (D) 圖 6 的箭頭幾乎都流向北部，符合「來去臺北打拼」；圖 5 有流向高雄的人口，符合到加工出口區與十大建設工作 ✓
    (B) 資料二說本地勞工被迫移出北部都會區，但兩張圖都是流向北部（全國 18% 誤選）✗
    (A) 資料二和兩張圖都不符，資料一也較符合圖 6 ✗
    (C) 資料三提到的加工出口區、十大建設是 1960–70 年代，應配圖 5 ✗
soc112-33:
  key: 臺北從頭到尾都吸引大量人口（核心持續成長）；1985 年後連南部的人都往北移，許多地區人口被吸走 → 反吸作用。
  explain: |
    (A) 北部核心持續成長，其他地區的人口與勞動力被吸往核心，出現反吸效應的隱憂 ✓
    (C) 不平等交換談的是核心和邊陲在貿易上的價格差距，遷徙圖看不出來（全國 39% 誤選）✗
    (D) 人口流出的地區都市化不一定提高，不是「各地」都持續成長（全國 32% 誤選）✗
    (B) 圖中呈現的是人口被吸往核心，不是擴散效應（全國 6% 誤選）✗

# ---------- Day 31：生活中的法律、臺灣史、法律原則 ----------
soc112-02:
  key: 遺囑可以自由處分財產，但不能侵害法定繼承人的「特留分」；子女的特留分是應繼分的二分之一。
  explain: |
    (D) 甲把房屋全部留給兒子，侵害女兒的特留分，女兒可以主張扣減，取得部分財產 ✓
    (A) 遺囑自由有特留分的限制，不能全權決定（全國 26% 誤選）✗
    (B) 前妻已經離婚，不是甲的配偶，沒有繼承權 ✗
    (C) 法院不會直接判決均分，女兒能主張的是特留分 ✗
soc111-38:
  key: 第二條只開放基隆、高雄、馬公三港，以及「省內海上交通航線」→ 只有臺灣島內港口之間的航線還能往來，對外一律封鎖。
  explain: |
    (A) 蘇澳和安平都在臺灣省內，屬於省內海上交通航線，仍有機會往來 ✓
    (B) 廈門在對岸，屬於對外航線，新竹港也已被封鎖（全國 14% 誤選）✗
    (C) 香港不在省內，臺中港也不在開放的三港之內（全國 10% 誤選）✗
    (D) 東京在國外，花蓮港也不在開放的三港之內 ✗
soc111-39:
  key: 1949 年 5 月國共內戰局勢逆轉，大量軍民撤離來臺 → 封鎖港口、只留三港在警總監護下開放，是要管制人員進出、穩定臺灣局勢。
  explain: |
    (C) 戒嚴令封鎖港口、嚴禁出入，目的在管制大陸軍民撤退來臺的人流，防止共黨滲透，穩定政情 ✓
    (B) 戰後臺灣已由中華民國接收，和日本的政治聯繫早已切斷（全國 16% 誤選）✗
    (A) 條文管的是港口出入，不是禁止米、糖外銷（全國 13% 誤選）✗
    (D) 1949 年 5 月美國還沒有協防臺灣，和美國協議圍堵是韓戰爆發以後的事（全國 13% 誤選）✗
soc111-40:
  key: 造謠、鼓動學潮和持有槍彈、破壞交通等輕重不同的行為，一律處死刑 → 刑罰和行為的嚴重程度不相稱，違反比例原則（罪刑相當）。
  explain: |
    (B) 罪行輕重不同卻一律處死刑，手段與目的不成比例，違反比例原則 ✓
    (D) 條文是公布後才適用，沒有溯及既往的規定（全國 6% 誤選）✗
    (A) 列舉的行為都和治安有關，問題不在無關（全國 5% 誤選）✗
    (C) 只處罰部分行為是立法選擇，不等於違反平等原則（全國 5% 誤選）✗
soc111-41:
  key: 解嚴令由總統公布，行政院長和國防部長副署 → 副署制度讓行政院對總統的命令負責，這是內閣制的精神。
  explain: |
    (D) 憲法規定總統依法公布法律、發布命令，須經行政院長或加上有關部會首長副署，是內閣制「元首不負政治責任、由內閣負責」的設計 ✓
    (B) 副署的是行政院長或行政院長及「有關」部會首長，不是每道命令都要國防部長副署（全國 33% 誤選）✗
    (C) 副署是行政院長表示負責，不是單純服從總統命令（全國 15% 誤選）✗
    (A) 國防部並不是行政院各部會之首，三人署名也無法證明這點（全國 8% 誤選）✗

# ---------- Day 32：氣候與生態、地圖與地理資訊系統、法律原則 ----------
soc112-34:
  key: 金門位在臺灣海峽西側；冬季東北季風進入海峽，被兩岸地形夾在較窄的通道中，風速增強（狹管效應），所以金門風大。
  explain: |
    (C) 季風通過寬度縮減的臺灣海峽，氣流被擠壓加速，使金門風速強勁 ✓
    (A) 冷鋒只是偶爾通過，不能解釋長期風大；金門風強的主因是季風在海峽中加速（全國 57% 誤選）✗
    (B) 颱風（熱帶性低氣壓）只在夏秋偶爾影響，不是長期風大的原因（全國 10% 誤選）✗
    (D) 金門位在北回歸線以北，太陽不會終年直射 ✗
soc112-35:
  key: 探究「石獅爺位置與盛行風向」要有：石獅爺的由來（耆老訪談）、大比例尺的聚落位置圖（1/1000）、長期的風向資料（測站氣候數據）。
  explain: |
    (D) 乙可了解設立石獅爺的原因，丁能精確標示聚落內石獅爺的位置，戊能呈現長期的盛行風向 ✓
    (C) 丙的比例尺 1/400000 太小，看不出聚落內部的位置；己只有一天的資料，不能代表盛行風向（全國 30% 誤選）✗
    (A) 甲遊客問卷無法說明石獅爺的設置原因；丙比例尺太小（全國 9% 誤選）✗
    (B) 甲遊客問卷不具代表性；己只有一天的資料（全國 7% 誤選）✗
soc112-03:
  key: 少年案件不公開審理，是為了保護少年的隱私、避免標籤化，讓他有機會重新出發；塗銷紀錄也是同樣的目的。
  explain: |
    (C) 輔導處分執行完畢一段時間後塗銷紀錄，和不公開審理一樣都是保護少年的前途 ✓
    (A) 讓少年到庭陳述意見是保障程序權，不是保護隱私（全國 17% 誤選）✗
    (B) 讓被害人陳述意見是保障被害人的權益 ✗
    (D) 損害賠償是處理民事責任 ✗
soc111-44:
  key: 十九世紀後期正是新帝國主義時代 → 列強看上近東（巴爾幹、中東）的戰略位置與資源，鄂圖曼帝國領土被一步步侵蝕。
  explain: |
    (B) 俄、英、法等列強在十九世紀後期爭奪近東，鄂圖曼帝國節節失地，被稱為「近東病夫」✓
    (C) 第一次世界大戰在 1914 年才爆發，不是十九世紀後期（全國 26% 誤選）✗
    (D) 凱末爾在一戰後推翻鄂圖曼帝國、建立土耳其共和國，是二十世紀的事（全國 15% 誤選）✗
    (A) 圍攻維也納失敗是十六、十七世紀的事（全國 12% 誤選）✗
soc111-45:
  key: 文中說泛伊斯蘭主義「不是軍事策略，也非教條儀式與民族主義」，而是以伊斯蘭基本信仰作為共同的生活倫理 → 凝聚共同價值與集體信念。
  explain: |
    (C) 以伊斯蘭的基本信仰作為普遍的生活規範，重建共同價值、團結伊斯蘭世界 ✓
    (B) 文中明說不是民族主義，而是跨宗派、地域、民族（全國 10% 誤選）✗
    (D) 文中明說不是教條儀式（全國 10% 誤選）✗
    (A) 文中明說不是對抗西方的軍事行動策略 ✗
soc111-46:
  key: 阿富汗在伊朗高原東側 → 伊斯蘭教從阿拉伯半島往東北經兩河流域、伊朗高原傳入中亞與阿富汗。
  explain: |
    (D) 阿拉伯帝國向東擴張，征服波斯（伊朗高原）後再傳入阿富汗一帶 ✓
    (B) 尼羅河往北越過地中海是到歐洲，方向不對（全國 12% 誤選）✗
    (C) 經南洋群島擴散到的是東南亞（全國 12% 誤選）✗
    (A) 從尼羅河往西越過撒哈拉是到西非（全國 7% 誤選）✗

# ---------- Day 33：地形與自然環境、氣候與生態、經濟學概念 ----------
soc112-36:
  key: 甲河段比乙高，所以河水從甲流向乙；聚落位在河道彎曲的凹岸（基蝕坡），水流直接沖擊而受災嚴重。
  explain: |
    (B) 洪水從較高的甲河段往下游流，河道轉彎處的凹岸是基蝕坡，受水流直接衝擊 ✓
    (A) 滑走坡在凸岸，水流較緩、以堆積為主，不是受到直接沖擊的位置（全國 42% 誤選）✗
    (C) 甲比乙高，水不會從乙流向甲（全國 11% 誤選）✗
    (D) 水流方向錯誤（全國 8% 誤選）✗
soc112-37:
  key: 德國約在北緯 50 度，屬盛行西風帶；來自波羅的海的潮濕氣團帶來大雨，是溫帶氣旋活動（極鋒一帶），對應極圈氣旋帶。
  explain: |
    (A) 極圈氣旋帶（副極地低壓帶）是冷暖氣團交會的地方，溫帶氣旋發展旺盛，常帶來大量降雨 ✓
    (C) 東北信風帶在低緯度地區，影響不到德國（全國 46% 誤選）✗
    (D) 副熱帶高壓帶的空氣下沉，天氣乾燥少雨（全國 26% 誤選）✗
    (B) 極地高壓帶寒冷乾燥，少降水 ✗
soc112-04:
  key: 算每坪房租：補貼前三房兩廳最便宜（32000÷50＝640 元）；補貼後月租各減 10000 元，一房一廳變成最便宜（6000÷20＝300 元）。
  explain: |
    (D) 補貼前每坪 800、700、650、640 元，三房兩廳最低；補貼後每坪約 300、367、400、440 元，一房一廳最低 ✓
    (B) 補貼後三房兩廳每坪 440 元，變成最貴（全國 22% 誤選）✗
    (A) 兩房兩廳在補貼前後都不是每坪最便宜的（全國 12% 誤選）✗
    (C) 補貼前不是兩房兩廳最便宜，補貼後也不是兩房一廳（全國 12% 誤選）✗
soc111-55:
  key: 西晉末年北方大亂、二京傾覆、士族南渡江左 → 永嘉之亂：內遷的匈奴、羯等胡人起兵，西晉滅亡，開啟五胡十六國。
  explain: |
    (C) 東漢以來大量胡人內遷，西晉末年八王之亂後，匈奴劉淵等起兵，攻陷洛陽、長安 ✓
    (B) 匈奴勢盛、南下牧馬是秦漢時期的情勢；西晉末年起事的匈奴是已經內遷的部族（全國 27% 誤選）✗
    (A) 文中的胡人原本就住在中原周邊，不是為了避寒南侵（全國 13% 誤選）✗
    (D) 蒙古興起是十三世紀的事（全國 12% 誤選）✗
soc112-38:
  key: 設計、製造、封裝測試的上下游廠商相互依存 → 產業連鎖緊密，形成完整的產業聚落。
  explain: |
    (A) 上下游廠商彼此供應、合作，產業連鎖緊密，是臺灣晶片產業的優勢 ✓
    (D) 文中強調的是突破微細加工的技術，不是生產標準化（全國 15% 誤選）✗
    (B) 文中沒有提到生產規模（全國 10% 誤選）✗
    (C) 工業慣性是指產業因既有設施而不易遷移，文中說的是上下游依存（全國 7% 誤選）✗
soc112-39:
  key: 文中說難以跨越的門檻是「高品質的技術與人力」，臺灣靠產官學長期培養人才與研發 → 其他國家的知識經濟還不夠成熟。
  explain: |
    (B) 晶片產業仰賴高階技術與人才，知識經濟發展較慢的國家短期內難以追上 ✓
    (C) 文中的關鍵是技術與人才，不是企業的組織結構；臺灣晶片業本身也是上下游分工，而非垂直整合（全國 26% 誤選）✗
    (D) 國際分工體系早已存在，文中沒有提到 ✗
    (A) 晶片業不是依賴原料的產業 ✗

# ---------- Day 34：經濟學概念、臺灣史、全球化與多元文化 ----------
soc112-22:
  key: 東印度公司供給的生絲數量不變，生絲毛利卻從 1633 年幾乎 0 增加到 1638 年約 55 萬荷盾 → 售價上漲；價格上漲表示需求增加得比供給多。
  explain: |
    (C) 供給量不變而利潤大增，代表日本的生絲價格上升；需求增加的幅度大於供給增加時，均衡價格會上升 ✓
    (B) 東印度公司的供給不變，賣得的利潤增加，看不出日本減少進口（全國 17% 誤選）✗
    (D) 需求減少的幅度大於供給減少時，價格會下降，不是提高（全國 6% 誤選）✗
    (A) 價格會調整到供需相等的均衡點，價格提高不代表市場一直供不應求（全國 5% 誤選）✗
soc112-23:
  key: GDP ＝ 消費＋投資＋政府支出＋（出口－進口）。日本賣給東印度公司是出口、向它買是進口 → 補上貿易資料後 GDP 變高，表示日本的出口大於進口。
  explain: |
    (C) 東印度公司賣給日本的（日本進口）少於向日本買的（日本出口），淨出口為正，GDP 估計值提高 ✓
    (A) 東印度公司的收益與成本是荷蘭公司的利潤，不能決定日本的淨出口（全國 28% 誤選）✗
    (B) 和上一年度比較，不能說明這一年的淨出口是正或負（全國 22% 誤選）✗
    (D) 生絲和其他商品都是東印度公司賣給日本的，是日本的進口，不能說明淨出口為正（全國 18% 誤選）✗
soc111-61:
  key: 集團移住讓部落被迫離開傳統生活空間、和其他族群混居 → 今天要劃設傳統領域時，就面臨「原本住哪裡、範圍到哪裡」的爭議。
  explain: |
    (A) 部落被遷離原居地、拆散並嵌入其他族群的領域，直接影響當今傳統領域的認定與劃設 ✓
    (C) 正名運動主要是爭取族名與「原住民」稱呼的承認，和遷移部落的關係較遠（全國 10% 誤選）✗
    (D) 族語流失主要來自語言同化政策 ✗
    (B) 傳統姓名的喪失來自改姓名政策，不是集團移住 ✗
soc111-62:
  key: 要找的是「因應國際人權與多元文化而改變」的新制度 → 原住民族基本法規定部落設部落會議，經核定可成為公法人，肯定部落自治。
  explain: |
    (D) 部落經核定為公法人，承認部落是自主的主體，是尊重原住民族集體權的新做法 ✓
    (C) 原住民保留地的制度源自日治時期的山地管理，是延續至今的部分（全國 32% 誤選）✗
    (B) 山地、平地原住民的區分沿襲舊有的行政劃分，不是新的人權觀念（全國 15% 誤選）✗
    (A) 國家擁有林地、原住民要經許可才能取用，是延續殖民時期的國家管理思維（全國 8% 誤選）✗
soc112-40:
  key: 研究「住在油井、氣井周圍」的人 → 以油井為中心畫出一定距離的範圍（環域），再看範圍內居民的特色。
  explain: |
    (A) 環域分析以點、線為中心畫出一定距離的緩衝區，可以找出住在油井周圍的人口 ✓
    (C) 視域分析是找出某點可以看到的範圍（全國 12% 誤選）✗
    (D) 地形分析是分析坡度、坡向等，和居民特色無關 ✗
    (B) 路徑分析是找出兩地之間的最佳路線 ✗
soc112-41:
  key: 加州南部、德州西南部靠近墨西哥邊界，拉丁裔人口比例高，社會處境較不利。
  explain: |
    (C) 美國西南部鄰近墨西哥，拉丁裔移民集中，常居住在環境條件較差的地區 ✓
    (B) 非裔美國人主要集中在東南部各州與大城市（全國 35% 誤選）✗
    (D) 阿拉伯裔不是美國西南部的主要族群（全國 10% 誤選）✗
    (A) 亞裔在加州雖多，但不是德州西南部的主要族群 ✗

# ---------- Day 35：法律原則、經濟學概念、臺灣史 ----------
soc112-24:
  key: 限制人民權利的事項要有法律依據（法律保留原則），所以先修法、再依法律授權公告標準；租稅要由法律規定（租稅法律主義）也是法律保留。
  explain: |
    (B) 課稅涉及財產權，必須以法律規定，和先修法再公告殘留標準一樣都是法律保留原則 ✓
    (A) 命令違反法律無效是「法律優位原則」，談的是牴觸的效力，不是需要法律依據（全國 43% 誤選）✗
    (D) 少年事件優先適用少年事件處理法是「特別法優於普通法」（全國 16% 誤選）✗
    (C) 子女姓氏由父母約定是民法的規定內容，和法律保留無關 ✗
soc112-25:
  key: 標示原產地後，在意萊劑的消費者會改買國產豬肉 → 國產豬肉需求增加（價、量都上升）；萊豬需求減少（價、量都下降）。
  explain: |
    (A) 國產豬需求曲線右移，均衡價格與數量都上升；萊豬需求曲線左移，均衡價格與數量都下降 ✓
    (B) 需求增加時價格和數量會同向上升，不會價格上升、數量下降（全國 42% 誤選）✗
    (D) 國產豬肉需求增加，價格不會下降（全國 8% 誤選）✗
    (C) 方向完全相反 ✗
soc112-26:
  key: 地方自治條例不能牴觸中央法律；中央已依食安法訂定殘留標準，市府規定「不得檢出」並處罰，與食安法牴觸。
  explain: |
    (D) 依地方制度法，自治條例牴觸憲法、法律或中央法規者無效；萊劑標準已由食安法與中央規定，條例和它牴觸 ✓
    (A) 自治條例本來就要經地方議會通過，文中沒有說它未經議會審議（全國 12% 誤選）✗
    (C) 判斷條例是否無效的標準是有沒有牴觸法律，不是和部會的政策立場是否相同（全國 11% 誤選）✗
    (B) 自治條例不需要經公民投票（全國 6% 誤選）✗
soc112-05:
  key: 墓葬出土唐代（七世紀）與日本（十七世紀）的銅錢 → 十三行人取得了外地的器物，可見和東亞各地有往來。
  explain: |
    (B) 來自中國與日本的銅錢出現在十三行遺址，可以討論臺灣史前人群和東亞各地的交流 ✓
    (C) 銅錢是陪葬品，不能證明十三行人用它當交易的貨幣單位（全國 16% 誤選）✗
    (A) 外來銅錢無法說明文化的前後傳承 ✗
    (D) 銅錢是交流而來的物品，不代表有人群遷徙 ✗

