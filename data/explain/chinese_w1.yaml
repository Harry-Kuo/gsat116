# 國文第 1 週：解析與一行重點（key）。由 Claude 撰寫，老師審閱後可直接修改。
# explain 每一行會成為一個段落；可用 <u>底線</u>、<b>粗體</b>。答案一律以大考中心公布為準。

chn114-01:
  key: 「舁」「臾」都讀ㄩˊ；其他三組聲符相近但讀音不同。
  explain: |
    (A) 舁ㄩˊ（抬）／臾ㄩˊ（須臾：片刻）→ 讀音相同 ✓
    (B) 啗ㄉㄢˋ（吃、給人吃）／諂ㄔㄢˇ（諂媚）→ 不同
    (C) 迤ㄧˇ（迤邐：曲折連綿）／弛ㄔˊ（鬆弛）→ 不同
    (D) 畛ㄓㄣˇ（畛域：界限）／殄ㄊㄧㄢˇ（暴殄天物：任意糟蹋東西）→ 不同
    陷阱：「啗／諂」「畛／殄」右半部相同，很容易誤判為同音，要逐字確認。
chn112-01:
  key: 「笳」「袈」都讀ㄐㄧㄚ；踣ㄅㄛˊ和掊ㄆㄡˇ是這題的主要陷阱。
  explain: |
    (A) 胡笳ㄐㄧㄚ（古代管樂器）／袈ㄐㄧㄚ裟 → 讀音相同 ✓
    (B) 鬩ㄒㄧˋ（兄弟鬩牆：兄弟不和）／睨ㄋㄧˋ（傲睨：傲慢地斜眼看）→ 不同
    (C) 踣ㄅㄛˊ（跌倒）／掊ㄆㄡˇ（掊擊：抨擊）→ 不同（全國 23% 誤選）
    (D) 吁ㄒㄩ（吁嗟：嘆息）／迂ㄩ（迂腐）→ 不同
chn114-02:
  key: 伶牙「俐」齒、矯「揉」造作、大有「斬」獲；D 完全正確。
  explain: |
    (A) 伶牙<u>利</u>齒 → 應為「伶牙俐齒」（俐：聰明、靈巧）
    (B) 矯<u>柔</u>造作 → 應為「矯揉造作」（矯：把彎的弄直；揉：把直的弄彎，比喻刻意做作）
    (C) 大有<u>展</u>獲 → 應為「大有斬獲」（斬：殺，引申為收穫）
    (D) 剽竊、恬不知恥 → 全部正確 ✓
    判斷法：把字義想清楚。「矯揉」是把東西弄直或弄彎，才有「造作」的意思；「柔」字說不通。
chn111-02:
  key: 「顧」名思義、「趨」之若鶩、傾家「蕩」產；闃然無聲沒有錯字。
  explain: |
    (A) <u>故</u>名思義 → 應為「顧名思義」（顧：看）。全國有 42% 選 A，是這題最大的陷阱。
    (B) 闃ㄑㄩˋ然無聲：寂靜無聲 → 全部正確 ✓
    (C) <u>驅</u>之若鶩 → 應為「趨之若鶩」（趨：奔向；鶩：鴨子）
    (D) 傾家<u>盪</u>產 → 應為「傾家蕩產」
    提醒：越常用的成語越容易寫錯，因為我們很少停下來想每個字的意思。
chn114-26:
  key: 腹笥甚廣＝學問淵博；吐哺握髮＝求才若渴。箕山之志是想隱居，不是參選。
  explain: |
    (A) 腹笥ㄙˋ甚廣：肚子像書箱一樣裝滿書，比喻學識淵博 → 適當 ✓
    (B) 箕山之志：堯想讓位給許由，許由逃到箕山隱居，比喻不求仕進的志向 → 與「決定參選」相反 ✗（全國 68% 誤選）
    (C) 席不暇暖：連把座席坐暖的時間都沒有，形容忙碌奔走 → 誤用成「寒冷」✗
    (D) 摩頂放踵：從頭頂到腳跟都磨傷，比喻捨己為人、不辭辛勞 → 誤用成「擁擠」✗
    (E) 吐哺握髮：周公吃飯吐出食物、洗頭握著頭髮去接見賢士，比喻求才殷切 → 適當 ✓
    多選題技巧：每個選項獨立判斷，B、D 這種「看字面好像說得通」的最危險。
chn111-01:
  key: 「痺」「髀」都讀ㄅㄧˋ；「彈箏搏髀」出自核心選文〈諫逐客書〉。
  explain: |
    (A) 痺ㄅㄧˋ（瘖痺：啞而不能言）／髀ㄅㄧˋ（大腿；彈箏搏髀：一邊彈箏一邊拍大腿打拍子）→ 讀音相同 ✓
    (B) 忮ㄓˋ（嫉妒；不忮不求出自《詩經》）／庋ㄍㄨㄟˇ（收藏）→ 不同
    (C) 攢ㄘㄨㄢˊ（聚集；「攢蹙累積」出自柳宗元〈始得西山宴遊記〉）／鑽ㄗㄨㄢ → 不同
    (D) 剜ㄨㄢ（挖）／腕ㄨㄢˋ → 聲調不同
    「彈箏搏髀」出自李斯〈諫逐客書〉：「夫擊甕叩缶，彈箏搏髀，而歌呼嗚嗚快耳者，真秦之聲也。」核心選文的難字要熟。
chn110-01:
  key: 「阡」「愆」都讀ㄑㄧㄢ；〈大同與小康〉的「矜寡孤獨」要讀ㄍㄨㄢ。
  explain: |
    (A) 賚ㄌㄞˋ（賞賜）／齎ㄐㄧ（懷抱；齎志以歿：抱著未完成的志向而死）→ 不同
    (B) 阡ㄑㄧㄢ（阡陌：田間小路）／愆ㄑㄧㄢ（過失）→ 讀音相同 ✓
    (C) 餔ㄅㄨ（吃；餔糟歠釃出自〈漁父〉）／仆ㄆㄨ（向前跌倒）→ 不同（全國 33% 誤選，最大陷阱）
    (D) 矜ㄍㄨㄢ（通「鰥」，老而無妻）／逭ㄏㄨㄢˋ（逃避）→ 不同
    「矜寡孤獨廢疾者，皆有所養」出自核心選文〈大同與小康〉，「矜」讀ㄍㄨㄢ。
chn110-02:
  key: 妙趣「橫」生、正式「啟」用、大「快」朵頤；A 完全正確。
  explain: |
    (A) 聳人聽聞、不忍卒ㄗㄨˊ睹 → 全部正確 ✓
    (B) 妙趣<u>恆</u>生 → 應為「妙趣橫生」（橫：充分、洋溢）
    (C) 正式<u>起</u>用 → 應為「啟用」。「啟用」是開始使用；「起用」是重新任用人員，對象不同。
    (D) 大<u>塊</u>朵頤 → 應為「大快朵頤」（朵頤：鼓動腮頰吃東西）
    四個選項全國選擇率都在 22%–27% 之間，代表多數人是用猜的；把字義想清楚就能拿分。
chn113-25:
  key: 始作俑者是貶義；胸無城府是坦率沒心機，不是「沒規劃」。
  explain: |
    (A) 不足為訓：不能當作準則或典範 → 用來評心存僥倖的防災態度，適當 ✓（只有 39% 選，許多人漏選）
    (B) 白雲蒼狗：天上的雲一下像白衣、一下像蒼狗，比喻世事變化無常 → 適當 ✓
    (C) 空谷足音：在空寂的山谷聽見腳步聲，比喻難得的人、言論或作品 → 適當 ✓
    (D) 始作俑者：首開惡例的人，是貶義 → 用於發明飛機不當 ✗
    (E) 胸無城府：待人坦率、沒有心機 → 誤用成「做事沒有規劃」✗（全國 58% 誤選）
chn111-03:
  key: 白駒過隙形容時間過得很快，不是世事無常。
  explain: |
    本題要選「不適當」。
    (A) 白駒過隙：日影像白馬從縫隙間一閃而過，比喻時間過得很快 → 用來說「世事變化無常」不當 ✗，故選 A
    (B) 竭澤而漁：把池水抽乾來捕魚，比喻只顧眼前、不留餘地 → 適當
    (C) 頭角崢嶸：比喻才能出眾、嶄露頭角 → 適當
    (D) 進退維谷：進退兩難 → 適當
    提醒：題幹問「不適當」，作答前先圈出關鍵字，避免選反。

chn114-25:
  key: 客何「負」於秦／此來為不「負」都是「辜負、對不起」；彈「冠」／「冠」鏡都是帽子。
  explain: |
    這題的例句幾乎全部來自 15 篇核心選文，熟讀課文最划算。
    (A) 示民有「常」（〈大同與小康〉：常規、法則）／不「常」居（〈項脊軒志〉：經常）→ 不同
    (B) 人煙「猶」是（洪繻〈鹿港乘桴記〉：仍然）／「猶」同室之兄弟（鄭用錫〈勸和論〉：如同）→ 不同（全國 49% 誤選）
    (C) 客何「負」於秦（〈諫逐客書〉：虧欠、對不起）／此來為不「負」（〈勞山道士〉：辜負）→ 相同 ✓
    (D) 獎「率」三軍（〈出師表〉：率領）／「率」意而鴉塗（〈畫菊自序〉：隨意、輕率）→ 不同
    (E) 彈「冠」（〈漁父〉：帽子）／「冠」鏡首飾（〈虯髯客傳〉：帽子、冠飾）→ 相同 ✓
chn111-26:
  key: 「悉」＝全部；諫逐客書、鴻門宴的「內」都通「納」。
  explain: |
    (A) 十「有」五（《論語》：通「又」）／男「有」分（〈大同與小康〉：有）→ 不同
    (B) 「悉」來合券（〈馮諼客孟嘗君〉：全部）／「悉」以充贈（〈虯髯客傳〉：全部）→ 相同 ✓
    (C) 未「見」其明（〈師說〉：看見）／鬚眉畢「見」（〈勞山道士〉：音ㄒㄧㄢˋ，顯現）→ 不同
    (D) 卻客而不「內」（〈諫逐客書〉：通「納」，接納）／毋「內」諸侯（〈鴻門宴〉：通「納」，讓…進入）→ 相同 ✓
    (E) 「已」為牆（〈項脊軒志〉：不久、隨後）／「已」不概見（〈鹿港乘桴記〉：已經）→ 不同（全國 64% 誤選）
    〈項脊軒志〉「庭中始為籬，已為牆」是在說變化的先後：先是籬笆，不久改成牆，「已」不是「已經」。
chn110-37:
  key: 「長於臣」「賢於弟子」＝比我年長、比弟子賢能，才是比較句。
  explain: |
    判斷方法：把「形容詞＋於＋名詞」翻成「比＿＿形容詞」，說得通才是比較。
    (A) 後凋於歲寒：在歲寒時最後凋零，「於」表時間 → 不是
    (B) 困於周郎（〈赤壁賦〉）：被周瑜所困，「於」表被動 → 不是
    (C) 長於臣（〈鴻門宴〉）：比我年長 → 比較 ✓
    (D) 賢於弟子（〈師說〉）：比弟子賢能 → 比較 ✓
    (E) 有益於君（〈燭之武退秦師〉）：對您有好處，「於」表對象 → 不是
chn114-29:
  key: 「則」前面是假設（如果不…），後面是結果；A、E 符合。
  explain: |
    題幹的結構：「假設情況＋則＋結果」＝「如果…，就…」。
    (A) 如果學生舉一隅而不能以三隅反，就不再教他（《論語》）→ 假設 ✓
    (B) 「吾家讀書久不效」是已經發生的事實，「兒之成，則可待乎」是期待的語氣 → 不是（全國 51% 誤選）
    (C) 門人點燭進來，「則」（竟然、原來）只見道士獨坐（〈勞山道士〉）→ 表示發現 → 不是
    (D) 既然同樣是遷徙來臺，就都是臺灣人（〈勸和論〉）→ 由已知事實推論 → 不是
    (E) 如果一定要秦國出產的才可以用，那麼夜光之璧就不能裝飾朝廷（〈諫逐客書〉）→ 假設 ✓
chn112-27:
  key: 頗、甚、極修飾動作的程度；「殊遇」的殊修飾名詞，「行略定」的略是動詞（攻取）。
  explain: |
    (A) 「頗」僭於上（〈虯髯客傳〉）：很超越本分，修飾動詞「僭」→ 程度 ✓
    (B) 「甚」異之（〈桃花源記〉）：非常驚奇，修飾「異」（以之為異）→ 程度 ✓
    (C) 感「極」而悲（范仲淹〈岳陽樓記〉）：感觸到了極點 → 程度 ✓
    (D) 先帝之「殊」遇（〈出師表〉）：特殊的禮遇，「殊」修飾名詞「遇」→ 不是
    (E) 行「略」定秦地（〈鴻門宴〉）：一路攻取平定秦地，「略」是動詞 → 不是（全國 41% 誤選，把「略」當成「大略」）
chn110-03:
  key: 「哭起來固然…」對「笑起來更…」，再用「尖冷」頂真接到丁。
  explain: |
    排序步驟：
    1. 開頭「牠哭起來固然一片悽慄」，用「固然」提示後面要接「更」→ 戊「笑起來更帶給人無限尖冷」。
    2. 戊句尾「尖冷」，丁句首「尖冷到…」，頂真相接 → 戊丁。
    3. 乙交代時間（入秋以後，夜涼如水），丙寫月光（把人拋入冰河），營造冷的場景。
    4. 甲「這時貓頭鷹…的笑聲」，接結尾「就老吏斷獄那樣地凌遲著整個世間」，主語是笑聲。
    答案：戊丁乙丙甲（D）。
chn114-05:
  key: 前面舉例都是「君主想要人才，人才就出現」，所以接「人君苟欲之，斯至矣」。
  explain: |
    王安石〈材論〉先舉三例：六國合從→辯士出現；劉項並爭→謀士出現；唐太宗求治→諫臣出現。
    「此數輩者，方此數君未出之時，蓋未嘗有也」：這些人才在君主需要之前並不存在。
    所以空格要做出結論：只要君主真心想要，人才自然會來 →（A）人君苟欲之，斯至矣。
    接下來「天下之廣，人物之眾，而曰果無材可用者，吾不信也」順勢反駁「天下無才」的說法。
    (C)「錐之在囊」強調人才自己會冒出來，與前文「因君主所需而出現」的邏輯不同；(D) 批評後代在位者，與前三例的正面結論不連貫。
    這題全國答對率只有 23%，四個選項的選擇率接近，代表多數人沒有抓住「舉例→歸納結論」的論證結構。
chn113-05:
  key: 周公「謙卑不吝」→「是以」人才滿朝，因果先接；再用孔子布衣為例，末句「況…哉」反問。
  explain: |
    1. 「昔周公之相也」之後接周公的作為：丙「謙卑而不鄰（吝），以勞天下之士」。
    2. 「是以」表結果：乙「俊義（俊乂，賢才）滿朝，賢智充門」。
    3. 再舉另一例：丁「孔子無爵位，以布衣從才士七十有餘人」。
    4. 甲「皆諸侯卿相之人也」說明孔子門下都是卿相之才，最後接「況處三公之尊以養天下之士哉」：孔子無位尚且如此，何況身居高位的人？
    答案：丙乙丁甲（D）。
chn110-09:
  key: 「皆我有也」是「都歸我所有」的敘述，不是「A 就是 B」的判斷。
  explain: |
    判斷句是在說「A 是 B」。
    (A) 蔚然深秀的，是琅邪山（〈醉翁亭記〉）→ 判斷
    (B) 凡是這州有奇特姿態的山水，都已被我擁有（〈始得西山宴遊記〉）→ 是在敘述「擁有」，不是判斷 ✓
    (C) 史書是民族的精神、人群的借鏡（〈臺灣通史序〉）→ 判斷
    (D) 鄭衛桑間等，是別國的音樂（〈諫逐客書〉）→ 判斷
    提醒：不要只看「者…也」的外形，要把句子翻成白話確認意思。
chn112-06:
  key: 美女「尤所難免」→ 紇「疑懼」→ 派女奴「伺守」，三個空格要前後一致。
  explain: |
    1. 神會偷少女，「而美者尤所難免」：美的更難逃過 → 所以「宜謹護之」。「其來有自」（事出有因）接不上「宜謹護之」。
    2. 紇聽了之後「甚疑懼」，才會派兵包圍住處、把妻子藏進密室；「倨傲」與他的謹慎行動矛盾。
    3. 「以女奴十餘伺守之」：派人看守；後文「守者怠而假寐」證明是看守，不是「迎候」。
    答案：尤所難免／疑懼／伺守（D）。

chn113-11:
  key: 「對話不用引號、不分段」讓讀者像盲人一樣摸索，是書寫形式呼應主題。
  explain: |
    依據第二段：「全書對話不用引號，也未特別分段，迫使讀者放慢速度……如同盲人在缺乏指引下，須費力摸索」→ (C) ✓
    (A) 文中沒有說「不知名城市」是為了顯現疫病嚴重。
    (B) 用特徵稱呼角色是敘事特色，文中沒有說它呈現人際關係崩壞。
    (D) 末段說「我們本來就是盲目的」是體悟，不是「盲與不盲無須分辨」。
chn113-12:
  key: 「情願失明」＝眼不見為淨；染疫者彼此疑懼＝眼不見為患；兩句都有文本依據。
  explain: |
    ① 盲者「彼此疑懼、生活脫軌」→ 看不見帶來禍患（眼不見為患）；未染疫者看清人心險惡，說「你會情願失明」→ 眼不見為淨。兩者形成辯證 → 符合。
    ② 「我們本來就是『盲目』的」→ 眼盲隱喻心盲、揭示人的盲目；「看清人心險惡」「手刃施暴者」→ 呈現人性沉淪 → 符合。
    答案 (A)。全國有 42% 選 (D)，把 ① 判成「無法判斷」。
    研判題訣竅：文章不一定用同樣的字，但只要有「能對應的內容」就是符合；「無法判斷」是文章完全沒有涉及。
chn110-04:
  key: 蘆笛把「呢喃」演奏成樂音；牛羊「咀嚼」草野；植物把喧囂「收攏」成靜謐。
  explain: |
    甲：「將時光的□□演奏成樂音」——若填「歌唱」，歌唱本身就是樂音，語意重複；「呢喃」（低聲細語）經過笛心才變成樂音，較合理。
    乙：花牛和綿羊在山坡上「咀嚼」草野的空曠——牛羊吃草的動作，把空曠當成可以品嘗的東西，是轉化修辭。
    丙：植物的緘默把無盡喧囂「收攏」為深沉的靜謐——收攏有「吸納、收斂」的意思，呼應「緘默」。
    答案 (C) 呢喃／咀嚼／收攏。填詞題先找「最有把握的一格」刪去選項，再確認其他格。
chn114-03:
  key: 月光從「破海綿」滲出、滴成深淺的「青蒼」；「貧血」的城市呼應「各找各的營養」。
  explain: |
    1. 「滲出來」「滴到柏油路上」→ 能吸水又會滴落的是「破海綿」，舊報紙不會滴。
    2. 滴下來「濃一塊，淡一塊，成了深深淺淺的□□」→ 是顏色的深淺，「青蒼」（青白色）才有深淺；「皎潔」形容明亮，不能說深深淺淺。
    3. 「□□的城市。街上的人都那麼匆匆地趕路，各找各的營養」→ 缺營養的是「貧血」。
    答案 (B)。用前後文的「呼應詞」判斷，是填詞題最可靠的方法。
chn110-13:
  key: 「七香車」迎親、「宜室宜家」祝新娘 → 婚宴，題辭用「珠聯璧合」。
  explain: |
    詩句線索：「門前遙駐七香車」——七香車是華美的車，這裡指迎娶的花車；「定卜咸宜到室家」化用《詩經》「之子于歸，宜其室家」，祝福新人家庭和睦。所以是婚宴。
    (A) 珠聯璧合：賀新婚 ✓
    (B) 椿萱並茂：祝父母雙全長壽
    (C) 君子攸居：賀新居落成（全國 30% 誤選，被「室家」誤導）
    (D) 望重桑梓：稱頌在鄉里德高望重
chn110-33:
  key: 「衣焦不申，頭塵不去」＝衣服皺了、頭上的灰都沒整理，表示事情緊急。
  explain: |
    季梁聽說魏王要攻邯鄲，「中道而反」（半路折返），衣服皺了沒拉平、頭上的灰塵沒撣去，就趕去見魏王 → 凸顯事態緊急，來不及整理儀容 → (C) ✓
    焦：捲曲；申：伸展。
chn110-34:
  key: 南轅北轍：方向錯了，條件越好離目標越遠 → 緣木求魚，徒勞無功。
  explain: |
    故事：要去南方的楚國卻往北走，還說馬好、錢多、車夫好——條件越好，離楚國越遠。
    季梁用這個比喻勸魏王：想稱霸天下卻去攻打邯鄲，動作越多，離王業越遠。
    重點是「方法與目標相反」→ (C) 緣木求魚（爬樹找魚），徒勞無功 ✓
    (B) 欲速不達講的是「太急」，不是「方向錯」（全國 35% 誤選）。(A) 前車之鑑講借鑑別人的失敗；(D) 駑馬十駕講持之以恆。
chn111-07:
  key: 同一個讓手不龜裂的藥方，宋人拿來漂絲絮，客人拿去打水戰得封地。
  explain: |
    (A) 宋人世代漂洗絲絮「不過數金」，覺得賣百金很划算，不是認為它值百金 ✗
    (B) 藥的功能只有「不讓手龜裂」，用在漂絲絮只賺幾金，用在冬天水戰卻大敗越人、裂地受封 → 功能單一、效益不同 ✓
    (C) 用藥的是吳國軍隊，不是越人 ✗
    (D) 「越有難」是越國來犯，吳王派客領兵應戰，不是為了爭奪藥方 ✗
    延伸：這段出自《莊子‧逍遙遊》，莊子藉此說明「拙於用大」——同樣的東西，眼光不同，用處就不同。
chn110-38:
  key: 觥籌交錯＝宴飲熱鬧；縱橫捭闔＝外交手腕。強弩之末、絕無僅有、首鼠兩端都誤用。
  explain: |
    (A) 強弩之末：強弓射出的箭到最後已無力，比喻力量衰竭 → 不能形容致勝的絕殺 ✗
    (B) 觥籌交錯：酒杯與酒籌交錯，形容宴飲熱鬧 ✓
    (C) 縱橫捭闔：運用分化、拉攏的外交手腕；折衝樽俎：在宴席談判間制敵取勝 → 適合國際局勢 ✓
    (D) 絕無僅有：極其少有（仍然有）→ 用來否認偷竊，反而像承認發生過一次 ✗
    (E) 首鼠兩端：猶豫不決、瞻前顧後 → 不是「圓滑、誰都不得罪」✗（全國 48% 誤選）
chn112-26:
  key: 「克己復禮」「師道之不復」的復都是「回復、恢復」；「不及此」「及牆」的及都是「到」。
  explain: |
    全國答對率只有 21%，這題 C、E 各有五成以上的人誤選。
    (A) 克己「復」禮（《論語》：回復、歸於）／師道之不「復」（〈師說〉：恢復）→ 相同 ✓
    (B) 不「及」此（〈燭之武退秦師〉：到、達到）／「及」牆（〈勞山道士〉：到達）→ 相同 ✓
    (C) 蓋藏「既」富（已經）／「既」親其所親，亦親其所疏（「既…亦…」表並列：不但…也…）→ 不同
    (D) 「善」刀而藏之（《莊子》庖丁解牛：擦拭，通「繕」）／素「善」留侯張良（〈鴻門宴〉：交好）→ 不同
    (E) 「竟」不忍去湖上（〈晚遊六橋待月記〉：竟然）／何「竟」日默默在此（〈項脊軒志〉：整、終，竟日＝整天）→ 不同
chn114-11:
  key: 「心雖純正，而行事偶失，亦即是過」：君子的動機必然良善，但仍要看行事。
  explain: |
    原文：「論君子者，又不當徒論其心，心雖純正，而行事偶失，亦即是過。」
    君子「心雖純正」→ 君子行事的動機必然是良善的 → (B) ✓
    (A) 原文說行事偶有疏失「亦即是過」，重點是要認定為過錯，沒有說「不易察覺」✗（全國 24% 誤選）
    (C)(D) 文中都沒有提到。
    全文觀點：看小人要看「心」（動機），看君子要看「事」（行為）。
chn114-12:
  key: 小人也常做好事，但背後一定有所圖，所以要看動機，別被表面作為蒙蔽。
  explain: |
    原文：「小人庸多善事，其心未有無所為而為者。若徒論外事……幾不可辨矣。」
    小人也做很多好事，但動機都有目的；只看外在行為會分辨不出來 → 論小人要論其心，才不會被作為蒙蔽 → (B) ✓
    (A) 原文說小人的心「未有無所為而為者」，正好否定了心存善念 ✗
chn111-05:
  key: 不求甚解是「審美」的讀法：取得美感經驗，不靠慎思明辨的理性分析。
  explain: |
    關鍵句：讀書者取得的是「自我的美經驗」，而且「經不起……慎思明辨等等反省解釋來徒亂人意」→ 不需經由純理性的知解鍛造 → (A) ✓
    (B)「如同詩的境遇」是比喻，不是說只適用於詩歌 ✗
    (C) 原文說「借助於文字符號的撩撥」，仍然要讀懂文字 ✗
    (D) 原文強調「自我」的美經驗，不是社會公認的標準 ✗
chn110-35:
  key: 「區區之薛」「區區耳目」都是「小小的」；「碌碌」都是「平庸」。
  explain: |
    (A) 鬱乎「蒼蒼」（〈赤壁賦〉：草木茂盛深青）／兩鬢「蒼蒼」（白居易〈賣炭翁〉：灰白）→ 不同
    (B) 無「惛惛」之事（《荀子‧勸學》：專心致志）／「惛惛」如醉（神志不清）→ 不同
    (C) 「區區」之薛（〈馮諼客孟嘗君〉：小小的）／「區區」耳目之所及（小小的、有限的）→ 相同 ✓
    (D) 「施施」而行（〈始得西山宴遊記〉：音ㄧˊ ㄧˊ，緩步行走）／「施施」自得（音ㄧˊ ㄧˊ，洋洋得意）→ 不同
    (E) 吾諸兒「碌碌」（方苞〈左忠毅公軼事〉：平庸）／家居「碌碌」（平庸無奇）→ 相同 ✓
    疊字詞常見「同形異義」，一定要回到句子判斷，不能只憑字面。
chn110-12:
  key: 先引一般看法（郊寒白俗），再引鄭厚的評語，最後說出自己的觀點（哀樂之真，發乎情性）。
  explain: |
    論述三步驟：
    1. 先述習見論評：「郊寒白俗」，一般詩人都鄙薄孟郊與白居易。
    2. 再引前人說法：鄭厚說白居易如柳陰春鶯、孟郊如草根秋蟲，「皆造化中一妙」。
    3. 提出觀點：「哀樂之真，發乎情性，此詩之正理也」——真情才是寫詩的根本。
    → (C) ✓。(D)「分述各家短長」不對，文中沒有逐一評論各家的優缺點。
chn113-01:
  key: 「闥」「撻」都讀ㄊㄚˋ；〈赤壁賦〉「桂棹兮蘭槳」的棹讀ㄓㄠˋ。
  explain: |
    (A) 闥ㄊㄚˋ（門；排闥而去：推門而出）／撻ㄊㄚˋ（同聲撻伐）→ 讀音相同 ✓
    (B) 篙ㄍㄠ（撐船的竿子）／蒿ㄏㄠ（蒿目時艱：憂心時局）→ 不同
    (C) 棹ㄓㄠˋ（船槳，〈赤壁賦〉「桂棹兮蘭槳」）／踔ㄔㄨㄛˋ（踔厲奮發）→ 不同
    (D) 逡ㄑㄩㄣ（逡巡：遲疑不前）／悛ㄑㄩㄢ（為惡不悛：做壞事不肯悔改）→ 不同
chn113-02:
  key: 倒「屣」相迎、不落「窠」臼、負「笈」北上；A 完全正確。
  explain: |
    (A) 蟬聯、止步四強 → 全部正確 ✓
    (B) 倒<u>屜</u>相迎 → 應為「倒屣相迎」（屣：鞋子；急著出門迎客，把鞋子穿反）
    (C) 不落<u>巢</u>臼 → 應為「不落窠臼」（窠臼：老套、固定格式）
    (D) 負<u>趿</u>北上 → 應為「負笈北上」（笈：書箱，指外出求學）
chn112-03:
  key: 擘肌分理＝分析極為細密；來者可追、得隴望蜀都被望文生義。
  explain: |
    (A) 擘ㄅㄛˋ肌分理：剖開肌肉、分辨紋理，比喻分析事理極為細密 → 用於辦案 ✓
    (B) 愛屋及烏：愛一個人連帶愛屋上的烏鴉 → 「袒護過失」不是這個意思 ✗
    (C) 來者可追：出自《論語》「往者不可諫，來者猶可追」，指未來還來得及改正 → 誤用成「後來居上」✗
    (D) 得隴望蜀：得到隴地又想要蜀地，比喻貪得無厭 → 誤用成「進可攻」的好位置 ✗（全國 38% 誤選）
chn113-27:
  key: 「向」路／「向」時都是「從前」；「得」不焚／「得」比勁節都是「能夠」。
  explain: |
    (A) 即「當」太平（〈虯髯客傳〉：將會）／快意「當」前（在眼前）→ 不同
    (B) 便扶「向」路（〈桃花源記〉：從前的、原來的）／「向」時估帆所出入者（〈鹿港乘桴記〉：從前）→ 相同 ✓
    (C) 自戕「爾」手（你）／乃「爾」寂飲（〈勞山道士〉：如此）→ 不同
    (D) 「敢」以煩執事（〈燭之武退秦師〉：冒昧地，謙詞）／毫毛不「敢」有所近（〈鴻門宴〉：膽敢）→ 不同
    (E) 「得」不焚（〈項脊軒志〉：能夠）／「得」比勁節長垂（能夠）→ 相同 ✓
    全國答對率 26%，C、D、E 各有五成以上的人選，代表核心選文的虛詞還不夠熟。
chn113-04:
  key: 雞、鵠、山鳩、蛇螘都只有一項專長而無法通達全面 → 偏才不足以經周用。
  explain: |
    四個例子結構相同：「雞知將旦，不能究陰陽之曆數」——只懂一點，無法通達整體學問。
    總括句要說「只有單一專長，無法兼顧全面」→ (D) 偏才不足以經周用，隻長不足以濟眾短 ✓
    (C) 說小缺點不影響大才，意思相反 ✗；(A)(B) 講人才被識、官位與才能，都和例子無關。
    技巧：總括句要能「套進每一個例子」，逐一檢查。
chn111-08:
  key: 領終身廩食的，必須「沒有親屬、沒有產業」；老婦、幼童也都有條件限制。
  explain: |
    (A) 「軍興於外」是軍隊出征在外，文中沒有說軍隊劫掠 ✗
    (B) 目盲、手足殘疾，又「無妻子父兄產業者」→ 國家終身供給糧食 ✓
    (C) 七十歲以上老婦要「無夫子」、十二歲以下要「無父母兄弟」才適用，選項漏了條件 ✗（全國 25% 誤選）
    (D) 貧窮者「隨口給貸」（借糧）；九十歲以上長者是「復不事，家一人」（免除家中一人徭役來奉養），方案不同 ✗
    閱讀古代公文：先找「對象＋條件＋給付」三要素。
chn113-09:
  key: 新細明體是系統內建字型，大家順手就用，所以文字風景難以改變。
  explain: |
    關鍵句：「但只要它是系統內建的首要字型，就會是大多數人的首選。如此一來，文字風景的基本面一時難有什麼變化。」
    原因是「系統內建、取得方便」→ (B) ✓
    (A) 文中說新細明體不適合遠距與螢幕閱讀，沒有說它識讀性高 ✗
chn113-10:
  key: 新細明體適合近距離的紙本內文；黑體橫筆粗、易視性好，適合指標。
  explain: |
    (A) 第三段：新細明體「專門用在紙本」、離讀者不遠；第一段：筆畫細，不適合遠距離的指標 → ✓
    (B) 黑體適合指標是因為「橫筆夠粗、易視性好」，不是「變化不大」✗
    (C) 第二段說新細明體「難以勝任螢幕上的閱讀」✗
    (D) 學院指定報告用新細明體，不是黑體 ✗
chn112-16:
  key: 「澎湖不守…臺中難防，臺南、北亦可慮」＝要守澎湖；「臺北可誘之近岸」＝北部可誘敵登岸。
  explain: |
    ① 原文：「然澎湖不守，則敵人得之，安穩收泊……臺中難防，臺南、北亦可慮」→ 澎湖若失守，三地都危險，所以應加強澎湖防守 → 符合
    ② 原文：「臺北可誘之近岸，臺南則不可。蓋臺北港道深通而有屏蔽……若登岸，則反失所恃」→ 符合
    答案 (A)。全國 34% 選 (D)：因為原文沒有出現「加強澎湖海防」這幾個字就判成無法判斷。
    研判題要看「意思」有沒有依據，不是找一模一樣的字。
chn113-24:
  key: 崔群是陸贄的門生（陸家的「良田」），卻不讓陸贄的兒子應考 → 陸家這座莊園荒了。
  explain: |
    崔群把自己錄取的門生比喻為「良田」。妻子反問：你不也是陸贄的門生嗎？你掌考試時，卻派人叫陸贄的兒子簡禮不要參加考試。
    如果門生是良田，那麼陸家這塊田（崔群）就荒廢了——暗諷崔群受陸贄提拔，卻沒有回報恩情 → (B) ✓
    所以崔群「慚而退，累日不食」。
chn112-04:
  key: 表二看「欄」（作者）：李白那一欄中，王維列是 0 → 李白沒有寫到王維。
  explain: |
    先看懂表二：橫軸（每一欄）是作者，每一列是被寫到的人。例如「杜甫」欄、「李白」列是 13 → 杜甫有 13 首詩寫到李白。
    (A) 159 是王維自己寫詩問候的親友人數，與別人認不認識王維無關 ✗
    (B) 王昌齡 104 人、114 首，只能算出平均，不能推論「每人至多兩首」✗
    (C) 杜甫欄：寫孟浩然 2 首、寫王維 3 首 → 與王維較熟，選項說反了 ✗
