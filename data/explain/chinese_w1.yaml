chn112-g31:
  passage: |
    【框】<b>甲</b>　菊花開，正歸來。伴虎溪僧鶴林友龍山客，似杜工部陶淵明李太白，有洞庭柑東陽酒西湖蟹。哎！楚三閭休怪。（〔元〕馬致遠〈撥不斷〉）
    【框】<b>乙</b>　長醉後妨何礙？不醒時有甚思？糟醃兩個功名字，醅渰千古興亡事，麴埋萬丈虹霓志。不達時皆笑屈原非，但知音盡說陶潛是。（〔元〕白樸〈寄生草〉）<br><span class="small">醅：沒過濾的酒。渰：同「淹」，淹沒。</span>
    【框】<b>丙</b>　屈原已經成為一個符號和象徵。
    漢代，屈原的爭議主要落於「怨君」。儒家對情感表達的理想是「樂而不淫，哀而不傷」。肯定屈原的人以注解儒家經書的方式注《楚辭》，試圖建立其經典地位，認為屈原和《詩經》一樣「怨誹而不亂」，可與日月爭光。批評屈原的人認為屈原在〈離騷〉有著歌淚式的表達，甚至悲壯付出生命，與儒家中庸之道產生劇烈拉鋸。
    宋朝遭外族侵門踏戶，激發民族情感。《楚辭》讀者對屈原情感表現的理解，不同於漢代只從忠君脈絡詮釋，轉而強調其愛國之心，以國家民族興亡的高度，將「當怨與否」的倫理內涵重新審視，由此確立屈原情感的正當性。
    明代黃文煥因蒙冤下獄，對屈原不被理解的痛苦感同身受。在獄中著《楚辭聽直》，為屈原的忠義之心辯護，希望有人也能替他昭雪冤屈。
    屈原之於現代讀者的意義，與社會文化語境相關，面對抗戰，屈原愛國的面向被重新加強。隨著端午節被確立為詩人節，學者開始思考「詩人何為」，從中探討文學與政治的關係。當個人理想遭遇挫折，就像屈原不被楚王了解，這時該不該執著？可藉由屈原「舉世皆濁我獨清」的心緒，思考理想和世界的衝突。（改寫自徐平〈一個屈原，各自表述—政大廖棟樑揭開屈原的百變面紗〉）
chn112-31:
  key: 甲曲寫閒居之樂、乙曲藉酒埋志，兩首都用陶潛對比屈原，表達自己的選擇。
  explain: |
    (A) 「菊花開，正歸來」寫秋天歸隱（呼應陶淵明愛菊），不是在說時代太平 ✗
    (B) 功名、興亡、壯志都被酒「醃、淹、埋」→ 把「一醉泯滅萬事」具體化 ✓
    (C) 甲曲有柑、酒、蟹與方外之友，閒適自在；乙曲「長醉後妨何礙？不醒時有甚思？」表面放達，實則壯志被埋，醉醒之間有矛盾 ✓
    (D) 甲曲「楚三閭休怪」是請屈原不要責怪自己的選擇，不是嘲諷他的結局；兩首也不是滑稽玩世 ✗
    (E) 甲曲自比陶淵明而請屈原「休怪」；乙曲「皆笑屈原非，盡說陶潛是」→ 都以陶潛對比屈原，說明自己傾向歸隱 ✓
    補充：原卷中曲文有部分字體較小，是元曲的「襯字」，不影響本題作答。
