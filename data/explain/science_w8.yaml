# ---------- Day 50：地質與地球歷史、近代物理與基本交互作用、原子結構與週期表 ----------
sci113-50:
  key: Fe²⁺ 被藍綠菌產生的氧「氧化」成不溶的氧化鐵而沉澱；24～35 億年前氧氣大多被鐵消耗掉，所以大氣含氧量要到之後才大增。
  explain: |
    (B) 圖中 24～35 億年前大量形成縞狀鐵礦時，大氣氧氣含量仍很低（約 $10^{-5}$ 以下），之後才急遽上升 ✓
    (C) 氧化鐵不溶於水，所以能在海中沉澱 ✓
    (E) 19 億年前又出現縞狀鐵礦，表示當時海底岩漿噴發使海中 Fe²⁺ 濃度大幅上升，再和氧作用沉澱 ✓
    (D) 氧化鐵是由金屬離子和氧離子組成的離子化合物，不是分子化合物（全國 38% 誤選）✗
    (A) Fe²⁺ 變成 Fe³⁺（Fe₂O₃）是失去電子，屬於「氧化」反應（全國 34% 誤選）✗
sci113-52:
  key: 縞狀鐵礦集中在 24 億年前以前；它是在海中沉澱形成的沉積岩；細菌在 35 億年前氧氣極少的環境就已存在。
  explain: |
    (A) 圖中縞狀鐵礦的相對含量大多在 24 億年前以前 ✓
    (C) 今日海水含氧多，Fe²⁺ 一出現就被氧化沉澱，濃度比 25 億年前低得多 ✓
    (E) 細菌的化石紀錄從 35 億年前就有，當時氧氣含量極低 ✓
    (B) Fe²⁺ 雖然來自岩漿，但鐵礦是在海中沉澱堆積而成，屬於沉積岩（全國 39% 誤選）✗
    (D) 氧氣含量是階段性急遽上升，不是線性增加（全國 22% 誤選）✗
sci110-15:
  key: 電子通過雙狹縫出現干涉條紋，證明電子有波動性；速度不同 → 物質波波長不同 → 條紋間距改變。
  explain: |
    (D) 電子的物質波波長和速度有關（速度越大、波長越短），波長改變，干涉條紋的間距就跟著改變 ✓
    (C) 干涉是波的性質，這個實驗闡釋的是電子的「波動性」（全國 25% 誤選）✗
    (B) 干涉條紋來自電子的波動性，不是電子之間的靜電力；一次只送一個電子也會出現條紋（全國 19% 誤選）✗
    (A) 亮帶、暗帶反映的是電子落在該處的機率，不是速率大小（全國 13% 誤選）✗
    (E) 出現干涉條紋時，無法確定每個電子通過哪一個狹縫 ✗
sci110-08:
  key: 平均原子量 10.81 不是整數 → 有同位素；硼有 3 個價電子，BH₃ 的硼周圍只有 6 個電子 → 不符合八隅體。
  explain: |
    (D) 硼有 3 個價電子，和 3 個 H 各共用一對電子，周圍只有 6 個電子，不滿 8 個 ✓
    (A) 平均原子量 10.81 不是整數，表示有同位素（¹⁰B、¹¹B）✗
    (B) 中子數＝質量數－5，¹⁰B 有 5 個、¹¹B 有 6 個，不是固定 5 個（全國 23% 誤選）✗
    (C) 電子排列 2、3，價電子數是 3 ✗
    (E) NH₄BF₄ 由 NH₄⁺ 和 BF₄⁻ 組成，是離子化合物（全國 18% 誤選）✗
sci113-40:
  key: 水從內層流入外層：外層細胞膨脹、膨壓變大，內層細胞收縮、膨壓變小 → 葉片向內彎曲閉合。
  explain: |
    植物細胞吸水膨脹時，細胞膜會更用力地壓向細胞壁（膨壓變大）；失水時則變小。
    (B) 外層細胞得到水、膨壓變大；內層細胞失水、膨壓變小 ✓
    (A) 方向相反（全國 12% 誤選）✗
    (C)(D)(E) 葉片要彎曲，內外兩層的變化必須相反 ✗
sci113-42:
  key: 累積電量達 14 μC，水分就由內層快速流入外層使葉片閉合；反過來由外層流回內層，葉片就張開。
  explain: |
    (C) 充電電量達到 14 μC 時，葉片約 0.5 秒內閉合 → 水分快速由內層流入外層 ✓
    (D) 閉合是因為水由內流向外；反向流動就會讓葉片張開 ✓
    (B) 第一次觸發後葉片不會閉合、要第二次才閉合，可見每次觸發的電量小於 14 μC（全國 39% 誤選）✗
    (A) 記憶初次觸發靠的是累積電量，不是葉片的彈力（全國 10% 誤選）✗
    (E) pH 大於 4.5 時，即使產生電位葉片也無法閉合，不是需要更高電量（全國 9% 誤選）✗

# ---------- Day 51：天文、電磁學、化學與生活、環境 ----------
sci113-54:
  key: 大氣只讓可見光和無線電波順利通過；要觀測其他波段，必須到 20 世紀中期以後把望遠鏡送上太空。
  explain: |
    (C) 無線電波和可見光一樣，幾乎可以不受阻礙穿過大氣層，地面就能觀測 ✓
    (D) X 光、紫外線、大部分紅外線被大氣吸收，只能在太空中觀測，太空時代（20 世紀中期）以後才可能 ✓
    (A) 科學家早就知道天體會發出各種電磁波，只是在地面接收不到（全國 32% 誤選）✗
    (E) 和手機、基地台無關（全國 32% 誤選）✗
    (B) 高能量電磁波可以傳遞很遠，只是被地球大氣吸收（全國 22% 誤選）✗
sci113-55:
  key: 望遠鏡口徑越大，收集的光越多，就能看到更暗（星等數值更大）的天體，也提高解析能力。
  explain: |
    (C) 集光面積和口徑平方成正比，口徑大能收集更多光，看到更暗的天體 ✓
    (B) 大氣擾動來自地球大氣本身，口徑變大並不能減少它的影響（全國 28% 誤選）✗
    (A)(E) 光的路徑、天體的大小都和望遠鏡口徑無關 ✗
    (D) 這不是科學上的原因 ✗
sci110-31:
  key: 通電螺線管像一根磁棒：兩端是 N、S 極，管內磁場近乎均勻、最強，方向用安培右手定則判斷。
  explain: |
    (C) 螺線管兩端相當於磁鐵的 N 極與 S 極 ✓
    (E) 四指順著電流方向彎曲，大拇指指向管內磁場方向（安培右手定則）✓
    (A) 管內磁場最強，管外很弱（全國 10% 誤選）✗
    (B) 管內中心處的磁場不為零，反而近乎均勻（全國 16% 誤選）✗
    (D) 管內磁場和電流成正比 ✗
sci110-32:
  key: N 極朝下靠近 → 向下的磁通量增加 → 感應電流要產生向上的磁場；電流變大表示感應電流和原電流同向 → 原來的磁場向上。
  explain: |
    (B) 磁鐵 N 極朝下接近，管內向下的磁通量增加；依冷次定律，感應電流產生向上的磁場來反抗。導線電流變大，表示感應電流和原電流同方向，所以原電流產生的磁場就是向上 ✓
    (A) 原來的磁場是向上，不是向下（全國 36% 誤選）✗
    管內磁場的強弱，大考中心公布 (C)、(D) 都算對：
    (D) 只看螺線管電流的磁場：電流增大，向上的磁場增強，方向不變。
    (C) 把磁鐵的磁場一起算：磁鐵向下的磁場越來越強，感應電流只能減緩、不能抵銷這個變化，所以合磁場向上的部分會變弱。
    所以官方答案是 BD 或 BC。
sci110-10:
  key: 石英砂是 SiO₂：不溶於水，矽是半導體工業的關鍵元素，氧是人體不可缺少的成分。
  explain: |
    (A) 石英砂（SiO₂）：矽是半導體材料，氧是人體必需 ✓
    (D) 氧化鐵（Fe₂O₃）：鐵、氧都是人體需要的，但都不是半導體元素（全國 22% 誤選）✗
    (C) 氯化鈣易溶於水（全國 18% 誤選）✗
    (B) 硫化鉛：鉛對人體有害（全國 8% 誤選）✗
    (E) 大理石（CaCO₃）：鈣是人體需要的，但沒有半導體元素 ✗

# ---------- Day 52：代謝與能量、天文、近代物理與基本交互作用 ----------
sci110-01:
  key: CO 和血紅素的結合力比 O₂ 強很多，搶走血紅素 → 血液運氧不足；高壓氧能把 CO 擠下來。
  explain: |
    (A) CO 與 O₂ 競爭血紅素，使血液無法運送足夠的氧 ✓；高壓氧提高血中 O₂，讓 O₂ 重新和血紅素結合
    (B) CO 中毒的主因是血液缺氧，不是和電子傳遞鏈搶電子（全國 6% 誤選）✗
    (C) CO 不會阻斷神經到肌肉的傳導 ✗
    (D) CO 不是抑制糖解作用的酵素 ✗
    (E) CO 和 CO₂ 的排除無關，也不會造成酸中毒 ✗
sci110-12:
  key: 宇宙由熱到冷：先有自由的電子和質子 → 冷卻後結合成氫原子 → 氣體聚集才形成恆星。
  explain: |
    大霹靂後宇宙溫度很高，電子和質子無法結合（甲）；溫度降低後，電子被質子捕獲形成氫原子（乙）；之後物質因重力聚集，才形成恆星（丙）。
    (A) 甲乙丙 ✓
    (E) 甲丙乙（全國 12% 誤選）：恆星由氫氣聚集形成，一定在氫原子出現之後。
sci110-33:
  key: 原子彈、核電廠都利用鈾-235 核分裂放出能量；太陽靠核融合發光，損失的質量轉成能量，所以質量變小。
  explain: |
    (B) 原子彈（不受控）和核電廠（受控的連鎖反應）都靠核分裂 ✓
    (C) 鈾-235 吸收中子後分裂，放出能量 ✓
    (E) 核融合依 $E=mc^2$ 把質量轉成能量，太陽發光越久，質量越小 ✓
    (A) 核分裂放出的是能量、中子和分裂產物；夸克被強力束縛在質子、中子內，不會單獨放出（全國 33% 誤選）✗
    (D) 太陽能板是把「光能」轉成電能（光電效應），不是核能（全國 17% 誤選）✗
sci110-27:
  key: $\mathrm{C_2H_4+H_2\to C_2H_6}$，反應後總莫耳數＝原本 H₂ 的莫耳數＝5；$28x+2\times5=94$ ⇒ 乙烯 $x=3$ 莫耳。
  explain: |
    設乙烯 x 莫耳、氫氣 y 莫耳：$28x+2y=94$。
    每 1 莫耳乙烯消耗 1 莫耳氫氣、生成 1 莫耳乙烷 → 反應後有乙烷 x 莫耳、剩下氫氣 $y-x$ 莫耳，總共 $x+(y-x)=y=5$ 莫耳。
    代回：$28x+10=94$ ⇒ $x=3$。
    (C) 原混合氣體含乙烯 3 莫耳 ✓
    (D) 氫氣 5 莫耳用掉 3 莫耳，還剩 2 莫耳 ✓（全國 25% 漏選）
    (B) 氫氣是 5 莫耳，不是 3 莫耳（全國 27% 誤選）✗
    (E) 生成的乙烷是 3 莫耳（全國 21% 誤選）✗
    (A) 反應前 8 莫耳、反應後 5 莫耳，分子數變少（全國 13% 誤選）✗
sci110-25:
  key: 不需要運輸蛋白、也不耗 ATP → 簡單擴散：O₂ 和脂溶性的脂肪酸可以直接穿過細胞膜的磷脂質。
  explain: |
    (B) 氧氣是小分子，依濃度差直接擴散通過細胞膜 ✓
    (D) 脂肪酸是脂溶性分子，可以直接擴散進入小腸上皮細胞 ✓
    (A) 根從土壤吸收無機鹽，多半要逆濃度差，靠運輸蛋白並消耗 ATP（主動運輸）（全國 34% 誤選）✗
    (C) 白血球吞噬細菌是胞吞作用，要消耗 ATP（全國 30% 誤選）✗
    (E) 腎小管再吸收葡萄糖需要運輸蛋白（全國 13% 誤選）✗

# ---------- Day 53：地質與地球歷史、波動與光、化學與生活、環境 ----------
sci110-16:
  key: 由圖讀出 P 波 5 km/s、S 波 3 km/s；每公里時間差 $\dfrac13-\dfrac15=\dfrac{2}{15}$ 秒 → 差 8 秒＝60 公里。
  explain: |
    讀圖：P 波 100 公里走 20 秒 → 5 km/s；S 波 90 公里走 30 秒 → 3 km/s。
    距離 d 公里時，時間差 $=\dfrac{d}{3}-\dfrac{d}{5}=\dfrac{2d}{15}=8$ ⇒ $d=60$ 公里
    也可以直接在圖上找兩線垂直距離為 8 秒的位置：60 公里處 S 波 20 秒、P 波 12 秒。
    (C) 60 ✓
    (B) 50（全國 14% 誤選）：50 公里處兩波只差約 6.7 秒。
sci110-34:
  key: 車往 b 開：b 聽到聲源接近 → 頻率變高；a 聽到聲源遠離 → 變低；c、d 在垂直方向，沒有接近或遠離 → 頻率不變。
  explain: |
    聲音在車經過 O 點的瞬間發出，車速沿 ab 方向。
    b：聲源朝自己移動 → $f_b>f_0$；a：聲源遠離 → $f_a<f_0$；c、d：在和速度垂直的方向，沒有接近或遠離 → $f_c=f_d=f_0$。
    (C) $f_c=f_d$ ✓
    (E) $f_b>f_0>f_a$ ✓（全國 48% 漏選）
    (A) $f_a<f_0=f_c$（全國 33% 誤選）✗
    (B) $f_a<f_d$ ✗　(D) $f_a<f_c$ ✗
sci110-28:
  key: 紫色染料隨水分開成紅、藍兩圈 → 至少含兩種成分；分開的原因是各成分和濾紙的附著力（與在水中的溶解度）不同。
  explain: |
    (C) 一種顏色分成紅、藍兩種，表示紫色染料是混合物，至少有兩種成分 ✓
    (D) 跑得比較遠的成分和濾紙的附著力較弱，因此形成不同半徑的同心圓 ✓
    (A) 紅色、藍色環也可能再含有好幾種成分，這個實驗無法確定它們是純物質（全國 13% 誤選）✗
    (B) 移動距離和附著力、溶解度有關，無法由此判斷分子量（全國 15% 誤選）✗
    (E) 層析是物理分離，染料沒有和水反應 ✗
sci110-29:
  key: 生命現象的特徵：能合成複雜分子、維持內部恆定（代謝），以及能繁殖產生相同的個體。
  explain: |
    (C) 合成特殊分子構成複雜構造、維持內部環境穩定 → 代謝與恆定 ✓
    (D) 分裂成兩個機能相同的個體 → 單細胞生物的繁殖 ✓
    (A) 體積小不代表是生物，灰塵也很小（全國 26% 誤選）✗
    (B) 吸水使體積變大是物理變化，海綿也會（全國 18% 誤選）✗
    (E) 聚在一起不代表有生命（全國 17% 誤選）✗
sci110-17:
  key: 深海：溫度隨深度先急降後幾乎不變，壓力一路增加；聲速先因降溫而變慢，深處再因壓力變大而變快。
  explain: |
    (E) 聲速：表層到溫躍層因溫度急降而變慢，到某個深度最小；更深處溫度幾乎不變、壓力持續增加，聲速又逐漸變快 ✓
    (A) 海水溫度隨深度降低，圖中卻是先增加 ✗
    (B) 深層海水的鹽度大致均勻，不會像圖中那樣一路增加（全國 33% 誤選）✗
    (C) 壓力隨深度一直增加，圖中卻先減少 ✗
    (D) 海水密度隨深度增加，圖中卻是減少（全國 17% 誤選）✗

# ---------- Day 54：力學與運動、化學與生活、環境、遺傳 ----------
sci110-55:
  key: $g=\dfrac{GM}{R^2}$，$M=\rho\cdot\dfrac43\pi R^3$ ⇒ $g\propto\rho R$；$0.10\times10=1.0$ 倍。
  explain: |
    表面重力加速度 $g=\dfrac{GM}{R^2}=\dfrac{G}{R^2}\cdot\rho\cdot\dfrac43\pi R^3=\dfrac43\pi G\rho R$，所以 $g$ 和 $\rho R$ 成正比。
    $\dfrac{g'}{g}=0.10\times10=1.0$ (C) ✓
    (A) 0.010（全國 18% 誤選）：把半徑的平方放在分子算錯方向。
    (B) 0.10（全國 15% 誤選）：只考慮了密度，忘了半徑。
sci110-48:
  key: 放電時 MnO₂ 和 NH₄Cl 被消耗，所以新電池含量較多；Zn²⁺ 在負極生成、在正極消耗，莫耳數不變。
  explain: |
    (A) 正極反應消耗 NH₄Cl → 新電池的 NH₄Cl 比廢電池多 ✓
    (C) 正極反應消耗 MnO₂ → 新電池的 MnO₂ 比廢電池多 ✓
    (E) 濾渣是不溶於水的 MnO₂、碳粉、Mn₂O₃；在空氣中加熱，碳粉燒成 CO₂，Mn₂O₃ 氧化成 MnO₂，就能回收 ✓
    (B) Zn²⁺ 在正極轉成 Zn(NH₃)₂Cl₂，ZnCl₂ 不會因放電而增加（全國 44% 誤選）✗
    (D) 每轉移 2 個電子，負極生成 1 個 Zn²⁺、正極消耗 1 個 Zn²⁺，鋅離子總莫耳數不變（全國 46% 誤選）✗
sci110-42:
  key: 紅綠色盲是 X 染色體上的性聯遺傳；孟德爾假設每種性狀由一對遺傳因子控制。
  explain: |
    (A) 紅綠色盲基因在 X 染色體上，屬性聯遺傳 ✓
    (D) 孟德爾認為每一性狀由成對的遺傳因子決定 ✓
    (B) ABO 血型由一個基因的三種對偶基因（$I^A$、$I^B$、$i$）決定，是複對偶基因，不是多基因遺傳（全國 30% 誤選）✗
    (C) 真核細胞的轉錄在細胞核內進行，核糖體是轉譯的場所（全國 16% 誤選）✗
    (E) 同源染色體聯會發生在減數分裂，不是有絲分裂（全國 13% 誤選）✗
sci110-18:
  key: 均變說：「現在是了解過去的鑰匙」，過去和現在的地質作用原理相同。
  explain: |
    (E) 均變說認為古今地質作用的原理相同，可以用現在的作用推論過去 ✓
    (C) 放射性元素定年得到的是「絕對」地質年代；相對年代是用疊置定律、截切關係、化石來判斷（全國 40% 誤選）✗
    (B) 岩脈比被它切過的地層新，依據的是「截切定律」，不是疊置定律（全國 26% 誤選）✗
    (D) 經過 2 個半衰期，母元素剩原來的 $\dfrac14$ ✗
    (A) 古生代還沒有人類 ✗
sci110-56:
  key: 轉移軌道的半長軸 $a\approx\dfrac{1+1.53}{2}\approx1.26$ AU；只飛半圈，時間 $=\dfrac12\times1.26^{3/2}$ 年 $\approx0.71$ 年 $\approx260$ 天。
  explain: |
    火星週期 1.9 年，由克卜勒第三定律 $a^3\propto T^2$：火星軌道半徑 $=1.9^{2/3}\approx1.53$ AU。
    太空船軌道的近日點在地球軌道（A，1 AU），遠日點在火星軌道（C，1.53 AU）→ 半長軸 $a=\dfrac{1+1.53}{2}\approx1.26$ AU。
    完整週期 $=1.26^{3/2}\approx1.41$ 年；從 A 到 C 只走半圈 → 約 0.71 年 ≈ 260 天 (D) ✓
    (C) 300 天（全國 21% 誤選）(B) 360 天（全國 19% 誤選）：週期或半長軸估算錯誤。

# ---------- Day 55：物質結構與鍵結、遺傳、大氣與氣象 ----------
sci110-49:
  key: H₃BNH₃ 和乙烷一樣：B、N 各和 3 個 H 及彼此以單鍵相連，每個原子周圍 8 個電子、沒有孤對電子。
  explain: |
    H₃BNH₃ 的價電子數＝3＋5＋6×1＝14，和乙烷（C₂H₆）相同，結構也相同：B、N 之間一個單鍵，各自再接 3 個 H。
    (B) 有一個 B－N 單鍵 ✓
    (C) B 和 N 周圍都有 4 對共用電子，符合八隅體 ✓
    (E) 類似金剛石的結構中，每個原子都和 4 個原子以共價鍵相連，B、N 交替排列 → 每個 N 連 4 個 B，每個 B 連 4 個 N ✓
    (A) N 原本的孤對電子用來和 B 形成鍵結，分子中沒有孤對電子（全國 37% 誤選）✗
    (D) 類似石墨時，每一層是 B、N 交替排列的六角形網狀，不是硼和硼、氮和氮各自相連（全國 48% 誤選）✗
sci110-43:
  key: BrdU 和腺嘌呤配對 → 取代胸腺嘧啶（T）；DNA 半保留複製 → 加入 BrdU 後複製一次，每個 DNA 只有新合成的那一股含 BrdU。
  explain: |
    甲：題目說 BrdU 是核苷酸，核苷酸由五碳糖、含氮鹼基與磷酸組成 → 正確
    乙：DNA 複製發生在細胞週期的間期，不是染色體排列在中央的分裂中期 → 錯誤
    丙：DNA 中和腺嘌呤（A）配對的是胸腺嘧啶（T），尿嘧啶只在 RNA 中 → 錯誤
    丁：半保留複製，每個子代 DNA 都是一股舊鏈（不含 BrdU）加一股新鏈（含 BrdU）→ 正確
    (D) 甲、丁 ✓
    (A) 甲、乙（全國 22% 誤選）(E) 甲、丙（全國 18% 誤選）✗
sci110-19:
  key: 海上和高空摩擦力小，風幾乎平行等壓線吹（地轉風），背風而立高壓在右的規則才準；陸地摩擦大，風向偏轉多。
  explain: |
    白貝羅定律成立的前提是風大致沿著等壓線吹（氣壓梯度力與科氏力平衡）。
    (B) 海上、高空的摩擦力小，風向不太偏離等壓線，定律比較準 ✓；陸地上地形和建物造成的摩擦大，風會斜穿等壓線吹向低壓，就不準了。
    (C) 陸地上風速較慢是因為摩擦大，不是氣壓梯度力較小（全國 19% 誤選）✗
    (A)(D)(E) 都和定律的物理原理無關 ✗
sci110-57:
  key: 力學能＝動能＋位能（重力位能、彈力位能）；隕石墜落、彈簧振盪、水力發電都有位能和動能之間的轉換。
  explain: |
    (A) 隕石墜落：重力位能轉成動能 ✓
    (B) 彈簧振盪：彈力位能和動能互相轉換 ✓
    (E) 水力發電：水的重力位能轉成動能，再推動發電機轉成電能 ✓
    (D) 太陽能發電是光能直接轉成電能（全國 31% 誤選）✗
    (C) 燃燒煤是化學能轉成熱能（全國 23% 誤選）✗
sci110-53:
  key: C₆₀ 和石墨都只由碳組成，是同素異形體；H₂@C₆₀ 有固定的組成，是純物質，H₂ 只是被關在籠子裡，沒有和碳鍵結。
  explain: |
    (A) C₆₀、石墨、金剛石都是碳元素的不同形態 → 同素異形體 ✓
    (B) 每個 H₂@C₆₀ 都是一個 C₆₀ 包著一個 H₂，組成固定 → 純物質 ✓
    (C) H₂O@C₆₀ 也是組成固定的純物質，不是混合物（全國 52% 誤選）✗
    (D) H₂ 只是被封閉在 C₆₀ 裡，氫和碳之間沒有共價鍵（全國 27% 誤選）✗
    (E) HF 被封在 C₆₀ 內、與外界隔絕，不能和氫氧化鈉接觸反應（全國 15% 誤選）✗

# ---------- Day 56：演化與分類、天文、力學與運動 ----------
sci110-44:
  key: 天擇：有利的性狀在後代中比例提高；達爾文提出天擇說時，還不知道孟德爾的遺傳定律。
  explain: |
    (A) 競爭力強的個體存活、繁殖較多，這些性狀在族群中的頻率提高 ✓
    (B) 孟德爾的論文發表後長期未受重視，達爾文提出天擇說時並沒有參考 ✓（全國 59% 漏選）
    (D) 突變是隨機發生的，不會因為資源有限就「為了提高優勢」而產生（全國 44% 誤選）✗
    (C) 「用進廢退、後天獲得的性狀可以遺傳」是拉馬克的說法（全國 25% 誤選）✗
    (E) 特有種是同一祖先在隔離的環境中演化出來的，不是不同始祖（全國 14% 誤選）✗
sci110-20:
  key: 在北半球看北極星的仰角，等於當地的緯度 → 北緯 35°。
  explain: |
    北極星幾乎在地球自轉軸的延長線上，觀察者看到北極星的仰角＝當地緯度。
    (B) 35 ✓
    (C) 23.5（全國 19% 誤選）：是地軸傾角（$90^\circ-66.5^\circ$），和船的位置無關。
sci110-58:
  key: 終端速率時 $kv_t^2=mg$ ⇒ $v_t=\sqrt{\dfrac{mg}{k}}$；開傘後截面積變大、k 變大 → 終端速率變小。
  explain: |
    達到終端速率時阻力等於重力：$kv_t^2=mg$ ⇒ $v_t=\sqrt{\dfrac{mg}{k}}$。
    打開降落傘，截面積變大 → k 變大 → 終端速率變小 → $v_1>v_2$ (B) ✓
    從熱氣球跳下時初速 $v_0$ 很小，之後加速到 $v_1$，所以 $v_0<v_1$；開傘後的 $v_2$ 也要讓人安全落地，比 $v_0$ 大或小無法確定。
    (C) $v_0>v_2$（全國 10% 誤選）(D) $v_2>v_1$（全國 10% 誤選）✗
sci110-59:
  key: 多帶重物 → m 變大 → 同樣的 k 下終端速率變大：$v_3>v_1$、$v_4>v_2$；又開傘前比開傘後快：$v_3>v_1>v_2$。
  explain: |
    $v_t=\sqrt{\dfrac{mg}{k}}$：重物體積很小，k 不變，m 變大 → 終端速率變大。
    (C) 開傘後：$v_4>v_2$ ✓
    (D) $v_3>v_1$，而 $v_1>v_2$，所以 $v_3>v_2$ ✓
    (A) 開傘前多了重物，$v_3>v_1$，不是 $v_1>v_3$（全國 16% 誤選）✗
    (B) 開傘後 k 變大，$v_4<v_3$（全國 19% 誤選）✗
    (E) m 不同，$v_4\ne v_2$（全國 27% 誤選）✗
sci110-54:
  key: 已知天文、地質現象都不會產生 PH₃ → 金星的 PH₃ 可能來自微生物，或來自目前還不知道的化學反應；PH₃ 易氧化成磷的含氧酸。
  explain: |
    (A) 地球上的 PH₃ 都來自微生物，金星又沒有已知的非生物來源 → 金星可能有微生物 ✓
    (D) PH₃ 被氧化後，磷會和氧結合，產物可能是磷的含氧酸（如磷酸）✓
    (E) 也可能是目前還不知道的化學反應產生的 ✓
    (C) 「已知」的現象不會產生 PH₃，不代表沒有生物就一定不會產生（全國 49% 誤選）✗
    (B) PH₃ 容易被氧化，在地球上也一樣（全國 19% 誤選）✗

