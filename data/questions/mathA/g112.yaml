    說明：第7 題至第12 題，每題5 分。
    7. 某公司有甲、乙兩新進員工，兩人同時間入職且起薪相同。公司承諾給甲、乙兩
    員工調薪的方式如下：
    甲：工作滿3 個月，下個月開始月薪增加200 元；以後再每滿3 個月皆依此方式
    調薪。
    乙：工作滿12 個月，下個月開始月薪增加1000 元；以後再每滿12 個月皆依此
    方式調薪。
    根據以上敘述，試選出正確的選項。
    (1) 甲工作滿8 個月後，第9 個月的月薪比第1 個月的月薪增加600 元
    (2) 工作滿一年後，第13 個月甲的月薪比乙的月薪高
    (3) 工作滿18 個月後，第19 個月甲的月薪比乙的月薪高
    (4) 工作滿18 個月時，甲總共領到的薪水比乙總共領到的薪水少
    (5) 工作滿兩年後，在第3 年的12 個月中，恰有3 個月甲的月薪比乙的月薪高
