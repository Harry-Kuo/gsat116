    或所有選項均未作答者，該題以零分計算。

    8. 有一個遊戲的規則如下：丟三顆公正骰子，若所得的點數恰滿足下列（A）或
    （B）兩個條件之一，可得到獎金100 元；若兩個條件都滿足，則共得200 元
    獎金；若兩個條件都不滿足，則無獎金。
    （A）三個點數皆為奇數或者皆為偶數
    （B）三個點數由小排到大為等差數列
    若已知有兩顆骰子的點數分別為1,3，且所得獎金為100 元，則未知的骰子點
    數可能為何？
