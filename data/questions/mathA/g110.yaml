    例如：實際數字6 被看成6、8、9 的機率分別為0.4、0.3、0.2，而被看成其他
    數字的機率是0.1。根據上述實驗結果，試選出正確的選項。
    (1) 如果實際數字是8，則至少有一半的可能性會被看成是8
    (2) 如果實際數字是6，則有六成的可能性會被看成不是6
    (3) 在6、8、9 三數字中，被誤認的可能性以9 最低
    (4) 如果被看成的數字是6，則實際上就是6 的可能性不到一半
    (5) 如果被看成的數字是9，則實際上就是9 的可能性超過2
