    4. 某網遊有16 種材料，其中6 種為基本材料，10 種為進階材料。任選3 種不同材料可以
    合成出草藥、食物、藥水中的1 類道具，其合成規則如下：若3 種材料均為基本材料，
    則合成結果必為同一種草藥；若3 種材料中2 種為基本材料、1 種為進階材料，則合成
    結果會根據不同的進階材料得到不同種的食物，但不會受到基本材料不同而改變；其他
    的組合都會合成出不同種的藥水。試問此網遊總共可合成出多少種道具？
    (1) 256
    (2) 370
    (3) 401
    (4) 455
    (5) 560
