- id: soc111-g61
  range:
  - 61
  - 64
  intro: 閱讀下文，回答61-64題。
  image: img/social/111-g61.webp
  passage: |-
    61-64 為題組
    ◎ 日治時期，臺灣總督府為開發山林資源，拓殖其經濟利益，初期認為山林中的
    「蕃人」是阻礙開發的「凶惡之徒」，不但不承認其傳統權益，甚至用武力征
    伐；後期又進行大規模「集團移住」計畫，迫使各原住民部落離開其傳統生活
    空間，遷移到山腳地帶。部落間原有的往來因此被切斷，重新配置的部落也無
    法和其他部落建立合作關係，以致內部社會關係瓦解，達到總督府期待的可使
    原住民「舊來勢力關係中斷」。以立霧溪流域的太魯閣族群來說，集團移住的
    結果，不僅部落被撤離原居住地，且多數部落遭到分割，還有許多部落被嵌入
    布農族的傳統領域，造成賽德克族、太魯閣族及布農族混居的情況。請問：
- id: soc111-g65
  range:
  - 65
  - 67
  intro: 閱讀下文，回答65-67題。
  image: img/social/111-g65.webp
  passage: |-
    65-67 為題組
    ◎ 猶太教與基督教的信仰屬性，及其對「神的選民」的看法略有異同，以致二者常
    有紛爭。西元一世紀，猶太宗
    教領袖在耶路撒冷以基督教傳
    道者保羅褻瀆猶太教，且無法
    證明自己清白為由，控告保羅
    並要求對其處刑。當時羅馬法
    律規定：非經審判，羅馬公民
    不得被捆綁、監禁或鞭打。保
    羅因具有羅馬公民身分，故要
    求交羅馬當局處理，於是當地
    總督在夏季末期，將保羅押送
    至羅馬審判。圖12 為羅馬帝國
    時期東地中海的航運路線圖，
    虛線為押送保羅航線，實線為
    地中海貿易線。請問：
    亞歷山大
    克里特島
    羅馬
    耶
    路
    撒
    冷
    圖12
