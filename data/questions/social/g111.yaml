    23-25 為題組
    ◎ 美雲是單身職業婦女，獨力照顧同住的年邁母親，其餘兄弟並未分擔。近來母親
    失智情況惡化，她猶豫是否辭去工作照顧或聘請全天看護，但二者皆可能帶來身
    心與經濟壓力。美雲的困境反映我國因人口日趨老化，家屬照顧年長者的負擔也
    日益加重。因應上述問題，晚近政府積極改善長期照顧制度，例如：（甲）廣設
    日間照顧中心；（乙）改善外國籍家庭看護工引進政策；（丙）建立全國長照人
    員證照制度；（丁）提供直接補助給需要長照的家庭。請問：
