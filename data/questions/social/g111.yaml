    51-52 為題組
    ◎ 某地區因氣候乾燥，雷暴閃電誘發的火苗引發大規模森林野火，經濟損失慘重。
    此地是著名的葡萄酒鄉，葡萄酒產量占該國的90%，但森林野火波及並燒毀許多
    葡萄園和酒莊，嚴重影響當年葡萄酒市場。有學者認為，此極端氣候與該國過高
    的排碳量有關，主要來自石油的消耗。為避免災害再次發生，該國政府將於2035
    年禁止燃油車的使用並逐步改用綠能發電。此舉不利多數產業的發展，引發許多
    業者不滿。請問：
- id: soc111-g53
