  - 53
  - 54
  intro: 閱讀下文，回答53-54題。
  image: img/social/111-g53.webp
  passage: |-
    53-54 為題組
    ◎ 大量使用塑膠吸管所造成的健康與海洋生態破壞問題讓人擔憂。假定某國的民意
    強烈要求政府應立刻大幅度限制塑膠吸管的使用，且依據現行法律，主管機關已
    有充分法律授權可發布命令、訂定實施細則與開始日期，以管制塑膠吸管使用；
    但該機關卻認為茲事體大，仍依循該國法律對制訂行政命令的過程，預先將草案
    公告周知，並依法舉辦聽證，廣納各界意見，再審慎決定規定內容。請問：
- id: soc111-g55
  range:
  - 55
  - 56
  intro: 閱讀下文，回答55-56題。
  image: img/social/111-g55.webp
  passage: |-
    55-56 為題組
    ◎ 西晉末年，北方戰亂，長安、洛陽二京傾覆，山西、河北淪陷。面對時局的變動，
    人民有不同的作法。學者指出，中原士庶避難者約有兩途，或入遼東，或徙江左。
    入遼者，接受慕容氏招撫；過江和遷於淮漢流域者，為數尤多，遂創二百七十年
    偏安之局。其不克遷徙者，則鳩合宗黨，保聚險固，自治自衛，以圖苟免於胡人
    或寇賊之難。還有一種流人，其背棄鄉貫，轉徙他方，與前者相似；而憑堅乘險，
    保守塢聚，又與後者彷彿。請問：
- id: soc111-g57
  range:
  - 57
  - 58
  intro: 閱讀下文，回答57-58題。
  image: img/social/111-g57.webp
  passage: |-
    57-58 為題組
    ◎ 經調查，臺灣在COVID-19 疫情三級警戒時期，約40%的企業因異地生產導致產
    能調配不易；約20%的企業，其產品物流配送受阻；約20%的企業，營運不受疫
    情影響；另有20%的企業，反受疫情刺激需求而增加訂單。其中工廠據點較分散，
    在海外疫情熱區設有生產據點的企業，其產能調配受影響最明顯；如一些機械與
    電機、電子零組件及光電、車輛與金屬產業等，其零組件配送受阻比例較高，研
    判應是海運作業耽誤所致。為了因應疫情的衝擊，許多企業優先選擇的經營策略
    是：以資訊科技提供遠端客服或維運，並精簡行銷、研發等以降低營運成本。請
    問：
- id: soc111-g59
  range:
  - 59
  - 60
  intro: 閱讀下文，回答59-60題。
  image: img/social/111-g59.webp
  passage: |-
    59-60 為題組
    ◎ 美國與墨西哥的經貿關係向來密切，在兩
    國邊界形成的都會區域（圖11），早已發
    展出產業分工關係。然而，美國在川普總
    統主政時，以防止非法移民不斷湧入、保
    障本國勞工就業機會以及強化國土邊境
    安全為由，曾在政府預算中編列經費，擴
    大築牆；但當時國會認為，此舉既浪費納
    稅人的錢，又製造與鄰國的緊張關係。因
    築牆爭議無法達成共識，曾一度導致聯邦
    政府預算無法通過，使得某些政府部門暫
    時停止運作。請問：



    聖地牙哥
    提華納
