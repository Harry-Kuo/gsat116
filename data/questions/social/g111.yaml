    38-41 為題組
    ◎ 臺灣曾於民國38 年5 月實施戒嚴。當時由警備總部
    公告的《戒嚴令》第二條規定：「自同日起，除基隆、
    高雄、馬公三港口在本部監護之下，仍予開放，並規
    定省內海上交通航線（辦法另行公布）外，其餘各港，
    一律封鎖，嚴禁出入。」第四條也列舉處以死刑的各
    項「擾亂治安」行為，包括：造謠惑眾、聚眾暴動、
    擾亂金融、搶奪財物、鼓動學潮、破壞交通通信、妨
    害公眾用水及電氣煤氣事業、持有槍彈或爆裂物等。
    該次戒嚴歷經38 年，直至民國76 年始依總統令解除
    （圖10）。請問：
