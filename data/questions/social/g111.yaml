    ◎ 同學在進行歷史專題報告時，蒐集到一份1830 年代北臺灣的史料，指出：「淡
    （水）廳貨之大者，莫如油、米，次（其次）麻、豆，次（其次）糖、菁（染料），
    至茄藤、通草之屬，多出於內山，樟腦、茶葉惟淡北內港始有之。商人雇船裝載，
    擇內地可售之處，本省則運至漳、泉、福州，往北則運至寧波、上海，往南則運
    至澳門等處。凡港路可通者，無不爭相貿易，取其所售之值，購買飲食、衣服及
    日用必需要物等件，隨船載回發賣。」依據前述記載，請問：
