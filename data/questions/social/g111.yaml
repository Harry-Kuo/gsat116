  intro: 閱讀下文，回答44-46題。
  image: img/social/111-g44.webp
  passage: |-
    44-46 為題組
    ◎ 一位出生於阿富汗的思想家，據聞是穆罕默德的後裔，在十九世紀後期見到當時
    伊斯蘭世界受到西方列強勢力入侵，伊斯蘭族群四分五裂，且當時最大的伊斯蘭
    帝國—鄂圖曼帝國也無法善盡保護伊斯蘭世界之責。為了讓伊斯蘭世界團結共
    同抵禦列強，他走訪中東、北非、歐洲各地，倡議「泛伊斯蘭主義」，嘗試建立
    跨宗派、地域、民族的單一伊斯蘭國度。「泛伊斯蘭主義」不是與西方對抗的軍
    事行動策略，也非教條儀式與民族主義，而是強調以伊斯蘭的基本信仰為普遍生
    活倫理規範，以此團結伊斯蘭世界並促進其政治現代化。請問：
- id: soc111-g47
  range:
  - 47
  - 48
  intro: 閱讀下文，回答47-48題。
  image: img/social/111-g47.webp
  passage: |-
    47-48 為題組
    ◎ 公民課自主學習時研讀到下列資料：一般人使用網路後通常會留下數位紀錄，稱
    為網路「足跡」。某大型網路平台商除經營社交媒體，也跨足各種服務。該平台
    商自稱擁有用戶的基本資料，當串連到用戶瀏覽紀錄、搜尋關鍵詞、消費行為、
    社群媒體活動等足跡，就可預知使用者的價值偏好與習慣，進而能幫其客戶向使
    用者投放準確的廣告或政治宣傳，獲利豐厚。某資訊人權監督團體提出警告：「該
    平台商的行為經常沒有使用者的充分授權，也未充分告知，但卻擁有左右使用者
    認知與行為的能力」。然而，大眾對此風險卻不一定能充分認識。曾有調查指出，
    相較於教育程度高者，教育程度較低者因接觸數位風險教育機會較少，故使用網
    路服務時更缺乏警覺，也更容易受網路資訊影響。請問：
