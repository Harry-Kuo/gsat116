    做為實證科學之一，天文學的發展仰賴大量的觀測結果。近百年以來，天文
    觀測的手段也早就由可見光延伸到電磁波的其他波段，甚至是電磁波以外的觀測
    手段。這些突破性的觀測成果，更讓科學家們發現宇宙當中前人所未知的領域。
