    4. 孟德爾進行一系列的豌豆雜交實驗，並將實驗數據分析後，整理出分離律與獨立
    分配律二個遺傳法則。經過後續科學家的努力後，才逐漸確立這些法則對應的分
    子生物學基礎。獨立分配律指不同對的遺傳因子分離後，自由分配到子代。實質
    上，遺傳因子究竟是指什麼，則到二十世紀初才被確認。有關遺傳因子的分子組
