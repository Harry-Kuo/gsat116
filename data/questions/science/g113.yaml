    媽媽去購物商場買烤全雞，聽老闆說這些雞只需要約40天就達到上市的尺寸。
    近數十年，高產肉雞育種選拔計畫有著重要的突破，在持續的選拔下，以56日齡
    雞隻為例，可從1957年的905克/隻提升到2005年時的4202克/隻（如圖14所示）。
    此外，為降低飼養成本，育種過程也會參考肉雞的飼料轉化率，即肉雞每單位肉
    重所需的飼料重量（如圖15）。











