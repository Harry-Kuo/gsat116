    電冰箱的操作原理是利用低溫的冷媒來冷卻冰箱裡的食物，再用壓縮機壓縮
    吸收熱能後的冷媒，提高其溫度，以利於其後之散熱過程。冷媒經散熱片把熱能
    釋放到周遭空氣中後，經過降溫、降壓又可以用來冷卻冰箱裡的食物，如此構成
    冷卻的循環，而循環過程會消耗電能。
