    T 所示。海階常有海蝕凹壁。小莉推論海蝕凹
    壁為當地堅硬的火成岩壁受潮水長期侵蝕而成。海蝕凹壁上常有大量的穿孔貝附著在
    凹壁上。穿孔貝僅在潮起潮落之間的高度存活，無法長期離開水面。因此，小莉推論此
    海階上的海蝕凹壁主要由大地震所造成的垂直抬升而成。小莉詳細丈量每個海階和海
    蝕凹壁的高程，並利用凹壁上穿孔貝的碳進行碳-14定年分析。所得的結果如表3所示。


