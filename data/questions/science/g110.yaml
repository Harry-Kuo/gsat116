    各量之時間變化率之間的關係；一般將
    /
    U
    t
    
    當作此人在上述時間內的代謝率。
    人在靜止休息時維持基本機能（含體溫）所需的最低代謝率，稱為基礎代謝率。
    平均說來，每公斤人體質量的基礎代謝率約為1.0瓦特。
    維持人體新陳代謝所需的能量，是食物被消化後與氧作用所產生的。以碳水化合
    物（如葡萄糖）為例，將它轉換為人體所需能量的一系列過程，總結起來可簡單
