    37-40 為題組
    為了維持生命與從事各種工作，人體需要攝取食物與由大氣中獲得氧氣，來提供
    能量並調節排除熱量的速率，以維持正常體溫。因此，人體可視為一個與周圍環
    境交互作用的系統，透過新陳代謝，將能量（以下稱之為內能）儲存與轉換，並
    與環境進行功與熱的交換。假設在時間
    t
    內，某人從事騎車、搬運物品等活動，
    所做的功為
    W
    
    ，而由身體離開的淨熱量為
    Q
    
    ，則根據能量守恆定律，其身體的
    內能變化量
    U
    
    將遵守以下關係式：
    U
    Q
    W
    
    
    
    。上式除以
    t
