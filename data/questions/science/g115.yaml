    太陽系的小天體是由太陽星雲中的塵埃累積而成，掉落到地球上的隕石大部分
    是這些小天體的碎片，但偶爾也會有一些來自太陽系外的物質。科學家透過隕石來
    瞭解太陽系的形成時間，若想要知道隕石的年齡，可藉由放射性同位素定年法得知。
