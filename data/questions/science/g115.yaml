    7-8 題為題組
    各國建置地震或海嘯的預警系統，希望能夠減少地震與海嘯所造成的災害。
    然而西元2011 年3 月11 日在日本東北地區外海發生大地震（簡稱311 大地震）
    並引發海嘯，還是造成日本東北沿岸地區重大的傷亡與財物損失。
