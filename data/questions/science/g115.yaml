    44-46 題為題組
    在2023 年，諾貝爾化學獎頒給從事奈米級量子點研究的三位學者。量子點是直徑
    介於1 至10 奈米的奈米粒子，由於其微小尺寸，可表現出獨特的性質。量子點的合成，
    可藉由添加不同界面活性劑等方法，來控制其大小及成分。硫化鋅量子點的合成
    實驗步驟如下：
    步驟1.配製甲與乙兩溶液，其組成如下：
    甲：0.25 M 半胱胺酸（胺基酸的一種）＋
    4
    0.125 M ZnSO
    乙：
    2
    0.125 M Na S
    步驟2.將甲和乙溶液混合後，於47 ℃反應60 分鐘，然後使用1 M 醋酸鈉溶液，
    調整pH 值至6。
    步驟3.將冰冷乙醇逐滴加入，直至生成含有ZnS 的白色沉澱物（稱為乙醇沉澱）。
    步驟4.經過10 分鐘的離心後，取出沉澱物重新懸浮於水溶液中。
    步驟5.為去除大部分未反應的成分，需要進行至少兩次以上3～4 步驟。
