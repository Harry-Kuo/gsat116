  intro: 閱讀下文，回答37-39題。
  image: img/science/115-g37.webp
  passage: |-
    37-39 題為題組
    巴西龜（

    Trachemys scripta ）的性別是由受精卵孵化時的環境溫度所決定。將卵
    置於26 ℃，性別決定基因Dmrt1 會表現出來，胚胎發育為雄性。將卵置於32 ℃，
    Dmrt1 基因不會表現，胚胎發育為雌性。
    進一步的研究發現，Kdm6b 基因會影響Dmrt1 基因的表現與否，即Kdm6b 蛋白質
    的量相對較高時，會促進Dmrt1 基因表現RNA，進而產生更多的Dmrt1 蛋白質。
    在26 ℃時，Kdm6b 蛋白質的表現量相對較高，於是活化Dmrt1 基因。在32 ℃時，
    Kdm6b 蛋白質的表現量相對低，使得Dmrt1 基因幾乎不表現。
