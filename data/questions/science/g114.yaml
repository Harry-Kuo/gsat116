    28-29 題為題組
    化合物甲與乙是啤酒苦味最主要的來源，其結構如圖6 所示。在異辛烷溶液
    中，這兩個分子都會吸收波長275 nm 的紫外光，且吸光度與濃度成正比。化合物
    甲與乙皆為弱酸，在水中可部分解離成H+ 與它們各自的酸根。










    「國際苦度單位」是啤酒釀製過程的一項重要指標，大部分啤酒的苦度介於
    10 到100 之間，其簡易測量方法如下：
    步驟一、取5.0 mL的啤酒樣品，加入12.5 mL的異辛烷和0.5 mL的酸
    步驟二、充分搖晃混合，待液體分層後，測量異辛烷層在275 nm的吸光度
    步驟三、此吸光度乘以50即為該啤酒樣品的「苦度」
    淑芬同學對某品牌的啤酒進行了四次的苦度測量，每次的實驗條件如表1 所示。
