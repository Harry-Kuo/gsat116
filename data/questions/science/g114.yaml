    50-54 題為題組
    奈米級的二氧化鈦（
    2
    TiO ）為一種光觸媒材料，當此光觸媒照光之後，可將
    周遭環境中的汙染物質分解，達到去汙與除臭的效果。而其原理主要是二氧化鈦
    光觸媒照光後，電子會從價帶躍遷到導電帶，使得二氧化鈦表面生成氫氧自由基
    （•OH）與超氧離子（
    2
    O −），此兩者的活性很大可以將有機物分解成二氧化碳
    和水，達到淨化效果。
    此外，二氧化鈦光觸媒亦可在光的照射下催化水裂解產生氫氣和氧氣，為
    綠色能源與永續發展的重要觸媒。由於二氧化鈦光觸媒的導電帶與價帶的能階差
    （亦稱為能隙）大約為3.20 eV，故所照的光源中光子能量必須高於此能量才能
    啟動催化反應，為了提升其催化活性與效率，許多研究利用不同的金屬摻雜來
    改善材料特性。
    某研究團隊發現於二氧化鈦奈米材料中摻雜少量的鋅離子（
    2
    Zn-TiO ）後，會
    改變能隙，並提升催化水裂解的效率。根據上述資訊及所學，回答下列問題。
