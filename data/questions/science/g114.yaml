    37-39 題為題組
    虱目魚原為海生魚類，但可被漁民養殖在鹹水池或淡水池裡，而且淡水養殖
    的生產效率高於鹹水養殖。虱目魚不耐低溫，發生寒害時，鹹水池的虱目魚死亡率
    遠低於淡水池的。學者研究發現，鹹水魚耐寒的特性可能與調鈣蛋白（Regucalcin,
    RGN）有關。
    RGN 能與鈣離子結合，藉著鈣離子所調控的基因表現網絡，影響生物體對
    低溫的調適能力。為此，研究者先檢測虱目魚不同器官的組織，測得RGN 基因所
    表現的mRNA 量（RGN mRNA）。此量值相對於管家基因（即經常性表現維持
    細胞存活之一般基因）的數值如圖8 甲所示。同時，也測得長期養殖在鹹水池和
    淡水池虱目魚的RGN mRNA 數量差異，如圖8 乙所示。
















