    10-11題為題組
    胡瓜嵌紋病毒（CMV）可使其宿主釋放特殊的氣味，吸引CMV的主要傳播媒介（蚜蟲）。
    CMV可感染多種作物，例如菸草。它是RNA病毒，會產生5種蛋白質，其中2b基因具有
    抑制植物抗病毒的能力，也能抑制宿主對抗蚜蟲。當具2b之CMV感染後，植物體上的
    蚜蟲會產生更多的後代，並有較高的存活率。
