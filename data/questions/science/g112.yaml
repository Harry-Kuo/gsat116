    自工業革命於1760年在英國開始後，人類對於化石燃料（煤和石油）的使用滿足了經濟
    發展和產業革命的需求，然而這些化石燃料的燃燒，也使空氣中的二氧化碳節節上升，
    如圖15(a)所示。除了二氧化碳之外，人類對化石燃料的運用也在環境中留下許多痕跡，
