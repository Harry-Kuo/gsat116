    孟德爾的分離律和獨立分配律為遺傳學立下基石，支撐了達爾文的天擇理論，解釋了族
    群的遺傳現象。摩根證實了基因位於染色體上，並加以定位。這三位學者成就了現代的
    演化理論的發展。
