  intro: 第11至15題為題組
  passage: |-
    In 1995, a group of business and academic leaders met at the home of Juanita Brown and David Isaacs in Mill Valley, California. None of them had any idea they were about to create a social innovation that <u> 11 </u> rapidly around the world.
    The group was supposed to have a large-circle discussion in their beautiful garden. Unfortunately, it started pouring. With their plan <u> 12 </u> by the rain, the two dozen participants squeezed into the living room. They broke into small, intimate table conversations, recording their insights on paper tablecloths. They periodically stopped their conversations to switch tables so the insights and ideas might <u> 13 </u> and deepen. As they moved from one table to another, they noticed new ideas emerging from the discussions. This in turn enriched subsequent rounds of conversation. Over the course of the morning, the innovative discussion process <u> 14 </u> a new form of collective effort that transformed the depth, scope, and quality of their discussion.
    The World Café was <u> 15 </u> created. Since that rainy morning in Mill Valley, the World Café approach has been applied to multi-group discussions and cooperative actions by businesses, industries, and educational institutions around the world.
- id: eng114-g16
