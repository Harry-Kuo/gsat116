  intro: 第21至30題為題組
  passage: |-
    The Notre-Dame de Paris is one of the most famous cathedrals in Europe. Located at the heart of Paris, this medieval cathedral is <u> 21 </u> for its intricate architecture, stunning stained glass windows, and, above all, its bells.
    Mounted in the two tall towers of the cathedral, Notre-Dame’s bells have been ringing for over 800 years. In fact, there is documented <u> 22 </u> to the ringing of bells even before the cathedral’s construction was completed, dating as far back as the 12<sup>th</sup> century. The 10 bells vary in size, each <u> 23 </u> a name. The largest one, named “Emmanuel,” weighs over 13 tons. It is the only one of the whole group that <u> 24 </u> the French Revolution, while the rest were melted down for weapons. The melted bells were recast in the late 19<sup>th</sup> century. But due to their poor acoustic quality, all of the bells were replaced in 2013—except for Emmanuel, which <u> 25 </u> its renowned, excellent sound. This particular bell, ringing in F sharp, is considered one of the most harmonically beautiful in Europe.
    Over centuries, the bells have become a <u> 26 </u> part of life in Paris, where they are known as “the cathedral’s voice.” They have been used to mark the hours of the day, to call the <u> 27 </u> to prayer, and to signal emergency situations such as fires and invasions. They have also rung in times of <u> 28 </u> and of mourning, announcing such events as royal weddings and coronations of kings, as well as funerals of heads of state.
    However, after the devastating fire that damaged the cathedral in 2019, the bells fell <u> 29 </u>. The building went through a complex and time-consuming process of <u> 30 </u>, and the famous monument was finally reopened on December 8, 2024. The sounds of Notre-Dame bells once again filled the air in Paris, and will be heard for generations to come.
- id: eng114-g31
  range:
  - 31
  - 34
  intro: 第31至34題為題組
  passage: |-
    A capsule hotel, also known as a pod hotel, is a unique type of basic, affordable accommodation. Originated in Japan, these hotels were initially meant for business professionals to stay close to populated business districts without spending a lot. <u> 31 </u>
    A typical room of a capsule hotel is roughly the length and width of a single bed, with sufficient height for a guest to crawl in and sit up on the bed. The walls of each capsule may be made of wood, metal or any rigid material, but are often fiberglass or plastic. <u> 32 </u> Each capsule is equipped with a comfortable mattress, a small light, and sometimes a television or other entertainment options. Such minimalist design is what makes these hotels both inexpensive and efficient, providing only the essential elements for a good night sleep.
    The first capsule hotel, the Capsule Inn Osaka, opened in 1979. Since then, capsule hotels have quickly spread to other cities and countries. Chains have emerged in Taiwan, Singapore, and even on resort islands like Bali. Pod hotels are also seen in Europe and North America, especially in big cities like New York, London, and Paris. <u> 33 </u> Instead of the traditional bare pod-sized style, new chains now feature interior design that appeals to digitally connected travelers from around the world. Guests may enjoy facilities such as free Wi-Fi, mobile charging, and even a soundless alarm system that raises the sleeping guests into a seated position while gradually brightening the lights.
    While offering budget-conscious travelers a unique option, capsule hotels may not be suitable for everyone. Some hotels may not provide air conditioning in the capsules, leading to poor air flow. <u> 34 </u> Also, you may have to share common facilities (such as bathrooms) with other guests. And, if you’re worried about feeling claustrophobic in small spaces, you’d better think twice before making a reservation.
- id: eng114-g35
  range:
  - 35
  - 38
  intro: 第35至38題為題組
  passage: |-
    While waiting to cross the street at busy intersections, have you ever wondered who invented the traffic light? Most people credit the first traffic light to Nottingham engineer John Peake Knight. A railway manager, Knight specialized in designing the signaling system for Britain’s growing railway network in the 1860s. He saw no reason why this could not be adapted for use on the busy London intersections. Thus, he proposed a signaling system based on the railway movable-arm signal: Arms extending horizontally commanded drivers to stop, whereas arms lowered to a 45-degree angle told drivers to move on, resembling a traffic director’s gestures. Red and green gas lamps were added to the signal for use at night. A police officer was stationed by the side to operate the system.
    Knight’s traffic signal was installed near London’s Westminster Bridge in December 1868, but the system was short-lived. A gas leak one month later caused an explosion in the lights, injuring the policeman operating it. Deemed a public hazard, the project was immediately dropped, and traffic lights were banned until their return in 1929 back to the British streets.
    In the early 1900s, versions of the British traffic lights appeared in big cities in America, where traffic was on a sharp rise. Systems using movable arms were popular in Chicago, while those using the red and green lights were adopted in San Francisco. Patents with innovations on Knight’s ideas were filed nationwide. A major breakthrough was the yellow light invented by a Detroit police officer William Potts. Installed in Detroit in 1920, Potts’ three-color system allowed for the added signal “proceed with caution” to be displayed.
    Now, with the emergence of self-driving cars, researchers have begun to suggest that traffic signals are no longer necessary. Intersections will operate in a way that cars automatically adjust their speed to cross through, while maintaining safe distances from other vehicles. In the near future, we may experience a brand new form of traffic management!
- id: eng114-g39
  range:
  - 39
  - 42
  intro: 第39至42題為題組
  passage: |-
    Typically featuring zombies and serial killers, horror movies are too frightening to be fun for some people. But many others enjoy a good fear spectacle, and line up to see the latest scary movie. Given the variations in preferences, new studies have started to untangle the benefits and risks of horror movies.
    One benefit of horror movies revolves around the concept of so-called “safe fear.” When watching a frightening film, people are in the comfort of their own home or theater seats rather than under the threat of any real danger. In a controlled environment, these films may actually reduce the negative impact on viewers and help them become tougher. Secondly, as people are drawn into the story, they tend to take the perspective of the characters and rehearse the plot unconsciously. Researchers believe that viewers are learning vicariously this way, picking up tips on how to handle threats in the real world. In addition, studies show that the thrill and excitement linked with scary films can be therapeutic: It allows viewers to release bottled-up emotions and experience a sense of relief after the movie is over. This probably explains why during the COVID-19 pandemic, horror and pandemic thrillers were the most-watched movies on digital movie apps.
    However, researchers also find that horror movies can have negative effects on some people. People who are more sensitive to anxiety can panic after viewing a thriller. For those with unpleasant experiences, trauma may be triggered by the themes and images in the movies, which could make their symptoms worse. Furthermore, watching horror movies can disturb sleep patterns, as the residual fear and anxiety they evoke may keep people awake all night, thus leading to fatigue and irritability the following day. Finally, specialists warn that frightening films can have a negative impact on children. Children under 14 who watch horror movies have a greater chance of developing anxiety later in adulthood. Worse yet, exposure to graphic violence and bloodshed can make them less sensitive to real-life violence and more accepting of aggression.
- id: eng114-g43
  range:
  - 43
  - 46
  intro: 第43至46題為題組
  passage: |-
    Russia is widely portrayed as the most alcohol-dependent country in the world. Critics of the country say that drinking is almost an inherent trait of the Russian people. However, there is more to the story.
    The consumption of alcoholic beverages was unusual in ancient Russia. Before the adoption of Christianity in Russia (10<sup>th</sup> century), there were no vineyards and therefore no wine. People only drank beverages with low alcohol content. Vodka, Russia’s national drink, was not a Russian invention. The liquid was originally a grape alcohol introduced from France in the late 14<sup>th</sup> century. The first Russian-made vodka appeared in the 15<sup>th</sup> century, and the drink remained relatively low in alcohol content until the mid-18<sup>th</sup> century.
    There is contradictory information about Russians’ inclination toward alcohol in the 15<sup>th</sup> and 16<sup>th</sup> centuries. Some documents noted that Russians “indulge in excessive drinking whenever the occasion arises,” while others claimed that Russians “rarely drink wine.” The heaviest drinkers in medieval Europe were actually Germans. There were many sayings about their desire for alcohol, such as “drunk as a German.”
    The Russian state played a significant role in the spread of alcohol consumption in the country. In the 19<sup>th</sup> century, the emperors began to establish a state monopoly, largely due to the rise of illegal production of low-quality vodka. Thus, only the government was permitted to produce the alcohol. This soon filled the state treasury with huge revenues, but it also encouraged vodka consumption. The situation worsened when the industrial production of vodka began in the country, causing its prices to drop sharply and making it available to even low-income citizens.
    Meanwhile, a powerful anti-alcohol movement started in the 19<sup>th</sup> century. Government policies were made and public organizations established to prevent the spread of alcoholism in the country. The movement continued over the years; however, the problem remains. Although Russia does not occupy first place when it comes to alcohol consumption per capita, it is still close to the top.
