  intro: 第16至20題為題組
  passage: |-
    If you have ever been sick to your stomach on a rocking boat or a bumpy car ride, you know the discomfort of motion sickness. It can <u> 16 </u> suddenly, progressing from a feeling of uneasiness to a cold sweat. Soon, it can lead to dizziness, nausea, and vomiting.
    Motion sickness occurs when the signals your brain receives from your eyes, ears, and body <u> 17 </u>. Your brain doesn’t know whether you are stationary or moving when these parts send conflicting information: One part of your balance-sensing system detects that your body is moving, but the other parts <u> 18 </u>. Your brain’s confused reaction makes you feel sick. You may experience the discomfort from the motion of cars, boats, or amusement park rides. You may also get sick from playing video games, or looking through a microscope.
    You can take some <u> 19 </u> to help avoid the discomfort. If you are traveling, reserve seats where motion is felt the least, such as the front row of a car or forward cars of a train. Looking out into the distance from the vehicle can help <u> 20 </u>. You can also take medicine before your ride to avoid or reduce nausea and vomiting.
- id: eng114-g21
