  intro: 第16至20題為題組
  passage: |-
    The modern worker rolls out of bed, groans, and turns off an alarm clock before reluctantly getting up for the day’s work. But how did people get to work on time before alarm clocks were widely used?
    During the second Industrial Age, people toiled at unusual hours in mines or factories and often had to get up for work early in the morning. They <u> 16 </u> alarm clocks because adjustable alarms had been invented by the mid-19<sup>th</sup> century. But the new device was still relatively expensive and unreliable. British workers thus relied on a human alarm clock known as a “knocker-up.” <u> 17 </u> sticks or pea shooters, the human alarms would tour the streets, tap on windows, or blast them with dried peas, trying to wake paying customers in time for work.
    Whether they wielded rods or pea shooters, knockers-up became <u> 18 </u> throughout the United Kingdom. Every morning, these people, often older in age, were seen in big streets and small alleys, waking up their customers professionally. They usually would not leave people’s houses until they were sure their customers were awake.
    While the practice continued in some parts of the country until the 1970s, it <u> 19 </u> as alarm clocks became more widespread and affordable. Today, beeping alarm clocks and smartphones that play morning music are surely simpler and more convenient. However, they cannot <u> 20 </u> the personal attention coming from the distinctive tap of a pea shooter.
- id: eng113-g21
  range:
  - 21
  - 30
  intro: 第21至30題為題組
  passage: |-
    On a hilltop overlooking the 2011-tsunami hit Otsuchi Town in northeastern Japan, there is a white phone booth standing all alone in the wind. The lonely “wind phone” serves to connect family members to their <u> 21 </u> loved ones who died in the tsunami that claimed 18,000 lives. People come to speak to those they have lost, to say the words they never got to say on that <u> 22 </u> day.
    The idea for the wind phone was first <u> 23 </u> by a Japanese garden designer named Itaru Sasaki, who was grieving over the death of his cousin in 2010, before the tsunami. Feeling that he needed a private space to help him navigate through the <u> 24 </u>, Sasaki positioned a booth where he could “speak” to the dead relative. The booth he built <u> 25 </u> only an old dial phone with a disconnected phone line. When he stepped into the booth, he could pick up the phone to call his cousin, telling him how he was, and how he missed him. Sasaki stated in an interview: “Because my thoughts couldn’t be <u> 26 </u> through a regular phone line, I wanted them to be carried on the wind.” Hence, the wind phone allows Sasaki to create a one-way conversation with deep, soulful personal meaning, and renders the grieving process more <u> 27 </u> for him.
    Sasaki opened his wind phone to the public in 2011, after the devastating tsunami. News about the phone gradually spread, and the booth has become a <u> 28 </u> between the living and the dead. Phones resembling the wind phone have since been built around the world. Some were even set up to allow people to call their loved ones lost in the COVID-19 pandemic.
    Grieving is a natural <u> 29 </u> for coping with loss of a loved one, and people grieve in various ways. For those who speak into the wind phone, <u> 30 </u> is always there: They believe that their messages will—through some unknown way—reach the deceased.
- id: eng113-g31
  range:
