  - 30
  intro: 第21至30題為題組
  passage: |-
    Water makes up more than half of our body weight. To sustain this amount of fluid in our bodies, plain water is considered our best choice, for it contains no sugar and no calories. Yet, is water always the healthiest drink we can <u> 21 </u>? Well, it depends on who and where we are, and what we’re doing.
    Obviously, a physically <u> 22 </u> person with an outdoor job under the sun will need to drink more fluid than a desk-bound person who lives and works in an air-conditioned place. But there’s more to it than that. When a person sweats, he loses water and salt, so he needs to replace both. Replacing lost fluid with just plain water means the body has too much water and not enough salt. To <u> 23 </u> things out, the body will get rid of water by producing urine. For this reason, milk can actually be more <u> 24 </u> than drinking water. Milk naturally contains salt and lactose, a sugar which the human body needs in small amounts to help stimulate water <u> 25 </u>. Coconut water, which contains salt and carbohydrates, is also more functional than water at restoring and maintaining a normal fluid <u> 26 </u> after exercise.
    For the average person, however, water remains a very good <u> 27 </u> for keeping hydrated—if you know how to drink it. The secret is: Never wait until the body is telling you you’re thirsty, since there must already have been significant changes in your body for it to eventually <u> 28 </u> your consciousness. At that point, it might be well past the best moment to take in fluid. Also, drinking a lot of liquid in one go can cause more water to <u> 29 </u> the body quickly and come out as urine. To <u> 30 </u> this, you need to drink water throughout the day to maintain your hydration levels.
- id: eng112-g31
  range:
