  intro: 第31至40題為題組
  passage: |-
    If you cannot find ways to fit exercise into your busy daily schedule, don’t worry! Exercise doesn’t always have to be laborious. Research shows that <u> 31 </u> amounts of exercise—even just 15 minutes a day—helps ease depression, enhance self-image, relieve stress, and much more. That’s right. Doing exercise makes you happy, and you don’t have to be a fitness <u> 32 </u> to do it. What you need to do is to make “start slow and have fun” a motto to <u> 33 </u>. Then you’ll be well on your way to using physical activity as a tool to make you feel better every day.
    The “no pain, no gain” view of exercise is now considered old-fashioned. In fact, <u> 34 </u> health studies prove that exercise doesn’t have to hurt to be effective. You might <u> 35 </u> that if working out doesn’t give you pain, it isn’t working. According to fitness trainers, physically <u> 36 </u> exercises may make you breathe heavily and your muscles may ache temporarily, but exercise should not be painful. In fact, if it is, it may <u> 37 </u> an injury or muscle strain. Many great forms of exercise—like walking, swimming, or gentle stretching—get results without the <u> 38 </u> or discomfort some people associate with exercise.
    For the sake of your health, it is time to make regular exercise a part of your life. Keep in mind that even short periods of low-impact exercise serve as a powerful <u> 39 </u> to improve your health. So, no matter how busy you are, try to <u> 40 </u> for exercise every day, like a 15-minute walk with your dog. Your body will thank you in many ways.
- id: eng110-g41
  range:
