  stem: "請依據甲文，回答下列問題：\n（1）\t琦君的〈髻〉是一篇回憶散文，由下框所示全篇的首段來看，該文屬於哪一種「文學作品常見的回憶方式」？（占2分，作答字數：10字以內。）\n【框】母親年輕的時候，一把青絲梳一條又粗又長的辮子，白天盤成了一個螺絲似的尖髻兒，高高地翹起在後腦，晚上就放下來掛在背後。我睡覺時挨著母親的肩膀，手指頭繞著她的長髮梢玩兒，雙妹牌生髮油的香氣混和著油垢味直薰我的鼻子。有點兒難聞，卻有一份母親陪伴著我的安全感，我就呼呼地睡著了。\n（2）\t回憶時，通常會因同時意識到昔日時光的哪些情況，從而引發了怎樣的感受？（占4分，作答字數：30字以內。）\n【框】乙\n長期記憶分布在腦內各處，不像短期記憶一樣分布在某個專屬區域。因此，人不會突如其來地完全忘記某件事，而是在時光流逝中，對那件事的記憶逐漸喪失精準，逐漸失去細節。這個過程和照片褪色沒有太大不同：我們慢慢地、不知不覺地遺忘。\n【框】短期記憶：腦中一種低容量記憶類型，可將自外界接收的資訊，於短時間（5～20秒）內保持使用狀態。<br>長期記憶：儲存在腦中且可長時間保存的記憶，記憶容量較大。\n重啟感情記憶的開關，就在於各種感官體驗，尤其是難以關閉、無法拒絕的嗅覺。一般來說，人體接收感官訊息時，會經過大腦的視丘，再由視丘將訊息傳遞給大腦其他部位。而產生嗅覺的氣味因子則會繞過視丘直達杏仁核（負責處理情緒）與海馬迴（負責處理記憶），因此嗅覺與情感、記憶的連結，比其他感官更直接。所見所聽的可能旋即消失在短期記憶中，但嗅覺幾乎沒有短期記憶。大腦把這些氣味和情感融合在一起，從而在遙遠的未來，藉由氣味喚起深藏的記憶，掀起濃重的懷舊思緒。\n（改寫自戴安・艾克曼《氣味、記憶與愛欲》）"
