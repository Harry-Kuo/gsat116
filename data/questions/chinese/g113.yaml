    周處生時或死後沒有多久，便有關於他的軼聞流傳。<u> 甲 </u>如孔約《志怪》云：「義興有邪足虎，溪渚長橋有蒼蛟，並大啖人，並郭西周，時謂郡中三害。周即處也。」又如祖台之《志怪》所述：「義興郡溪渚長橋下有蒼蛟吞啖人，周處執劍橋側伺。久之，遇出，於是懸自橋上投下蛟背而刺蛟，數創，流血滿溪，自郡渚至太湖句浦乃死。」<u> 乙 </u>兩書均成於東晉時期，時間相近。同一件事，何以在記述上各有其偏重之處？<u> 丙 </u>《世說新語》則結合「三害」與「斬蛟」，並增加「殺虎」情節，使傳說更為完整：
    周處年少時，兇彊俠氣，為鄉里所患。又義興水中有蛟，山中有白額虎，並皆暴犯百姓。義興人謂為「三橫」，而處尤劇。或說處殺虎斬蛟，實冀三橫唯餘其一。處即刺殺虎，又入水擊蛟。蛟或浮或沒，行數十里，處與之俱。經三日三夜，鄉里皆謂已死，更相慶。竟殺蛟而出，聞里人相慶，始知為人情所患，有自改意……處遂改勵，終為忠臣孝子。
    <u> 丁 </u>固定了「義興三害→周處射虎斬蛟→周處幡然悔悟、改過自新」的情節單元，成為後世「周處除三害」傳說的「基型」。（改寫自羅景文〈周處傳說探究〉）
- id: chn113-g16
