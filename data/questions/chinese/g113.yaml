  intro: 閱讀下文，回答30-31題。
  passage: |-
    【框】甲
    鄭成功起兵荼毒濱海，民間患之。有問善知識云：「此何孽肆毒若是？」答曰：「乃東海大鯨也。」問何時而滅？曰：「歸東即逝。」凡成功所犯之處，如南京、溫、台並及臺灣，舟至海水為之暴漲。順治辛丑攻臺灣，紅毛先望見一人冠帶騎鯨，從鹿耳而入，隨後成功將舟由是港進。癸卯成功未疾時，轄下夢見前導稱成功至，視之，乃鯨首冠帶乘馬，由鯤身東入於外海。未幾，成功病卒，正符「歸東即逝」之語。（《重修福建臺灣府志・叢談》）
    【框】善知識：指高僧大德。
    【框】乙
    鄭成功，倭產也。誕降之前一日，天晴霽無片雲。薄暮，忽有雷破土窟而出，煙霾漲天，人對面不可辨。少頃，狂風疾雨，拔古木且盡，屋瓦皆飛，平地水深數尺。正錯愕間，空中有聲，如天崩地裂，繞郭顛簸不止。眾相驚以地震，曰：「弗去懼壓。」則皆走，亟覓山村避之。天明，諜者言島中有鯨鯢長數十丈，夭矯起波間。金光閃爍，噓氣如雷鳴，風濤暴漲，隱隱有金戈鐵馬之聲不絕。舟航糜碎，溺入海盡死，竟夜哭聲震天。雞鳴，風始定，魚亦不見。相譁以為妖怪云。是夕，成功生，人奇之。
    自成功生後，倭視翁氏禮加謹。及長，據金廈，兵敗勢蹙，將以海外為逋逃藪，乃決計東行。時臺地屬荷蘭左賢王，忽夜夢一偉人盛服騎鯨魚入鹿耳門，侍衛甲兵甚眾，道無阻者。及寤，異之。未幾，報鄭兵至矣。（《臺灣紀事‧鄭事紀略》）
    【框】翁氏：鄭成功的母親。
- id: chn113-g32
