    <table><tr><td>《論語》原文</td><td>朱熹的解說</td></tr><tr><td>子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命，而不畏也，狎大人，侮聖人之言。」</td><td>「大人」不止有位者，是指有位、有齒、有德者。<br>「畏天命」三字好。是理會得道理，便謹去做，不敢違，便是畏之也。如非禮勿視聽言動，與夫戒慎恐懼，皆所以畏天命也。<br>要緊全在知上。纔知得（天命），便自不容不畏。</td></tr></table>
    【框】乙
    <table><tr><td>《孟子》原文</td><td>朱熹的解說</td></tr><tr><td>說大人，則藐之，勿視其巍巍然。堂高數仞，榱題數尺，我得志，弗為也；食前方丈，侍妾數百人，我得志，弗為也；……在彼者，皆我所不為也；在我者，皆古之制也。吾何畏彼哉！</td><td>這為世上有人把大人許多崇高富貴當事，有言不敢出口，故孟子云爾。<br>《論語》說「畏大人」，此卻說「藐大人」。大人固當畏，而所謂「藐」者，乃不是藐他，只是藐他許多「堂高數仞，榱題數尺」之類。</td></tr></table>
