  intro: 閱讀下文，回答31-32題。
  passage: 讀書以過目成誦為能，最是不濟事。眼中了了，心下匆匆，方寸無多，往來應接不暇，如看場中美色，一眼即過，與我何與也。千古過目成誦，孰有如孔子者乎？讀《易》至韋編三絕，不知翻閱過幾千百遍來，微言精義，愈探愈出，愈研愈入，愈往而不知其所窮。雖生知安行之聖，不廢困勉下學之功也。東坡讀書不用兩遍，然其在翰林讀〈阿房宮賦〉至四鼓，老吏苦之，坡洒然不倦，豈以一過即記，遂了其事乎！惟虞世南、張睢陽、張方平，平生書不再讀，迄無佳文。且過輒成誦，又有無所不誦之陋。即如《史記》百三十篇中，以〈項羽本紀〉為最，而〈項羽本紀〉中，又以鉅鹿之戰、鴻門之宴、垓下之會為最。反覆誦觀，可欣可泣，在此數段耳。若一部《史記》，篇篇都讀，字字都記，豈非沒分曉的鈍漢！（鄭燮〈濰縣署中寄舍弟墨第一書〉）
