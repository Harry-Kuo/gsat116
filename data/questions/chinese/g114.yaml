    【框】甲
    《小兒藥證直訣》匯集北宋兒科大家錢乙的醫療觀點與方法，是世界現存最早的兒科專著。錢乙注重五臟、五行間的生剋關係，並提出相應的治法和方劑，而小兒臟腑柔弱，故主張用藥應避免強攻。
    書中保存了二十多個醫療案例與一百多種方劑。這些方劑或以五臟與五色的對應關係命名，如導赤散、益黃散、瀉白散、瀉青丸；或以方中主要藥材阿膠命名，如阿膠散。
