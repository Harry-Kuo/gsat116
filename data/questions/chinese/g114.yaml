    【框】甲
    晚明文人嗜遊山水，旅遊對他們而言，是一項綜合性的審美活動，標誌著生活的雅化。文人遊賞之後，會將所見所聞、所思所感以詩文記錄下來。由於當時刻書作坊眾多，文人雅士書寫的遊記，可整理出版，向公眾發行。撰寫遊記，便成為士人重要的文化資本，用以塑造品味，並以此區別普通遊客。
    從晚明文人的論述與當時出現的大量西湖旅遊書籍可知，西湖已成為文人旅遊的重要目的地。文人在記遊詩文中，以自身的審美情趣，對西湖風景資源進行梳理、總結，發展了與大眾不同的遊觀。作品發行後，對閱讀者多會產生行為與審美的指引，從而不斷塑造並加強西湖景物的內涵。
    【框】乙
    西湖最盛，為春為月。一日之盛，為朝煙，為夕嵐。……然杭人遊湖，止午、未、申三時。其實湖光染翠之工，山嵐設色之妙，皆在朝日始出，夕舂未下，始極其濃媚。月景尤不可言，花態柳情，山容水意，別是一種趣味。此樂留與山僧遊客受用，安可為俗士道哉！（袁宏道〈晚遊六橋待月記〉）
    【框】丙
    西湖之妙，山光水影，明媚相涵。圖畫天開，鏡花自照，四時皆宜也。然湧金門苦於官皂，錢塘門苦僧、苦客，清波門苦鬼。勝在岳墳，最勝在孤山與斷橋。吾極不樂豪家徽賈，重樓架舫，優喧粉笑，勢利傳杯，留門趨入。所喜者野航兩棹，坐恰兩三，隨處夷猶，侶同鷗鷺。或柳堤魚酒，或僧屋飯蔬，可信可宿。不過一二金而輕移曲探，可盡兩湖之致。（王思任〈遊杭州諸勝記〉）
    【框】官皂：州縣衙役。<br>岳墳：岳飛墓。<br>夷猶：從容自在。
- id: chn114-g32
  range:
  - 32
  - 36
  intro: 閱讀下文，回答32-36題。
  passage: <table><tr><td>［圖］</td><td>張氏以髮長委地，立梳床前。靖方刷馬，忽有一人，中形，赤髯而虯，乘蹇驢而來，投革囊於爐前，取枕攲臥，看張氏梳頭。靖怒甚，未決，猶刷馬。張氏熟視其面，一手握髮，一手映身搖示靖，令勿怒。急急梳頭畢，斂衽前問其姓。臥客答曰：「姓張。」對曰：「妾亦姓張，合是妹。」遽拜之。……張氏遙呼曰：「李郎且來拜三兄！」靖驟拜之，遂環坐。曰：「煮者何肉？」曰：「羊肉，計已熟矣。」客曰：「飢甚！」靖出市胡餅。客抽腰間匕首，切肉共食。……客曰：「觀李郎之行，貧士也，何以致斯異人？」曰：「靖雖貧，亦有心者焉。他人見問，固不言，兄之問，則無隱耳。」具言其由。曰：「然則將何之？」曰：「將避地太原。」客曰：「然，吾故謂非君所能致也。」曰：「有酒乎？」靖曰：「主人西則酒肆也。」靖取酒一斗，酒既巡，客曰：「吾有少下酒物，李郎能同之乎？」靖曰：「不敢。」於是開革囊，取一人頭並心肝，卻頭囊中，以匕首切心肝共食之。曰：「此人天下負心者，銜之十年，今始獲，吾憾釋矣。」又曰：「觀李郎儀形器宇，真丈夫也。」</td></tr><tr><td>［圖］</td><td>貼這段〈虯髯客傳〉，是打算討論明天的報告？</td></tr><tr><td>［圖］</td><td>有默契。我們現在完全沒主題、沒框架……</td></tr><tr><td>［圖］</td><td>那就拿「概念框架」當框架吧！</td></tr><tr><td>［圖］</td><td>什麼？不懂！</td></tr><tr><td>［圖］</td><td>凡是理解、思考，都需要概念框架。剛才你說「有默契」，就是明白對方有相同的理解框架；又說「不懂」，則是缺乏理解對方的框架。框架不同的人，很容易雞同鴨講。若不試著接近對方的框架，就無法消除隔閡。</td></tr><tr><td>［圖］</td><td>這麼說，《西遊記》的唐僧剛收孫悟空為徒時，曾因為孫悟空打死強盜大吵一架，就是沒有相同理解框架。孫悟空強調那是正當防衛，唐僧則認為打劫罪不致死，不該傷人性命。</td></tr><tr><td>［圖］</td><td>唐僧斥責孫悟空沒有慈悲好善之心，「去不得西天，做不得和尚」，也出自特定的身分框架。</td></tr><tr><td>［圖］</td><td>哈！你們不打遊戲去看《西遊記》？不過，身分確實是人際關係的常見框架。「你是哥哥，怎不讓弟弟？」就是在設定兄長本分框架。紅拂去找李靖並說「願託喬木」，則是引導對方走進終身伴侶的框架。</td></tr><tr><td>［圖］</td><td>孫悟空氣得丟下師父，本想回花果山，但東海龍王提醒他：若不保護唐僧，「到底是個妖仙，休想得成正果」。孫悟空想了想，選擇回唐僧身邊。</td></tr><tr><td>［圖］</td><td>當初他大鬧天宮，得到「弼馬溫」一職，又棄官自封「齊天大聖」，應該也是在找合適的身分框架。</td></tr><tr><td>［圖］</td><td>人們常說要跳脫框架，活出自我。但孫悟空若不走進「西天取經」的框架，就成不了「鬥戰聖佛」。人們即使能擺脫一個框架，也無法擺脫所有框架。甚至可以說，若沒活在某個框架裡，可能也不知道什麼是自我肯定的方式。</td></tr></table>
