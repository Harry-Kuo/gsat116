    【框】現在流行區分E人、I人。不只我們透過MBTI認識自己或他人的性格，動漫<br>遊戲和歷史人物也有MBTI，例如有人說李白是ENFP。
    【框】MBTI（邁爾斯‒布里格斯性格類型）<br>你的關注取向 | E | 樂於加入群體活動，大方分享看法，成為眾人的焦點。 | I | 喜歡獨處的自在，傾向保留內心的想法，少與陌生人談話。 | 你習慣的資訊 | S | 注重實用思維，偏好具體的指引與實踐的細節。 | N | 擅長抽象思考，用簡要的語言掌握概念與大方向。 | 你做決定的方式 | T | 在乎原則、公理、正義、倫常，對事不對人。 | F | 重視和諧、體諒，常把人們的情緒納入處事的考量。 | 你的生活態度 | J | 目標導向，希望一切在掌控中，按部就班照計畫實現。 | P | 保持開放的選擇，隨著現況調整，能接受意想不到的改變。
    【框】甲
    ［圖］
    【框】MBTI以四個向度勾勒人的性格，每個向度都有一組對立型態。如果只取這個框架簡單易記的優點，拿它來分析古人，是可以提高識別度。<br>古人也有類似的思維。例如司馬遷的父親曾說「儒家」是「博而寡要，勞而少功，是以其事難盡從。然其序君臣父子之禮，列夫婦長幼之別，不可易也。」而「道家」則是「與時遷移，應物變化，立俗施事，無所不宜，指約而易操，事少而功多。」他把這兩家當成性格互異者，若參照MBTI，他心目中的儒家性格是　　　成分較多，道家性格則　　　較明顯。
    【框】乙
    【框】但若從《論語》、《孟子》找句子，有符合S的<u>　①　</u>，也有符合N的<u>　②　</u>；有符合T的<u>　③　</u>，也有符合F的<u>　④　</u>。可見這種框架固然可提高識別度，但也可能遮蔽原本多元的面向。
    【框】丙
