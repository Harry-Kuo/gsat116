    乙、〈虬髯客傳〉中虬髯對李靖說：「某本欲於此世界求事，或當龍戰三二十載，建少功業。今既有主，住亦何為？太原李氏，真英主也。三五年內，即當太平。李郎以英特之才，輔清平之主，竭心盡善，必極人臣。」──虬髯是希望保有自己時間的狼，期許李靖成為優秀的哈士奇。
