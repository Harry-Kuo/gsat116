  intro: 閱讀下文，回答36-37題。
  passage: |-
    ［圖］能實現新奇構想的原創者，可能比想像中謹慎保守。要實現原創構想，通常意謂挑戰現狀，所以原創者更懂得透過溝通爭取認同。例如好萊塢編劇的劇本能否開拍，往往取決於能否說服高層主管。1990年代早期，一群迪士尼編劇希望片廠不要繼續改編「灰姑娘」、「白雪公主」等故事，而能接受嶄新的《獅子王》。他們最初是以「把鹿換成獅子的非洲版小鹿斑比」介紹給片廠主管，未脫動物對抗人類的基調。經過修改，才讓老獅王木法沙、小獅王辛巴、大反派叔父刀疤，接近莎士比亞《哈姆雷特》的主要角色─叔父殺死了身為國王的父親，兒子為父親復仇。同時，發覺來自莎劇「To be or not to be」的困惑，反映了人性現實，相信能獲得普遍回響。最終，片廠支持這個由獅子演出《哈姆雷特》的構想，創下動畫電影史上的票房紀錄。
    在這個案例中，新奇固然是原創性的關鍵，但也是一項挑戰。當編劇提出《獅子王》類似《哈姆雷特》時，這個熟悉感有助於高層主管把新奇的大草原腳本和經典故事連結起來。絕對的原創性有時並不讓人放心，畢竟高層主管需要參考座標，找到向觀眾行銷的著力點。（改寫自亞當‧格蘭特著，黃翫譯《作個原創者》）
