  stem: "甲、乙二文均認為古典具有永恆性。明代許潮《赤壁遊》雜劇，對蘇軾〈赤壁賦〉既有承繼又有創新，請依下列引文回答問題：\n【框】〔生〕今山水星月，相照若昔，而英雄何寥寥也！吾四人遊賞於此，幸各能詩。可將曹孟德、孫仲謀、劉玄德、周公瑾，寫作四鬮，各拈取一鬮，吟詩一首，以見弔古斷案。〔眾〕最好！最好！……〔生〕我等吟詠已完，可斟酒來。各照題目，嘆他一番。……（黃鶯兒）〔生〕躍馬意何長，視東吳已入囊，舳艫千里旌旗望。橫槊時氣揚，釃酒時態狂，誰知一火把神魂喪！〔合〕嘆興亡，江山如故，何處覓曹郎？…… （祝英台）〔生〕把古今愁，廊廟悶，聊付與滄浪。\n【框】生：劇中扮演蘇軾。\n【框】眾：指蘇軾外的黃庭堅、佛印、漁父。\n【框】黃鶯兒、祝英台：皆曲牌名。\n(1)\t舟中四人抽籤後，賦詩的規則為何？（占2分，作答字數：20字以內，<u>不可抄錄原文</u>。）\n(2)\t劇曲中，唱詞常表述人物的心聲。請問：①眾人〔合〕唱，除表達物是人非的喟嘆，更反映出世人對個體生命有什麼「共同的焦慮」？②許潮藉東坡之口道出：「聊付與滄浪」，對此一焦慮所持的態度是什麼？（①占2分，作答字數：10字以內；②占2分，作答字數：10字以內）\n【框】背面還有試題\n第二題（占8分）"
