    一、單選題（占3 0 分）
    說明：第1 題至第6 題，每題有5 個選項，其中只有一個是正確或最適當的選項，請畫
    記在答案卡之「選擇（填）題答案區」。各題答對者，得5 分；答錯、未作答或畫
    記多於一個選項者，該題以零分計算。

    1. 學校規定上學期成績需同時滿足以下兩項要求，才有資格參選模範生。
    一、國文成績或英文成績70 分(含)以上；
    二、數學成績及格。
    已知小文上學期國文65 分而且他不符合參選模範生資格。請問下列哪一個選
    項的推論是正確的？
    (1) 小文的英文成績未達70 分
    (2) 小文的數學成績不及格
    (3) 小文的英文成績70 分以上但數學成績不及格
    (4) 小文的英文成績未達70 分且數學成績不及格
    (5) 小文的英文成績未達70 分或數學成績不及格
