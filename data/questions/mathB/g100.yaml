    1.
    有一箱子，內有3 黑球與2 白球。有一遊戲，從箱子中任取出一球。假設每一顆球被
    取出的機率都相同，若取出黑球可得獎金50 元，而取出白球可得獎金100 元，則下
    列哪一個選項是此遊戲的獎金期望值？
    (1) 70 元
    (2) 75 元
    (3) 80 元
    (4) 85 元
    (5) 90 元
