    大圓為通過球心的平面與球面相交所形成的圓，且球面上相異兩點在大圓上
    所形成較小的弧為最短路徑。根據上述，試選出正確的選項。
    (1)「北極點到A 的最短路徑長」等於「北極點到B 的最短路徑長」
    (2)「A 到B 的最短路徑長」等於「C 到D 的最短路徑長」
    (3) A 到E 的最短路徑必經過C
    (4) C 到D 的最短路徑必經過北極點
    (5)「E 到北極點的最短路徑長」與「C 到D 的最短路徑長」的比為2：3
